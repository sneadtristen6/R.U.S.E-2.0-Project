# Runs the tests on every push and pull request, on Windows (players' PCs) and Linux (Steam Deck).
# The tests use small made-up files, so no game files are needed here.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # the shared private repo mirrors main and the tags: it doesn't build or test (its Actions minutes are limited)
    if: github.repository == 'sneadtristen6/Ruse-Mod-Platform'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Nothing private in the public repo (tools/check_public.py)
        if: github.repository == 'sneadtristen6/Ruse-Mod-Platform'
        run: python tools/check_public.py
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

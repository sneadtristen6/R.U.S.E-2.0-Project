# Publish one app's installer as a GitHub Release: the download players use (installers/README.md "Releases").
# Push a tag named <app>-v<version>, e.g. `git tag launcher-v0.1.0 && git push origin launcher-v0.1.0`.
# The version must equal the app's __version__. The setup .exe is attached as it is (no zip), at a stable URL that
# needs no GitHub login, so browsers can build a reputation for that one file.
name: release

on:
  push:
    tags: ["launcher-v*", "studio-v*"]

permissions:
  contents: write  # create the release

jobs:
  release:
    # the shared private repo mirrors main and the tags: it doesn't build or test (its Actions minutes are limited)
    if: github.repository == 'sneadtristen6/Ruse-Mod-Platform'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: installers/requirements.txt
      - name: Install the build tools
        run: |
          python -m pip install -r installers/requirements.txt
          choco install innosetup --no-progress -y
      - name: Keep Nuitka's compile cache between builds
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: nuitka-
      - name: Which app and version the tag names
        id: tag
        run: |
          $app, $version = "${{ github.ref_name }}" -split '-v', 2
          "app=$app" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build, check, make the installer, test-install it
        run: python installers/build_app.py ${{ steps.tag.outputs.app }} --test-install
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem "dist/*-Setup-${{ steps.tag.outputs.version }}.exe"
          if (-not $setup) { throw "no installer for version ${{ steps.tag.outputs.version }}: the tag must match the app's __version__" }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          $about = Get-Content -Raw ".github/release-notes/${{ steps.tag.outputs.app }}.md"
          $notes = @"
          $about
          Download **$($setup.Name)** below and run it. It installs for your Windows user, with no admin rights needed.

          Windows or your browser may warn about it: it's a new program they haven't seen many downloads of yet.
          To check that you have the real file, compare its SHA-256 with ``$hash``
          (PowerShell: ``Get-FileHash $($setup.Name)``).
          "@
          $pre = if ("${{ steps.tag.outputs.app }}" -eq "studio") { "--prerelease" } else { "--latest" }  # the Studio is a preview
          gh release create "${{ github.ref_name }}" $setup.FullName --title (($setup.BaseName -replace '-Setup-', ' ') -replace '-', ' ') --notes $notes $pre

# Builds the two apps into Windows programs and their installers (PLAN.md ADR 9, installers/README.md):
# RUSE Launcher and RUSE Studio, one job each. Every push to main that changes them; or by hand ("Run workflow").
# The installers are under the run's "Artifacts". Each build checks the program it made, then installs it, checks the
# installed copy and uninstalls it again.
name: apps

on:
  push:
    branches: [main]
    paths: ["src/**", "installers/**", ".github/workflows/apps.yml"]
  workflow_dispatch:

jobs:
  build:
    # the shared private repo mirrors main and the tags: it doesn't build or test (its Actions minutes are limited).
    # The public repo by its number, which a rename keeps: a check by name skipped every run after the rename
    # to R.U.S.E-2.0-Project (tests/test_installers.py WorkflowGuards)
    if: github.repository_id == '1393317090'
    strategy:
      fail-fast: false
      matrix:
        app: [launcher, studio]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: installers/requirements.txt
      - name: Install the build tools
        run: |
          python -m pip install -r installers/requirements.txt
          choco install innosetup --no-progress -y
      - name: Keep Nuitka's compile cache between builds
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ matrix.app }}-${{ hashFiles('installers/requirements.txt') }}-${{ github.sha }}
          restore-keys: nuitka-${{ matrix.app }}-${{ hashFiles('installers/requirements.txt') }}-
      - name: Build, check, make the installer, test-install it
        run: python installers/build_app.py ${{ matrix.app }} --test-install
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-installer
          path: dist/*.exe
          if-no-files-found: error
      - name: Keep the build report if something went wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-build-report
          path: build/${{ matrix.app }}/report.xml
          if-no-files-found: ignore

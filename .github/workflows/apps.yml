# Builds the two apps into Windows programs and their installers (installers/README.md):
# RUSE Launcher and RUSE Studio, one job each. Every push to main that changes them; or by hand ("Run workflow").
# The installers are under the run's "Artifacts". Each build checks the program it made, then installs it, checks the
# installed copy and uninstalls it again.
name: apps

on:
  push:
    branches: [main]
    paths: ["src/**", "installers/**", ".github/workflows/apps.yml"]
  workflow_dispatch:

jobs:
  build:
    # the shared private repo mirrors main and the tags: it doesn't build or test (its Actions minutes are limited).
    # The public repo by its number, which a rename keeps: a check by name skipped every run after the rename
    # to R.U.S.E-2.0-Project (tests/test_installers.py WorkflowGuards)
    if: github.repository_id == '1393317090'
    strategy:
      fail-fast: false
      matrix:
        app: [launcher, studio]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: installers/requirements.txt
      - name: Install the build tools
        run: |
          python -m pip install -r installers/requirements.txt
          choco install innosetup --no-progress -y
      # The Studio carries the game's own Python 2.5.1 (installers/build_app.py python251): python.org's installer,
      # used only when it's the very file python.org gave out (its SHA-256 below; python.org lists its MD5,
      # a1d1a9c07bc4c78bd8fa05dd3efec87f, and its size, 10,970,624 bytes), unpacked, never installed
      - name: Get the game's Python 2.5.1 (the Studio saves mission scripts with it)
        if: matrix.app == 'studio'
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP "python-2.5.1.msi"
          Invoke-WebRequest "https://www.python.org/ftp/python/2.5.1/python-2.5.1.msi" -OutFile $msi
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($hash -ne "02CDB49AAE617B87EBE17F7C56D7644A132EA1EA6F190474D5FC5E99947713C5") {
            throw "python-2.5.1.msi isn't the file python.org gave out (its SHA-256 is $hash)"
          }
          $dir = Join-Path $env:RUNNER_TEMP "python251"
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$dir`""
          if ($p.ExitCode -ne 0) { throw "python-2.5.1.msi didn't unpack (msiexec exit code $($p.ExitCode))" }
          "RUSE_PYTHON251=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Keep Nuitka's compile cache between builds
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ matrix.app }}-${{ hashFiles('installers/requirements.txt') }}-${{ github.sha }}
          restore-keys: nuitka-${{ matrix.app }}-${{ hashFiles('installers/requirements.txt') }}-
      - name: Build, check, make the installer, test-install it
        run: python installers/build_app.py ${{ matrix.app }} --test-install
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-installer
          path: dist/*.exe
          if-no-files-found: error
      - name: Keep the build report if something went wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-build-report
          path: build/${{ matrix.app }}/report.xml
          if-no-files-found: ignore

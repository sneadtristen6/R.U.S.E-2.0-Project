sure = "tried"
what = "Artillery (indirect fire)"
does = "The unit fires indirectly, at what other units spot, like the game's howitzers. Also tells the computer player to use it as artillery."
use = "Works on any unit: DomesticNukes gave it to 410 units of all kinds and they all fired indirectly."

[2]
group = "kind"
sure = "units"
what = "Aircraft"
does = "The unit is a plane: built at the airfield's control tower, flies home to refuel, takes no ground orders. Every one of the game's 63 planes has it, and nothing else does."
use = "Keep it on every plane. Never put it on a ground unit: the game would try to build it at an airfield's control tower."
danger = "breaks"
danger_why = "On a unit that isn't a plane, building it is expected to stop the game with a script error (it looks for an airfield's control tower)."


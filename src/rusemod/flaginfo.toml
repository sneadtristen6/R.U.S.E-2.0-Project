# What every unit flag (InitialFlagSet, 0-104) is, what it does in the game, and how to use it: the Studio's flag
# guide (rusemod.flaginfo; the owner, 2026-10-15: "each flag should tell you exactly what each flag is", "warn people
# if it's a known crash and ... not allow them to start the game if it's going to crash"). The short name in ten
# languages stays in labels.toml [flags]; this file holds the full explanation (English for now).
#
# group: kind (what the unit is), combat, movement, sight, player (selection and orders), preview (placement
#   previews), state (the game sets it on units while it runs), unused.
# sure: how we know what it does:
#   tried    = tried in the game (by the R.U.S.E 2.0 Project or the community: DomesticNukes, ProLution);
#   units    = from which of the game's own units carry it and what they have in common;
#   expected = what studying the game says it does; not tried in the game yet;
#   state    = the game sets and clears it while it runs; written in a unit's list it does nothing (90 and 91 tried);
#   unused   = nothing in the game uses it.
# danger: crash = seen crashing the game (the Studio stops the build); breaks = expected to break the unit (a warning).
# carriers: how many of the game's units have it (counted from the game's data, build 24670294).

[0]
group = "kind"
sure = "units"
what = "Airfield"
does = "Marks a building as an airfield: your planes are based here, and clicking your own airfield with a plane sends it home to land. The computer player's recon planning looks for one."
use = "Only for airfield buildings. On anything else it only makes the game treat it as a place planes can land."

[1]

[intro]
us = "For online play, RUSE Guard and content downloads, R.U.S.E. 2.0 confirms you own R.U.S.E. by signing in through Steam. You sign in on Steam's own page in your browser; we never see your password, and your Steam ID is never stored."
fr = "Pour le jeu en ligne, RUSE Guard et les téléchargements de contenu, R.U.S.E. 2.0 confirme que vous possédez R.U.S.E. par une connexion via Steam. Vous vous connectez sur la page de Steam dans votre navigateur ; nous ne voyons jamais votre mot de passe, et votre identifiant Steam n'est jamais conservé."
ger = "Für Online-Spiel, RUSE Guard und Inhalts-Downloads bestätigt R.U.S.E. 2.0 durch eine Anmeldung über Steam, dass du R.U.S.E. besitzt. Du meldest dich auf Steams eigener Seite in deinem Browser an; wir sehen nie dein Passwort, und deine Steam-ID wird nie gespeichert."
ita = "Per il gioco online, RUSE Guard e i download di contenuti, R.U.S.E. 2.0 conferma che possiedi R.U.S.E. con un accesso tramite Steam. Accedi sulla pagina di Steam nel tuo browser; non vediamo mai la tua password, e il tuo ID Steam non viene mai conservato."
spa = "Para el juego en línea, RUSE Guard y las descargas de contenido, R.U.S.E. 2.0 confirma que posees R.U.S.E. con un inicio de sesión a través de Steam. Inicias sesión en la propia página de Steam en tu navegador; nunca vemos tu contraseña, y tu ID de Steam nunca se guarda."
pol = "Na potrzeby gry online, RUSE Guard i pobierania zawartości R.U.S.E. 2.0 potwierdza, że posiadasz R.U.S.E., przez logowanie przez Steam. Logujesz się na własnej stronie Steam w swojej przeglądarce; nigdy nie widzimy twojego hasła, a twój identyfikator Steam nigdy nie jest zapisywany."
ru = "Для сетевой игры, RUSE Guard и загрузки контента R.U.S.E. 2.0 подтверждает, что вы владеете R.U.S.E., через вход через Steam. Вы входите на собственной странице Steam в своём браузере; мы никогда не видим ваш пароль, и ваш Steam ID никогда не сохраняется."
cz = "Pro online hru, RUSE Guard a stahování obsahu R.U.S.E. 2.0 potvrzuje, že vlastníte R.U.S.E., přihlášením přes Steam. Přihlašujete se na vlastní stránce Steamu ve svém prohlížeči; vaše heslo nikdy nevidíme a vaše Steam ID se nikdy neukládá."
jpn = "オンラインプレイ、RUSE Guard、コンテンツのダウンロードのために、R.U.S.E. 2.0 は Steam サインインであなたが R.U.S.E. を所有していることを確認します。ブラウザーで Steam 自身のページにサインインします。私たちがパスワードを見ることはなく、Steam ID が保存されることもありません。"
sc = "为了在线游戏、RUSE Guard 和内容下载，R.U.S.E. 2.0 通过 Steam 登录来确认你拥有 R.U.S.E.。你在浏览器中 Steam 自己的页面上登录；我们绝不会看到你的密码，也绝不会存储你的 Steam ID。"
fa = "برای بازی آنلاین، RUSE Guard و دانلود محتوا، R.U.S.E. 2.0 با ورود از طریق Steam تأیید می‌کند که R.U.S.E. را دارید. شما در صفحهٔ خود Steam در مرورگرتان وارد می‌شوید؛ ما هرگز رمز عبور شما را نمی‌بینیم و شناسهٔ Steam شما هرگز ذخیره نمی‌شود."


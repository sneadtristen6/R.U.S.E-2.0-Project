# The words of the "Sign in through Steam" screen (rusemod.ownedpass, owned copies layer 2), for both apps.
# In the apps' eleven languages (translated 2026-10-31 with the agreement); English is the text that counts.
# Language codes are the game's folders, us fr ger ita spa pol ru cz jpn sc, and fa (Persian).

[title]
us = "Sign in through Steam"
fr = "Connexion via Steam"
ger = "Anmeldung über Steam"

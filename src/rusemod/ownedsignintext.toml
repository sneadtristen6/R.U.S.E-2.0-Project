[err_private]
us = "Steam didn't show us your games because your Steam profile's Game details are private. In Steam, set Game details to Public for a minute and try again, or ask for an unlock code."
fr = "Steam ne nous a pas montré vos jeux parce que les détails de jeu de votre profil Steam sont privés. Dans Steam, mettez les détails de jeu en Public pendant une minute et réessayez, ou demandez un code de déblocage."
ger = "Steam hat uns deine Spiele nicht gezeigt, weil die Spieldetails deines Steam-Profils privat sind. Stelle die Spieldetails in Steam für eine Minute auf Öffentlich und versuch es noch einmal, oder frag nach einem Freischaltcode."
ita = "Steam non ci ha mostrato i tuoi giochi perché i dettagli di gioco del tuo profilo Steam sono privati. In Steam, imposta i dettagli di gioco su Pubblico per un minuto e riprova, oppure chiedi un codice di sblocco."
spa = "Steam no nos mostró tus juegos porque los detalles del juego de tu perfil de Steam son privados. En Steam, pon los detalles del juego en Público durante un minuto e inténtalo de nuevo, o pide un código de desbloqueo."
pol = "Steam nie pokazał nam twoich gier, bo szczegóły gier w twoim profilu Steam są prywatne. W Steam ustaw szczegóły gier na Publiczne na minutę i spróbuj ponownie albo poproś o kod odblokowujący."
ru = "Steam не показал нам ваши игры, потому что сведения об играх в вашем профиле Steam закрыты. В Steam на минуту сделайте сведения об играх открытыми и попробуйте снова или попросите код разблокировки."
cz = "Steam nám vaše hry neukázal, protože podrobnosti o hrách ve vašem profilu Steam jsou soukromé. Ve Steamu na minutu nastavte podrobnosti o hrách na Veřejné a zkuste to znovu, nebo požádejte o odemykací kód."
jpn = "Steam プロフィールのゲームの詳細が非公開のため、Steam はあなたのゲームを私たちに見せませんでした。Steam でゲームの詳細を 1 分だけ公開にしてやり直すか、ロック解除コードを頼んでください。"
sc = "因为你 Steam 个人资料的游戏详情是私密的，Steam 没有向我们显示你的游戏。请在 Steam 中把游戏详情设为公开一分钟后重试，或申请解锁码。"
fa = "Steam بازی‌های شما را به ما نشان نداد، چون جزئیات بازی‌های نمایهٔ Steam شما خصوصی است. در Steam جزئیات بازی‌ها را یک دقیقه روی عمومی بگذارید و دوباره امتحان کنید، یا کد بازگشایی بخواهید."

[err_not_owned]
us = "This Steam account doesn't own R.U.S.E. R.U.S.E. 2.0 works only with copies people own. If you own it on another Steam account, sign in with that one; if you think this is wrong, ask for an unlock code."
fr = "Ce compte Steam ne possède pas R.U.S.E. R.U.S.E. 2.0 ne fonctionne qu'avec des exemplaires que les gens possèdent. Si vous le possédez sur un autre compte Steam, connectez-vous avec celui-là ; si vous pensez que c'est une erreur, demandez un code de déblocage."
ger = "Dieses Steam-Konto besitzt R.U.S.E. nicht. R.U.S.E. 2.0 arbeitet nur mit Exemplaren, die Leute besitzen. Besitzt du es auf einem anderen Steam-Konto, melde dich mit diesem an; hältst du das für einen Fehler, frag nach einem Freischaltcode."
ita = "Questo account Steam non possiede R.U.S.E. R.U.S.E. 2.0 funziona solo con copie che le persone possiedono. Se lo possiedi su un altro account Steam, accedi con quello; se pensi che sia un errore, chiedi un codice di sblocco."
spa = "Esta cuenta de Steam no posee R.U.S.E. R.U.S.E. 2.0 solo funciona con copias que la gente posee. Si lo posees en otra cuenta de Steam, inicia sesión con esa; si crees que es un error, pide un código de desbloqueo."
pol = "To konto Steam nie posiada R.U.S.E. R.U.S.E. 2.0 działa tylko z egzemplarzami, które ludzie posiadają. Jeśli posiadasz grę na innym koncie Steam, zaloguj się na nie; jeśli uważasz, że to błąd, poproś o kod odblokowujący."
ru = "Этот аккаунт Steam не владеет R.U.S.E. R.U.S.E. 2.0 работает только с копиями, которыми люди владеют. Если игра есть у вас на другом аккаунте Steam, войдите через него; если вы считаете это ошибкой, попросите код разблокировки."
cz = "Tento účet Steam R.U.S.E. nevlastní. R.U.S.E. 2.0 funguje jen s kopiemi, které lidé vlastní. Pokud hru vlastníte na jiném účtu Steam, přihlaste se tím; pokud si myslíte, že jde o chybu, požádejte o odemykací kód."
jpn = "この Steam アカウントは R.U.S.E. を所有していません。R.U.S.E. 2.0 は所有されているコピーでのみ動作します。別の Steam アカウントで所有しているなら、そちらでサインインしてください。間違いだと思う場合は、ロック解除コードを頼んでください。"
sc = "这个 Steam 账号不拥有 R.U.S.E.。R.U.S.E. 2.0 只能配合玩家拥有的副本使用。如果你在另一个 Steam 账号上拥有它，请用那个账号登录；如果你认为这是错误，请申请解锁码。"
fa = "این حساب Steam، R.U.S.E. را ندارد. R.U.S.E. 2.0 فقط با نسخه‌هایی کار می‌کند که مال خود افراد است. اگر آن را در حساب Steam دیگری دارید، با همان وارد شوید؛ اگر فکر می‌کنید این اشتباه است، کد بازگشایی بخواهید."


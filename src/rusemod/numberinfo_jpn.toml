[NbProdIdleDCA]
what = "待機中の生産：対空"
does = "ほかにすることがなく待機中に資金を使えるとき、対空ユニットをこの数になるまで生産します。防衛重視 2。"
[NbProdIdleChasseur]
what = "待機中の生産：戦闘機"
does = "ほかにすることがなく待機中に資金を使えるとき、戦闘機をこの数になるまで生産します。航空機重視 2。"
[NbProdIdleBomber]
what = "待機中の生産：爆撃機"
does = "ほかにすることがなく待機中に資金を使えるとき、爆撃機をこの数になるまで生産します。航空機重視 1。"
[NbProdIdleChasseurBomber]
what = "待機中の生産：戦闘爆撃機"
does = "ほかにすることがなく待機中に資金を使えるとき、戦闘爆撃機をこの数になるまで生産します。航空機重視 2、電撃戦重視 1。"
[ProdIdleCanLaunchResearch]

# --- コンピューター（AIタブ） ---
[AttaqueTempsActivation]
what = "攻撃を始めるまでの秒数"
does = "対戦開始から攻撃を始めるまでに待つ秒数。それまでは妨害もせず、脅かされた補給デポへの救援も出しません。既定 30、イージー 300（5分）、防衛重視 600（10分）。ハードと電撃戦重視はこの値を書いていないので0として数え、最初の1秒から攻撃します。"
[OffensiveNbMissionMax]
what = "同時攻撃の最大数"
does = "同時に行う攻撃（と報復）の最大数。-1は無制限で、ゲームのすべてのセットがこれを使っています。"
[MissionFacteurLancementAttaque]
what = "攻撃性（攻撃のしきい値）"
does = "ゲームのミッション設計者が攻撃性と呼ぶ値（Agressivite。キャンペーンのスクリプトがミッション中に変更します）：ゲームはこれに一定の係数を掛け、ある場所の戦力と比べてから攻撃を仕掛けます。ゲームのセット：既定 0.7、イージーと電撃戦重視 0.2、ハード 0.9、防衛重視 1。大きい数がどちらに働くかはまだ測っていません：ゲームで試してください。"
[MissionFacteurEnoughToDestroy]
what = "敵に対して集める戦力（敵の何倍か）"
does = "攻撃にどれだけの戦力を送るか（その場所の敵戦力の何倍か。ミッション設計者は攻撃の増援、Renfort_pour_attaque と呼びます）。既定 1.2、イージー 0.2、ノーマル 1.4、ハード 1.8、電撃戦重視 1.5、防衛重視 1。"
[DefenseDistanceMenace]
what = "脅威と判断する距離"
does = "守っている場所からどれだけの距離にいる敵を脅威とみなすか。ゲームは見張る範囲をこの距離の約1.4倍（距離×2の平方根）にします。ゲームのセットでは 312,000（1,200 m）、防衛重視は 26,000,000（100 km：マップ上のすべてが脅威）。"
[DefenseDistanceUrgent]
what = "緊急の脅威と判断する距離"
does = "守っている場所に敵がどこまで近づいたら防衛が緊急になるか（ミッション設計者の Distance_Defense_Urgente。脅威と判断する距離と対になる値）。既定 156,000（600 m）、ハード 208,000（800 m）、電撃戦重視 78,000（300 m）。"
[DefenseMaxUnitOnPosition]
what = "緊急でない防衛に送るユニット数"
does = "緊急でない防衛に送る自軍ユニットの数（ミッション設計者の Nbre_Unit_Defense_Non_Urgente）。既定 1、ノーマル 2、ハード 3、防衛重視 6。"
[DefenseNbMissionMax]
what = "同時に守る場所の最大数"
does = "同時に行う防衛任務（守る場所）の最大数。既定 2、イージーとハード 4、防衛重視 10。電撃戦重視はこの値を書いていないので0として数え、どこも守りません。"
[HarcelementActif]
what = "敵を妨害する"
does = "1：妨害します（攻撃前の待ち時間が終わってからの小規模な襲撃）。0：しません。イージーと防衛重視はこの値を書いていないので0として数え、妨害しません。"
[UpgradeActifPourHarcelement]
what = "妨害用のアップグレード"
does = "襲撃にアップグレード済みのユニットを使えるかどうか。イージーと電撃戦重視はこの値を書いていません（0）。"
[CashReserveTempsActivation]
what = "資金を蓄え始めるまでの秒数"
does = "対戦開始から何秒間、資金をすべて使えるか。その後は、ユニットを買う前に、発注した施設に必要な資金を取っておきます。ゲームのすべてのセットで 240（4分）。"
[PercentMoneyToReserveForBatimentAdmin]
what = "管理施設用に残す資金（％）"
does = "管理施設（収入を増やす）のために取っておく資金の割合（％）。ゲームのセットでは 20%、ハード 25%。ゲームがどこでこの値を読むかはまだ見つかっていません。"
[PercentMoneyToUseForIdle]
what = "待機中に使う資金（％）"
does = "ほかにすることがないときユニットに使ってよい資金の割合（％）：下の「待機中の生産」の数。0なら待機中に生産せず、それらの数は何もしません。既定とイージー 0、ノーマル 50%、ハード 100%。"
[DeviseBonusIA]
what = "開始時の追加資金（チート）"
does = "対戦開始時に受け取る追加資金（$）。ハードだけが持ちます：全プレイヤーが持って始める 200 $ に加えて 150 $。"
[IncomeBonusIA]
what = "支払いごとの追加収入（チート）"
does = "収入の支払いのたびに加わる追加資金（$）。ハードだけが持ちます：1 $。"
[NbBatimentAdministratifEnPlusAvantDesactivation]
what = "停止までに追加する管理施設"
does = "必要な数を超えて管理施設をいくつ建ててから建設をやめるか。-1は無制限。既定とAIタイプは -1、ハード 2。イージーとノーマルはこの値を書いていないので0として数え、必要以上は建てません。"
[DepotNbEnPlusAvantDesactivation]
what = "停止までに追加する補給デポ"
does = "取れる補給デポの場所がある限り、今ある数を超えていくつの補給デポを狙うか。既定 2、ノーマル 3、ハード 4、電撃戦重視 1、イージーはこの値を書いていません（0）。"
[ValueDepotMinForTruckFactory]
what = "トラック工場に必要な補給デポの最小価値"
does = "補給デポのグループのそばにトラック工場を建てる前に、それらのデポにまだ残っていなければならない補給の量（$）：残りのトラック積荷数 × 積荷1つ 3 $（戦略兵器モードでは 6 $）。ゲームはこれをデポの使用可能な資金と呼びます。すべてのセットで 100 $：シャーマン5両分、プレイヤーの初期資金 200 $ の半分。"
[MinutesLeftMinForTruckFactory]
what = "トラック工場に必要な残り時間（分、最小）"
does = "時間制限のある対戦では、残り時間が少なくともこの分数あるときだけトラック工場を建てます。すべてのセットで 5。"
[NbDepotMinForTruckFactory]
what = "トラック工場に必要な補給デポの最小数"
does = "グループ（自分のデポと、補給デポのグループの距離内にある他のデポ）にいくつデポがあればそこにトラック工場を建てるか。すべてのセットで 2。"
[NbUnitsDangerousDepot]
what = "補給デポを危険とみなすユニット数"
does = "自分の補給デポの周りに何体のユニットを数えたら、そのデポを危険とみなして救援を出すか。既定 1、防衛重視 4、ハードと電撃戦重視はこの値を書いていません（0）。"
[SeuilDistanceGroupeDepot]
what = "補給デポのグループの距離"
does = "新しいトラック工場の場所を選ぶとき、遠くの補給デポの中心からこの距離内（ユニットが通る道のりで測る）にあるデポを1つのグループとみなします。工場はグループのうち本拠地に最も近いデポのそばに建ちます。すべてのセットで 234,000（900 m）。"
[SeuilDistanceTruckFactory]
what = "トラック工場の距離"
does = "自分の補給デポのどれかが最も近い自分のトラック工場から少なくともこの距離（直線ではなく、トラックが走る道のりで測る）離れているとき、もう1つトラック工場を建てます（すでにトラック工場を持っている場合のみ）。既定とAIタイプは 520,000（2,000 m）、各難易度は 780,000（3,000 m）。どのAIタイプもこれを変えないので、対戦では 3,000 m が使われます。"
[NbMaxProductionForEnnemyUnit]
what = "敵ユニット1体に対する最大生産数"
does = "敵ユニット1体に対抗して生産するユニットの最大数。すべてのセットで 1。ゲームがどこでこの値を読むかはまだ見つかっていません。"
[NbProdIdleInfanterie]
what = "待機中の生産：歩兵"
does = "ほかにすることがなく待機中に資金を使える（「待機中に使う資金（％）」が0でない）とき、歩兵をこの数になるまで生産します。標準 2、大砲重視とプロトタイプ重視 1。"
[NbProdIdleTank]
what = "待機中の生産：戦車"
does = "ほかにすることがなく待機中に資金を使えるとき、戦車をこの数になるまで生産します。標準とプロトタイプ重視 3、電撃戦重視 4。"
[NbProdIdleAntitank]
what = "待機中の生産：対戦車"
does = "ほかにすることがなく待機中に資金を使えるとき、対戦車ユニットをこの数になるまで生産します。プロトタイプ重視 1、防衛重視 2。"
[NbProdIdleArti]
what = "待機中の生産：砲兵"

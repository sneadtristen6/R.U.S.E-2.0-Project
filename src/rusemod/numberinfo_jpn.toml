[TempsGenAutoDevises]
what = "自動支払いの間隔（秒）"
does = "自分でお金を生む建物が支払う間隔（秒、ゲームの自動収入）。コンピュータープレイヤーの追加収入（チート）も同じ間隔で払われます。ゲームでは 4。"

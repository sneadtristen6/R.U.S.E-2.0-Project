# 数値ガイド（日本語）（rusemod.numberinfo。正本は numberinfo.toml の英語）。
[SeuilMort]
what = "耐久力"
does = "破壊するのに必要なダメージ量。ゲームの戦車・車両・分隊・砲のほとんどは 400 です。ティーガーがジープより頑丈なのは主に装甲レベル（装甲）のためで、装甲に対して威力が足りない弾のダメージを毎発減らします。建物は 50〜4,500。"
[SeuilPinned]
what = "釘付けのしきい値"
does = "ユニットが釘付けになる（前進をやめ、射撃が減る）までに必要な制圧量。弾薬の制圧半径内の近くに着弾すると増えます。ほとんどのユニットは 200。高いほど釘付けにしにくくなります。"
[ArmureHint]
what = "表示される装甲レベル"
does = "ユニットのカードと生産メニューに表示される装甲レベル（盾の数字、1〜5）。Studio の「装甲」欄は実際の装甲と一緒にこれを設定するので、両者は常に一致します。"
[BaseBlindage]
what = "装甲"
does = "ユニットが戦闘で使う装甲（ゲーム内で 1〜10）。高いほど弱い弾から受けるダメージが減ります。「装甲」欄で変更してください。ゲームのレベルの1つを選び、カードの盾の数字も同じに保ちます（ゲーム内で確認済み）。"
[ReculeSeulementSiUberstress]
what = "完全に釘付けのときだけ後退"
does = "1：ユニットは完全に釘付けになったとき（極度の制圧）だけ砲火の中で後退し、それより前には後退しません。ゲームの 38 ユニットが持っています。"
[VitesseLineaire]
what = "速度"
does = "道路外を移動するときの速さ。シャーマンは 4,550（約 35 km/h）、ジープは 6,110（約 47 km/h）、小銃分隊は 3,120（約 24 km/h）。"
["TAvionDescriptor.VitesseLineaire"]
what = "飛行速度"
does = "航空機の飛ぶ速さ。ゲーム内で 13,000〜46,800（約 225〜810 km/h）。"
[VitesseLineaireAuSol]
what = "地上速度"
does = "航空機が離着陸時に飛行場を滑走する速さ。"
[VitesseLineaireIdle]
what = "巡回速度"
does = "やることがなく旋回しているときの航空機の速さ。最高速度より遅くなります。"
[VitesseCombat]
what = "戦闘中の速度"
does = "戦闘中に動く速さ。戦車や車両では通常「速度」と同じ。分隊や牽引砲ではずっと遅くなります（小銃分隊 1,040、約 8 km/h。対戦車砲 520、約 4 km/h、砲兵が押して動かす）。"
[SpeedBonusOnRoad]
what = "道路での速度ボーナス"
does = "道路外より道路上でどれだけ速いか。0.6 は約 60% 速いという意味です。分隊と砲は変身するトラックとしてこれを受けます。航空機とトラックは 1。"
[MaxAcceleration]
what = "加速"
does = "速度に達するまでの速さ：ゲームは0.2秒ごとにこの値の5分の1を速度に加えるので、速度をこの値で割ると最高速度に達するまでの秒数になります（欄の横に表示）。ほとんどの戦車は 3,900：シャーマン（4,550）は約1.2秒で最高速度になります。"
[MaxDeceleration]
what = "制動"
does = "減速して止まるまでの速さ：速度をこの値で割ると、最高速度から止まるまでの秒数になります（欄の横に表示）。"
[TempsDemiTour]
what = "反転時間"
does = "反対方向へ向き直るのにかかる秒数。歩兵 0.01（即座）、車両 0.5、戦車 1、最も遅いもので 6。"
[Radius]
what = "地上での大きさ"
does = "ユニットが占める場所。他のユニットは回り込むとき、その中心からこの距離を保ちます。歩兵 104〜130（約 0.5 m）、戦車 520〜780（2〜3 m）、砲 390〜650、トラック 2,000、建物 7,800〜13,000（30〜50 m）。"
["TAvionDescriptor.Radius"]
what = "空中での大きさ"
does = "他の航空機がよけて飛ぶときに航空機が占める場所。780〜2,600（3〜10 m）。"
[StickToGround]
what = "地形に沿う"
does = "1：ユニットは立っている斜面に合わせて傾きます。ゲームのすべての地上ユニットと建物が持っています。"
[Scale]
what = "モデルのサイズ"
does = "見た目のみ：ユニットの 3D モデルをこの倍率で描きます。ユニットは 1、歩兵は 0.2、建物は 0.1。インポートしたモデルでは Studio の「サイズ」スライダーが代わりにモデル自体を変えます。"
[DetectionBase]
what = "視界"
does = "地上ユニットが見える距離。戦車 104,000（約 400 m）、偵察車 234,000（900 m）、偵察機 195,000（750 m）。234,000 だけを与えた IV 号戦車は偵察として動きませんでした。残りは「役割」欄が与えます。"
[PorteeVisionVolant]
what = "対空視界"
does = "航空機が見える距離。ほとんどのユニットは 208,000（800 m）。一部は 2,600（10 m：航空機がほとんど見えない）。"
[SignatureRadar]
what = "レーダー反応"
does = "敵のレーダーにどんな種類の反応として映るか。1 地上ユニット、2 建物、3 航空機。"
[AltitudeNoise]
what = "高度の揺れ"
does = "見た目のみ：飛行中に航空機の高度がどれだけ揺れるか（130〜260、1 m 未満）。"
[PorteeAttackReflexAir]
what = "自動攻撃範囲（空）"
does = "命令なしで航空機が自分から敵機を追う距離。130,000〜208,000（500〜800 m）。"
[PorteeAttackReflexSol]
what = "自動攻撃範囲（地上）"
does = "航空機が自分から地上目標を追う距離。ゲームのすべての航空機で 182,000（700 m）。"
[SecondaryWeaponMaxAmmo]
what = "搭載する爆弾またはロケット"
does = "航空機が再武装のために帰還するまでに積んでいる第2兵装（爆弾、ロケット）の数。ゲーム内で 1〜4。"
[ProductionPrice]
what = "価格"
does = "5つのゲームモードそれぞれでの生産費用（$）。ゲームの順に 1945、1942、1939、全面戦争、戦略兵器（ゲームは対戦のモードのものを使います）。"
[ProductionTime]
what = "生産時間"
does = "生産にかかる秒数。同じ種類の工場が複数で生産すると時間は分担されますが、ゲームの最短の生産時間（経済タブの値）より短くはなりません。"
[UpgradePrice]
what = "研究費"
does = "生産できるようになる前に研究するための費用（$）（他のユニットから研究されるユニット）。"
[UpgradeTime]
what = "研究時間"
does = "研究にかかる時間（秒）。"
[IsUpgrade]

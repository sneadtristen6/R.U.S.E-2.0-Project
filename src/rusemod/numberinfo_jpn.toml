does = "1：ほかにすることがないとき、研究も始められます。プロトタイプ重視だけが持ちます。"
[BonusUnitesAvions]
what = "優先度：航空機"
does = "生産できるすべての航空機に加える優先度。優先度はユニットごとに合計され、自軍ユニット同士の差だけが意味を持ちます：各ユニットを、最も好むユニットからどれだけ下かで評価します。航空機重視の +500 で航空機がはっきりした一番になります。"
[BonusUnitesArtillerie]
what = "優先度：砲兵"
does = "生産できるすべての砲兵ユニットに加える優先度（合計のしかたは「優先度：航空機」を参照）。大砲重視の +8,000 で砲兵がほかのすべてよりはるかに上になります。"
[BonusUnitesExperimentales]
what = "優先度：試作兵器"
does = "生産できるすべての試作兵器（ゲームのカテゴリー12のユニット）に加える優先度。プロトタイプ重視 +400。"
[BonusUnitesRecherche]
what = "優先度：研究"
does = "まだ研究が必要なすべてのユニットに加える優先度（ゲームの研究リストでまだ完了扱いになっていないもの）。そのぶん研究を多く行います。プロトタイプ重視 +400。"
[BonusUnitesTank]
what = "優先度：戦車"
does = "生産できるすべての戦車に加える優先度。ゲームのどのセットも使っていないので、AIタブでは提示できません（「追加」は既定が書いている値だけを提示します）。キャンペーンのスクリプトは使っています（Bonus_Tank、150～200）。"
[BonusBatimentOTF]
what = "優先度：防御施設"
does = "すべての防御施設（トーチカと砲陣地：フラグ6）に加える優先度。守る場所に防御を築く意欲も高めます：ゲームはこれを 0.5 + この値 / 200 で重み付けし、防衛重視の +200 なら 1.5、0 なら 0.5 です。"
[PourcentChanceUtiliserCarteManipAuDebut]
what = "序盤に操作系の計略を使う確率（％）"
does = "対戦開始時に操作系の計略を使う確率（％）。既定 40%、ノーマル 60%、ハード 80%。"
[NbCarteDansLaReservePourLaDifficulte]
what = "温存する計略カード（難易度）"
does = "使わずに手元に残す計略カード。ゲームは難易度の数とAIタイプの数を足します。ノーマルとハード 1。"
[NbCarteDansLaReservePourLeProfil]
what = "温存する計略カード（AIタイプ）"
does = "使わずに手元に残す計略カード。ゲームはこの数を難易度の数に足します。プロトタイプ重視と防衛重視 1。"
[TempsActivationBatimentCamoufle]
what = "施設を偽装するまでの秒数"
does = "対戦開始から自分の施設に偽装の計略を使うまでの秒数。イージーだけが設定：600（10分）。ほかは0で、最初から使います。"
[RepresailleFacteurUniteCombattante]
what = "報復の係数：戦闘ユニット"
does = "戦闘ユニットを失ったあと、どれだけ強く反撃するか（倍率）。キャンペーンのスクリプトは非戦闘ユニットの係数と合わせて1つの報復設定（Represailles、1か2）として設定します。既定 1、イージー 0.5、ハード 2、防衛重視はこの値を書いていません（0：それらへの報復なし）。"
[RepresailleFacteurUniteNonCombattante]
what = "報復の係数：非戦闘ユニット"
does = "戦わないユニット（トラック、施設）を失ったあと、どれだけ強く反撃するか（倍率）。キャンペーンのスクリプトは戦闘ユニットの係数と合わせて設定します。既定 2、イージー 1、ハード 4、防衛重視はこの値を書いていません（0）。"
[TimeOutRepresailles]
what = "報復の制限時間（秒）"
does = "報復を何秒続けてからやめるか。既定 120（2分）、ハード 240。"
[ProbaRepereFake]
what = "囮を見破る確率（0～1）"
does = "守っている、または攻めている場所の囮を見破る確率（0～1）。ゲームは24秒ごとに判定します。既定 0.5（50%）、イージー 0.1、ハード 0.8。"
[TempsMemorisationUnitInvisible]
what = "見えないユニットを覚えている秒数"
does = "見えなくなった敵ユニットを何秒覚えているか。既定 300（5分）、イージー 60、ハード 360。"
[BonusValue]
what = "これらのユニットへの追加優先度"
does = "ゲームモード、難易度、AIタイプがそれぞれリストに入っている対戦で、記載のユニットに加える優先度（空のリストはすべてに当てはまります）。セット自身の優先度（「優先度：航空機」など）に加算されます。ゲームの項目：戦略兵器モードで核砲に +400、すべての難易度とAIタイプで。"
[ConsiderStackAsOneEnnemy]
what = "重なったユニットを1体の敵とみなす"
does = "1：これらのユニットの重なりを1体の敵として数えます。ゲームの項目は 1。"
[UnitIDs]
what = "ユニット（番号）"
does = "項目の対象ユニット。各ユニット固有の番号（ID）で書かれます。AIタブでは名前で選べます。空のリストならすべてのユニットという意味になります。"
[WarModes]
what = "ゲームモード（番号）"
does = "項目が効くゲームモード。ゲームが付けた番号で：0 1945年代、1 1942年代、2 1939年代、3 全面戦争モード、4 戦略兵器モード（ゲームのリストの順）。"
[AIDifficulties]
what = "難易度（番号）"
does = "項目が効く難易度：0 イージー、1 ノーマル、2 ハード。"
[AIProfiles]
what = "AIタイプ（番号）"
does = "項目が効くAIタイプ：0 標準、1 航空機重視、2 大砲重視、3 プロトタイプ重視、4 電撃戦重視、5 防衛重視、6 ランダム。"
["TBluffCardDescriptor.LifeDuration"]
what = "効果時間（秒）"
does = "計略を使ってから効果が続く秒数：ゲームでは 240～360（4～6分）。"
["TBluffCardDescriptor.ShowInMenu"]
what = "計略メニューに表示"

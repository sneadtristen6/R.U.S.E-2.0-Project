[ShowInMenu]
what = "生産メニューに表示"
does = "1：そのゲームモードで生産メニューに表示。5つのモードそれぞれに1つの値で、ゲームの順に 1945、1942、1939、全面戦争、戦略兵器。ゲームの大戦末期の戦車は 1945、全面戦争、戦略兵器でのみ表示されます。"
[PositionInMenu]
what = "メニューの位置"

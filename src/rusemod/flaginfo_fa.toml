use = "از کادر «نقش» استودیو استفاده کنید: «شناسایی» روی هواپیمای مسلح، 100 را هم فعال می‌کند تا حمله‌هایش همچنان کار کنند."
danger_why = "هواپیمایی که سلاح دارد و 99 را بدون 100 دارد، وقتی برای حمله فرستاده شود بازی را از کار می‌اندازد. استودیو هواپیمایی را که این‌طور به آن 99 داده‌اید نمی‌سازد: 100 را هم اضافه کنید، یا 99 را بردارید."


# راهنمای پرچم‌ها به فارسی (rusemod.flaginfo؛ متن انگلیسی در flaginfo.toml معتبر است).
[0]
what = "فرودگاه"
does = "یک ساختمان را به‌عنوان فرودگاه مشخص می‌کند: هواپیماهای شما در آن مستقرند و اگر با یک هواپیما روی فرودگاه خودتان کلیک کنید، هواپیما برای فرود به خانه برمی‌گردد. برنامه‌ریزی شناسایی بازیکن رایانه‌ای دنبال یک فرودگاه می‌گردد."
use = "فقط برای ساختمان‌های فرودگاه. روی هر چیز دیگری فقط باعث می‌شود بازی آن را جایی بداند که هواپیماها می‌توانند در آن فرود بیایند."

[1]
what = "توپخانه (آتش غیرمستقیم)"

use = "روی هر یگانی کار می‌کند: DomesticNukes آن را به 410 یگان از همه نوع داد و همه به‌صورت غیرمستقیم شلیک کردند."

[2]
what = "هواپیما"
does = "یگان یک هواپیماست: در برج مراقبت فرودگاه ساخته می‌شود، برای سوخت‌گیری به خانه پرواز می‌کند و دستور زمینی نمی‌گیرد. همهٔ 63 هواپیمای بازی آن را دارند و هیچ چیز دیگری ندارد."
use = "آن را روی همهٔ هواپیماها نگه دارید. هرگز آن را روی یگان زمینی نگذارید: بازی سعی می‌کند آن را در برج مراقبت یک فرودگاه بسازد."
danger_why = "روی یگانی که هواپیما نیست، انتظار می‌رود ساختنش بازی را با خطای اسکریپت متوقف کند (بازی دنبال برج مراقبت یک فرودگاه می‌گردد)."


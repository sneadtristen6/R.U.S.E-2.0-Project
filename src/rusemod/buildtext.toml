us = "{0}: {1}: cover.toml paints the blocked layer at ({2}, {3}) with no movement.toml block there. The blocked layer only tells the AI where it can't see or build; units still walk on it. To keep units off, add a [[block]] with the same x, y and radius to movement.toml"

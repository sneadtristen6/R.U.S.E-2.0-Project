[eb2774a9e3e]
us = "{0}: {1}: the filled riverbeds' ground stickers, low plants and stones stay: taking them off would make the map's scenery bigger than a map can hold. Their pictures are mended all the same"
fr = "{0} : {1} : les autocollants de sol, plantes basses et pierres des lits de rivière comblés restent : les retirer rendrait le décor de la carte plus gros qu'une carte ne peut contenir. Leurs images sont tout de même réparées"
ger = "{0}: {1}: die Bodenaufkleber, niedrigen Pflanzen und Steine der verfüllten Flussbetten bleiben: sie wegzunehmen machte die Szenerie der Karte größer, als eine Karte fassen kann. Ihre Bilder werden trotzdem ausgebessert"
ita = "{0}: {1}: gli adesivi del terreno, le piante basse e le pietre dei letti di fiume riempiti restano: toglierli renderebbe lo scenario della mappa più grande di quanto una mappa possa contenere. Le loro immagini vengono comunque sistemate"
spa = "{0}: {1}: las pegatinas de suelo, plantas bajas y piedras de los lechos de río rellenados se quedan: quitarlas haría la escenografía del mapa mayor de lo que un mapa admite. Sus imágenes se reparan igualmente"
pol = "{0}: {1}: naklejki terenu, niskie rośliny i kamienie zasypanych koryt rzek zostają: ich usunięcie uczyniłoby scenerię mapy większą, niż mapa może pomieścić. Ich obrazy i tak są naprawiane"
ru = "{0}: {1}: наклейки земли, низкие растения и камни засыпанных русел остаются: если их убрать, декорации карты станут больше, чем вмещает карта. Их картинки всё равно исправлены"
cz = "{0}: {1}: nálepky země, nízké rostliny a kameny zasypaných koryt zůstávají: jejich odebrání by udělalo scenérii mapy větší, než mapa unese. Jejich obrázky se přesto opraví"
jpn = "{0}：{1}：埋めた川床の地面ステッカー・低い植物・石は残します。取り除くとマップの配置物が上限を超えるためです。画像は同じように補修しています"
sc = "{0}：{1}：填平河床上的地面贴花、低矮植物和石头保留：移除它们会使地图的场景物体超过地图上限。其图片仍会照常修补"


ru = "{0}{1} в армии {2} (Nationalite {3}), но его модель {4}{5} есть только в пакете моделей юнитов {6}, а в данных юнитов нет карт кластеров, которые загружали бы модели {7} в каждом матче: игра загружает модели юнитов нации только в матчах, где у игрока есть эта нация, так что в других матчах у этого юнита нет модели или игра вылетает. Лучше скопируйте юнит {8} или оставьте его в армии {9}"
cz = "{0}{1} je v armádě {2} (Nationalite {3}), ale jeho model {4}{5} je jen v balíku modelů jednotek {6} a data jednotek nemají mapy clusterů, které by načetly modely {7} v každém zápase: hra načítá modely jednotek národa jen v zápasech, kde má některý hráč tento národ, takže v jiných zápasech nemá tato jednotka model, nebo shodí hru. Raději zkopírujte jednotku {8}, nebo ji nechte v armádě {9}"
jpn = "{0}{1} は {2} の軍（Nationalite {3}）にいますが、モデル {4}{5} は {6} のユニットのメッシュパックにしかなく、{7} のモデルを全試合で読み込めるクラスターマップもユニットデータにありません。ゲームはその国を誰かが使う試合でしかその国のユニットモデルを読み込まないため、ほかの試合ではこのユニットにモデルがないか、ゲームが落ちます。代わりに {8} のユニットをコピーするか、{9} の軍に残してください"
sc = "{0}{1} 在 {2} 的军队中（Nationalite {3}），但其模型 {4}{5} 只在 {6} 单位的网格包中，单位数据中也没有能在每场对局加载 {7} 模型的集群地图：游戏只在有玩家使用某国的对局中加载该国单位模型，因此在其他对局中此单位没有模型或会导致游戏崩溃。请改为复制 {8} 的单位，或把它留在 {9} 的军队中"
fa = "{0}{1} در ارتش {2} است (Nationalite {3})، اما مدلش {4}{5} فقط در بستهٔ مش یگان‌های {6} است، و در داده‌های یگان‌ها هیچ cluster map وجود ندارد که بتواند مدل‌های {7} را در هر مسابقه بارگذاری کند: بازی مدل‌های یگان‌های یک کشور را فقط در مسابقه‌هایی بارگذاری می‌کند که بازیکنی آن کشور را دارد، پس در مسابقه‌های دیگر این یگان مدلی ندارد، یا بازی کرش می‌کند. به‌جای آن یکی از یگان‌های {8} را کپی کنید، یا آن را در ارتش {9} نگه دارید"


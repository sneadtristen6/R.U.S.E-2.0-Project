us = "note: {0} of the game's packs are marked read-only, so they were copied rather than linked (a link would share the mark, and the copy couldn't be removed later). Unticking Read-only in the game folder's Properties would save that space."
fr = "remarque : {0} des packs du jeu sont en lecture seule : ils ont donc été copiés plutôt que liés (un lien partagerait la marque, et la copie ne pourrait pas être supprimée plus tard). Décocher Lecture seule dans les Propriétés du dossier du jeu ferait gagner cette place."
ger = "Hinweis: {0} der Spielpakete sind schreibgeschützt, also wurden sie kopiert statt verknüpft (eine Verknüpfung teilte den Schutz, und die Kopie ließe sich später nicht entfernen). Schreibgeschützt in den Eigenschaften des Spielordners abzuwählen würde diesen Platz sparen."
ita = "nota: {0} dei pacchetti del gioco sono di sola lettura, quindi sono stati copiati invece che collegati (un collegamento condividerebbe il segno, e la copia non si potrebbe rimuovere dopo). Togliere Sola lettura nelle Proprietà della cartella del gioco farebbe risparmiare quello spazio."
spa = "nota: {0} de los paquetes del juego están marcados como solo lectura, así que se copiaron en vez de enlazarse (un enlace compartiría la marca y la copia no se podría quitar luego). Desmarcar Solo lectura en las Propiedades de la carpeta del juego ahorraría ese espacio."
pol = "uwaga: {0} paczek gry ma atrybut tylko do odczytu, więc zostały skopiowane zamiast połączone (połączenie dzieliłoby ten atrybut i kopii nie dałoby się potem usunąć). Odznaczenie Tylko do odczytu we Właściwościach folderu gry oszczędziłoby to miejsce."
ru = "заметка: паков игры только для чтения: {0}, поэтому они скопированы, а не связаны (ссылка унаследовала бы этот признак, и копию потом нельзя было бы удалить). Если снять «Только чтение» в свойствах папки игры, это место освободится."
cz = "poznámka: {0} balíků hry je jen pro čtení, takže se zkopírovaly místo propojení (propojení by sdílelo příznak a kopii by pak nešlo odstranit). Zrušení volby Jen pro čtení ve Vlastnostech složky hry by to místo ušetřilo."
jpn = "注記：ゲームのパック {0} 個が読み取り専用のため、リンクではなくコピーしました（リンクだと属性も共有され、後でコピーを消せません）。ゲームフォルダーのプロパティで読み取り専用を外すと、その分の容量を節約できます。"
sc = "备注：游戏中有 {0} 个包被标记为只读，因此复制而不是链接它们（链接会共享该标记，之后无法删除副本）。在游戏文件夹属性中取消“只读”可节省这些空间。"
fa = "یادداشت: {0} بسته از بسته‌های بازی «فقط‌خواندنی» علامت خورده‌اند، پس به‌جای پیوند داده شدن، کپی شدند (پیوند در این علامت شریک می‌شد و بعداً نمی‌شد آن نسخه را پاک کرد). برداشتن تیک «فقط‌خواندنی» (Read-only) در «ویژگی‌ها» (Properties) پوشهٔ بازی این فضا را آزاد نگه می‌دارد."


[e984fde5df0]
us = "{0}{1} is in {2}'s army (Nationalite {3}), but its model {4}{5} is in the mesh pack of {6}'s units only, and the unit data has no cluster maps that could load {7}'s models in every match: the game loads a nation's unit models only in matches where a player has that nation, so in other matches this unit has no model, or crashes the game. Copy one of {8}'s units instead, or leave it in {9}'s army"
fr = "{0}{1} est dans l'armée de {2} (Nationalite {3}), mais son modèle {4}{5} n'est que dans le pack de maillages des unités de {6}, et les données d'unités n'ont aucune carte de cluster qui pourrait charger les modèles de {7} dans chaque partie : le jeu ne charge les modèles d'unités d'une nation que dans les parties où un joueur a cette nation, donc dans les autres parties cette unité n'a pas de modèle, ou fait planter le jeu. Copiez plutôt une unité de {8}, ou laissez-la dans l'armée de {9}"
ger = "{0}{1} ist in der Armee von {2} (Nationalite {3}), aber sein Modell {4}{5} liegt nur im Meshpaket der Einheiten von {6}, und die Einheitendaten haben keine Cluster-Maps, die die Modelle von {7} in jedem Spiel laden könnten: das Spiel lädt die Einheitenmodelle einer Nation nur in Spielen, in denen ein Spieler diese Nation hat, also hat diese Einheit in anderen Spielen kein Modell oder lässt das Spiel abstürzen. Kopiere stattdessen eine Einheit von {8} oder lass sie in der Armee von {9}"
ita = "{0}{1} è nell'esercito di {2} (Nationalite {3}), ma il suo modello {4}{5} è solo nel pacchetto mesh delle unità di {6}, e i dati delle unità non hanno mappe cluster che possano caricare i modelli di {7} in ogni partita: il gioco carica i modelli delle unità di una nazione solo nelle partite in cui un giocatore ha quella nazione, quindi nelle altre partite questa unità non ha modello, o fa bloccare il gioco. Copia invece un'unità di {8}, o lasciala nell'esercito di {9}"
spa = "{0}{1} está en el ejército de {2} (Nationalite {3}), pero su modelo {4}{5} solo está en el paquete de mallas de las unidades de {6}, y los datos de unidades no tienen mapas de clúster que puedan cargar los modelos de {7} en cada partida: el juego solo carga los modelos de unidades de una nación en las partidas donde un jugador tiene esa nación, así que en las demás esta unidad no tiene modelo, o cuelga el juego. Copia en su lugar una unidad de {8}, o déjala en el ejército de {9}"

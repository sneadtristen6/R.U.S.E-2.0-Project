ger = "{0}: {1}: cover.toml malt die blockierte Ebene bei ({2}, {3}) ohne movement.toml-Block dort. Die blockierte Ebene sagt nur der KI, wo sie nicht sehen oder bauen kann; Einheiten laufen weiter darauf. Um Einheiten fernzuhalten, füge in movement.toml einen [[block]] mit denselben x, y und radius hinzu"

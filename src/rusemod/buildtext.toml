[e088772a659]
us = "{0}{1} is in {2}'s army (Nationalite {3}), but its model {4}{5} is in the mesh pack of {6}'s units only, and it can't be copied into {7}'s skirmish packs: {8}{9}. The game loads a nation's unit models only in matches where a player has that nation, so in other matches this unit would have no model, or crash the game. Copy one of {10}'s units instead, or leave it in {11}'s army"
fr = "{0}{1} est dans l'armée de {2} (Nationalite {3}), mais son modèle {4}{5} n'est que dans le pack de maillages des unités de {6}, et il ne peut pas être copié dans les packs d'escarmouche de {7} : {8}{9}. Le jeu ne charge les modèles d'unités d'une nation que dans les parties où un joueur a cette nation, donc dans les autres parties cette unité n'aurait pas de modèle, ou ferait planter le jeu. Copiez plutôt une unité de {10}, ou laissez-la dans l'armée de {11}"
ger = "{0}{1} ist in der Armee von {2} (Nationalite {3}), aber sein Modell {4}{5} liegt nur im Meshpaket der Einheiten von {6}, und es kann nicht in die Gefechtspakete von {7} kopiert werden: {8}{9}. Das Spiel lädt die Einheitenmodelle einer Nation nur in Spielen, in denen ein Spieler diese Nation hat, also hätte diese Einheit in anderen Spielen kein Modell oder ließe das Spiel abstürzen. Kopiere stattdessen eine Einheit von {10} oder lass sie in der Armee von {11}"
ita = "{0}{1} è nell'esercito di {2} (Nationalite {3}), ma il suo modello {4}{5} è solo nel pacchetto mesh delle unità di {6}, e non può essere copiato nei pacchetti di schermaglia di {7}: {8}{9}. Il gioco carica i modelli delle unità di una nazione solo nelle partite in cui un giocatore ha quella nazione, quindi nelle altre partite questa unità non avrebbe modello, o farebbe bloccare il gioco. Copia invece un'unità di {10}, o lasciala nell'esercito di {11}"
spa = "{0}{1} está en el ejército de {2} (Nationalite {3}), pero su modelo {4}{5} solo está en el paquete de mallas de las unidades de {6}, y no se puede copiar a los paquetes de escaramuza de {7}: {8}{9}. El juego solo carga los modelos de unidades de una nación en las partidas donde un jugador tiene esa nación, así que en las demás esta unidad no tendría modelo, o colgaría el juego. Copia en su lugar una unidad de {10}, o déjala en el ejército de {11}"
pol = "{0}{1} jest w armii {2} (Nationalite {3}), ale jego model {4}{5} jest tylko w paczce siatek jednostek {6} i nie da się go skopiować do paczek potyczek {7}: {8}{9}. Gra wczytuje modele jednostek nacji tylko w rozgrywkach, gdzie jakiś gracz ma tę nację, więc w innych ta jednostka nie miałaby modelu albo wywaliłaby grę. Zamiast tego skopiuj jednostkę {10} albo zostaw ją w armii {11}"
ru = "{0}{1} в армии {2} (Nationalite {3}), но его модель {4}{5} есть только в пакете моделей юнитов {6}, и скопировать её в пакеты сражений {7} нельзя: {8}{9}. Игра загружает модели юнитов нации только в матчах, где у игрока есть эта нация, так что в других матчах у этого юнита не будет модели или игра вылетит. Лучше скопируйте юнит {10} или оставьте его в армии {11}"
cz = "{0}{1} je v armádě {2} (Nationalite {3}), ale jeho model {4}{5} je jen v balíku modelů jednotek {6} a nelze ho zkopírovat do balíků pro potyčky {7}: {8}{9}. Hra načítá modely jednotek národa jen v zápasech, kde má některý hráč tento národ, takže v jiných zápasech by tato jednotka neměla model, nebo by shodila hru. Raději zkopírujte jednotku {10}, nebo ji nechte v armádě {11}"
jpn = "{0}{1} は {2} の軍（Nationalite {3}）にいますが、モデル {4}{5} は {6} のユニットのメッシュパックにしかなく、{7} のスカーミッシュ用パックにもコピーできません：{8}{9}。ゲームはその国を誰かが使う試合でしかその国のユニットモデルを読み込まないため、ほかの試合ではこのユニットにモデルがないか、ゲームが落ちます。代わりに {10} のユニットをコピーするか、{11} の軍に残してください"
sc = "{0}{1} 在 {2} 的军队中（Nationalite {3}），但其模型 {4}{5} 只在 {6} 单位的网格包中，且无法复制到 {7} 的遭遇战包：{8}{9}。游戏只在有玩家使用某国的对局中加载该国单位模型，因此在其他对局中此单位会没有模型或导致游戏崩溃。请改为复制 {10} 的单位，或把它留在 {11} 的军队中"

[eebfdfe7461]
us = "{0}: the spawned {1} use {2}'s unit models, which a skirmish loads only when a player has {3}, and they can't be copied into the packs every skirmish loads: {4}{5}. The game would crash as the match starts (a D-Day test with Japanese units spawned and no Japanese player did). Spawn units whose models every match has, or leave these out"
fr = "{0} : les {1} apparus utilisent les modèles d'unités de {2}, qu'une escarmouche ne charge que si un joueur a {3}, et ils ne peuvent pas être copiés dans les packs que charge chaque escarmouche : {4}{5}. Le jeu planterait au début de la partie (un test sur D-Day avec des unités japonaises apparues et aucun joueur japonais l'a fait). Faites apparaître des unités dont chaque partie a les modèles, ou laissez celles-ci de côté"
ger = "{0}: die erscheinenden {1} nutzen die Einheitenmodelle von {2}, die ein Gefecht nur lädt, wenn ein Spieler {3} hat, und sie können nicht in die Pakete kopiert werden, die jedes Gefecht lädt: {4}{5}. Das Spiel würde beim Start des Spiels abstürzen (ein D-Day-Test mit erschienenen japanischen Einheiten und ohne japanischen Spieler tat es). Lass Einheiten erscheinen, deren Modelle jedes Spiel hat, oder lass diese weg"
ita = "{0}: i {1} generati usano i modelli delle unità di {2}, che una schermaglia carica solo se un giocatore ha {3}, e non possono essere copiati nei pacchetti che ogni schermaglia carica: {4}{5}. Il gioco si bloccherebbe all'inizio della partita (un test su D-Day con unità giapponesi generate e nessun giocatore giapponese l'ha fatto). Genera unità i cui modelli ogni partita ha, o lascia fuori queste"
spa = "{0}: los {1} generados usan los modelos de unidades de {2}, que una escaramuza solo carga si un jugador tiene {3}, y no se pueden copiar a los paquetes que carga cada escaramuza: {4}{5}. El juego se colgaría al empezar la partida (una prueba en D-Day con unidades japonesas generadas y sin jugador japonés lo hizo). Genera unidades cuyos modelos tenga cada partida, o deja fuera estas"
pol = "{0}: pojawiające się {1} używają modeli jednostek {2}, które potyczka wczytuje tylko, gdy jakiś gracz ma {3}, i nie da się ich skopiować do paczek wczytywanych w każdej potyczce: {4}{5}. Gra by się wywaliła na starcie rozgrywki (tak było w teście na D-Day z japońskimi jednostkami i bez japońskiego gracza). Każ pojawiać się jednostkom, których modele ma każda rozgrywka, albo pomiń te"
ru = "{0}: появляющиеся {1} используют модели юнитов {2}, которые сражение загружает, только если у игрока есть {3}, и их нельзя скопировать в пакеты, которые загружает каждое сражение: {4}{5}. Игра вылетит в начале матча (так было в тесте на D-Day с японскими юнитами без японского игрока). Создавайте юнитов, чьи модели есть в каждом матче, или уберите этих"

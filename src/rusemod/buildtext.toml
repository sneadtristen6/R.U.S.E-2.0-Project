ru = "{0}: {1}: наклейки земли, низкие растения и камни засыпанных русел остаются: если их убрать, декорации карты станут больше, чем вмещает карта. Их картинки всё равно исправлены"
cz = "{0}: {1}: nálepky země, nízké rostliny a kameny zasypaných koryt zůstávají: jejich odebrání by udělalo scenérii mapy větší, než mapa unese. Jejich obrázky se přesto opraví"
jpn = "{0}：{1}：埋めた川床の地面ステッカー・低い植物・石は残します。取り除くとマップの配置物が上限を超えるためです。画像は同じように補修しています"

jpn = "{0}：{1}：cover.toml が ({2}, {3}) にブロック層を塗っていますが、そこに movement.toml のブロックがありません。ブロック層は AI に見えない・建てられない場所を伝えるだけで、ユニットはその上を歩けます。ユニットを入れないには、movement.toml に同じ x・y・radius の [[block]] を追加してください"

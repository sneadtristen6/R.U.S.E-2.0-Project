ger = "{0}: {1}: cover.toml malt die blockierte Ebene bei ({2}, {3}) ohne movement.toml-Block dort. Die blockierte Ebene sagt nur der KI, wo sie nicht sehen oder bauen kann; Einheiten laufen weiter darauf. Um Einheiten fernzuhalten, füge in movement.toml einen [[block]] mit denselben x, y und radius hinzu"
ita = "{0}: {1}: cover.toml dipinge lo strato bloccato in ({2}, {3}) senza un blocco movement.toml lì. Lo strato bloccato dice solo all'IA dove non può vedere o costruire; le unità ci camminano ancora. Per tenere lontane le unità, aggiungi un [[block]] con gli stessi x, y e radius a movement.toml"
spa = "{0}: {1}: cover.toml pinta la capa bloqueada en ({2}, {3}) sin un bloque de movement.toml ahí. La capa bloqueada solo indica a la IA dónde no puede ver ni construir; las unidades aún caminan por ella. Para mantener fuera a las unidades, añade un [[block]] con los mismos x, y y radius a movement.toml"
pol = "{0}: {1}: cover.toml maluje warstwę zablokowaną w ({2}, {3}) bez bloku movement.toml w tym miejscu. Warstwa zablokowana mówi tylko SI, gdzie nie może widzieć ani budować; jednostki wciąż po niej chodzą. Aby odciąć jednostki, dodaj [[block]] z tymi samymi x, y i radius do movement.toml"
ru = "{0}: {1}: cover.toml рисует заблокированный слой в ({2}, {3}) без блока movement.toml там. Заблокированный слой лишь говорит ИИ, где он не может видеть или строить; юниты по нему всё ещё ходят. Чтобы не пускать юнитов, добавьте в movement.toml [[block]] с теми же x, y и radius"
cz = "{0}: {1}: cover.toml maluje blokovanou vrstvu v ({2}, {3}) bez bloku movement.toml na tom místě. Blokovaná vrstva jen říká AI, kde nemůže vidět ani stavět; jednotky po ní stále chodí. Chcete-li jednotky nepustit, přidejte do movement.toml [[block]] se stejnými x, y a radius"
jpn = "{0}：{1}：cover.toml が ({2}, {3}) にブロック層を塗っていますが、そこに movement.toml のブロックがありません。ブロック層は AI に見えない・建てられない場所を伝えるだけで、ユニットはその上を歩けます。ユニットを入れないには、movement.toml に同じ x・y・radius の [[block]] を追加してください"
sc = "{0}：{1}：cover.toml 在 ({2}, {3}) 绘制了阻挡层，但该处没有 movement.toml 的阻挡块。阻挡层只告诉 AI 哪里不能观察或建造；单位仍可在上面行走。要阻止单位进入，请在 movement.toml 中添加相同 x、y 和 radius 的 [[block]]"

[e66e31918d1]
us = "{0}: {1}: the open at ({2}, {3}) opened nothing: units could already go there, or it is too small (an open needs a radius of 5 m or more) or out of reach of the ground they use"
fr = "{0} : {1} : l'ouverture à ({2}, {3}) n'a rien ouvert : les unités pouvaient déjà y aller, ou elle est trop petite (une ouverture demande un rayon de 5 m ou plus) ou hors de portée du sol qu'elles utilisent"
ger = "{0}: {1}: die Öffnung bei ({2}, {3}) hat nichts geöffnet: Einheiten konnten schon dorthin, oder sie ist zu klein (eine Öffnung braucht einen Radius von 5 m oder mehr) oder außer Reichweite des Bodens, den sie nutzen"
ita = "{0}: {1}: l'apertura in ({2}, {3}) non ha aperto nulla: le unità potevano già andarci, oppure è troppo piccola (un'apertura richiede un raggio di 5 m o più) o fuori portata del terreno che usano"
spa = "{0}: {1}: la apertura en ({2}, {3}) no abrió nada: las unidades ya podían ir ahí, o es demasiado pequeña (una apertura necesita un radio de 5 m o más) o está fuera del alcance del suelo que usan"
pol = "{0}: {1}: otwarcie w ({2}, {3}) nic nie otworzyło: jednostki już mogły tam iść, albo jest za małe (otwarcie wymaga promienia 5 m lub więcej) albo poza zasięgiem terenu, którego używają"
ru = "{0}: {1}: открытие в ({2}, {3}) ничего не открыло: юниты уже могли туда пройти, или оно слишком маленькое (нужен радиус от 5 м) или вне досягаемости земли, по которой они ходят"
cz = "{0}: {1}: otevření v ({2}, {3}) nic neotevřelo: jednotky tam už mohly, nebo je příliš malé (otevření potřebuje poloměr 5 m nebo víc) či mimo dosah země, kterou používají"
jpn = "{0}：{1}：({2}, {3}) の開放は何も開けませんでした。ユニットはもともと行けたか、小さすぎるか（開放には半径 5 m 以上が必要）、ユニットが使う地面から届きません"
sc = "{0}：{1}：({2}, {3}) 处的开放没有打开任何区域：单位原本就能去，或它太小（开放需要 5 米或以上的半径），或超出了单位所用地面的范围"

[eceb6a0f007]
us = "{0}: {1}: the open at ({2}, {3}) takes in water (at ({4}, {5})): units there stand on the ground under it, on the riverbed or the lake's floor. Leave the open off the water unless that is what you want"
fr = "{0} : {1} : l'ouverture à ({2}, {3}) englobe de l'eau (à ({4}, {5})) : les unités y tiennent sur le sol dessous, sur le lit de la rivière ou le fond du lac. Gardez l'ouverture hors de l'eau, sauf si c'est voulu"
ger = "{0}: {1}: die Öffnung bei ({2}, {3}) schließt Wasser ein (bei ({4}, {5})): Einheiten stehen dort auf dem Boden darunter, auf dem Flussbett oder Seegrund. Lass die Öffnung vom Wasser weg, außer das ist gewollt"
ita = "{0}: {1}: l'apertura in ({2}, {3}) include acqua (in ({4}, {5})): lì le unità stanno sul terreno sotto, sul letto del fiume o sul fondo del lago. Tieni l'apertura fuori dall'acqua, a meno che non sia voluto"
spa = "{0}: {1}: la apertura en ({2}, {3}) abarca agua (en ({4}, {5})): ahí las unidades están en el suelo de debajo, en el lecho del río o el fondo del lago. Deja la apertura fuera del agua salvo que sea lo que quieres"
pol = "{0}: {1}: otwarcie w ({2}, {3}) obejmuje wodę (w ({4}, {5})): jednostki stoją tam na ziemi pod nią, na dnie rzeki lub jeziora. Trzymaj otwarcie z dala od wody, chyba że tego chcesz"
ru = "{0}: {1}: открытие в ({2}, {3}) захватывает воду (в ({4}, {5})): юниты там стоят на земле под ней, на дне реки или озера. Не открывайте воду, если это не нужно"
cz = "{0}: {1}: otevření v ({2}, {3}) zahrnuje vodu (v ({4}, {5})): jednotky tam stojí na zemi pod ní, na dně řeky nebo jezera. Otevření nedávejte na vodu, pokud to tak nechcete"
jpn = "{0}：{1}：({2}, {3}) の開放が水を含んでいます（({4}, {5})）。そこではユニットが川底や湖底など下の地面に立ちます。意図しない限り、開放を水にかけないでください"
sc = "{0}：{1}：({2}, {3}) 处的开放包含水面（在 ({4}, {5})）：单位在那里会站在下方地面，即河床或湖底。除非有意如此，请让开放避开水面"


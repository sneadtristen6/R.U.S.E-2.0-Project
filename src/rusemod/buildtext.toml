fa = "{0}: {1}: برچسب‌های زمین، گیاهان کوتاه و سنگ‌های بسترهای رودِ پرشده می‌مانند: برداشتنشان اشیای صحنهٔ نقشه را بزرگ‌تر از گنجایش یک نقشه می‌کرد. با این حال تصویرهایشان ترمیم می‌شوند"


fa = "{0}: {1}: cover.toml لایهٔ blocked را در ({2}, {3}) رنگ می‌زند، بی‌آن‌که آنجا در movement.toml یک block باشد. لایهٔ blocked فقط به هوش مصنوعی می‌گوید کجا نمی‌تواند ببیند یا بسازد؛ یگان‌ها هنوز روی آن راه می‌روند. برای دور نگه داشتن یگان‌ها، یک [[block]] با همان x، y و radius به movement.toml اضافه کنید"


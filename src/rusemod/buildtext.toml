fr = "{0} : les {1} apparus utilisent les modèles d'unités de {2}, qu'une escarmouche ne charge que si un joueur a {3}, et {4} : le jeu planterait au début de la partie (un test sur D-Day avec des unités japonaises apparues et aucun joueur japonais l'a fait). Faites apparaître des unités dont chaque partie a les modèles, ou laissez celles-ci de côté"
ger = "{0}: die erscheinenden {1} nutzen die Einheitenmodelle von {2}, die ein Gefecht nur lädt, wenn ein Spieler {3} hat, und {4}: das Spiel würde beim Start des Spiels abstürzen (ein D-Day-Test mit erschienenen japanischen Einheiten und ohne japanischen Spieler tat es). Lass Einheiten erscheinen, deren Modelle jedes Spiel hat, oder lass diese weg"
ita = "{0}: i {1} generati usano i modelli delle unità di {2}, che una schermaglia carica solo se un giocatore ha {3}, e {4}: il gioco si bloccherebbe all'inizio della partita (un test su D-Day con unità giapponesi generate e nessun giocatore giapponese l'ha fatto). Genera unità i cui modelli ogni partita ha, o lascia fuori queste"
spa = "{0}: los {1} generados usan los modelos de unidades de {2}, que una escaramuza solo carga si un jugador tiene {3}, y {4}: el juego se colgaría al empezar la partida (una prueba en D-Day con unidades japonesas generadas y sin jugador japonés lo hizo). Genera unidades cuyos modelos tenga cada partida, o deja fuera estas"
pol = "{0}: pojawiające się {1} używają modeli jednostek {2}, które potyczka wczytuje tylko, gdy jakiś gracz ma {3}, a {4}: gra by się wywaliła na starcie rozgrywki (tak było w teście na D-Day z japońskimi jednostkami i bez japońskiego gracza). Każ pojawiać się jednostkom, których modele ma każda rozgrywka, albo pomiń te"
ru = "{0}: появляющиеся {1} используют модели юнитов {2}, которые сражение загружает, только если у игрока есть {3}, а {4}: игра вылетит в начале матча (так было в тесте на D-Day с японскими юнитами без японского игрока). Создавайте юнитов, чьи модели есть в каждом матче, или уберите этих"
cz = "{0}: objevující se {1} používají modely jednotek {2}, které potyčka načte jen tehdy, když má některý hráč {3}, a {4}: hra by spadla na začátku zápasu (stalo se to v testu na D-Day s japonskými jednotkami a bez japonského hráče). Nechte objevovat jednotky, jejichž modely má každý zápas, nebo tyto vynechte"
jpn = "{0}：出現する {1} は {2} のユニットモデルを使いますが、スカーミッシュは誰かが {3} を使うときしかそれを読み込まず、{4}。試合開始時にゲームが落ちます（日本ユニットを出現させ日本のプレイヤーがいない D-Day のテストで実際に落ちました）。全試合にモデルがあるユニットを出現させるか、これらを外してください"
sc = "{0}：生成的 {1} 使用 {2} 的单位模型，而遭遇战只在有玩家使用 {3} 时才加载它们，并且 {4}：游戏会在对局开始时崩溃（一次在 D-Day 生成日本单位且没有日本玩家的测试中发生过）。请生成每场对局都有模型的单位，或去掉这些"
fa = "{0}: {1} ظاهرشده از مدل‌های یگان‌های {2} استفاده می‌کنند، که نبرد آزاد فقط وقتی بارگذاری‌شان می‌کند که بازیکنی {3} را داشته باشد، و {4}: بازی هنگام شروع مسابقه کرش می‌کند (یک آزمایش D-Day با یگان‌های ژاپنی ظاهرشده و بدون بازیکن ژاپنی همین‌طور شد). یگان‌هایی را ظاهر کنید که مدل‌هایشان در هر مسابقه هست، یا این‌ها را کنار بگذارید"


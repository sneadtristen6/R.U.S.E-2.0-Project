pol = "{0}: {1}: cover.toml maluje warstwę zablokowaną w ({2}, {3}) bez bloku movement.toml w tym miejscu. Warstwa zablokowana mówi tylko SI, gdzie nie może widzieć ani budować; jednostki wciąż po niej chodzą. Aby odciąć jednostki, dodaj [[block]] z tymi samymi x, y i radius do movement.toml"

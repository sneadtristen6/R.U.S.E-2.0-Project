# Przewodnik po liczbach po polsku (rusemod.numberinfo; wiążący jest angielski w numberinfo.toml).
[SeuilMort]
what = "Zdrowie"
does = "Ile obrażeń trzeba, by ją zniszczyć. Większość czołgów, pojazdów, oddziałów i dział w grze ma 400: Tigera od jeepa odróżnia głównie poziom pancerza (Pancerz), który zmniejsza obrażenia każdego pocisku, który nie jest na niego dość silny. Budynki mają od 50 do 4500."
[SeuilPinned]
what = "Próg przygwożdżenia"
does = "Ile ostrzału obezwładniającego trzeba, by jednostka została przygwożdżona (przestaje się ruszać i strzela mniej). Pociski spadające blisko, w promieniu obezwładniania amunicji, go zwiększają. Większość jednostek ma 200; wyżej = trudniej przygwoździć."
[ArmureHint]
what = "Pokazywany poziom pancerza"
does = "Poziom pancerza, który pokazują karta jednostki i menu budowy (liczba na tarczy, od 1 do 5). Pole Pancerz w Studio ustawia go razem z samym pancerzem, więc oba zawsze się zgadzają."
[BaseBlindage]
what = "Pancerz"
does = "Pancerz, z którym jednostka walczy (od 1 do 10 w grze): im wyższy, tym mniej obrażeń zadaje jej słabsza amunicja. Zmieniaj go polem Pancerz, które wybiera jeden z poziomów gry i zachowuje liczbę na tarczy karty (sprawdzone w grze)."
[ReculeSeulementSiUberstress]
what = "Cofa się tylko całkiem przygwożdżona"
does = "1: jednostka wycofuje się pod ostrzałem dopiero, gdy jest całkowicie przygwożdżona (skrajne obezwładnienie), nie wcześniej. Ma to 38 jednostek gry."
[VitesseLineaire]
what = "Prędkość"
does = "Jak szybko porusza się poza drogami. Sherman ma 4550 (ok. 35 km/h), jeep 6110 (ok. 47 km/h), oddział strzelców 3120 (ok. 24 km/h)."
["TAvionDescriptor.VitesseLineaire"]
what = "Prędkość lotu"
does = "Jak szybko leci samolot: od 13 000 do 46 800 w grze (ok. 225 do 810 km/h)."
[VitesseLineaireAuSol]
what = "Prędkość na ziemi"
does = "Jak szybko samolot toczy się po lotnisku przy starcie i lądowaniu."
[VitesseLineaireIdle]
what = "Prędkość patrolowa"
does = "Jak szybko samolot leci, krążąc bez zadania, wolniej niż jego pełna prędkość."
[VitesseCombat]
what = "Prędkość w walce"
does = "Jak szybko porusza się w walce. U czołgów i pojazdów zwykle tyle samo co Prędkość; u oddziałów i dział holowanych dużo wolniej (oddział strzelców 1040, ok. 8 km/h; działo przeciwpancerne 520, ok. 4 km/h, pchane przez obsługę)."
[SpeedBonusOnRoad]
what = "Premia prędkości na drodze"
does = "O ile szybciej jedzie po drodze niż poza nią: 0,6 to ok. 60% szybciej. Oddziały i działa dostają ją jako ciężarówka, w którą się zamieniają. Samoloty i ciężarówki mają 1."
[MaxAcceleration]
what = "Przyspieszenie"
does = "Jak szybko się rozpędza: gra co 0,2 sekundy dodaje jedną piątą tej wartości do jej prędkości, więc jej prędkość podzielona przez tę wartość to liczba sekund do pełnej prędkości (pokazana obok pola). Większość czołgów ma 3900: Sherman (4550) osiąga pełną prędkość w około 1,2 s."
[MaxDeceleration]
what = "Hamowanie"
does = "Jak szybko zwalnia i się zatrzymuje: jej prędkość podzielona przez tę wartość to liczba sekund do zatrzymania z pełnej prędkości (pokazana obok pola)."
[TempsDemiTour]
what = "Czas zawracania"
does = "Ile sekund zajmuje jej obrót w przeciwną stronę. Piechota 0,01 (od razu), pojazdy 0,5, czołgi 1, najwolniejsze 6."
[Radius]
what = "Rozmiar na ziemi"
does = "Ile miejsca zajmuje jednostka: inne jednostki trzymają się tak daleko od jej środka, omijając ją. Piechota 104-130 (ok. 0,5 m), czołgi 520-780 (2-3 m), działa 390-650, ciężarówki 2000, budynki 7800-13 000 (30-50 m)."
["TAvionDescriptor.Radius"]
what = "Rozmiar w powietrzu"
does = "Ile miejsca zajmuje samolot, gdy inne samoloty go omijają: od 780 do 2600 (od 3 do 10 m)."
[StickToGround]
what = "Dopasowuje się do terenu"
does = "1: jednostka przechyla się razem ze zboczem, na którym stoi. Ma to każda jednostka naziemna i budynek gry."
[Scale]
what = "Rozmiar modelu"
does = "Tylko wygląd: model 3D jednostki rysowany tyle razy większy. Jednostki mają 1, piechota 0,2, budynki 0,1. Suwak Rozmiar w Studio przy zaimportowanym modelu zmienia zamiast tego sam model."
[DetectionBase]
what = "Zasięg widzenia"
does = "Jak daleko widzi jednostki naziemne. Czołg 104 000 (ok. 400 m); samochody zwiadowcze 234 000 (900 m); samoloty zwiadowcze 195 000 (750 m). Panzer IV z samym 234 000 nie działał jako zwiadowca; pole Rola daje resztę."
[PorteeVisionVolant]
what = "Zasięg widzenia powietrznego"
does = "Jak daleko widzi samoloty. Większość jednostek 208 000 (800 m); niektóre 2600 (10 m: ledwo widzą samoloty)."
[SignatureRadar]
what = "Sygnatura radarowa"
does = "Jako jaki kontakt pojawia się na radarze wroga: 1 jednostki naziemne, 2 budynki, 3 samoloty."
[AltitudeNoise]
what = "Wahania wysokości"
does = "Tylko wygląd: jak bardzo waha się wysokość samolotu w locie (130-260, poniżej 1 m)."
[PorteeAttackReflexAir]
what = "Zasięg samoczynnego ataku (powietrze)"
does = "Jak daleko samolot sam ściga wrogie samoloty, bez rozkazu: od 130 000 do 208 000 (od 500 do 800 m)."
[PorteeAttackReflexSol]
what = "Zasięg samoczynnego ataku (ziemia)"
does = "Jak daleko samolot sam ściga cele naziemne: 182 000 (700 m) u każdego samolotu gry."
[SecondaryWeaponMaxAmmo]
what = "Zabierane bomby lub rakiety"
does = "Ile strzałów drugiej broni (bomb, rakiet) zabiera samolot, zanim wróci się dozbroić: od 1 do 4 w grze."
[ProductionPrice]
what = "Cena"
does = "Ile kosztuje budowa, w $, w każdym z pięciu trybów gry, w kolejności gry: 1945, 1942, 1939, Wojna totalna, Atomowy (gra bierze cenę trybu bitwy)."
[ProductionTime]
what = "Czas budowy"
does = "Ile sekund trwa budowa. Gdy buduje ją kilka fabryk jej rodzaju, czas dzieli się między nie, ale nigdy nie spada poniżej najkrótszego czasu produkcji gry (z karty Ekonomia)."
[UpgradePrice]
what = "Cena badania"
does = "Ile kosztuje zbadanie jej, w $, zanim będzie można ją budować (jednostki badane z innej)."
[UpgradeTime]
what = "Czas badania"
does = "Jak długo trwa badanie, w sekundach."
[IsUpgrade]
what = "Jest ulepszeniem"
does = "1: jednostka jest ulepszeniem tej, z której się ją bada (zastępuje ją w menu budowy po zbadaniu)."
[ShowInMenu]
what = "Widoczna w menu budowy"
does = "1: widoczna w menu budowy w tym trybie gry; jedna wartość na każdy z pięciu, w kolejności gry: 1945, 1942, 1939, Wojna totalna, Atomowy. Czołgi z końca wojny są w grze widoczne tylko w 1945, Wojnie totalnej i trybie Atomowym."
[PositionInMenu]
what = "Miejsce w menu"
does = "Gdzie stoi w swoim menu budowy: jednostki tej samej linii dzielą miejsce, a ulepszenia układają się na nim."
[Factory]
what = "Fabryka"
does = "W którym menu budowy jest (Studio pokazuje każde menu z nazwy i pozwala przenieść jednostkę do menu innego narodu)."
[Menu]
what = "Menu budynków"
does = "Na której stronie menu budynków jest budynek."
[Nationalite]
what = "Naród"
does = "Do którego kraju należy: 0 USA, 1 Niemcy, 2 Wielka Brytania, 3 Francja, 4 Włochy, 5 ZSRR, 6 Japonia."
[InitialFlagSet]
what = "Flagi"
does = "Flagi jednostki: numerowane przełączniki tego, czym jest i co potrafi. Każda jest wyjaśniona w Przewodniku po flagach, pod flagami."
[DescriptorId]
what = "Id"
does = "Własny numer jednostki: każda ma inny, a gra i zapisy gry znajdują ją po nim. Studio daje nowej jednostce wolny."
[TrackingId]
what = "Id statystyk"
does = "Numer, pod którym statystyki końca gry i śledzenie gry znają jednostkę."
[Key]
what = "Klucz"
does = "Liczba, którą nosi kilka jednostek (8 czołgów, 7 samolotów, 2 oddziały); jej zastosowanie nie jest jeszcze znane."
[TypeForAcknow]
what = "Typ głosu"
does = "Którym zestawem kwestii głosowych jednostka odpowiada na rozkazy."
[AcknowUnitType]
what = "Rodzaj głosu"
does = "Jaki rodzaj jednostki wymieniają kwestie głosowe (czołg, piechota, samolot...)."
[IconeType]
what = "Ikona na mapie"
does = "Jaką ikonę pokazuje jednostka na stole z mapą z oddali."
[Category]
what = "Kategoria"
does = "Jako jaki rodzaj jednostki liczy ją gra: 1 zwiad (ustawia to rola Zwiadowczy; sprawdzone w grze), 7 samoloty, 8 i 9 budynki; pozostałe nie mają jeszcze wszystkie nazw."
[CategorieIA]
what = "Kategoria dla komputera"
does = "Do czego komputer używa jednostki: 3 zwiad (pole Rola ustawia to razem z rolą; sprawdzone w grze); pozostałe nie mają jeszcze wszystkie nazw."
[CategoryVolant]
what = "Rola samolotu"
does = "Jako jaki samolot lata (myśliwiec, myśliwsko-bombowy, bombowiec, zwiadowczy, desantowy): jak się porusza i atakuje. Zmieniaj ją polem Rola, które ustawia razem flagi."
[IsDepotForIA]
what = "Skład dla komputera"
does = "1: komputer traktuje ten budynek jako skład zaopatrzenia."
[TypeBatiment]
what = "Typ budynku"
does = "Jakim budynkiem jest dla gry (sztab, koszary, skład...). Budynek-atrapa z flagą 5 i TypeBatiment -7 produkuje naprawdę."
[BuildPolicy]
what = "Gdzie można budować"
does = "Gdzie można postawić budynek: 2 wszędzie (obrona), 3 na płycie składu; bez tej wartości potrzebuje drogi w pobliżu."
[DistanceToRoad]
what = "Odległość od drogi"
does = "Jak blisko drogi trzeba postawić budynek: od 5000 do 31 000 (od 20 do 120 m). Bunkry 8000 (ok. 30 m)."
[CanBeSpawnedInMapMulti]
what = "Można postawić na mapach wieloosobowych"
does = "1: budynek można umieścić w scenariuszu mapy wieloosobowej."
["TBatimentPaths.Radius"]
what = "Ścieżki wokół budynku"
does = "Jak daleko wokół budynku biegną ścieżki jednostek."
[TirEnMouvement]
what = "Strzela w ruchu"
does = "1: ta broń może strzelać, gdy jednostka jedzie."
[SalveNumber]
what = "Numer salwy"
does = "W której salwie strzela ta broń (-1: strzela sama, nie salwami)."
["TWeaponDescriptor.Salves"]
what = "Salwy"
does = "Czy broń strzela salwami (1), czy strzał po strzale (-1)."
[Puissance]
what = "Obrażenia"
does = "Obrażenia jednego trafienia, przed pancerzem. Broń strzelecka 2-10, działa czołgowe od dziesiątek do setek, bomby i V2 znacznie więcej (do 2 000 000 przy bombie atomowej). Jednostka ginie, gdy otrzymane obrażenia osiągną jej Zdrowie."
[Level]
what = "Poziom amunicji"
does = "Poziom amunicji (od 1 do 5). Gra waży go względem pancerza celu: amunicja wyższego poziomu zadaje więcej obrażeń jednostkom opancerzonym. Jak dokładnie je porównuje, jeszcze nie zmierzono."
[Arme]
what = "Rodzaj broni"
does = "Jaka broń ją wystrzeliwuje (karabin maszynowy, armata, haubica, bomba...): na jakie cele jest dobra i ikona na karcie."
[PorteeMaximale]
what = "Zasięg"
does = "Jak daleko może trafić: od 13 000 (50 m) do 2 600 000 (10 km, V2). Działa czołgowe zwykle 65 000-130 000 (250-500 m)."
[PorteeMinimale]
what = "Zasięg minimalny"
does = "Bliżej nie może strzelać (artyleria i moździerze): od 13 000 do 169 000 (od 50 do 650 m)."
[TempsEntreDeuxTirs]
what = "Czas między strzałami"
does = "Sekundy między dwoma strzałami: 0,2 karabin maszynowy, kilka sekund działo czołgowe, do 60 najcięższe działa. Mniej = więcej strzałów."
[TempsEntreDeuxSalves]
what = "Czas między salwami"
does = "Sekundy między dwiema salwami, w broni strzelającej salwami (wyrzutnie rakiet, bomby)."
[NbTirParSalves]
what = "Strzały na salwę"
does = "Ile strzałów oddaje jedna salwa: od 1 do 100."
[AngleDispersion]
what = "Rozrzut"
does = "Jak daleko strzały odchodzą od punktu celowania: od 0,01 (ok. pół stopnia, bardzo celnie) do 0,3 (17 stopni, artyleria)."
[PourcentageTirDirect]
what = "Celność w miejscu"
does = "Jak prawdopodobne jest trafienie, gdy jednostka stoi: od 0,5 do 1 (od 50% do 100%)."
[PourcentageTirDirectEnMouvement]
what = "Celność w ruchu"
does = "Jak prawdopodobne jest trafienie, gdy jednostka jedzie: od 0,4 do 1 (od 40% do 100%)."
[RayonPinned]
what = "Promień obezwładniania"
does = "Jak daleko od miejsca uderzenia pocisk obezwładnia jednostki (zwiększa ich licznik przygwożdżenia): od 130 (pół metra) do 78 000 (300 m)."
[TirIndirect]
what = "Ogień pośredni"
does = "1: amunicja jest wystrzeliwana ogniem pośrednim, ponad przeszkodami, w cele wykryte przez innych (artyleria)."
[AllowAmbushShot]
what = "Może strzelać z zasadzki"
does = "1: amunicję można wystrzelić z zasadzki w lesie."
[ProjectileType]
what = "Rodzaj pocisku"
does = "Tylko wygląd: jaki strzał jest rysowany w locie (pocisk, kula, rakieta, bomba)."
[AmmunitionId]
what = "Id amunicji"
does = "Własny numer amunicji (1000-1138): każda ma inny. Studio daje kopii wolny."
[NeedModelChange]
what = "Zmienia model przy strzale"
does = "Tylko wygląd: 1 przy broni przeciwpancernej oddziałów: żołnierz przełącza się przy strzale na model, który ją trzyma."
[TempsAnimation]
what = "Czas animacji strzału"
does = "Tylko wygląd: jak długo trwa animacja strzału żołnierza (1,6 s przy broni przeciwpancernej oddziałów)."
[FX_vitesse_de_depart]
what = "Prędkość strzału (rysowanego)"
does = "Tylko wygląd: jak szybko rysowany strzał opuszcza broń, w jednostkach gry na sekundę: od 150 do 520 000 (2000 m na sekundę)."
[FX_frottement]
what = "Opór strzału (rysowanego)"
does = "Tylko wygląd: jak szybko rysowany strzał zwalnia w powietrzu."
[FX_tir_tendu]

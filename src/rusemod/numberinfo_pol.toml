[IconeType]
what = "Ikona na mapie"
does = "Jaką ikonę pokazuje jednostka na stole z mapą z oddali."
[Category]
what = "Kategoria"
does = "Jako jaki rodzaj jednostki liczy ją gra: 1 zwiad (ustawia to rola Zwiadowczy; sprawdzone w grze), 7 samoloty, 8 i 9 budynki; pozostałe nie mają jeszcze wszystkie nazw."

does = "Tylko wygląd: 1 rysuje strzał płasko i prosto zamiast łukiem."
[FX_tir_sans_physic]
what = "Strzał rysowany bez fizyki"
does = "Tylko wygląd: 1 rysuje strzał bez grawitacji i oporu."

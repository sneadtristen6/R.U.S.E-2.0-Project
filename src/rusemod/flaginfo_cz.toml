# Průvodce flagy česky (rusemod.flaginfo; rozhoduje angličtina ve flaginfo.toml).
[0]
what = "Letiště"
does = "Udělá z budovy letiště: tvá letadla tu mají základnu a kliknutí letadlem na vlastní letiště ho pošle přistát. Plánování průzkumu počítače nějaké hledá."
use = "Jen pro letiště. Na něčem jiném ho hra bere jen jako místo, kde mohou letadla přistát."

[1]
what = "Dělostřelectvo (nepřímá palba)"
does = "Jednotka střílí nepřímo na to, co objeví jiné jednotky, jako houfnice ve hře. Také řekne počítači, aby ji použil jako dělostřelectvo."
use = "Funguje u každé jednotky: DomesticNukes ho dal 410 jednotkám všech druhů a všechny střílely nepřímo."

[2]
what = "Letadlo"
does = "Jednotka je letadlo: staví se u řídicí věže letiště, vrací se tankovat, nebere pozemní rozkazy. Mají ho všech 63 letadel hry a nic jiného."
use = "Nechte na každém letadle. Nikdy ho nedávejte pozemní jednotce: hra by se ji snažila stavět u řídicí věže letiště."
danger_why = "U jednotky, která není letadlo, by její stavba měla zastavit hru chybou skriptu (hledá řídicí věž letiště)."

[3]
what = "Letadlo smí útočit bez zapojení"
does = "Hra ho nastaví, když letadlo vzlétá na misi."
use = "Vynechte: spravuje ho hra."

[4]
what = "Budova"
does = "Jde o budovu: panel budovy, pravidla umísťování a dobývání, mimo statistiky jednotek. Budova se nikdy nehýbe a nepřemýšlí jako jednotka."
use = "Jen pro budovy."
danger_why = "U jednotky by ji měl zmrazit: budovy se nehýbou a neberou rozkazy jednotek."

[5]
what = "Výrobní budova"
does = "Budova, která vyrábí jednotky (kasárny, továrny, letiště). Dosazený místo 30 (s TypeBatiment -7) zajistí, že klamná budova vyrábí doopravdy."
use = "Pro budovy, které staví jednotky."

[6]

# La guía de banderas en español (rusemod.flaginfo; manda el inglés de flaginfo.toml).
[0]
what = "Aeródromo"
does = "Convierte un edificio en aeródromo: tus aviones tienen allí su base, y hacer clic con un avión en tu propio aeródromo lo manda a aterrizar. La planificación de reconocimiento del ordenador busca uno."
use = "Solo para aeródromos. En otra cosa, el juego solo lo trata como un sitio donde los aviones pueden aterrizar."

[1]
what = "Artillería (fuego indirecto)"
does = "La unidad dispara de forma indirecta, a lo que otras unidades avistan, como los obuses del juego. También le dice al ordenador que la use como artillería."
use = "Funciona en cualquier unidad: DomesticNukes se la dio a 410 unidades de todo tipo y todas dispararon de forma indirecta."

[2]
what = "Avión"
does = "La unidad es un avión: se construye en la torre de control del aeródromo, vuelve a repostar y no recibe órdenes de tierra. Los 63 aviones del juego la tienen, y nada más."
use = "Déjala en cada avión. No la pongas nunca en una unidad de tierra: el juego intentaría construirla en la torre de control de un aeródromo."
danger_why = "En una unidad que no es un avión, construirla debería detener el juego con un error de script (busca la torre de control de un aeródromo)."

[3]

# The field brush's LOOKS: what it turns a whole field under it into, keeping the field's own rows,
# outline and hedges. `sources`: real D-Day fields of the look, each [x, y (the middle), the rows'
# facing (degrees), inside along and across (map units), its crops' turn against the facing, its
# ground colour, its row sticker kind]: a brushed field takes ONE source's colour (the picture under the
# field is tinted to it), its row sticker kind and its crops (copied from its middle square, turned to
# the rows), so it is that real field near and far. A look is what the source's middle shows: the
# picture's hue from far, its row stickers and its crops (measured on D-Day's fields, 2026-10-15).
# `stickers` and `colour`: the look's own, for a source without them.
# `field_kinds`: the map's field sticker kinds it swaps (name prefixes); `crops`: the crop plants it
# replaces (prefixes); `hay`: whether the map's own fields of the look carry hay (false: the hay and
# carts on a field it makes go, its tractors too past 3 m in); `trees_within`: the deepest (m from
# the field's edge) the look's fields carry trees (none: any depth); `masks`: per source, its row
# pieces' detail-ring flags, "flag:count" (a brushed field's pieces take its source's).


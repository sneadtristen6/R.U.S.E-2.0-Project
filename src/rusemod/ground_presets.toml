# over and over (rusemod.groundtex: swatch:<theme>:<name>). x, y the square's middle, side its side (map units, 260 a
# metre); facing the way a field's rows run (degrees from +x toward +y). Measured on D-Day (2026-10-16):
# a plain material where its own ground stickers are most of the decals and no building, road or water

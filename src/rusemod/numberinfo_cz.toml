[TempsENtreDeuxCamionsEnConvoiMax]
what = "Rozestup aut v konvoji (max.)"
does = "Nejdelší doba, v sekundách, mezi výjezdem dvou aut téhož konvoje. 1,5 ve hře."
[RatioForDepotNearlyDepleted]

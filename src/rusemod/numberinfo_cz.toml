does = "Body preference přidané každé jednotce, kterou ještě musí vyzkoumat (seznam výzkumu hry ji ještě nevede jako hotovou), takže víc zkoumá. Prototyp +400."
[BonusUnitesTank]
what = "Preference: tanky"
does = "Body preference přidané každému tanku, který může postavit. Žádná sada hry ji nepoužívá, takže ji karta Počítač nemůže nabídnout (Přidat nabízí jen hodnoty, které uvádí Výchozí); skripty kampaně ano (Bonus_Tank, 150 až 200)."
[BonusBatimentOTF]

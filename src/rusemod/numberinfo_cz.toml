does = "Šance, od 0 do 1, že prohlédne maketu na místě, které brání nebo napadá; hra ji losuje každých 24 sekund. Výchozí 0,5 (50 %); Nízká 0,1; Vysoká 0,8."
[TempsMemorisationUnitInvisible]

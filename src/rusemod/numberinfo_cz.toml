# --- počítačoví hráči (karta Počítač) ---
[AttaqueTempsActivation]
what = "Sekundy před zahájením útoků"
does = "Kolik sekund bitvy čeká, než vůbec zaútočí; do té doby ani neobtěžuje a neposílá pomoc ohroženému skladu. Výchozí 30; Nízká 300 (5 minut); Želva 600 (10 minut). Vysoká a Blitzkrieg ji neuvádějí, takže počítají 0: útočí od první sekundy."
[OffensiveNbMissionMax]
what = "Nejvíc útoků najednou"
does = "Nejvíc útoků (a odvet), které vede současně. -1 znamená bez omezení, což používají všechny sady hry."
[MissionFacteurLancementAttaque]
what = "Agresivita (práh útoku)"
does = "To, čemu návrháři misí hry říkají jeho agresivita (Agressivite, kterou skripty kampaně mění během mise): hra ji násobí pevným činitelem a porovnává síly na místě, než tam zaútočí. Sady hry: Výchozí 0,7; Nízká a Blitzkrieg 0,2; Vysoká 0,9; Želva 1. Kterým směrem ho vyšší číslo posouvá, zatím není změřeno: vyzkoušejte ve hře."
[MissionFacteurEnoughToDestroy]
what = "Síla proti nepříteli"
does = "Kolik síly pošle do útoku, jako násobek síly nepřítele na místě (návrháři misí tomu říkají posila pro útok, Renfort_pour_attaque). Výchozí 1,2; Nízká 0,2; Střední 1,4; Vysoká 1,8; Blitzkrieg 1,5; Želva 1."
[DefenseDistanceMenace]
what = "Vzdálenost hrozby"
does = "Jak daleko od místa, které brání, se nepřítel počítá jako hrozba; hra udělá hlídanou zónu asi 1,4krát větší (vzdálenost krát odmocnina ze 2). 312 000 (1 200 m) v sadách hry; Želva 26 000 000 (100 km: vše na mapě je hrozba)."
[DefenseDistanceUrgent]
what = "Vzdálenost naléhavé hrozby"
does = "Jak blízko k místu, které brání, musí nepřítel přijít, aby byla obrana naléhavá (Distance_Defense_Urgente návrhářů misí, vedle vzdálenosti hrozby). Výchozí 156 000 (600 m); Vysoká 208 000 (800 m); Blitzkrieg 78 000 (300 m)."
[DefenseMaxUnitOnPosition]
what = "Jednotky posílané k nenaléhavé obraně"
does = "Kolik svých jednotek pošle k obraně, která není naléhavá (Nbre_Unit_Defense_Non_Urgente návrhářů misí). Výchozí 1; Střední 2; Vysoká 3; Želva 6."
[DefenseNbMissionMax]
what = "Nejvíc míst bráněných najednou"
does = "Nejvíc obranných misí (míst, která hlídá), které vede současně. Výchozí 2; Nízká a Vysoká 4; Želva 10. Blitzkrieg ji neuvádí, takže počítá 0 a nehlídá nic."
[HarcelementActif]
what = "Obtěžuje nepřítele"
does = "1: obtěžuje (malé nájezdy, jakmile skončí jeho čekání před útokem). 0: nikdy. Nízká a Želva ji neuvádějí, takže počítají 0 a nikdy neobtěžují."
[UpgradeActifPourHarcelement]
what = "Vylepšení pro obtěžování"
does = "Zda smí na nájezdy použít vylepšené jednotky. Nízká a Blitzkrieg ji neuvádějí (0)."
[CashReserveTempsActivation]
what = "Sekundy před držením peněžní rezervy"
does = "Kolik sekund bitvy smí utratit všechny peníze; potom odkládá peníze, které potřebují objednané budovy, než koupí jednotky. 240 (4 minuty) ve všech sadách hry."
[PercentMoneyToReserveForBatimentAdmin]
what = "% peněz na administrativní budovy"
does = "Podíl jeho peněz, v %, který drží na administrativní budovy (zvyšují příjem). 20 % v sadách hry; Vysoká 25 %. Kde ho hra čte, zatím není nalezeno."
[PercentMoneyToUseForIdle]
what = "% peněz utracených v nečinnosti"
does = "Podíl jeho peněz, v %, který smí utratit za jednotky, když nemá nic jiného na práci: čísla Staví v nečinnosti níže. Při 0 v nečinnosti nikdy nestaví a ta čísla nic nedělají. Výchozí a Nízká 0; Střední 50 %; Vysoká 100 %."
[DeviseBonusIA]
what = "Peníze navíc na začátku (podvod)"
does = "Peníze navíc, které dostane na začátku bitvy, v $. Má je jen Vysoká: 150 $ k 200 $, se kterými začíná každý hráč."
[IncomeBonusIA]
what = "Příjem navíc při každé platbě (podvod)"
does = "Peníze navíc, v $, přidané ke každé jeho výplatě příjmu. Má je jen Vysoká: 1 $."
[NbBatimentAdministratifEnPlusAvantDesactivation]
what = "Administrativní budovy navíc před zastavením"
does = "Kolik administrativních budov nad potřebu postaví, než přestane; -1 znamená bez omezení. Výchozí a profily -1; Vysoká 2; Nízká a Střední ji neuvádějí, takže počítají 0: žádné nad potřebu."
[DepotNbEnPlusAvantDesactivation]
what = "Sklady navíc před zastavením"
does = "Kolik zásobovacích skladů se snaží získat navíc k těm, co má, dokud jsou místa pro sklady k zabrání. Výchozí 2; Střední 3; Vysoká 4; Blitzkrieg 1; Nízká ji neuvádí (0)."
[ValueDepotMinForTruckFactory]
what = "Nejmenší hodnota skladů pro továrnu na nákladní auta"
does = "Než postaví továrnu na nákladní auta u skupiny skladů, musí ty sklady ještě mít aspoň tolik zásob, v $: zbývající náklady nákladních aut krát 3 $ za náklad (6 $ v Nukleárním režimu), což hra nazývá dostupnými penězi skladu. 100 $ ve všech sadách: pět Shermanů, polovina 200 $ na začátku hráče."
[MinutesLeftMinForTruckFactory]
what = "Nejméně zbývajících minut pro továrnu na nákladní auta"
does = "V bitvě s časovým limitem postaví továrnu na nákladní auta, jen dokud zbývá aspoň tolik minut. 5 ve všech sadách."
[NbDepotMinForTruckFactory]
what = "Nejméně skladů pro továrnu na nákladní auta"
does = "Kolik skladů potřebuje skupina (jeho vlastní a jiné ve vzdálenosti skupiny skladů), než u ní postaví továrnu na nákladní auta. 2 ve všech sadách."
[NbUnitsDangerousDepot]
what = "Jednotky, kvůli nimž je sklad nebezpečný"
does = "Kolik jednotek napočítá kolem jednoho ze svých skladů, než ho bere jako ohrožený a pošle pomoc. Výchozí 1; Želva 4; Vysoká a Blitzkrieg ji neuvádějí (0)."
[SeuilDistanceGroupeDepot]
what = "Vzdálenost skupiny skladů"
does = "Když vybírá, kam dát novou továrnu na nákladní auta, sklady v této vzdálenosti od středu jeho vzdálených skladů, měřené cestou, kudy jdou jednotky, se počítají jako jedna skupina; továrna stane u skladu skupiny nejblíže jeho základně. 234 000 (900 m) ve všech sadách."
[SeuilDistanceTruckFactory]
what = "Vzdálenost továrny na nákladní auta"
does = "Postaví další továrnu na nákladní auta, když je některý jeho sklad aspoň tak daleko od jeho nejbližší továrny na nákladní auta, měřeno cestou, kudy jezdí nákladní auta, ne vzdušnou čarou (jen když už továrnu na nákladní auta má). Výchozí a profily 520 000 (2 000 m); každá obtížnost 780 000 (3 000 m), a protože to žádný profil nemění, v bitvě platí 3 000 m."
[NbMaxProductionForEnnemyUnit]
what = "Nejvíc jednotek postavených proti jedné nepřátelské"
does = "Nejvíc jednotek, které postaví jako odpověď na jednu nepřátelskou jednotku. 1 ve všech sadách. Kde ho hra čte, zatím není nalezeno."
[NbProdIdleInfanterie]

does = "1: když nemá nic jiného na práci, smí také spustit výzkum. Má to jen Prototyp."
[BonusUnitesAvions]
what = "Preference: letadla"
does = "Body preference přidané každému letadlu, které může postavit. Preference se sčítají pro každou jednotku a počítají se jen rozdíly mezi jeho jednotkami: hodnotí každou jednotku podle toho, jak daleko je pod jeho nejoblíbenější. Letectvo +500 dělá z letadel jeho jasného favorita."
[BonusUnitesArtillerie]
what = "Preference: dělostřelectvo"
does = "Body preference přidané každé dělostřelecké jednotce, kterou může postavit (jak se sčítají, viz Preference: letadla). Houfnice +8 000 staví dělostřelectvo daleko před vše ostatní."
[BonusUnitesExperimentales]

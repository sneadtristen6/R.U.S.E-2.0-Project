does = "Jak daleko letadlo samo pronásleduje nepřátelská letadla bez rozkazu: 130 000 až 208 000 (500 až 800 m)."
[PorteeAttackReflexSol]
what = "Dosah samostatného útoku (zem)"
does = "Jak daleko letadlo samo pronásleduje pozemní cíle: 182 000 (700 m) u každého letadla hry."
[SecondaryWeaponMaxAmmo]
what = "Nesené bomby nebo rakety"
does = "Kolik ran své druhé zbraně (bomby, rakety) letadlo nese, než letí domů přezbrojit: 1 až 4 ve hře."
[ProductionPrice]
what = "Cena"
does = "Kolik stojí stavba, v $, v každém z pěti herních režimů, v pořadí hry: 1945, 1942, 1939, Totální válka, Nukleární (hra bere cenu režimu bitvy)."
[ProductionTime]
what = "Doba stavby"
does = "Kolik sekund trvá stavba. Staví-li ji více továren jejího druhu, čas se mezi ně dělí, ale nikdy neklesne pod nejkratší dobu výroby hry (z karty Ekonomika)."
[UpgradePrice]
what = "Cena výzkumu"
does = "Kolik stojí výzkum, v $, než ji lze stavět (jednotky vyzkoumané z jiné)."
[UpgradeTime]
what = "Doba výzkumu"
does = "Jak dlouho trvá výzkum, v sekundách."
[IsUpgrade]
what = "Je vylepšení"
does = "1: jednotka je vylepšením té, ze které se zkoumá (po výzkumu ji nahradí v nabídce stavby)."
[ShowInMenu]
what = "Zobrazena v nabídce stavby"
does = "1: zobrazena v nabídce stavby v tom herním režimu; jedna hodnota pro každý z pěti, v pořadí hry: 1945, 1942, 1939, Totální válka, Nukleární. Pozdní tanky hry jsou zobrazeny jen v 1945, Totální válce a Nukleárním režimu."
[PositionInMenu]
what = "Místo v nabídce"
does = "Kde stojí ve své nabídce stavby: jednotky stejné linie sdílejí místo, vylepšení se na něj vrší."
[Factory]
what = "Továrna"
does = "Ve které nabídce stavby je (Studio ukazuje každou nabídku jménem a dovolí přesunout jednotku do nabídky jiného národa)."

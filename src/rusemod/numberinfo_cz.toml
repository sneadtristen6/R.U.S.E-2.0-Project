# Průvodce čísly česky (rusemod.numberinfo; závazná je angličtina v numberinfo.toml).
[SeuilMort]
what = "Zdraví"
does = "Kolik poškození je potřeba k jejímu zničení. Většina tanků, vozidel, družstev a děl ve hře má 400: Tiger je odolnější než džíp hlavně díky úrovni pancéřování (Pancéřování), která snižuje poškození každého výstřelu, který na něj není dost silný. Budovy mají od 50 do 4 500."
[SeuilPinned]
what = "Práh přišpendlení"
does = "Kolik potlačení je potřeba, než je jednotka přišpendlena k zemi (přestane postupovat a střílí méně). Výstřely dopadající blízko, v poloměru potlačení munice, ho zvyšují. Většina jednotek má 200; vyšší = hůř přišpendlit."
[ArmureHint]
what = "Zobrazená úroveň pancéřování"
does = "Úroveň pancéřování, kterou ukazují karta jednotky a nabídka stavby (číslo na štítu, 1 až 5). Pole Pancéřování ve Studiu ji nastavuje spolu se samotným pancéřováním, takže se vždy shodují."
[BaseBlindage]
what = "Pancéřování"
does = "Pancéřování, se kterým jednotka bojuje (1 až 10 ve hře): čím vyšší, tím méně poškození jí dává slabší munice. Měňte ho polem Pancéřování, které vybere jednu z úrovní hry a zachová číslo na štítu karty (ověřeno ve hře)."
[ReculeSeulementSiUberstress]
what = "Ustupuje jen zcela přišpendlená"
does = "1: jednotka pod palbou ustoupí, až když je zcela přišpendlená (extrémní potlačení), ne dřív. Má to 38 jednotek hry."
[VitesseLineaire]
what = "Rychlost"
does = "Jak rychle se pohybuje mimo silnice. Sherman má 4 550 (asi 35 km/h), džíp 6 110 (asi 47 km/h), střelecké družstvo 3 120 (asi 24 km/h)."
["TAvionDescriptor.VitesseLineaire"]
what = "Rychlost letu"
does = "Jak rychle letadlo letí: 13 000 až 46 800 ve hře (asi 225 až 810 km/h)."
[VitesseLineaireAuSol]
what = "Rychlost na zemi"
does = "Jak rychle letadlo pojíždí po letišti při startu a přistání."
[VitesseLineaireIdle]
what = "Hlídková rychlost"
does = "Jak rychle letadlo letí, když krouží bez úkolu, pomaleji než jeho plná rychlost."
[VitesseCombat]
what = "Rychlost v boji"
does = "Jak rychle se pohybuje v boji. U tanků a vozidel obvykle stejná jako Rychlost; u družstev a tažených děl mnohem pomalejší (střelecké družstvo 1 040, asi 8 km/h; protitankové dělo 520, asi 4 km/h, tlačené obsluhou)."
[SpeedBonusOnRoad]
what = "Bonus rychlosti na silnici"
does = "O kolik rychleji jede po silnici než mimo ni: 0,6 je asi o 60 % rychleji. Družstva a děla ho dostávají jako nákladní auto, ve které se mění. Letadla a nákladní auta mají 1."
[MaxAcceleration]
what = "Zrychlení"
does = "Jak rychle nabere rychlost: hra každých 0,2 sekundy přičte k její rychlosti pětinu této hodnoty, takže její rychlost dělená touto hodnotou je počet sekund do plné rychlosti (zobrazeno vedle pole). Většina tanků má 3 900: Sherman (4 550) je na plné rychlosti asi za 1,2 s."
[MaxDeceleration]
what = "Brzdění"
does = "Jak rychle zpomalí a zastaví: její rychlost dělená touto hodnotou je počet sekund do zastavení z plné rychlosti (zobrazeno vedle pole)."
[TempsDemiTour]
what = "Doba otočení"
does = "Kolik sekund trvá otočit se opačným směrem. Pěchota 0,01 (hned), vozidla 0,5, tanky 1, nejpomalejší 6."
[Radius]
what = "Velikost na zemi"
does = "Kolik místa jednotka zabírá: ostatní jednotky se drží tak daleko od jejího středu, když ji objíždějí. Pěchota 104–130 (asi 0,5 m), tanky 520–780 (2–3 m), děla 390–650, nákladní auta 2 000, budovy 7 800–13 000 (30–50 m)."
["TAvionDescriptor.Radius"]
what = "Velikost ve vzduchu"
does = "Kolik místa letadlo zabírá, když ho jiná letadla obletují: 780 až 2 600 (3 až 10 m)."
[StickToGround]
what = "Kopíruje terén"
does = "1: jednotka se naklání se svahem, na kterém stojí. Má to každá pozemní jednotka a budova hry."
[Scale]
what = "Velikost modelu"
does = "Jen vzhled: 3D model jednotky kreslený tolikrát větší. Jednotky mají 1, pěchota 0,2, budovy 0,1. Posuvník Velikost ve Studiu u importovaného modelu místo toho mění samotný model."
[DetectionBase]
what = "Dohled"
does = "Jak daleko vidí pozemní jednotky. Tank 104 000 (asi 400 m); průzkumná vozidla 234 000 (900 m); průzkumná letadla 195 000 (750 m). Panzer IV jen s 234 000 nejednal jako průzkumník; zbytek dá pole Role."
[PorteeVisionVolant]
what = "Dohled na letadla"
does = "Jak daleko vidí letadla. Většina jednotek 208 000 (800 m); některé 2 600 (10 m: letadla skoro nevidí)."
[SignatureRadar]
what = "Radarová stopa"
does = "Jako jaký kontakt se ukazuje na nepřátelském radaru: 1 pozemní jednotky, 2 budovy, 3 letadla."
[AltitudeNoise]
what = "Kolísání výšky"
does = "Jen vzhled: jak moc kolísá výška letadla za letu (130–260, méně než 1 m)."
[PorteeAttackReflexAir]

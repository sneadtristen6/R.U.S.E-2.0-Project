does = "Body preference přidané každé obranné budově (bunkry a dělostřelecká postavení: flag 6). Také ho víc vedou stavět obranu na místech, která hlídá: hra to váží jako 0,5 + tato hodnota / 200, tedy 1,5 při +200 Želvy proti 0,5 při 0."
[PourcentChanceUtiliserCarteManipAuDebut]

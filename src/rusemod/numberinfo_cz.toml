does = "Jak tvrdě odpoví po ztrátě bojových jednotek, jako násobek; skripty kampaně ho nastavují spolu s faktorem pro nebojové jako jedno nastavení odvety (Represailles, 1 nebo 2). Výchozí 1; Nízká 0,5; Vysoká 2; Želva ho neuvádí (0: žádná odveta za ně)."
[RepresailleFacteurUniteNonCombattante]

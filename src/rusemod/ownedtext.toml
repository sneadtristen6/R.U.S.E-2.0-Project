# The words of the "owned copies only" box (rusemod.owned), for both apps, in the game's ten languages.
# Starter translations: corrections welcome. Language codes are the game's folders: us fr ger ita spa pol ru cz jpn sc.

[title]
us = "We couldn't confirm this copy of R.U.S.E."
fr = "Nous n'avons pas pu confirmer cette copie de R.U.S.E."
ger = "Diese Kopie von R.U.S.E. konnte nicht bestätigt werden."
ita = "Non siamo riusciti a confermare questa copia di R.U.S.E."
spa = "No hemos podido confirmar esta copia de R.U.S.E."
pol = "Nie udało się potwierdzić tej kopii R.U.S.E."
ru = "Не удалось подтвердить эту копию R.U.S.E."
cz = "Tuto kopii R.U.S.E. se nepodařilo ověřit."
jpn = "この R.U.S.E. のコピーを確認できませんでした。"
sc = "无法确认这份 R.U.S.E. 副本。"
fa = "نتوانستیم این نسخهٔ R.U.S.E. را تأیید کنیم"

[why_no_steam_record]
us = "Steam has no record of R.U.S.E. installed in this folder."
fr = "Steam n'a aucune trace de R.U.S.E. installé dans ce dossier."
ger = "Steam kennt keine Installation von R.U.S.E. in diesem Ordner."
ita = "Steam non risulta aver installato R.U.S.E. in questa cartella."
spa = "Steam no tiene constancia de R.U.S.E. instalado en esta carpeta."
pol = "Steam nie ma zapisu o instalacji R.U.S.E. w tym folderze."
ru = "Steam не знает об установке R.U.S.E. в этой папке."
cz = "Steam nemá záznam o instalaci R.U.S.E. v této složce."
jpn = "このフォルダーに R.U.S.E. がインストールされた記録が Steam にありません。"
sc = "Steam 没有在此文件夹中安装 R.U.S.E. 的记录。"
fa = "Steam هیچ سابقه‌ای از نصب R.U.S.E. در این پوشه ندارد."

[why_steam_file]
us = "Steam's own file in the game folder (steam_api64.dll) is missing, changed, or not Valve's."
fr = "Le fichier de Steam dans le dossier du jeu (steam_api64.dll) manque, a été modifié ou ne vient pas de Valve."
ger = "Die Steam-Datei im Spielordner (steam_api64.dll) fehlt, wurde verändert oder stammt nicht von Valve."
ita = "Il file di Steam nella cartella del gioco (steam_api64.dll) manca, è stato modificato o non è di Valve."
spa = "El archivo de Steam en la carpeta del juego (steam_api64.dll) falta, se ha cambiado o no es de Valve."
pol = "Plik Steam w folderze gry (steam_api64.dll) nie istnieje, został zmieniony lub nie pochodzi od Valve."
ru = "Файл Steam в папке игры (steam_api64.dll) отсутствует, изменён или не от Valve."
cz = "Soubor Steamu ve složce hry (steam_api64.dll) chybí, byl změněn nebo není od Valve."
jpn = "ゲームフォルダーの Steam のファイル (steam_api64.dll) がないか、変更されているか、Valve のものではありません。"
sc = "游戏文件夹中的 Steam 文件 (steam_api64.dll) 缺失、被修改或并非来自 Valve。"
fa = "فایل خود Steam در پوشهٔ بازی (steam_api64.dll) گم شده، تغییر کرده یا مال Valve نیست."

[why_fake_steam]
us = "The game folder has files that make the game run without Steam: {names}."
fr = "Le dossier du jeu contient des fichiers qui font tourner le jeu sans Steam : {names}."
ger = "Im Spielordner liegen Dateien, mit denen das Spiel ohne Steam läuft: {names}."
ita = "La cartella del gioco contiene file che fanno girare il gioco senza Steam: {names}."
spa = "La carpeta del juego tiene archivos que hacen funcionar el juego sin Steam: {names}."
pol = "W folderze gry są pliki, dzięki którym gra działa bez Steam: {names}."
ru = "В папке игры есть файлы, позволяющие запускать игру без Steam: {names}."
cz = "Ve složce hry jsou soubory, se kterými hra běží bez Steamu: {names}."
jpn = "ゲームフォルダーに、Steam なしでゲームを動かすファイルがあります: {names}"
sc = "游戏文件夹中有让游戏脱离 Steam 运行的文件：{names}。"
fa = "پوشهٔ بازی فایل‌هایی دارد که بازی را بدون Steam اجرا می‌کنند: {names}."

[body]
us = "R.U.S.E. 2.0 works only with a copy of the game you own. Until this one is confirmed, Play and Test in game stay off."
fr = "R.U.S.E. 2.0 ne fonctionne qu'avec une copie du jeu que vous possédez. Tant que celle-ci n'est pas confirmée, Jouer et Tester en jeu restent désactivés."
ger = "R.U.S.E. 2.0 funktioniert nur mit einer Kopie des Spiels, die dir gehört. Bis diese bestätigt ist, bleiben Spielen und Im Spiel testen aus."
ita = "R.U.S.E. 2.0 funziona solo con una copia del gioco che possiedi. Finché questa non è confermata, Gioca e Prova nel gioco restano disattivati."
spa = "R.U.S.E. 2.0 solo funciona con una copia del juego que poseas. Hasta que esta se confirme, Jugar y Probar en el juego seguirán desactivados."
pol = "R.U.S.E. 2.0 działa tylko z kopią gry, którą posiadasz. Dopóki ta nie zostanie potwierdzona, Graj i Testuj w grze pozostają wyłączone."
ru = "R.U.S.E. 2.0 работает только с копией игры, которая у вас есть. Пока эта копия не подтверждена, «Играть» и «Проверить в игре» отключены."
cz = "R.U.S.E. 2.0 funguje jen s kopií hry, kterou vlastníte. Dokud tato není ověřena, Hrát a Vyzkoušet ve hře zůstanou vypnuté."
jpn = "R.U.S.E. 2.0 は、お持ちのゲームのコピーでのみ動作します。このコピーが確認されるまで、「プレイ」と「ゲームでテスト」は使えません。"
sc = "R.U.S.E. 2.0 只能配合你拥有的游戏副本使用。在这份副本得到确认之前，“开始游戏”和“在游戏中测试”保持关闭。"
fa = "R.U.S.E. 2.0 فقط با نسخه‌ای از بازی کار می‌کند که مال خودتان است. تا وقتی این نسخه تأیید نشود، «بازی» و «آزمایش در بازی» خاموش می‌مانند."

[if_steam]
us = "Own it on Steam? Let Steam check the game's files, remove any files named above, then check again."
fr = "Vous l'avez sur Steam ? Laissez Steam vérifier les fichiers du jeu, supprimez les fichiers cités plus haut, puis vérifiez à nouveau."
ger = "Du hast es auf Steam? Lass Steam die Spieldateien prüfen, entferne die oben genannten Dateien und prüfe dann erneut."
ita = "Ce l'hai su Steam? Fai verificare a Steam i file del gioco, togli i file indicati sopra, poi controlla di nuovo."
spa = "¿Lo tienes en Steam? Deja que Steam compruebe los archivos del juego, quita los archivos indicados arriba y vuelve a comprobar."
pol = "Masz grę na Steam? Pozwól Steam sprawdzić pliki gry, usuń pliki wymienione powyżej i sprawdź ponownie."
ru = "Игра у вас в Steam? Пусть Steam проверит файлы игры, удалите перечисленные выше файлы и проверьте снова."
cz = "Máte hru na Steamu? Nechte Steam zkontrolovat soubory hry, odstraňte výše uvedené soubory a zkontrolujte znovu."
jpn = "Steam でお持ちですか? Steam にゲームファイルを確認させ、上に書かれたファイルを削除してから、もう一度確認してください。"
sc = "你在 Steam 上拥有它？让 Steam 检查游戏文件，删除上面列出的文件，然后再检查一次。"
fa = "آن را در Steam دارید؟ بگذارید Steam فایل‌های بازی را بررسی کند، هر فایلی را که بالا نامش آمده بردارید، سپس دوباره بررسی کنید."

[if_other]
us = "Own it another way, like a boxed copy from before R.U.S.E. was on Steam? Or think we got it wrong? Open a ticket with your code, and we'll send you an unlock code."
fr = "Vous le possédez autrement, par exemple une version en boîte d'avant l'arrivée de R.U.S.E. sur Steam ? Ou vous pensez que nous nous trompons ? Ouvrez un ticket avec votre code, et nous vous enverrons un code de déblocage."
ger = "Du besitzt es anders, etwa als Box-Version aus der Zeit, bevor R.U.S.E. auf Steam war? Oder wir liegen falsch? Eröffne ein Ticket mit deinem Code, und wir schicken dir einen Freischaltcode."
ita = "Lo possiedi in un altro modo, per esempio una copia in scatola di prima che R.U.S.E. fosse su Steam? O pensi che ci siamo sbagliati? Apri un ticket con il tuo codice e ti manderemo un codice di sblocco."
spa = "¿Lo tienes de otra forma, como una copia en caja de antes de que R.U.S.E. estuviera en Steam? ¿O crees que nos hemos equivocado? Abre un ticket con tu código y te enviaremos un código de desbloqueo."
pol = "Masz grę w inny sposób, np. wersję pudełkową sprzed pojawienia się R.U.S.E. na Steam? A może uważasz, że się pomyliliśmy? Otwórz zgłoszenie ze swoim kodem, a wyślemy ci kod odblokowujący."
ru = "Игра у вас иначе, например коробочная версия времён, когда R.U.S.E. ещё не было в Steam? Или вы считаете, что мы ошиблись? Откройте обращение с вашим кодом, и мы пришлём код разблокировки."
cz = "Vlastníte hru jinak, třeba krabicovou verzi z doby před R.U.S.E. na Steamu? Nebo si myslíte, že jsme se spletli? Otevřete tiket se svým kódem a pošleme vám odemykací kód."
jpn = "Steam 以外でお持ちですか (R.U.S.E. が Steam に来る前のパッケージ版など)? それとも判定が間違っていると思いますか? あなたのコードを添えてチケットを作成してください。ロック解除コードをお送りします。"
sc = "你以其他方式拥有它，例如 R.U.S.E. 登陆 Steam 之前的盒装版？或者认为我们判断错了？请附上你的代码提交工单，我们会发给你解锁码。"
fa = "آن را از راه دیگری دارید، مثلاً یک نسخهٔ جعبه‌ای از پیش از آمدن R.U.S.E. به Steam؟ یا فکر می‌کنید ما اشتباه کرده‌ایم؟ با کدتان یک درخواست باز کنید تا یک کد باز کردن قفل برایتان بفرستیم."


# Das Zahlen-Handbuch auf Deutsch (rusemod.numberinfo; maßgeblich ist das Englische in numberinfo.toml).
[SeuilMort]
what = "Gesundheit"
does = "Wie viel Schaden nötig ist, um sie zu zerstören. Die meisten Panzer, Fahrzeuge, Trupps und Geschütze des Spiels haben 400: Was einen Tiger zäher macht als einen Jeep, ist vor allem seine Panzerungsstufe (Panzerung), die den Schaden jedes Schusses verringert, der für sie nicht stark genug ist. Gebäude haben 50 bis 4.500."
[SeuilPinned]
what = "Niederhalte-Schwelle"
does = "Wie viel Niederhalten nötig ist, bis die Einheit festgenagelt ist (sie rückt nicht mehr vor und feuert weniger). Schüsse, die im Niederhalte-Radius der Munition nahe einschlagen, erhöhen es. Die meisten Einheiten haben 200; höher = schwerer festzunageln."
[ArmureHint]
what = "Angezeigte Panzerungsstufe"
does = "Die Panzerungsstufe, die Karte und Baumenü der Einheit zeigen (die Zahl auf dem Schild, 1 bis 5). Das Feld Panzerung im Studio setzt sie zusammen mit der Panzerung selbst, damit beide immer übereinstimmen."
[BaseBlindage]
what = "Panzerung"
does = "Die Panzerung, mit der die Einheit kämpft (1 bis 10 im Spiel): Je höher, desto weniger Schaden macht schwächere Munition. Ändere sie mit dem Feld Panzerung, das eine der Stufen des Spiels wählt und die Schildzahl der Karte gleich hält (im Spiel gesehen)."
[ReculeSeulementSiUberstress]
what = "Weicht nur ganz festgenagelt zurück"
does = "1: Die Einheit zieht sich unter Beschuss erst zurück, wenn sie völlig festgenagelt ist (extremes Niederhalten), nicht vorher. 38 Einheiten des Spiels haben es."
[VitesseLineaire]
what = "Geschwindigkeit"
does = "Wie schnell sie sich abseits von Straßen bewegt. Ein Sherman hat 4.550 (etwa 35 km/h), ein Jeep 6.110 (etwa 47 km/h), ein Schützentrupp 3.120 (etwa 24 km/h)."
["TAvionDescriptor.VitesseLineaire"]
what = "Fluggeschwindigkeit"
does = "Wie schnell das Flugzeug fliegt: 13.000 bis 46.800 im Spiel (etwa 225 bis 810 km/h)."
[VitesseLineaireAuSol]
what = "Geschwindigkeit am Boden"
does = "Wie schnell das Flugzeug beim Start und bei der Landung über den Flugplatz rollt."
[VitesseLineaireIdle]
what = "Patrouillengeschwindigkeit"
does = "Wie schnell das Flugzeug kreist, wenn es nichts zu tun hat, langsamer als seine Höchstgeschwindigkeit."
[VitesseCombat]
what = "Geschwindigkeit im Kampf"
does = "Wie schnell sie sich im Kampf bewegt. Bei Panzern und Fahrzeugen meist gleich der Geschwindigkeit; bei Trupps und gezogenen Geschützen viel langsamer (ein Schützentrupp 1.040, etwa 8 km/h; ein Panzerabwehrgeschütz 520, etwa 4 km/h, von seiner Bedienung geschoben)."
[SpeedBonusOnRoad]
what = "Straßen-Geschwindigkeitsbonus"
does = "Wie viel schneller sie auf der Straße fährt als abseits: 0,6 ist etwa 60 % schneller. Trupps und Geschütze bekommen ihn als der Lastwagen, in den sie sich verwandeln. Flugzeuge und Lastwagen haben 1."
[MaxAcceleration]
what = "Beschleunigung"
does = "Wie schnell sie auf Geschwindigkeit kommt: Das Spiel addiert alle 0,2 Sekunden ein Fünftel dieses Werts zu ihrer Geschwindigkeit, also ist ihre Geschwindigkeit geteilt durch diesen Wert die Zahl der Sekunden bis zur Höchstgeschwindigkeit (neben dem Feld gezeigt). Die meisten Panzer haben 3.900: Ein Sherman (4.550) ist nach etwa 1,2 s auf Höchstgeschwindigkeit."
[MaxDeceleration]
what = "Bremsen"
does = "Wie schnell sie langsamer wird und anhält: Ihre Geschwindigkeit geteilt durch diesen Wert ist die Zahl der Sekunden, um aus voller Fahrt anzuhalten (neben dem Feld gezeigt)."
[TempsDemiTour]
what = "Wendezeit"
does = "Wie viele Sekunden sie braucht, um sich umzudrehen. Infanterie 0,01 (sofort), Fahrzeuge 0,5, Panzer 1, die langsamsten 6."
[Radius]
what = "Größe am Boden"
does = "Wie viel Platz die Einheit braucht: Andere Einheiten halten diesen Abstand zu ihrer Mitte, wenn sie um sie herumlenken. Infanterie 104-130 (etwa 0,5 m), Panzer 520-780 (2-3 m), Geschütze 390-650, Lastwagen 2.000, Gebäude 7.800-13.000 (30-50 m)."
["TAvionDescriptor.Radius"]
what = "Größe in der Luft"
does = "Wie viel Platz das Flugzeug braucht, wenn andere Flugzeuge um es herumfliegen: 780 bis 2.600 (3 bis 10 m)."
[StickToGround]
what = "Folgt dem Boden"
does = "1: Die Einheit neigt sich mit dem Hang, auf dem sie steht. Jede Bodeneinheit und jedes Gebäude des Spiels hat es."
[Scale]
what = "Modellgröße"
does = "Nur Aussehen: Das 3D-Modell der Einheit wird so oft so groß gezeichnet. Einheiten haben 1, Infanterie 0,2, Gebäude 0,1. Der Größenregler des Studios bei einem importierten Modell ändert stattdessen das Modell selbst."
[DetectionBase]
what = "Sichtweite"
does = "Wie weit sie Bodeneinheiten sieht. Ein Panzer 104.000 (etwa 400 m); Spähwagen 234.000 (900 m); Aufklärungsflugzeuge 195.000 (750 m). Ein Panzer IV mit nur 234.000 handelte nicht als Aufklärer; das Feld Rolle gibt den Rest."
[PorteeVisionVolant]
what = "Luftsichtweite"
does = "Wie weit sie Flugzeuge sieht. Die meisten Einheiten 208.000 (800 m); einige 2.600 (10 m: sie sehen Flugzeuge kaum)."
[SignatureRadar]
what = "Radarsignatur"
does = "Als welche Art Kontakt sie auf dem feindlichen Radar erscheint: 1 Bodeneinheiten, 2 Gebäude, 3 Flugzeuge."
[AltitudeNoise]
what = "Höhenschwankung"
does = "Nur Aussehen: wie stark die Flughöhe des Flugzeugs im Flug schwankt (130-260, unter 1 m)."
[PorteeAttackReflexAir]
what = "Auto-Angriffsweite (Luft)"
does = "Wie weit ein Flugzeug feindlichen Flugzeugen von selbst nachjagt, ohne Befehl: 130.000 bis 208.000 (500 bis 800 m)."
[PorteeAttackReflexSol]
what = "Auto-Angriffsweite (Boden)"
does = "Wie weit ein Flugzeug Bodenzielen von selbst nachjagt: 182.000 (700 m) bei jedem Flugzeug des Spiels."
[SecondaryWeaponMaxAmmo]
what = "Mitgeführte Bomben oder Raketen"
does = "Wie viele Schuss seiner zweiten Waffe (Bomben, Raketen) ein Flugzeug trägt, bevor es zum Aufmunitionieren heimfliegt: 1 bis 4 im Spiel."
[ProductionPrice]
what = "Preis"
does = "Was der Bau kostet, in $, in jedem der fünf Spielmodi, in der Reihenfolge des Spiels: 1945, 1942, 1939, Totaler Krieg, Atommodus (das Spiel nimmt den des Modus der Schlacht)."
[ProductionTime]
what = "Bauzeit"
does = "Wie viele Sekunden der Bau dauert. Bauen mehrere Fabriken ihrer Art sie, wird die Zeit zwischen ihnen geteilt, aber nie unter die kürzeste Bauzeit des Spiels (die des Reiters Wirtschaft)."
[UpgradePrice]
what = "Forschungspreis"
does = "Was die Forschung kostet, in $, bevor sie gebaut werden kann (Einheiten, die aus einer anderen erforscht werden)."
[UpgradeTime]
what = "Forschungszeit"
does = "Wie lange die Forschung dauert, in Sekunden."
[IsUpgrade]
what = "Ist eine Verbesserung"
does = "1: Die Einheit ist eine Verbesserung der Einheit, aus der sie erforscht wird (sie ersetzt sie nach der Forschung im Baumenü)."
[ShowInMenu]
what = "Im Baumenü gezeigt"
does = "1: im Baumenü in diesem Spielmodus gezeigt; ein Wert für jeden der fünf, in der Reihenfolge des Spiels: 1945, 1942, 1939, Totaler Krieg, Atommodus. Die späten Panzer des Spiels werden nur in 1945, Totaler Krieg und Atommodus gezeigt."
[PositionInMenu]
what = "Menüplatz"
does = "Wo sie in ihrem Baumenü steht: Einheiten derselben Linie teilen sich einen Platz, Verbesserungen stapeln sich darauf."
[Factory]
what = "Fabrik"
does = "In welchem Baumenü sie ist (das Studio zeigt jedes Menü mit seinem Namen und lässt dich eine Einheit in das einer anderen Nation verschieben)."
[Menu]
what = "Gebäudemenü"
does = "Auf welcher Seite des Gebäudemenüs das Gebäude ist."
[Nationalite]
what = "Nation"
does = "Zu welchem Land sie gehört: 0 USA, 1 Deutschland, 2 Großbritannien, 3 Frankreich, 4 Italien, 5 UdSSR, 6 Japan."
[InitialFlagSet]
what = "Flags"
does = "Die Flags der Einheit: nummerierte Schalter dafür, was sie ist und was sie kann. Jeder ist im Flag-Handbuch unter den Flags erklärt."
[DescriptorId]
what = "Kennung"
does = "Die eigene Nummer der Einheit: Jede Einheit hat eine andere, und Spiel und Spielstände finden sie daran. Das Studio gibt einer neuen Einheit eine freie."
[TrackingId]
what = "Statistik-Kennung"
does = "Die Nummer, unter der die Statistik am Spielende und die Erfassung des Spiels die Einheit kennen."
[Key]
what = "Schlüssel"
does = "Eine Zahl, die einige Einheiten tragen (8 Panzer, 7 Flugzeuge, 2 Trupps); ihre Verwendung ist noch unbekannt."
[TypeForAcknow]
what = "Stimmtyp"
does = "Mit welchem Satz Sprachzeilen die Einheit auf Befehle antwortet."
[AcknowUnitType]
what = "Stimmart"
does = "Welche Art Einheit die Sprachzeilen nennen (Panzer, Infanterie, Flugzeug...)."
[IconeType]
what = "Kartensymbol"
does = "Welches Symbol die Einheit auf dem Kartentisch in der Ferne zeigt."
[Category]
what = "Kategorie"
does = "Als welche Art Einheit das Spiel sie zählt: 1 Aufklärung (die Rolle Aufklärung setzt es; im Spiel gesehen), 7 Flugzeuge, 8 und 9 Gebäude; die anderen sind noch nicht alle benannt."
[CategorieIA]
what = "Kategorie für den Computer"
does = "Wofür der Computer die Einheit einsetzt: 3 Aufklärung (das Feld Rolle setzt es mit der Rolle; im Spiel gesehen); die anderen sind noch nicht alle benannt."
[CategoryVolant]
what = "Flugzeugrolle"
does = "Als welche Art Flugzeug es fliegt (Jäger, Jagdbomber, Bomber, Aufklärer, Fallschirmjäger): wie es sich bewegt und angreift. Ändere sie mit dem Feld Rolle, das die Flags mitsetzt."
[IsDepotForIA]
what = "Depot für den Computer"
does = "1: Der Computer behandelt dieses Gebäude als Versorgungsdepot."
[TypeBatiment]
what = "Gebäudetyp"
does = "Welche Art Gebäude es für das Spiel ist (HQ, Kaserne, Depot...). Ein Täuschungsgebäude mit Flag 5 und TypeBatiment -7 produziert wirklich."
[BuildPolicy]
what = "Wo es gebaut werden kann"
does = "Wo das Gebäude platziert werden darf: 2 überall (Verteidigung), 3 auf einer Depotplatte; ohne den Wert braucht es eine Straße in der Nähe."
[DistanceToRoad]
what = "Abstand zu einer Straße"
does = "Wie nah an einer Straße das Gebäude platziert werden muss: 5.000 bis 31.000 (20 bis 120 m). Bunker 8.000 (etwa 30 m)."
[CanBeSpawnedInMapMulti]
what = "In Mehrspielerkarten platzierbar"
does = "1: Das Gebäude kann in das Szenario einer Mehrspielerkarte gesetzt werden."
["TBatimentPaths.Radius"]
what = "Wege um das Gebäude"
does = "Wie weit um das Gebäude die Wege der Einheiten führen."
[TirEnMouvement]
what = "Feuert in Bewegung"
does = "1: Diese Waffe kann feuern, während die Einheit fährt."
[SalveNumber]
what = "Salvennummer"
does = "In welcher Salve diese Waffe feuert (-1: sie feuert allein, nicht in Salven)."
["TWeaponDescriptor.Salves"]
what = "Salven"
does = "Ob die Waffe in Salven (1) oder Schuss für Schuss (-1) feuert."
[Puissance]
what = "Schaden"
does = "Der Schaden eines Treffers, vor der Panzerung. Handwaffen 2-10, Panzerkanonen zehn bis hunderte, Bomben und die V2 weit mehr (bis 2.000.000 bei der Atombombe). Eine Einheit ist zerstört, wenn der erlittene Schaden ihre Gesundheit erreicht."
[Level]
what = "Munitionsstufe"
does = "Die Stufe der Munition (1 bis 5). Das Spiel wägt sie gegen die Panzerung des Ziels ab: Munition höherer Stufe macht gepanzerten Einheiten mehr Schaden. Wie genau beides verglichen wird, ist noch nicht gemessen."
[Arme]
what = "Waffenart"
does = "Welche Art Waffe sie feuert (MG, Kanone, Haubitze, Bombe...): gegen welche Ziele sie gut ist, und das Symbol auf der Karte."
[PorteeMaximale]
what = "Reichweite"
does = "Wie weit sie treffen kann: 13.000 (50 m) bis 2.600.000 (10 km, die V2). Panzerkanonen meist 65.000-130.000 (250-500 m)."
[PorteeMinimale]
what = "Mindestreichweite"
does = "Näher kann sie nicht feuern (Artillerie und Mörser): 13.000 bis 169.000 (50 bis 650 m)."
[TempsEntreDeuxTirs]
what = "Zeit zwischen Schüssen"
does = "Sekunden zwischen zwei Schüssen: 0,2 bei einem MG, einige Sekunden bei einer Panzerkanone, bis 60 bei den schwersten Geschützen. Niedriger = mehr Schüsse."
[TempsEntreDeuxSalves]
what = "Zeit zwischen Salven"
does = "Sekunden zwischen zwei Salven, bei Waffen, die Salven feuern (Raketenwerfer, Bomben)."
[NbTirParSalves]
what = "Schüsse pro Salve"
does = "Wie viele Schüsse eine Salve feuert: 1 bis 100."
[AngleDispersion]
what = "Streuung"
does = "Wie weit Schüsse vom Zielpunkt abweichen: 0,01 (etwa ein halbes Grad, sehr genau) bis 0,3 (17 Grad, Artillerie)."
[PourcentageTirDirect]
what = "Treffsicherheit im Stand"
does = "Wie wahrscheinlich ein Schuss trifft, wenn die Einheit steht: 0,5 bis 1 (50 % bis 100 %)."
[PourcentageTirDirectEnMouvement]
what = "Treffsicherheit in Bewegung"
does = "Wie wahrscheinlich ein Schuss trifft, während die Einheit fährt: 0,4 bis 1 (40 % bis 100 %)."
[RayonPinned]
what = "Niederhalte-Radius"
does = "Wie weit vom Einschlag ein Schuss Einheiten niederhält (ihren Niederhalte-Wert erhöht): 130 (ein halber Meter) bis 78.000 (300 m)."
[TirIndirect]
what = "Indirektes Feuer"
does = "1: Die Munition wird indirekt verschossen, über Hindernisse auf Ziele, die andere entdecken (Artillerie)."
[AllowAmbushShot]
what = "Kann aus dem Hinterhalt feuern"
does = "1: Die Munition kann aus einem Hinterhalt im Wald verschossen werden."
[ProjectileType]
what = "Geschossart"
does = "Nur Aussehen: welche Art Schuss fliegend gezeichnet wird (Granate, Kugel, Rakete, Bombe)."
[AmmunitionId]
what = "Munitionskennung"
does = "Die eigene Nummer der Munition (1000-1138): Jede hat eine andere. Das Studio gibt einer Kopie eine freie."
[NeedModelChange]
what = "Wechselt beim Feuern das Modell"
does = "Nur Aussehen: 1 bei den Panzerabwehrwaffen der Trupps: Der Soldat wechselt beim Feuern zum Modell, das sie hält."
[TempsAnimation]
what = "Zeit vor dem Abschuss"
does = "Sekunden, die zum Flug des Schusses hinzukommen: Der Treffer kommt so viel später an, und der gezeichnete Schuss braucht so viel länger (1,6 s bei Granaten und Sprengladungen, dem Namen nach die Wurfzeit des Soldaten)."
[FX_vitesse_de_depart]
what = "Schussgeschwindigkeit"
does = "Wie schnell der Schuss fliegt, also wann er ankommt: Der Treffer zählt erst, wenn er ankommt, auf ein fahrendes Ziel wird um die Flugzeit vorgehalten, und der gezeichnete Schuss braucht dieselbe Zeit. Ein Schuss mit Physik fliegt so viele Spieleinheiten pro Sekunde, gebremst von seinem Luftwiderstand: 9.000 bis 520.000 (35 bis 2.000 m pro Sekunde; die 75-mm-Panzergranate 120.000, etwa 460 m pro Sekunde). Ein Schuss ohne Physik (Schuss ohne Physik) fliegt gerade mit dem 26-Fachen. Jeder Flug wird auf die nächsten 0,2 s aufgerundet. Ein Schuss, der zu langsam ist, um sein Ziel zu erreichen, wird um je 5 % schneller, bis er es kann: Er kommt trotzdem an, nur später."
[FX_frottement]
what = "Luftwiderstand des Schusses"
does = "Wie schnell ein Schuss mit Physik in der Luft langsamer wird: mehr Widerstand, ein längerer Flug über dieselbe Strecke, also ein späterer Treffer. Die Schüsse des Spiels haben 0,001 (die meisten) bis 0,08. Ein Schuss ohne Physik beachtet ihn nicht."
[FX_tir_tendu]
what = "Gestreckter Schuss (gezeichnet)"
does = "Nur Aussehen: 1 zeichnet den Schuss flach und gerade statt im Bogen."
[FX_tir_sans_physic]
what = "Schuss ohne Physik"
does = "1: Der Schuss fliegt gerade bis zu seinem Ziel, mit dem 26-Fachen seiner Schussgeschwindigkeit, ohne Schwerkraft und Luftwiderstand (Handwaffen, Maschinengewehre, die meisten Flak, Bomben und Granaten des Spiels); 0: Er fliegt mit Schwerkraft und Luftwiderstand (Granaten der Geschütze, Mörser, Raketen)."
[AltitudeDeVol]
what = "Flughöhe"
does = "Wie hoch das Flugzeug fliegt: 52.000 bis 208.000 (200 bis 800 m)."
[ChaosAltitudeDeVol]
what = "Streuung der Flughöhe"
does = "Wie stark die Flughöhe von Flugzeug zu Flugzeug und über die Zeit schwankt: 7.800 bis 32.500 (30 bis 125 m)."
[AltitudeDownAirport]
what = "Höhe bei der Landung"
does = "Wie hoch das Flugzeug ist, wenn es den Sinkflug zu seinem Flugplatz beginnt: 65.000 (250 m)."
[AltitudeDownAttack]
what = "Angriffshöhe"
does = "Wie tief das Flugzeug für einen Bodenangriff herunterkommt: 13.000 bis 39.000 (50 bis 150 m)."
[LengthDownAirport]
what = "Länge des Landeanflugs"
does = "Wie lang der Sinkflug des Flugzeugs zum Flugplatz ist: 78.000 bis 156.000 (300 bis 600 m)."
[LengthUpAirport]
what = "Länge des Steigflugs nach dem Start"
does = "Wie lang der Steigflug des Flugzeugs nach dem Start ist: 52.000 bis 130.000 (200 bis 500 m)."
[LengthDownAttack]
what = "Länge des Angriffs-Sinkflugs"
does = "Wie lang der Sinkflug des Flugzeugs auf ein Bodenziel ist: 13.000 bis 208.000 (50 bis 800 m)."
[LengthUpAttack]
what = "Länge des Hochziehens nach dem Angriff"
does = "Wie lang der Steigflug des Flugzeugs nach einem Bodenangriff ist: 13.000 bis 208.000 (50 bis 800 m)."
[DelaiAttackGround]
what = "Verzögerung vor einem Bodenangriff"
does = "Sekunden, die das Flugzeug im Anflug wartet, bevor es auf ein Bodenziel feuert: 0,1 bis 4,5."
[GroundAttackAcceleration]
what = "Beschleunigung beim Bodenangriff"
does = "Wie schnell das Flugzeug bei einem Bodenangriff beschleunigt."
[GroundAttackDecceleration]
what = "Abbremsen beim Bodenangriff"
does = "Wie schnell das Flugzeug für einen Bodenangriff abbremst."
[MustDiveAttack]
what = "Sturzkampfbomber"
does = "1: Das Flugzeug greift im steilen Sturzflug an (2 Flugzeuge des Spiels haben es)."
[DiveAttackStartAltitude]
what = "Höhe zu Beginn des Sturzflugs"
does = "Wie hoch ein Sturzkampfbomber seinen Sturzflug beginnt: 44.200 bis 91.000 (170 bis 350 m)."
[DiveAttackEndAltitude]
what = "Abfanghöhe"
does = "Wie tief ein Sturzkampfbomber stürzt, bevor er abfängt: 31.200 bis 39.000 (120 bis 150 m)."
[DiveAttackAcceleration]
what = "Beschleunigung im Sturzflug"
does = "Wie schnell ein Sturzkampfbomber im Sturzflug beschleunigt."
[DiveAttackAngleToHit]
what = "Sturzwinkel beim Abwurf"
does = "Wie steil der Sturzflug sein muss, bevor die Bombe fällt: 10 bis 35 Grad."
[DiveAttackDownAngleSpeed]
what = "Abkippgeschwindigkeit in den Sturz"
does = "Wie schnell ein Sturzkampfbomber die Nase in den Sturzflug senkt (90 Grad pro Sekunde)."
[DiveAttackDownRollSpeed]
what = "Rollgeschwindigkeit in den Sturz"
does = "Wie schnell ein Sturzkampfbomber beim Beginn des Sturzflugs abrollt (120 Grad pro Sekunde)."
[DiveAttackUpAngleSpeed]
what = "Abfanggeschwindigkeit"
does = "Wie schnell ein Sturzkampfbomber die Nase aus dem Sturzflug hochzieht (35 bis 50 Grad pro Sekunde)."
[DiveAttackUpRollSpeed]
what = "Rollgeschwindigkeit aus dem Sturz"
does = "Wie schnell ein Sturzkampfbomber nach dem Sturzflug wieder gerade rollt (60 Grad pro Sekunde)."
[LoopingStartAltitude]
what = "Höhe zu Beginn eines Loopings"
does = "Wie hoch ein Flugzeug ist, wenn es einen Looping beginnt, um wieder anzufliegen: 57.200 bis 109.200 (220 bis 420 m)."
[LoopingAltitudeToHit]
what = "Höhe am Scheitel des Loopings"
does = "Wie hoch der Scheitel des Loopings ist: 70.200 bis 124.800 (270 bis 480 m)."
[LoopingAcceleration]
what = "Beschleunigung im Looping"
does = "Wie schnell das Flugzeug beim Herauskommen aus einem Looping beschleunigt."
[LoopingDecceleration]
what = "Abbremsen im Looping"
does = "Wie schnell das Flugzeug beim Steigen in einen Looping langsamer wird."
[LoopingPitchAngleSpeedStart]
what = "Nickgeschwindigkeit (Looping-Beginn)"
does = "Wie schnell die Nase des Flugzeugs zu Beginn des Loopings hochkommt (20 Grad pro Sekunde)."
[LoopingPitchAngleSpeedEnd]
what = "Nickgeschwindigkeit (Looping-Ende)"
does = "Wie schnell die Nase des Flugzeugs am Ende des Loopings dreht: 30 bis 90 Grad pro Sekunde."
[PitchAngleMax]
what = "Steilster Steig- oder Sinkflug"
does = "Wie weit das Flugzeug im normalen Flug die Nase heben oder senken darf: 5 bis 80 Grad."
[RollAngleMax]
what = "Stärkste Querlage"
does = "Wie weit sich das Flugzeug in eine Kurve legt: 5 bis 50 Grad."
[RollAcceleration]
what = "Rollbeschleunigung"
does = "Wie schnell das Flugzeug in eine Querlage hinein- und herausrollt (4 bis 8)."
[RollRatioSpeed]
what = "Querlage pro Kurve"
does = "Wie stark sich das Flugzeug für eine bestimmte Kurve neigt: 0,1 bis 2."
[RadiusStandard]
what = "Wendekreis"
does = "Wie weit die normalen Kurven des Flugzeugs sind: 26.000 bis 104.000 (100 bis 400 m)."
[RadiusApproach]
what = "Anflugkreis"
does = "Wie weit die Kurven des Flugzeugs sind, wenn es sich seinem Ziel nähert: 10.400 bis 104.000 (40 bis 400 m)."
[RadiusApproachAttackGround]
what = "Anflugkreis für einen Bodenangriff"
does = "Wie weit die Kurven des Flugzeugs sind, wenn es sich für einen Bodenangriff ausrichtet: 20.800 bis 104.000 (80 bis 400 m)."
[RadiusApproachEngage]
what = "Anflugkreis für einen Luftkampf"
does = "Wie weit die Kurven des Flugzeugs sind, wenn es sich einem feindlichen Flugzeug nähert: 15.600 bis 52.000 (60 bis 200 m)."
[RadiusEngage]
what = "Abstand zum Luftkampfbeginn"
does = "Wie nah ein feindliches Flugzeug sein muss, damit das Flugzeug einen Luftkampf beginnt: 10.400 bis 104.000 (40 bis 400 m)."
[RadiusEngaged]
what = "Wendekreis im Luftkampf"
does = "Wie weit die Kurven des Flugzeugs im Luftkampf sind: 26.000 bis 104.000 (100 bis 400 m)."
[RadiusChangeAltitude]
what = "Strecke für einen Höhenwechsel"
does = "Wie weit das Flugzeug fliegt, während es die Höhe wechselt: 9.750 bis 52.000 (40 bis 200 m)."
[CrashGravity]
what = "Absturz nach Abschuss"
does = "Wie schnell ein abgeschossenes Flugzeug fällt: 1.300 bis 5.200."
[CrashPitchAcceleration]
what = "Abkippen nach Abschuss"

does = "Wie viele Sekunden der Schlacht er wartet, bevor er überhaupt angreift; bis dahin belästigt er auch nicht und schickt keine Hilfe zu einem bedrohten Depot. Standard 30; Leicht 300 (5 Minuten); Schildkröte 600 (10 Minuten). Schwer und Blitzkrieg führen ihn nicht auf, zählen also 0: Sie greifen ab der ersten Sekunde an."

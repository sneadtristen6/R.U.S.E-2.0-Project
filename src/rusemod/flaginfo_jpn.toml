[0]
what = "飛行場"
does = "建物を飛行場にします。あなたの航空機はここを基地にし、自分の飛行場を航空機でクリックすると着陸に向かいます。コンピューターの偵察計画も飛行場を探します。"
use = "飛行場専用です。ほかに付けると、ゲームは航空機が着陸できる場所として扱うだけです。"

[1]
what = "砲兵(間接射撃)"
does = "ユニットは、ゲームの榴弾砲のように、ほかのユニットが見つけた目標を間接射撃します。コンピューターにも砲兵として使うよう伝えます。"
use = "どのユニットでも機能します。DomesticNukes があらゆる種類の410ユニットに付け、すべてが間接射撃しました。"

[2]
what = "航空機"
does = "ユニットは航空機です。飛行場の管制塔で生産され、補給のため帰還し、地上の命令は受けません。ゲームの63機すべてが持ち、ほかには何も持っていません。"
use = "すべての航空機に残してください。地上ユニットには絶対に付けないでください。ゲームが飛行場の管制塔で生産しようとします。"
danger_why = "航空機でないユニットに付けると、生産時にスクリプトエラーでゲームが止まると予想されます(飛行場の管制塔を探すため)。"


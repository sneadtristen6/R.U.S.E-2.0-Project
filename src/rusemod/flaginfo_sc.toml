# 旗标指南简体中文版（rusemod.flaginfo；以 flaginfo.toml 中的英文为准）。
[0]
what = "机场"
does = "让建筑成为机场：你的飞机驻扎在这里，用飞机点击自己的机场会让它返航降落。电脑的侦察规划也会寻找机场。"
use = "仅用于机场。放在别的东西上，游戏只会把它当作飞机可以降落的地方。"

[1]
what = "炮兵（间接射击）"
does = "单位会像游戏里的榴弹炮一样，对其他单位发现的目标进行间接射击。也告诉电脑把它当作炮兵使用。"
use = "对任何单位都有效：DomesticNukes 给了 410 个各类单位，它们都进行了间接射击。"

[2]
what = "飞机"
does = "单位是飞机：在机场塔台生产，返航补给，不接受地面命令。游戏中全部 63 架飞机都有，其他单位都没有。"
use = "每架飞机都要保留。绝不要加给地面单位：游戏会试图在机场塔台生产它。"
danger_why = "加在非飞机单位上，生产时预计会因脚本错误让游戏停住（它会去找机场塔台）。"

[3]
what = "飞机可不经交战就攻击"
does = "飞机出击时由游戏设置。"
use = "别加：由游戏管理。"

[4]
what = "建筑"
does = "它是建筑：有建筑面板、放置和占领规则，不计入单位统计。建筑从不移动，也不像单位那样思考。"
use = "仅用于建筑。"
danger_why = "加在单位上预计会让它僵住：建筑不会移动，也不接受单位命令。"

[5]
what = "生产建筑"
does = "生产单位的建筑（兵营、工厂、机场）。用它代替 30（并设 TypeBatiment -7），诱饵建筑就会真的生产。"
use = "用于生产单位的建筑。"

[6]
what = "防御建筑"
does = "碉堡和炮位：有防御面板，轰炸机会自行攻击它们。这种东西会像游戏里的舰船一样停在原地。"
use = "仅用于防御建筑。"
danger_why = "加在应当移动的单位上，预计会让它站着不动。"

[7]
what = "补给站"
does = "补给站：建在补给站底座上，有补给站面板；占领和失去都按补给站计算。"
use = "仅用于补给站。"

[8]
what = "指挥部"
does = "指挥部：一座指挥建筑（受“无法隐藏”规则约束），也是电脑最看重的建筑。"
use = "仅用于指挥部。"

[9]
what = "超级武器阵地（未使用）"
does = "游戏中没有任何地方用到它。"
use = "别加。"

[10]
what = "可受伤害"
does = "爆炸能伤到它：范围伤害和 V2 会寻找带有它的单位。游戏中 454 个单位带有它。"
use = "所有应被爆炸伤到的东西都保留。没有它，单位也许会免疫范围伤害（未实测）。"


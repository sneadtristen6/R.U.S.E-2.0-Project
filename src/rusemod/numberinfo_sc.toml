[RadiusEngaged]
what = "空战转弯半径"
does = "飞机在空战中转弯有多宽：26,000 到 104,000（100 到 400 m）。"
[RadiusChangeAltitude]
what = "改变高度的距离"
does = "飞机改变高度时飞行的距离：9,750 到 52,000（40 到 200 m）。"
[CrashGravity]

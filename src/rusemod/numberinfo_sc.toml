[TempsENtreDeuxCamionsEnConvoiMin]
what = "车队内卡车的间隔（最少）"
does = "同一车队两辆卡车出发之间的最短时间（秒）。游戏中为 1.5。"
[TempsENtreDeuxCamionsEnConvoiMax]
what = "车队内卡车的间隔（最多）"
does = "同一车队两辆卡车出发之间的最长时间（秒）。游戏中为 1.5。"
[RatioForDepotNearlyDepleted]
what = "补给站将空的比例"
does = "当补给站剩余车次不超过初始车次的这个比例时，它被视为将空（电脑玩家随后会另找一个）。游戏中为 0.25（25%）。"
[MinProductionTime]
what = "最短生产时间"
does = "无论有多少同类工厂在建造，任何单位的建造时间都不会短于这个秒数。游戏中为 1。"
[MaximumBatimentProduction]
what = "同时建造的建筑（最多）"
does = "电脑玩家同时建造的建筑数量。游戏中为 2。"
[MaxProductionQueueSize]
what = "最长生产队列"
does = "电脑玩家放入生产队列的最多单位数。游戏中为 30。"
[MaxBatimentAndTechnoProductionSimultaneous]
what = "同时进行的建筑和研究"
does = "电脑玩家同时进行的建筑和研究数量。游戏中为 2。"
[VirtualFactoryQueueMaximumSlot]
what = "工厂队列的位置"
does = "工厂队列有多少个位置。游戏中为 2。"
[NbAvionsParAeroport]
what = "每个机场的飞机数"
does = "玩家每拥有一个机场可以拥有多少架飞机：飞机数达到此值乘以机场数后，就不能再建造飞机。游戏中为 8。"
[NbMaxCardsInPool]
what = "手中计谋卡（最多）"
does = "一方最多能持有的计谋卡数。游戏中为 99：实际上没有限制。"
[NbInitialCardsInPoolForAllianceTaille_1]
what = "开局计谋卡（每方 1 名玩家）"
does = "一方有 1 名玩家时开局拥有的计谋卡数。游戏普通模式为 2，核战争模式为 4。"

# Das Flag-Handbuch auf Deutsch (rusemod.flaginfo; maßgeblich ist das Englische in flaginfo.toml).
[0]
what = "Flugplatz"
does = "Macht ein Gebäude zum Flugplatz: Deine Flugzeuge sind dort stationiert, und ein Klick mit einem Flugzeug auf deinen eigenen Flugplatz schickt es zur Landung. Die Aufklärungsplanung des Computers sucht nach einem."
use = "Nur für Flugplätze. Auf anderem behandelt das Spiel es nur als Ort, an dem Flugzeuge landen können."

[1]
what = "Artillerie (indirektes Feuer)"
does = "Die Einheit feuert indirekt auf das, was andere Einheiten entdecken, wie die Haubitzen des Spiels. Sagt auch dem Computer, sie als Artillerie einzusetzen."
use = "Funktioniert bei jeder Einheit: DomesticNukes gab es 410 Einheiten aller Art, und alle feuerten indirekt."

[2]
what = "Flugzeug"
does = "Die Einheit ist ein Flugzeug: am Kontrollturm des Flugplatzes gebaut, fliegt zum Auftanken heim, nimmt keine Bodenbefehle. Alle 63 Flugzeuge des Spiels haben es, und nichts sonst."
use = "Auf jedem Flugzeug lassen. Nie auf eine Bodeneinheit setzen: Das Spiel würde versuchen, sie am Kontrollturm eines Flugplatzes zu bauen."
danger_why = "Auf einer Einheit, die kein Flugzeug ist, dürfte ihr Bau das Spiel mit einem Skriptfehler anhalten (es sucht den Kontrollturm eines Flugplatzes)."

[3]
what = "Flugzeug darf ohne Gefecht angreifen"
does = "Das Spiel setzt es, wenn ein Flugzeug zu einem Einsatz startet."
use = "Weglassen: Das Spiel verwaltet es."

[4]
what = "Gebäude"
does = "Das Ding ist ein Gebäude: Gebäudeleiste, Platzierungs- und Eroberungsregeln, nicht in der Einheitenstatistik. Ein Gebäude bewegt sich nie und denkt nicht wie eine Einheit."
use = "Nur für Gebäude."
danger_why = "Auf einer Einheit dürfte es sie einfrieren: Gebäude bewegen sich nicht und nehmen keine Einheitenbefehle."


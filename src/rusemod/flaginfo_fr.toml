# Le guide des drapeaux en français (rusemod.flaginfo; l'anglais est dans flaginfo.toml, qui fait foi).
[0]
what = "Aérodrome"
does = "Fait d'un bâtiment un aérodrome : vos avions y sont basés, et cliquer sur votre propre aérodrome avec un avion le renvoie s'y poser. L'IA de reconnaissance de l'ordinateur en cherche un."
use = "Seulement pour les aérodromes. Sur autre chose, le jeu le traite seulement comme un endroit où les avions peuvent se poser."

[1]
what = "Artillerie (tir indirect)"
does = "L'unité tire indirectement, sur ce que d'autres unités repèrent, comme les obusiers du jeu. Dit aussi à l'ordinateur de l'utiliser comme artillerie."
use = "Marche sur toute unité : DomesticNukes l'a donné à 410 unités de toutes sortes, et toutes ont tiré indirectement."

[2]
what = "Avion"
does = "L'unité est un avion : construite à la tour de contrôle de l'aérodrome, rentre se ravitailler, ne prend pas d'ordres au sol. Les 63 avions du jeu l'ont tous, et rien d'autre."
use = "Gardez-le sur chaque avion. Ne le mettez jamais sur une unité au sol : le jeu essaierait de la construire à la tour de contrôle d'un aérodrome."
danger_why = "Sur une unité qui n'est pas un avion, sa construction devrait arrêter le jeu sur une erreur de script (il cherche la tour de contrôle d'un aérodrome)."

[3]
what = "Avion pouvant attaquer sans être engagé"
does = "Le jeu le pose quand un avion part en mission."
use = "Laissez-le de côté : le jeu le gère."

[4]
what = "Bâtiment"
does = "La chose est un bâtiment : panneau de bâtiment, règles de placement et de capture, exclue des statistiques d'unités. Un bâtiment ne bouge jamais et ne réfléchit pas comme une unité."
use = "Seulement pour les bâtiments."
danger_why = "Sur une unité, devrait la figer : les bâtiments ne bougent pas et ne prennent pas d'ordres d'unité."

[5]
what = "Bâtiment de production"
does = "Un bâtiment qui produit des unités (casernes, usines, aérodromes). Mis à la place de 30 (avec TypeBatiment -7), un leurre produit pour de vrai."
use = "Pour les bâtiments qui construisent des unités."

[6]
what = "Bâtiment défensif"
does = "Bunkers et positions de canons : panneau de défense, et les bombardiers les prennent pour cible d'eux-mêmes. Une telle chose reste où elle est, comme les navires du jeu."
use = "Seulement pour les bâtiments défensifs."
danger_why = "Sur une unité censée bouger, devrait l'immobiliser."

[7]
what = "Dépôt de ravitaillement"
does = "Un dépôt : posé sur une dalle de dépôt, avec le panneau de dépôt ; le prendre et le perdre compte comme un dépôt."
use = "Seulement pour les dépôts."

[8]
what = "Quartier général"
does = "Le QG : un bâtiment de commandement (derrière la règle « impossible de le cacher ») et celui que l'ordinateur estime le plus."
use = "Seulement pour les QG."

[9]
what = "Site de super-arme (inutilisé)"
does = "Rien dans le jeu ne l'utilise."
use = "Laissez-le de côté."

[10]
what = "Peut subir des dégâts"
does = "Les explosions peuvent le blesser : les dégâts de zone et le V2 cherchent les unités qui l'ont. 454 unités du jeu l'ont."
use = "Gardez-le sur tout ce que les explosions doivent blesser. Sans lui, une unité serait peut-être insensible aux dégâts de zone (pas essayé)."

[11]
what = "N'entre pas en forêt"
does = "L'unité reste hors des forêts (ses trajets les contournent) et n'a jamais le couvert des bois. Les chars et la plupart des véhicules l'ont."
use = "Pour faire entrer un véhicule en forêt, retirez 11, 21 et 55 ensemble (essayé par DomesticNukes). C'est 11 qui compte pour les forêts."

[12]
what = "Créé par une carte de ruse (inutilisé)"
does = "Rien dans le jeu ne l'utilise comme drapeau d'unité."
use = "Laissez-le de côté."

[13]

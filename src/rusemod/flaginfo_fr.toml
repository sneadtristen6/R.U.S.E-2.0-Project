does = "L'avion se comporte en bombardier : de lui-même il n'attaque que des bâtiments, et il a une grande place de parking à l'aérodrome. Lequel de 100, 99, 101, 13, 59 un avion a décide de son comportement, dans cet ordre."
use = "Pour les bombardiers. Utilisez la case Rôle d'un avion plutôt que de changer 13, 99, 100 et 101 à la main : elle les règle ensemble."

[14]
what = "Capture les bâtiments"
does = "Infanterie qui peut capturer des bâtiments ; l'ordinateur envoie ces unités capturer. Un leurre le perd."

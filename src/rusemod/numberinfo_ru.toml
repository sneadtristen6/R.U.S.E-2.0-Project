# --- игроки-компьютеры (вкладка ИИ) ---
[AttaqueTempsActivation]
what = "Секунд до начала атак"
does = "Сколько секунд боя он ждёт, прежде чем вообще атаковать; до этого он также не изматывает противника и не посылает помощь к складу под угрозой. По умолчанию 30; Простой 300 (5 минут); Черепаха 600 (10 минут). У Серьезного и Блицкрига этого значения нет, поэтому они считают 0: атакуют с первой секунды."
[OffensiveNbMissionMax]
what = "Атак одновременно, не больше"
does = "Сколько атак (и возмездий) он ведёт одновременно, не больше. -1 значит без предела; так во всех наборах игры."
[MissionFacteurLancementAttaque]
what = "Агрессивность (порог атаки)"
does = "То, что дизайнеры миссий игры называют его агрессивностью (Agressivite, которую скрипты кампании меняют по ходу миссии): игра умножает её на постоянный коэффициент и сравнивает силы в месте, прежде чем начать там атаку. Наборы игры: По умолчанию 0,7; Простой и Блицкриг 0,2; Серьезный 0,9; Черепаха 1. В какую сторону его толкает большее число, ещё не измерено: проверьте в игре."
[MissionFacteurEnoughToDestroy]
what = "Силы против врага"
does = "Сколько сил он посылает в атаку, во сколько раз больше сил противника там (дизайнеры миссий называют это подкреплением для атаки, Renfort_pour_attaque). По умолчанию 1,2; Простой 0,2; Обычный 1,4; Серьезный 1,8; Блицкриг 1,5; Черепаха 1."
[DefenseDistanceMenace]
what = "Дистанция угрозы"
does = "На каком расстоянии от защищаемого места противник считается угрозой; игра делает охраняемую зону примерно в 1,4 раза больше (расстояние на корень из 2). 312 000 (1200 м) в наборах игры; Черепаха 26 000 000 (100 км: всё на карте — угроза)."
[DefenseDistanceUrgent]
what = "Дистанция срочной угрозы"
does = "Насколько близко к защищаемому месту должен подойти противник, чтобы оборона стала срочной (Distance_Defense_Urgente дизайнеров миссий, рядом с дистанцией угрозы). По умолчанию 156 000 (600 м); Серьезный 208 000 (800 м); Блицкриг 78 000 (300 м)."
[DefenseMaxUnitOnPosition]
what = "Юнитов на несрочную оборону"
does = "Сколько своих юнитов он посылает на оборону, которая не срочная (Nbre_Unit_Defense_Non_Urgente дизайнеров миссий). По умолчанию 1; Обычный 2; Серьезный 3; Черепаха 6."
[DefenseNbMissionMax]
what = "Мест, защищаемых одновременно, не больше"
does = "Сколько оборонительных задач (мест, которые он охраняет) он ведёт одновременно, не больше. По умолчанию 2; Простой и Серьезный 4; Черепаха 10. У Блицкрига этого значения нет, поэтому он считает 0 и ничего не охраняет."
[HarcelementActif]
what = "Изматывает противника"
does = "1: изматывает противника (мелкие набеги, когда его ожидание перед атакой закончится). 0: никогда. У Простого и Черепахи этого значения нет, поэтому они считают 0 и никогда не изматывают."
[UpgradeActifPourHarcelement]
what = "Улучшения для изматывания"
does = "Может ли он брать в набеги улучшенные юниты. У Простого и Блицкрига этого значения нет (0)."

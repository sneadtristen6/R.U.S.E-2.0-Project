# Справочник чисел на русском (rusemod.numberinfo; основной текст — английский в numberinfo.toml).
[SeuilMort]
what = "Здоровье"
does = "Сколько урона нужно, чтобы его уничтожить. У большинства танков, машин, отделений и орудий игры 400: «Тигра» прочнее джипа делает в основном его уровень брони (Броня), который уменьшает урон каждого выстрела, недостаточно сильного для неё. У зданий от 50 до 4 500."
[SeuilPinned]
what = "Порог прижатия"
does = "Сколько подавления нужно, чтобы юнит прижало к земле (он перестаёт двигаться и стреляет реже). Выстрелы, падающие рядом в радиусе подавления боеприпаса, его увеличивают. У большинства юнитов 200; выше = труднее прижать."
[ArmureHint]
what = "Показываемый уровень брони"
does = "Уровень брони, который показывают карточка юнита и меню постройки (число на щите, от 1 до 5). Поле «Броня» в Studio задаёт его вместе с самой бронёй, поэтому они всегда совпадают."
[BaseBlindage]
what = "Броня"
does = "Броня, с которой юнит сражается (от 1 до 10 в игре): чем она выше, тем меньше урона наносят ему более слабые боеприпасы. Меняйте её полем «Броня», которое выбирает один из уровней игры и сохраняет число на щите карточки (проверено в игре)."
[ReculeSeulementSiUberstress]
what = "Отходит, только когда полностью прижат"
does = "1: юнит отступает под огнём, только когда полностью прижат (крайнее подавление), не раньше. Есть у 38 юнитов игры."
[VitesseLineaire]
what = "Скорость"
does = "Как быстро он движется вне дорог. У «Шермана» 4 550 (около 35 км/ч), у джипа 6 110 (около 47 км/ч), у стрелкового отделения 3 120 (около 24 км/ч)."
["TAvionDescriptor.VitesseLineaire"]
what = "Скорость полёта"
does = "Как быстро летит самолёт: от 13 000 до 46 800 в игре (около 225–810 км/ч)."
[VitesseLineaireAuSol]
what = "Скорость на земле"
does = "Как быстро самолёт катится по аэродрому при взлёте и посадке."
[VitesseLineaireIdle]
what = "Скорость патрулирования"
does = "Как быстро самолёт летит, кружа без задания, — медленнее своей полной скорости."
[VitesseCombat]
what = "Скорость в бою"
does = "Как быстро он движется в бою. У танков и машин обычно равна Скорости; у отделений и буксируемых орудий намного ниже (стрелковое отделение 1 040, около 8 км/ч; противотанковое орудие 520, около 4 км/ч, его толкает расчёт)."
[SpeedBonusOnRoad]
what = "Прибавка скорости на дороге"
does = "Насколько быстрее он едет по дороге, чем вне её: 0,6 — примерно на 60% быстрее. Отделения и орудия получают её как грузовик, в который превращаются. У самолётов и грузовиков 1."
[MaxAcceleration]
what = "Ускорение"
does = "Как быстро он набирает скорость. У большинства танков 3 900."
[MaxDeceleration]
what = "Торможение"
does = "Как быстро он замедляется и останавливается."
[TempsDemiTour]
what = "Время разворота"
does = "Сколько секунд нужно, чтобы развернуться в обратную сторону. Пехота 0,01 (сразу), машины 0,5, танки 1, самые медленные 6."
[Radius]
what = "Размер на земле"
does = "Сколько места занимает юнит: другие юниты держатся на таком расстоянии от его центра, объезжая его. Пехота 104–130 (около 0,5 м), танки 520–780 (2–3 м), орудия 390–650, грузовики 2 000, здания 7 800–13 000 (30–50 м)."
["TAvionDescriptor.Radius"]
what = "Размер в воздухе"
does = "Сколько места занимает самолёт, когда другие самолёты облетают его: от 780 до 2 600 (от 3 до 10 м)."
[StickToGround]
what = "Следует рельефу"
does = "1: юнит наклоняется вместе со склоном, на котором стоит. Есть у каждого наземного юнита и здания игры."
[Scale]
what = "Размер модели"
does = "Только внешний вид: 3D-модель юнита рисуется во столько раз больше. У юнитов 1, у пехоты 0,2, у зданий 0,1. Ползунок «Размер» в Studio у импортированной модели вместо этого меняет саму модель."
[DetectionBase]
what = "Дальность обзора"
does = "Как далеко он видит наземные юниты. Танк 104 000 (около 400 м); разведывательные машины 234 000 (900 м); самолёты-разведчики 195 000 (750 м). Panzer IV с одним лишь 234 000 не действовал как разведчик; остальное даёт поле «Роль»."
[PorteeVisionVolant]
what = "Дальность обзора по воздуху"
does = "Как далеко он видит самолёты. У большинства юнитов 208 000 (800 м); у некоторых 2 600 (10 м: они почти не видят самолёты)."
[SignatureRadar]
what = "Радарная сигнатура"
does = "Каким контактом он видится на вражеском радаре: 1 наземные юниты, 2 здания, 3 самолёты."
[AltitudeNoise]
what = "Колебание высоты"
does = "Только внешний вид: насколько колеблется высота самолёта в полёте (130–260, меньше 1 м)."
[PorteeAttackReflexAir]
what = "Дальность самостоятельной атаки (воздух)"
does = "Как далеко самолёт сам преследует вражеские самолёты без приказа: от 130 000 до 208 000 (от 500 до 800 м)."
[PorteeAttackReflexSol]
what = "Дальность самостоятельной атаки (земля)"
does = "Как далеко самолёт сам преследует наземные цели: 182 000 (700 м) у каждого самолёта игры."
[SecondaryWeaponMaxAmmo]
what = "Бомбы или ракеты на борту"
does = "Сколько выстрелов второго оружия (бомб, ракет) самолёт несёт, прежде чем лететь домой на перевооружение: от 1 до 4 в игре."
[ProductionPrice]
what = "Цена"
does = "Сколько стоит постройка, в $, на каждой из пяти дат сражения (игра хранит по цене на дату)."
[ProductionTime]
what = "Время постройки"
does = "Сколько секунд длится постройка. При нескольких заводах его вида она делится между ними."
[UpgradePrice]
what = "Цена исследования"
does = "Сколько стоит исследование, в $, прежде чем его можно строить (юниты, исследуемые из другого)."
[UpgradeTime]
what = "Время исследования"
does = "Сколько длится исследование, в секундах."
[IsUpgrade]

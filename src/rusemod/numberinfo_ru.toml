[DiveAttackStartAltitude]
what = "Высота начала пикирования"
does = "На какой высоте пикирующий бомбардировщик начинает пике: от 44 200 до 91 000 (от 170 до 350 м)."
[DiveAttackEndAltitude]
what = "Высота выхода из пике"

does = "Секунды, которые самолёт ждёт на заходе, прежде чем открыть огонь по наземной цели: от 0,1 до 4,5."
[GroundAttackAcceleration]
what = "Ускорение при атаке наземной цели"
does = "Как быстро самолёт разгоняется во время атаки наземной цели."

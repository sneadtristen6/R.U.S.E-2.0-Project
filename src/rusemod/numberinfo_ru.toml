[AltitudeDownAirport]
what = "Высота при посадке"
does = "На какой высоте самолёт, когда начинает снижаться к своему аэродрому: 65 000 (250 м)."
[AltitudeDownAttack]
what = "Высота атаки"
does = "Как низко самолёт снижается для атаки наземной цели: от 13 000 до 39 000 (от 50 до 150 м)."
[LengthDownAirport]
what = "Длина захода на посадку"
does = "Какой длины снижение самолёта к аэродрому: от 78 000 до 156 000 (от 300 до 600 м)."
[LengthUpAirport]
what = "Длина набора высоты после взлёта"
does = "Какой длины набор высоты самолёта после взлёта: от 52 000 до 130 000 (от 200 до 500 м)."
[LengthDownAttack]
what = "Длина снижения на цель"
does = "Какой длины снижение самолёта на наземную цель: от 13 000 до 208 000 (от 50 до 800 м)."
[LengthUpAttack]
what = "Длина выхода после атаки"
does = "Какой длины набор высоты самолёта после атаки наземной цели: от 13 000 до 208 000 (от 50 до 800 м)."
[DelaiAttackGround]

[DiveAttackAcceleration]
what = "Ускорение в пике"
does = "Как быстро пикирующий бомбардировщик разгоняется в пике."
[DiveAttackAngleToHit]
what = "Угол пикирования для сброса"
does = "Насколько крутым должно быть пике, прежде чем бомба будет сброшена: от 10 до 35 градусов."
[DiveAttackDownAngleSpeed]
what = "Скорость опускания носа"

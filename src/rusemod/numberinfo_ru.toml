# Справочник чисел на русском (rusemod.numberinfo; основной текст — английский в numberinfo.toml).
[SeuilMort]
what = "Здоровье"
does = "Сколько урона нужно, чтобы его уничтожить. У большинства танков, машин, отделений и орудий игры 400: «Тигра» прочнее джипа делает в основном его уровень брони (Броня), который уменьшает урон каждого выстрела, недостаточно сильного для неё. У зданий от 50 до 4 500."
[SeuilPinned]
what = "Порог прижатия"
does = "Сколько подавления нужно, чтобы юнит прижало к земле (он перестаёт двигаться и стреляет реже). Выстрелы, падающие рядом в радиусе подавления боеприпаса, его увеличивают. У большинства юнитов 200; выше = труднее прижать."
[ArmureHint]
what = "Показываемый уровень брони"
does = "Уровень брони, который показывают карточка юнита и меню постройки (число на щите, от 1 до 5). Поле «Броня» в Studio задаёт его вместе с самой бронёй, поэтому они всегда совпадают."
[BaseBlindage]
what = "Броня"
does = "Броня, с которой юнит сражается (от 1 до 10 в игре): чем она выше, тем меньше урона наносят ему более слабые боеприпасы. Меняйте её полем «Броня», которое выбирает один из уровней игры и сохраняет число на щите карточки (проверено в игре)."
[ReculeSeulementSiUberstress]
what = "Отходит, только когда полностью прижат"
does = "1: юнит отступает под огнём, только когда полностью прижат (крайнее подавление), не раньше. Есть у 38 юнитов игры."
[VitesseLineaire]
what = "Скорость"
does = "Как быстро он движется вне дорог. У «Шермана» 4 550 (около 35 км/ч), у джипа 6 110 (около 47 км/ч), у стрелкового отделения 3 120 (около 24 км/ч)."
["TAvionDescriptor.VitesseLineaire"]
what = "Скорость полёта"
does = "Как быстро летит самолёт: от 13 000 до 46 800 в игре (около 225–810 км/ч)."
[VitesseLineaireAuSol]
what = "Скорость на земле"
does = "Как быстро самолёт катится по аэродрому при взлёте и посадке."
[VitesseLineaireIdle]
what = "Скорость патрулирования"
does = "Как быстро самолёт летит, кружа без задания, — медленнее своей полной скорости."
[VitesseCombat]
what = "Скорость в бою"
does = "Как быстро он движется в бою. У танков и машин обычно равна Скорости; у отделений и буксируемых орудий намного ниже (стрелковое отделение 1 040, около 8 км/ч; противотанковое орудие 520, около 4 км/ч, его толкает расчёт)."
[SpeedBonusOnRoad]
what = "Прибавка скорости на дороге"
does = "Насколько быстрее он едет по дороге, чем вне её: 0,6 — примерно на 60% быстрее. Отделения и орудия получают её как грузовик, в который превращаются. У самолётов и грузовиков 1."
[MaxAcceleration]
what = "Ускорение"
does = "Как быстро он набирает скорость: игра каждые 0,2 секунды прибавляет к его скорости пятую часть этого значения, так что скорость, делённая на это значение, — сколько секунд он разгоняется до полной скорости (показано рядом с полем). У большинства танков 3 900: «Шерман» (4 550) выходит на полную скорость примерно за 1,2 с."
[MaxDeceleration]
what = "Торможение"
does = "Как быстро он замедляется и останавливается: скорость, делённая на это значение, — сколько секунд он останавливается с полной скорости (показано рядом с полем)."
[TempsDemiTour]
what = "Время разворота"
does = "Сколько секунд нужно, чтобы развернуться в обратную сторону. Пехота 0,01 (сразу), машины 0,5, танки 1, самые медленные 6."
[Radius]
what = "Размер на земле"
does = "Сколько места занимает юнит: другие юниты держатся на таком расстоянии от его центра, объезжая его. Пехота 104–130 (около 0,5 м), танки 520–780 (2–3 м), орудия 390–650, грузовики 2 000, здания 7 800–13 000 (30–50 м)."
["TAvionDescriptor.Radius"]
what = "Размер в воздухе"
does = "Сколько места занимает самолёт, когда другие самолёты облетают его: от 780 до 2 600 (от 3 до 10 м)."
[StickToGround]
what = "Следует рельефу"
does = "1: юнит наклоняется вместе со склоном, на котором стоит. Есть у каждого наземного юнита и здания игры."
[Scale]
what = "Размер модели"
does = "Только внешний вид: 3D-модель юнита рисуется во столько раз больше. У юнитов 1, у пехоты 0,2, у зданий 0,1. Ползунок «Размер» в Studio у импортированной модели вместо этого меняет саму модель."
[DetectionBase]
what = "Дальность обзора"
does = "Как далеко он видит наземные юниты. Танк 104 000 (около 400 м); разведывательные машины 234 000 (900 м); самолёты-разведчики 195 000 (750 м). Panzer IV с одним лишь 234 000 не действовал как разведчик; остальное даёт поле «Роль»."
[PorteeVisionVolant]
what = "Дальность обзора по воздуху"
does = "Как далеко он видит самолёты. У большинства юнитов 208 000 (800 м); у некоторых 2 600 (10 м: они почти не видят самолёты)."
[SignatureRadar]
what = "Радарная сигнатура"
does = "Каким контактом он видится на вражеском радаре: 1 наземные юниты, 2 здания, 3 самолёты."
[AltitudeNoise]
what = "Колебание высоты"
does = "Только внешний вид: насколько колеблется высота самолёта в полёте (130–260, меньше 1 м)."
[PorteeAttackReflexAir]
what = "Дальность самостоятельной атаки (воздух)"
does = "Как далеко самолёт сам преследует вражеские самолёты без приказа: от 130 000 до 208 000 (от 500 до 800 м)."
[PorteeAttackReflexSol]
what = "Дальность самостоятельной атаки (земля)"
does = "Как далеко самолёт сам преследует наземные цели: 182 000 (700 м) у каждого самолёта игры."
[SecondaryWeaponMaxAmmo]
what = "Бомбы или ракеты на борту"
does = "Сколько выстрелов второго оружия (бомб, ракет) самолёт несёт, прежде чем лететь домой на перевооружение: от 1 до 4 в игре."
[ProductionPrice]
what = "Цена"
does = "Сколько стоит постройка, в $, в каждом из пяти режимов игры, в порядке игры: 1945, 1942, 1939, Тотальная война, Ядерный (игра берёт цену режима боя)."
[ProductionTime]
what = "Время постройки"
does = "Сколько секунд длится постройка. Если его строят несколько заводов его вида, время делится между ними, но не бывает меньше наименьшего времени производства игры (на вкладке «Экономика»)."
[UpgradePrice]
what = "Цена исследования"
does = "Сколько стоит исследование, в $, прежде чем его можно строить (юниты, исследуемые из другого)."
[UpgradeTime]
what = "Время исследования"
does = "Сколько длится исследование, в секундах."
[IsUpgrade]
what = "Это улучшение"
does = "1: юнит — улучшение того, из которого он исследуется (после исследования заменяет его в меню постройки)."
[ShowInMenu]
what = "Показан в меню постройки"
does = "1: показан в меню постройки в этом режиме игры; по значению на каждый из пяти, в порядке игры: 1945, 1942, 1939, Тотальная война, Ядерный. Поздние танки игры показаны только в 1945, Тотальной войне и Ядерном."
[PositionInMenu]
what = "Место в меню"
does = "Где он стоит в своём меню постройки: юниты одной линии делят место, улучшения складываются на него."
[Factory]
what = "Завод"
does = "В каком меню постройки он находится (Studio показывает каждое меню по названию и позволяет перенести юнит в меню другой нации)."
[Menu]
what = "Меню зданий"
does = "На какой странице меню зданий находится здание."
[Nationalite]
what = "Нация"
does = "К какой стране он относится: 0 США, 1 Германия, 2 Великобритания, 3 Франция, 4 Италия, 5 СССР, 6 Япония."
[InitialFlagSet]
what = "Флаги"
does = "Флаги юнита: пронумерованные переключатели того, что он такое и что умеет. Каждый объяснён в Справочнике флагов, под флагами."
[DescriptorId]
what = "Id"
does = "Собственный номер юнита: у каждого юнита свой, и игра и сохранения находят его по нему. Studio даёт новому юниту свободный."
[TrackingId]
what = "Id статистики"
does = "Номер, под которым юнит знают статистика конца игры и учёт самой игры."
[Key]
what = "Ключ"
does = "Число, которое несут некоторые юниты (8 танков, 7 самолётов, 2 отделения); зачем оно, пока неизвестно."
[TypeForAcknow]
what = "Тип голоса"
does = "Каким набором голосовых реплик юнит отвечает на приказы."
[AcknowUnitType]
what = "Вид голоса"
does = "Какой вид юнита называют голосовые реплики (танк, пехота, самолёт...)."
[IconeType]
what = "Значок на карте"
does = "Какой значок юнит показывает на столе с картой при отдалении."
[Category]
what = "Категория"
does = "Каким видом юнита его считает игра: 1 разведка (её задаёт роль «Разведчик»; проверено в игре), 7 самолёты, 8 и 9 здания; остальные пока названы не все."
[CategorieIA]
what = "Категория для компьютера"
does = "Для чего компьютер использует юнит: 3 разведка (поле «Роль» задаёт её вместе с ролью; проверено в игре); остальные пока названы не все."
[CategoryVolant]
what = "Роль самолёта"
does = "Каким самолётом он летает (истребитель, истребитель-бомбардировщик, бомбардировщик, разведчик, десантный): как он движется и атакует. Меняйте её полем «Роль», которое заодно ставит флаги."
[IsDepotForIA]
what = "Склад для компьютера"
does = "1: компьютер считает это здание складом снабжения."
[TypeBatiment]
what = "Тип здания"
does = "Каким зданием оно является для игры (штаб, казарма, склад...). Здание-обманка с флагом 5 и TypeBatiment -7 производит по-настоящему."
[BuildPolicy]
what = "Где можно строить"
does = "Где можно ставить здание: 2 где угодно (оборона), 3 на площадке склада; без этого значения нужна дорога рядом."
[DistanceToRoad]
what = "Расстояние до дороги"
does = "Насколько близко к дороге нужно ставить здание: от 5 000 до 31 000 (от 20 до 120 м). Бункеры 8 000 (около 30 м)."
[CanBeSpawnedInMapMulti]
what = "Можно ставить на сетевых картах"
does = "1: здание можно поставить в сценарий сетевой карты."
["TBatimentPaths.Radius"]
what = "Пути вокруг здания"
does = "Как далеко вокруг здания проходят пути юнитов."
[TirEnMouvement]
what = "Стреляет на ходу"
does = "1: это оружие может стрелять, пока юнит едет."
[SalveNumber]
what = "Номер залпа"
does = "В каком залпе стреляет это оружие (-1: стреляет само по себе, не залпами)."
["TWeaponDescriptor.Salves"]
what = "Залпы"
does = "Стреляет ли оружие залпами (1) или выстрел за выстрелом (-1)."
[Puissance]
what = "Урон"
does = "Урон одного попадания до брони. Стрелковое оружие 2–10, танковые пушки от десятков до сотен, бомбы и V2 гораздо больше (до 2 000 000 у атомной бомбы). Юнит уничтожен, когда полученный урон достигает его Здоровья."
[Level]
what = "Уровень боеприпаса"
does = "Уровень боеприпаса (от 1 до 5). Игра соизмеряет его с бронёй цели: боеприпас более высокого уровня наносит больше урона бронированным юнитам. Как именно они сравниваются, пока не измерено."
[Arme]
what = "Тип оружия"
does = "Какое оружие им стреляет (пулемёт, пушка, гаубица, бомба...): против каких целей оно хорошо, и значок на карточке."
[PorteeMaximale]
what = "Дальность"
does = "Как далеко может попасть: от 13 000 (50 м) до 2 600 000 (10 км, V2). Танковые пушки обычно 65 000–130 000 (250–500 м)."
[PorteeMinimale]
what = "Минимальная дальность"
does = "Ближе этого стрелять не может (артиллерия и миномёты): от 13 000 до 169 000 (от 50 до 650 м)."
[TempsEntreDeuxTirs]
what = "Время между выстрелами"
does = "Секунды между двумя выстрелами: 0,2 у пулемёта, несколько секунд у танковой пушки, до 60 у самых тяжёлых орудий. Меньше = больше выстрелов."
[TempsEntreDeuxSalves]
what = "Время между залпами"
does = "Секунды между двумя залпами у оружия, стреляющего залпами (реактивные установки, бомбы)."
[NbTirParSalves]
what = "Выстрелов в залпе"
does = "Сколько выстрелов делает один залп: от 1 до 100."
[AngleDispersion]
what = "Разброс"
does = "Насколько выстрелы отклоняются от точки прицеливания: от 0,01 (около полградуса, очень точно) до 0,3 (17 градусов, артиллерия)."
[PourcentageTirDirect]
what = "Точность с места"
does = "Насколько вероятно попадание, когда юнит стоит: от 0,5 до 1 (от 50% до 100%)."
[PourcentageTirDirectEnMouvement]
what = "Точность на ходу"
does = "Насколько вероятно попадание, пока юнит движется: от 0,4 до 1 (от 40% до 100%)."
[RayonPinned]
what = "Радиус подавления"
does = "Как далеко от места падения выстрел подавляет юниты (увеличивает их подавление): от 130 (полметра) до 78 000 (300 м)."
[TirIndirect]
what = "Непрямой огонь"
does = "1: боеприпасом стреляют непрямой наводкой, через препятствия, по целям, которые обнаружили другие (артиллерия)."
[AllowAmbushShot]
what = "Может стрелять из засады"
does = "1: боеприпасом можно стрелять из засады в лесу."
[ProjectileType]
what = "Вид снаряда"
does = "Только внешний вид: какой выстрел рисуется в полёте (снаряд, пуля, ракета, бомба)."
[AmmunitionId]
what = "Id боеприпаса"
does = "Собственный номер боеприпаса (1000–1138): у каждого свой. Studio даёт копии свободный."
[NeedModelChange]
what = "Меняет модель при выстреле"
does = "Только внешний вид: 1 у противотанкового оружия отделений: при выстреле солдат переключается на модель, которая его держит."
[TempsAnimation]
what = "Длительность анимации выстрела"
does = "Только внешний вид: сколько длится анимация выстрела солдата (1,6 с у противотанкового оружия отделений)."
[FX_vitesse_de_depart]
what = "Скорость выстрела (рисуемого)"
does = "Только внешний вид: как быстро рисуемый выстрел покидает оружие, в единицах игры в секунду: от 150 до 520 000 (2 000 м в секунду)."
[FX_frottement]
what = "Сопротивление выстрела (рисуемого)"
does = "Только внешний вид: как быстро рисуемый выстрел замедляется в воздухе."
[FX_tir_tendu]
what = "Настильный выстрел (рисуемый)"
does = "Только внешний вид: 1 рисует выстрел плоским и прямым, а не дугой."
[FX_tir_sans_physic]
what = "Выстрел рисуется без физики"
does = "Только внешний вид: 1 рисует выстрел без гравитации и сопротивления."
[AltitudeDeVol]
what = "Высота полёта"
does = "Как высоко летит самолёт: от 52 000 до 208 000 (от 200 до 800 м)."
[ChaosAltitudeDeVol]
what = "Разброс высоты полёта"

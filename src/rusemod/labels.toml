# Display names for the game's data, in the game's own ten languages (schema DB annotations, PLAN.md L2), for any app
# or tool on the platform. The default everywhere is the game's own names (`base`): mods always use those. A modder can
# pick a language to read the tools in; anything missing here falls back to the game's name. Starter translations:
# corrections welcome. Each app keeps its own screen words (the Studio's are in ruse_studio/words.toml).
# Language codes are the game's folders: us fr ger ita spa pol ru cz jpn sc.

[languages]
us = "English"
fr = "Français"
ger = "Deutsch"
ita = "Italiano"
spa = "Español"
pol = "Polski"
ru = "Русский"
cz = "Čeština"
jpn = "日本語"
sc = "简体中文"

# Nation numbers (Nationalite; 0 is the default and isn't written). `base` is RUSE.exe's own table (FORMATS.md §3).

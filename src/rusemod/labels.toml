# A unit's flags (InitialFlagSet): every number of 0-104. The name in brackets at the end of each line is the game's
# own (81-89 all start with already_; 15 and 16 have none). What each one does comes from who carries it in the game's
# data, the community's mods and DomesticNukes and his Claude's tests in the game (2026); "tested" means it was tried
# in the game. The game's own units carry 56 of them; the others are state the game sets on units while it runs (in
# combat, camouflaged...): put in InitialFlagSet they do nothing (90 and 91 were tried), and each says so. A number
# above 104 is shown as is. 62 and 63 crash the game on anything but a truck: the build refuses that
# (rusemod.unitflags).
[flags.0]
us = "Airfield: aircraft are based here and built from it (aerodrome)"
fr = "Aérodrome : les avions y sont basés et produits (aerodrome)"
ger = "Flugplatz: Flugzeuge sind hier stationiert und werden hier gebaut (aerodrome)"
ita = "Aeroporto: gli aerei vi hanno base e vi vengono prodotti (aerodrome)"
spa = "Aeródromo: los aviones tienen aquí su base y se fabrican aquí (aerodrome)"

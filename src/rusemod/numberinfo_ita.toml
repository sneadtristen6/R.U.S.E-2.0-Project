what = "Preferenza: carri"
does = "Punti di preferenza aggiunti a ogni carro che può produrre. Nessun insieme del gioco lo usa, quindi la scheda IA non può proporlo (Aggiungi propone solo i valori che Predefinito elenca); gli script della campagna sì (Bonus_Tank, da 150 a 200)."

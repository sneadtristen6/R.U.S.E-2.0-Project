does = "Punti di preferenza aggiunti a ogni aereo che può produrre. Le preferenze si sommano per unità e contano solo le differenze tra le sue unità: valuta ogni unità per quanto sta sotto la sua preferita. Dal cielo +500 fa degli aerei il suo netto favorito."

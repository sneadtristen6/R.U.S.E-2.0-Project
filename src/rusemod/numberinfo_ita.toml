what = "Preferenza: artiglieria"
does = "Punti di preferenza aggiunti a ogni unità d'artiglieria che può produrre (vedi Preferenza: aerei per come si sommano). Obice +8.000 mette l'artiglieria molto davanti a tutto il resto."

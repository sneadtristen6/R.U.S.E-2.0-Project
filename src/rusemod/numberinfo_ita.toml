does = "Punti di preferenza aggiunti alle unità elencate, in una battaglia la cui modalità di gioco, difficoltà e profilo sono ciascuno nelle liste (una lista vuota va bene per tutti). Si sommano alle preferenze proprie dell'insieme (Preferenza: aerei…). La voce del gioco: +400 per i cannoni nucleari in modalità Nucleare, a ogni difficoltà e con ogni profilo."

# La guida ai numeri in italiano (rusemod.numberinfo; fa fede l'inglese in numberinfo.toml).
[SeuilMort]
what = "Salute"
does = "Quanti danni servono per distruggerla. La maggior parte dei carri, veicoli, squadre e cannoni del gioco ha 400: ciò che rende un Tiger più resistente di una jeep è soprattutto il suo livello di corazza (Corazza), che riduce i danni di ogni colpo non abbastanza forte per lei. Gli edifici hanno da 50 a 4.500."
[SeuilPinned]
what = "Soglia d'inchiodamento"
does = "Quanta soppressione serve prima che l'unità sia inchiodata (smette di avanzare e spara meno). I colpi che cadono vicino entro il raggio di soppressione della munizione la aumentano. La maggior parte delle unità ha 200; più alto = più difficile da inchiodare."
[ArmureHint]
what = "Livello di corazza mostrato"
does = "Il livello di corazza che la scheda e il menu di costruzione dell'unità mostrano (il numero sullo scudo, da 1 a 5). Il campo Corazza dello Studio lo imposta insieme alla corazza vera, così i due coincidono sempre."
[BaseBlindage]
what = "Corazza"
does = "La corazza con cui l'unità combatte (da 1 a 10 nel gioco): più è alta, meno danni le fanno le munizioni più deboli. Cambiala con il campo Corazza, che sceglie uno dei livelli del gioco e mantiene uguale il numero sullo scudo della scheda (visto in gioco)."
[ReculeSeulementSiUberstress]
what = "Ripiega solo se del tutto inchiodata"
does = "1: l'unità si ritira sotto il fuoco solo quando è completamente inchiodata (soppressione estrema), non prima. 38 unità del gioco ce l'hanno."
[VitesseLineaire]
what = "Velocità"
does = "Quanto veloce si sposta fuori strada. Uno Sherman ha 4.550 (circa 35 km/h), una jeep 6.110 (circa 47 km/h), una squadra di fucilieri 3.120 (circa 24 km/h)."
["TAvionDescriptor.VitesseLineaire"]
what = "Velocità di volo"
does = "Quanto veloce vola l'aereo: da 13.000 a 46.800 nel gioco (circa da 225 a 810 km/h)."
[VitesseLineaireAuSol]
what = "Velocità a terra"
does = "Quanto veloce l'aereo rulla sull'aeroporto al decollo e all'atterraggio."
[VitesseLineaireIdle]
what = "Velocità di pattuglia"
does = "Quanto veloce vola l'aereo quando gira in tondo senza nulla da fare, più lento della sua velocità massima."
[VitesseCombat]
what = "Velocità in combattimento"
does = "Quanto veloce si muove in combattimento. Per carri e veicoli di solito è uguale alla Velocità; per squadre e cannoni trainati è molto più lenta (una squadra di fucilieri 1.040, circa 8 km/h; un cannone anticarro 520, circa 4 km/h, spinto dai serventi)."
[SpeedBonusOnRoad]
what = "Bonus di velocità su strada"
does = "Quanto va più veloce su strada che fuori: 0,6 è circa il 60% più veloce. Squadre e cannoni lo ricevono come il camion in cui si trasformano. Aerei e camion hanno 1."
[MaxAcceleration]
what = "Accelerazione"
does = "Quanto rapidamente prende velocità: il gioco aggiunge un quinto di questo valore alla sua velocità ogni 0,2 secondi, quindi la sua velocità divisa per questo valore dà i secondi per arrivare alla velocità massima (mostrati accanto alla casella). La maggior parte dei carri ha 3.900: uno Sherman (4.550) è alla velocità massima in circa 1,2 s."
[MaxDeceleration]
what = "Frenata"
does = "Quanto rapidamente rallenta e si ferma: la sua velocità divisa per questo valore dà i secondi per fermarsi dalla velocità massima (mostrati accanto alla casella)."
[TempsDemiTour]
what = "Tempo d'inversione"
does = "Quanti secondi impiega a girarsi dall'altra parte. Fanteria 0,01 (subito), veicoli 0,5, carri 1, i più lenti 6."
[Radius]
what = "Ingombro a terra"
does = "Quanto spazio occupa l'unità: le altre unità restano a questa distanza dal suo centro quando la aggirano. Fanteria 104-130 (circa 0,5 m), carri 520-780 (2-3 m), cannoni 390-650, camion 2.000, edifici 7.800-13.000 (30-50 m)."
["TAvionDescriptor.Radius"]
what = "Ingombro in volo"
does = "Quanto spazio occupa l'aereo quando altri aerei gli volano intorno: da 780 a 2.600 (da 3 a 10 m)."
[StickToGround]
what = "Segue il terreno"
does = "1: l'unità s'inclina con il pendio su cui si trova. Ogni unità di terra ed edificio del gioco ce l'ha."
[Scale]
what = "Dimensione del modello"
does = "Solo aspetto: il modello 3D dell'unità disegnato tante volte la sua dimensione. Le unità hanno 1, la fanteria 0,2, gli edifici 0,1. Il cursore Dimensione dello Studio su un modello importato cambia invece il modello stesso."
[DetectionBase]
what = "Raggio visivo"
does = "Fin dove vede le unità di terra. Un carro 104.000 (circa 400 m); le autoblindo da ricognizione 234.000 (900 m); gli aerei da ricognizione 195.000 (750 m). Un Panzer IV con solo 234.000 non agiva da ricognitore; il campo Ruolo dà il resto."
[PorteeVisionVolant]
what = "Raggio visivo aereo"
does = "Fin dove vede gli aerei. La maggior parte delle unità 208.000 (800 m); alcune 2.600 (10 m: vedono a malapena gli aerei)."
[SignatureRadar]
what = "Firma radar"
does = "Come quale tipo di contatto appare sul radar nemico: 1 unità di terra, 2 edifici, 3 aerei."
[AltitudeNoise]
what = "Oscillazione di quota"
does = "Solo aspetto: quanto oscilla la quota dell'aereo in volo (130-260, meno di 1 m)."
[PorteeAttackReflexAir]
what = "Raggio d'attacco automatico (aria)"
does = "Fin dove un aereo insegue da solo gli aerei nemici, senza ordine: da 130.000 a 208.000 (da 500 a 800 m)."
[PorteeAttackReflexSol]
what = "Raggio d'attacco automatico (terra)"
does = "Fin dove un aereo insegue da solo i bersagli a terra: 182.000 (700 m) su ogni aereo del gioco."
[SecondaryWeaponMaxAmmo]
what = "Bombe o razzi trasportati"
does = "Quanti colpi della sua seconda arma (bombe, razzi) un aereo porta prima di tornare a riarmarsi: da 1 a 4 nel gioco."
[ProductionPrice]
what = "Prezzo"
does = "Quanto costa produrla, in $, in ciascuna delle cinque modalità di gioco, nell'ordine del gioco: 1945, 1942, 1939, Guerra totale, Nucleare (il gioco usa quello della modalità della battaglia)."
[ProductionTime]
what = "Tempo di costruzione"
does = "Quanti secondi servono a costruirla. Se più fabbriche del suo tipo la costruiscono, il tempo si divide tra loro, ma mai sotto il tempo di produzione minimo del gioco (quello della scheda Economia)."
[UpgradePrice]
what = "Prezzo della ricerca"
does = "Quanto costa ricercarla, in $, prima di poterla costruire (unità ricercate a partire da un'altra)."
[UpgradeTime]
what = "Tempo di ricerca"
does = "Quanto dura la ricerca, in secondi."
[IsUpgrade]
what = "È un miglioramento"
does = "1: l'unità è un miglioramento di quella da cui è ricercata (la sostituisce nel menu di costruzione una volta ricercata)."
[ShowInMenu]
what = "Mostrata nel menu di costruzione"
does = "1: mostrata nel suo menu di costruzione in quella modalità di gioco; un valore per ciascuna delle cinque, nell'ordine del gioco: 1945, 1942, 1939, Guerra totale, Nucleare. I carri di fine guerra del gioco sono mostrati solo in 1945, Guerra totale e Nucleare."
[PositionInMenu]
what = "Posto nel menu"
does = "Dove sta nel suo menu di costruzione: le unità della stessa linea condividono un posto, i miglioramenti vi si impilano."
[Factory]
what = "Fabbrica"
does = "In quale menu di costruzione si trova (lo Studio mostra ogni menu col suo nome e ti lascia spostare un'unità in quello di un'altra nazione)."
[Menu]
what = "Menu degli edifici"
does = "In quale pagina del menu degli edifici si trova l'edificio."
[Nationalite]
what = "Nazione"
does = "A quale paese appartiene: 0 USA, 1 Germania, 2 Regno Unito, 3 Francia, 4 Italia, 5 URSS, 6 Giappone."
[InitialFlagSet]
what = "Flag"
does = "I flag dell'unità: interruttori numerati per ciò che è e ciò che può fare. Ognuno è spiegato nella Guida ai flag, sotto i flag."
[DescriptorId]
what = "Id"
does = "Il numero proprio dell'unità: ogni unità ne ha uno diverso, e il gioco e i salvataggi la trovano con esso. Lo Studio dà a una nuova unità uno libero."
[TrackingId]
what = "Id delle statistiche"
does = "Il numero con cui le statistiche di fine partita e il tracciamento del gioco conoscono l'unità."
[Key]
what = "Chiave"
does = "Un numero che alcune unità portano (8 carri, 7 aerei, 2 squadre); il suo uso non è ancora noto."
[TypeForAcknow]
what = "Tipo di voce"
does = "Con quale serie di battute vocali l'unità risponde agli ordini."
[AcknowUnitType]
what = "Genere di voce"
does = "Quale tipo di unità nominano le battute vocali (carro, fanteria, aereo...)."
[IconeType]
what = "Icona sulla mappa"
does = "Quale icona l'unità mostra sul tavolo della mappa vista da lontano."
[Category]
what = "Categoria"
does = "Come quale tipo di unità il gioco la conta: 1 ricognizione (la imposta il ruolo Ricognitore; visto in gioco), 7 aerei, 8 e 9 edifici; le altre non hanno ancora tutte un nome."
[CategorieIA]
what = "Categoria per il computer"
does = "Per cosa il giocatore computer usa l'unità: 3 ricognizione (il campo Ruolo la imposta con il ruolo; visto in gioco); le altre non hanno ancora tutte un nome."
[CategoryVolant]
what = "Ruolo dell'aereo"
does = "Come quale tipo di aereo vola (caccia, cacciabombardiere, bombardiere, ricognitore, paracadutisti): come si muove e attacca. Cambialo con il campo Ruolo, che imposta i flag insieme."
[IsDepotForIA]
what = "Deposito per il computer"
does = "1: il giocatore computer tratta questo edificio come un deposito di rifornimenti."
[TypeBatiment]
what = "Tipo di edificio"
does = "Che tipo di edificio è per il gioco (QG, caserma, deposito...). Un edificio esca con il flag 5 e TypeBatiment -7 produce davvero."
[BuildPolicy]
what = "Dove si può costruire"
does = "Dove l'edificio può essere piazzato: 2 ovunque (difese), 3 su una piazzola di deposito; senza questo valore serve una strada vicina."
[DistanceToRoad]
what = "Distanza da una strada"
does = "Quanto vicino a una strada va piazzato l'edificio: da 5.000 a 31.000 (da 20 a 120 m). I bunker 8.000 (circa 30 m)."
[CanBeSpawnedInMapMulti]
what = "Piazzabile nelle mappe multigiocatore"
does = "1: l'edificio può essere messo nello scenario di una mappa multigiocatore."
["TBatimentPaths.Radius"]
what = "Percorsi intorno all'edificio"
does = "Fin dove intorno all'edificio passano i percorsi delle unità."
[TirEnMouvement]
what = "Spara in movimento"
does = "1: quest'arma può sparare mentre l'unità si muove."
[SalveNumber]
what = "Numero di salva"
does = "In quale salva spara quest'arma (-1: spara da sola, non a salve)."
["TWeaponDescriptor.Salves"]
what = "Salve"
does = "Se l'arma spara a salve (1) o colpo per colpo (-1)."
[Puissance]
what = "Danno"
does = "Il danno di un colpo a segno, prima della corazza. Armi leggere 2-10, cannoni dei carri da decine a centinaia, bombe e V2 molto di più (fino a 2.000.000 per la bomba atomica). Un'unità è distrutta quando i danni subiti raggiungono la sua Salute."
[Level]
what = "Livello della munizione"
does = "Il livello della munizione (da 1 a 5). Il gioco lo pesa contro la corazza del bersaglio: una munizione di livello più alto fa più danni alle unità corazzate. Come i due si confrontano non è ancora misurato."
[Arme]
what = "Tipo d'arma"
does = "Che tipo d'arma la spara (mitragliatrice, cannone, obice, bomba...): contro quali bersagli è efficace e l'icona sulla scheda."
[PorteeMaximale]
what = "Gittata"
does = "Fin dove può colpire: da 13.000 (50 m) a 2.600.000 (10 km, la V2). I cannoni dei carri di solito 65.000-130.000 (250-500 m)."
[PorteeMinimale]
what = "Gittata minima"
does = "Più vicino di così non può sparare (artiglieria e mortai): da 13.000 a 169.000 (da 50 a 650 m)."
[TempsEntreDeuxTirs]
what = "Tempo tra i colpi"
does = "Secondi tra due colpi: 0,2 per una mitragliatrice, qualche secondo per un cannone di carro, fino a 60 per i pezzi più pesanti. Più basso = più colpi."
[TempsEntreDeuxSalves]
what = "Tempo tra le salve"
does = "Secondi tra due salve, per le armi che sparano a salve (lanciarazzi, bombe)."
[NbTirParSalves]
what = "Colpi per salva"
does = "Quanti colpi spara una salva: da 1 a 100."
[AngleDispersion]
what = "Dispersione"
does = "Quanto i colpi si allontanano dal punto mirato: da 0,01 (circa mezzo grado, molto preciso) a 0,3 (17 gradi, artiglieria)."
[PourcentageTirDirect]
what = "Precisione da fermo"
does = "Quanto è probabile che un colpo vada a segno quando l'unità è ferma: da 0,5 a 1 (dal 50% al 100%)."
[PourcentageTirDirectEnMouvement]
what = "Precisione in movimento"
does = "Quanto è probabile che un colpo vada a segno mentre l'unità si muove: da 0,4 a 1 (dal 40% al 100%)."
[RayonPinned]
what = "Raggio di soppressione"
does = "Fin dove dal punto d'impatto un colpo sopprime le unità (aumenta la loro soppressione): da 130 (mezzo metro) a 78.000 (300 m)."
[TirIndirect]
what = "Tiro indiretto"
does = "1: la munizione è sparata in tiro indiretto, oltre gli ostacoli, su bersagli che altri avvistano (artiglieria)."
[AllowAmbushShot]
what = "Può tendere imboscate"
does = "1: la munizione può essere sparata da un'imboscata in un bosco."
[ProjectileType]
what = "Tipo di proiettile"
does = "Solo aspetto: che tipo di colpo è disegnato in volo (granata, pallottola, razzo, bomba)."
[AmmunitionId]
what = "Id della munizione"
does = "Il numero proprio della munizione (1000-1138): ognuna ne ha uno diverso. Lo Studio dà a una copia uno libero."
[NeedModelChange]
what = "Cambia modello quando spara"
does = "Solo aspetto: 1 sulle armi anticarro delle squadre: il soldato passa al modello che la impugna quando spara."
[TempsAnimation]
what = "Tempo prima del colpo"
does = "Secondi aggiunti al volo del colpo: il colpo arriva tanto più tardi, e il colpo disegnato ci mette tanto di più (1,6 s su granate e cariche, dal nome il tempo di lancio del soldato)."
[FX_vitesse_de_depart]
what = "Velocità del colpo"
does = "Quanto veloce vola il colpo, quindi quando arriva: il colpo conta solo quando arriva, un bersaglio in movimento viene mirato in anticipo del tempo di volo, e il colpo disegnato ci mette lo stesso tempo. Un colpo con fisica vola questo numero di unità di gioco al secondo, frenato dal suo attrito: da 9.000 a 520.000 (da 35 a 2.000 m al secondo; il proiettile perforante da 75 mm 120.000, circa 460 m al secondo). Un colpo senza fisica (Colpo senza fisica) va dritto a 26 volte questa velocità. Ogni volo è arrotondato ai 0,2 s successivi. Un colpo troppo lento per raggiungere il bersaglio viene accelerato del 5 % alla volta finché ci riesce: arriva comunque, solo più tardi."
[FX_frottement]
what = "Attrito del colpo"
does = "Quanto rapidamente un colpo con fisica rallenta nell'aria: più attrito, un volo più lungo sulla stessa distanza, quindi un colpo che arriva più tardi. I colpi del gioco hanno da 0,001 (la maggior parte) a 0,08. Un colpo senza fisica lo ignora."
[FX_tir_tendu]
what = "Tiro teso (disegnato)"
does = "Solo aspetto: 1 disegna il colpo piatto e dritto invece che ad arco."
[FX_tir_sans_physic]
what = "Colpo senza fisica"
does = "1: il colpo va dritto fino al punto d'arrivo a 26 volte la sua Velocità del colpo, senza gravità né attrito (armi leggere, mitragliatrici, quasi tutta la contraerea, bombe e granate del gioco); 0: vola con gravità e attrito (proiettili, mortai, razzi)."
[AltitudeDeVol]
what = "Quota di volo"
does = "Quanto in alto vola l'aereo: da 52.000 a 208.000 (da 200 a 800 m)."
[ChaosAltitudeDeVol]
what = "Variazione della quota di volo"
does = "Quanto varia la quota di volo da un aereo all'altro e nel tempo: da 7.800 a 32.500 (da 30 a 125 m)."
[AltitudeDownAirport]
what = "Quota all'atterraggio"
does = "A che quota è l'aereo quando inizia a scendere verso il suo aeroporto: 65.000 (250 m)."
[AltitudeDownAttack]
what = "Quota d'attacco"
does = "Quanto scende l'aereo per un attacco a terra: da 13.000 a 39.000 (da 50 a 150 m)."
[LengthDownAirport]
what = "Lunghezza dell'avvicinamento"
does = "Quanto è lunga la discesa dell'aereo verso l'aeroporto: da 78.000 a 156.000 (da 300 a 600 m)."
[LengthUpAirport]
what = "Lunghezza della salita dopo il decollo"
does = "Quanto è lunga la salita dell'aereo dopo il decollo: da 52.000 a 130.000 (da 200 a 500 m)."
[LengthDownAttack]
what = "Lunghezza della picchiata d'attacco"
does = "Quanto è lunga la discesa dell'aereo su un bersaglio a terra: da 13.000 a 208.000 (da 50 a 800 m)."
[LengthUpAttack]
what = "Lunghezza della richiamata dopo l'attacco"
does = "Quanto è lunga la salita dell'aereo dopo un attacco a terra: da 13.000 a 208.000 (da 50 a 800 m)."
[DelaiAttackGround]
what = "Attesa prima di un attacco a terra"
does = "Secondi che l'aereo aspetta durante il passaggio prima di sparare su un bersaglio a terra: da 0,1 a 4,5."
[GroundAttackAcceleration]
what = "Accelerazione in attacco a terra"
does = "Quanto rapidamente l'aereo accelera durante un attacco a terra."
[GroundAttackDecceleration]
what = "Rallentamento in attacco a terra"
does = "Quanto rapidamente l'aereo rallenta per un attacco a terra."
[MustDiveAttack]
what = "Bombardiere in picchiata"
does = "1: l'aereo attacca in una picchiata ripida (2 aerei del gioco ce l'hanno)."
[DiveAttackStartAltitude]
what = "Quota d'inizio picchiata"
does = "A che quota un bombardiere in picchiata inizia la picchiata: da 44.200 a 91.000 (da 170 a 350 m)."
[DiveAttackEndAltitude]
what = "Quota di richiamata"
does = "Fin dove scende un bombardiere in picchiata prima di richiamare: da 31.200 a 39.000 (da 120 a 150 m)."
[DiveAttackAcceleration]
what = "Accelerazione in picchiata"
does = "Quanto rapidamente un bombardiere in picchiata accelera nella picchiata."
[DiveAttackAngleToHit]
what = "Angolo di picchiata allo sgancio"
does = "Quanto deve essere ripida la picchiata prima che la bomba sia sganciata: da 10 a 35 gradi."
[DiveAttackDownAngleSpeed]
what = "Velocità d'abbassamento del muso"
does = "Quanto rapidamente un bombardiere in picchiata abbassa il muso nella picchiata (90 gradi al secondo)."
[DiveAttackDownRollSpeed]
what = "Velocità di rollio in picchiata"
does = "Quanto rapidamente un bombardiere in picchiata si rovescia all'inizio della picchiata (120 gradi al secondo)."
[DiveAttackUpAngleSpeed]
what = "Velocità di richiamata"
does = "Quanto rapidamente un bombardiere in picchiata rialza il muso uscendo dalla picchiata (da 35 a 50 gradi al secondo)."
[DiveAttackUpRollSpeed]
what = "Velocità di rollio in uscita"
does = "Quanto rapidamente un bombardiere in picchiata torna livellato dopo la picchiata (60 gradi al secondo)."
[LoopingStartAltitude]
what = "Quota d'inizio del looping"
does = "A che quota è un aereo quando inizia un looping per ripassare: da 57.200 a 109.200 (da 220 a 420 m)."
[LoopingAltitudeToHit]
what = "Quota in cima al looping"
does = "Quanto è alta la cima del looping dell'aereo: da 70.200 a 124.800 (da 270 a 480 m)."
[LoopingAcceleration]
what = "Accelerazione nel looping"
does = "Quanto rapidamente l'aereo accelera uscendo da un looping."
[LoopingDecceleration]
what = "Rallentamento nel looping"
does = "Quanto rapidamente l'aereo rallenta salendo in un looping."
[LoopingPitchAngleSpeedStart]
what = "Velocità di beccheggio (inizio looping)"
does = "Quanto rapidamente il muso dell'aereo sale all'inizio del looping (20 gradi al secondo)."
[LoopingPitchAngleSpeedEnd]
what = "Velocità di beccheggio (fine looping)"
does = "Quanto rapidamente il muso dell'aereo gira alla fine del looping: da 30 a 90 gradi al secondo."
[PitchAngleMax]
what = "Salita o discesa più ripida"
does = "Quanto l'aereo può alzare o abbassare il muso in volo normale: da 5 a 80 gradi."
[RollAngleMax]
what = "Inclinazione massima"
does = "Quanto l'aereo s'inclina in virata: da 5 a 50 gradi."
[RollAcceleration]
what = "Accelerazione di rollio"
does = "Quanto rapidamente l'aereo entra ed esce da un'inclinazione (da 4 a 8)."
[RollRatioSpeed]
what = "Inclinazione per virata"
does = "Quanto l'aereo s'inclina per una data virata: da 0,1 a 2."
[RadiusStandard]
what = "Raggio di virata"
does = "Quanto sono larghe le virate normali dell'aereo: da 26.000 a 104.000 (da 100 a 400 m)."
[RadiusApproach]
what = "Raggio d'avvicinamento"
does = "Quanto sono larghe le virate dell'aereo mentre si avvicina a dove è stato mandato: da 10.400 a 104.000 (da 40 a 400 m)."
[RadiusApproachAttackGround]
what = "Raggio d'avvicinamento per un attacco a terra"
does = "Quanto sono larghe le virate dell'aereo mentre si allinea per un attacco a terra: da 20.800 a 104.000 (da 80 a 400 m)."
[RadiusApproachEngage]
what = "Raggio d'avvicinamento per un duello aereo"
does = "Quanto sono larghe le virate dell'aereo mentre si avvicina a un aereo nemico: da 15.600 a 52.000 (da 60 a 200 m)."
[RadiusEngage]
what = "Distanza d'inizio duello"
does = "Quanto vicino deve essere un aereo nemico perché l'aereo inizi un duello: da 10.400 a 104.000 (da 40 a 400 m)."
[RadiusEngaged]
what = "Raggio di virata in duello"
does = "Quanto sono larghe le virate dell'aereo in un duello aereo: da 26.000 a 104.000 (da 100 a 400 m)."
[RadiusChangeAltitude]
what = "Distanza per cambiare quota"
does = "Quanto vola l'aereo mentre cambia quota: da 9.750 a 52.000 (da 40 a 200 m)."
[CrashGravity]
what = "Caduta quando abbattuto"
does = "Quanto rapidamente cade un aereo abbattuto: da 1.300 a 5.200."
[CrashPitchAcceleration]
what = "Muso giù quando abbattuto"
does = "Solo aspetto: quanto rapidamente il muso di un aereo abbattuto scende sempre più in fretta (da 1 a 5 gradi al secondo, ogni secondo)."
[CrashPitchMaxSpeed]
what = "Muso giù più rapido quando abbattuto"
does = "Solo aspetto: la velocità massima con cui scende il muso di un aereo abbattuto (da 5 a 35 gradi al secondo)."
[CrashRollAcceleration]
what = "Avvitamento quando abbattuto"
does = "Solo aspetto: quanto rapidamente un aereo abbattuto inizia ad avvitarsi (da 8 a 70 gradi al secondo, ogni secondo)."
[CrashRollMaxSpeed]
what = "Avvitamento più rapido quando abbattuto"

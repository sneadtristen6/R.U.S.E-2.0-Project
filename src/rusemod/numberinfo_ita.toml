# --- i giocatori del computer (la scheda IA) ---
[AttaqueTempsActivation]
what = "Secondi prima di iniziare ad attaccare"
does = "Quanti secondi di battaglia aspetta prima di attaccare; fino ad allora non molesta né manda aiuto a un deposito minacciato. Predefinito 30; Facile 300 (5 minuti); Testuggine 600 (10 minuti). Difficile e Blitzkrieg non lo elencano, quindi contano 0: attaccano dal primo secondo."
[OffensiveNbMissionMax]
what = "Attacchi contemporanei al massimo"
does = "Il massimo di attacchi (e rappresaglie) che conduce insieme. -1 vuol dire nessun limite, ciò che usano tutti gli insiemi del gioco."
[MissionFacteurLancementAttaque]
what = "Aggressività (soglia d'attacco)"
does = "Ciò che i progettisti di missioni del gioco chiamano la sua aggressività (Agressivite, che gli script della campagna cambiano durante la missione): il gioco la moltiplica per un fattore fisso e confronta le forze in un luogo prima di lanciarvi un attacco. Gli insiemi del gioco: Predefinito 0,7; Facile e Blitzkrieg 0,2; Difficile 0,9; Testuggine 1. In che direzione lo spinga un numero più alto non è ancora misurato: provalo in gioco."
[MissionFacteurEnoughToDestroy]
what = "Forza radunata contro un nemico"
does = "Quanta forza manda a un attacco, come multiplo della forza nemica lì (i progettisti di missioni lo chiamano rinforzo per l'attacco, Renfort_pour_attaque). Predefinito 1,2; Facile 0,2; Medio 1,4; Difficile 1,8; Blitzkrieg 1,5; Testuggine 1."
[DefenseDistanceMenace]
what = "Distanza di minaccia"
does = "A che distanza da un luogo che difende un nemico conta come minaccia; il gioco rende la zona sorvegliata circa 1,4 volte questa distanza (la distanza per la radice di 2). 312.000 (1.200 m) negli insiemi del gioco; Testuggine 26.000.000 (100 km: tutto sulla mappa è una minaccia)."
[DefenseDistanceUrgent]
what = "Distanza di minaccia urgente"

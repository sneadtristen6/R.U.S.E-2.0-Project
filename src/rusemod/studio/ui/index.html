<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RUSE Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">RUSE <span>Studio</span></div>
    <label class="pick-mod"><span id="mod-label">Mod</span>
      <select id="mod"></select>
    </label>
    <button id="play" type="button" class="primary" disabled></button>
    <label class="lang"><span id="lang-label">Language</span>
      <select id="lang"></select>
    </label>
  </header>

  <form id="new-mod" class="new-mod hidden">
    <input id="new-mod-name" autocomplete="off" maxlength="60" required>
    <button id="new-mod-create" type="submit" class="primary"></button>
    <button id="new-mod-cancel" type="button" class="ghost"></button>
  </form>

  <main class="layout">
    <aside class="browser">
      <input id="search" type="search" autocomplete="off">
      <div id="kinds" class="chips" role="group"></div>
      <div id="nations" class="chips" role="group"></div>
      <div id="count" class="muted small"></div>
      <ul id="unit-list" class="unit-list"></ul>
    </aside>

    <section id="detail" class="detail" aria-live="polite">
      <p id="pick" class="muted"></p>
    </section>
  </main>

  <section id="play-panel" class="play-panel hidden">
    <pre id="play-log"></pre>
    <button id="play-log-close" type="button" class="ghost"></button>
  </section>
  <footer id="status" class="status" role="status"></footer>

  <section id="no-index" class="no-index hidden">
    <p id="no-index-text"></p>
    <button id="build-index" type="button" class="primary"></button>
    <pre id="build-log" class="hidden"></pre>
  </section>

  <script src="fake-api.js"></script>
  <script src="app.js"></script>
</body>
</html>

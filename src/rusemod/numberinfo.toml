# What every number of the game's units and buildings, and of the parts they own or link to (weapons, ammunition,
# armour, plane flight, turrets, graphics, sounds), means: the Studio's number guide (rusemod.numberinfo; the owner,
# 2026-10-15: "We need to know everything that has a number behind it that relates to these units and buildings",
# "Include the looks only. But just describe what the look is", "Include all numbers"). English for now.
#
# A key is a property's name ("SeuilMort"), or "Class.Property" where the same name means something else on that
# class ("TAvionDescriptor.VitesseLineaire").
# group: health, movement, sight, combat, ammo, production, menu, identity, computer, flight, turret, looks, sound,
#   interface, effects.
# unit: how to read the number:
#   m       = a distance, 260 game units to a metre (measured on the game's maps by the R.U.S.E 2.0 Project);
#   kmh     = a ground speed, 130 game units to 1 km/h: the km/h the game's own unit panel shows (its
#             UnitDescriptorResource speed factor for ground units, 18), which LittleGroove's figure matches;
#   kmh_air = a plane's speed, 57.78 game units to 1 km/h: the same panel's km/h for planes (its plane factor, 8);
#   accel   = an acceleration, 260 game units to 1 m/s per second (LittleGroove; not timed by us yet);
#   s       = seconds; deg = an angle in radians, shown in degrees; degs = radians a second, shown in degrees a second;
#   money   = dollars, as the build menu shows them; pts = points the game counts with, no real-world unit;
#   count = how many; times = a multiplier; share = a share from 0 to 1, shown as a %; level = a level the game
#   compares; choice = one of a list of kinds; yesno = 1 yes, 0 no; id = a number that names something; mask = bits,
#   each one a switch; frame = an animation frame; raw = a number with no known unit yet.
# sure: tried = seen in the game; known = certain from the game's own data and menus; community = from the community
#   or LittleGroove's work, not checked by us; name = from its name and the values the game's units have; not tried.

# --- health and toughness ---
[SeuilMort]
group = "health"
unit = "pts"
sure = "known"
what = "Health"
does = "How much damage it takes to destroy it. Most of the game's tanks, cars, squads and guns have 400: what makes a Tiger tougher than a jeep is mostly its armour level (Armour), which cuts the damage of every shot that isn't strong enough for it. Buildings have from 50 to 4,500."

[SeuilPinned]
group = "health"
unit = "pts"
sure = "known"
what = "Pinned threshold"
does = "How much suppression it takes before the unit is pinned down (stops moving and fires less). Shots landing near it within the ammo's suppression radius add suppression. Most units have 200; higher = harder to pin."

[ArmureHint]
group = "health"
unit = "level"
sure = "tried"
what = "Armour level shown"
does = "The armour level the unit's card and build menu show (the number on the shield, 1 to 5). The Studio's Armour box sets it together with the armour itself, so the two always agree."

[BaseBlindage]
group = "health"
unit = "level"
sure = "tried"
what = "Armour"
does = "The armour the unit fights with (1 to 10 in the game): the higher it is, the less damage weaker ammo does to it. Change it with the Armour box, which picks one of the game's levels and keeps the card's shield number the same (seen in the game)."

[ReculeSeulementSiUberstress]
group = "health"
unit = "yesno"
sure = "name"
what = "Falls back only when fully pinned"
does = "1: the unit only retreats under fire once it's completely pinned (extreme suppression), not before. 38 of the game's units have it."


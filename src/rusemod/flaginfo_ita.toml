# La guida ai flag in italiano (rusemod.flaginfo; fa fede l'inglese in flaginfo.toml).
[0]
what = "Aeroporto"
does = "Fa di un edificio un aeroporto: i tuoi aerei vi sono basati, e cliccare col tuo aereo sul tuo aeroporto lo manda ad atterrare. La pianificazione della ricognizione del computer ne cerca uno."
use = "Solo per gli aeroporti. Su altro, il gioco lo tratta solo come un posto dove gli aerei possono atterrare."

[1]
what = "Artiglieria (tiro indiretto)"
does = "L'unità spara in modo indiretto, su ciò che altre unità avvistano, come gli obici del gioco. Dice anche al computer di usarla come artiglieria."
use = "Funziona su qualsiasi unità: DomesticNukes l'ha dato a 410 unità di ogni tipo, e tutte hanno sparato indirettamente."

[2]
what = "Aereo"
does = "L'unità è un aereo: costruita alla torre di controllo dell'aeroporto, torna a rifornirsi, non prende ordini a terra. Tutti i 63 aerei del gioco ce l'hanno, e nient'altro."
use = "Lascialo su ogni aereo. Non metterlo mai su un'unità di terra: il gioco cercherebbe di costruirla alla torre di controllo di un aeroporto."
danger_why = "Su un'unità che non è un aereo, costruirla dovrebbe fermare il gioco con un errore di script (cerca la torre di controllo di un aeroporto)."


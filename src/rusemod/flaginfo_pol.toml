# Przewodnik po flagach po polsku (rusemod.flaginfo; wiążący jest angielski w flaginfo.toml).
[0]
what = "Lotnisko"
does = "Robi z budynku lotnisko: twoje samoloty mają tu bazę, a kliknięcie samolotem na własne lotnisko wysyła go do lądowania. Planowanie zwiadu przez komputer szuka lotniska."
use = "Tylko dla lotnisk. Na czymś innym gra traktuje to tylko jako miejsce, gdzie samoloty mogą lądować."

[1]
what = "Artyleria (ogień pośredni)"
does = "Jednostka strzela pośrednio, w to, co wypatrzą inne jednostki, jak haubice w grze. Mówi też komputerowi, by używał jej jako artylerii."
use = "Działa na każdej jednostce: DomesticNukes dał ją 410 jednostkom wszelkiego rodzaju i wszystkie strzelały pośrednio."

[2]
what = "Samolot"
does = "Jednostka jest samolotem: budowana przy wieży kontrolnej lotniska, wraca tankować, nie przyjmuje rozkazów naziemnych. Ma ją wszystkie 63 samoloty gry i nic poza nimi."
use = "Zostaw na każdym samolocie. Nigdy nie dawaj jednostce naziemnej: gra próbowałaby ją zbudować przy wieży kontrolnej lotniska."
danger_why = "Na jednostce, która nie jest samolotem, jej budowa powinna zatrzymać grę błędem skryptu (gra szuka wieży kontrolnej lotniska)."


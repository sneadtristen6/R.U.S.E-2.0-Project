<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RUSE Mod Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">RUSE <span>Mod Platform</span></div>
    <div id="status" class="status" role="status">Looking for R.U.S.E.…</div>
    <button id="choose" class="small hidden" type="button">Choose folder…</button>
  </header>

  <main class="layout">
    <section class="sets" aria-labelledby="sets-title">
      <h2 id="sets-title">Mod sets</h2>
      <ul id="set-list" class="set-list"></ul>
      <button id="open-sets" class="small ghost" type="button">Open mod sets folder</button>
    </section>

    <section class="active" aria-live="polite">
      <h1 id="active-name">Vanilla</h1>
      <p id="active-description" class="muted"></p>
      <ul id="active-mods" class="mods"></ul>
      <p id="active-error" class="error hidden"></p>
      <button id="play" class="play" type="button">Play</button>
      <p id="play-message" class="message"></p>
      <details id="progress" class="progress hidden">
        <summary>Details</summary>
        <pre id="log"></pre>
      </details>
    </section>
  </main>

  <footer class="bottom">
    <button class="small ghost" type="button" disabled title="Coming soon">Join a friend</button>
    <button class="small ghost" type="button" disabled title="Coming soon">Browse mods</button>
  </footer>

  <script src="fake-api.js"></script>
  <script src="app.js"></script>
</body>
</html>

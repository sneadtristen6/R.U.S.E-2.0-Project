<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RUSE Studio</title>
  <link rel="stylesheet" href="style.css">
  <!-- the Maps view's 3D library (three.js, MIT) comes from the internet, like the 3D check, until the Studio ships
       its own copy; it's only loaded when the Maps view opens -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
                   "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<body>
  <header class="top">
    <div class="brand"><img src="logo.png" alt="" width="30" height="30">RUSE <span>Studio</span>
      <small id="app-version" class="app-version"></small></div>
    <div class="tabs" role="tablist">
      <button id="tab-units" type="button" role="tab" aria-selected="true"></button>
      <button id="tab-maps" type="button" role="tab" aria-selected="false"></button>
      <button id="tab-settings" type="button" role="tab" aria-selected="false"></button>
    </div>
    <label id="pick-mod" class="pick-mod"><span id="mod-label">Mod</span>
      <select id="mod"></select>
    </label>
    <!-- the Maps tab's own: maps are kept apart from mods (app.js renderMods, StudioApi.mods(kind="map")) -->
    <label id="pick-map" class="pick-mod hidden"><span id="map-project-label">Map</span>
      <select id="map-project"></select>
    </label>
    <button id="test" type="button" class="primary" disabled></button>
    <button id="troubleshoot" type="button" class="ghost"></button>
  </header>
  <div id="update-bar" class="update-bar hidden" role="status"><span id="update-text"></span>
    <button id="update-now" class="small" type="button"></button>
    <button id="update-info" class="small ghost" type="button"></button></div>
  <!-- what changes from the running version to the new one (rusemod.update.changes_since), opened from the bar -->
  <div id="update-changes" class="update-changes hidden"></div>
  <!-- the mod check (app.js checkMod): what the build would stop at, and a way out for each broken map file -->
  <div id="check-bar" class="check-bar hidden" role="alert"></div>

  <form id="new-mod" class="new-mod hidden">
    <input id="new-mod-name" autocomplete="off" maxlength="60" required>
    <button id="new-mod-create" type="submit" class="primary"></button>
    <button id="new-mod-cancel" type="button" class="ghost"></button>
  </form>

  <form id="export-mod" class="new-mod hidden">
    <label><span id="export-version-label"></span> <input id="export-version" class="short" autocomplete="off" maxlength="30" required></label>
    <label><span id="export-author-label"></span> <input id="export-author" autocomplete="off" maxlength="80"></label>
    <label><span id="export-description-label"></span> <input id="export-description" class="wide" autocomplete="off" maxlength="300"></label>
    <button id="export-go" type="submit" class="primary"></button>
    <button id="export-cancel" type="button" class="ghost"></button>
    <span id="export-help" class="muted small"></span>
  </form>

  <main id="units-view" class="layout">
    <aside class="browser">
      <input id="search" type="search" autocomplete="off">
      <div id="kinds" class="chips" role="group"></div>
      <div id="nations" class="chips" role="group"></div>
      <select id="unit-group" class="unit-group"></select>
      <div id="count" class="muted small"></div>
      <ul id="unit-list" class="unit-list"></ul>
    </aside>

    <section id="detail" class="detail" aria-live="polite">
      <p id="pick" class="muted"></p>
    </section>
  </main>

  <main id="maps-view" class="layout hidden">
    <aside class="browser">
      <div class="browser-head">
        <select id="map-kind" class="map-kind"></select>
        <button id="maps-fold" type="button" class="ghost fold">«</button>
      </div>
      <ul id="map-list" class="unit-list"></ul>
    </aside>
    <section class="map-stage">
      <div id="map-canvas" class="map-canvas"></div>
      <!-- how long the road being drawn is, beside the pointer (maps.js showRoadLength) -->
      <div id="road-length" class="road-length hidden"></div>
      <p id="map-pick" class="map-pick muted"></p>
      <div id="map-hud" class="map-hud hidden">
        <div id="map-title" class="map-title"></div>
        <div id="map-stats" class="muted small"></div>
        <div class="map-controls">
          <button id="map-detail" type="button" class="chip"></button>
          <label class="small"><input id="map-water" type="checkbox" checked> <span id="map-water-label"></span></label>
          <label class="small"><input id="map-cover" type="checkbox"> <span id="map-cover-label"></span></label>
          <label class="small"><input id="map-move" type="checkbox"> <span id="map-move-label"></span></label>
          <label class="small"><input id="map-roads" type="checkbox"> <span id="map-roads-label"></span></label>
        </div>
        <!-- what stands on the map (maps.js, StudioApi.map_scenery): every building, a sample of props and trees -->
        <div class="map-controls">
          <label class="small"><input id="scenery-building" type="checkbox" checked> <span id="scenery-building-label"></span></label>
          <label class="small"><input id="scenery-prop" type="checkbox" checked> <span id="scenery-prop-label"></span></label>
          <label class="small"><input id="scenery-vegetation" type="checkbox" checked> <span id="scenery-vegetation-label"></span></label>
        </div>
        <div id="scenery-stats" class="muted small"></div>
        <!-- what the colours on the ground mean (maps.js renderLegend), and a see-through slider per layer -->
        <div id="map-legend" class="map-legend small hidden"></div>
        <details id="map-layers" class="map-layers small">
          <summary id="map-layers-label"></summary>
          <div id="map-layers-rows" class="layer-rows"></div>
        </details>
        <!-- the map's scenarios (maps.js, StudioApi.map_scenarios): zones, starting points, spawns, names -->
        <div class="map-controls">
          <label class="small"><input id="scen-show" type="checkbox" checked> <span id="scen-show-label"></span></label>
          <select id="scen-pick" class="small scen-pick"></select>
        </div>
        <div id="scen-stats" class="muted small"></div>
        <div id="scen-where" class="small scen-where"></div>
        <div id="scenery-hover" class="small"></div>
        <div id="map-ground" class="small"></div>
        <div id="map-help" class="muted small"></div>
        <div id="map-keys" class="muted small map-keys"></div>
      </div>
      <!-- the tools along the bottom, by kind (maps.js DOCK, DOCK_GROUPS), as Cities: Skylines does it: a bar of kinds
           (those that go together on one tile), and above it the picked kind's tray. Brush strokes are saved in the current mod's maps/<map>/terrain.toml, placed
           objects in scenery.toml, scenario edits in scenario.toml. -->
      <div id="map-dock" class="map-dock hidden">
        <div id="dock-tray" class="dock-tray hidden">
          <!-- a tile for two kinds (maps.js DOCK_GROUPS) shows a tab for each beside its name -->
          <div class="tray-head"><span id="tray-title" class="tray-title"></span>
            <div id="tray-tabs" class="tray-tabs" role="tablist"></div>
            <span id="tray-tip" class="muted small"></span></div>
          <div id="tray-brush" class="tray-body hidden">
            <div id="brush-list" class="tool-tiles" role="group"></div>
            <div class="tray-side">
              <label class="brush-slider small"><span id="brush-size-label"></span>
                <input id="brush-size" type="range" min="1" max="15" step="1" value="6"></label>
              <label id="brush-strength-row" class="brush-slider small"><span id="brush-strength-label"></span>
                <input id="brush-strength" type="range" min="1" max="100" step="1" value="50"></label>
              <!-- the Erase brush: what its new circles take, and what that does in the game (maps.js renderBrushes) -->
              <div id="brush-erase" class="tray-erase hidden">
                <div id="brush-erase-what" class="chips" role="group"></div>
                <div id="brush-erase-trees" class="muted small"></div>
                <div id="brush-erase-warn" class="small error-text"></div>
              </div>
              <div class="map-controls">
                <button id="brush-undo" type="button" class="ghost" disabled></button>
                <button id="brush-clear" type="button" class="ghost danger" disabled></button>
                <span id="brush-count" class="muted small"></span>
              </div>
              <div id="brush-sure" class="sure hidden"><span id="brush-sure-text" class="small"></span>
                <button id="brush-clear-yes" type="button" class="ghost danger"></button>
                <button id="brush-clear-no" type="button" class="ghost"></button></div>
              <div id="brush-note" class="small"></div>
            </div>
          </div>
          <div id="tray-place" class="tray-body hidden">
            <div class="tray-main">
              <input id="place-search" type="search" class="place-search">
              <select id="place-type" size="5" class="place-list"></select>
              <!-- cover and movement live in other map files: placed scenery gives no cover, but buildings stop units (Solid) -->
              <div id="place-scenery-note" class="muted small"></div>
            </div>
            <div class="tray-side">
              <div id="place-how" class="chips" role="group"></div>
              <label class="brush-slider small"><span id="place-turn-label"></span>
                <input id="place-turn" type="range" min="0" max="345" step="15" value="0"></label>
              <label class="brush-slider small"><span id="place-size-label"></span>
                <input id="place-size" type="range" min="0.5" max="10" step="0.1" value="1"></label>
              <label id="place-spacing-row" class="brush-slider small hidden"><span id="place-spacing-label"></span>
                <input id="place-spacing" type="range" min="2" max="100" step="1" value="8"></label>
              <label id="place-area-row" class="brush-slider small hidden"><span id="place-area-label"></span>
                <input id="place-area" type="range" min="10" max="300" step="5" value="40"></label>
              <label id="place-solid-row" class="small check-row"><input id="place-solid" type="checkbox" checked>
                <span id="place-solid-label"></span></label>
              <div class="map-controls">
                <button id="place-undo" type="button" class="ghost" disabled></button>
                <span id="place-count" class="muted small"></span>
              </div>
              <div id="place-note" class="small"></div>
            </div>
          </div>
          <!-- new roads (maps.js road): drawn Cities: Skylines style, saved in the mod's maps/<map>/roads.toml -->
          <div id="tray-roads" class="tray-body hidden">
            <div class="tray-main">
              <div id="road-tools" class="tool-tiles" role="group"></div>
              <div id="road-help" class="muted small"></div>
            </div>
            <div class="tray-side">
              <div class="map-controls">
                <button id="road-finish" type="button" class="small hidden" disabled></button>
                <button id="road-undo" type="button" class="ghost" disabled></button>
                <span id="road-count" class="muted small"></span>
              </div>
              <div id="road-note" class="small"></div>
            </div>
          </div>
          <!-- the map's own bridge kinds (maps.js bridge): one placed by hand, saved with the mod's placed objects;
               new roads' water crossings drawn in gold -->
          <div id="tray-bridges" class="tray-body hidden">
            <div class="tray-main">
              <div id="bridge-kinds" class="kind-list" role="group"></div>
              <div id="bridge-map-note" class="small"></div>
            </div>
            <div class="tray-side">
              <div id="bridge-help" class="muted small"></div>
              <label class="brush-slider small"><span id="bridge-length-label"></span>
                <input id="bridge-length" type="range" min="30" max="90" step="1" value="40"></label>
              <label class="brush-slider small"><span id="bridge-turn-label"></span>
                <input id="bridge-turn" type="range" min="0" max="355" step="5" value="0"></label>
              <div class="map-controls">
                <button id="bridge-undo" type="button" class="ghost" disabled></button>
                <span id="bridge-count" class="muted small"></span>
              </div>
              <div id="bridge-note" class="small"></div>
            </div>
          </div>
          <!-- "Check this map" (maps.js check): what would go wrong with the mod on this map, found before the game -->
          <div id="tray-check" class="tray-body hidden">
            <div class="tray-main">
              <div class="map-controls">
                <button id="check-run" type="button"></button>
              </div>
              <div id="check-status" class="muted small"></div>
            </div>
            <div class="tray-side">
              <div id="check-list" class="finding-list"></div>
            </div>
          </div>
          <!-- editing the picked scenario (maps.js scen.tool): items moved, units and buildings spawned, in the mod -->
          <div id="tray-scen" class="tray-body hidden">
            <div class="tray-main">
              <div id="scen-tools" class="tool-tiles" role="group">
                <button id="scen-move" type="button" class="tool-tile"></button>
                <button id="scen-spawn" type="button" class="tool-tile"></button>
                <button id="scen-start" type="button" class="tool-tile"></button>
              </div>
              <div id="scen-team" class="chips hidden" role="group"></div>
              <div id="scen-kind" class="chips hidden" role="group"></div>
              <div id="scen-group" class="chips hidden" role="group"></div>
              <div id="scen-count" class="chips hidden" role="group"></div>
              <div id="scen-formation" class="tool-tiles hidden" role="group"></div>
            </div>
            <div class="tray-side">
              <!-- what the map shows of the scenario, kind by kind, and the icons' size (maps.js SCEN_LAYERS): view only -->
              <div id="scen-layers" class="chips" role="group"></div>
              <label id="scen-size-row" class="brush-slider small"><span id="scen-size-label"></span>
                <input id="scen-size" type="range" min="40" max="160" step="5" value="100"></label>
              <select id="scen-unit" size="5" class="place-list hidden"></select>
              <div id="scen-camp" class="chips hidden" role="group"></div>
              <!-- a depot spot and a starting point go beside the nearest road (maps.js snapToRoad): off = where clicked -->
              <label id="scen-snap-row" class="small hidden"><input id="scen-snap" type="checkbox"> <span id="scen-snap-label"></span></label>
              <label id="scen-gap-row" class="brush-slider small hidden"><span id="scen-gap-label"></span>
                <input id="scen-gap" type="range" min="4" max="150" step="1" value="25"></label>
              <div id="scen-players" class="chips hidden" role="group"></div>
              <div id="scen-players-note" class="small"></div>
              <div id="scen-note" class="small"></div>
            </div>
          </div>
        </div>
        <div id="dock-bar" class="dock-bar" role="toolbar">
          <button id="brush-look" type="button" class="dock-tile"></button>
          <span class="dock-gap"></span>
          <div id="dock-kinds" class="dock-kinds"></div>
        </div>
      </div>
    </section>
  </main>

  <section id="test-panel" class="test-panel hidden">
    <!-- a test the build stopped: its mistakes, each with its fix (app.js showTestProblems) -->
    <div id="test-problems" class="test-problems hidden" role="alert"></div>
    <pre id="test-log"></pre>
    <div class="test-actions">
      <button id="test-log-copy" type="button" class="ghost"></button>
      <button id="test-log-close" type="button" class="ghost"></button>
    </div>
  </section>
  <!-- Settings (app.js SETTINGS: one section per setting, so a new one is one more entry) -->
  <main id="settings-view" class="settings-view hidden">
    <div class="settings">
      <h1 id="settings-title"></h1>
      <section class="setting" id="set-language">
        <h2 id="set-language-title"></h2><p id="set-language-help" class="muted small"></p>
        <label class="lang"><span id="lang-label" class="sr-only">Language</span><select id="lang"></select></label>
      </section>
      <section class="setting" id="set-keys">
        <h2 id="set-keys-title"></h2><p id="set-keys-help" class="muted small"></p>
        <div id="keys-panel" class="keys-panel"></div>
      </section>
      <section class="setting" id="set-game">
        <h2 id="set-game-title"></h2><p id="set-game-path" class="small"></p>
        <div class="actions"><button id="set-game-change" type="button" class="small"></button></div>
      </section>
      <!-- the clean game backup (rusemod.backup, app.js renderBackup): the only way the Studio writes into the game's
           own folder, and only when the modder asks for a restore -->
      <section class="setting" id="set-backup">
        <h2 id="set-backup-title"></h2><p id="set-backup-help" class="muted small"></p>
        <p id="backup-status" class="small"></p>
        <div class="actions">
          <button id="backup-make" type="button" class="small"></button>
          <button id="backup-check" type="button" class="small"></button>
          <button id="backup-restore" type="button" class="small"></button>
          <button id="backup-verify" type="button" class="ghost"></button>
        </div>
        <label class="check-row small muted"><input id="backup-deep" type="checkbox"> <span id="backup-deep-label"></span></label>
        <div id="backup-ask"></div>
        <p id="backup-note" class="small" role="status"></p>
        <div id="backup-files" class="backup-files"></div>
      </section>
      <section class="setting" id="set-updates">
        <h2 id="set-updates-title"></h2><p id="set-updates-text" class="small"></p>
        <div class="actions"><button id="set-updates-check" type="button" class="small"></button></div>
      </section>
      <!-- the wiki, Discussions and a bug report (rusemod.community): the apps only open pages, they send nothing -->
      <section class="setting" id="set-help">
        <h2 id="set-help-title"></h2><p id="set-help-help" class="muted small"></p>
        <div class="actions"><button id="help-wiki" type="button" class="small"></button>
          <button id="help-discussions" type="button" class="small"></button>
          <button id="help-troubleshoot" type="button" class="small"></button>
          <button id="help-report" type="button" class="small primary"></button></div>
      </section>
    </div>
  </main>

  <!-- the troubleshooter (app.js openDoctor, StudioApi.troubleshoot): one row per finding, a fix button when the app
       can run one -->
  <dialog id="doctor" class="doctor" aria-labelledby="doctor-title">
    <h2 id="doctor-title"></h2>
    <p id="doctor-intro" class="muted small"></p>
    <ul id="doctor-list" class="doctor-list" aria-live="polite"></ul>
    <p id="doctor-note" class="small" role="status"></p>
    <div class="actions">
      <button id="doctor-again" type="button" class="small"></button>
      <button id="doctor-copy" type="button" class="small"></button>
      <button id="doctor-close" type="button" class="small ghost"></button>
    </div>
  </dialog>

  <!-- Share your mod (app.js openShare): the steps onto the supported-mods list (MOD_FORMAT §15), and after an export
       the file's size, SHA-256 and its index.toml entry -->
  <dialog id="share" class="doctor" aria-labelledby="share-title">
    <h2 id="share-title"></h2>
    <p id="share-lead" class="muted small"></p>
    <ol class="share-steps"><li id="share-step-export"></li><li id="share-step-pr"></li><li id="share-step-post"></li></ol>
    <div id="share-file" class="share-file hidden">
      <span id="share-file-name"></span>
      <code id="share-sha"></code>
      <span id="share-entry-label" class="muted"></span>
      <textarea id="share-entry" rows="9" readonly spellcheck="false"></textarea>
      <div class="actions"><button id="share-copy" type="button" class="small"></button>
        <span id="share-note" class="small"></span></div>
    </div>
    <div class="actions">
      <button id="share-open" type="button" class="small primary"></button>
      <button id="share-discussions" type="button" class="small"></button>
      <button id="share-close" type="button" class="small ghost"></button>
    </div>
  </dialog>

  <footer id="status" class="status" role="status"></footer>

  <section id="no-index" class="no-index hidden">
    <p id="no-index-text"></p>
    <button id="build-index" type="button" class="primary"></button>
    <pre id="build-log" class="hidden"></pre>
  </section>

  <script src="fake-api.js"></script>
  <script src="app.js"></script>
  <script type="module" src="maps.js"></script>
</body>
</html>

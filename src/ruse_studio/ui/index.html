<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RUSE Studio</title>
  <link rel="stylesheet" href="style.css">
  <!-- the Maps view's 3D library (three.js, MIT) comes from the internet, like the 3D check, until the Studio ships
       its own copy; it's only loaded when the Maps view opens -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
                   "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<body>
  <header class="top">
    <div class="brand">RUSE <span>Studio</span></div>
    <div class="tabs" role="tablist">
      <button id="tab-units" type="button" role="tab" aria-selected="true"></button>
      <button id="tab-maps" type="button" role="tab" aria-selected="false"></button>
      <button id="tab-settings" type="button" role="tab" aria-selected="false"></button>
    </div>
    <label class="pick-mod"><span id="mod-label">Mod</span>
      <select id="mod"></select>
    </label>
    <button id="test" type="button" class="primary" disabled></button>
  </header>
  <div id="update-bar" class="update-bar hidden" role="status"><span id="update-text"></span>
    <button id="update-now" class="small" type="button"></button>
    <button id="update-info" class="small ghost" type="button"></button></div>

  <form id="new-mod" class="new-mod hidden">
    <input id="new-mod-name" autocomplete="off" maxlength="60" required>
    <button id="new-mod-create" type="submit" class="primary"></button>
    <button id="new-mod-cancel" type="button" class="ghost"></button>
  </form>

  <form id="export-mod" class="new-mod hidden">
    <label><span id="export-version-label"></span> <input id="export-version" class="short" autocomplete="off" maxlength="30" required></label>
    <label><span id="export-author-label"></span> <input id="export-author" autocomplete="off" maxlength="80"></label>
    <label><span id="export-description-label"></span> <input id="export-description" class="wide" autocomplete="off" maxlength="300"></label>
    <button id="export-go" type="submit" class="primary"></button>
    <button id="export-cancel" type="button" class="ghost"></button>
    <span id="export-help" class="muted small"></span>
  </form>

  <main id="units-view" class="layout">
    <aside class="browser">
      <input id="search" type="search" autocomplete="off">
      <div id="kinds" class="chips" role="group"></div>
      <div id="nations" class="chips" role="group"></div>
      <div id="count" class="muted small"></div>
      <ul id="unit-list" class="unit-list"></ul>
    </aside>

    <section id="detail" class="detail" aria-live="polite">
      <p id="pick" class="muted"></p>
    </section>
  </main>

  <main id="maps-view" class="layout hidden">
    <aside class="browser">
      <ul id="map-list" class="unit-list"></ul>
    </aside>
    <section class="map-stage">
      <div id="map-canvas" class="map-canvas"></div>
      <p id="map-pick" class="map-pick muted"></p>
      <div id="map-hud" class="map-hud hidden">
        <div id="map-title" class="map-title"></div>
        <div id="map-stats" class="muted small"></div>
        <div class="map-controls">
          <button id="map-detail" type="button" class="chip"></button>
          <label class="small"><input id="map-water" type="checkbox" checked> <span id="map-water-label"></span></label>
        </div>
        <!-- what stands on the map (maps.js, StudioApi.map_scenery): every building, a sample of props and trees -->
        <div class="map-controls">
          <label class="small"><input id="scenery-building" type="checkbox" checked> <span id="scenery-building-label"></span></label>
          <label class="small"><input id="scenery-prop" type="checkbox" checked> <span id="scenery-prop-label"></span></label>
          <label class="small"><input id="scenery-vegetation" type="checkbox" checked> <span id="scenery-vegetation-label"></span></label>
        </div>
        <div id="scenery-stats" class="muted small"></div>
        <!-- the map's scenarios (maps.js, StudioApi.map_scenarios): zones, starting points, spawns, names -->
        <div class="map-controls">
          <label class="small"><input id="scen-show" type="checkbox" checked> <span id="scen-show-label"></span></label>
          <select id="scen-pick" class="small scen-pick"></select>
        </div>
        <div id="scen-stats" class="muted small"></div>
        <div id="scenery-hover" class="small"></div>
        <div id="map-ground" class="small"></div>
        <div id="map-help" class="muted small"></div>
        <div id="map-keys" class="muted small map-keys"></div>
      </div>
      <!-- the brushes (maps.js): strokes are saved in the current mod's maps/<map>/terrain.toml -->
      <div id="map-tools" class="map-tools hidden">
        <div id="brush-title" class="map-title"></div>
        <div id="brush-list" class="chips brush-list" role="group"></div>
        <label class="brush-slider small"><span id="brush-size-label"></span>
          <input id="brush-size" type="range" min="1" max="15" step="1" value="6"></label>
        <label class="brush-slider small"><span id="brush-strength-label"></span>
          <input id="brush-strength" type="range" min="1" max="100" step="1" value="50"></label>
        <div class="map-controls">
          <button id="brush-look" type="button" class="chip"></button>
          <button id="brush-undo" type="button" class="ghost" disabled></button>
          <button id="brush-clear" type="button" class="ghost danger" disabled></button>
        </div>
        <div id="brush-sure" class="sure hidden"><span id="brush-sure-text" class="small"></span>
          <button id="brush-clear-yes" type="button" class="ghost danger"></button>
          <button id="brush-clear-no" type="button" class="ghost"></button></div>
        <div id="brush-count" class="muted small"></div>
        <div id="brush-note" class="small"></div>
        <!-- placing objects (maps.js): saved in the current mod's maps/<map>/scenery.toml -->
        <div id="place-title" class="map-title place-title"></div>
        <!-- for now, scenery is only for looks (DomesticNukes' note): cover and movement live in other map files -->
        <div id="place-scenery-note" class="muted small"></div>
        <div id="place-groups" class="chips brush-list" role="group"></div>
        <input id="place-search" type="search" class="place-search">
        <select id="place-type" size="6" class="place-list"></select>
        <label class="brush-slider small"><span id="place-turn-label"></span>
          <input id="place-turn" type="range" min="0" max="345" step="15" value="0"></label>
        <label class="brush-slider small"><span id="place-size-label"></span>
          <input id="place-size" type="range" min="0.5" max="3" step="0.1" value="1"></label>
        <!-- how a click places: one object, an area painted by dragging, or a line between two clicks -->
        <div id="place-how" class="chips brush-list" role="group"></div>
        <label id="place-spacing-row" class="brush-slider small hidden"><span id="place-spacing-label"></span>
          <input id="place-spacing" type="range" min="2" max="100" step="1" value="8"></label>
        <label id="place-area-row" class="brush-slider small hidden"><span id="place-area-label"></span>
          <input id="place-area" type="range" min="10" max="300" step="5" value="40"></label>
        <div class="map-controls">
          <button id="place-on" type="button" class="chip"></button>
          <button id="place-undo" type="button" class="ghost" disabled></button>
        </div>
        <div id="place-count" class="muted small"></div>
        <div id="place-note" class="small"></div>
      </div>
    </section>
  </main>

  <section id="test-panel" class="test-panel hidden">
    <pre id="test-log"></pre>
    <button id="test-log-close" type="button" class="ghost"></button>
  </section>
  <!-- Settings (app.js SETTINGS: one section per setting, so a new one is one more entry) -->
  <main id="settings-view" class="settings-view hidden">
    <div class="settings">
      <h1 id="settings-title"></h1>
      <section class="setting" id="set-language">
        <h2 id="set-language-title"></h2><p id="set-language-help" class="muted small"></p>
        <label class="lang"><span id="lang-label" class="sr-only">Language</span><select id="lang"></select></label>
      </section>
      <section class="setting" id="set-keys">
        <h2 id="set-keys-title"></h2><p id="set-keys-help" class="muted small"></p>
        <div id="keys-panel" class="keys-panel"></div>
      </section>
      <section class="setting" id="set-game">
        <h2 id="set-game-title"></h2><p id="set-game-path" class="small"></p>
        <div class="actions"><button id="set-game-change" type="button" class="small"></button></div>
      </section>
      <section class="setting" id="set-updates">
        <h2 id="set-updates-title"></h2><p id="set-updates-text" class="small"></p>
        <div class="actions"><button id="set-updates-check" type="button" class="small"></button></div>
      </section>
    </div>
  </main>

  <footer id="status" class="status" role="status"></footer>

  <section id="no-index" class="no-index hidden">
    <p id="no-index-text"></p>
    <button id="build-index" type="button" class="primary"></button>
    <pre id="build-log" class="hidden"></pre>
  </section>

  <script src="fake-api.js"></script>
  <script src="app.js"></script>
  <script type="module" src="maps.js"></script>
</body>
</html>

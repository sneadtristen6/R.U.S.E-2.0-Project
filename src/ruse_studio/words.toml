jpn = "ユニットの通行範囲を表示：赤はすべて通行不可（水・崖・マップ外）、黄は車両のみ不可（森）。"
sc = "显示单位可达之处：红色对所有单位关闭（水、悬崖、地图外），黄色仅对车辆关闭（树林）。"


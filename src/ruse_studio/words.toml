pol = "Pobierz kolor do dopasowania: naciśnij tu, potem kliknij grunt albo budynek, obiekt lub drzewo, by wziąć jego własny kolor (bez oświetlenia). Alt+klik pędzlem Kolor działa tak samo."
ru = "Взять цвет для подбора: нажмите здесь, затем щёлкните по земле или по зданию, объекту или дереву, чтобы взять его собственный цвет (без освещения). Alt+щелчок кистью «Цвет» делает то же самое."

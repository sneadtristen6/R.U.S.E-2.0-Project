ger = "Der Build zeichnet einen weißen Punkt, wo jeder Spieler beginnt, wo auch immer die Startpunkte beim Bauen sind: ein verschobener Start verschiebt seinen Punkt. Aus lassen für ein Bild mit eigenen Punkten."
ita = "La build disegna un punto bianco dove parte ogni giocatore, ovunque siano i punti di partenza al momento della build: una partenza spostata sposta il suo punto. Lascialo spento per un'immagine con i suoi punti."
spa = "La compilación dibuja un punto blanco donde empieza cada jugador, estén donde estén los puntos de inicio al compilar: un inicio movido mueve su punto. Déjalo desactivado para una imagen con sus propios puntos."
pol = "Budowanie rysuje białą kropkę tam, gdzie zaczyna każdy gracz, gdziekolwiek są punkty startowe w chwili budowania: przesunięty start przesuwa swoją kropkę. Zostaw wyłączone dla obrazu z własnymi kropkami."
ru = "Сборка рисует белую точку там, где начинает каждый игрок, где бы ни были точки старта во время сборки: сдвинутый старт сдвигает свою точку. Оставьте выключенным для картинки со своими точками."

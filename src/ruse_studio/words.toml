[tip_tab_values]
us = "Every value of the game's units and other objects, even the ones the other tabs don't show. For when the other tabs don't have what you want to change."
fr = "Toutes les valeurs des unités et autres objets du jeu, même celles que les autres onglets ne montrent pas. Pour quand les autres onglets n'ont pas ce que vous voulez changer."
ger = "Alle Werte der Einheiten und anderen Objekte des Spiels, auch die, die die anderen Reiter nicht zeigen. Für alles, was die anderen Reiter nicht haben."
ita = "Tutti i valori delle unità e degli altri oggetti del gioco, anche quelli che le altre schede non mostrano. Per quando le altre schede non hanno ciò che vuoi cambiare."
spa = "Todos los valores de las unidades y demás objetos del juego, incluso los que las otras pestañas no muestran. Para cuando las otras pestañas no tienen lo que quieres cambiar."
pol = "Wszystkie wartości jednostek i innych obiektów gry, także te, których nie pokazują inne karty. Na wypadek, gdy inne karty nie mają tego, co chcesz zmienić."
ru = "Все значения юнитов и других объектов игры, даже те, что не показывают другие вкладки. Когда в других вкладках нет того, что вы хотите изменить."
cz = "Všechny hodnoty jednotek a dalších objektů hry, i ty, které ostatní karty neukazují. Pro chvíle, kdy ostatní karty nemají to, co chcete změnit."
jpn = "ゲームのユニットやその他のオブジェクトのすべての値。ほかのタブに表示されない値も含みます。ほかのタブで変えたいものが見つからないときに。"
sc = "游戏中单位和其他对象的所有数值，包括其他标签页不显示的。当其他标签页里没有你想改的内容时使用。"

[values_help]
us = "Every value of the game's unit data, even the ones the other tabs don't show. 1. Pick a file or type a name on the left. 2. Click what you want. 3. Change a value: it's saved in the current mod at once. Hold the mouse over anything to see what it does. From LittleGroove's raw editor in RUSE Mod Manager. Not tried in the game yet."
fr = "Toutes les valeurs des données d'unités du jeu, même celles que les autres onglets ne montrent pas. 1. Choisissez un fichier ou tapez un nom à gauche. 2. Cliquez sur ce que vous voulez. 3. Changez une valeur : elle est enregistrée tout de suite dans le mod actuel. Laissez la souris sur un élément pour voir ce qu'il fait. Repris de l'éditeur brut de LittleGroove dans RUSE Mod Manager. Pas encore essayé en jeu."
ger = "Alle Werte der Einheitendaten des Spiels, auch die, die die anderen Reiter nicht zeigen. 1. Links eine Datei wählen oder einen Namen eingeben. 2. Auf das Gewünschte klicken. 3. Einen Wert ändern: Er wird sofort im aktuellen Mod gespeichert. Mit der Maus über etwas fahren, um zu sehen, was es tut. Aus LittleGrooves Roh-Editor in RUSE Mod Manager. Im Spiel noch nicht ausprobiert."
ita = "Tutti i valori dei dati delle unità del gioco, anche quelli che le altre schede non mostrano. 1. Scegli un file o scrivi un nome a sinistra. 2. Clicca su ciò che vuoi. 3. Cambia un valore: viene salvato subito nella mod attuale. Tieni il mouse su qualsiasi cosa per vedere cosa fa. Dall'editor grezzo di LittleGroove in RUSE Mod Manager. Non ancora provato in gioco."
spa = "Todos los valores de los datos de unidades del juego, incluso los que las otras pestañas no muestran. 1. Elige un archivo o escribe un nombre a la izquierda. 2. Haz clic en lo que quieras. 3. Cambia un valor: se guarda al momento en el mod actual. Deja el ratón sobre cualquier cosa para ver qué hace. Del editor en bruto de LittleGroove en RUSE Mod Manager. Aún no probado en el juego."
pol = "Wszystkie wartości danych jednostek gry, także te, których nie pokazują inne karty. 1. Wybierz plik albo wpisz nazwę po lewej. 2. Kliknij to, co chcesz. 3. Zmień wartość: od razu zapisuje się w bieżącym modzie. Przytrzymaj mysz nad czymkolwiek, by zobaczyć, co to robi. Z surowego edytora LittleGroove'a w RUSE Mod Manager. Jeszcze nie sprawdzone w grze."
ru = "Все значения данных юнитов игры, даже те, что не показывают другие вкладки. 1. Выберите файл или введите имя слева. 2. Нажмите на нужное. 3. Измените значение: оно сразу сохраняется в текущем моде. Наведите мышь на что угодно, чтобы узнать, что это делает. Из «сырого» редактора LittleGroove в RUSE Mod Manager. В игре ещё не проверено."
cz = "Všechny hodnoty dat jednotek hry, i ty, které ostatní karty neukazují. 1. Vlevo vyberte soubor nebo napište název. 2. Klikněte na to, co chcete. 3. Změňte hodnotu: hned se uloží do aktuálního modu. Podržte myš nad čímkoli a uvidíte, co to dělá. Ze surového editoru od LittleGroove v RUSE Mod Manageru. Ve hře zatím nevyzkoušeno."
jpn = "ゲームのユニットデータのすべての値。ほかのタブに表示されない値も含みます。1. 左でファイルを選ぶか名前を入力します。2. 目的のものをクリックします。3. 値を変えると、すぐ現在のMODに保存されます。何にでもマウスを重ねると、その働きが表示されます。RUSE Mod Manager の LittleGroove の生データエディターより。ゲーム内ではまだ試していません。"
sc = "游戏单位数据的所有数值，包括其他标签页不显示的。1. 在左侧选择文件或输入名称。2. 点击你想要的对象。3. 修改数值：会立即保存到当前模组中。把鼠标停在任何东西上即可看到它的作用。来自 RUSE Mod Manager 中 LittleGroove 的原始数据编辑器。尚未在游戏中试过。"


[export_help]
us = "Packs it into one file and puts it straight into the Launcher's mod library, ready for a mod set (the file is kept in the exports folder too, to share). The version, author and description are kept."
fr = "L'empaquette en un seul fichier et le place directement dans la bibliothèque du Launcher, prêt pour un ensemble de mods (le fichier est aussi gardé dans le dossier exports, pour le partager). La version, l'auteur et la description sont conservés."
ger = "Packt es in eine Datei und legt es direkt in die Mod-Bibliothek des Launchers, bereit für ein Mod-Set (die Datei bleibt auch im Ordner exports, zum Teilen). Version, Autor und Beschreibung bleiben erhalten."
ita = "Lo impacchetta in un unico file e lo mette subito nella libreria del Launcher, pronto per un set di mod (il file resta anche nella cartella exports, da condividere). Versione, autore e descrizione vengono conservati."
spa = "Lo empaqueta en un solo archivo y lo pone directamente en la biblioteca del Launcher, listo para un conjunto de mods (el archivo también queda en la carpeta exports, para compartir). Se guardan la versión, el autor y la descripción."
pol = "Pakuje do jednego pliku i od razu umieszcza w bibliotece Launchera, gotowe do zestawu modów (plik zostaje też w folderze exports, do udostępnienia). Wersja, autor i opis są zachowane."
ru = "Упаковывает в один файл и сразу кладёт в библиотеку модов лаунчера, готовым для набора модов (файл остаётся и в папке exports, чтобы делиться). Версия, автор и описание сохраняются."
cz = "Zabalí do jednoho souboru a rovnou ho vloží do knihovny módů Launcheru, připravený pro sadu módů (soubor zůstane i ve složce exports ke sdílení). Verze, autor a popis se zachovají."
jpn = "1つのファイルにまとめ、ランチャーのMODライブラリにそのまま入れます（MODセットですぐ使えます。共有用にファイルは exports フォルダーにも残ります）。バージョン、作者、説明は保持されます。"

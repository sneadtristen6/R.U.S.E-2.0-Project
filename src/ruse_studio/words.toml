[dup_scratch_lead]
us = "Want to start from scratch? Pick Blank Terrain or Blank Ocean below. Every new map sits on one of the game's maps, because the game can't load a map made from nothing: that map gives yours its size, its player count and its starting points, and nothing else. Pick which one under Built on."
fr = "Envie de partir de zéro ? Choisissez Terrain vierge ou Océan vierge ci-dessous. Toute nouvelle carte repose sur une carte du jeu, car le jeu ne peut pas charger une carte faite de rien : cette carte donne à la vôtre sa taille, son nombre de joueurs et ses points de départ, et rien d'autre. Choisissez laquelle sous Repose sur."
ger = "Von Grund auf anfangen? Wählen Sie unten Leeres Gelände oder Leerer Ozean. Jede neue Karte baut auf einer Karte des Spiels auf, denn das Spiel kann keine Karte aus dem Nichts laden: diese Karte gibt Ihrer die Größe, die Spielerzahl und die Startpunkte, sonst nichts. Welche, wählen Sie unter Aufgebaut auf."
ita = "Vuoi partire da zero? Scegli Terreno vuoto o Oceano vuoto qui sotto. Ogni nuova mappa poggia su una mappa del gioco, perché il gioco non può caricare una mappa fatta dal nulla: quella mappa dà alla tua le dimensioni, il numero di giocatori e i punti di partenza, e nient'altro. Scegli quale sotto Poggia su."
spa = "¿Quieres empezar desde cero? Elige Terreno en blanco u Océano en blanco abajo. Todo mapa nuevo se apoya en un mapa del juego, porque el juego no puede cargar un mapa hecho de la nada: ese mapa le da al tuyo su tamaño, su número de jugadores y sus puntos de inicio, y nada más. Elige cuál en Se apoya en."
pol = "Chcesz zacząć od zera? Wybierz poniżej Pusty teren albo Pusty ocean. Każda nowa mapa opiera się na jednej z map gry, bo gra nie wczyta mapy zrobionej z niczego: ta mapa daje twojej rozmiar, liczbę graczy i punkty startowe, nic więcej. Którą, wybierasz pod Oparta na."
ru = "Хотите начать с нуля? Выберите ниже «Пустую землю» или «Пустой океан». Любая новая карта основана на одной из карт игры, потому что игра не может загрузить карту, сделанную из ничего: та карта даёт вашей размер, число игроков и точки старта — и больше ничего. Какую — выберите в поле «Основана на»."
cz = "Chcete začít od nuly? Vyberte níže Prázdný terén nebo Prázdný oceán. Každá nová mapa stojí na některé mapě hry, protože hra nenačte mapu udělanou z ničeho: ta mapa dá vaší velikost, počet hráčů a startovní body, nic víc. Kterou, vyberete pod Stojí na."
jpn = "ゼロから作りますか？下の「空白の地形」か「空白の海」を選んでください。新しいマップは必ずゲームのいずれかのマップの上に作られます。ゲームは何もないところからマップを読み込めないためです。そのマップから引き継ぐのは大きさ、プレイヤー数、開始地点だけです。どのマップにするかは「土台のマップ」で選びます。"
sc = "想从零开始？在下面选择“空白地形”或“空白海洋”。每张新地图都建立在游戏的某张地图之上，因为游戏无法加载凭空做出的地图：那张地图只为你的地图提供大小、玩家数量和出生点，别无其他。在“基于地图”中选择用哪一张。"


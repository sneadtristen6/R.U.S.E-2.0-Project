[legend_spawn_icons]
us = "Icons: what a scenario puts there at the start, by what it's for: HQ (star), supply depot (crate), factory, fort (shield), decoy (?), and units by what builds them (soldier, tank, anti-tank gun, artillery, plane); the roundel in the corner is its country, the colour its side"
fr = "Icônes : ce que le scénario place au départ, selon son rôle : QG (étoile), dépôt (caisse), usine, fort (bouclier), leurre (?), et les unités selon ce qui les produit (soldat, char, antichar, artillerie, avion) ; la cocarde dans le coin est son pays, la couleur son camp"
ger = "Symbole: was das Szenario zu Beginn dort aufstellt, nach seiner Aufgabe: HQ (Stern), Versorgungsdepot (Kiste), Fabrik, Festung (Schild), Attrappe (?), und Einheiten nach dem, was sie baut (Soldat, Panzer, Pak, Artillerie, Flugzeug); das Abzeichen in der Ecke ist das Land, die Farbe die Seite"
ita = "Icone: ciò che lo scenario mette lì all'inizio, secondo il suo ruolo: QG (stella), deposito (cassa), fabbrica, forte (scudo), esca (?), e le unità secondo chi le produce (soldato, carro, anticarro, artiglieria, aereo); la coccarda nell'angolo è il paese, il colore la fazione"
spa = "Iconos: lo que el escenario pone ahí al empezar, según su función: CG (estrella), depósito (caja), fábrica, fuerte (escudo), señuelo (?), y las unidades según quién las produce (soldado, tanque, antitanque, artillería, avión); la escarapela de la esquina es su país, el color su bando"
pol = "Ikony: co scenariusz stawia tam na starcie, według roli: kwatera (gwiazda), skład (skrzynia), fabryka, fort (tarcza), atrapa (?), a jednostki według tego, co je produkuje (żołnierz, czołg, ppanc, artyleria, samolot); znak w rogu to kraj, kolor to strona"
ru = "Значки: что сценарий ставит здесь в начале, по назначению: штаб (звезда), склад (ящик), завод, укрепление (щит), макет (?), а юниты — по тому, что их строит (солдат, танк, ПТО, артиллерия, самолёт); опознавательный знак в углу — страна, цвет — сторона"
cz = "Ikony: co tam scénář na začátku postaví, podle účelu: velitelství (hvězda), sklad (bedna), továrna, pevnost (štít), atrapa (?), a jednotky podle toho, co je vyrábí (voják, tank, protitankové dělo, dělostřelectvo, letadlo); znak v rohu je země, barva strana"
jpn = "アイコン：シナリオが開始時に置くものを役割で表示。司令部（星）、補給拠点（箱）、工場、要塞（盾）、デコイ（？）、ユニットは生産元で表示（兵士、戦車、対戦車砲、砲兵、飛行機）。隅の国籍マークは国、色は陣営"

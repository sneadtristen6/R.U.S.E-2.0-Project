[tip_road_take_out_bridges]
us = "The map's own bridges go, and the floors units stood on with them. Units still cross where they stood, on the ground under them: dry the rivers up (Water, Drain) to cross anywhere. Your new bridges stay. Not tested in the game yet."
fr = "Les ponts de la carte disparaissent, avec les sols où se tenaient les unités. Les unités traversent encore à leur place, sur le sol en dessous : asséchez les rivières (Eau, Assécher) pour traverser partout. Vos nouveaux ponts restent. Pas encore testé en jeu."
ger = "Die Brücken der Karte verschwinden, mit den Böden, auf denen Einheiten standen. Einheiten überqueren dort noch, auf dem Boden darunter: Flüsse trockenlegen (Wasser, Trockenlegen), um überall hinüberzukommen. Ihre neuen Brücken bleiben. Noch nicht im Spiel getestet."
ita = "I ponti della mappa spariscono, con i pavimenti su cui stavano le unità. Le unità attraversano ancora lì, sul terreno sotto: prosciuga i fiumi (Acqua, Prosciuga) per attraversare ovunque. I tuoi nuovi ponti restano. Non ancora provato in gioco."
spa = "Los puentes del mapa desaparecen, con los suelos donde se apoyaban las unidades. Las unidades aún cruzan allí, por el suelo de debajo: drena los ríos (Agua, Drenar) para cruzar por cualquier parte. Tus puentes nuevos se quedan. Aún no probado en el juego."
pol = "Mosty mapy znikają, razem z podłożem, na którym stały jednostki. Jednostki wciąż przechodzą w tych miejscach, po gruncie pod spodem: osusz rzeki (Woda, Osusz), by przechodzić wszędzie. Twoje nowe mosty zostają. Jeszcze nie sprawdzone w grze."
ru = "Мосты карты исчезают вместе с настилом, на котором стояли войска. Войска по-прежнему переходят там по земле под ними: осушите реки (Вода, Осушить), чтобы переходить где угодно. Ваши новые мосты остаются. В игре ещё не проверено."
cz = "Mosty mapy zmizí i s podlahou, na které jednotky stály. Jednotky tam dál přecházejí, po zemi pod nimi: vysušte řeky (Voda, Vysušit), aby šly přejít kdekoli. Vaše nové mosty zůstanou. Ve hře zatím nevyzkoušeno."
jpn = "マップ本来の橋と、部隊が立っていた床がなくなります。部隊はその場所で下の地面を渡れます。どこでも渡れるようにするには川を干上がらせてください（水、排水）。新しく架けた橋は残ります。ゲーム内ではまだ未確認です。"
sc = "地图自带的桥会消失，部队站立的桥面也一并移除。部队仍可从原桥位置经下方地面通过：要随处过河，请把河流排干（水、排干）。你新建的桥会保留。尚未在游戏中测试。"


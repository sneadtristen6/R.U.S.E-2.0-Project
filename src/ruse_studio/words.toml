[mc_road_unjoined]
us = "Road {road} ends at ({x}, {y}) without joining the road network. Supply trucks use the road network."
fr = "La route {road} se termine en ({x}, {y}) sans rejoindre le réseau routier. Les camions de ravitaillement utilisent le réseau routier."
ger = "Straße {road} endet bei ({x}, {y}), ohne ans Straßennetz anzuschließen. Versorgungslaster nutzen das Straßennetz."
ita = "La strada {road} finisce a ({x}, {y}) senza unirsi alla rete stradale. I camion dei rifornimenti usano la rete stradale."
spa = "La carretera {road} termina en ({x}, {y}) sin unirse a la red de carreteras. Los camiones de suministro usan la red de carreteras."
pol = "Droga {road} kończy się w ({x}, {y}) bez połączenia z siecią dróg. Ciężarówki zaopatrzenia korzystają z sieci dróg."
ru = "Дорога {road} кончается в ({x}, {y}), не примыкая к дорожной сети. Грузовики снабжения ездят по дорожной сети."
cz = "Silnice {road} končí u ({x}, {y}) bez napojení na silniční síť. Zásobovací náklaďáky používají silniční síť."
jpn = "道路 {road} は ({x}, {y}) で道路網につながらずに終わっています。補給トラックは道路網を使います。"
sc = "道路 {road} 在 ({x}, {y}) 结束，没有接入道路网。补给卡车使用道路网。"


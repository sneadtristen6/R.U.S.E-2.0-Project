sc = "一段文字。输入新文字并按回车。如果是文件名，只能使用游戏中已有的文件。"

[values_kind_key]
us = "Which of the game's texts is shown here, by its key (like N_UNI_137). The words it shows are under the box. Only type a key the game has."

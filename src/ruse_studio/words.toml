ger = "Welcher Text des Spiels hier gezeigt wird, nach seinem Schlüssel (wie N_UNI_137). Die angezeigten Wörter stehen unter dem Feld. Nur einen Schlüssel eingeben, den das Spiel hat."
ita = "Quale testo del gioco viene mostrato qui, tramite la sua chiave (come N_UNI_137). Le parole che mostra sono sotto la casella. Scrivi solo una chiave che il gioco ha."
spa = "Qué texto del juego se muestra aquí, por su clave (como N_UNI_137). Las palabras que muestra están bajo la casilla. Escribe solo una clave que tenga el juego."
pol = "Który tekst gry jest tu pokazywany, według jego klucza (np. N_UNI_137). Słowa, które pokazuje, są pod polem. Wpisuj tylko klucz, który gra ma."
ru = "Какой текст игры показывается здесь, по его ключу (например, N_UNI_137). Слова, которые он показывает, — под полем. Вводите только ключ, который есть в игре."
cz = "Který text hry se tu ukazuje, podle jeho klíče (třeba N_UNI_137). Slova, která ukazuje, jsou pod polem. Pište jen klíč, který hra má."
jpn = "ここに表示されるゲームのテキストを、そのキー（N_UNI_137 など）で指定します。表示される言葉は欄の下にあります。ゲームにあるキーだけを入力してください。"
sc = "此处显示游戏中的哪段文字，用它的键表示（如 N_UNI_137）。它显示的文字在框下方。只能输入游戏中已有的键。"

[values_kind_vector]
us = "Numbers that go together, one per box: a position, a size, a direction, or a colour (red, green, blue, see-through: 0 to 255)."
fr = "Des nombres qui vont ensemble, un par case : une position, une taille, une direction, ou une couleur (rouge, vert, bleu, transparence : 0 à 255)."
ger = "Zahlen, die zusammengehören, eine pro Feld: eine Position, eine Größe, eine Richtung oder eine Farbe (Rot, Grün, Blau, Durchsichtigkeit: 0 bis 255)."
ita = "Numeri che vanno insieme, uno per casella: una posizione, una dimensione, una direzione o un colore (rosso, verde, blu, trasparenza: da 0 a 255)."
spa = "Números que van juntos, uno por casilla: una posición, un tamaño, una dirección o un color (rojo, verde, azul, transparencia: de 0 a 255)."
pol = "Liczby, które idą razem, po jednej w polu: pozycja, rozmiar, kierunek albo kolor (czerwony, zielony, niebieski, przezroczystość: 0 do 255)."
ru = "Числа, которые идут вместе, по одному в поле: позиция, размер, направление или цвет (красный, зелёный, синий, прозрачность: от 0 до 255)."
cz = "Čísla, která patří k sobě, jedno v každém poli: poloha, velikost, směr, nebo barva (červená, zelená, modrá, průhlednost: 0 až 255)."
jpn = "組になった数値で、1つの欄に1つずつ入れます：位置、大きさ、向き、または色（赤、緑、青、透明度：0〜255）。"
sc = "成组的数字，每个框一个：位置、大小、方向，或颜色（红、绿、蓝、透明度：0 到 255）。"


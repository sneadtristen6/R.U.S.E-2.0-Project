[values_how]
us = "Change a value and press Enter (or click elsewhere): it's saved in the current mod at once. “Game's value” undoes it. Use Test in game to try it."
fr = "Changez une valeur et appuyez sur Entrée (ou cliquez ailleurs) : elle est enregistrée tout de suite dans le mod actuel. « Valeur du jeu » annule. Utilisez Tester en jeu pour l'essayer."
ger = "Einen Wert ändern und Enter drücken (oder woanders klicken): Er wird sofort im aktuellen Mod gespeichert. „Wert des Spiels“ macht es rückgängig. Mit „Im Spiel testen“ ausprobieren."
ita = "Cambia un valore e premi Invio (o clicca altrove): viene salvato subito nella mod attuale. «Valore del gioco» lo annulla. Usa Prova in gioco per provarlo."
spa = "Cambia un valor y pulsa Intro (o haz clic en otro sitio): se guarda al momento en el mod actual. «Valor del juego» lo deshace. Usa Probar en el juego para probarlo."
pol = "Zmień wartość i naciśnij Enter (albo kliknij gdzie indziej): od razu zapisuje się w bieżącym modzie. „Wartość z gry” cofa zmianę. Wypróbuj przyciskiem Testuj w grze."
ru = "Измените значение и нажмите Enter (или щёлкните в другом месте): оно сразу сохраняется в текущем моде. «Значение игры» отменяет изменение. Попробуйте кнопкой «Проверить в игре»."
cz = "Změňte hodnotu a stiskněte Enter (nebo klikněte jinam): hned se uloží do aktuálního modu. „Hodnota ze hry“ změnu vrátí. Vyzkoušejte tlačítkem Vyzkoušet ve hře."
jpn = "値を変えて Enter を押すか、ほかの場所をクリックすると、すぐ現在のMODに保存されます。「ゲームの値」で元に戻せます。「ゲームでテスト」で試せます。"
sc = "修改数值后按回车（或点击别处）：会立即保存到当前模组中。“游戏数值”可撤销。用“在游戏中测试”试一试。"


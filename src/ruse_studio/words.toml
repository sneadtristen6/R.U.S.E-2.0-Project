fr = "La traversée en ({x}, {y}) est fermée aux {units} : ils ne peuvent pas passer d'une berge à l'autre."
ger = "Die Querung bei ({x}, {y}) ist für {units} gesperrt: sie kommen nicht von einem Ufer zum anderen."
ita = "L'attraversamento a ({x}, {y}) è chiuso per {units}: non possono passare da una riva all'altra."
spa = "El cruce en ({x}, {y}) está cerrado para {units}: no pueden pasar de una orilla a la otra."
pol = "Przeprawa w ({x}, {y}) jest zamknięta dla {units}: nie przejdą z jednego brzegu na drugi."

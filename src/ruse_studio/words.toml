[economy_help]
us = "A change here is saved in the current mod at once, for every game mode (the game keeps these values twice: for its usual modes and for the Nuclear mode). From LittleGroove's Economy editor in RUSE Mod Manager. Tried in the game: the starting money and the ruse cards at the start; the rest not yet."
fr = "Un changement fait ici est enregistré tout de suite dans le mod actuel, pour tous les modes de jeu (le jeu garde ces valeurs deux fois : pour ses modes habituels et pour le mode Nucléaire). Repris de l'éditeur d'économie de LittleGroove dans RUSE Mod Manager. Essayé en jeu : l'argent de départ et les cartes de ruse au départ ; le reste pas encore."
ger = "Eine Änderung hier wird sofort im aktuellen Mod gespeichert, für jeden Spielmodus (das Spiel hat diese Werte zweimal: für seine üblichen Modi und für den Atommodus). Aus LittleGrooves Wirtschaftseditor in RUSE Mod Manager. Im Spiel ausprobiert: das Startgeld und die Täuschungskarten zu Beginn; der Rest noch nicht."
ita = "Una modifica fatta qui viene salvata subito nella mod attuale, per ogni modalità di gioco (il gioco tiene questi valori due volte: per le modalità solite e per la modalità Nucleare). Dall'editor dell'economia di LittleGroove in RUSE Mod Manager. Provato in gioco: il denaro iniziale e le carte d'inganno all'inizio; il resto non ancora."
spa = "Un cambio hecho aquí se guarda al momento en el mod actual, para todos los modos de juego (el juego guarda estos valores dos veces: para sus modos habituales y para el modo Nuclear). Del editor de economía de LittleGroove en RUSE Mod Manager. Probado en el juego: el dinero inicial y las cartas de engaño al empezar; el resto aún no."
pol = "Zmiana tutaj jest od razu zapisywana w bieżącym modzie, dla każdego trybu gry (gra trzyma te wartości dwa razy: dla zwykłych trybów i dla Trybu Atomowego). Z edytora ekonomii LittleGroove'a w RUSE Mod Manager. Sprawdzone w grze: pieniądze na start i karty podstępu na start; reszta jeszcze nie."
ru = "Изменение здесь сразу сохраняется в текущем моде, для всех режимов игры (игра хранит эти значения дважды: для обычных режимов и для ядерного режима). Из редактора экономики LittleGroove в RUSE Mod Manager. Проверено в игре: начальные деньги и карты уловки в начале; остальное ещё нет."
cz = "Změna zde se hned uloží do aktuálního modu, pro každý herní režim (hra má tyto hodnoty dvakrát: pro běžné režimy a pro nukleární režim). Z editoru ekonomiky od LittleGroove v RUSE Mod Manageru. Vyzkoušeno ve hře: počáteční peníze a karty lsti na začátku; zbytek zatím ne."
jpn = "ここでの変更は、すべてのゲームモード向けにすぐ現在のMODに保存されます（ゲームはこの値を2つ持っています：通常のモード用と戦略兵器モード用）。RUSE Mod Manager の LittleGroove のエコノミーエディターより。ゲーム内で試したもの：初期資金と開始時の計略カード。ほかはまだです。"
sc = "此处的更改会立即保存到当前模组中，适用于所有游戏模式（游戏把这些数值存了两份：普通模式一份，核战争模式一份）。来自 RUSE Mod Manager 中 LittleGroove 的经济编辑器。已在游戏中试过：初始资金和开局计谋卡；其余尚未试过。"


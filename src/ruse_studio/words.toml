[tip_paint_clear]
us = "Up close the game draws the map's grass, crops, stones and ground stickers over its picture, so paint shows only from afar. With this on, the build takes those off where the paint is at least half strength, so it shows at every height (seen in the game). Trees, buildings, cover and movement stay."
fr = "De près, le jeu dessine l'herbe, les cultures, les pierres et les autocollants de sol de la carte par-dessus son image : la peinture ne se voit alors que de loin. Activé, la compilation les retire là où la peinture est au moins à moitié de sa force, pour qu'elle se voie à toute hauteur (vérifié en jeu). Arbres, bâtiments, couvert et déplacement restent."
ger = "Aus der Nähe zeichnet das Spiel Gras, Felder, Steine und Bodenaufkleber der Karte über ihr Bild, daher ist Farbe nur von Weitem zu sehen. Eingeschaltet entfernt der Build diese dort, wo die Farbe mindestens halb so stark ist, sodass sie in jeder Höhe zu sehen ist (im Spiel bestätigt). Bäume, Gebäude, Deckung und Bewegung bleiben."
ita = "Da vicino il gioco disegna erba, colture, sassi e adesivi del terreno della mappa sopra la sua immagine, quindi la pittura si vede solo da lontano. Se attivo, la build li toglie dove la pittura è almeno a metà forza, così si vede a ogni altezza (verificato in gioco). Alberi, edifici, copertura e movimento restano."
spa = "De cerca, el juego dibuja la hierba, los cultivos, las piedras y las pegatinas de suelo del mapa sobre su imagen, así que la pintura solo se ve de lejos. Activado, la compilación los quita donde la pintura tiene al menos la mitad de fuerza, para que se vea a cualquier altura (comprobado en el juego). Árboles, edificios, cobertura y movimiento se quedan."
pol = "Z bliska gra rysuje trawę, uprawy, kamienie i naklejki gruntu mapy na jej obrazie, więc farbę widać tylko z daleka. Po włączeniu kompilacja usuwa je tam, gdzie farba ma co najmniej połowę siły, żeby była widoczna z każdej wysokości (sprawdzone w grze). Drzewa, budynki, osłona i ruch zostają."
ru = "Вблизи игра рисует траву, посевы, камни и наклейки земли карты поверх её изображения, поэтому краска видна только издалека. Если включено, сборка убирает их там, где краска хотя бы наполовину сильна, и она видна с любой высоты (проверено в игре). Деревья, здания, укрытие и движение остаются."
cz = "Zblízka hra kreslí trávu, plodiny, kameny a nálepky terénu mapy přes její obraz, takže barva je vidět jen zdálky. Když je to zapnuté, sestavení je odstraní tam, kde má barva aspoň poloviční sílu, aby byla vidět z každé výšky (ověřeno ve hře). Stromy, budovy, krytí a pohyb zůstávají."
jpn = "近くでは、ゲームはマップの草・作物・石・地面ステッカーを画像の上に描くため、塗った色は遠くからしか見えません。オンにすると、塗りの強さが半分以上の場所でビルドがそれらを取り除き、どの高さからでも見えるようになります（ゲームで確認済み）。木・建物・遮蔽・移動はそのままです。"
sc = "近处时，游戏会在地图图像上绘制草、作物、石头和地面贴花，所以颜料只能从远处看到。开启后，构建会在颜料强度至少一半的地方移除它们，使其在任何高度都可见（已在游戏中验证）。树木、建筑、掩护和移动保持不变。"


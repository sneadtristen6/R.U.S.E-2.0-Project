[share_step_export]
us = "Export it (Export mod… in the mod menu). The file says it was made with RUSE Studio."
fr = "Exportez-le (Exporter le mod… dans le menu du mod). Le fichier indique qu'il a été fait avec RUSE Studio."
ger = "Exportieren Sie ihn (Mod exportieren… im Mod-Menü). Die Datei vermerkt, dass er mit RUSE Studio erstellt wurde."
ita = "Esportala (Esporta mod… nel menu della mod). Il file indica che è stata fatta con RUSE Studio."
spa = "Expórtalo (Exportar mod… en el menú del mod). El archivo indica que se hizo con RUSE Studio."
pol = "Wyeksportuj go (Eksportuj mod… w menu moda). Plik zaznacza, że powstał w RUSE Studio."
ru = "Экспортируйте его («Экспорт мода…» в меню мода). В файле указано, что он сделан в RUSE Studio."
cz = "Exportujte ho (Exportovat mód… v nabídce módu). Soubor uvádí, že vznikl v RUSE Studio."
jpn = "エクスポートします（MODメニューの「MODをエクスポート…」）。ファイルにはRUSE Studioで作られたことが記録されます。"
sc = "将其导出（模组菜单中的“导出模组…”）。文件会注明它是用 RUSE Studio 制作的。"

[share_step_pr]
us = "Press “Publish to the mod list”: the list's “Add my mod” form opens on GitHub, filled in from your file, and a .zip of your mod is in the folder that opens. Drag the .zip into the form."
fr = "Appuyez sur « Publier sur la liste des mods » : le formulaire « Add my mod » de la liste s'ouvre sur GitHub, rempli à partir de votre fichier, et un .zip de votre mod se trouve dans le dossier qui s'ouvre. Glissez le .zip dans le formulaire."
ger = "Klicken Sie auf „In der Mod-Liste veröffentlichen“: Das Formular „Add my mod“ der Liste öffnet sich auf GitHub, aus Ihrer Datei ausgefüllt, und eine .zip Ihres Mods liegt im Ordner, der sich öffnet. Ziehen Sie die .zip in das Formular."
ita = "Premi «Pubblica nell'elenco delle mod»: il modulo «Add my mod» dell'elenco si apre su GitHub, compilato dal tuo file, e uno .zip della tua mod si trova nella cartella che si apre. Trascina lo .zip nel modulo."
spa = "Pulsa «Publicar en la lista de mods»: el formulario «Add my mod» de la lista se abre en GitHub, rellenado con tu archivo, y un .zip de tu mod está en la carpeta que se abre. Arrastra el .zip al formulario."
pol = "Naciśnij „Opublikuj na liście modów”: formularz „Add my mod” listy otworzy się na GitHubie, wypełniony danymi z pliku, a plik .zip z twoim modem będzie w otwartym folderze. Przeciągnij plik .zip do formularza."
ru = "Нажмите «Опубликовать в списке модов»: на GitHub откроется форма списка «Add my mod», заполненная по вашему файлу, а .zip вашего мода будет в открывшейся папке. Перетащите .zip в форму."
cz = "Stiskněte „Zveřejnit v seznamu módů“: na GitHubu se otevře formulář seznamu „Add my mod“ vyplněný podle vašeho souboru a v otevřené složce bude .zip vašeho módu. Přetáhněte .zip do formuláře."
jpn = "「MODリストに公開」を押すと、リストの「Add my mod」フォームがGitHubで開き、ファイルの内容が入力されます。開いたフォルダーにあるMODの.zipをフォームにドラッグしてください。"
sc = "点击“发布到模组列表”：列表的“Add my mod”表单会在 GitHub 上打开，并按你的文件填好；打开的文件夹里有你模组的 .zip。把 .zip 拖进表单。"

[share_step_post]
us = "Say what the mod does, what it changes and what its code does, then submit. An automatic check reads the file, and once we've tried the mod it's on the list in every player's Launcher."
fr = "Dites ce que fait le mod, ce qu'il change et ce que fait son code, puis envoyez. Une vérification automatique lit le fichier, et une fois le mod essayé, il est dans la liste du Launcher de chaque joueur."
ger = "Beschreiben Sie, was der Mod tut, was er ändert und was sein Code macht, und senden Sie ab. Eine automatische Prüfung liest die Datei, und sobald wir den Mod ausprobiert haben, steht er in der Liste im Launcher jedes Spielers."
ita = "Scrivi cosa fa la mod, cosa cambia e cosa fa il suo codice, poi invia. Un controllo automatico legge il file, e dopo che l'abbiamo provata la mod è nell'elenco nel Launcher di ogni giocatore."
spa = "Di qué hace el mod, qué cambia y qué hace su código, y envíalo. Una comprobación automática lee el archivo, y cuando lo hayamos probado, el mod estará en la lista del Launcher de cada jugador."
pol = "Napisz, co mod robi, co zmienia i co robi jego kod, a potem wyślij. Automatyczna kontrola odczyta plik, a gdy wypróbujemy mod, trafi on na listę w Launcherze każdego gracza."
ru = "Опишите, что делает мод, что он меняет и что делает его код, и отправьте. Автоматическая проверка прочитает файл, а когда мы опробуем мод, он появится в списке в Launcher у каждого игрока."
cz = "Napište, co mód dělá, co mění a co dělá jeho kód, a odešlete. Automatická kontrola soubor přečte, a až mód vyzkoušíme, objeví se v seznamu v Launcheru každého hráče."
jpn = "MODの内容、変更点、コードの動作を書いて送信してください。自動チェックがファイルを読み、私たちが試した後、すべてのプレイヤーのLauncherのリストに載ります。"
sc = "写明模组做什么、改了什么、它的代码做什么，然后提交。自动检查会读取文件；我们试过之后，它就会出现在每位玩家 Launcher 的列表中。"


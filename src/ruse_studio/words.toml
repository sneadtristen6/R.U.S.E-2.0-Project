jpn = ".3ds（画像が同じフォルダーか一つ上のフォルダーにあるもの）または.glbを選びます。コピー元のユニットに合わせてMODに保存され、ゲームでテストで表示されます。"
sc = "选择一个.3ds（图片在旁边或上一级文件夹中）或.glb。它会按所复制的单位调整并保存到你的模组中；游戏内测试即可看到。"


# --- Duplicate map (maps.js openDuplicate, StudioApi.duplicate_map): a new map, a copy of the one open ---
[duplicate_map]
us = "Duplicate map"
fr = "Dupliquer la carte"
ger = "Karte duplizieren"
ita = "Duplica mappa"
spa = "Duplicar mapa"
pol = "Duplikuj mapę"
ru = "Дублировать карту"
cz = "Duplikovat mapu"
jpn = "マップを複製"
sc = "复制地图"

[tip_duplicate_map]
us = "Make a new map from this one: a full copy with a name of its own, as a Battles map, an Operation or a campaign chapter. You then change the copy like any map."
fr = "Créer une nouvelle carte à partir de celle-ci : une copie complète avec son propre nom, en carte de Batailles, en Opération ou en chapitre de campagne. Vous modifiez ensuite la copie comme n'importe quelle carte."
ger = "Aus dieser Karte eine neue machen: eine vollständige Kopie mit eigenem Namen, als Schlachten-Karte, Operation oder Kampagnenkapitel. Danach ändern Sie die Kopie wie jede Karte."
ita = "Crea una nuova mappa da questa: una copia completa con un nome tutto suo, come mappa di Battaglie, Operazione o capitolo della campagna. Poi modifichi la copia come qualsiasi mappa."
spa = "Crear un mapa nuevo a partir de este: una copia completa con nombre propio, como mapa de Batallas, Operación o capítulo de campaña. Luego cambias la copia como cualquier mapa."
pol = "Utwórz nową mapę z tej: pełną kopię z własną nazwą, jako mapę Bitew, Operację lub rozdział kampanii. Potem zmieniasz kopię jak każdą mapę."
ru = "Сделать новую карту из этой: полную копию со своим названием — карту для Битв, Операцию или главу кампании. Затем копию можно менять, как любую карту."
cz = "Vytvořit z této mapy novou: úplnou kopii s vlastním názvem, jako mapu Bitev, Operaci nebo kapitolu kampaně. Kopii pak měníte jako každou mapu."
jpn = "このマップから新しいマップを作ります。独自の名前を持つ完全なコピーを、BATTLESのマップ、オペレーション、キャンペーンの章として作れます。あとは普通のマップと同じようにコピーを変更できます。"
sc = "用这张地图做一张新地图：一份有自己名字的完整副本，可作为“战役”地图、行动或战役章节。之后可以像任何地图一样修改副本。"

# --- Delete map (maps.js renderDelete, StudioApi.delete_map): a new map's folder to the Recycle Bin ---
[delete_map]
us = "Delete map"
fr = "Supprimer la carte"
ger = "Karte löschen"
ita = "Elimina mappa"
spa = "Eliminar mapa"
pol = "Usuń mapę"
ru = "Удалить карту"
cz = "Smazat mapu"
jpn = "マップを削除"
sc = "删除地图"

[tip_delete_map]
us = "Take this new map out of your map changes, with everything changed on it. Its folder goes to the Recycle Bin, so it can be put back from there. The game's own maps can't be deleted."
fr = "Retirer cette nouvelle carte de vos modifications de cartes, avec tout ce qui y a été changé. Son dossier part dans la Corbeille, d'où il peut être restauré. Les cartes du jeu ne peuvent pas être supprimées."
ger = "Diese neue Karte samt allen Änderungen aus Ihren Kartenänderungen entfernen. Ihr Ordner kommt in den Papierkorb und lässt sich dort wiederherstellen. Die Karten des Spiels selbst lassen sich nicht löschen."
ita = "Togli questa nuova mappa dalle tue modifiche alle mappe, con tutto ciò che vi hai cambiato. La sua cartella va nel Cestino, da cui si può ripristinare. Le mappe del gioco non si possono eliminare."
spa = "Quitar este mapa nuevo de tus cambios de mapas, con todo lo cambiado en él. Su carpeta va a la Papelera de reciclaje, desde donde se puede restaurar. Los mapas del propio juego no se pueden eliminar."
pol = "Usuń tę nową mapę ze swoich zmian map, razem ze wszystkim, co na niej zmieniono. Jej folder trafia do Kosza, skąd można go przywrócić. Map samej gry nie można usunąć."
ru = "Убрать эту новую карту из ваших изменений карт вместе со всем, что на ней изменено. Её папка уходит в Корзину, откуда её можно восстановить. Карты самой игры удалить нельзя."
cz = "Odebrat tuto novou mapu z vašich změn map, i se vším, co se na ní změnilo. Její složka jde do Koše, odkud ji lze obnovit. Mapy samotné hry smazat nelze."

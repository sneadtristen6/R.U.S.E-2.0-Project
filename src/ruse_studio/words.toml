fr = "Prendre une couleur à assortir : appuyez ici, puis cliquez sur le sol, ou sur un bâtiment, un objet ou un arbre pour reprendre sa propre couleur (sans la lumière). Alt+clic avec le pinceau Couleur fait de même."
ger = "Eine Farbe zum Abstimmen nehmen: hier drücken, dann auf den Boden klicken, oder auf ein Gebäude, Objekt oder einen Baum, um dessen eigene Farbe zu nehmen (ohne das Licht darauf). Alt+Klick mit dem Farbpinsel tut dasselbe."
ita = "Prendi un colore da abbinare: premi qui, poi clicca sul terreno, o su un edificio, un oggetto o un albero per prenderne il colore proprio (senza la luce). Alt+clic con il pennello Colore fa lo stesso."

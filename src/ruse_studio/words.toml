jpn = "ゲームのクリーンなバックアップ"
sc = "游戏的干净备份"

[set_backup_help]
us = "RUSE Launcher and RUSE Studio never change the game's own folder, but other mod managers and hand edits can. Make a backup while the game is clean, right after Steam installs or verifies it. Check game files then shows what has changed since, and Restore clean files puts the game's files back."
fr = "RUSE Launcher et RUSE Studio ne modifient jamais le dossier du jeu, mais d'autres gestionnaires de mods et des modifications à la main peuvent le faire. Faites une sauvegarde pendant que le jeu est propre, juste après que Steam l'a installé ou vérifié. « Vérifier les fichiers du jeu » montre ensuite ce qui a changé depuis, et « Restaurer les fichiers propres » remet les fichiers du jeu en place."
ger = "RUSE Launcher und RUSE Studio ändern den Ordner des Spiels nie, andere Mod-Manager und Änderungen von Hand aber schon. Erstellen Sie eine Sicherung, solange das Spiel sauber ist, direkt nachdem Steam es installiert oder überprüft hat. „Spieldateien prüfen“ zeigt dann, was sich seitdem geändert hat, und „Saubere Dateien wiederherstellen“ stellt die Dateien des Spiels wieder her."
ita = "RUSE Launcher e RUSE Studio non modificano mai la cartella del gioco, ma altri gestori di mod e le modifiche a mano sì. Fai un backup mentre il gioco è pulito, subito dopo che Steam l'ha installato o verificato. «Controlla i file del gioco» mostra poi cosa è cambiato da allora, e «Ripristina i file puliti» rimette a posto i file del gioco."
spa = "RUSE Launcher y RUSE Studio nunca cambian la carpeta del juego, pero otros gestores de mods y los cambios a mano sí pueden. Haz una copia de seguridad mientras el juego está limpio, justo después de que Steam lo instale o lo verifique. «Comprobar archivos del juego» muestra después qué ha cambiado desde entonces, y «Restaurar archivos limpios» devuelve los archivos del juego a su estado."
pol = "RUSE Launcher i RUSE Studio nigdy nie zmieniają folderu gry, ale inne menedżery modów i ręczne zmiany mogą to robić. Zrób kopię zapasową, gdy gra jest czysta, zaraz po tym, jak Steam ją zainstaluje lub zweryfikuje. „Sprawdź pliki gry” pokaże potem, co się od tego czasu zmieniło, a „Przywróć czyste pliki” przywróci pliki gry."
ru = "RUSE Launcher и RUSE Studio никогда не меняют папку игры, а другие менеджеры модов и ручные правки могут. Сделайте резервную копию, пока игра чистая, сразу после того как Steam установит или проверит её. «Проверить файлы игры» затем покажет, что изменилось с тех пор, а «Восстановить чистые файлы» вернёт файлы игры на место."
cz = "RUSE Launcher a RUSE Studio nikdy nemění složku hry, ale jiní správci módů a ruční úpravy ano. Udělejte zálohu, dokud je hra čistá, hned poté, co ji Steam nainstaluje nebo ověří. „Zkontrolovat soubory hry“ pak ukáže, co se od té doby změnilo, a „Obnovit čisté soubory“ vrátí soubory hry zpět."
jpn = "RUSE Launcher と RUSE Studio はゲーム本体のフォルダーを変更しませんが、他の MOD マネージャーや手作業の編集は変更することがあります。ゲームがクリーンなうちに、Steam がインストールまたは検証した直後にバックアップを作成してください。その後「ゲームファイルを確認」でそれ以降に変わったものを確認でき、「クリーンなファイルを復元」でゲームのファイルを元に戻せます。"
sc = "RUSE Launcher 和 RUSE Studio 从不修改游戏本身的文件夹，但其他模组管理器和手动修改可能会。请在游戏干净时（Steam 刚安装或验证完之后）创建备份。之后，“检查游戏文件”会显示自那以后改变了什么，“恢复干净文件”会把游戏文件还原。"


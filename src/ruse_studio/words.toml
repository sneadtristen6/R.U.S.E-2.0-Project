[tip_brush_opacity]
us = "How much each dab covers the ground: low for a light tint, 100% to cover it. Going over a place again builds it up."
fr = "À quel point chaque touche couvre le sol : faible pour une légère teinte, 100 % pour le couvrir. Repasser au même endroit renforce l'effet."
ger = "Wie stark jeder Tupfer den Boden deckt: wenig für einen leichten Hauch, 100 % zum Überdecken. Nochmals darübermalen verstärkt es."
ita = "Quanto ogni tocco copre il terreno: basso per una leggera tinta, 100% per coprirlo. Ripassando sullo stesso punto si accumula."
spa = "Cuánto cubre el suelo cada toque: poco para un tinte suave, 100 % para cubrirlo. Volver a pasar por un sitio lo refuerza."
pol = "Jak mocno każde dotknięcie kryje grunt: mało dla lekkiego odcienia, 100% by go zakryć. Ponowne malowanie w tym samym miejscu wzmacnia efekt."
ru = "Насколько каждый мазок закрывает землю: мало для лёгкого оттенка, 100% чтобы закрыть. Повторные мазки усиливают эффект."
cz = "Jak moc každý tah zakryje terén: málo pro lehký nádech, 100 % pro úplné zakrytí. Opakované přejetí účinek zesílí."
jpn = "1回のタッチで地面をどれだけ覆うか：少なめで淡く、100%で覆います。同じ場所を重ね塗りすると濃くなります。"
sc = "每一笔覆盖地面的程度：低则淡淡着色，100% 则完全覆盖。在同一处反复涂抹会叠加。"


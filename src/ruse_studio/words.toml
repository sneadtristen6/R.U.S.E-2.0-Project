[ai_scripts_help]
us = "The scripts the game runs on its maps: the campaign's chapters, challenges, Operations and its own tests (IA_Common.dat), shown as Python. A big one takes a few seconds to open. Change this script lets you change one in your mod. From LittleGroove's AI editor and his Mission Script editor."
fr = "Les scripts que le jeu lance sur ses cartes : les chapitres de la campagne, les défis, les Opérations et ses propres tests (IA_Common.dat), affichés en Python. Un gros script met quelques secondes à s'ouvrir. « Modifier ce script » permet d'en changer un dans votre mod. Repris de l'éditeur d'IA et de l'éditeur de scripts de mission de LittleGroove."
ger = "Die Skripte, die das Spiel auf seinen Karten ausführt: die Kapitel der Kampagne, Herausforderungen, Operationen und seine eigenen Tests (IA_Common.dat), als Python angezeigt. Ein großes braucht ein paar Sekunden zum Öffnen. Mit „Dieses Skript ändern“ ändern Sie eines in Ihrem Mod. Aus LittleGrooves KI-Editor und seinem Missionsskript-Editor."
ita = "Gli script che il gioco esegue sulle sue mappe: i capitoli della campagna, le sfide, le Operazioni e i suoi test (IA_Common.dat), mostrati in Python. Uno grande impiega qualche secondo ad aprirsi. «Modifica questo script» ti permette di cambiarne uno nella tua mod. Dall'editor dell'IA e dall'editor degli script di missione di LittleGroove."
spa = "Los scripts que el juego ejecuta en sus mapas: los capítulos de la campaña, los desafíos, las Operaciones y sus propias pruebas (IA_Common.dat), mostrados en Python. Uno grande tarda unos segundos en abrirse. «Cambiar este script» te deja cambiar uno en tu mod. Del editor de IA y del editor de scripts de misión de LittleGroove."
pol = "Skrypty, które gra uruchamia na swoich mapach: rozdziały kampanii, wyzwania, Operacje i jej własne testy (IA_Common.dat), pokazane jako Python. Duży otwiera się kilka sekund. „Zmień ten skrypt” pozwala zmienić jeden w twoim modzie. Z edytora SI i edytora skryptów misji LittleGroove'a."
ru = "Скрипты, которые игра запускает на своих картах: главы кампании, испытания, операции и её собственные тесты (IA_Common.dat), показанные как Python. Большой открывается несколько секунд. «Изменить этот скрипт» позволяет изменить его в вашем моде. Из редактора ИИ и редактора скриптов миссий LittleGroove."
cz = "Skripty, které hra spouští na svých mapách: kapitoly kampaně, výzvy, operace a její vlastní testy (IA_Common.dat), zobrazené jako Python. Velký se otevírá pár sekund. „Změnit tento skript“ vám ho dovolí změnit ve vašem modu. Z editoru AI a editoru skriptů misí od LittleGroove."
jpn = "ゲームがマップで実行するスクリプト：キャンペーンの各章、チャレンジ、オペレーション、ゲーム自身のテスト（IA_Common.dat）を Python で表示します。大きなものは開くのに数秒かかります。「このスクリプトを変える」で、あなたのMODの中で変更できます。LittleGroove の AI エディターとミッションスクリプトエディターより。"
sc = "游戏在其地图上运行的脚本：战役各章、挑战、行动以及游戏自己的测试（IA_Common.dat），以 Python 显示。大的脚本需要几秒钟才能打开。“修改此脚本”可在你的模组中修改它。来自 LittleGroove 的 AI 编辑器和任务脚本编辑器。"


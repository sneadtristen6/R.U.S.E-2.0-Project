# --- a new unit's own model (app.js modelBox, StudioApi.model_import; rusemod.modelin, rusemod.unitmodel) ---
[model_title]
us = "Its own model"
fr = "Son propre modèle"
ger = "Eigenes Modell"
ita = "Un modello tutto suo"
spa = "Su propio modelo"
pol = "Własny model"
ru = "Своя модель"
cz = "Vlastní model"
jpn = "独自のモデル"
sc = "自己的模型"

[model_how]
us = "It uses the model of the unit it copies. Import a 3D model (.3ds, or .glb from Blender and most 3D tools) to give it one of its own: it's fitted to that unit's length (times Size), its turret on that unit's turret, and turns and drives the same way."
fr = "Elle utilise le modèle de l'unité qu'elle copie. Importez un modèle 3D (.3ds, ou .glb depuis Blender et la plupart des outils 3D) pour lui en donner un : il est ajusté à la longueur de cette unité (fois Taille), sa tourelle sur la sienne, et tourne et roule de la même façon."
ger = "Sie nutzt das Modell der kopierten Einheit. Importiere ein 3D-Modell (.3ds oder .glb aus Blender und den meisten 3D-Programmen), um ihr ein eigenes zu geben: Es wird an die Länge dieser Einheit angepasst (mal Größe), sein Turm auf ihren Turm, und dreht und fährt genauso."
ita = "Usa il modello dell'unità che copia. Importa un modello 3D (.3ds, o .glb da Blender e dalla maggior parte dei programmi 3D) per dargliene uno suo: viene adattato alla lunghezza di quell'unità (per Dimensione), con la torretta sulla sua, e gira e si muove allo stesso modo."
spa = "Usa el modelo de la unidad que copia. Importa un modelo 3D (.3ds, o .glb de Blender y la mayoría de programas 3D) para darle uno propio: se ajusta a la longitud de esa unidad (por Tamaño), con su torreta sobre la de ella, y gira y avanza igual."
pol = "Używa modelu kopiowanej jednostki. Zaimportuj model 3D (.3ds albo .glb z Blendera i większości programów 3D), by dać jej własny: zostanie dopasowany do długości tamtej jednostki (razy Rozmiar), wieża na jej wieży, i obraca się oraz jeździ tak samo."
ru = "Она использует модель копируемого юнита. Импортируйте 3D-модель (.3ds или .glb из Blender и большинства 3D-программ), чтобы дать ей свою: она подгоняется под длину того юнита (умножить на Размер), её башня — на его башню, и поворачивается и едет так же."
cz = "Používá model kopírované jednotky. Importuj 3D model (.3ds, nebo .glb z Blenderu a většiny 3D programů) a dej jí vlastní: přizpůsobí se délce té jednotky (krát Velikost), věž na její věž, a otáčí se a jezdí stejně."
jpn = "コピー元のユニットのモデルを使っています。3Dモデル（.3ds、またはBlenderなど多くの3Dツールの.glb）を読み込むと独自のモデルになります。コピー元の長さ（×サイズ）に合わせ、砲塔をコピー元の砲塔の位置に置くので、同じように回転し走行します。"
sc = "它使用所复制单位的模型。导入一个3D模型（.3ds，或Blender及多数3D工具导出的.glb）即可拥有自己的模型：会按该单位的长度（乘以尺寸）调整，炮塔放在该单位的炮塔位置，转动和行驶方式相同。"


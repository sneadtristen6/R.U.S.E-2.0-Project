ger = "Die Mod-Kopie liegt auf einem anderen Laufwerk als das Spiel, daher werden die Spieldateien hineinkopiert statt geteilt: diesmal {gb} GB. Liegen die Mod-Kopien auf dem Laufwerk des Spiels ({drive}), startet das Spiel mit Mods viel schneller."
ita = "La copia con mod è su un'unità diversa da quella del gioco, quindi i file del gioco vi vengono copiati invece che condivisi: {gb} GB copiati questa volta. Con le copie con mod sull'unità del gioco ({drive}), il gioco con le mod si avvia molto più in fretta."
spa = "La copia con mods está en una unidad distinta de la del juego, así que los archivos del juego se copian en ella en vez de compartirse: {gb} GB copiados esta vez. Con las copias con mods en la unidad del juego ({drive}), el juego con mods se inicia mucho más rápido."

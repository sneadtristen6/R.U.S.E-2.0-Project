[music_help]
us = "Every song the game plays, by where it plays. Replace one with your own: drop a sound file on it (WAV, MP3, OGG or FLAC), cut it, fade it, then Use this. It's saved in the current mod, and the next build puts it in the game. Tried in the game: the main menu song, the songs of battle lists 1 and 2, new songs added to those lists, and a unit's voice; the rest not yet."
fr = "Tous les morceaux que joue le jeu, selon l'endroit où ils passent. Remplacez-en un par le vôtre : déposez-y un fichier son (WAV, MP3, OGG ou FLAC), coupez-le, ajoutez un fondu, puis Utiliser. Il est enregistré dans le mod actuel, et la prochaine construction le met dans le jeu. Essayé en jeu : le morceau du menu principal, les morceaux des listes de bataille 1 et 2, de nouveaux morceaux ajoutés à ces listes, et la voix d'une unité ; le reste pas encore."
ger = "Alle Musikstücke des Spiels, danach geordnet, wo sie laufen. Ersetze eines durch dein eigenes: eine Tondatei darauf ziehen (WAV, MP3, OGG oder FLAC), zuschneiden, ein- und ausblenden, dann Übernehmen. Es wird im aktuellen Mod gespeichert, und der nächste Build bringt es ins Spiel. Im Spiel ausprobiert: das Stück des Hauptmenüs, die Stücke der Schlachtlisten 1 und 2, neue Stücke in diesen Listen und die Stimme einer Einheit; der Rest noch nicht."
ita = "Tutti i brani che il gioco suona, divisi per dove si sentono. Sostituiscine uno con il tuo: trascina un file audio (WAV, MP3, OGG o FLAC), taglialo, aggiungi una dissolvenza, poi Usa questo. Viene salvato nella mod attuale e la prossima build lo mette nel gioco. Provato in gioco: il brano del menu principale, i brani delle liste di battaglia 1 e 2, nuovi brani aggiunti a queste liste e la voce di un'unità; il resto non ancora."
spa = "Todas las canciones del juego, según dónde suenan. Sustituye una por la tuya: suelta un archivo de sonido (WAV, MP3, OGG o FLAC), recórtalo, ponle un fundido y luego Usar esto. Se guarda en el mod actual y la próxima compilación lo pone en el juego. Probado en el juego: la canción del menú principal, las canciones de las listas de batalla 1 y 2, canciones nuevas añadidas a esas listas, y la voz de una unidad; el resto aún no."
pol = "Każdy utwór w grze, według miejsca, w którym brzmi. Zastąp go własnym: upuść plik dźwiękowy (WAV, MP3, OGG lub FLAC), przytnij, dodaj wyciszenie, potem Użyj tego. Zapisuje się w bieżącym modzie, a następna kompilacja wstawia go do gry. Sprawdzone w grze: utwór menu głównego, utwory list bitewnych 1 i 2, nowe utwory dodane do tych list oraz głos jednostki; reszta jeszcze nie."
ru = "Вся музыка игры по тому, где она звучит. Замените трек своим: перетащите звуковой файл (WAV, MP3, OGG или FLAC), обрежьте, добавьте плавное появление и затухание, затем «Использовать». Он сохраняется в текущем моде, а следующая сборка ставит его в игру. Проверено в игре: музыка главного меню, музыка боевых списков 1 и 2, новые треки в этих списках и голос юнита; остальное ещё нет."
cz = "Všechny skladby, které hra hraje, podle toho, kde zní. Nahraďte jednu vlastní: přetáhněte na ni zvukový soubor (WAV, MP3, OGG nebo FLAC), ořízněte ji, přidejte prolínání a pak Použít. Uloží se do aktuálního modu a příští sestavení ji dá do hry. Vyzkoušeno ve hře: skladba hlavní nabídky, skladby bitevních seznamů 1 a 2, nové skladby přidané do těchto seznamů a hlas jednotky; zbytek zatím ne."
jpn = "ゲームで流れるすべての曲を、流れる場面ごとに表示します。自分の曲に置き換えるには、音声ファイル（WAV、MP3、OGG、FLAC）をドロップし、切り取り、フェードを付けて「これを使う」を押します。今のMODに保存され、次のビルドでゲームに入ります。ゲーム内で試したもの：メインメニューの曲、戦闘リスト1と2の曲、それらのリストに追加した新しい曲、ユニットの声。ほかはまだです。"
sc = "游戏播放的每一首音乐，按播放场合分组。用你自己的替换：拖入一个声音文件（WAV、MP3、OGG 或 FLAC），剪切、淡入淡出，然后点“使用”。它保存在当前模组中，下次构建会放进游戏。已在游戏中试过：主菜单音乐、战斗列表 1 和 2 的音乐、加入这些列表的新音乐，以及单位的语音；其余尚未试过。"


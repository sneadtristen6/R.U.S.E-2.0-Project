[upgrade_help]
us = "The unit this one is an upgrade of, as in the game: heavy infantry of light infantry, the Jackson of the Wolverine. An upgrade is researched for its price and time before it can be built. From LittleGroove's units editor. Not tried in the game yet."
fr = "L'unité dont celle-ci est une amélioration, comme dans le jeu : l'infanterie lourde de l'infanterie légère, le Jackson du Wolverine. Une amélioration se recherche pour son prix et son temps avant de pouvoir être construite. Repris de l'éditeur d'unités de LittleGroove. Pas encore essayé en jeu."
ger = "Die Einheit, deren Verbesserung diese ist, wie im Spiel: schwere Infanterie von leichter Infanterie, der Jackson vom Wolverine. Eine Verbesserung wird für ihren Preis und ihre Zeit erforscht, bevor sie gebaut werden kann. Aus LittleGrooves Einheiteneditor. Noch nicht im Spiel ausprobiert."
ita = "L'unità di cui questa è un potenziamento, come nel gioco: la fanteria pesante della fanteria leggera, il Jackson del Wolverine. Un potenziamento si ricerca per il suo prezzo e il suo tempo prima di poterlo costruire. Dall'editor delle unità di LittleGroove. Non ancora provato in gioco."
spa = "La unidad de la que esta es una mejora, como en el juego: la infantería pesada de la ligera, el Jackson del Wolverine. Una mejora se investiga por su precio y su tiempo antes de poder construirla. Del editor de unidades de LittleGroove. Aún no probado en el juego."
pol = "Jednostka, której ulepszeniem jest ta, jak w grze: ciężka piechota lekkiej piechoty, Jackson Wolverine'a. Ulepszenie bada się za jego cenę i czas, zanim można je zbudować. Z edytora jednostek LittleGroove'a. Jeszcze niesprawdzone w grze."
ru = "Юнит, улучшением которого является этот, как в игре: тяжёлая пехота — лёгкой пехоты, Jackson — Wolverine. Улучшение исследуется за его цену и время, прежде чем его можно строить. Из редактора юнитов LittleGroove. Ещё не проверено в игре."
cz = "Jednotka, jejímž vylepšením je tato, jako ve hře: těžká pěchota lehké pěchoty, Jackson Wolverinu. Vylepšení se zkoumá za svou cenu a čas, než jde postavit. Z editoru jednotek od LittleGroove. Ve hře zatím nevyzkoušeno."
jpn = "このユニットがどのユニットのアップグレードか（ゲームと同じく、重歩兵は軽歩兵の、ジャクソンはウルヴァリンのアップグレード）。アップグレードは、生産する前にその価格と時間で研究します。LittleGroove のユニットエディターより。ゲーム内ではまだ試していません。"
sc = "此单位是哪个单位的升级，与游戏中一样：重步兵是轻步兵的升级，杰克逊是狼獾的升级。升级需先按其价格和时间研究，然后才能建造。来自 LittleGroove 的单位编辑器。尚未在游戏中试过。"


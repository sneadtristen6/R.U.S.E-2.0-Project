[tip_dock_erase]
us = "Take the map's own trees and props away (buildings too, if you pick them)."
fr = "Retirer les arbres et objets de la carte (les bâtiments aussi, si vous les choisissez)."
ger = "Die Bäume und Objekte der Karte entfernen (auch Gebäude, wenn Sie sie wählen)."
ita = "Togli gli alberi e gli oggetti della mappa (anche gli edifici, se li scegli)."
spa = "Quitar los árboles y objetos del mapa (también los edificios, si los eliges)."
pol = "Usuń drzewa i obiekty mapy (także budynki, jeśli je wybierzesz)."
ru = "Убрать деревья и объекты карты (и здания, если их выбрать)."
cz = "Odstranit stromy a předměty mapy (i budovy, pokud je vyberete)."
jpn = "マップの樹木と小物を撤去します（選べば建物も）。"
sc = "移除地图自带的树木和道具（如果选中，也包括建筑）。"

[tip_brush_erase]
us = "Drag over the map's own trees and props: the red circles are saved in the mod, and what they cover (tinted red) goes when the mod is built. Undo takes back the last drag."
fr = "Glissez sur les arbres et objets de la carte : les cercles rouges sont enregistrés dans le mod, et ce qu'ils couvrent (teinté de rouge) disparaît à la construction du mod. Annuler reprend le dernier glissement."
ger = "Über die Bäume und Objekte der Karte ziehen: die roten Kreise werden in der Mod gespeichert, und was sie abdecken (rot getönt), verschwindet beim Bauen der Mod. Rückgängig nimmt den letzten Zug zurück."
ita = "Trascina sugli alberi e sugli oggetti della mappa: i cerchi rossi vengono salvati nella mod, e ciò che coprono (tinto di rosso) sparisce quando la mod viene costruita. Annulla toglie l'ultimo trascinamento."
spa = "Arrastra sobre los árboles y objetos del mapa: los círculos rojos se guardan en el mod, y lo que cubren (teñido de rojo) desaparece al construir el mod. Deshacer quita el último arrastre."
pol = "Przeciągnij po drzewach i obiektach mapy: czerwone koła zapisują się w modzie, a to, co obejmują (zabarwione na czerwono), znika przy budowaniu moda. Cofnij usuwa ostatnie przeciągnięcie."
ru = "Проведите по деревьям и объектам карты: красные круги сохраняются в моде, а всё, что они накрывают (подсвечено красным), исчезнет при сборке мода. «Отменить» убирает последний мазок."
cz = "Táhněte přes stromy a předměty mapy: červené kruhy se uloží do módu a co pokrývají (zbarveno červeně), při sestavení módu zmizí. Zpět vrátí poslední tah."
jpn = "マップの樹木や小物の上をドラッグ：赤い円はMODに保存され、円が覆うもの（赤く表示）はMODのビルド時に消えます。元に戻すで最後のドラッグを取り消します。"
sc = "在地图自带的树木和道具上拖动：红色圆圈保存在模组中，圆圈覆盖的内容（显示为红色）会在构建模组时消失。撤销可取消最后一次拖动。"

[tip_erase_what]
us = "What the circles take away. Each circle keeps what was picked when it was painted."
fr = "Ce que les cercles retirent. Chaque cercle garde ce qui était choisi quand il a été peint."
ger = "Was die Kreise entfernen. Jeder Kreis behält, was beim Malen gewählt war."
ita = "Cosa tolgono i cerchi. Ogni cerchio mantiene ciò che era scelto quando è stato dipinto."
spa = "Lo que quitan los círculos. Cada círculo conserva lo que estaba elegido cuando se pintó."
pol = "Co zabierają koła. Każde koło zachowuje to, co było wybrane, gdy je namalowano."
ru = "Что убирают круги. Каждый круг сохраняет то, что было выбрано, когда его нарисовали."
cz = "Co kruhy odstraňují. Každý kruh si ponechá, co bylo vybráno, když se maloval."
jpn = "円が撤去するもの。各円は描いたときの選択を保ちます。"
sc = "圆圈要移除的内容。每个圆圈保留绘制时所选的内容。"

[erase_whole]
us = "Erase the whole map"
fr = "Effacer toute la carte"
ger = "Ganze Karte löschen"
ita = "Cancella tutta la mappa"
spa = "Borrar todo el mapa"
pol = "Wyczyść całą mapę"
ru = "Стереть всю карту"
cz = "Vymazat celou mapu"
jpn = "マップ全体を消去"
sc = "清除整张地图"

[tip_erase_whole]
us = "One area over the whole map, taking what's picked above. Undo takes it back."
fr = "Une zone sur toute la carte, qui retire ce qui est choisi au-dessus. Annuler la retire."
ger = "Ein Bereich über die ganze Karte, der entfernt, was oben gewählt ist. Rückgängig nimmt ihn zurück."
ita = "Un'area su tutta la mappa, che toglie ciò che è scelto sopra. Annulla la toglie."
spa = "Un área sobre todo el mapa que quita lo elegido arriba. Deshacer la quita."
pol = "Jeden obszar na całą mapę, usuwa to, co wybrano powyżej. Cofnij go usuwa."
ru = "Одна область на всю карту, убирает выбранное выше. «Отменить» убирает её."
cz = "Jedna oblast přes celou mapu, odstraní, co je vybráno výše. Zpět ji odebere."
jpn = "マップ全体に1つの範囲を置き、上で選んだものを消します。元に戻すで取り消せます。"
sc = "在整张地图上放一个区域，清除上面选中的内容。撤销可将其撤回。"

[water_whole]
us = "Water over the whole map"
fr = "Eau sur toute la carte"
ger = "Wasser über die ganze Karte"
ita = "Acqua su tutta la mappa"
spa = "Agua en todo el mapa"
pol = "Woda na całej mapie"
ru = "Вода на всю карту"
cz = "Voda přes celou mapu"
jpn = "マップ全体に水"
sc = "整张地图铺水"

[tip_water_whole]
us = "A thin layer of water over all of the map: its surface Strength above the ground's middle height, so lower ground is under water and higher ground stays dry. Units go under it (their movement takes it for dry ground), like the painted sea of a navy map. Undo takes it back. Seen in the game; units going under it aren't tried yet."
fr = "Une fine couche d'eau sur toute la carte : sa surface à Force au-dessus de la hauteur moyenne du sol, le sol plus bas sous l'eau, le plus haut au sec. Les unités passent dessous (leurs déplacements la prennent pour du sol sec), comme la mer peinte d'une carte navale. Annuler la retire. Vérifié en jeu ; le passage des unités dessous n'est pas encore essayé."
ger = "Eine dünne Wasserschicht über die ganze Karte: ihre Oberfläche um Stärke über der mittleren Bodenhöhe, tieferer Boden unter Wasser, höherer bleibt trocken. Einheiten bewegen sich darunter (ihre Bewegung behandelt sie als trockenen Boden), wie das gemalte Meer einer Marinekarte. Rückgängig nimmt sie zurück. Im Spiel gesehen; Einheiten darunter sind noch nicht ausprobiert."
ita = "Un sottile strato d'acqua su tutta la mappa: la superficie a Intensità sopra l'altezza media del terreno, il terreno più basso sott'acqua, quello più alto all'asciutto. Le unità ci passano sotto (il loro movimento lo considera terreno asciutto), come il mare dipinto di una mappa navale. Annulla lo toglie. Visto in gioco; le unità che ci passano sotto non sono ancora provate."
spa = "Una fina capa de agua en todo el mapa: su superficie a Fuerza por encima de la altura media del suelo, el suelo más bajo bajo el agua, el más alto seco. Las unidades pasan por debajo (su movimiento la toma por suelo seco), como el mar pintado de un mapa naval. Deshacer la quita. Visto en el juego; las unidades que pasan por debajo aún no se han probado."
pol = "Cienka warstwa wody na całej mapie: jej powierzchnia o Siłę wyżej niż średnia wysokość gruntu, niższy grunt pod wodą, wyższy suchy. Jednostki przechodzą pod nią (ich ruch traktuje ją jak suchy grunt), jak namalowane morze na mapie morskiej. Cofnij ją usuwa. Sprawdzone w grze; przejście jednostek pod nią jeszcze nie sprawdzone."
ru = "Тонкий слой воды на всю карту: её поверхность на Силу выше средней высоты земли, низкая земля под водой, высокая остаётся сухой. Войска проходят под ней (их движение считает её сухой землёй), как нарисованное море на морской карте. «Отменить» убирает её. Проверено в игре; проход войск под ней ещё не проверен."
cz = "Tenká vrstva vody přes celou mapu: její hladina o Sílu nad střední výškou terénu, nižší terén pod vodou, vyšší zůstane suchý. Jednotky jí procházejí (jejich pohyb ji bere jako suchý terén), jako namalované moře námořní mapy. Zpět ji odebere. Ověřeno ve hře; průchod jednotek pod ní zatím nevyzkoušen."
jpn = "マップ全体に薄い水の層：水面は地面の中央の高さより「強さ」だけ上。低い地面は水の下、高い地面は乾いたまま。部隊はその下を進めます（移動では乾いた地面として扱います）。海軍マップの塗った海のように。元に戻すで取り消せます。ゲームで確認済み。部隊が水の下を進む点はまだ未確認です。"
sc = "在整张地图上铺一层薄水：水面比地面中间高度高出“强度”，较低的地面在水下，较高的保持干燥。部队可以在水下通行（移动按干地处理），就像海战地图上画出的海。撤销可将其撤回。已在游戏中验证；部队在水下通行尚未测试。"

[erase_trees_note]
us = "Where trees go, the ground opens to every unit and loses its forest cover (proven in the game)."
fr = "Là où les arbres disparaissent, le sol s'ouvre à toutes les unités et perd son couvert forestier (vérifié en jeu)."
ger = "Wo Bäume verschwinden, wird der Boden für alle Einheiten frei und verliert seine Walddeckung (im Spiel bestätigt)."
ita = "Dove spariscono gli alberi, il terreno si apre a tutte le unità e perde la copertura del bosco (verificato in gioco)."
spa = "Donde desaparecen los árboles, el terreno se abre a todas las unidades y pierde su cobertura de bosque (comprobado en el juego)."
pol = "Tam, gdzie znikają drzewa, teren otwiera się dla wszystkich jednostek i traci osłonę lasu (sprawdzone w grze)."
ru = "Где исчезают деревья, земля открывается для всех юнитов и теряет лесное укрытие (проверено в игре)."
cz = "Kde zmizí stromy, terén se otevře všem jednotkám a ztratí lesní krytí (ověřeno ve hře)."
jpn = "樹木が消えた場所は全ユニットが通れるようになり、森の遮蔽も失われます（ゲームで確認済み）。"
sc = "树木消失的地方，地面对所有单位开放，并失去森林掩护（已在游戏中验证）。"

[erase_buildings_note]
us = "Where buildings go, the ground opens to every unit, as with trees (seen in the game)."
fr = "Là où les bâtiments disparaissent, le sol s'ouvre à toutes les unités, comme pour les arbres (vérifié en jeu)."
ger = "Wo Gebäude verschwinden, wird der Boden für alle Einheiten frei, wie bei Bäumen (im Spiel bestätigt)."
ita = "Dove spariscono gli edifici, il terreno si apre a tutte le unità, come per gli alberi (verificato in gioco)."
spa = "Donde desaparecen los edificios, el terreno se abre a todas las unidades, como con los árboles (comprobado en el juego)."
pol = "Tam, gdzie znikają budynki, teren otwiera się dla wszystkich jednostek, jak przy drzewach (sprawdzone w grze)."
ru = "Где исчезают здания, земля открывается для всех юнитов, как и с деревьями (проверено в игре)."
cz = "Kde zmizí budovy, terén se otevře všem jednotkám, stejně jako u stromů (ověřeno ve hře)."
jpn = "建物が消えた場所は、樹木と同じく全ユニットが通れるようになります（ゲームで確認済み）。"
sc = "建筑消失的地方，地面像树木一样对所有单位开放（已在游戏中验证）。"


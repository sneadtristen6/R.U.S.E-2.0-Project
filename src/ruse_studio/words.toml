[tip_road_take_out_roads]
us = "The map's own roads go: the road network supply trucks follow (they drive across country instead), the roads drawn from high up and on the map table, and the road stickers up close. Your new roads stay. Seen in the game: the roads go. Supply trucks driving across country aren't tried yet."
fr = "Les routes de la carte disparaissent : le réseau que suivent les camions de ravitaillement (ils roulent à travers champs), les routes vues de haut et sur la table, et les autocollants de route de près. Vos nouvelles routes restent. Vérifié en jeu : les routes disparaissent. Les camions qui roulent à travers champs ne sont pas encore essayés."
ger = "Die Straßen der Karte verschwinden: das Netz, dem die Versorgungslaster folgen (sie fahren dann querfeldein), die Straßen von oben und auf dem Kartentisch und die Straßenaufkleber aus der Nähe. Ihre neuen Straßen bleiben. Im Spiel gesehen: Die Straßen verschwinden. Versorgungslaster querfeldein sind noch nicht ausprobiert."
ita = "Le strade della mappa spariscono: la rete che seguono i camion dei rifornimenti (vanno per i campi), le strade viste dall'alto e sul tavolo, e gli adesivi stradali da vicino. Le tue nuove strade restano. Visto in gioco: le strade spariscono. I camion che vanno per i campi non sono ancora provati."
spa = "Las carreteras del mapa desaparecen: la red que siguen los camiones de suministros (van campo a través), las carreteras vistas desde arriba y en la mesa, y las pegatinas de carretera de cerca. Tus carreteras nuevas se quedan. Visto en el juego: las carreteras desaparecen. Los camiones campo a través aún no se han probado."
pol = "Drogi mapy znikają: sieć, którą jeżdżą ciężarówki zaopatrzenia (pojadą na przełaj), drogi widziane z góry i na stole map oraz naklejki dróg z bliska. Twoje nowe drogi zostają. Sprawdzone w grze: drogi znikają. Ciężarówki jadące na przełaj jeszcze nie sprawdzone."
ru = "Дороги карты исчезают: сеть, по которой ездят грузовики снабжения (они поедут напрямик), дороги, видимые сверху и на столе карт, и наклейки дорог вблизи. Ваши новые дороги остаются. Проверено в игре: дороги исчезают. Грузовики, едущие напрямик, ещё не проверены."
cz = "Silnice mapy zmizí: síť, po které jezdí zásobovací náklaďáky (pojedou terénem), silnice viděné shora a na mapovém stole a nálepky silnic zblízka. Vaše nové silnice zůstanou. Ověřeno ve hře: silnice zmizí. Náklaďáky jedoucí terénem zatím nevyzkoušeny."
jpn = "マップ本来の道路がなくなります：補給トラックがたどる道路網（トラックは野を突っ切ります）、上空やマップテーブルから見える道路、近くで見える道路のステッカー。新しく引いた道路は残ります。ゲームで確認済み：道路はなくなります。野を突っ切る補給トラックはまだ未確認です。"
sc = "地图自带的道路会消失：补给卡车行驶的道路网（卡车会改为越野行驶）、从高处和地图桌上看到的道路，以及近处的道路贴图。你新画的道路会保留。已在游戏中验证：道路会消失。卡车越野行驶尚未测试。"


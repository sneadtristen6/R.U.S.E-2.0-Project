[tip_model_import]
us = "Pick a .3ds (with its pictures beside it, or in the folder above) or a .glb. It's fitted to the copied unit and saved in your mod; Test in game shows it."
fr = "Choisissez un .3ds (avec ses images à côté, ou dans le dossier au-dessus) ou un .glb. Il est ajusté à l'unité copiée et enregistré dans votre mod ; Tester en jeu l'affiche."

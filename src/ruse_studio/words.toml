[ai_mix]
us = "A computer player mixes three sets of values: Default, its difficulty and its profile (both picked in the game's lobby). For each value the game takes the profile's when it isn't Default's, else the difficulty's when it isn't Default's, else Default's; a value a set doesn't list counts as 0. Only the values a set lists can be changed here."
fr = "Un joueur ordinateur mélange trois jeux de valeurs : Défaut, sa difficulté et son profil (choisis tous deux dans le salon du jeu). Pour chaque valeur, le jeu prend celle du profil si elle n'est pas celle de Défaut, sinon celle de la difficulté si elle n'est pas celle de Défaut, sinon celle de Défaut ; une valeur absente d'un jeu compte pour 0. Seules les valeurs présentes dans un jeu se changent ici."
ger = "Ein Computerspieler mischt drei Wertesätze: Standard, seine Schwierigkeit und sein Profil (beide in der Lobby des Spiels gewählt). Für jeden Wert nimmt das Spiel den des Profils, wenn er nicht der von Standard ist, sonst den der Schwierigkeit, wenn er nicht der von Standard ist, sonst den von Standard; ein Wert, der in einem Satz fehlt, zählt als 0. Hier lassen sich nur die Werte ändern, die ein Satz enthält."
ita = "Un giocatore del computer mescola tre gruppi di valori: Predefinito, la sua difficoltà e il suo profilo (scelti entrambi nella sala del gioco). Per ogni valore il gioco prende quello del profilo se non è quello di Predefinito, altrimenti quello della difficoltà se non è quello di Predefinito, altrimenti quello di Predefinito; un valore che un gruppo non elenca vale 0. Qui si cambiano solo i valori che un gruppo elenca."
spa = "Un jugador del ordenador mezcla tres grupos de valores: Predeterminado, su dificultad y su perfil (ambos elegidos en la sala del juego). Para cada valor, el juego toma el del perfil si no es el de Predeterminado; si no, el de la dificultad si no es el de Predeterminado; si no, el de Predeterminado. Un valor que un grupo no tiene cuenta como 0. Aquí solo se cambian los valores que tiene un grupo."
pol = "Gracz komputerowy łączy trzy zestawy wartości: Domyślny, swój poziom trudności i swój profil (oba wybierane w poczekalni gry). Dla każdej wartości gra bierze tę z profilu, jeśli nie jest taka jak w Domyślnym, inaczej tę z poziomu trudności, jeśli nie jest taka jak w Domyślnym, inaczej tę z Domyślnego; wartość, której zestaw nie ma, liczy się jako 0. Tutaj zmienia się tylko wartości, które zestaw ma."
ru = "Игрок-компьютер смешивает три набора значений: «По умолчанию», свою сложность и свой профиль (оба выбираются в лобби игры). Для каждого значения игра берёт значение профиля, если оно не такое, как «По умолчанию», иначе значение сложности, если оно не такое, как «По умолчанию», иначе значение «По умолчанию»; значение, которого нет в наборе, считается 0. Здесь меняются только значения, которые есть в наборе."
cz = "Počítačový hráč míchá tři sady hodnot: Výchozí, svou obtížnost a svůj profil (obojí se volí v předsálí hry). Pro každou hodnotu hra vezme tu z profilu, když není jako ve Výchozí, jinak tu z obtížnosti, když není jako ve Výchozí, jinak tu z Výchozí; hodnota, kterou sada nemá, se počítá jako 0. Tady jde měnit jen hodnoty, které sada má."
jpn = "コンピューターは3つの値のセットを組み合わせます：既定、難易度、AIタイプ（どちらもゲームのロビーで選びます）。各値について、ゲームはAIタイプの値が既定と違えばそれを、そうでなく難易度の値が既定と違えばそれを、それ以外は既定の値を使います。セットにない値は0とみなされます。ここで変更できるのはセットにある値だけです。"
sc = "电脑玩家会混合三组数值：默认、其难度和其档案（两者都在游戏大厅中选择）。对每个数值，若档案的值与默认不同则用档案的，否则若难度的值与默认不同则用难度的，否则用默认的；一组中没有列出的数值按 0 计算。这里只能更改一组中列出的数值。"


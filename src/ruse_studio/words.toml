ita = "Il terreno intorno a ({x}, {y}), largo {metres} m, è isolato per {units}: non possono raggiungerlo dal resto della mappa, e un ordine verso di esso fa bloccare il gioco."
spa = "El terreno alrededor de ({x}, {y}), de {metres} m de ancho, queda aislado para {units}: no pueden llegar desde el resto del mapa, y una orden hacia él cuelga el juego."
pol = "Teren wokół ({x}, {y}), szeroki na {metres} m, jest odcięty dla {units}: nie dotrą tam z reszty mapy, a rozkaz wejścia na niego wywala grę."
ru = "Земля около ({x}, {y}) шириной {metres} м отрезана для {units}: с остальной карты туда не попасть, а приказ туда роняет игру."
cz = "Terén kolem ({x}, {y}), široký {metres} m, je pro {units} odříznutý: ze zbytku mapy se tam nedostanou a rozkaz tam shodí hru."
jpn = "({x}, {y}) 付近の幅 {metres} m の地面は {units} にとって孤立しています：マップの他の場所から到達できず、そこへの命令でゲームが落ちます。"
sc = "({x}, {y}) 附近宽 {metres} 米的地面对 {units} 是隔断的：无法从地图其他地方到达，向那里下令会使游戏崩溃。"

[mc_road_closed]

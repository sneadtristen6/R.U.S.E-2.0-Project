[tip_stamp_pick]
us = "Press this, then click the ground the texture should come from (Alt+click does the same). Your first stroke after it sets the distance: the copy follows your brush."
fr = "Appuyez ici, puis cliquez sur le sol d'où doit venir la texture (Alt+clic fait de même). Votre premier coup de pinceau fixe la distance : la copie suit le pinceau."
ger = "Hier drücken, dann auf den Boden klicken, von dem die Textur kommen soll (Alt+Klick tut dasselbe). Der erste Pinselstrich danach legt den Abstand fest: die Kopie folgt dem Pinsel."
ita = "Premi qui, poi clicca sul terreno da cui deve venire la texture (Alt+clic fa lo stesso). Il primo tratto dopo fissa la distanza: la copia segue il pennello."
spa = "Pulsa aquí y haz clic en el suelo del que debe venir la textura (Alt+clic hace lo mismo). Tu primer trazo después fija la distancia: la copia sigue al pincel."
pol = "Naciśnij tu, potem kliknij grunt, z którego ma pochodzić tekstura (Alt+klik działa tak samo). Pierwsze pociągnięcie potem ustala odległość: kopia podąża za pędzlem."
ru = "Нажмите здесь, затем щёлкните по земле, откуда брать текстуру (Alt+щелчок делает то же самое). Первый мазок после этого задаёт расстояние: копия следует за кистью."
cz = "Stiskněte toto a klikněte na terén, odkud má textura pocházet (Alt+klik udělá totéž). První tah potom určí vzdálenost: kopie sleduje štětec."
jpn = "これを押してから、テクスチャのコピー元の地面をクリックします（Alt+クリックでも同じ）。その後の最初のひと塗りで距離が決まり、コピー元がブラシについてきます。"
sc = "按下此按钮，然后点击纹理的来源地面（Alt+点击也一样）。之后的第一笔决定距离：复制来源会跟随画笔移动。"


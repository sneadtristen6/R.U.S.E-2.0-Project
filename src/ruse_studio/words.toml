[voice_own]
us = "What this unit says in the game."
fr = "Ce que dit cette unité dans le jeu."
ger = "Was diese Einheit im Spiel sagt."
ita = "Cosa dice questa unità nel gioco."
spa = "Lo que dice esta unidad en el juego."
pol = "Co mówi ta jednostka w grze."
ru = "Что говорит этот юнит в игре."
cz = "Co tato jednotka ve hře říká."
jpn = "このユニットがゲーム内で話す声です。"
sc = "这个单位在游戏中说的话。"

[voice_shared]
us = "What this unit says in the game. Units of its nation and kind share these lines, so a line changed here is heard from them too: {units}."
fr = "Ce que dit cette unité dans le jeu. Les unités de sa nation et de son type partagent ces répliques : une réplique changée ici s'entend aussi chez elles : {units}."
ger = "Was diese Einheit im Spiel sagt. Einheiten ihrer Nation und Art teilen diese Sätze, ein hier geänderter Satz ist also auch bei ihnen zu hören: {units}."
ita = "Cosa dice questa unità nel gioco. Le unità della sua nazione e del suo tipo condividono queste battute, quindi una battuta cambiata qui si sente anche da loro: {units}."
spa = "Lo que dice esta unidad en el juego. Las unidades de su nación y tipo comparten estas frases, así que una frase cambiada aquí también se oye en ellas: {units}."
pol = "Co mówi ta jednostka w grze. Jednostki jej nacji i rodzaju dzielą te kwestie, więc kwestię zmienioną tutaj słychać też u nich: {units}."
ru = "Что говорит этот юнит в игре. Юниты его нации и типа делят эти реплики, поэтому реплика, изменённая здесь, звучит и у них: {units}."
cz = "Co tato jednotka ve hře říká. Jednotky jejího národa a druhu sdílejí tyto věty, takže věta změněná zde zazní i u nich: {units}."
jpn = "このユニットがゲーム内で話す声です。同じ国・同じ種類のユニットはこれらのセリフを共有しているため、ここで変えたセリフはそれらのユニットでも聞こえます：{units}。"
sc = "这个单位在游戏中说的话。同国家、同类型的单位共用这些台词，所以在这里改掉的台词在它们身上也会听到：{units}。"

[voice_copy]
us = "A copy speaks with the lines of the unit it copies; a line changed here is heard from that unit too."
fr = "Une copie parle avec les répliques de l'unité qu'elle copie ; une réplique changée ici s'entend aussi chez cette unité."
ger = "Eine Kopie spricht mit den Sätzen der Einheit, die sie kopiert; ein hier geänderter Satz ist auch bei dieser Einheit zu hören."
ita = "Una copia parla con le battute dell'unità che copia; una battuta cambiata qui si sente anche da quell'unità."
spa = "Una copia habla con las frases de la unidad que copia; una frase cambiada aquí también se oye en esa unidad."
pol = "Kopia mówi kwestiami jednostki, którą kopiuje; kwestię zmienioną tutaj słychać też u tamtej jednostki."
ru = "Копия говорит репликами юнита, который она копирует; реплика, изменённая здесь, звучит и у того юнита."
cz = "Kopie mluví větami jednotky, kterou kopíruje; věta změněná zde zazní i u té jednotky."
jpn = "コピーしたユニットは元のユニットのセリフを話します。ここで変えたセリフは元のユニットでも聞こえます。"
sc = "复制的单位使用原单位的台词；在这里改掉的台词在原单位身上也会听到。"


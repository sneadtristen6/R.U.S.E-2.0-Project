# Add unit's "Who gets it?": a scenario's own camps from its mission (maps.js renderScenTools)
[tip_scen_camp]
us = "Who controls the units: the human player, one of the computer's sides (each with its country), or Neutral, like the map's depots. A side is who controls them, not a place: one country can have several sides (Germany side 1, Germany side 7), each a separate army of the computer's, and a side's units can be anywhere. The numbered zones on the map are areas, not sides. The list is this scenario's own, from its mission; the number in brackets is what's saved."
fr = "Qui contrôle les unités : le joueur, un des camps de l'ordinateur (chacun avec son pays) ou Neutre, comme les dépôts de la carte. Un camp, c'est qui les contrôle, pas un endroit : un même pays peut avoir plusieurs camps (Allemagne camp 1, Allemagne camp 7), chacun une armée distincte de l'ordinateur, et ses unités peuvent être n'importe où. Les zones numérotées sur la carte sont des parties de la carte, pas des camps. La liste est celle de ce scénario, tirée de sa mission ; le numéro entre parenthèses est ce qui est enregistré."
ger = "Wer die Einheiten steuert: der Spieler, eine der Seiten des Computers (jede mit ihrem Land) oder Neutral wie die Depots der Karte. Eine Seite ist, wer sie steuert, kein Ort: Ein Land kann mehrere Seiten haben (Deutschland Seite 1, Deutschland Seite 7), jede eine eigene Armee des Computers, und ihre Einheiten können überall sein. Die nummerierten Zonen auf der Karte sind Gebiete, keine Seiten. Die Liste ist die dieses Szenarios, aus seiner Mission; die Zahl in Klammern wird gespeichert."
ita = "Chi controlla le unità: il giocatore, una delle fazioni del computer (ognuna con il suo paese) o Neutrale, come i depositi della mappa. Una fazione è chi le controlla, non un luogo: un paese può avere più fazioni (Germania fazione 1, Germania fazione 7), ognuna un esercito distinto del computer, e le sue unità possono essere ovunque. Le zone numerate sulla mappa sono aree, non fazioni. L'elenco è quello di questo scenario, dalla sua missione; il numero tra parentesi è quello salvato."
spa = "Quién controla las unidades: el jugador, uno de los bandos del ordenador (cada uno con su país) o Neutral, como los depósitos del mapa. Un bando es quién las controla, no un lugar: un país puede tener varios bandos (Alemania bando 1, Alemania bando 7), cada uno un ejército distinto del ordenador, y sus unidades pueden estar en cualquier parte. Las zonas numeradas del mapa son áreas, no bandos. La lista es la de este escenario, de su misión; el número entre paréntesis es lo que se guarda."
pol = "Kto kontroluje jednostki: gracz, jedna ze stron komputera (każda ze swoim krajem) albo Neutralna, jak składy na mapie. Strona to ten, kto je kontroluje, a nie miejsce: jeden kraj może mieć kilka stron (Niemcy strona 1, Niemcy strona 7), każda to osobna armia komputera, a jej jednostki mogą być wszędzie. Ponumerowane strefy na mapie to obszary, nie strony. Lista pochodzi z misji tego scenariusza; liczba w nawiasie jest zapisywana."
ru = "Кто управляет юнитами: игрок, одна из сторон компьютера (каждая со своей страной) или нейтральная, как склады карты. Сторона — это тот, кто ими управляет, а не место: у одной страны может быть несколько сторон (Германия сторона 1, Германия сторона 7), каждая — отдельная армия компьютера, и её юниты могут быть где угодно. Пронумерованные зоны на карте — это участки, а не стороны. Список берётся из миссии этого сценария; число в скобках — то, что сохраняется."
cz = "Kdo jednotky ovládá: hráč, jedna ze stran počítače (každá se svou zemí), nebo Neutrální jako sklady na mapě. Strana je ten, kdo je ovládá, ne místo: jedna země může mít víc stran (Německo strana 1, Německo strana 7), každá je samostatná armáda počítače a její jednotky mohou být kdekoli. Očíslované zóny na mapě jsou oblasti, ne strany. Seznam je z mise tohoto scénáře; číslo v závorce je to, co se uloží."
jpn = "ユニットを操作するのは誰か：プレイヤー、コンピューターの陣営（それぞれの国つき）、またはマップの補給所と同じ中立。陣営とは操作する者のことで、場所ではありません。ひとつの国が複数の陣営を持つことがあり（ドイツ 陣営 1、ドイツ 陣営 7）、それぞれがコンピューターの別の軍で、そのユニットはどこにいてもかまいません。マップ上の番号付きゾーンは区域で、陣営ではありません。一覧はこのシナリオのミッションから読み取ったもので、括弧内の番号が保存されます。"
sc = "谁控制这些单位：玩家、电脑的某个阵营（各带国家），或像地图补给站一样的中立。阵营指的是谁控制它们，而不是一个地点：同一个国家可以有多个阵营（德国 阵营 1、德国 阵营 7），每个都是电脑的一支独立军队，其单位可以在任何地方。地图上带编号的区域是地块，不是阵营。列表来自本剧本的任务；括号中的编号就是保存的值。"


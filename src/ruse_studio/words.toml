[tip_brush_forest]
us = "Trees and cover in one stroke: trees scattered as Place's Area does (the tree picked there, else the map's most used), and cover under them so units hide. Undo takes back both."
fr = "Arbres et couvert d'un seul trait : des arbres semés comme avec Zone de Placer (l'arbre choisi là, sinon le plus courant de la carte), et du couvert dessous pour cacher les unités. Annuler retire les deux."
ger = "Bäume und Deckung in einem Strich: Bäume verstreut wie mit Fläche beim Platzieren (der dort gewählte Baum, sonst der häufigste der Karte), und Deckung darunter, damit sich Einheiten verbergen. Rückgängig nimmt beides zurück."
ita = "Alberi e copertura in un tratto: alberi sparsi come con Area di Posiziona (l'albero scelto lì, altrimenti il più usato della mappa), e copertura sotto per nascondere le unità. Annulla toglie entrambi."
spa = "Árboles y cobertura de un trazo: árboles repartidos como con Área de Colocar (el árbol elegido allí, si no el más usado del mapa), y cobertura debajo para ocultar a las unidades. Deshacer quita ambos."
pol = "Drzewa i osłona jednym pociągnięciem: drzewa rozsiane jak Obszar w Umieść (drzewo tam wybrane, inaczej najczęstsze na mapie) i osłona pod nimi, by jednostki się kryły. Cofnij usuwa oba."
ru = "Деревья и укрытие одним мазком: деревья разбрасываются как «Область» в «Разместить» (выбранное там дерево, иначе самое частое на карте), а под ними укрытие, чтобы юниты скрывались. Отмена убирает и то и другое."
cz = "Stromy a kryt jedním tahem: stromy rozesety jako Oblast v Umístit (strom vybraný tam, jinak nejčastější na mapě) a kryt pod nimi, aby se jednotky skryly. Zpět odebere obojí."
jpn = "木と遮蔽を一筆で：配置の「範囲」と同じように木を散らし（そこで選んだ木、なければマップで最も多い木）、その下に遮蔽を付けてユニットが隠れられるようにする。元に戻すで両方消える。"
sc = "一笔画出树木和掩护：像“放置”的“区域”那样撒树（使用那里选的树，否则用地图上最常见的树），并在其下加掩护让单位隐藏。撤销会同时移除两者。"

[forest_no_trees]
us = "This map has no trees to place: a map takes only the kinds it already uses."
fr = "Cette carte n'a aucun arbre à placer : une carte n'accepte que les types qu'elle utilise déjà."
ger = "Diese Karte hat keine Bäume zum Platzieren: eine Karte nimmt nur Arten, die sie schon verwendet."
ita = "Questa mappa non ha alberi da posizionare: una mappa accetta solo i tipi che usa già."
spa = "Este mapa no tiene árboles que colocar: un mapa solo acepta los tipos que ya usa."
pol = "Ta mapa nie ma drzew do umieszczenia: mapa przyjmuje tylko rodzaje, których już używa."
ru = "На этой карте нет деревьев для размещения: карта принимает только уже используемые типы."
cz = "Tato mapa nemá žádné stromy k umístění: mapa přijme jen druhy, které už používá."
jpn = "このマップには配置できる木がありません：マップは既に使っている種類しか受け付けません。"
sc = "此地图没有可放置的树：地图只接受它已使用的种类。"


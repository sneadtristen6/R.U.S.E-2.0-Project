jpn = "コピーには独自のマップファイル、ゲームのメニューでの独自の枠、各言語での名前が付きます。IDは名前から作られるので、あなたのマップ変更を入れたPCではどれもまったく同じマップになり、それを持つプレイヤー同士でオンライン対戦できます。"

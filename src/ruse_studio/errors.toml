ger = "Die Startpunkte kommen auf das eigene 3D-Kartenbild der Karte: erst eines wählen oder in Blender machen. Die des Spiels haben ihre Punkte schon eingezeichnet."
ita = "I punti di partenza vanno sull'immagine 3D della mappa: scegline una o creala prima in Blender. Quelle del gioco hanno già i punti disegnati."
spa = "Los puntos de inicio van en la imagen 3D propia del mapa: elige una o créala primero en Blender. Las del juego ya tienen sus puntos dibujados."
pol = "Punkty startowe trafiają na własny obraz 3D mapy: najpierw wybierz go albo zrób w Blenderze. Obrazy gry mają punkty już narysowane."
ru = "Стартовые точки ставятся на собственную 3D-картинку карты: сначала выберите её или сделайте в Blender. На картинках игры точки уже нарисованы."
cz = "Startovní body patří na vlastní 3D obrázek mapy: nejprve ho vyberte nebo vytvořte v Blenderu. Obrázky hry je mají už zakreslené."
jpn = "開始地点はマップ専用の3Dマップ画像に置きます。先に選ぶか Blender で作ってください。ゲームの画像には最初から点が描かれています。"
sc = "起始点放在地图自己的 3D 地图图片上：请先选择一张或在 Blender 中制作。游戏自带的图片已画好起始点。"
fa = "نقطه‌های شروع روی تصویر سه‌بعدیِ خودِ نقشه قرار می‌گیرند: اول یکی انتخاب کنید یا آن را در Blender بسازید. نقطه‌های تصویرهای خودِ بازی از قبل روی آن‌ها کشیده شده‌اند."

[e518cc1f08f]
us = "Blender isn't found on this PC. Get it free from blender.org (Get Blender), then use Choose Blender… to show the Studio where blender.exe is."
fr = "Blender est introuvable sur ce PC. Téléchargez-le gratuitement sur blender.org (Get Blender), puis utilisez « Choisir Blender… » pour montrer au Studio où se trouve blender.exe."
ger = "Blender ist auf diesem PC nicht zu finden. Hol es kostenlos auf blender.org (Get Blender) und zeige dem Studio dann mit „Blender wählen…“, wo blender.exe liegt."
ita = "Blender non si trova su questo PC. Scaricalo gratis da blender.org (Get Blender), poi usa «Scegli Blender…» per mostrare allo Studio dov'è blender.exe."
spa = "No se encuentra Blender en este PC. Descárgalo gratis de blender.org (Get Blender) y luego usa «Elegir Blender…» para indicar al Studio dónde está blender.exe."
pol = "Nie znaleziono Blendera na tym komputerze. Pobierz go za darmo z blender.org (Get Blender), a potem użyj „Wybierz Blendera…”, by wskazać Studio, gdzie jest blender.exe."
ru = "Blender на этом ПК не найден. Скачайте его бесплатно с blender.org (Get Blender), затем укажите Studio, где лежит blender.exe, кнопкой «Выбрать Blender…»."
cz = "Blender na tomto PC není. Stáhněte ho zdarma z blender.org (Get Blender) a pak tlačítkem „Vybrat Blender…“ ukažte Studiu, kde je blender.exe."
jpn = "この PC に Blender が見つかりません。blender.org（Get Blender）から無料で入手し、「Blender を選ぶ…」で blender.exe の場所を Studio に教えてください。"
sc = "此电脑上找不到 Blender。请从 blender.org（Get Blender）免费下载，然后用“选择 Blender…”告诉 Studio blender.exe 的位置。"
fa = "Blender روی این رایانه پیدا نشد. آن را رایگان از blender.org بگیرید (Get Blender)، سپس با «انتخاب Blender…» به استودیو نشان دهید blender.exe کجاست."


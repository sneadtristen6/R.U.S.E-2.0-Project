[e096a4e1121]
us = "What came back was sent by a Blender opened before the last Change its animations in Blender, so it can't be taken in: close that Blender, then in the one opened last click Send to the R.U.S.E. Studio and bring your changes back."
fr = "Ce qui est revenu a été envoyé par un Blender ouvert avant le dernier Changer ses animations dans Blender, donc il ne peut pas être pris : fermez ce Blender, puis dans celui ouvert en dernier cliquez sur Envoyer au R.U.S.E. Studio et ramenez vos changements."
ger = "Was zurückkam, wurde von einem Blender gesendet, das vor dem letzten Seine Animationen in Blender ändern geöffnet wurde, also kann es nicht übernommen werden: Schließe dieses Blender, klicke dann in dem zuletzt geöffneten auf An das R.U.S.E. Studio senden und hole deine Änderungen zurück."
ita = "Ciò che è tornato è stato inviato da un Blender aperto prima dell'ultimo Cambia le sue animazioni in Blender, quindi non può essere preso: chiudi quel Blender, poi in quello aperto per ultimo clicca Invia al R.U.S.E. Studio e riporta le tue modifiche."
spa = "Lo que volvió lo envió un Blender abierto antes del último Cambiar sus animaciones en Blender, así que no se puede tomar: cierra ese Blender y, en el abierto por último, pulsa Enviar a R.U.S.E. Studio y trae tus cambios."
pol = "To, co wróciło, wysłał Blender otwarty przed ostatnim Zmień jego animacje w Blenderze, więc nie można tego przyjąć: zamknij ten Blender, potem w otwartym ostatnio kliknij Wyślij do R.U.S.E. Studio i przenieś swoje zmiany."
ru = "То, что вернулось, отправил Blender, открытый до последнего «Изменить его анимации в Blender», поэтому это нельзя взять: закройте тот Blender, затем в открытом последним нажмите «Отправить в R.U.S.E. Studio» и верните изменения."
cz = "To, co se vrátilo, poslal Blender otevřený před posledním Změnit jeho animace v Blenderu, takže to nelze převzít: zavři ten Blender, pak v tom otevřeném naposledy klikni na Poslat do R.U.S.E. Studia a přenes své změny."
jpn = "戻ってきたものは、最後の「アニメーションをBlenderで変更」より前に開いたBlenderから送られたため、取り込めません。そのBlenderを閉じ、最後に開いたBlenderで「R.U.S.E. Studioへ送る」を押してから、変更を戻してください。"
sc = "带回的内容是由最后一次“在 Blender 中修改它的动画”之前打开的 Blender 发送的，所以无法收入：请关闭那个 Blender，然后在最后打开的那个中点击“发送到 R.U.S.E. Studio”，再带回你的修改。"
fa = "آنچه برگشت را Blenderی فرستاده که پیش از آخرین «تغییر انیمیشن‌هایش در Blender» باز شده بود، پس نمی‌توان آن را گرفت: آن Blender را ببندید، سپس در Blenderی که آخر باز شد روی «ارسال به R.U.S.E. Studio» کلیک کنید و تغییراتتان را بازگردانید."

[efbe0625ca4]
us = "These bones of this unit's skeleton didn't come back from Blender: {0}. A bone renamed or deleted there can't be taken back into its animations, so nothing was taken in. If the Blender that sent it is still open: give the bones their names back there (or undo deleting them), click Send to the R.U.S.E. Studio, then bring your changes back again."
fr = "Ces os du squelette de cette unité ne sont pas revenus de Blender : {0}. Un os renommé ou supprimé là-bas ne peut pas revenir dans ses animations, donc rien n'a été pris. Si le Blender qui l'a envoyé est encore ouvert : redonnez-y leur nom aux os (ou annulez leur suppression), cliquez sur Envoyer au R.U.S.E. Studio, puis ramenez vos changements à nouveau."
ger = "Diese Knochen des Skeletts dieser Einheit kamen nicht aus Blender zurück: {0}. Ein dort umbenannter oder gelöschter Knochen kann nicht in ihre Animationen zurück, also wurde nichts übernommen. Wenn das Blender, das es gesendet hat, noch offen ist: Gib den Knochen dort ihre Namen zurück (oder mache das Löschen rückgängig), klicke An das R.U.S.E. Studio senden und hole deine Änderungen dann noch einmal zurück."
ita = "Queste ossa dello scheletro di questa unità non sono tornate da Blender: {0}. Un osso rinominato o cancellato lì non può tornare nelle sue animazioni, quindi non è stato preso nulla. Se il Blender che l'ha inviato è ancora aperto: ridai lì alle ossa i loro nomi (o annulla la cancellazione), clicca Invia al R.U.S.E. Studio, poi riporta di nuovo le tue modifiche."
spa = "Estos huesos del esqueleto de esta unidad no volvieron de Blender: {0}. Un hueso renombrado o borrado allí no puede volver a sus animaciones, así que no se tomó nada. Si el Blender que lo envió sigue abierto: devuelve allí a los huesos sus nombres (o deshaz el borrado), pulsa Enviar a R.U.S.E. Studio y luego trae tus cambios otra vez."
pol = "Te kości szkieletu tej jednostki nie wróciły z Blendera: {0}. Kość tam przemianowana lub usunięta nie może wrócić do jej animacji, więc nic nie przyjęto. Jeśli Blender, który to wysłał, jest wciąż otwarty: przywróć tam kościom ich nazwy (albo cofnij ich usunięcie), kliknij Wyślij do R.U.S.E. Studio, a potem przenieś swoje zmiany jeszcze raz."
ru = "Эти кости скелета этого юнита не вернулись из Blender: {0}. Кость, переименованная или удалённая там, не может вернуться в его анимации, поэтому ничего не взято. Если Blender, который это отправил, ещё открыт: верните там костям их имена (или отмените удаление), нажмите «Отправить в R.U.S.E. Studio», затем верните изменения ещё раз."
cz = "Tyto kosti kostry této jednotky se z Blenderu nevrátily: {0}. Kost tam přejmenovaná nebo smazaná se nemůže vrátit do jejích animací, takže nic nebylo převzato. Pokud je Blender, který to poslal, ještě otevřený: vrať tam kostem jejich jména (nebo vrať zpět jejich smazání), klikni na Poslat do R.U.S.E. Studia a pak své změny přenes znovu."
jpn = "このユニットの骨格の次の骨がBlenderから戻りませんでした：{0}。そこで名前を変えたり削除したりした骨はアニメーションに戻せないため、何も取り込んでいません。送ってきたBlenderがまだ開いていれば、そこで骨の名前を元に戻し（または削除を取り消し）、「R.U.S.E. Studioへ送る」を押してから、もう一度変更を戻してください。"
sc = "这个单位骨架的这些骨骼没有从 Blender 带回：{0}。在那里改名或删除的骨骼无法回到它的动画中，所以什么都没有收入。如果发送它的那个 Blender 还开着：请在那里把骨骼的名字改回来（或撤销删除），点击“发送到 R.U.S.E. Studio”，然后再带回一次你的修改。"
fa = "این استخوان‌های اسکلت این یگان از Blender برنگشتند: {0}. استخوانی که آنجا تغییر نام داده یا حذف شده نمی‌تواند به انیمیشن‌هایش برگردد، پس چیزی گرفته نشد. اگر Blenderی که آن را فرستاد هنوز باز است: آنجا نام استخوان‌ها را برگردانید (یا حذفشان را لغو کنید)، روی «ارسال به R.U.S.E. Studio» کلیک کنید، سپس تغییراتتان را دوباره بازگردانید."

[e134f9b45cc]
us = "These bones of this unit's skeleton were moved in Blender's Edit Mode, where they rest: {0}. Its model keeps them where they rested, so in the game the parts of the model on them would move off with them, while in Blender those parts stayed where they were: nothing was taken in. If the Blender that sent it is still open: move them back there (or undo moving them) and pose them in Pose Mode instead, click Send to the R.U.S.E. Studio, then bring your changes back again."
fr = "Ces os du squelette de cette unité ont été déplacés dans l'Edit Mode de Blender, là où ils reposent : {0}. Son modèle les garde là où ils reposaient, donc dans le jeu les parties du modèle posées sur eux partiraient avec eux, alors que dans Blender ces parties sont restées où elles étaient : rien n'a été pris. Si le Blender qui l'a envoyé est encore ouvert : remettez-les en place là-bas (ou annulez leur déplacement) et posez-les plutôt dans le Pose Mode, cliquez sur Envoyer au R.U.S.E. Studio, puis ramenez vos changements à nouveau."
ger = "Diese Knochen des Skeletts dieser Einheit wurden im Edit Mode von Blender verschoben, dort, wo sie ruhen: {0}. Sein Modell behält sie dort, wo sie ruhten, also würden im Spiel die Teile des Modells an ihnen mit ihnen wegrücken, während diese Teile in Blender blieben, wo sie waren: Nichts wurde übernommen. Wenn das Blender, das es gesendet hat, noch offen ist: Schiebe sie dort zurück (oder mache das Verschieben rückgängig) und stelle sie stattdessen im Pose Mode, klicke An das R.U.S.E. Studio senden und hole deine Änderungen dann noch einmal zurück."
ita = "Queste ossa dello scheletro di questa unità sono state spostate nell'Edit Mode di Blender, dove riposano: {0}. Il suo modello le tiene dove riposavano, quindi nel gioco le parti del modello su di esse si sposterebbero con loro, mentre in Blender quelle parti sono rimaste dov'erano: non è stato preso nulla. Se il Blender che l'ha inviato è ancora aperto: rimettile lì al loro posto (o annulla lo spostamento) e mettile invece in posa nel Pose Mode, clicca Invia al R.U.S.E. Studio, poi riporta di nuovo le tue modifiche."
spa = "Estos huesos del esqueleto de esta unidad se movieron en el Edit Mode de Blender, donde reposan: {0}. Su modelo los mantiene donde reposaban, así que en el juego las partes del modelo sobre ellos se moverían con ellos, mientras que en Blender esas partes se quedaron donde estaban: no se tomó nada. Si el Blender que lo envió sigue abierto: devuélvelos allí a su sitio (o deshaz el movimiento) y colócalos en cambio en el Pose Mode, pulsa Enviar a R.U.S.E. Studio y luego trae tus cambios otra vez."
pol = "Te kości szkieletu tej jednostki przesunięto w Edit Mode Blendera, tam gdzie spoczywają: {0}. Jej model trzyma je tam, gdzie spoczywały, więc w grze części modelu na nich przesunęłyby się razem z nimi, a w Blenderze te części zostały tam, gdzie były: nic nie przyjęto. Jeśli Blender, który to wysłał, jest wciąż otwarty: przesuń je tam z powrotem (albo cofnij przesunięcie) i zamiast tego ustaw je w Pose Mode, kliknij Wyślij do R.U.S.E. Studio, a potem przenieś swoje zmiany jeszcze raz."
ru = "Эти кости скелета этого юнита сдвинуты в Edit Mode Blender, там, где они покоятся: {0}. Его модель держит их там, где они покоились, поэтому в игре части модели на них сдвинулись бы вместе с ними, а в Blender эти части остались на месте: ничего не взято. Если Blender, который это отправил, ещё открыт: верните их там на место (или отмените сдвиг) и вместо этого поставьте позу в Pose Mode, нажмите «Отправить в R.U.S.E. Studio», затем верните изменения ещё раз."
cz = "Tyto kosti kostry této jednotky byly posunuty v Edit Mode Blenderu, tam, kde spočívají: {0}. Její model je drží tam, kde spočívaly, takže ve hře by se části modelu na nich posunuly s nimi, zatímco v Blenderu tyto části zůstaly, kde byly: nic nebylo převzato. Pokud je Blender, který to poslal, ještě otevřený: posuň je tam zpět (nebo vrať posunutí zpět) a místo toho je napózuj v Pose Mode, klikni na Poslat do R.U.S.E. Studia a pak své změny přenes znovu."
jpn = "このユニットの骨格の次の骨が、BlenderのEdit Modeで静止位置ごと動かされました：{0}。モデルは元の静止位置のままなので、ゲームではそれらの骨に付いたモデルの部分が骨と一緒に動いてしまいますが、Blenderではその部分は元の位置のままでした。何も取り込んでいません。送ってきたBlenderがまだ開いていれば、そこで骨を元に戻し（または移動を取り消し）、代わりにPose Modeでポーズを付けて「R.U.S.E. Studioへ送る」を押してから、もう一度変更を戻してください。"
sc = "这个单位骨架的这些骨骼在 Blender 的 Edit Mode 中被移动了静止位置：{0}。它的模型仍把它们留在原来的静止位置，所以在游戏中模型上依附它们的部分会跟着移开，而在 Blender 中这些部分留在原处：什么都没有收入。如果发送它的那个 Blender 还开着：请在那里把它们移回去（或撤销移动），改在 Pose Mode 中摆姿势，点击“发送到 R.U.S.E. Studio”，然后再带回一次你的修改。"
fa = "این استخوان‌های اسکلت این یگان در Edit Mode در Blender جابه‌جا شدند، همان‌جا که در حالت سکون‌اند: {0}. مدلش آن‌ها را همان‌جا که در سکون بودند نگه می‌دارد، پس در بازی بخش‌هایی از مدل که روی آن‌هاست همراهشان جابه‌جا می‌شوند، در حالی که در Blender آن بخش‌ها سر جایشان ماندند: چیزی گرفته نشد. اگر Blenderی که آن را فرستاد هنوز باز است: آنجا آن‌ها را سر جایشان برگردانید (یا جابه‌جایی را لغو کنید) و به‌جایش در Pose Mode ژستشان را بدهید، روی «ارسال به R.U.S.E. Studio» کلیک کنید، سپس تغییراتتان را دوباره بازگردانید."

[e3b1222341a]
us = "These bones of this unit's skeleton didn't come back from Blender: {0}, and these came back that it hasn't got: {1}. A bone renamed or deleted there can't be taken back into its animations, so nothing was taken in. If the Blender that sent it is still open: give the bones their names back there (or undo deleting them), click Send to the R.U.S.E. Studio, then bring your changes back again."
fr = "Ces os du squelette de cette unité ne sont pas revenus de Blender : {0}, et ceux-ci sont revenus alors qu'il ne les a pas : {1}. Un os renommé ou supprimé là-bas ne peut pas revenir dans ses animations, donc rien n'a été pris. Si le Blender qui l'a envoyé est encore ouvert : redonnez-y leur nom aux os (ou annulez leur suppression), cliquez sur Envoyer au R.U.S.E. Studio, puis ramenez vos changements à nouveau."
ger = "Diese Knochen des Skeletts dieser Einheit kamen nicht aus Blender zurück: {0}, und diese kamen zurück, die es nicht hat: {1}. Ein dort umbenannter oder gelöschter Knochen kann nicht in ihre Animationen zurück, also wurde nichts übernommen. Wenn das Blender, das es gesendet hat, noch offen ist: Gib den Knochen dort ihre Namen zurück (oder mache das Löschen rückgängig), klicke An das R.U.S.E. Studio senden und hole deine Änderungen dann noch einmal zurück."
ita = "Queste ossa dello scheletro di questa unità non sono tornate da Blender: {0}, e queste sono tornate ma lo scheletro non le ha: {1}. Un osso rinominato o cancellato lì non può tornare nelle sue animazioni, quindi non è stato preso nulla. Se il Blender che l'ha inviato è ancora aperto: ridai lì alle ossa i loro nomi (o annulla la cancellazione), clicca Invia al R.U.S.E. Studio, poi riporta di nuovo le tue modifiche."
spa = "Estos huesos del esqueleto de esta unidad no volvieron de Blender: {0}, y estos volvieron aunque el esqueleto no los tiene: {1}. Un hueso renombrado o borrado allí no puede volver a sus animaciones, así que no se tomó nada. Si el Blender que lo envió sigue abierto: devuelve allí a los huesos sus nombres (o deshaz el borrado), pulsa Enviar a R.U.S.E. Studio y luego trae tus cambios otra vez."
pol = "Te kości szkieletu tej jednostki nie wróciły z Blendera: {0}, a te wróciły, choć szkielet ich nie ma: {1}. Kość tam przemianowana lub usunięta nie może wrócić do jej animacji, więc nic nie przyjęto. Jeśli Blender, który to wysłał, jest wciąż otwarty: przywróć tam kościom ich nazwy (albo cofnij ich usunięcie), kliknij Wyślij do R.U.S.E. Studio, a potem przenieś swoje zmiany jeszcze raz."
ru = "Эти кости скелета этого юнита не вернулись из Blender: {0}, а эти вернулись, хотя в скелете их нет: {1}. Кость, переименованная или удалённая там, не может вернуться в его анимации, поэтому ничего не взято. Если Blender, который это отправил, ещё открыт: верните там костям их имена (или отмените удаление), нажмите «Отправить в R.U.S.E. Studio», затем верните изменения ещё раз."
cz = "Tyto kosti kostry této jednotky se z Blenderu nevrátily: {0}, a tyto se vrátily, ačkoli je kostra nemá: {1}. Kost tam přejmenovaná nebo smazaná se nemůže vrátit do jejích animací, takže nic nebylo převzato. Pokud je Blender, který to poslal, ještě otevřený: vrať tam kostem jejich jména (nebo vrať zpět jejich smazání), klikni na Poslat do R.U.S.E. Studia a pak své změny přenes znovu."
jpn = "このユニットの骨格の次の骨がBlenderから戻りませんでした：{0}。また、骨格にない次の骨が戻ってきました：{1}。そこで名前を変えたり削除したりした骨はアニメーションに戻せないため、何も取り込んでいません。送ってきたBlenderがまだ開いていれば、そこで骨の名前を元に戻し（または削除を取り消し）、「R.U.S.E. Studioへ送る」を押してから、もう一度変更を戻してください。"
sc = "这个单位骨架的这些骨骼没有从 Blender 带回：{0}，而这些骨架里没有的骨骼带回来了：{1}。在那里改名或删除的骨骼无法回到它的动画中，所以什么都没有收入。如果发送它的那个 Blender 还开着：请在那里把骨骼的名字改回来（或撤销删除），点击“发送到 R.U.S.E. Studio”，然后再带回一次你的修改。"
fa = "این استخوان‌های اسکلت این یگان از Blender برنگشتند: {0}، و این‌ها برگشتند که اسکلت آن‌ها را ندارد: {1}. استخوانی که آنجا تغییر نام داده یا حذف شده نمی‌تواند به انیمیشن‌هایش برگردد، پس چیزی گرفته نشد. اگر Blenderی که آن را فرستاد هنوز باز است: آنجا نام استخوان‌ها را برگردانید (یا حذفشان را لغو کنید)، روی «ارسال به R.U.S.E. Studio» کلیک کنید، سپس تغییراتتان را دوباره بازگردانید."
[e32ec368e87]

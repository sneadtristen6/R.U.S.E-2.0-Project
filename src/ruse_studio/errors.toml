spa = "Lo que volvió lo envió un Blender abierto antes del abierto por último, así que no se puede tomar: cierra ese Blender y, en el abierto por último, pulsa Enviar a R.U.S.E. Studio y trae tus cambios."
pol = "To, co wróciło, wysłał Blender otwarty przed otwartym ostatnio, więc nie można tego przyjąć: zamknij ten Blender, potem w otwartym ostatnio kliknij Wyślij do R.U.S.E. Studio i przenieś swoje zmiany."
ru = "То, что вернулось, отправил Blender, открытый раньше открытого последним, поэтому это нельзя взять: закройте тот Blender, затем в открытом последним нажмите «Отправить в R.U.S.E. Studio» и верните изменения."
cz = "To, co se vrátilo, poslal Blender otevřený před tím otevřeným naposledy, takže to nelze převzít: zavři ten Blender, pak v tom otevřeném naposledy klikni na Poslat do R.U.S.E. Studia a přenes své změny."
jpn = "戻ってきたものは、最後に開いたBlenderより前に開いたBlenderから送られたため、取り込めません。そのBlenderを閉じ、最後に開いたBlenderで「R.U.S.E. Studioへ送る」を押してから、変更を戻してください。"
sc = "带回的内容是由最后打开的那个 Blender 之前打开的 Blender 发送的，所以无法收入：请关闭那个 Blender，然后在最后打开的那个中点击“发送到 R.U.S.E. Studio”，再带回你的修改。"
fa = "آنچه برگشت را Blenderی فرستاده که پیش از آخرین Blender بازشده باز شده بود، پس نمی‌توان آن را گرفت: آن Blender را ببندید، سپس در Blenderی که آخر باز شد روی «ارسال به R.U.S.E. Studio» کلیک کنید و تغییراتتان را بازگردانید."

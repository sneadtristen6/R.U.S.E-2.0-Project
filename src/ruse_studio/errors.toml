# genhorse (one Generic Horse every mod can keep and share; the fixer, after the review of f1fa002c): Resize
# and Move of a model made from one of the Generic Horse's files, refused when no file on this PC has the bytes it
# was made from (horse_squad._horse_gone, by the file: findings 1 and 3), the way out that loses nothing first
# (finding 5): this mod's Generic Horse, then any other unit made from its files
[e94f160c7fc]
us = "The file the Generic Horse's model was made from isn't there any more, or isn't as it was then ({0}), so its size can't be changed and it stays as it is. Nothing is lost if its files are made on this PC again: add the Generic Horse to another mod (a new one will do) with Add to my mod in the Units tab (WWII+), then change its size here again: that works when they come out the same as the ones it was made from. If not, on its page in the Units tab (WWII+) click Take it out of my mod, then Add to my mod: what you changed on it is lost."
fr = "Le fichier dont le modèle de l'Escouade à cheval générique a été fait n'est plus là, ou n'est plus tel qu'il était alors ({0}), donc sa taille ne peut pas être changée et elle reste telle quelle. Rien n'est perdu si ses fichiers sont refaits sur ce PC : ajoutez l'Escouade à cheval générique à un autre mod (un nouveau suffit) avec Ajouter à mon mod dans l'onglet Unités (39-45+), puis changez à nouveau sa taille ici : cela marche quand ils ressortent identiques à ceux dont elle a été faite. Sinon, sur sa page dans l'onglet Unités (39-45+), cliquez sur La retirer de mon mod, puis sur Ajouter à mon mod : ce que vous y avez changé est perdu."
ger = "Die Datei, aus der das Modell des Generischen Reitertrupps gemacht wurde, ist nicht mehr da oder nicht mehr so, wie sie damals war ({0}), daher kann seine Größe nicht geändert werden und er bleibt, wie er ist. Nichts geht verloren, wenn seine Dateien auf diesem PC neu gemacht werden: Füge den Generischen Reitertrupp mit Zu meiner Mod hinzufügen im Tab Einheiten (Zweiter Weltkrieg+) einer anderen Mod hinzu (eine neue reicht), dann ändere seine Größe hier erneut: Das klappt, wenn sie genauso herauskommen wie die, aus denen er gemacht wurde. Wenn nicht, klicke auf seiner Seite im Tab Einheiten (Zweiter Weltkrieg+) auf Aus meiner Mod entfernen, dann auf Zu meiner Mod hinzufügen: Was du an ihm geändert hast, geht verloren."
ita = "Il file da cui è stato fatto il modello della Squadra a cavallo generica non c'è più, o non è più com'era allora ({0}), quindi la sua dimensione non si può cambiare e resta com'è. Non si perde nulla se i suoi file vengono rifatti su questo PC: aggiungi la Squadra a cavallo generica a un'altra mod (ne basta una nuova) con Aggiungi alla mia mod nella scheda Unità (Seconda guerra mondiale+), poi cambia di nuovo qui la sua dimensione: funziona quando escono uguali a quelli da cui è stata fatta. Altrimenti, nella sua pagina della scheda Unità (Seconda guerra mondiale+) clicca Toglila dalla mia mod, poi Aggiungi alla mia mod: ciò che le hai cambiato va perso."
spa = "El archivo del que se hizo el modelo del Pelotón a caballo genérico ya no está, o ya no está como estaba entonces ({0}), así que no se puede cambiar su tamaño y se queda como está. No se pierde nada si sus archivos se vuelven a hacer en este PC: añade el Pelotón a caballo genérico a otro mod (vale uno nuevo) con Añadir a mi mod en la pestaña Unidades (IIGM+) y luego cambia su tamaño aquí otra vez: funciona cuando salen iguales a los archivos de los que se hizo. Si no, en su página de la pestaña Unidades (IIGM+) pulsa Quitarla de mi mod y luego Añadir a mi mod: lo que le cambiaste se pierde."
pol = "Pliku, z którego powstał model Uniwersalnego oddziału konnego, już nie ma albo nie jest już taki jak wtedy ({0}), więc nie można zmienić jego rozmiaru i zostaje taki, jaki jest. Nic nie przepadnie, jeśli jego pliki powstaną na tym komputerze od nowa: dodaj Uniwersalny oddział konny do innego moda (wystarczy nowy) przyciskiem Dodaj do moda w zakładce Jednostki (II wojna światowa+), a potem zmień tu jego rozmiar jeszcze raz: to działa, gdy wyjdą takie same jak te, z których powstał. Jeśli nie, na jego stronie w zakładce Jednostki (II wojna światowa+) kliknij Usuń z moda, a potem Dodaj do moda: to, co w nim zmieniono, przepadnie."
ru = "Файла, из которого сделана модель Универсального конного отряда, больше нет, или он уже не такой, каким был тогда ({0}), поэтому его размер нельзя изменить, и он остаётся как есть. Ничего не пропадёт, если его файлы сделать на этом ПК заново: добавьте Универсальный конный отряд в другой мод (подойдёт новый) кнопкой «Добавить в мод» во вкладке «Юниты» («Вторая мировая+»), затем снова измените его размер здесь: это сработает, если они получатся такими же, как те, из которых он сделан. Если нет, на его странице во вкладке «Юниты» («Вторая мировая+») нажмите «Убрать из мода», затем «Добавить в мод»: то, что вы в нём изменили, пропадёт."
cz = "Soubor, ze kterého vznikl model Univerzálního jízdního družstva, už tu není, nebo už není takový, jaký byl tehdy ({0}), takže jeho velikost nejde změnit a zůstává, jak je. Nic se neztratí, když se jeho soubory na tomto PC vyrobí znovu: přidej Univerzální jízdní družstvo do jiného modu (stačí nový) tlačítkem Přidat do modu na kartě Jednotky (2. světová válka+) a pak tu jeho velikost změň znovu: to funguje, když vyjdou stejné jako ty, ze kterých vzniklo. Pokud ne, klikni na jeho stránce na kartě Jednotky (2. světová válka+) na Odebrat z modu a pak na Přidat do modu: co jsi na něm změnil, se ztratí."
jpn = "汎用騎馬分隊のモデルの元のファイルがもうないか、当時のままではありません（{0}）。そのためサイズを変えられず、今のままです。このPCで汎用騎馬分隊のファイルを作り直せば何も失われません。ユニットタブ（第二次大戦+）の「MODに追加」で汎用騎馬分隊を別のMOD（新しいMODでもかまいません）に追加してから、ここでもう一度サイズを変えてください。作られたファイルが元のファイルと同じなら変えられます。だめな場合は、ユニットタブ（第二次大戦+）のそのページで「MODから外す」を押してから「MODに追加」を押してください。変更した内容は失われます。"
sc = "制作通用骑兵小队模型的文件已不在，或已不是当时的样子（{0}），所以无法更改其大小，它保持原样。如果在这台电脑上重新制作它的文件，什么都不会丢失：在单位标签页（二战+）中用“加入我的模组”把通用骑兵小队加入另一个模组（新建一个也可以），然后在这里再次更改其大小：做出来的文件与当初的相同时就可以。否则，请在单位标签页（二战+）中它的页面上点击“从模组中移除”，再点击“加入我的模组”：你对它所做的更改会丢失。"
fa = "فایلی که مدل جوخهٔ سوارهٔ عمومی از آن ساخته شده دیگر وجود ندارد یا دیگر مثل آن زمان نیست ({0})، پس اندازه‌اش را نمی‌توان تغییر داد و همان‌طور که هست می‌ماند. اگر فایل‌هایش روی این رایانه دوباره ساخته شوند چیزی از دست نمی‌رود: جوخهٔ سوارهٔ عمومی را با «افزودن به ماد من» در زبانهٔ یگان‌ها (جنگ جهانی دوم+) به ماد دیگری (یک ماد تازه هم کافی است) اضافه کنید، سپس اندازه‌اش را اینجا دوباره تغییر دهید: اگر فایل‌ها همان‌طور درآیند که مدل از آن‌ها ساخته شد، کار می‌کند. اگر نه، در صفحه‌اش در زبانهٔ یگان‌ها (جنگ جهانی دوم+) روی «بیرون بردن از ماد من» و بعد روی «افزودن به ماد من» کلیک کنید: تغییراتی که در آن داده‌اید از بین می‌رود."


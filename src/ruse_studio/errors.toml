[ec6c9be6766]
us = "This squad has a model you imported, so it can't have a Custom uniform too: a unit has only one model. To give it a uniform, click Use the copied unit's model under Its own model first, then Custom uniform."
fr = "Cette escouade a un modèle que vous avez importé : elle ne peut donc pas avoir aussi un Uniforme personnalisé, une unité n'a qu'un modèle. Pour lui donner un uniforme, cliquez d'abord sur Utiliser le modèle de l'unité copiée dans la partie Son propre modèle, puis sur Uniforme personnalisé."
ger = "Dieser Trupp hat ein Modell, das du importiert hast, also kann er nicht auch eine Eigene Uniform haben: Eine Einheit hat nur ein Modell. Um ihm eine Uniform zu geben, klicke zuerst unter Eigenes Modell auf Modell der kopierten Einheit nutzen, dann auf Eigene Uniform."
ita = "Questa squadra ha un modello che hai importato, quindi non può avere anche un'Uniforme personalizzata: un'unità ha un solo modello. Per darle un'uniforme, clicca prima Usa il modello dell'unità copiata in Un modello tutto suo, poi Uniforme personalizzata."
spa = "Este pelotón tiene un modelo que importaste, así que no puede tener también un Uniforme personalizado: una unidad tiene un solo modelo. Para darle un uniforme, haz clic primero en Usar el modelo de la unidad copiada en Su propio modelo, y luego en Uniforme personalizado."
pol = "Ten oddział ma zaimportowany przez ciebie model, więc Własny mundur nie jest dla niego dostępny: jednostka ma tylko jeden model. Aby dać mu mundur, najpierw kliknij Użyj modelu kopiowanej jednostki w części Własny model, a potem Własny mundur."
ru = "У этого отряда импортированная вами модель, поэтому «Своя форма» ему недоступна: у юнита только одна модель. Чтобы дать ему форму, сначала нажмите «Модель копируемого юнита» в разделе «Своя модель», затем «Своя форма»."
cz = "Toto družstvo má model, který jste importovali, takže pro něj Vlastní uniforma není k dispozici: jednotka má jen jeden model. Chcete-li mu dát uniformu, klikněte nejdřív na Použít model kopírované jednotky v části Vlastní model, pak na Vlastní uniforma."
jpn = "この分隊には読み込んだモデルがあるので、「カスタム軍服」は付けられません。ユニットのモデルは一つだけです。軍服を付けるには、先に「独自のモデル」の「コピー元のモデルを使う」を押してから「カスタム軍服」を押してください。"
sc = "这个小队有你导入的模型，所以不能再有“自定义制服”：一个单位只有一个模型。要给它制服，请先在“自己的模型”中点击“使用所复制单位的模型”，再点击“自定义制服”。"

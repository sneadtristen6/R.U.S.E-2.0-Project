ita = "Non è stato possibile aggiungere la Squadra a cavallo generica, e anche toglierla non è riuscito: una parte è ancora nella tua mod. Toglila dalla tua mod nella sua pagina della scheda Unità, oppure eliminala nella sua pagina dell'unità."

# The Studio's error messages in the game's ten languages (ruse_studio/errortext.py). Each entry is one error as
# the code raises it, in English (us), its f-string's values as numbered blanks {0}, {1}...; the other languages keep
# every blank. The entry's name comes from its English text (errortext.key_of). tests/test_errortext.py checks that
# every error in the code has an entry here with all ten languages and the same blanks.
# Starter translations: corrections welcome.


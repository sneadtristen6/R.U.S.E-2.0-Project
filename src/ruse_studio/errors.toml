cz = "Tato jednotka má model, který jste importovali, takže pro ni vlastní kopie modelu není k dispozici: jednotka má jen jeden model. Klikněte nejdřív na Použít model kopírované jednotky v části Vlastní model, pak na Dát mu vlastní kopii modelu."
jpn = "このユニットには読み込んだモデルがあるので、専用のモデルのコピーは持てません。ユニットのモデルは一つだけです。先に「独自のモデル」の「コピー元のモデルを使う」を押してから「専用のモデルのコピーを持たせる」を押してください。"
sc = "这个单位有你导入的模型，所以不能再有它自己的模型副本：一个单位只有一个模型。请先在“自己的模型”中点击“使用所复制单位的模型”，再点击“给它一份自己的模型副本”。"

ita = "Un modello di questa unità è stato fatto da uno dei file della Squadra a cavallo generica, che non c'è più, o non è più com'era allora ({0}), quindi non si può spostare e resta com'è. Non si perde nulla se i file della Squadra a cavallo generica vengono rifatti su questo PC: aggiungi la Squadra a cavallo generica a una mod (ne basta una nuova) con Aggiungi alla mia mod nella scheda Unità (Seconda guerra mondiale+), poi spostala di nuovo qui: funziona quando escono uguali a quelli da cui è stato fatto il modello. Altrimenti, importa di nuovo quel modello."
spa = "Un modelo de esta unidad se hizo de uno de los archivos del Pelotón a caballo genérico, que ya no está, o ya no está como estaba entonces ({0}), así que no se puede mover y se queda como está. No se pierde nada si los archivos del Pelotón a caballo genérico se vuelven a hacer en este PC: añade el Pelotón a caballo genérico a un mod (vale uno nuevo) con Añadir a mi mod en la pestaña Unidades (IIGM+) y luego muévela aquí otra vez: funciona cuando salen iguales a los archivos de los que se hizo el modelo. Si no, vuelve a importar ese modelo."
pol = "Model tej jednostki powstał z jednego z plików Uniwersalnego oddziału konnego, którego już nie ma albo nie jest już taki jak wtedy ({0}), więc nie można jej przesunąć i zostaje taka, jaka jest. Nic nie przepadnie, jeśli pliki Uniwersalnego oddziału konnego powstaną na tym komputerze od nowa: dodaj Uniwersalny oddział konny do moda (wystarczy nowy) przyciskiem Dodaj do moda w zakładce Jednostki (II wojna światowa+), a potem przesuń ją tu jeszcze raz: to działa, gdy wyjdą takie same jak te, z których powstał model. Jeśli nie, zaimportuj ten model ponownie."
ru = "Модель этого юнита сделана из одного из файлов Универсального конного отряда, которого больше нет, или он уже не такой, каким был тогда ({0}), поэтому его нельзя сдвинуть, и он остаётся как есть. Ничего не пропадёт, если файлы Универсального конного отряда сделать на этом ПК заново: добавьте Универсальный конный отряд в мод (подойдёт новый) кнопкой «Добавить в мод» во вкладке «Юниты» («Вторая мировая+»), затем снова сдвиньте его здесь: это сработает, если они получатся такими же, как те, из которых сделана модель. Если нет, импортируйте эту модель снова."
cz = "Model této jednotky vznikl z jednoho ze souborů Univerzálního jízdního družstva, který už tu není, nebo už není takový, jaký byl tehdy ({0}), takže ji nejde posunout a zůstává, jak je. Nic se neztratí, když se soubory Univerzálního jízdního družstva na tomto PC vyrobí znovu: přidej Univerzální jízdní družstvo do modu (stačí nový) tlačítkem Přidat do modu na kartě Jednotky (2. světová válka+) a pak ji tu posuň znovu: to funguje, když vyjdou stejné jako ty, ze kterých model vznikl. Pokud ne, importuj ten model znovu."
jpn = "このユニットのモデルの一つは汎用騎馬分隊のファイルから作られましたが、そのファイルがもうないか、当時のままではありません（{0}）。そのため移動できず、今のままです。このPCで汎用騎馬分隊のファイルを作り直せば何も失われません。ユニットタブ（第二次大戦+）の「MODに追加」で汎用騎馬分隊をMOD（新しいMODでもかまいません）に追加してから、ここでもう一度移動してください。作られたファイルが元のファイルと同じなら移動できます。だめな場合は、そのモデルをもう一度読み込んでください。"
sc = "这个单位的一个模型是用通用骑兵小队的一个文件制作的，该文件已不在，或已不是当时的样子（{0}），所以无法移动它，它保持原样。如果在这台电脑上重新制作通用骑兵小队的文件，什么都不会丢失：在单位标签页（二战+）中用“加入我的模组”把通用骑兵小队加入一个模组（新建一个也可以），然后在这里再次移动它：做出来的文件与当初的相同时就可以。否则，请重新导入那个模型。"
fa = "یکی از مدل‌های این یگان از یکی از فایل‌های جوخهٔ سوارهٔ عمومی ساخته شده که دیگر وجود ندارد یا دیگر مثل آن زمان نیست ({0})، پس نمی‌توان آن را جابه‌جا کرد و همان‌طور که هست می‌ماند. اگر فایل‌های جوخهٔ سوارهٔ عمومی روی این رایانه دوباره ساخته شوند چیزی از دست نمی‌رود: جوخهٔ سوارهٔ عمومی را با «افزودن به ماد من» در زبانهٔ یگان‌ها (جنگ جهانی دوم+) به یک ماد (یک ماد تازه هم کافی است) اضافه کنید، سپس آن را اینجا دوباره جابه‌جا کنید: اگر فایل‌ها همان‌طور درآیند که مدل از آن‌ها ساخته شد، کار می‌کند. اگر نه، آن مدل را دوباره وارد کنید."


ita = "{0} non può essere eliminato: l'elenco delle unità del gioco lo nomina, e il gioco non carica le sue unità quando ne manca una. Nascondilo invece dai menu di costruzione (ShowInMenu)."
spa = "{0} no se puede borrar: la lista de unidades del juego lo nombra, y el juego no carga sus unidades si falta una. Ocúltalo de los menús de construcción en su lugar (ShowInMenu)."
pol = "{0} nie można usunąć: lista jednostek gry go wymienia, a gra nie wczytuje jednostek, gdy którejś brakuje. Zamiast tego ukryj go w menu budowy (ShowInMenu)."
ru = "{0} удалить нельзя: он есть в списке юнитов игры, а игра не загружает юниты, если одного не хватает. Лучше скройте его из меню постройки (ShowInMenu)."
cz = "{0} nelze smazat: seznam jednotek hry ho uvádí a hra nenačte své jednotky, když některá chybí. Místo toho ho skryjte z nabídek stavby (ShowInMenu)."
jpn = "{0} は削除できません。ゲームのユニット一覧に載っており、1つでも欠けるとゲームはユニットを読み込めません。代わりに建設メニューから隠してください（ShowInMenu）。"
sc = "{0} 不能删除：游戏的单位列表中有它，缺少任何一个，游戏就无法加载单位。请改为在建造菜单中隐藏它（ShowInMenu）。"
fa = "{0} را نمی‌توان حذف کرد: فهرست یگان‌های بازی نام آن را آورده است، و اگر یکی از آن‌ها نباشد، بازی نمی‌تواند یگان‌هایش را بارگذاری کند. به‌جای آن، آن را از منوهای ساخت پنهان کنید (ShowInMenu)."


ita = "Questa unità ha un modello che hai importato, quindi non può avere anche una sua copia del modello: un'unità ha un solo modello. Clicca prima Usa il modello dell'unità copiata in Un modello tutto suo, poi Dagli una sua copia del modello."
spa = "Esta unidad tiene un modelo que importaste, así que no puede tener también su propia copia del modelo: una unidad tiene un solo modelo. Haz clic primero en Usar el modelo de la unidad copiada en Su propio modelo, y luego en Darle su propia copia del modelo."

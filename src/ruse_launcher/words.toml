13. Steam und dein Steam-Konto
Die eigenen Regeln von Steam, die du mit deinem Steam-Konto akzeptiert hast, schränken ein, Spiele zu ändern, in ihre Funktionsweise einzugreifen und im Mehrspielermodus zu cheaten. Valve, nicht wir, entscheidet, wie seine Regeln auf R.U.S.E. angewendet werden. Wir wissen nicht, ob Valve eine gemoddete Kopie oder ihre geänderten Spieldateien als Verstoß dagegen ansehen würde, und wir können nichts über dein Steam-Konto versprechen. Online mit einer gemoddeten Kopie zu spielen, vor allem mit einer, die mit einem Cheat- oder Testwerkzeug gebaut wurde, ist deine Entscheidung und geschieht auf eigenes Risiko. R.U.S.E. hat keinen wirksamen Anti-Cheat, deshalb braucht es RUSE Guard; RUSE Guard selbst tut nie etwas mit deinem Steam-Konto oder deinem installierten Spiel.


- Les applications ne mettent jamais rien dans le jeu pendant qu'il tourne. Elles voient seulement s'il tourne et d'où, et l'outil de dépannage peut fermer un jeu resté ouvert depuis une copie moddée quand vous appuyez sur son bouton de réparation.
- Le jeu a son propre rapporteur de plantage, fait par le créateur du jeu. Quand le jeu plante, que ce soit votre jeu installé ou une copie moddée, ce rapporteur peut envoyer son propre rapport de plantage au créateur du jeu. C'est celui du jeu, pas le nôtre : nos applications n'envoient jamais ses rapports, et ne l'activent ni ne le désactivent.
- Nos applications ne modifient jamais votre jeu installé, sauf si vous demandez au Launcher ou au Studio de le restaurer depuis sa sauvegarde propre. Une restauration remet en place les fichiers d'origine du jeu, et met de côté les fichiers qui ont été ajoutés et les versions qu'elle remplace.

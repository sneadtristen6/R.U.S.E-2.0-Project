存放在哪里
我们服务器的数据库由 Cloudflare 存储在北美东部;Cloudflare 的网络通过世界各地的数据中心提供它们。RUSE Guard 的记录被收集到 sneadtristen6 位于美国的自己的电脑上供审核。当我们调查某个问题时,Bug Watch 报告的副本也可能在他的电脑上:属于我们正在修复的某个错误的副本在该错误修复后删除,不显示任何错误的副本在 7 天后删除。sneadtristen6 在美国,Cloudflare 是一家美国公司,所以你的数据会在美国以及 Cloudflare 运行的任何地方被处理。

我们保留多久
- RUSE Guard 记录:我们的 RUSE Guard 服务器保留每条记录,直到我们的审核电脑收取它,并且在它到达后最多 3 天:之后无论是否被收取都会删除。在审核电脑上,一场对战的记录在其最后一条到达后约 48 小时删除(在它下一次清理时,清理在它每次收取记录时运行),除非该对战的审核处于开启状态。正在审核的对战保留到作出决定;如果被驳回,随后删除。如果作弊被确认,你有从决定之日起 30 天的申诉期:证据保留这 30 天,如果你申诉,则保留到你的申诉有结果。之后证据被删除,只保留决定,在它适用期间一直保留。如果申诉获得支持,决定被标记为已推翻,绝不会被用来对你不利;你提出要求,我们也会删除它。作弊副本的停止通知不会发起审核:它只是列出来供 sneadtristen6 查看,并像任何记录一样被删除。

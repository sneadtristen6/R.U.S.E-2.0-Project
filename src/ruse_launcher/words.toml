Où c'est conservé
Les bases de données de nos serveurs sont conservées par Cloudflare dans l'est de l'Amérique du Nord ; le réseau de Cloudflare les sert depuis des centres de données dans le monde entier. Les enregistrements RUSE Guard sont collectés pour examen sur l'ordinateur personnel de sneadtristen6, aux États-Unis. Quand nous étudions un problème, des copies de rapports Bug Watch peuvent aussi se trouver sur son ordinateur : une copie qui se rapporte à un bug que nous corrigeons est supprimée une fois ce bug corrigé, et une copie qui ne montre aucun bug est supprimée au bout de 7 jours. sneadtristen6 est aux États-Unis, et Cloudflare est une entreprise américaine : vos données sont donc traitées aux États-Unis et partout où Cloudflare opère.

Combien de temps nous le gardons
- Les enregistrements RUSE Guard : notre serveur RUSE Guard garde chaque enregistrement jusqu'à ce que notre ordinateur d'examen le récupère, et jamais plus de 3 jours après son arrivée : il est alors supprimé, récupéré ou non. Sur l'ordinateur d'examen, les enregistrements d'une partie sont supprimés environ 48 heures après l'arrivée du dernier (à son nettoyage suivant, qui s'exécute chaque fois qu'il récupère des enregistrements), sauf si une revue de la partie est ouverte. Une partie en cours de revue est conservée jusqu'à la décision ; si elle est classée sans suite, elle est alors supprimée. Si la triche est confirmée, vous avez 30 jours à compter de la décision pour faire appel : les preuves sont conservées pendant ces 30 jours, et si vous faites appel, jusqu'à ce que votre appel soit tranché. Ensuite les preuves sont supprimées, et seule la décision est conservée, aussi longtemps qu'elle s'applique. Si un appel est accepté, la décision est marquée comme annulée et n'est jamais utilisée contre vous ; demandez-le-nous, et nous la supprimerons aussi. La note d'arrêt d'une copie de triche n'ouvre aucune revue : elle est listée pour que sneadtristen6 la voie, et supprimée comme tout enregistrement.
- La liste de l'ordinateur d'examen avec les noms d'utilisateur et les clés RUSE Guard, et la date de leur première apparition : conservée sans limite de durée pour l'instant ; écrivez-nous et nous supprimerons la vôtre.
- Les enregistrements RUSE Guard sur votre PC : un enregistrement en attente d'envoi reste jusqu'à son envoi ; un enregistrement que notre serveur a refusé est supprimé 30 jours après avoir été mis de côté.
- Bug Watch : section 7.
- La connexion Steam : section 8.
- Les tickets, messages et e-mails : aussi longtemps que la conversation l'exige. Les tickets GitHub restent jusqu'à ce que vous ou nous les supprimions.
- Les noms de crédit des soutiens : dans chaque version à partir de là. Demandez, et nous retirerons le vôtre des versions futures ; les versions déjà publiées ne peuvent pas être modifiées.
- Les sauvegardes : Cloudflare garde un historique des bases de données de nos serveurs pendant 7 jours (sur notre offre gratuite, comme le dit la documentation de Cloudflare), donc ce que nous supprimons reste dans cet historique jusqu'à 7 jours après notre suppression.

Vos droits
Vous pouvez nous demander une copie des données que nous détenons sur vous ; de les corriger ; de les supprimer ; d'en suspendre l'utilisation le temps qu'une question à leur sujet soit réglée ; et vos données Bug Watch et votre nom d'utilisateur dans un fichier réutilisable. Vous pouvez retirer à tout moment votre consentement à Bug Watch en le décochant ; cela n'annule pas ce qui a été envoyé avant.
Comment : écrivez à sneadtristen6@gmail.com, ou envoyez à sneadtristen6 un message privé sur Discord. Indiquez-nous votre nom d'utilisateur, votre code de rapport si vous utilisez ou avez utilisé Bug Watch (les Réglages ne l'affichent que tant que Bug Watch est activé), et votre code RUSE Guard (les Réglages l'affichent, sous « Votre code RUSE Guard ») ; pour la connexion Steam, votre identifiant Steam. Nos serveurs ne demandent pas votre vrai nom : sans ces éléments, nous pourrions ne pas retrouver vos données. Si nous ne sommes pas sûrs qu'une demande est la vôtre, nous pouvons demander plus. Nous répondons dans un délai d'un mois, gratuitement ; si une demande est complexe, nous pouvons prendre jusqu'à deux mois de plus et vous dirons pourquoi.
Si vous cessez d'utiliser les applications, vous pouvez nous demander de supprimer vos enregistrements RUSE Guard, et nous le ferons. Si une triche a été confirmée sous votre nom d'utilisateur, nous ne gardons que ce signalement et la décision sur laquelle il repose : votre nom d'utilisateur, la partie, le verdict, sa date et la clé RUSE Guard avec laquelle le signalement est arrivé. Nous pouvons aussi garder ce dont a encore besoin une affaire de triche en cours de revue ou d'appel.
Réclamations : vous pouvez adresser une réclamation à l'autorité de protection des données de l'endroit où vous vivez ou travaillez, ou où vous pensez que le problème s'est produit ; en France, c'est la CNIL (cnil.fr), au Royaume-Uni l'ICO (ico.org.uk). Chacun peut d'abord nous écrire. Si vous êtes au Royaume-Uni, nous confirmerons la réception de votre réclamation dans les 30 jours.

VOTRE DROIT D'OPPOSITION
Vous pouvez vous opposer à tout moment, pour des raisons tenant à votre situation particulière, à l'utilisation de vos données pour RUSE Guard. Écrivez-nous. Si nous sommes d'accord, nous supprimons vos enregistrements RUSE Guard, à l'exception d'un signalement de triche et de sa décision (comme ci-dessus), et nous vous disons que RUSE Guard est obligatoire pour utiliser nos applications : le seul moyen de ne plus envoyer de nouveaux enregistrements est de ne pas les utiliser. Nous pouvons refuser quand nous avons des motifs impérieux qui l'emportent sur les vôtres, comme une affaire de triche encore en cours de revue ou d'appel.

Les autres joueurs
Aujourd'hui RUSE Guard n'envoie rien sur les autres joueurs de vos parties : ni noms ni replays. Une copie de triche ou de test ne dit aux jeux des autres joueurs qu'un court code de build. Si une version ultérieure envoie des enregistrements de partie ou des replays, qui peuvent contenir les noms en jeu d'autres joueurs, ce texte le dira d'abord. Cette notice est publique, donc les joueurs qui n'utilisent pas nos applications peuvent aussi la lire. Chacun peut nous demander ce que nous détenons sous son nom en jeu, et les droits ci-dessus sont aussi les siens.

Suivi
Les applications ne suivent pas ce que vous faites sur d'autres sites web ou applications, et elles ne contiennent ni réseau publicitaire ni autre traceur extérieur. Les applications ne sont pas des navigateurs web : elles ne lisent donc pas le signal « Do Not Track » d'un navigateur ; vos choix sont la case Bug Watch et le fait d'utiliser ou non la connexion Steam.

Sécurité
Les applications n'atteignent nos serveurs que par des connexions chiffrées, et n'installent une mise à jour que si elle porte notre signature (section 12). Elles fabriquent elles-mêmes l'adresse de la page de connexion de Steam. Notre serveur RUSE Guard ne dit qu'au Launcher d'un joueur signalé qu'il est signalé. Aucun système n'est parfaitement sûr : si quelque chose se produit qui met vos données en danger, nous le dirons sur notre page GitHub et notre Discord, et nous en informerons les autorités de protection des données là où la loi l'exige.

Ce qui reste sur votre PC
Les applications gardent leurs réglages et leurs fichiers de travail dans un dossier appelé RUSE Mod Platform, à l'intérieur du dossier AppData\\Local de votre utilisateur Windows :
- votre nom d'utilisateur et votre identifiant d'installation, votre clé RUSE Guard, vos choix, le laissez-passer Steam si vous vous êtes connecté, et les codes de déblocage ;
- la liste des plantages connus du jeu de Bug Watch, tant que Bug Watch est activé ;
- les comptages de Bug Watch pas encore envoyés, et les rapports en attente d'envoi ;
- les enregistrements RUSE Guard en attente d'envoi, et ceux que notre serveur a refusés (supprimés 30 jours après avoir été mis de côté) ;
- des journaux de ce que les applications ont fait (qui peuvent contenir des noms de dossiers) ;
- les données de navigateur propres à la fenêtre de l'application ;
- les fichiers téléchargés (le programme d'installation d'une mise à jour est supprimé au démarrage suivant de l'application après son installation).

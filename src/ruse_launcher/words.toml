[backup_verify_tip]
us = "Steam's own repair: it checks every file and downloads the ones that changed. No backup needed."
fr = "La réparation de Steam : il vérifie chaque fichier et retélécharge ceux qui ont changé. Aucune sauvegarde nécessaire."
ger = "Die Reparatur von Steam: Es prüft jede Datei und lädt die geänderten neu herunter. Keine Sicherung nötig."
ita = "La riparazione di Steam: controlla ogni file e riscarica quelli cambiati. Nessun backup necessario."
spa = "La reparación de Steam: comprueba cada archivo y vuelve a descargar los que cambiaron. No hace falta copia de seguridad."
pol = "Naprawa Steam: sprawdza każdy plik i pobiera ponownie te, które się zmieniły. Kopia zapasowa nie jest potrzebna."
ru = "Восстановление средствами Steam: он проверяет каждый файл и заново скачивает изменённые. Резервная копия не нужна."
cz = "Oprava přes Steam: zkontroluje každý soubor a znovu stáhne ty, které se změnily. Záloha není potřeba."
jpn = "Steam 自身の修復機能：すべてのファイルを確認し、変更されたものを再ダウンロードします。バックアップは不要です。"
sc = "Steam 自带的修复：检查每个文件并重新下载有变化的文件。不需要备份。"
fa = "تعمیر خود Steam: همهٔ فایل‌ها را بررسی می‌کند و آن‌هایی را که تغییر کرده‌اند دانلود می‌کند. پشتیبانی لازم نیست."

[backup_verify_opened]
us = "Steam is checking the game's files and downloads any that changed; Steam shows how far it is."
fr = "Steam vérifie les fichiers du jeu et retélécharge ceux qui ont changé ; Steam affiche sa progression."

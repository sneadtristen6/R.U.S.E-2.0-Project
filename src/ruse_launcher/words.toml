sc = "适用于以游戏文件（.dat 包）形式提供、需复制到游戏文件夹的旧模组：把它转换为可在库中与其他模组一起游玩的模组。"
fa = "برای ماد قدیمی‌ای که به شکل فایل‌های خود بازی (بسته‌های .dat) می‌آید تا در پوشهٔ بازی کپی شود: آن را به مادی تبدیل می‌کند که کتابخانه می‌تواند کنار مادهای دیگر اجرا کند."


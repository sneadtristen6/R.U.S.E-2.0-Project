cz = "Cheat nebo testovací nástroj: {why}. Upravená kopie s ním hraje zápasy pro více hráčů a kooperaci jen s hráči, kteří mají stejné mody, a každý jiný zápas opustí."
jpn = "チートまたはテスト用ツール：{why}。これを含む MOD 版コピーは、同じ MOD を入れたプレイヤーとだけマルチプレイと協力プレイができ、それ以外の対戦からは退出します。"

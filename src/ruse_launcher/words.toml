Aplikace jsou zdarma a dodávají se tak, jak jsou, bez jakékoli záruky (GPL v3, oddíly 15 a 16). Sestavují modifikované kopie hry a vaši nainstalovanou hru nechávají beze změny. Neodpovídáme za hru, váš účet Steam ani za žádnou ztrátu z používání aplikací.


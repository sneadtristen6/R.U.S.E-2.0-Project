cz = "Steam kontroluje soubory hry a znovu stahuje ty, které se změnily; průběh ukazuje Steam."
jpn = "Steam がゲームのファイルを確認し、変更されたものを再ダウンロードしています。進行状況は Steam に表示されます。"

- Wo es wirkt: RUSE Guard steckt in jeder gemoddeten Kopie, die die Apps bauen, und der Original-Modus des Launchers baut ebenfalls eine solche Kopie, ohne Mods (Abschnitt 10). Seine Sperre und seine Programmprüfung wirken nur in Mehrspieler- und Koop-Partien, und seine Partieeinträge täten es auch, sobald sie beginnen (unten). Sein Beobachter, ebenfalls in jeder gemoddeten Kopie, beobachtet Mehrspieler-, Koop- und Gefechtspartien gegen den Computer: Er kann auf deinem eigenen Bildschirm eine Meldung zeigen, wenn das Geld einer Seite auf einmal um 400 oder mehr springt oder wenn eine Einheit durch einen Spawn-Befehl entsteht. In einer Mehrspielerpartie kann jeder Spieler es auf seinem Bildschirm sehen. Der Beobachter ändert nichts an der Partie und sendet nichts. Nur der Launcher sendet etwas für RUSE Guard; das Studio nie, und sein „Im Spiel testen“ führt keine Programmprüfung aus.
- Die Liste: Die Liste bekannter Cheat-Tools von RUSE Guard wird in der App mitgeliefert, als einfache Datei, die du lesen kannst, und ändert sich nur mit einem App-Update. Dafür wird nichts heruntergeladen.
- Die Programmprüfung: In einer Mehrspieler- oder Koop-Partie, die vom Launcher aus gestartet wurde, sieht RUSE Guard alle 30 Sekunden die Namen der Programme an, die auf deinem PC laufen, und behält nur Namen, die auf seiner Liste stehen. Um zu wissen, wann so eine Partie läuft, liest der Launcher die eigene Fehlerausgabe des Spiels, während es läuft: Er behält nur die kurzen Zeilen von RUSE Guard, die sagen, dass eine Partie läuft oder zu Ende ist, und verwirft jede andere Zeile, sobald er sie gelesen hat, ohne sie je zu behalten oder zu senden (diese Ausgabe kann auch Zeilen von Steam enthalten, eine davon mit der Nummer deines Steam-Kontos). Sagt das Spiel nicht, dass eine Partie zu Ende ist, hört die Prüfung zwei Minuten, nachdem das Spiel zuletzt gesagt hat, dass sie läuft, auf. Wenn während einer Partie ein Programm von der Liste lief, sendet der Launcher nach dem Spiel unserem Server einen kurzen Eintrag: deinen Benutzernamen und deinen RUSE-Guard-Schlüssel, wann die Partie begann und endete, ob es Mehrspieler oder Koop war, und die Namen der gefundenen Programme von der Liste. Sonst steht nichts darin: keine Wiederholung, keine Dateien und nichts weiter über die Partie. Lief kein Programm von der Liste, wird nichts gesendet.
- Der Beitrittscode: Für eine gemoddete Kopie, deren Mods verändern, wie das Spiel spielt, zeigt der Launcher einen Beitrittscode. Er steht für die Spielversion der Kopie, ihre Mods mit ihren Versionen und das, was sie am Spielverlauf ändern. Du vergleichst Beitrittscodes mit den Leuten, mit denen du spielst. Wir erhalten sie heute nicht; ein Partieeintrag (unten) würde sie enthalten.
- Mit Cheat- oder Testwerkzeug gebaute Kopien: Eine solche Kopie spielt Mehrspieler und Koop nur mit Spielern, deren Build derselbe ist (dieselbe Spielversion und dieselben Mods, in denselben Versionen). Etwa eine Sekunde nach Beginn jeder solchen Partie teilt sie dem Spiel jedes Spielers einen kurzen Code für ihren Build mit (ihren Build-Code), gemacht aus der Version des Spiels, den Mods mit ihren Versionen in ihrer Reihenfolge und dem, was sie am Spielverlauf ändern. Er enthält weder Namen noch Konto. Hat jeder Spieler denselben Build, ist die Partie darauf ausgelegt weiterzugehen; niemand hat so eine Partie bisher zu zweit gespielt. Wenn nicht, gibt sie die Partie wenige Sekunden nach Beginn auf.
  In einer Mehrspielerpartie ohne Wertung stoppt sie danach das Spiel absichtlich auf dem Endbildschirm dieser Partie: Das Spiel stürzt ab, zurück zum Desktop. Der eigene Absturzmelder des Spiels kann seinen Bericht dann an den Hersteller des Spiels senden, und dieser Bericht enthält RUSE Guards Zeile, dass eine Cheat-Kopie gestoppt wurde. In Koop- und gewerteten Partien gibt sie die Partie nur auf. Wenn der Launcher das Spiel gestartet hat und noch offen ist, wenn das Spiel stoppt, nimmt er aus dem Absturzbericht des Spiels auf deinem PC nur RUSE Guards Zeile und sendet unserem Server eine kurze Notiz, dass eine Cheat-Kopie gestoppt wurde, unter deinem Benutzernamen und deinem RUSE-Guard-Schlüssel, mit der Zeit, zu der der Absturzbericht geschrieben wurde, und der Zeit, zu der die Notiz erstellt wurde. Die Zeile nennt nur die Art der Partie und die Nummer deiner Seite darin; Steam-IDs, lange Zahlen und Pfade werden daraus entfernt. Unsere Apps senden den Absturzbericht selbst nie. Die Notiz eröffnet keine Prüfung und entscheidet nichts; sie wird für sneadtristen6 aufgelistet, damit er sie sieht. Es wird keine Notiz gesendet, wenn der Launcher geschlossen wurde, bevor das Spiel stoppte, oder wenn das Spiel vom Studio oder von Hand gestartet wurde. Unter Linux und auf dem Steam Deck ist noch nicht bekannt, ob die Notiz gesendet wird.
  Ehrliche Kopien werden nie gestoppt.
- Dein RUSE-Guard-Schlüssel: Wenn der Launcher auf deinem PC zum ersten Mal einen RUSE-Guard-Eintrag macht, erzeugt er dort einen zufälligen Schlüssel. Ein aus diesem Schlüssel gemachter Code (seine öffentliche Hälfte) geht mit jedem Eintrag mit, damit wir deine Einträge von denen von jemandem mit demselben Benutzernamen unterscheiden und prüfen können, dass sie nicht verändert wurden. Er sagt sonst nichts über dich. Die Einstellungen zeigen einen kurzen daraus gemachten Code, „Ihr RUSE-Guard-Code“: Schick ihn mit einer Datenschutzanfrage mit, und wir können deine eigenen RUSE-Guard-Einträge finden. Dafür wird nichts weiter gesendet.
- Noch nicht aktiv: Partieeinträge. Sie brauchen eine Aufzeichnung der Partie, die das Spiel heute nicht schreiben kann. Bevor sie beginnen, aktualisieren wir diesen Text, und die Apps zeigen ihn dir erneut. Wenn sie beginnen, enthält ein Partieeintrag: deinen Benutzernamen und RUSE-Guard-Schlüssel; deine Seite; die Codes deiner Kopie; Prüfungen der Spieldateien, die deine Kopie geändert hat, und regelmäßige Prüfungen, dass das Spiel jedes Spielers gleich bleibt; deine Mods mit ihren Prüfungen; welche Skriptbefehle deine Mods an Tasten binden (nie, was du drückst); bei der Testkopie eines Entwicklers den Schlüssel des Entwicklers; die Namen gefundener laufender Cheat-Tools von der Liste; wann die Partie begann und endete; und die neueste Wiederholung, die während oder kurz nach der Partie auf deinem PC gespeichert wurde, mit ihrem Dateinamen. Eine Wiederholung enthält jeden Befehl, den jeder Spieler in der Partie gegeben hat, und ihr Dateiname und Inhalt können deine und die Spielnamen anderer Spieler enthalten.
- Was es nie tut: Es sammelt nie deinen Bildschirm oder deine Tastatureingaben, schaut nie in andere Programme hinein, während sie laufen, und sendet uns nie deine Dateien, abgesehen von der Wiederholung, die ein Partieeintrag enthalten würde. Aus den Absturzberichten des Spiels liest es nur seine eigene Zeile über eine Cheat-Kopie, die es gestoppt hat (oben), auf deinem PC.
- Testkopien von Entwicklern: Die Apps sind so gebaut, dass sie die Testkopie eines Entwicklers mit einem besonderen Schlüssel von uns in eine Partie lassen, der einzige Weg an der Regel für Cheat-Kopien vorbei. Noch funktioniert keiner: Die Apps können so einen Schlüssel heute nicht prüfen.
- Entscheidungen über dich: keine automatischen Sperren. Keine Entscheidung über Betrug wird allein von einer Maschine getroffen: sneadtristen6 sieht sich die Beweise an, und die Wiederholung, wenn es eine gibt, und entscheidet. Claude von Anthropic, ein KI-Assistent, hilft ihm, die Einträge von RUSE Guard zu lesen, nach den eigenen Bedingungen von Anthropic; die Entscheidungen sind seine. Ein Eintrag, der ein Cheat-Tool von der Liste nennt, eröffnet für ihn eine Prüfung, die nichts entscheidet, bis er es tut. Du kannst innerhalb von 30 Tagen nach einer Entscheidung Einspruch einlegen (Abschnitt 17); sneadtristen6 ist die einzige Person, die Fälle prüft, also entscheidet er auch selbst über Einsprüche. Die einzige automatische Regel ist die Regel für Cheat-Kopien oben. Sie folgt aus der Kopie, die du gebaut hast, und sie berührt nie dein Steam-Konto oder dein installiertes Spiel.
- Was eine Entscheidung heute bedeutet: Wird Betrug bestätigt, führen wir diese Entscheidung unter deinem Benutzernamen auf unserer Liste markierter Spieler und nutzen sie, wenn wir spätere Partien ansehen. Weil zwei Spieler einen Benutzernamen teilen können, sehen wir uns auch an, mit welchem RUSE-Guard-Schlüssel die Einträge kamen. Unser RUSE-Guard-Server führt diese Liste, jeden markierten Benutzernamen mit dem RUSE-Guard-Schlüssel, mit dem seine Einträge zuerst kamen, und sagt nur dem eigenen Launcher dieses Spielers, dass er markiert ist. Die Apps handeln heute nicht nach einer Markierung. Wenn eine spätere Version es tut, zum Beispiel um die gemoddeten Kopien eines markierten Spielers über R.U.S.E. 2.0 aus dem Mehrspielermodus herauszuhalten, sagt dieser Text es vorher. Wird ein Einspruch stattgegeben, wird die Entscheidung als aufgehoben markiert, und der Benutzername kommt von der Liste.
- Wie lange Einträge aufbewahrt werden, und deine Rechte: Abschnitt 11.

7. Bug Watch: hilf uns, Fehler zu finden und zu beheben (freiwillig, empfohlen)
Warum: damit das Studio und der Launcher besser funktionieren und Abstürze früher behoben werden: Statt darauf zu warten, dass jemand einen Absturz meldet, sehen wir ihn und was dazu geführt hat.
Auf welcher Grundlage: nur mit deinem OK (deiner Einwilligung, Abschnitt 11). Es ist aus, bis du das Häkchen setzt. Deinen Benutzernamen zu speichern oder zu ändern schaltet es nie an oder aus. Das Häkchen ändert nichts anderes in den Apps, außer dem, was der Launcher dir nach einem Spielabsturz sagt (unten). Wenn die Apps diese Bedingungen nach einer Änderung erneut zeigen: Ist Bug Watch an, fragt sein Kästchen „Bug Watch anlassen?“, mit Häkchen; lass das Häkchen stehen, um es anzulassen, oder nimm es weg, um es auszuschalten. Ist es aus, kommt das Bug-Watch-Kästchen wieder, ohne Häkchen.
Solange es an ist, senden das Studio und der Launcher unserem Server:
- einmal am Tag die Zählungen für jeden Tag, der zu Ende gegangen ist:
  - die App und ihre Version; den Tag; ob du Windows 10 oder 11 benutzt; die Sprache der App; die Version des Spiels; ob RUSE Guard eingebaut ist; welche Version dieser Bedingungen du akzeptiert hast;
  - wie oft jeder Teil der App benutzt wurde und wie lange Dinge gedauert haben; was schiefging und wo (nur in unserem eigenen Code; wenn das Skript eines Studio-Bildschirms fehlschlägt, der Name des Bildschirms und die Art des Fehlers, nie sein Text, seine Datei oder seine Zeile); für jede lange Aufgabe, etwa einen Mod-Bau, wie oft sie fertig wurde oder fehlschlug und wie viele Bauvorgänge Fehler in den Mods fanden;
  - eine Liste der Fehlschläge dieses Tages, höchstens 20, jeder mit seinem Code (welche Stelle in unserem Code), wie weit ein „Spielen“ oder ein „Im Spiel testen“ kam, die Form des Mod-Satzes (wie viele Mods aus unserer Liste, Mod-Ordner und Mod-Dateien von dir selbst, als Zahlen), und daneben nur Zahlen, die niemanden benennen: die Windows-Fehlernummer (etwa Datenträger voll), die Antwort des Webservers (etwa 404), die Ausstiegsnummer des Spiels, eine Zahl und ein zweiter Code;
  - wie viele Updates angeboten, installiert wurden oder fehlschlugen; wie oft die App abgestürzt ist; welche Prüfungen der Fehlerbehebung ein Problem fanden;
  - welche Mods aus unserer Liste du an hattest; wie viele Minuten du insgesamt gespielt hast und wie viele mit jedem dieser Mods;
  - wie viele eigene Mods du hattest und welche Arten von Dingen sie enthalten, etwa Einheiten, Karten, Missionen oder Skripte (nach Art gezählt, nie benannt und nie ihre Worte, Pfade oder Dateien);
- sofort, wenn eine App abstürzt: die Art des Fehlers und wo in unserem Code;
- sofort, nachdem ein von der App gestartetes Spiel abgestürzt ist, technische Details dazu, wo und wie es abgestürzt ist:
  - den Fehlercode des Spiels; den Namen der Datei, in der es anhielt (das kann ein Teil von Windows sein, ein Treiber oder ein anderes Programm, das in das Spiel geladen wurde, etwa ein Overlay), wo darin das Spiel anhielt und bis zu 16 Stellen im Spiel, die dorthin führten;
  - bei einem Speicherfehler, was das Spiel versuchte (lesen, schreiben oder ausführen) und die Stelle im Speicher;
  - bei einem Skriptfehler den eigenen Fehlertext des Spiels, mit auf Dateinamen gekürzten Laufwerkspfaden, dem Namen deines Benutzerordners verborgen (die Namen von Ordnern darin können bleiben) und herausgenommenen Steam-Kontonummern und anderen langen Zahlen (die eigenen Skriptnamen des Spiels bleiben); wie viele frühere Fehler das Spiel übersprungen hatte; und die Karte (eine der eigenen Karten des Spiels mit ihrem Namen, die Karte eines Mods nur als „die Karte eines Mods“);
  - die Einheit, die das Spiel gerade machte, wenn die Apps sie aus dem Absturzbericht des Spiels lesen können (eine der eigenen Einheiten des Spiels mit ihrer Nummer, die Einheit eines Mods nur als „die Einheit eines Mods“);
  - welche Mods an waren, welche Arten von Dingen deine eigenen Mods enthalten (nach Art gezählt) und welche Version dieser Bedingungen du akzeptiert hast.
Bug Watch benutzt nur die eigenen Absturzberichte des Spiels. Vom Bericht eines anderen Programms liest es nur die Namen der Dateien, die er auflistet, um zu erkennen, dass er nicht vom Spiel ist; davon wird nichts gesendet.
Jede Sendung enthält deinen Benutzernamen und deine Installations-ID, einen zufälligen Code, der auf deinem PC gemacht wurde, als du zum ersten Mal deinen Benutzernamen gewählt hast, egal ob du Bug Watch das Häkchen gibst oder nicht. Dein Meldecode, den die Einstellungen zeigen, solange Bug Watch an ist, sind die ersten 8 Zeichen deiner Installations-ID.
Unsere Apps senden nie deine Dateien oder die Absturzberichtsdateien des Spiels selbst, und Bug Watch sendet keine Steam-Kontonummer. (Der eigene Absturzmelder des Spiels kann seinen eigenen Bericht an den Hersteller des Spiels senden: Abschnitt 3.) Der Fehlertext des Spiels kann Namen aus dem Spiel oder aus den Skripten eines Mods enthalten. Bitte nimm nicht deinen echten Namen als Benutzernamen (Abschnitt 9).
Bekannte Abstürze: Wenn Bug Watch an ist und das Spiel auf eine Weise abstürzt, die wir kennen, sagt dir der Launcher in deiner Sprache, welche Einheit das Spiel gerade machte und warum. Diese Erklärung wird nur dir gezeigt, nie gesendet; der Bericht von Bug Watch enthält die Einheit nur wie oben aufgeführt (eine Nummer oder „die Einheit eines Mods“). Um diese Abstürze zu kennen, laden die Apps unsere Liste davon von unserem Bug-Watch-Server herunter, wenn ein Spiel startet, es sei denn, die Liste auf deinem PC ist weniger als einen Tag alt, und noch einmal bei einem Absturz, wenn es keine brauchbare Liste gibt. Sie laden sie nur herunter, solange Bug Watch an ist, behalten sie auf deinem PC, benutzen sie nur, wenn sie unsere Signatur trägt, und prüfen deinen Absturzbericht auf deinem PC gegen sie. Der Download enthält nichts über dich. Ohne die Liste (zum Beispiel beim ersten Mal oder ohne Internet) sagt dir der Launcher trotzdem, dass das Spiel abgestürzt ist, aber nicht die Einheit oder den Grund. Wenn du das Häkchen bei Bug Watch wegnimmst, wird die Liste von deinem PC gelöscht.
Mit Bug Watch an oder aus: Wenn ein vom Launcher gestartetes Spiel abstürzt, zeigt dir der Launcher einen kurzen Absturzcode, der auf deinem PC daraus gemacht wird, wo das Spiel anhielt. Er wird nirgendwohin gesendet. Eine Schaltfläche „Code kopieren“ kopiert ihn. Wenn du Hilfe möchtest, schick den Code und einen Screenshot der Meldung an XUL auf Discord (XUL6x3) oder auf GitHub, und wir schlagen ihn in unserer eigenen Liste nach. Der Code sagt nur, wo das Spiel anhielt.
Die Einstellungen zeigen dir die heutigen Zählungen Wort für Wort, so wie sie gesendet würden, und die Namen der wartenden Berichte. Berichte, die nicht gesendet werden können, warten bis zu 30 Tage auf deinem PC und werden dann verworfen. Während ein Spiel läuft, das die App gestartet hat, behält Bug Watch außerdem eine kleine Notiz darüber auf deinem PC, damit die App beim nächsten Start erkennen kann, ob das Spiel abgestürzt ist: wann es gestartet und zuletzt laufend gesehen wurde, seine Mods (unsere mit Name und Version, andere nur als Anzahl) und wo die Kopie und das Spiel installiert sind (ein Windows-Ordner kann deinen Windows-Benutzernamen enthalten). Sie wird nie gesendet und nach 30 Tagen gelöscht, oder sofort, wenn du Bug Watch abwählst.
Wer es sieht: unsere Entwickler. Es wird für uns von Cloudflare auf unserem Bug-Watch-Server gespeichert. Wenn es eingeschaltet ist, legt unser Server außerdem Notizen zu den Problemen, die wir verfolgen, in einem privaten GitHub-Repository ab, einem Bereich auf GitHub, den nur unsere Entwickler öffnen können. Die Notizen enthalten nie einen Benutzernamen oder einen Meldecode. Unsere Entwickler benutzen außerdem Claude von Anthropic, einen KI-Assistenten, um einige Bug-Watch-Absturzberichte zu lesen, nach den eigenen Bedingungen von Anthropic.
Wie lange: Jeder Bericht wird bei der täglichen Bereinigung von unserem Server gelöscht, nachdem er 7 Tage dort war, also 7 bis 8 Tage nach seinem Eingang. Unsere Entwickler können den Bericht eines sehr schweren Absturzes markieren, um ihn zu behalten, während sie diesen Absturz beheben; ein markierter Bericht bleibt, bis sie die Markierung entfernen, an dem Tag, an dem dieser Absturz behoben ist, und geht dann bei der nächsten täglichen Bereinigung. Was danach bleibt, ohne Benutzernamen, Installations-ID oder Meldecode darin: Tagessummen für jede App-Version (etwa „12 Mod-Bauvorgänge fehlgeschlagen in Version 0.9.9 an diesem Tag“) und der Tag, an dem jede Version und jede Art von Fehler zuerst gesehen wurde, ohne Zeitlimit; und die Notizen unseres Servers zu den Problemen, die er findet (welcher Teil einer App, welcher Mod aus unserer Liste, wo ein Absturz geschah und wie oft), bis 3 Tage nachdem wir dieses Problem schließen. In den ersten 7 Tagen sind an einem Tag, an dem nur eine Person eine Version benutzt hat, ihre Summen die Zählungen dieser einen Person; danach wird eine Version oder ein Mod aus unserer Liste, die an diesem Tag weniger als 3 Installationen benutzt haben, nur noch als „(other)“ aufbewahrt. Die Notizen auf GitHub bleiben, bis wir sie löschen. Cloudflare führt einen Verlauf unserer Datenbanken für 7 Tage, was wir löschen, bleibt also bis zu 7 weitere Tage in diesem Verlauf. Kopien auf dem Computer von sneadtristen6: Abschnitt 11, „Wo es aufbewahrt wird“.
Nimm das Häkchen jederzeit in den Einstellungen weg (oder im Bug-Watch-Kästchen, wenn die Apps diese Bedingungen zeigen). Von da an wird nichts mehr gezählt oder gesendet, und die Apps löschen die Zählungen von Bug Watch und die wartenden Berichte. Dein Benutzername und deine Installations-ID bleiben auf deinem PC, weil RUSE Guard deinen Benutzernamen verwendet. Nichts, was vor dem Wegnehmen des Häkchens gemacht wurde, wird später gesendet, auch wenn du es wieder setzt. Das Wegnehmen sagt unserem Server nichts: Was ihn schon erreicht hat, wird wie oben gelöscht. Damit es früher gelöscht wird, schick uns per E-Mail deinen Meldecode (die Einstellungen zeigen ihn nur, solange Bug Watch an ist, notier ihn also, bevor du das Häkchen wegnimmst) oder deinen Benutzernamen, wenn du den Code nicht hast: Wir finden damit die Berichte deiner Installation und löschen sie. Die Summen und Notizen oben bleiben. Das Wegnehmen des Häkchens macht nicht rückgängig, was vorher gesendet wurde.

8. Über Steam anmelden (freiwillig)
Warum: um zu bestätigen, dass du R.U.S.E. besitzt, für Online-Spiele, RUSE Guard und Inhalts-Downloads später. Bisher braucht es nichts.
Auf welcher Grundlage: Du bittest darum (Abschnitt 11). Die Apps können es beim Start anbieten, und die Einstellungen des Launchers öffnen es jederzeit.
- Du meldest dich auf der eigenen Seite von Steam in deinem Browser an, unter einer Adresse, die die App selbst macht. Wir sehen nie dein Passwort.
- Steam teilt dann unserem Server deine Steam-ID mit. Unser Server fragt Steam, ob dieses Konto R.U.S.E. besitzt (das funktioniert nur, wenn deine Steam-Spieldetails öffentlich sind), nutzt die Antwort und speichert die ID nicht. Wenn du es besitzt, gibt unser Server deinem PC einen Pass (einen Code, der zeigt, dass die Prüfung bestanden wurde), 30 Tage gültig.
- Was unser Server behält: einen einseitigen Code, der aus deiner Steam-ID mit einem Geheimnis von uns gemacht wird, und wann dein Pass ausgestellt wurde und wann er abläuft, bis 30 Tage nachdem dein Pass abgelaufen ist. Der kurzlebige Code, mit dem deine App den Pass abholt (der Anmeldecode), wird nur in verschlüsselter Form aufbewahrt; er läuft nach 10 Minuten ab und wird gelöscht, wenn die App ihn abholt, oder etwa innerhalb einer Stunde nach seinem Ablauf. Die einmaligen Anmeldenummern von Steam verhindern, dass eine Anmeldung wiederholt wird; sie werden einen Tag aufbewahrt, auch wenn eine Anmeldung fehlschlägt, und dann innerhalb etwa einer Stunde gelöscht. Unser Code speichert nie deine IP-Adresse.
- Wo: Die Datenbanken unserer Server werden von Cloudflare im östlichen Nordamerika gespeichert.
- Was dein PC behält: den Pass, in den Einstellungen der Apps, bis du dich in den Einstellungen abmeldest, was ihn löscht. Auch ein abgelaufener Pass bleibt bis dahin.
- Wenn deine Steam-Spieldetails privat sind, kann Steam es uns nicht sagen. Stell die Spieldetails für eine Minute auf Öffentlich und versuch es dann noch einmal.
- R.U.S.E. 2.0 ist nicht mit Valve verbunden und wird von Valve nicht empfohlen. Valve behandelt deine Anmeldung nach seiner eigenen Datenschutzrichtlinie.

9. Dein Benutzername
Warum: damit wir wissen, wessen Absturzbericht oder Partieeintrag es ist, und dieser Person helfen können. Jeder wählt beim ersten Start einen, weil RUSE Guard erforderlich ist. Ein # und vier zufällige Ziffern werden angehängt, etwa Nick#4821. Zwei Spieler können trotzdem denselben haben, deshalb achten wir auch auf deinen RUSE-Guard-Schlüssel oder Meldecode. Bitte nimm weder deinen echten Namen noch deinen Steam-Namen noch sonst etwas, das dich identifiziert. Er wird nur mit deinen RUSE-Guard-Einträgen und, wenn Bug Watch an ist, deinen Bug-Watch-Berichten gesendet. Ein Benutzername gilt für beide Apps. Du kannst ihn in den Einstellungen ändern; ihn zu ändern schaltet Bug Watch nie an oder aus. Bereits gesendete Einträge behalten den alten, bis sie gelöscht werden. Damit dein Benutzername und die Daten darunter gelöscht werden, schick uns eine E-Mail.

10. Der Titel und das Intro von R.U.S.E. 2.0 (freiwillig)
Kopien, die der Launcher und das Studio bauen, zeigen den eigenen Titel des Spiels und das Logo-Video von Eugen. Wenn du das Kästchen auf dem ersten Bildschirm anhakst oder in den Einstellungen unter Der Titel des Spiels „Den goldenen Titel und das Intro von R.U.S.E. 2.0 verwenden“, zeigen diese Kopien R.U.S.E. 2.0 in Gold im Hauptmenü und auf den Ladebildschirmen, und unser Intro läuft beim Spielstart anstelle des Logo-Videos von Eugen. Der goldene Titel wird auf deinem PC aus den Dateien deines eigenen Spiels gemacht, über einem Schlachtszenenbild, das mit den Apps kommt. Das Intro benutzt außerdem einen Motorsound, der mit den Apps kommt. Es ändert nur deine gemoddete Kopie, nie dein installiertes Spiel, und du kannst es jederzeit in den Einstellungen ändern. Im Launcher baut Original eine eigene Kopie ohne Mods, mit RUSE Guard darin wie jede Kopie und mit dem Titel, den du gewählt hast.

11. Datenschutzerklärung
Diese Erklärung ist Teil dieser Vereinbarung. Derselbe Text ist öffentlich auf unserer GitHub-Seite, unter https://github.com/sneadtristen6/R.U.S.E-2.0-Project/blob/main/PRIVACY.md, damit ihn jeder lesen kann, auch Spieler, die unsere Apps nicht nutzen. Sie ist am 26. November 2026 in Kraft getreten.

Wer für deine Daten verantwortlich ist
R.U.S.E. 2.0 wird von einer Person betrieben, sneadtristen6, der in den Vereinigten Staaten lebt. Er entscheidet, was die Apps und unsere Server mit deinen Daten tun, also ist er nach dem Datenschutzrecht (in der EU und im Vereinigten Königreich die DSGVO) der Verantwortliche dafür: der „Controller“. E-Mail für Datenschutzanfragen: sneadtristen6@gmail.com. Du kannst ihn auch auf unserem Discord oder auf GitHub erreichen; für alles Persönliche nutze E-Mail oder eine private Nachricht, weil GitHub-Tickets und Discord-Kanäle von anderen gelesen werden können. Er allein prüft die Einträge von RUSE Guard und entscheidet darüber. Wir haben keinen Vertreter in der EU oder im Vereinigten Königreich.

Was wir verwenden, warum und auf welcher Grundlage
- RUSE Guard (Abschnitt 6): um Mehrspieler- und Koop-Partien fair zu halten. Grundlage: unser berechtigtes Interesse und das anderer Spieler an fairen Partien (DSGVO Artikel 6 Absatz 1 Buchstabe f), nicht deine Einwilligung.
- Bug Watch (Abschnitt 7), nur wenn du das Häkchen setzt: um Abstürze und Fehler zu finden und zu beheben. Grundlage: deine Einwilligung (Artikel 6 Absatz 1 Buchstabe a).
- Die Steam-Anmeldung (Abschnitt 8), nur wenn du sie nutzt: um zu bestätigen, dass du R.U.S.E. besitzt. Grundlage: Du hast darum gebeten (Artikel 6 Absatz 1 Buchstabe b).
- Ordnercodes und Freischalt-Tickets (Abschnitt 5): um deine Kopie freizuschalten. Grundlage: Du hast darum gebeten (Artikel 6 Absatz 1 Buchstabe b).
- Dein Benutzername (Abschnitt 9): um zu wissen, wessen Eintrag oder Bericht es ist. Grundlage: dieselbe wie bei dem RUSE-Guard-Eintrag oder Bug-Watch-Bericht, mit dem er gesendet wird.
- Update-Prüfungen und Downloads (Abschnitt 12): um die Apps funktionsfähig und sicher zu halten und dir zu geben, worum du bittest. Grundlage: unser berechtigtes Interesse (Artikel 6 Absatz 1 Buchstabe f) und deine Bitte, wenn du einen Knopf drückst.
- Nachrichten, Tickets, E-Mails und Einsprüche, die du uns schickst: um dir zu antworten. Grundlage: unser berechtigtes Interesse, dir zu antworten (Artikel 6 Absatz 1 Buchstabe f).
- Patreon-Unterstützer: Patreon wickelt deine Zahlung nach seiner eigenen Datenschutzrichtlinie ab. Wir sehen nur, was Patreon nach dieser Richtlinie mit Creators teilt, und veröffentlichen einen Namen für die Danksagung nur, wenn du ihn mit deiner Erlaubnis schickst. Grundlage: um dir das Dankeschön zu geben, das du gewählt hast (Artikel 6 Absatz 1 Buchstabe b); ein öffentlicher Name nur mit deiner Erlaubnis (Artikel 6 Absatz 1 Buchstabe a).
- Deine IP-Adresse: Jeder Server, mit dem sich dein PC verbindet, sieht sie. Der eigene Code unserer Server speichert sie nie; Cloudflare, das unsere Server betreibt, verarbeitet sie, um jede Verbindung zu liefern und zu schützen, nach seiner eigenen Datenschutzrichtlinie, und sein Dashboard zeigt uns, wie viele Anfragen aus jedem Land und jeder Stadt kamen. Grundlage: unser berechtigtes Interesse, unsere Server zu betreiben und zu schützen (Artikel 6 Absatz 1 Buchstabe f).
Kein Gesetz verlangt, dass du uns etwas gibst. Die Apps, wie wir sie veröffentlichen, brauchen einen Benutzernamen und enthalten RUSE Guard; Bug Watch und die Steam-Anmeldung sind deine Wahl. Keine Entscheidung über Betrug wird allein von einer Maschine getroffen. Die einzige automatische Regel, die Regel für Cheat-Kopien in Abschnitt 6, wirkt auf eine Kopie, die mit Cheat- oder Testwerkzeugen gebaut wurde, nie auf dein Steam-Konto.

Wer es sonst noch bekommt
- Cloudflare, Inc. (USA), das unsere drei Server betreibt und ihre Datenbanken für uns speichert, nach seinen Auftragsverarbeitungsbedingungen.
- Valve, für die Steam-Anmeldung und die Besitzprüfung (Abschnitt 8).
- GitHub (Microsoft), das unsere Dateien, Tickets und Diskussionen aufbewahrt und, wenn es eingeschaltet ist, das private Repository, in dem der Server von Bug Watch seine Notizen ablegt. Es erhält auch, was dein Browser sendet, wenn du eine Seite öffnest, die die Apps ausgefüllt haben (Abschnitt 12).
- Google, das die E-Mail-Adresse betreibt, an die du schreibst.
- Discord, das die Nachrichten befördert, die du uns dort schickst.
- Anthropic, dessen KI-Assistent Claude uns hilft, einige Bug-Watch-Absturzberichte und RUSE-Guard-Einträge zu lesen, nach den eigenen Bedingungen von Anthropic.
- Die Spiele anderer Spieler: der Build-Code einer Cheat- oder Testkopie (Abschnitt 6).
- Die Öffentlichkeit: alles, was du auf GitHub oder in den öffentlichen Kanälen von Discord postest.
- Jeder, dem wir es von Rechts wegen geben müssen.
Abseits von uns: Wenn das Spiel abstürzt, kann der eigene Absturzmelder des Spiels seinen Bericht an den Hersteller des Spiels senden (Abschnitt 3). Das gehört zum Spiel, nicht zu uns.
Wir verkaufen oder vermieten deine Daten nicht, und wir nutzen oder teilen sie nicht für Werbung. Die Apps enthalten keine Werbung und keine fremden Analyse- oder Tracking-Dienste; Bug Watch ist unser eigenes und deine Wahl.

Wo es aufbewahrt wird
Die Datenbanken unserer Server werden von Cloudflare im östlichen Nordamerika gespeichert; das Netzwerk von Cloudflare liefert sie aus Rechenzentren auf der ganzen Welt aus. RUSE-Guard-Einträge werden auf dem eigenen Computer von sneadtristen6 in den Vereinigten Staaten zur Prüfung gesammelt. Wenn wir einem Problem nachgehen, können Kopien von Bug-Watch-Berichten auch auf seinem Computer liegen: Eine Kopie, die zu einem Fehler gehört, den wir beheben, wird gelöscht, sobald dieser Fehler behoben ist, und eine Kopie, die keinen Fehler zeigt, wird nach 7 Tagen gelöscht. sneadtristen6 ist in den Vereinigten Staaten, und Cloudflare ist ein US-Unternehmen, also werden deine Daten in den Vereinigten Staaten und überall dort verarbeitet, wo Cloudflare arbeitet.

Wie lange wir es aufbewahren
- RUSE-Guard-Einträge: Unser RUSE-Guard-Server behält jeden Eintrag, bis unser Prüfcomputer ihn abholt, und nie länger als 3 Tage nach seinem Eingang: Dann wird er gelöscht, abgeholt oder nicht. Auf dem Prüfcomputer werden die Einträge einer Partie etwa 48 Stunden nach dem Eingang des letzten gelöscht (bei seiner nächsten Bereinigung, die immer läuft, wenn er Einträge abholt), es sei denn, eine Prüfung der Partie ist offen. Eine Partie in Prüfung wird behalten, bis sie entschieden ist; wird sie abgewiesen, wird sie dann gelöscht. Wird Betrug bestätigt, hast du 30 Tage ab der Entscheidung, Einspruch einzulegen: Die Beweise werden diese 30 Tage behalten, und wenn du Einspruch einlegst, bis dein Einspruch entschieden ist. Danach werden die Beweise gelöscht, und nur die Entscheidung bleibt, so lange sie gilt. Wird ein Einspruch stattgegeben, wird die Entscheidung als aufgehoben markiert und nie gegen dich verwendet; bitte uns, und wir löschen sie auch. Die Stopp-Notiz einer Cheat-Kopie eröffnet keine Prüfung: Sie wird für sneadtristen6 aufgelistet, damit er sie sieht, und wie jeder Eintrag gelöscht.
- Die Liste des Prüfcomputers mit Benutzernamen und RUSE-Guard-Schlüsseln, mit dem Zeitpunkt, wann jeder zuerst gesehen wurde: bisher ohne Zeitlimit aufbewahrt; schick uns eine E-Mail, und wir löschen deinen.
- RUSE-Guard-Einträge auf deinem PC: Einer, der auf das Senden wartet, bleibt, bis er gesendet ist; einer, den unser Server abgelehnt hat, wird 30 Tage nach dem Beiseitelegen gelöscht.
- Bug Watch: Abschnitt 7.
- Die Steam-Anmeldung: Abschnitt 8.
- Tickets, Nachrichten und E-Mails: so lange, wie das Gespräch es braucht. GitHub-Tickets bleiben, bis du oder wir sie löschen.
- Namen von Unterstützern für die Danksagung: in jedem Release von da an. Bitte uns, und wir nehmen deinen aus künftigen Releases heraus; bereits veröffentlichte Releases lassen sich nicht ändern.
- Sicherungen: Cloudflare führt einen Verlauf der Datenbanken unserer Server für 7 Tage (in unserem kostenlosen Tarif, wie die eigene Dokumentation von Cloudflare sagt), was wir löschen, bleibt also bis zu 7 Tage nach dem Löschen in diesem Verlauf.

Deine Rechte
Du kannst von uns eine Kopie der Daten verlangen, die wir über dich haben; dass wir sie berichtigen; dass wir sie löschen; dass wir sie nicht weiter verwenden, solange eine Frage dazu geklärt wird; und deine Bug-Watch-Daten und deinen Benutzernamen in einer Datei, die du weiterverwenden kannst. Du kannst deine Bug-Watch-Einwilligung jederzeit widerrufen, indem du das Häkchen wegnimmst; das macht nicht rückgängig, was vorher gesendet wurde.
Wie: Schreib an sneadtristen6@gmail.com oder schick sneadtristen6 eine private Nachricht auf Discord. Nenn uns deinen Benutzernamen, deinen Meldecode, wenn du Bug Watch nutzt oder genutzt hast (die Einstellungen zeigen ihn nur, solange Bug Watch an ist), und deinen RUSE-Guard-Code (die Einstellungen zeigen ihn als „Ihr RUSE-Guard-Code“); für die Steam-Anmeldung deine Steam-ID. Unsere Server fragen nicht nach deinem echten Namen, also finden wir ohne diese Angaben deine Daten vielleicht nicht. Wenn wir nicht sicher sind, ob eine Anfrage von dir ist, bitten wir vielleicht um mehr. Wir antworten innerhalb eines Monats, kostenlos; ist eine Anfrage komplex, können wir bis zu zwei weitere Monate brauchen und sagen dir, warum.
Wenn du die Apps nicht mehr nutzt, kannst du uns bitten, deine RUSE-Guard-Einträge zu löschen, und wir tun es. Wurde unter deinem Benutzernamen Betrug bestätigt, behalten wir nur diese Markierung und die Entscheidung, auf der sie beruht: deinen Benutzernamen, die Partie, das Urteil, sein Datum und den RUSE-Guard-Schlüssel, mit dem die Markierung kam. Wir können auch behalten, was ein Betrugsfall braucht, der noch in Prüfung oder im Einspruch ist.
Beschwerden: Du kannst dich bei der Datenschutzbehörde beschweren, wo du lebst oder arbeitest oder wo du meinst, dass das Problem geschah; in Frankreich ist das die CNIL (cnil.fr), im Vereinigten Königreich die ICO (ico.org.uk). Jeder kann sich zuerst bei uns beschweren. Wenn du im Vereinigten Königreich bist, bestätigen wir dir den Eingang deiner Beschwerde innerhalb von 30 Tagen.

DEIN WIDERSPRUCHSRECHT
Du kannst jederzeit aus Gründen, die sich aus deiner eigenen Situation ergeben, der Verwendung deiner Daten für RUSE Guard widersprechen. Schreib uns eine E-Mail. Wenn wir zustimmen, löschen wir deine RUSE-Guard-Einträge, abgesehen von einer Betrugsmarkierung und ihrer Entscheidung (wie oben), und wir sagen dir, dass RUSE Guard erforderlich ist, um unsere Apps zu nutzen: Der einzige Weg, keine neuen Einträge zu senden, ist, sie nicht zu nutzen. Wir stimmen vielleicht nicht zu, wenn wir zwingende Gründe haben, die deine überwiegen, etwa ein Betrugsfall, der noch in Prüfung oder im Einspruch ist.

Andere Spieler
Heute sendet RUSE Guard nichts über die anderen Spieler in deinen Partien: keine Namen und keine Wiederholungen. Eine Cheat- oder Testkopie teilt den Spielen der anderen Spieler nur einen kurzen Build-Code mit. Wenn eine spätere Version Partieeinträge oder Wiederholungen sendet, die die Spielnamen anderer Spieler enthalten können, sagt dieser Text es vorher. Diese Erklärung ist öffentlich, also können sie auch Spieler lesen, die unsere Apps nicht nutzen. Jeder kann uns fragen, was wir unter seinem Spielnamen haben, und die Rechte oben gelten auch für ihn.

Tracking
Die Apps verfolgen nicht, was du auf anderen Websites oder in anderen Apps tust, und sie enthalten keine Werbenetzwerke oder andere fremde Tracker. Die Apps sind keine Webbrowser, also lesen sie das „Do Not Track“-Signal eines Browsers nicht; deine Wahlmöglichkeiten sind das Häkchen bei Bug Watch und ob du die Steam-Anmeldung nutzt.

Sicherheit
Die Apps erreichen unsere Server nur über verschlüsselte Verbindungen und installieren ein Update nur, wenn es unsere Signatur trägt (Abschnitt 12). Sie machen die Adresse der Anmeldeseite von Steam selbst. Unser RUSE-Guard-Server sagt nur dem eigenen Launcher eines markierten Spielers, dass er markiert ist. Kein System ist vollkommen sicher: Wenn etwas geschieht, das deine Daten gefährdet, sagen wir es auf unserer GitHub-Seite und unserem Discord und informieren die Datenschutzbehörden, wo das Gesetz es verlangt.

Was auf deinem PC bleibt
Die Apps behalten ihre Einstellungen und Arbeitsdateien in einem Ordner namens RUSE Mod Platform, im Ordner AppData\\Local deines Windows-Benutzers:
- deinen Benutzernamen und deine Installations-ID, deinen RUSE-Guard-Schlüssel, deine Wahlen, den Steam-Pass, wenn du dich angemeldet hast, und Freischaltcodes;
- die Liste bekannter Spielabstürze von Bug Watch, solange Bug Watch an ist;
- die noch nicht gesendeten Zählungen von Bug Watch und die wartenden Berichte;
- RUSE-Guard-Einträge, die auf das Senden warten, und solche, die unser Server abgelehnt hat (30 Tage nach dem Beiseitelegen gelöscht);
- Protokolle dessen, was die Apps getan haben (die Ordnernamen enthalten können);
- die eigenen Browserdaten des App-Fensters;
- heruntergeladene Dateien (der Installer eines Updates wird beim nächsten Start der App gelöscht, nachdem es installiert wurde).
Um zu erkennen, ob das Spiel noch aus deiner gemoddeten Kopie läuft, sehen die Apps auch nach, welche Programme laufen und von wo (das ist unabhängig von der Programmprüfung von RUSE Guard in Abschnitt 6); das bleibt auf deinem PC. Wenn die Apps die Absturzberichte des Spiels lesen (Abschnitte 6 und 7), tun sie das auf deinem PC und senden sie nie; nur der eigene Absturzmelder des Spiels kann seinen Bericht an den Hersteller des Spiels senden (Abschnitt 3). Nichts in diesem Ordner wird irgendwohin gesendet, außer wie die Abschnitte 5 bis 8 und 12 es sagen. Wenn du die zweite der beiden Apps deinstallierst, fragt das Deinstallationsprogramm, ob dieser Ordner auch gelöscht werden soll; die Antwort steht zunächst auf Nein. Ein Ja löscht ihn, abgesehen von Mods, Karten, Exporten oder Sicherungen, die eine ältere Version darin abgelegt hat. Solange die andere App noch installiert ist, fragt es nichts und löscht nichts, weil beide Apps diesen Ordner benutzen. Um ihn sonst zu entfernen, lösche ihn selbst. Deine Mods, Karten, Exporte und Sicherungen im Ordner RUSE 2.0 in Dokumente, deine gemoddete Kopie und die saubere Sicherung deines Spiels bleiben ebenfalls, bis du sie löschst.


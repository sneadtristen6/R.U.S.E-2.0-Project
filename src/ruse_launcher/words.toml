[cheats_help]
us = "These change the game for testing (units for free, instant building…). They're never ticked for you, and never downloaded unless you tick them."
fr = "Ils modifient le jeu pour les tests (unités gratuites, construction instantanée…). Ils ne sont jamais cochés pour vous, et jamais téléchargés si vous ne les cochez pas."
ger = "Sie verändern das Spiel zum Testen (kostenlose Einheiten, sofortiger Bau…). Sie werden nie für Sie angekreuzt und nur heruntergeladen, wenn Sie sie ankreuzen."
ita = "Cambiano il gioco per i test (unità gratis, costruzione istantanea…). Non vengono mai spuntati per te, e non vengono mai scaricati se non li spunti."
spa = "Cambian el juego para hacer pruebas (unidades gratis, construcción instantánea…). Nunca se marcan por ti, y nunca se descargan si no los marcas."
pol = "Zmieniają grę do testów (darmowe jednostki, natychmiastowa budowa…). Nigdy nie są zaznaczane za ciebie i nigdy nie są pobierane, jeśli ich nie zaznaczysz."
ru = "Они меняют игру для тестов (бесплатные юниты, мгновенная постройка…). Они никогда не отмечаются за вас и не скачиваются, пока вы их не отметите."
cz = "Mění hru pro testování (jednotky zdarma, okamžitá stavba…). Nikdy se nezaškrtnou za vás a nikdy se nestáhnou, pokud je nezaškrtnete."
jpn = "テスト用にゲームを変更します（ユニット無料、即時建設など）。自動でチェックされることはなく、チェックしない限りダウンロードもされません。"
sc = "它们为测试而修改游戏（单位免费、瞬间建造…）。它们不会被自动勾选，除非你勾选，否则也不会被下载。"
fa = "این‌ها بازی را برای آزمایش تغییر می‌دهند (یگان‌های رایگان، ساخت فوری…). هیچ‌وقت خودکار برایتان تیک نمی‌خورند، و تا تیکشان نزنید هرگز دانلود نمی‌شوند."


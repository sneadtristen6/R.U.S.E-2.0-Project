[welcome_help]
us = "These are the mods that work with the Launcher. Everything is ticked except the cheats and test tools: untick what you don't want, then Install. You can add more later under “Supported mods”."
fr = "Voici les mods qui fonctionnent avec le Launcher. Tout est coché sauf les triches et les outils de test : décochez ce que vous ne voulez pas, puis Installer. Vous pourrez en ajouter d'autres plus tard dans « Mods compatibles »."
ger = "Das sind die Mods, die mit dem Launcher funktionieren. Alles ist angekreuzt außer den Cheats und Testwerkzeugen: Entfernen Sie die Häkchen bei allem, was Sie nicht wollen, dann Installieren. Weitere können Sie später unter „Unterstützte Mods“ hinzufügen."
ita = "Queste sono le mod che funzionano con il Launcher. È tutto spuntato tranne i trucchi e gli strumenti di prova: togli la spunta a ciò che non vuoi, poi Installa. Potrai aggiungerne altre più tardi in «Mod supportate»."
spa = "Estos son los mods que funcionan con el Launcher. Todo está marcado salvo los trucos y las herramientas de prueba: desmarca lo que no quieras y pulsa Instalar. Puedes añadir más después en «Mods compatibles»."
pol = "To mody, które działają z Launcherem. Wszystko jest zaznaczone oprócz kodów i narzędzi testowych: odznacz to, czego nie chcesz, a potem Zainstaluj. Więcej możesz dodać później w sekcji „Obsługiwane mody”."
ru = "Это моды, которые работают с Launcher. Отмечено всё, кроме читов и инструментов для тестов: снимите отметки с ненужного и нажмите «Установить». Добавить другие можно позже в разделе «Поддерживаемые моды»."
cz = "Toto jsou módy, které fungují s Launcherem. Zaškrtnuto je vše kromě cheatů a testovacích nástrojů: odškrtněte, co nechcete, a pak Nainstalovat. Další můžete přidat později v sekci „Podporované módy“."
jpn = "Launcherで動作するMODの一覧です。チートとテスト用ツール以外はすべてチェック済みです。不要なもののチェックを外して「インストール」を押してください。あとから「対応MOD」で追加することもできます。"
sc = "这些是可在 Launcher 中使用的模组。除作弊和测试工具外均已勾选：取消勾选你不需要的，然后点击“安装”。以后也可以在“支持的模组”中添加更多。"
fa = "این‌ها مادهایی هستند که با لانچر کار می‌کنند. همه‌چیز تیک خورده جز تقلب‌ها و ابزارهای آزمایشی: تیک هر چه را نمی‌خواهید بردارید، سپس «نصب». بعداً می‌توانید از «مادهای پشتیبانی‌شده» مادهای بیشتری اضافه کنید."


5. Exemplaires possédés uniquement
Le projet ne prend en charge R.U.S.E. que si vous le possédez. Au démarrage des applications, et avant le lancement d'un jeu moddé, elles vérifient dans le dossier du jeu la présence d'un exemplaire installé via Steam : l'enregistrement d'installation de Steam, le fichier signé par Steam lui-même, et aucun fichier faisant tourner le jeu sans Steam. C'est notre propre vérification, pas celle de Steam ni d'Eugen Systems, et elle ne prouve pas qui possède le jeu. Rien n'est envoyé pour cette vérification.
Si votre exemplaire ne peut pas être confirmé (une version en boîte d'avant l'arrivée de R.U.S.E. sur Steam, ou une vérification qui s'est trompée), une fenêtre vous montre un code de dossier. Il est calculé sur votre PC à partir d'un identifiant de votre installation de Windows (ou de Linux) ou, à défaut, de l'identifiant de votre carte réseau, et du fichier principal du jeu. Il est à sens unique : on ne peut pas le retransformer en ces identifiants. Il ne quitte votre PC que si vous le collez quelque part, ou si vous appuyez sur « Ouvrir un ticket sur GitHub », qui ouvre dans votre navigateur la page de tickets de GitHub avec le code déjà dans l'adresse de la page. Rien n'est publié tant que vous ne le publiez pas, et les tickets GitHub sont publics. Vous pouvez à la place envoyer le code à sneadtristen6 dans un message privé sur Discord. Nous vous renvoyons un code de déblocage qui ne fonctionne que sur ce PC, avec cette version du fichier principal du jeu. Nous n'utilisons votre code de dossier que pour débloquer votre exemplaire, parce que vous l'avez demandé, et nous n'en gardons aucune trace en dehors de votre ticket ou de votre message.

6. RUSE Guard : notre anti-triche (obligatoire)
Pourquoi : pour empêcher la triche dans les parties multijoueur et coopératives de R.U.S.E. jouées avec des copies que nos applications construisent. Les mods peuvent changer la façon dont le jeu se joue. Chaque copie dont les mods changent le jeu reçoit donc un code de partie que vous comparez avec les personnes avec qui vous jouez. Une copie construite avec une triche ou un outil de test vérifie que chaque joueur de la partie a la même version de build, et abandonne la partie sinon. Dans les parties multijoueur et coopératives, RUSE Guard cherche aussi des outils de triche connus qui tournent sur votre PC. Et le surveillant de chaque copie affiche à l'écran quand une partie voit un ordre d'apparition ou un bond soudain de l'argent d'un camp.
Pourquoi c'est obligatoire : RUSE Guard est obligatoire pour utiliser nos applications. R.U.S.E. n'a pas d'anti-triche efficace, et c'est pourquoi RUSE Guard est nécessaire : il aide à tenir les tricheurs hors du multijoueur, et les parties équitables comptent pour nous et pour chaque joueur que vous rencontrez. Nous nous appuyons sur ce que le droit de la protection des données appelle un « intérêt légitime » : des parties équitables pour tous les joueurs, ce qui n'exige pas votre autorisation tant que votre vie privée ne l'emporte pas sur cet intérêt (section 11). C'est pourquoi ce n'est pas une case à cocher comme Bug Watch : le Studio et le Launcher tels que nous les publions l'incluent toujours. Vous pouvez quand même vous y opposer à tout moment (section 11).
- Où il agit : RUSE Guard est dans chaque copie moddée que les applications construisent, et le Jeu d'origine du Launcher construit lui aussi une telle copie, sans mods (section 10). Son verrou et sa vérification des programmes n'agissent que dans les parties multijoueur et coopératives, et il en irait de même pour ses enregistrements de partie, une fois qu'ils commenceront (ci-dessous). Son surveillant, présent lui aussi dans chaque copie moddée, observe les parties multijoueur, coopératives et les escarmouches contre l'ordinateur : il peut afficher un message sur votre propre écran quand l'argent d'un camp fait un bond de 400 ou plus d'un coup, ou quand une unité est créée par un ordre d'apparition. Dans une partie multijoueur, l'écran de chaque joueur peut l'afficher. Le surveillant ne change rien dans la partie et n'envoie rien. Seul le Launcher envoie quelque chose pour RUSE Guard ; le Studio n'en envoie jamais, et son Tester en jeu ne lance aucune vérification des programmes.
- La liste : la liste d'outils de triche connus de RUSE Guard est fournie dans l'application, sous forme de simple fichier que vous pouvez lire, et ne change qu'avec une mise à jour de l'application. Rien n'est téléchargé pour elle.
- La vérification des programmes : dans une partie multijoueur ou coopérative lancée depuis le Launcher, RUSE Guard regarde toutes les 30 secondes les noms des programmes qui tournent sur votre PC, et ne garde que les noms qui figurent sur sa liste. Pour savoir quand une telle partie est en cours, le Launcher lit la sortie d'erreurs du jeu pendant qu'il tourne : il ne garde que les courtes lignes de RUSE Guard qui disent qu'une partie est en cours ou terminée, et jette toutes les autres lignes dès qu'il les lit, sans jamais les garder ni les envoyer (cette sortie peut aussi contenir des lignes de Steam, dont l'une avec le numéro de votre compte Steam). Si le jeu ne dit pas qu'une partie est terminée, la vérification s'arrête deux minutes après la dernière fois où le jeu a dit qu'elle était en cours. Si un programme listé tournait pendant une partie, le Launcher envoie à notre serveur, après la partie, un court enregistrement : votre nom d'utilisateur et votre clé RUSE Guard, le début et la fin de la partie, s'il s'agissait de multijoueur ou de coopératif, et les noms des programmes listés trouvés. Rien d'autre n'y figure : ni replay, ni fichiers, ni rien de plus sur la partie. Si aucun programme listé ne tournait, rien n'est envoyé.
- Le code de partie : pour une copie moddée dont les mods changent la façon dont le jeu se joue, le Launcher affiche un code de partie. Il représente la version du jeu de la copie, ses mods avec leurs versions, et ce qu'ils changent dans la façon dont le jeu se joue. Vous comparez les codes de partie avec les personnes avec qui vous jouez. Nous ne les recevons pas aujourd'hui ; un enregistrement de partie (ci-dessous) les porterait.
- Les copies construites avec un outil de triche ou de test : une telle copie ne joue en multijoueur et en coopératif qu'avec des joueurs dont le build est le même (même version du jeu et mêmes mods, dans les mêmes versions). Environ une seconde après le début de chacune de ces parties, elle indique au jeu de chaque joueur un court code de son build (son code de build), calculé à partir de la version du jeu, des mods avec leurs versions dans leur ordre, et de ce qu'ils changent dans la façon dont le jeu se joue. Il ne contient ni nom ni compte. Si tous les joueurs ont le même build, la partie est conçue pour continuer ; personne n'a encore joué une telle partie à deux. Sinon, elle abandonne la partie quelques secondes après le début.
  Dans une partie multijoueur non classée, elle arrête ensuite le jeu exprès à l'écran de fin de cette partie : le jeu plante et revient au bureau. Le rapporteur de plantage du jeu lui-même peut alors envoyer son rapport au créateur du jeu, et ce rapport contient la ligne de RUSE Guard disant qu'une copie de triche a été arrêtée. Dans les parties coopératives et classées, elle se contente d'abandonner la partie. Quand le Launcher a lancé le jeu et est encore ouvert au moment où le jeu s'arrête, il ne prend que la ligne de RUSE Guard dans le rapport de plantage du jeu sur votre PC et envoie à notre serveur une courte note disant qu'une copie de triche a été arrêtée, sous votre nom d'utilisateur et votre clé RUSE Guard, avec le moment où le rapport de plantage a été écrit et celui où la note a été faite. La ligne ne dit que le type de partie et le numéro de votre camp dans celle-ci ; tout identifiant Steam, long nombre ou chemin en est retiré. Nos applications n'envoient jamais le rapport de plantage lui-même. La note n'ouvre aucune revue et ne décide rien ; elle est listée pour que sneadtristen6 la voie. Aucune note n'est envoyée si le Launcher a été fermé avant que le jeu ne s'arrête, ou si le jeu a été lancé depuis le Studio ou à la main. Sous Linux et sur le Steam Deck, on ne sait pas encore si la note est envoyée.
  Les copies honnêtes ne sont jamais arrêtées.
- Votre clé RUSE Guard : la première fois que le Launcher fait un enregistrement RUSE Guard sur votre PC, il y crée une clé aléatoire. Un code calculé à partir de cette clé (sa moitié publique) accompagne chaque enregistrement, pour que nous puissions distinguer vos enregistrements de ceux de quelqu'un qui a le même nom d'utilisateur, et vérifier qu'ils n'ont pas été modifiés. Il ne dit rien d'autre sur vous. Les Réglages affichent un court code calculé à partir d'elle, « Votre code RUSE Guard » : envoyez-le avec une demande relative à la vie privée, et nous pourrons retrouver vos propres enregistrements RUSE Guard. Rien de plus n'est envoyé pour cela.
- Pas encore actif : les enregistrements de partie. Ils ont besoin d'un enregistrement de la partie que le jeu ne sait pas écrire aujourd'hui. Avant qu'ils commencent, nous mettrons ce texte à jour, et les applications vous le montreront de nouveau. Quand ils commenceront, un enregistrement de partie portera : votre nom d'utilisateur et votre clé RUSE Guard ; votre camp ; les codes de votre copie ; des vérifications des fichiers du jeu que votre copie a changés, et des vérifications régulières que le jeu de chaque joueur reste le même ; vos mods avec leurs vérifications ; les commandes de script que vos mods lient à des touches (jamais ce que vous appuyez) ; pour la copie de test d'un développeur, la clé du développeur ; les noms des éventuels outils de triche listés trouvés en cours d'exécution ; le début et la fin de la partie ; et le replay le plus récent enregistré sur votre PC pendant ou juste après la partie, avec son nom de fichier. Un replay contient chaque ordre donné par chaque joueur dans la partie, et son nom de fichier et son contenu peuvent inclure les noms en jeu de vous-même et d'autres joueurs.
- Ce qu'il ne fait jamais : il ne collecte jamais votre écran ni vos frappes au clavier, ne regarde jamais à l'intérieur d'autres programmes pendant qu'ils tournent, et ne nous envoie jamais vos fichiers, hormis le replay qu'un enregistrement de partie porterait. Des rapports de plantage du jeu, il ne lit que sa propre ligne sur une copie de triche qu'il a arrêtée (ci-dessus), sur votre PC.
- Les copies de test de développeurs : les applications sont conçues pour laisser entrer dans une partie la copie de test d'un développeur munie d'une clé spéciale de notre part, la seule exception à la règle des copies de triche. Aucune ne fonctionne encore : les applications ne peuvent pas vérifier une telle clé aujourd'hui.
- Les décisions vous concernant : pas de bannissement automatique. Aucune décision sur la triche n'est prise par une machine seule : sneadtristen6 examine les preuves, et le replay quand il y en a un, et décide. Claude, un assistant d'IA d'Anthropic, l'aide à lire les enregistrements de RUSE Guard, selon les propres conditions d'Anthropic ; les décisions sont les siennes. Un enregistrement qui nomme un outil de triche listé ouvre pour lui une revue, qui ne décide rien tant qu'il n'a pas décidé. Vous pouvez faire appel dans les 30 jours suivant une décision (section 17) ; sneadtristen6 est la seule personne qui examine les affaires, donc c'est lui aussi qui tranche les appels. La seule règle automatique est la règle des copies de triche ci-dessus. Elle découle de la copie que vous avez choisi de construire, et elle ne touche jamais votre compte Steam ni votre jeu installé.
- Ce que signifie une décision aujourd'hui : si la triche est confirmée, nous gardons cette décision sous votre nom d'utilisateur sur notre liste de joueurs signalés, et nous nous en servons quand nous examinons des parties ultérieures. Comme deux joueurs peuvent partager un nom d'utilisateur, nous regardons aussi avec quelle clé RUSE Guard les enregistrements sont arrivés. Notre serveur RUSE Guard tient cette liste, chaque nom d'utilisateur signalé avec la clé RUSE Guard avec laquelle ses enregistrements sont arrivés en premier, et ne dit qu'au Launcher de ce joueur qu'il est signalé. Les applications n'agissent pas encore sur un signalement. Si une version ultérieure le fait, par exemple pour tenir les copies moddées d'un joueur signalé hors du multijoueur via R.U.S.E. 2.0, ce texte le dira d'abord. Si un appel est accepté, la décision est marquée comme annulée, et le nom d'utilisateur sort de la liste.
- Durée de conservation des enregistrements, et vos droits : section 11.

7. Bug Watch : aidez-nous à trouver et corriger les bugs (facultatif, recommandé)
Pourquoi : pour que le Studio et le Launcher fonctionnent mieux, et pour corriger les plantages plus tôt : au lieu d'attendre que quelqu'un signale un plantage, nous le voyons, ainsi que ce qui y a mené.
Sur quelle base : seulement avec votre accord (votre consentement, section 11). C'est désactivé tant que vous ne le cochez pas. Enregistrer ou changer votre nom d'utilisateur ne l'active ni ne le désactive jamais. Le cocher ne change rien d'autre dans les applications, sauf ce que le Launcher vous dit après un plantage du jeu (ci-dessous). Quand les applications montrent de nouveau ces conditions après un changement : si Bug Watch est activé, sa case demande « Garder Bug Watch activé ? », cochée ; laissez la case cochée pour le garder activé, ou décochez-la pour le désactiver. S'il est désactivé, la case Bug Watch revient, décochée.
Tant qu'il est activé, le Studio et le Launcher envoient à notre serveur :
- une fois par jour, les comptages de chaque jour terminé :
  - l'application et sa version ; le jour ; si vous utilisez Windows 10 ou 11 ; la langue de l'application ; la version du jeu ; si RUSE Guard est intégré ; quelle version de ces conditions vous avez acceptée ;
  - la fréquence d'utilisation de chaque partie de l'application et la durée des opérations ; ce qui a mal tourné et où (dans notre propre code uniquement ; quand le script d'un écran du Studio échoue, le nom de l'écran et le type d'erreur, jamais son texte, son fichier ni sa ligne) ; pour chaque longue tâche, comme la construction d'un mod, combien de fois elle s'est terminée ou a échoué, et combien de constructions ont trouvé des erreurs dans les mods ;
  - une liste des échecs de ce jour, 20 au plus, chacun avec son code (quel endroit de notre code), jusqu'où un Jouer ou un Tester en jeu est allé, la forme de l'ensemble de mods (combien de mods de notre liste, de dossiers de mods et de fichiers de mods à vous, en comptages), et à côté seulement des nombres qui ne désignent personne : le numéro d'erreur de Windows (comme disque plein), la réponse du serveur web (comme 404), le numéro de sortie du jeu, un comptage et un second code ;
  - combien de mises à jour ont été proposées, installées ou ont échoué ; combien de fois l'application a planté ; quelles vérifications de l'outil de dépannage ont trouvé un problème ;
  - quels mods de notre liste vous aviez activés ; combien de minutes vous avez joué en tout, et combien avec chacun de ces mods ;
  - combien de mods à vous vous aviez, et quels genres de choses ils contiennent, comme des unités, des cartes, des missions ou des scripts (comptés par genre, jamais nommés, et jamais leurs mots, chemins ou fichiers) ;
- tout de suite, quand une application plante : le type d'erreur et l'endroit dans notre code ;
- tout de suite, après le plantage d'un jeu que l'application a lancé, des détails techniques sur l'endroit et la manière dont il a planté :
  - le code d'erreur du jeu ; le nom du fichier dans lequel il s'est arrêté (ce peut être une partie de Windows, un pilote, ou un autre programme chargé dans le jeu, comme une surcouche), l'endroit de ce fichier où le jeu s'est arrêté, et jusqu'à 16 endroits du jeu qui y ont mené ;
  - pour une erreur de mémoire, ce que le jeu essayait de faire (lire, écrire ou exécuter) et l'endroit en mémoire ;
  - pour une erreur de script, le texte d'erreur du jeu lui-même, avec les chemins sur un disque raccourcis en noms de fichiers, le nom de votre dossier utilisateur masqué (les noms des dossiers qu'il contient peuvent rester), et les numéros de compte Steam et autres longs nombres retirés (les noms de scripts du jeu lui-même restent) ; combien d'erreurs précédentes le jeu avait ignorées ; et la carte (une carte du jeu par son nom, la carte d'un mod seulement comme « une carte de mod ») ;
  - l'unité que le jeu était en train de créer, quand les applications peuvent la lire dans le rapport de plantage du jeu (une unité du jeu par son numéro, l'unité d'un mod seulement comme « une unité de mod ») ;
  - quels mods étaient activés, quels genres de choses vos propres mods contiennent (comptés par genre), et quelle version de ces conditions vous avez acceptée.
Bug Watch n'utilise que les rapports de plantage du jeu lui-même. D'un rapport d'un autre programme, il ne lit que les noms des fichiers qu'il liste, pour constater que ce n'est pas celui du jeu ; rien n'en est envoyé.
Chaque envoi porte votre nom d'utilisateur et votre identifiant d'installation, un code aléatoire créé sur votre PC quand vous avez choisi votre nom d'utilisateur pour la première fois, que vous cochiez Bug Watch ou non. Votre code de rapport, que les Réglages affichent tant que Bug Watch est activé, est constitué des 8 premiers caractères de votre identifiant d'installation.
Nos applications n'envoient jamais vos fichiers ni les fichiers de rapport de plantage du jeu eux-mêmes, et Bug Watch n'envoie aucun numéro de compte Steam. (Le rapporteur de plantage du jeu lui-même peut envoyer son propre rapport au créateur du jeu : section 3.) Le texte d'erreur du jeu peut contenir des noms issus du jeu ou des scripts d'un mod. Merci de ne pas utiliser votre vrai nom comme nom d'utilisateur (section 9).
Plantages connus : avec Bug Watch activé, si le jeu plante d'une des façons que nous connaissons, le Launcher vous dit quelle unité le jeu était en train de créer et pourquoi, dans votre langue. Cette explication ne vous est montrée qu'à vous, jamais envoyée ; le rapport de Bug Watch ne porte l'unité que comme indiqué plus haut (un numéro, ou « une unité de mod »). Pour connaître ces plantages, les applications téléchargent notre liste depuis notre serveur Bug Watch au lancement d'un jeu, sauf si la liste sur votre PC a moins d'un jour, et une fois de plus lors d'un plantage s'il n'y a pas de liste utilisable. Elles ne la téléchargent que tant que Bug Watch est activé, la gardent sur votre PC, ne s'en servent que si elle porte notre signature, et comparent votre rapport de plantage avec elle sur votre PC. Le téléchargement ne porte rien sur vous. Sans la liste (par exemple la première fois, ou sans internet), le Launcher vous dit quand même que le jeu a planté, mais pas l'unité ni la raison. Décocher Bug Watch supprime la liste de votre PC.
Avec Bug Watch activé ou désactivé : si un jeu lancé par le Launcher plante, le Launcher vous montre un court code de plantage, calculé sur votre PC à partir de l'endroit où le jeu s'est arrêté. Il n'est envoyé nulle part. Un bouton « Copier le code » le copie. Si vous voulez de l'aide, envoyez le code et une capture d'écran du message à XUL sur Discord (XUL6x3) ou sur GitHub, et nous le cherchons dans notre propre liste. Le code ne dit que l'endroit où le jeu s'est arrêté.
Les Réglages vous montrent les comptages du jour mot pour mot, tels qu'ils seraient envoyés, et les noms des rapports en attente d'envoi. Les rapports qui ne peuvent pas être envoyés attendent sur votre PC jusqu'à 30 jours, puis sont abandonnés. Pendant qu'un jeu lancé par l'application tourne, Bug Watch garde aussi une petite note à son sujet sur votre PC, pour que l'application puisse savoir à son prochain démarrage si le jeu a planté : quand il a démarré et quand il a été vu tourner pour la dernière fois, ses mods (les nôtres par nom et version, les autres seulement en nombre), et où la copie et le jeu sont installés (un dossier Windows peut contenir votre nom d'utilisateur Windows). Elle n'est jamais envoyée, et elle est supprimée après 30 jours, ou tout de suite quand vous décochez Bug Watch.
Qui le voit : nos développeurs. C'est conservé pour nous par Cloudflare sur notre serveur Bug Watch. Quand c'est activé, notre serveur publie aussi des notes sur les problèmes que nous suivons dans un dépôt GitHub privé, un espace sur GitHub que seuls nos développeurs peuvent ouvrir. Les notes ne contiennent jamais de nom d'utilisateur ni de code de rapport. Nos développeurs utilisent aussi Claude, un assistant d'IA d'Anthropic, pour les aider à lire certains rapports de plantage Bug Watch, selon les propres conditions d'Anthropic.
Combien de temps : chaque rapport est supprimé de notre serveur lors du nettoyage quotidien après y être resté 7 jours, donc 7 à 8 jours après son arrivée. Nos développeurs peuvent marquer le rapport d'un plantage très grave pour le garder pendant qu'ils corrigent ce plantage ; un rapport marqué reste jusqu'à ce qu'ils retirent la marque, le jour où ce plantage est corrigé, puis part au nettoyage quotidien suivant. Ce qui reste ensuite, sans nom d'utilisateur, identifiant d'installation ni code de rapport : les totaux journaliers pour chaque version d'application (comme « 12 constructions de mods ont échoué sur la version 0.9.9 ce jour-là ») et le jour où chaque version et chaque type d'erreur ont été vus pour la première fois, sans limite de durée ; et les notes de notre serveur sur les problèmes qu'il trouve (quelle partie d'une application, quel mod de notre liste, où un plantage s'est produit, et à quelle fréquence), jusqu'à 3 jours après que nous avons clos ce problème. Pendant les 7 premiers jours, un jour où une seule personne a utilisé une version, ses totaux sont les comptages de cette seule personne ; après cela, une version ou un mod de notre liste que moins de 3 installations ont utilisé ce jour-là n'est gardé que comme « (other) ». Les notes sur GitHub restent jusqu'à ce que nous les supprimions. Cloudflare garde un historique de nos bases de données pendant 7 jours, donc ce que nous supprimons reste dans cet historique jusqu'à 7 jours de plus. Copies sur l'ordinateur de sneadtristen6 : section 11, « Où c'est conservé ».
Décochez-le à tout moment dans les Réglages (ou dans la case Bug Watch quand les applications montrent ces conditions). À partir de là, plus rien n'est compté ni envoyé, et les applications suppriment les comptages de Bug Watch et les rapports en attente d'envoi. Votre nom d'utilisateur et votre identifiant d'installation restent sur votre PC, parce que RUSE Guard utilise votre nom d'utilisateur. Rien de ce qui a été fait avant que vous le décochiez n'est envoyé plus tard, même si vous le recochez. Le décocher ne dit rien à notre serveur : ce qui l'a déjà atteint est supprimé comme indiqué plus haut. Pour le faire supprimer plus tôt, envoyez-nous par e-mail votre code de rapport (les Réglages ne l'affichent que tant que Bug Watch est activé, notez-le donc avant de décocher), ou votre nom d'utilisateur si vous n'avez pas le code : nous retrouvons par lui les rapports de votre installation et nous les supprimons. Les totaux et les notes ci-dessus restent. Décocher n'annule pas ce qui a été envoyé avant.

8. Connexion via Steam (facultatif)
Pourquoi : pour confirmer que vous possédez R.U.S.E., pour le jeu en ligne, RUSE Guard et les téléchargements de contenu plus tard. Rien ne l'exige encore.
Sur quelle base : vous le demandez (section 11). Les applications peuvent le proposer au démarrage, et les Réglages du Launcher l'ouvrent à tout moment.
- Vous vous connectez sur la page de Steam dans votre navigateur, à une adresse que l'application fabrique elle-même. Nous ne voyons jamais votre mot de passe.
- Steam indique ensuite votre identifiant Steam à notre serveur. Notre serveur demande à Steam si ce compte possède R.U.S.E. (cela ne marche que si les détails de jeu de votre compte Steam sont publics), utilise la réponse, et ne conserve pas l'identifiant. Si vous le possédez, notre serveur donne à votre PC un laissez-passer (un code qui montre que la vérification a réussi), valable 30 jours.
- Ce que notre serveur conserve : un code à sens unique calculé à partir de votre identifiant Steam avec un secret à nous, et la date d'émission de votre laissez-passer et celle de son expiration, jusqu'à 30 jours après l'expiration de votre laissez-passer. Le code de courte durée que votre application utilise pour récupérer le laissez-passer (le code de connexion) n'est conservé que sous forme brouillée ; il expire au bout de 10 minutes et est supprimé quand l'application le récupère, ou environ une heure après son expiration. Les numéros de connexion à usage unique de Steam empêchent de rejouer une connexion ; ils sont conservés un jour, même si une connexion échoue, puis supprimés dans l'heure environ. Notre code ne conserve jamais votre adresse IP.
- Où : les bases de données de nos serveurs sont conservées par Cloudflare dans l'est de l'Amérique du Nord.
- Ce que votre PC conserve : le laissez-passer, dans les paramètres des applications, jusqu'à ce que vous vous déconnectiez dans les Réglages, ce qui le supprime. Un laissez-passer expiré reste aussi jusque-là.
- Si les détails de jeu de votre compte Steam sont privés, Steam ne peut rien nous dire. Mettez les détails de jeu en Public pendant une minute, puis réessayez.
- R.U.S.E. 2.0 n'est ni affilié à Valve ni cautionné par elle. Valve traite votre connexion selon sa propre politique de confidentialité.

9. Votre nom d'utilisateur
Pourquoi : pour que nous sachions de qui est tel rapport de plantage ou tel enregistrement de partie, et puissions aider cette personne. Chacun en choisit un au premier démarrage, parce que RUSE Guard est obligatoire. Un # et quatre chiffres aléatoires sont ajoutés, comme Nick#4821. Deux joueurs peuvent quand même se retrouver avec le même, nous nous fions donc aussi à votre clé RUSE Guard ou à votre code de rapport. Merci de ne pas utiliser votre vrai nom, votre nom Steam ni rien d'autre qui vous identifie. Il n'est envoyé qu'avec vos enregistrements RUSE Guard et, si Bug Watch est activé, vos rapports Bug Watch. Un seul nom d'utilisateur sert pour les deux applications. Vous pouvez le changer dans les Réglages ; le changer n'active ni ne désactive jamais Bug Watch. Les enregistrements déjà envoyés gardent l'ancien jusqu'à leur suppression. Pour faire supprimer votre nom d'utilisateur et les données qui y sont liées, écrivez-nous.

10. Le titre et l'intro de R.U.S.E. 2.0 (facultatif)
Les copies que le Launcher et le Studio construisent affichent le titre d'origine du jeu et la vidéo du logo d'Eugen. Si vous cochez la case de l'écran de départ, ou « Utiliser le titre doré et l'intro de R.U.S.E. 2.0 » sous Le titre du jeu dans les Réglages, ces copies affichent R.U.S.E. 2.0 en doré au menu principal et sur les écrans de chargement, et notre intro est lue à la place de la vidéo du logo d'Eugen au lancement du jeu. Le titre doré est fabriqué sur votre PC à partir des fichiers de votre propre jeu, sur une image de scène de bataille fournie avec les applications. L'intro utilise aussi un bruit de moteur fourni avec les applications. Cela ne change que votre copie moddée, jamais votre jeu installé, et vous pouvez le changer à tout moment dans les Réglages. Dans le Launcher, le Jeu d'origine construit une copie distincte sans mods, avec RUSE Guard dedans comme toute copie, et avec le titre que vous avez choisi.


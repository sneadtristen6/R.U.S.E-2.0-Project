Le projet ne prend en charge R.U.S.E. que si vous le possédez. Avant le lancement d'un jeu moddé, les applications vérifient que le dossier du jeu est un exemplaire que vous possédez, d'après les fichiers que Steam y a laissés : l'enregistrement d'installation de Steam, le fichier signé par Steam lui-même, et aucun fichier faisant tourner le jeu sans Steam. Rien n'est envoyé pour cette vérification. Si votre exemplaire ne peut pas être confirmé (une version en boîte d'avant l'arrivée de R.U.S.E. sur Steam, ou une vérification qui s'est trompée), une fenêtre vous montre un code calculé à partir de ce PC et du fichier principal du jeu, et comment ouvrir un ticket sur notre Discord ou GitHub ; le code ne quitte votre PC que si vous le collez là. Nous vous renvoyons un code de déblocage, qui ne fonctionne que sur ce PC.

5. RUSE Guard : notre anti-triche (obligatoire)
Pourquoi : pour empêcher la triche dans les vraies parties multijoueur de R.U.S.E. Les mods peuvent changer la façon dont le jeu se joue, alors RUSE Guard s'assure que tout le monde dans une partie joue au même jeu, et que personne n'utilise nos outils pour tricher contre d'autres joueurs. Pour utiliser RUSE Studio et RUSE Launcher, vous acceptez RUSE Guard.
- Où il agit : RUSE Guard est dans chaque copie moddée que les applications construisent, et il n'agit que dans les parties multijoueur et coopératives. Il ne fait rien en solo, en escarmouche contre l'ordinateur, dans la campagne ou les replays, et le Studio ne le lance jamais pendant que vous créez des mods.
- Le code de partie : le Launcher donne à votre jeu moddé un code qui représente sa version du jeu, ses mods et leurs versions. Vous et les personnes avec qui vous jouez comparez vos codes vous-mêmes ; le code ne nous est jamais envoyé. Une copie construite sans RUSE Guard n'a pas de code de partie, et les personnes avec qui vous jouez ne peuvent donc pas vérifier que vous avez le même jeu.

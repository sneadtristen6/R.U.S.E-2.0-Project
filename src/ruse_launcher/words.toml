アプリは、暗号化された接続でだけ私たちのサーバーに接続し、私たちの署名がある更新だけをインストールします（第12条）。Steam のサインインページのアドレスも、アプリ自身が作ります。私たちの RUSE Guard サーバーは、フラグを付けたプレイヤー自身の Launcher にだけ、フラグが付いたことを伝えます。完全に安全なシステムはありません。あなたのデータが危険にさらされるようなことが起きた場合は、私たちの GitHub ページと Discord でお知らせし、法律で求められる場合はデータ保護当局にも知らせます。


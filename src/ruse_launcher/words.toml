3. نسخهٔ بازی شما، و مادها
- برنامه‌ها فقط با نسخه‌ای از R.U.S.E. کار می‌کنند که مال شماست. هیچ‌یک از فایل‌های بازی همراهشان نیست و هرگز آن‌ها را آپلود نمی‌کنند.
- برای بازی با ماد، برنامه‌ها یک نسخهٔ مادشدهٔ جدا از بازی را روی رایانهٔ شما می‌سازند. در برخی موارد ممکن است داده‌های بازی تغییر کند، اما این در نسخهٔ خودِ شما از بازی است: همان نسخهٔ مادشده. مادها داده‌های آن را تغییر می‌دهند و برخی اسکریپت‌هایش را. برنامه‌های ما اسکریپت‌های RUSE Guard و چند محافظ کوچک خودشان را در هر نسخهٔ مادشده به اسکریپت‌های بازی اضافه می‌کنند؛ این محافظ‌ها فقط جایی وارد عمل می‌شوند که بازی در غیر این صورت با خطا متوقف می‌شد. و برخی مجموعه‌های ماد به یک وصلهٔ کوچک برای فایل برنامهٔ آن نسخه نیاز دارند، که برنامه‌ها از صفحهٔ GitHub ما دانلود می‌کنند.
- برنامه‌ها هرگز وقتی بازی در حال اجراست چیزی در آن نمی‌گذارند. فقط می‌بینند که اجرا می‌شود یا نه و از کجا، و عیب‌یاب می‌تواند وقتی دکمهٔ رفع آن را می‌زنید بازی‌ای را که از یک نسخهٔ مادشده باز مانده است ببندد.
- بازی گزارش‌گر خرابی خودش را دارد، که سازندهٔ بازی ساخته است. وقتی بازی خراب می‌شود، چه بازی نصب‌شدهٔ شما باشد چه یک نسخهٔ مادشده، آن گزارش‌گر می‌تواند گزارش خرابی خودش را برای سازندهٔ بازی بفرستد. این مال بازی است، نه ما: برنامه‌های ما هرگز گزارش‌های آن را نمی‌فرستند و آن را روشن یا خاموش نمی‌کنند.
- برنامه‌های ما هرگز بازی نصب‌شدهٔ شما را تغییر نمی‌دهند، مگر این‌که از Launcher یا Studio بخواهید آن را از پشتیبان تمیزش بازگرداند. بازگرداندن فایل‌های خود بازی را سر جایشان می‌گذارد و فایل‌های اضافه‌شده و نسخه‌هایی را که جایگزین کرده کنار می‌گذارد.
- مادهای ساختهٔ دیگران متعلق به سازندگانشان است، زیر شرایطی که خودشان برگزیده‌اند. مادهایی که اسکریپت‌های بازی را تغییر می‌دهند علامت می‌خورند، و Launcher صبر می‌کند تا برای هر کدام «به سازندهٔ این ماد اعتماد دارم» را تیک بزنید، و دوباره برای هر نسخهٔ تازهٔ آن.

4. حقوق شما بر پایهٔ GPL، مجوزهایی که به کار می‌بریم، و ذکر نام سازندگان
- RUSE Studio و RUSE Launcher نرم‌افزار آزاد زیر مجوز عمومی همگانی GNU، نسخهٔ 3 (GPL v3) هستند. هیچ چیز در این توافق آنچه GPL به شما اجازه می‌دهد را محدود نمی‌کند: می‌توانید کد برنامه‌ها را زیر GPL اجرا کنید، بررسی کنید، تغییر دهید و به اشتراک بگذارید، چه این توافق را بپذیرید چه نه. برنامه‌ها، همان‌طور که ما منتشر می‌کنیم، می‌خواهند پیش از استفاده آن را بپذیرید؛ این شیوهٔ کار آن‌هاست، نه محدودیتی بر حقوق GPL شما. این توافق استفاده از آن‌ها، همراه با RUSE Guard، و خدمات آنلاین ما را در بر می‌گیرد. اگر برنامه‌ها یا یک نسخهٔ تغییریافته را به اشتراک می‌گذارید، آن را زیر GPL v3 نگه دارید، یادداشت‌های حق نسخه‌برداری و سپاس‌ها را نگه دارید، و کد منبعش را عرضه کنید. نسخهٔ تغییریافته برنامه‌ها، آن‌گونه که ما منتشر می‌کنیم، نیست؛ این توافق و پشتیبانی ما آن را در بر نمی‌گیرد.
- کار دیگران درون برنامه‌های ما: موتور RUSE Mod Manager از LittleGroove (GPL v3)، کار ProLution، و طراحی RUSE Guard از DomesticNukes. هر کدام در صفحهٔ پروژهٔ ما در GitHub ذکر شده است.
- کتابخانه‌ها و مدل‌های سه‌بعدی که همراه برنامه‌ها می‌آیند، و مجموعه‌های حرکت، یگان‌های دوره‌ها، بافت‌ها و عکس‌های هوایی که برنامه‌ها می‌توانند برایتان دانلود کنند، با سازندگان و مجوزهایشان در THIRD_PARTY_NOTICES فهرست شده‌اند، فایلی که همراه برنامه‌ها می‌آید؛ «تنظیمات» آن را نشان می‌دهد، زیر «شرایط، سپاس‌ها و مجوزها». صدای موتور ویدیوی آغازین هم آنجا فهرست شده است. یگان‌های دوره‌ها در یک ماد در فایل سپاس‌های خودِ آن ماد هم ذکر می‌شوند. آثار زیر مجوز CC BY (یک مجوز Creative Commons) را فقط با ذکر نام سازندگانشان می‌توان دوباره به کار برد: اگر یکی را در ماد خودتان دوباره به کار می‌برید، سازنده را به همان شکل ذکر کنید و پیوند مجوزش را نگه دارید. آثار زیر CC0 به ذکر نام نیاز ندارند، اما ما باز هم نامشان را می‌آوریم، و از شما هم می‌خواهیم همین کار را بکنید.

5. فقط نسخه‌های دارای مالکیت
پروژه فقط وقتی از R.U.S.E. پشتیبانی می‌کند که شما آن را داشته باشید. وقتی برنامه‌ها شروع می‌شوند، و پیش از شروع یک بازی مادشده، پوشهٔ بازی را برای نسخه‌ای که از راه Steam نصب شده بررسی می‌کنند: رکورد Steam از نصب، فایل امضاشدهٔ خود Steam، و نبودن فایل‌هایی که بازی را بدون Steam اجرا می‌کنند. این بررسی خودِ ماست، نه از Steam یا Eugen Systems، و ثابت نمی‌کند چه کسی مالک بازی است. برای آن چیزی فرستاده نمی‌شود.
اگر نسخهٔ شما تأیید نشود (نسخهٔ جعبه‌ای از پیش از آمدن R.U.S.E. به Steam، یا بررسی‌ای که اشتباه کرده)، یک کادر «کد پوشه» را به شما نشان می‌دهد. این کد روی رایانهٔ شما از یک شناسهٔ نصب Windows (یا Linux) شما، یا اگر نبود، شناسهٔ کارت شبکهٔ شما، و فایل اصلی بازی ساخته می‌شود. یک‌طرفه است: نمی‌توان آن را به آن شناسه‌ها برگرداند. این کد فقط اگر آن را جایی بچسبانید، یا «باز کردن درخواست در GitHub» را بزنید از رایانهٔ شما بیرون می‌رود؛ این دکمه صفحهٔ تیکت GitHub را در مرورگر شما باز می‌کند، با کد از پیش در نشانی صفحه. تا خودتان نفرستید چیزی ارسال نمی‌شود، و تیکت‌های GitHub عمومی هستند. به جای آن می‌توانید کد را در یک پیام خصوصی در Discord برای sneadtristen6 بفرستید. ما یک کد بازگشایی پس می‌فرستیم که فقط روی همان رایانه و با همان نسخهٔ فایل اصلی بازی کار می‌کند. کد پوشهٔ شما را فقط برای بازگشایی نسخه‌تان به کار می‌بریم، چون خودتان خواسته‌اید، و هیچ رکوردی از کدهای پوشه جز تیکت یا پیام شما نگه نمی‌داریم.

6. RUSE Guard: ضدتقلب ما (الزامی)
چرا: برای جلوگیری از تقلب در مسابقه‌های چندنفره و همکاری R.U.S.E. که با نسخه‌هایی بازی می‌شوند که برنامه‌های ما ساخته‌اند. مادها می‌توانند شیوهٔ بازی را تغییر دهند. پس هر نسخه‌ای که مادهایش بازی را تغییر می‌دهند یک کد پیوستن می‌گیرد که با کسانی که با آن‌ها بازی می‌کنید مقایسه می‌کنید. نسخه‌ای که با ابزار تقلب یا آزمایش ساخته شده بررسی می‌کند که همهٔ بازیکنان مسابقه همان بیلد را داشته باشند، و اگر نداشتند مسابقه را رها می‌کند. در مسابقه‌های چندنفره و همکاری، RUSE Guard همچنین دنبال ابزارهای تقلب شناخته‌شده می‌گردد که روی رایانهٔ شما اجرا می‌شوند. و دیده‌بان هر نسخه روی صفحه نشان می‌دهد که یک مسابقه فرمان ایجاد یگان (spawn) یا جهش ناگهانی پول یک طرف را می‌بیند.
چرا الزامی است: RUSE Guard برای استفاده از برنامه‌های ما الزامی است. R.U.S.E. ضدتقلب مؤثری ندارد، و برای همین RUSE Guard لازم است: به دور نگه داشتن تقلب از مسابقه‌های چندنفره کمک می‌کند، و مسابقه‌های عادلانه برای ما و برای هر بازیکنی که با او روبه‌رو می‌شوید مهم است. ما به چیزی تکیه می‌کنیم که قانون حفاظت از داده‌ها «منفعت مشروع» می‌نامد: مسابقه‌های عادلانه برای همهٔ بازیکنان، که تا وقتی حریم خصوصی شما بر آن چربش نداشته باشد به اجازهٔ شما نیاز ندارد (بخش 11). برای همین مثل Bug Watch یک تیک نیست: Studio و Launcher، همان‌طور که ما منتشر می‌کنیم، همیشه آن را دارند. باز هم می‌توانید هر زمان اعتراض کنید (بخش 11).
- کجا عمل می‌کند: RUSE Guard در هر نسخهٔ مادشده‌ای که برنامه‌ها می‌سازند هست، و «بازی اصلی» در Launcher هم چنین نسخه‌ای می‌سازد، بدون ماد (بخش 10). قفل و بررسی برنامه‌هایش فقط در مسابقه‌های چندنفره و همکاری عمل می‌کنند، و رکوردهای مسابقه‌اش هم، وقتی شروع شوند، چنین خواهند بود (در پایین). دیده‌بانش، که آن هم در هر نسخهٔ مادشده هست، مسابقه‌های چندنفره، همکاری و نبرد آزاد در برابر رایانه را زیر نظر دارد: می‌تواند وقتی پول یک طرف یک‌دفعه 400 یا بیشتر بالا می‌پرد، یا وقتی یگانی با فرمان ایجاد (spawn) ساخته می‌شود، روی صفحهٔ خودتان اعلانی نشان دهد. در یک مسابقهٔ چندنفره، صفحهٔ هر بازیکن می‌تواند آن را نشان دهد. دیده‌بان چیزی را در مسابقه تغییر نمی‌دهد و چیزی نمی‌فرستد. فقط Launcher برای RUSE Guard چیزی می‌فرستد؛ Studio هرگز نمی‌فرستد، و «آزمایش در بازی» در آن هیچ بررسی برنامه‌ای انجام نمی‌دهد.
- فهرست: فهرست ابزارهای تقلب شناخته‌شدهٔ RUSE Guard داخل برنامه می‌آید، به شکل یک فایل ساده که می‌توانید بخوانید، و فقط با به‌روزرسانی برنامه تغییر می‌کند. برای آن چیزی دانلود نمی‌شود.
- بررسی برنامه‌ها: در یک مسابقهٔ چندنفره یا همکاری که از Launcher شروع شده باشد، RUSE Guard هر 30 ثانیه نام برنامه‌هایی را که روی رایانهٔ شما اجرا می‌شوند نگاه می‌کند، و فقط نام‌هایی را نگه می‌دارد که در فهرستش باشند. برای این‌که بداند چنین مسابقه‌ای در جریان است، Launcher در حین اجرای بازی خروجی خطای خود بازی را می‌خواند: فقط خطوط کوتاه RUSE Guard را نگه می‌دارد که می‌گویند مسابقه‌ای در جریان است یا تمام شده، و هر خط دیگر را همین‌که می‌خواند دور می‌ریزد، هرگز نگهش نمی‌دارد یا نمی‌فرستد (آن خروجی می‌تواند خطوط خود Steam را هم داشته باشد، که یکی از آن‌ها شمارهٔ حساب Steam شماست). اگر بازی نگوید که مسابقه تمام شده، بررسی دو دقیقه پس از آخرین باری که بازی گفت مسابقه در جریان است متوقف می‌شود. اگر برنامه‌ای از فهرست در طول مسابقه در حال اجرا بوده باشد، Launcher پس از بازی یک گزارش کوتاه برای سرور ما می‌فرستد: نام کاربری و کلید RUSE Guard شما، زمان شروع و پایان مسابقه، چندنفره بود یا همکاری، و نام برنامه‌های فهرست‌شدهٔ پیداشده. چیز دیگری در آن نیست: نه بازپخش، نه فایل، و نه چیز دیگری دربارهٔ مسابقه. اگر هیچ برنامهٔ فهرست‌شده‌ای در حال اجرا نبود، چیزی فرستاده نمی‌شود.
- کد پیوستن: برای یک نسخهٔ مادشده که مادهایش شیوهٔ بازی را تغییر می‌دهند، Launcher یک کد پیوستن نشان می‌دهد. این کد نمایندهٔ نسخهٔ بازی آن نسخه، مادهایش با نسخه‌هایشان، و آنچه در شیوهٔ بازی تغییر می‌دهند است. کدهای پیوستن را با کسانی که با آن‌ها بازی می‌کنید مقایسه می‌کنید. ما امروز آن‌ها را دریافت نمی‌کنیم؛ یک رکورد مسابقه (در پایین) آن‌ها را می‌برد.
- نسخه‌های ساخته‌شده با ابزار تقلب یا آزمایش: چنین نسخه‌ای فقط با بازیکنانی چندنفره و همکاری بازی می‌کند که بیلدشان یکی است (همان نسخهٔ بازی و همان مادها، در همان نسخه‌ها). حدود یک ثانیه پس از شروع هر چنین مسابقه‌ای، یک کد کوتاه برای بیلد خود (کد بیلدش) را به بازی هر بازیکن می‌گوید، که از نسخهٔ بازی، مادها با نسخه‌هایشان به ترتیبشان، و آنچه در شیوهٔ بازی تغییر می‌دهند ساخته می‌شود. هیچ نام یا حسابی در آن نیست. اگر همهٔ بازیکنان همان بیلد را داشته باشند، مسابقه طوری ساخته شده که ادامه یابد؛ هنوز هیچ‌کس چنین مسابقه‌ای را با دو نفر بازی نکرده است. اگر نه، چند ثانیه پس از شروع مسابقه را رها می‌کند.
  در یک مسابقهٔ چندنفرهٔ بدون رتبه، پس از آن بازی را عمداً در صفحهٔ پایان همان مسابقه متوقف می‌کند: بازی خراب (کرش) می‌شود و به دسکتاپ برمی‌گردد. آن‌گاه گزارش‌گر خرابی خود بازی می‌تواند گزارشش را برای سازندهٔ بازی بفرستد، و آن گزارش خط RUSE Guard را دارد که می‌گوید یک نسخهٔ تقلب متوقف شد. در مسابقه‌های همکاری و رتبه‌دار فقط مسابقه را رها می‌کند. وقتی Launcher بازی را شروع کرده و هنگام توقف بازی هنوز باز است، فقط خط RUSE Guard را از گزارش خرابی بازی روی رایانهٔ شما برمی‌دارد و یک یادداشت کوتاه برای سرور ما می‌فرستد که یک نسخهٔ تقلب متوقف شد، با نام کاربری و کلید RUSE Guard شما، همراه با زمان نوشته شدن گزارش خرابی و زمان ساخته شدن یادداشت. آن خط فقط نوع مسابقه و شمارهٔ طرف شما در آن را می‌گوید؛ هر شناسهٔ Steam، عدد طولانی یا مسیری از آن حذف می‌شود. برنامه‌های ما هرگز خود گزارش خرابی را نمی‌فرستند. این یادداشت هیچ بررسی‌ای باز نمی‌کند و دربارهٔ چیزی تصمیم نمی‌گیرد؛ برای دیده شدن توسط sneadtristen6 فهرست می‌شود. اگر Launcher پیش از توقف بازی بسته شده باشد، یا اگر بازی از Studio یا با دست شروع شده باشد، یادداشتی فرستاده نمی‌شود. در Linux و Steam Deck هنوز معلوم نیست یادداشت فرستاده می‌شود یا نه.
  نسخه‌های درستکار هرگز متوقف نمی‌شوند.
- کلید RUSE Guard شما: اولین باری که Launcher روی رایانهٔ شما یک رکورد RUSE Guard می‌سازد، همان‌جا یک کلید تصادفی می‌سازد. کدی که از این کلید ساخته می‌شود (نیمهٔ عمومی آن) همراه هر رکورد می‌رود، تا بتوانیم رکوردهای شما را از رکوردهای کسی با همان نام کاربری جدا کنیم و بررسی کنیم که تغییر نکرده باشند. چیز دیگری دربارهٔ شما نمی‌گوید. «تنظیمات» یک کد کوتاه ساخته‌شده از آن را نشان می‌دهد، «کد RUSE Guard شما»: آن را همراه یک درخواست حریم خصوصی بفرستید، و ما می‌توانیم رکوردهای RUSE Guard خودتان را پیدا کنیم. برای آن چیز بیشتری فرستاده نمی‌شود.
- هنوز فعال نیست: رکوردهای مسابقه. آن‌ها به رکوردی از مسابقه نیاز دارند که بازی امروز نمی‌تواند بنویسد. پیش از شروعشان، این متن را به‌روز می‌کنیم و برنامه‌ها آن را دوباره به شما نشان می‌دهند. وقتی شروع شوند، یک رکورد مسابقه این‌ها را می‌برد: نام کاربری و کلید RUSE Guard شما؛ طرف شما؛ کدهای نسخهٔ شما؛ بررسی‌های فایل‌های بازی که نسخهٔ شما تغییر داده، و بررسی‌های منظم که بازی هر بازیکن همان می‌ماند؛ مادهای شما با بررسی‌هایشان؛ این‌که مادهای شما کدام فرمان‌های اسکریپت را به کلیدها می‌بندند (هرگز آنچه می‌زنید)؛ برای نسخهٔ آزمایشی یک توسعه‌دهنده، کلید آن توسعه‌دهنده؛ نام هر ابزار تقلب فهرست‌شده که در حال اجرا پیدا شده؛ زمان شروع و پایان مسابقه؛ و تازه‌ترین بازپخشی که در طول مسابقه یا درست پس از آن روی رایانهٔ شما ذخیره شده، با نام فایلش. یک بازپخش هر فرمانی را که هر بازیکن در مسابقه داده در خود دارد، و نام فایل و محتویاتش می‌تواند نام‌های درون‌بازی شما و بازیکنان دیگر را داشته باشد.
- آنچه هرگز نمی‌کند: هرگز صفحه یا کلیدهای فشردهٔ شما را جمع نمی‌کند، هرگز وقتی برنامه‌های دیگر اجرا می‌شوند درونشان را نگاه نمی‌کند، و هرگز فایل‌هایتان را برای ما نمی‌فرستد، جز بازپخشی که یک رکورد مسابقه می‌برد. از گزارش‌های خرابی بازی، فقط خط خودش دربارهٔ نسخهٔ تقلبی را که متوقف کرده (بالا)، روی رایانهٔ شما می‌خواند.
- نسخه‌های آزمایشی توسعه‌دهندگان: برنامه‌ها طوری ساخته شده‌اند که نسخهٔ آزمایشی یک توسعه‌دهنده را با یک کلید ویژه از ما وارد مسابقه کنند، تنها راه عبور از قانون نسخهٔ تقلب. هنوز هیچ‌کدام کار نمی‌کند: برنامه‌ها امروز نمی‌توانند چنین کلیدی را بررسی کنند.
- تصمیم‌ها دربارهٔ شما: هیچ ممنوعیت خودکاری نیست. هیچ تصمیمی دربارهٔ تقلب فقط با یک ماشین گرفته نمی‌شود: sneadtristen6 شواهد را نگاه می‌کند، و بازپخش را وقتی هست، و تصمیم می‌گیرد. Claude از Anthropic، یک دستیار هوش مصنوعی، به او کمک می‌کند رکوردهای RUSE Guard را بخواند، زیر شرایط خود Anthropic؛ تصمیم‌ها با اوست. رکوردی که نام یک ابزار تقلب فهرست‌شده را ببرد برای او یک بررسی باز می‌کند، که تا او تصمیم نگیرد چیزی را تعیین نمی‌کند. می‌توانید تا 30 روز پس از یک تصمیم درخواست تجدیدنظر بدهید (بخش 17)؛ sneadtristen6 تنها کسی است که پرونده‌ها را بررسی می‌کند، پس خودش هم دربارهٔ درخواست‌های تجدیدنظر تصمیم می‌گیرد. تنها قانون خودکار همان قانون نسخهٔ تقلب در بالاست. این قانون از نسخه‌ای می‌آید که خودتان ساختنش را برگزیده‌اید، و هرگز به حساب Steam یا بازی نصب‌شدهٔ شما دست نمی‌زند.
- معنای یک تصمیم امروز: اگر تقلب تأیید شود، آن تصمیم را زیر نام کاربری شما در فهرست بازیکنان علامت‌خورده نگه می‌داریم، و هنگام بررسی مسابقه‌های بعدی از آن استفاده می‌کنیم. چون دو بازیکن می‌توانند یک نام کاربری داشته باشند، به این هم نگاه می‌کنیم که رکوردها با کدام کلید RUSE Guard آمده‌اند. سرور RUSE Guard ما آن فهرست را نگه می‌دارد، هر نام کاربری علامت‌خورده را با کلید RUSE Guard که رکوردهایش اول با آن آمد، و فقط به Launcher خودِ آن بازیکن می‌گوید که علامت خورده است. برنامه‌ها هنوز به یک علامت واکنشی نشان نمی‌دهند. اگر نسخه‌ای بعدی چنین کند، مثلاً برای دور نگه داشتن نسخه‌های مادشدهٔ یک بازیکن علامت‌خورده از مسابقه‌های چندنفره از راه R.U.S.E. 2.0، این متن اول آن را می‌گوید. اگر درخواست تجدیدنظر پذیرفته شود، تصمیم «لغوشده» علامت می‌خورد و نام کاربری از فهرست بیرون می‌رود.
- رکوردها چه مدت نگه داشته می‌شوند، و حقوق شما: بخش 11.

7. Bug Watch: به ما کمک کنید باگ‌ها را پیدا و درست کنیم (اختیاری، توصیه‌شده)
چرا: تا Studio و Launcher بهتر کار کنند، و خرابی‌ها زودتر درست شوند: به جای این‌که منتظر بمانیم کسی خرابی را گزارش کند، خودمان آن را و آنچه به آن انجامید می‌بینیم.
بر چه پایه‌ای: فقط با موافقت شما (رضایت شما، بخش 11). تا تیکش را نزنید خاموش است. ذخیره یا تغییر نام کاربری شما هرگز آن را روشن یا خاموش نمی‌کند. تیک زدن آن چیز دیگری را در برنامه‌ها تغییر نمی‌دهد، جز آنچه Launcher پس از خرابی بازی به شما می‌گوید (در پایین). وقتی برنامه‌ها پس از یک تغییر این شرایط را دوباره نشان می‌دهند: اگر Bug Watch روشن باشد، کادرش می‌پرسد «Bug Watch روشن بماند؟»، با تیک؛ تیک را بگذارید تا روشن بماند، یا بردارید تا خاموش شود. اگر خاموش باشد، کادر Bug Watch دوباره می‌آید، بدون تیک.
تا وقتی روشن است، Studio و Launcher برای سرور ما می‌فرستند:
- روزی یک بار، شمارش‌های هر روزی که تمام شده است:
  - برنامه و نسخه‌اش؛ روز؛ این‌که Windows 10 دارید یا 11؛ زبان برنامه؛ نسخهٔ بازی؛ این‌که RUSE Guard در آن ساخته شده یا نه؛ کدام نسخه از این شرایط را پذیرفته‌اید؛
  - هر بخش از برنامه چند بار به کار رفته و کارها چقدر طول کشیده‌اند؛ چه چیزی و کجا خراب شده (فقط در کد خودمان؛ وقتی اسکریپت یکی از صفحه‌های Studio خطا می‌دهد، نام آن صفحه و نوع خطا، هرگز متن، فایل یا خط آن)؛ برای هر کار طولانی، مثل ساختن یک ماد، چند بار تمام شده یا شکست خورده، و چند ساخت در مادها اشتباه پیدا کرده‌اند؛
  - فهرست شکست‌های آن روز، حداکثر 20 مورد، هر کدام با کدش (کدام جا در کد ما)، این‌که «بازی» یا «آزمایش در بازی» تا کجا پیش رفت، شکل مجموعهٔ مادها (چند ماد از فهرست ما، پوشه‌های ماد و فایل‌های ماد خودتان، به صورت شمارش)، و در کنارش فقط عددهایی که نام هیچ‌کس را نمی‌آورند: شمارهٔ خطای Windows (مثل پر بودن دیسک)، پاسخ سرور وب (مثل 404)، شمارهٔ خروج بازی، یک شمارش و یک کد دوم؛
  - چند به‌روزرسانی ارائه، نصب یا ناموفق شده‌اند؛ برنامه چند بار خراب شده است؛ کدام بررسی‌های عیب‌یاب مشکلی پیدا کرده‌اند؛
  - کدام مادها از فهرست ما روشن بوده‌اند؛ در مجموع چند دقیقه بازی کرده‌اید، و با هر یک از آن مادها چند دقیقه؛
  - چند ماد از خودتان داشته‌اید، و چه نوع چیزهایی در آن‌هاست، مثل یگان‌ها، نقشه‌ها، مأموریت‌ها یا اسکریپت‌ها (به نوع شمرده می‌شوند، هرگز نامشان نه، و هرگز متن‌ها، مسیرها یا فایل‌هایشان نه)؛
- بی‌درنگ، وقتی یک برنامه خراب می‌شود: نوع خطا و کجا در کد خودمان؛
- بی‌درنگ، پس از خراب شدن بازی‌ای که برنامه شروع کرده، جزئیات فنی این‌که کجا و چگونه خراب شد:
  - کد خطای بازی؛ نام فایلی که در آن متوقف شد (این می‌تواند بخشی از Windows، یک درایور، یا برنامهٔ دیگری باشد که در بازی بارگذاری شده، مثل یک overlay)، کجای آن بازی متوقف شد، و تا 16 جا در بازی که به آنجا رسید؛
  - برای یک خطای حافظه، بازی می‌خواست چه کاری بکند (خواندن، نوشتن یا اجرا) و جای آن در حافظه؛
  - برای یک خطای اسکریپت، متن خطای خود بازی، با مسیرهای روی یک درایو که به نام فایل کوتاه شده‌اند، نام پوشهٔ کاربر شما پنهان شده (نام پوشه‌های درون آن می‌تواند بماند)، و شمارهٔ حساب Steam و شماره‌های بلند دیگر برداشته شده (نام اسکریپت‌های خود بازی می‌ماند)؛ بازی چند خطای قبلی را رد کرده بود؛ و نقشه (یکی از نقشه‌های خود بازی با نامش، نقشهٔ یک ماد فقط به صورت «نقشهٔ یک ماد»);
  - یگانی که بازی می‌ساخت، وقتی برنامه‌ها بتوانند آن را از گزارش خرابی بازی بخوانند (یکی از یگان‌های خود بازی با شماره‌اش، یگان یک ماد فقط به صورت «یگان یک ماد»);
  - کدام مادها روشن بودند، چه نوع چیزهایی در مادهای خودتان است (به نوع شمرده می‌شوند)، و کدام نسخه از این شرایط را پذیرفته‌اید.
Bug Watch فقط از گزارش‌های خرابی خود بازی استفاده می‌کند. از گزارش برنامهٔ دیگری فقط نام فایل‌هایی را می‌خواند که آن گزارش فهرست می‌کند، تا بفهمد مال بازی نیست؛ چیزی از آن فرستاده نمی‌شود.
هر ارسال نام کاربری و شناسهٔ نصب شما را می‌برد، یک کد تصادفی که روی رایانهٔ شما وقتی اول نام کاربری‌تان را انتخاب کردید ساخته شد، چه Bug Watch را تیک بزنید چه نه. کد گزارش شما، که «تنظیمات» تا وقتی Bug Watch روشن است نشان می‌دهد، 8 نویسهٔ اول شناسهٔ نصب شماست.
برنامه‌های ما هرگز فایل‌های شما یا خود فایل‌های گزارش خرابی بازی را نمی‌فرستند، و Bug Watch شمارهٔ حساب Steam نمی‌فرستد. (گزارش‌گر خرابی خود بازی می‌تواند گزارش خودش را برای سازندهٔ بازی بفرستد: بخش 3.) متن خطای بازی می‌تواند نام‌هایی از بازی یا از اسکریپت‌های یک ماد داشته باشد. لطفاً نام واقعی خود را نام کاربری نکنید (بخش 9).
خرابی‌هایی که می‌شناسیم: با Bug Watch روشن، اگر بازی به یکی از شیوه‌هایی که می‌شناسیم خراب شود، Launcher به زبان شما می‌گوید بازی کدام یگان را می‌ساخت و چرا. آن توضیح فقط به شما نشان داده می‌شود، هرگز فرستاده نمی‌شود؛ گزارش Bug Watch یگان را فقط همان‌طور که در بالا آمد می‌برد (یک شماره، یا «یگان یک ماد»). برای شناختن آن خرابی‌ها، برنامه‌ها فهرست آن‌ها را وقتی بازی شروع می‌شود از سرور Bug Watch ما دانلود می‌کنند، مگر این‌که فهرست روی رایانهٔ شما کمتر از یک روز عمر داشته باشد، و یک بار دیگر هنگام یک خرابی اگر فهرست قابل استفاده‌ای نباشد. فقط وقتی Bug Watch روشن است دانلود می‌کنند، آن را روی رایانهٔ شما نگه می‌دارند، فقط اگر امضای ما را داشته باشد از آن استفاده می‌کنند، و گزارش خرابی شما را روی رایانهٔ خودتان با آن مقایسه می‌کنند. دانلود چیزی دربارهٔ شما نمی‌برد. بدون فهرست (مثلاً بار اول، یا بدون اینترنت)، Launcher باز هم به شما می‌گوید بازی خراب شد، اما نه یگان یا دلیل را. برداشتن تیک Bug Watch فهرست را از رایانهٔ شما پاک می‌کند.
با Bug Watch روشن یا خاموش: اگر بازی‌ای که Launcher شروع کرده خراب شود، Launcher یک کد خرابی کوتاه به شما نشان می‌دهد که روی رایانهٔ شما از جایی که بازی متوقف شد ساخته می‌شود. به جایی فرستاده نمی‌شود. دکمهٔ «کپی کد» آن را کپی می‌کند. اگر کمک می‌خواهید، کد و یک اسکرین‌شات از پیام را برای XUL در Discord (XUL6x3) یا در GitHub بفرستید، و ما آن را در فهرست خودمان پیدا می‌کنیم. کد فقط می‌گوید بازی کجا متوقف شد.
«تنظیمات» شمارش‌های امروز را کلمه به کلمه، همان‌طور که فرستاده می‌شوند، و نام گزارش‌های منتظر ارسال را به شما نشان می‌دهد. گزارش‌هایی که نمی‌شود فرستاد تا 30 روز روی رایانهٔ شما منتظر می‌مانند، بعد کنار گذاشته می‌شوند. وقتی بازی‌ای که برنامه اجرا کرده در حال اجراست، Bug Watch یک یادداشت کوچک هم درباره‌اش روی رایانهٔ شما نگه می‌دارد تا برنامه در اجرای بعدی بفهمد بازی از کار افتاده یا نه: کی شروع شد و آخرین بار کی در حال اجرا دیده شد، مادهایش (مادهای ما با نام و نسخه، بقیه فقط به صورت شمار) و این‌که نسخه و بازی کجا نصب شده‌اند (یک پوشهٔ Windows ممکن است نام کاربری Windows شما را داشته باشد). این یادداشت هرگز فرستاده نمی‌شود و پس از 30 روز، یا همان لحظه که تیک Bug Watch را بردارید، پاک می‌شود.
چه کسی آن را می‌بیند: برنامه‌نویسان ما. Cloudflare آن را روی سرور Bug Watch ما برایمان نگه می‌دارد. وقتی روشن شود، سرور ما یادداشت‌هایی دربارهٔ مشکلاتی که دنبال می‌کنیم هم در یک مخزن خصوصی GitHub می‌گذارد، فضایی در GitHub که فقط برنامه‌نویسان ما می‌توانند باز کنند. یادداشت‌ها هرگز نام کاربری یا کد گزارش ندارند. برنامه‌نویسان ما از Claude هم، یک دستیار هوش مصنوعی از Anthropic، برای خواندن برخی گزارش‌های خرابی Bug Watch استفاده می‌کنند، زیر شرایط خود Anthropic.
چه مدت: هر گزارش در پاک‌سازی روزانه، پس از این‌که 7 روز آنجا بوده از سرور ما پاک می‌شود، یعنی 7 تا 8 روز پس از رسیدنش. برنامه‌نویسان ما می‌توانند گزارش یک خرابی بسیار جدی را علامت بزنند تا تا وقتی آن خرابی را درست می‌کنند بماند؛ گزارش علامت‌خورده تا وقتی علامت را بردارند، یعنی روزی که آن خرابی درست شود، می‌ماند، و بعد در پاک‌سازی روزانهٔ بعدی می‌رود. آنچه پس از آن می‌ماند، بدون نام کاربری، شناسهٔ نصب یا کد گزارش در آن: مجموع‌های روزانه برای هر نسخهٔ برنامه (مثل «12 ساخت ماد در نسخهٔ 0.9.9 در آن روز ناموفق بود») و روزی که هر نسخه و هر نوع خطا اول دیده شد، بدون محدودیت زمانی؛ و یادداشت‌های سرور ما دربارهٔ مشکلاتی که پیدا می‌کند (کدام بخش یک برنامه، کدام ماد از فهرست ما، کجا یک خرابی رخ داد، و چند بار)، تا 3 روز پس از بستن آن مشکل توسط ما. در 7 روز اول، در روزی که فقط یک نفر از یک نسخه استفاده کرده، مجموع‌هایش شمارش‌های همان یک نفر است؛ پس از آن، نسخه‌ای یا مادی از فهرست ما که در آن روز کمتر از 3 نصب از آن استفاده کرده باشند فقط به صورت «(other)» نگه داشته می‌شود. یادداشت‌های GitHub می‌مانند تا ما پاکشان کنیم. Cloudflare تاریخچه‌ای از پایگاه‌های داده‌مان را 7 روز نگه می‌دارد، پس آنچه پاک می‌کنیم تا 7 روز دیگر در آن تاریخچه می‌ماند. نسخه‌های روی رایانهٔ sneadtristen6: بخش 11، «کجا نگه داشته می‌شود».
هر زمان آن را در «تنظیمات» (یا در کادر Bug Watch وقتی برنامه‌ها این شرایط را نشان می‌دهند) خاموش کنید. از آن پس چیزی شمرده یا فرستاده نمی‌شود، و برنامه‌ها شمارش‌های Bug Watch و گزارش‌های منتظر ارسال را پاک می‌کنند. نام کاربری و شناسهٔ نصب شما روی رایانهٔ شما می‌مانند، چون RUSE Guard نام کاربری شما را به کار می‌برد. هیچ چیزی که پیش از خاموش کردنش ساخته شده بعداً فرستاده نمی‌شود، حتی اگر دوباره تیکش را بزنید. خاموش کردن چیزی به سرور ما نمی‌گوید: آنچه قبلاً به آن رسیده همان‌طور که در بالا آمد پاک می‌شود. برای پاک شدن زودتر، کد گزارش خود را برایمان ایمیل کنید («تنظیمات» آن را فقط تا وقتی Bug Watch روشن است نشان می‌دهد، پس پیش از خاموش کردن آن را یادداشت کنید)، یا اگر کد را ندارید نام کاربری‌تان را: ما گزارش‌های نصب شما را با آن پیدا و پاک می‌کنیم. مجموع‌ها و یادداشت‌های بالا می‌مانند. خاموش کردن آنچه پیش‌تر فرستاده شده را لغو نمی‌کند.

8. ورود با Steam (اختیاری)
چرا: تا تأیید کنیم R.U.S.E. را دارید، برای بازی آنلاین، RUSE Guard و دانلود محتوا در آینده. فعلاً چیزی به آن نیاز ندارد.
بر چه پایه‌ای: شما آن را می‌خواهید (بخش 11). برنامه‌ها ممکن است هنگام شروع آن را پیشنهاد دهند، و «تنظیمات» Launcher هر زمان آن را باز می‌کند.
- در صفحهٔ خود Steam در مرورگرتان وارد می‌شوید، در نشانی‌ای که خود برنامه می‌سازد. ما هرگز گذرواژهٔ شما را نمی‌بینیم.
- بعد Steam شناسهٔ Steam شما را به سرور ما می‌گوید. سرور ما از Steam می‌پرسد آیا آن حساب R.U.S.E. را دارد (این فقط وقتی کار می‌کند که جزئیات بازی‌های Steam شما عمومی باشد)، از پاسخ استفاده می‌کند، و شناسه را ذخیره نمی‌کند. اگر آن را دارید، سرور ما به رایانهٔ شما یک مجوز ورود می‌دهد (کدی که نشان می‌دهد بررسی موفق بوده)، که 30 روز معتبر است.
- آنچه سرور ما نگه می‌دارد: یک کد یک‌طرفه که از شناسهٔ Steam شما با یک راز از ما ساخته می‌شود، و زمان صدور مجوز ورود شما و زمان انقضایش، تا 30 روز پس از انقضای مجوز ورود شما. کد کوتاه‌مدتی که برنامهٔ شما برای گرفتن مجوز ورود به کار می‌برد (کد ورود) فقط به شکل درهم‌ریخته نگه داشته می‌شود؛ پس از 10 دقیقه منقضی می‌شود و وقتی برنامه آن را می‌گیرد، یا در حدود یک ساعت پس از انقضایش، پاک می‌شود. شماره‌های یک‌بارمصرف ورود Steam جلوی تکرار یک ورود را می‌گیرند؛ یک روز نگه داشته می‌شوند، حتی وقتی ورودی ناموفق است، و بعد در حدود یک ساعت پاک می‌شوند. کد ما هرگز نشانی IP شما را ذخیره نمی‌کند.
- کجا: پایگاه‌های داده سرورهای ما را Cloudflare در شرق آمریکای شمالی نگه می‌دارد.
- آنچه رایانهٔ شما نگه می‌دارد: مجوز ورود، در تنظیمات برنامه‌ها، تا وقتی در «تنظیمات» خارج شوید، که آن را پاک می‌کند. یک مجوز ورود منقضی‌شده هم تا آن موقع می‌ماند.
- اگر جزئیات بازی‌های Steam شما خصوصی باشد، Steam نمی‌تواند به ما بگوید. «جزئیات بازی» را برای یک دقیقه روی «عمومی» بگذارید، بعد دوباره تلاش کنید.
- R.U.S.E. 2.0 با Valve وابستگی ندارد و Valve آن را تأیید نکرده است. Valve ورود شما را زیر سیاست حریم خصوصی خودش اداره می‌کند.

9. نام کاربری شما
چرا: تا بدانیم گزارش خرابی یا رکورد مسابقه مال کیست، و بتوانیم به آن شخص کمک کنیم. همه در اولین شروع یکی انتخاب می‌کنند، چون RUSE Guard الزامی است. یک # و چهار رقم تصادفی اضافه می‌شود، مثل Nick#4821. باز هم ممکن است دو بازیکن یک نام داشته باشند، پس به کلید RUSE Guard یا کد گزارش شما هم نگاه می‌کنیم. لطفاً نام واقعی، نام Steam یا هر چیز دیگری را که شما را مشخص می‌کند به کار نبرید. فقط با رکوردهای RUSE Guard شما و، اگر Bug Watch روشن باشد، گزارش‌های Bug Watch شما فرستاده می‌شود. یک نام کاربری برای هر دو برنامه کار می‌کند. می‌توانید آن را در «تنظیمات» تغییر دهید؛ تغییر آن هرگز Bug Watch را روشن یا خاموش نمی‌کند. رکوردهایی که پیش‌تر فرستاده شده‌اند تا وقتی پاک شوند نام قبلی را نگه می‌دارند. برای پاک شدن نام کاربری و داده‌های زیر آن، برایمان ایمیل بفرستید.

10. عنوان و ویدیوی آغازین R.U.S.E. 2.0 (اختیاری)
نسخه‌هایی که Launcher و Studio می‌سازند عنوان خود بازی و ویدیوی لوگوی Eugen را نشان می‌دهند. اگر کادر صفحهٔ اول را تیک بزنید، یا «استفاده از عنوان طلایی و ویدیوی آغازین R.U.S.E. 2.0» را زیر «عنوان بازی» در «تنظیمات»، آن نسخه‌ها R.U.S.E. 2.0 را به رنگ طلایی در منوی اصلی و صفحه‌های بارگذاری نشان می‌دهند، و ویدیوی آغازین ما هنگام شروع بازی به جای ویدیوی لوگوی Eugen پخش می‌شود. عنوان طلایی روی رایانهٔ شما از فایل‌های بازی خودتان ساخته می‌شود، روی یک تصویر صحنهٔ نبرد که همراه برنامه‌ها می‌آید. ویدیوی آغازین یک صدای موتور هم به کار می‌برد که همراه برنامه‌ها می‌آید. فقط نسخهٔ مادشدهٔ شما را تغییر می‌دهد، هرگز بازی نصب‌شدهٔ شما را، و هر زمان می‌توانید آن را در «تنظیمات» تغییر دهید. در Launcher، «بازی اصلی» نسخه‌ای جدا و بدون ماد می‌سازد، با RUSE Guard در آن مثل هر نسخه، و با عنوانی که برگزیده‌اید.

11. اعلامیهٔ حریم خصوصی
این اعلامیه بخشی از این توافق است. همین متن در صفحهٔ GitHub ما عمومی است، در https://github.com/sneadtristen6/R.U.S.E-2.0-Project/blob/main/PRIVACY.md، تا هر کسی بتواند آن را بخواند، از جمله بازیکنانی که از برنامه‌های ما استفاده نمی‌کنند. از 26 نوامبر 2026 اجرا شده است.

چه کسی مسئول داده‌های شماست
R.U.S.E. 2.0 را یک نفر اداره می‌کند، sneadtristen6، که در ایالات متحده زندگی می‌کند. او تصمیم می‌گیرد برنامه‌ها و سرورهای ما با داده‌های شما چه کنند، پس بر پایهٔ قانون حفاظت از داده‌ها (در اتحادیهٔ اروپا و بریتانیا، GDPR) او مسئول آن است: «کنترل‌کننده». ایمیل، برای درخواست‌های حریم خصوصی: sneadtristen6@gmail.com. می‌توانید در Discord یا GitHub ما هم به او برسید؛ برای هر چیز شخصی از ایمیل یا پیام خصوصی استفاده کنید، چون تیکت‌های GitHub و کانال‌های Discord را دیگران می‌توانند بخوانند. فقط او رکوردهای RUSE Guard را بررسی می‌کند و دربارهٔ آن‌ها تصمیم می‌گیرد. ما در اتحادیهٔ اروپا یا بریتانیا نماینده نداریم.

از چه چیزی استفاده می‌کنیم، چرا، و بر چه پایه‌ای
- RUSE Guard (بخش 6): برای عادلانه نگه داشتن مسابقه‌های چندنفره و همکاری. پایه: منفعت مشروع ما، و بازیکنان دیگر، در مسابقه‌های عادلانه (GDPR ماده 6(1)(f))، نه رضایت شما.
- Bug Watch (بخش 7)، فقط اگر تیکش را بزنید: برای پیدا کردن و درست کردن خرابی‌ها و باگ‌ها. پایه: رضایت شما (ماده 6(1)(a)).
- ورود با Steam (بخش 8)، فقط اگر از آن استفاده کنید: برای تأیید این‌که R.U.S.E. را دارید. پایه: شما آن را خواسته‌اید (ماده 6(1)(b)).
- کدهای پوشه و تیکت‌های بازگشایی (بخش 5): برای بازگشایی نسخهٔ شما. پایه: شما آن را خواسته‌اید (ماده 6(1)(b)).
- نام کاربری شما (بخش 9): برای دانستن این‌که رکورد یا گزارش مال کیست. پایه: همان رکورد RUSE Guard یا گزارش Bug Watch که همراهش فرستاده می‌شود.
- بررسی و دانلود به‌روزرسانی‌ها (بخش 12): برای کار کردن و امن ماندن برنامه‌ها، و دادن آنچه می‌خواهید. پایه: منفعت مشروع ما (ماده 6(1)(f))، و درخواست شما وقتی یک دکمه را می‌زنید.
- پیام‌ها، تیکت‌ها، ایمیل‌ها و درخواست‌های تجدیدنظری که برایمان می‌فرستید: برای پاسخ دادن به شما. پایه: منفعت مشروع ما در پاسخ دادن به شما (ماده 6(1)(f)).
- حامیان Patreon: Patreon پرداخت شما را زیر سیاست حریم خصوصی خودش اداره می‌کند. ما فقط آنچه Patreon زیر آن سیاست با سازندگان به اشتراک می‌گذارد می‌بینیم، و نام سپاس را فقط اگر با اجازهٔ شما بفرستید منتشر می‌کنیم. پایه: دادن تشکری که برگزیده‌اید (ماده 6(1)(b))؛ یک نام عمومی فقط با اجازهٔ شما (ماده 6(1)(a)).
- نشانی IP شما: هر سروری که رایانهٔ شما به آن وصل می‌شود آن را می‌بیند. کد خود سرورهای ما هرگز آن را ذخیره نمی‌کند؛ Cloudflare، که سرورهای ما را اداره می‌کند، برای رساندن و محافظت از هر اتصال آن را اداره می‌کند، زیر سیاست حریم خصوصی خودش، و داشبوردش به ما نشان می‌دهد از هر کشور و شهر چند درخواست آمده است. پایه: منفعت مشروع ما در اداره و محافظت از سرورهایمان (ماده 6(1)(f)).
هیچ قانونی شما را ملزم نمی‌کند چیزی به ما بدهید. برنامه‌ها، همان‌طور که ما منتشر می‌کنیم، به یک نام کاربری نیاز دارند و RUSE Guard را شامل می‌شوند؛ Bug Watch و ورود با Steam انتخاب شماست. هیچ تصمیمی دربارهٔ تقلب فقط با یک ماشین گرفته نمی‌شود. تنها قانون خودکار، قانون نسخهٔ تقلب در بخش 6، روی نسخه‌ای عمل می‌کند که با ابزار تقلب یا آزمایش ساخته شده، هرگز روی حساب Steam شما.

چه کسان دیگری آن را دریافت می‌کنند
- Cloudflare, Inc. (ایالات متحده)، که سه سرور ما را اداره می‌کند و پایگاه‌های داده‌شان را برای ما نگه می‌دارد، زیر شرایط پردازش داده‌اش.
- Valve، برای ورود با Steam و بررسی مالکیت (بخش 8).
- GitHub (Microsoft)، که فایل‌ها، تیکت‌ها و بحث‌های ما را نگه می‌دارد، و، وقتی روشن باشد، مخزن خصوصی‌ای که سرور Bug Watch یادداشت‌هایش را در آن می‌گذارد. همچنین آنچه را مرورگر شما وقتی صفحه‌ای را که برنامه‌ها پر کرده‌اند باز می‌کنید می‌فرستد دریافت می‌کند (بخش 12).
- Google، که نشانی ایمیلی را که به آن می‌نویسید اداره می‌کند.
- Discord، که پیام‌هایی را که آنجا برایمان می‌فرستید می‌رساند.
- Anthropic، که دستیار هوش مصنوعی‌اش Claude به ما کمک می‌کند برخی گزارش‌های خرابی Bug Watch و رکوردهای RUSE Guard را بخوانیم، زیر شرایط خود Anthropic.
- بازی دیگر بازیکنان: کد بیلد یک نسخهٔ تقلب یا آزمایش (بخش 6).
- عموم: هر چیزی که در GitHub یا در کانال‌های عمومی Discord می‌گذارید.
- هر کسی که قانون ما را ملزم کند آن را به او بدهیم.
جدا از ما: وقتی بازی خراب می‌شود، گزارش‌گر خرابی خود بازی می‌تواند گزارشش را برای سازندهٔ بازی بفرستد (بخش 3). این مال بازی است، نه ما.
ما داده‌های شما را نمی‌فروشیم یا اجاره نمی‌دهیم، و برای تبلیغات به کار نمی‌بریم یا به اشتراک نمی‌گذاریم. برنامه‌ها هیچ تبلیغی و هیچ سرویس تحلیل یا ردیابی بیرونی ندارند؛ Bug Watch مال خود ماست، و انتخاب شما.

کجا نگه داشته می‌شود
پایگاه‌های داده سرورهای ما را Cloudflare در شرق آمریکای شمالی نگه می‌دارد؛ شبکهٔ Cloudflare آن‌ها را از مراکز داده در سراسر جهان ارائه می‌کند. رکوردهای RUSE Guard برای بررسی روی رایانهٔ خود sneadtristen6 در ایالات متحده جمع می‌شوند. وقتی مشکلی را بررسی می‌کنیم، نسخه‌هایی از گزارش‌های Bug Watch هم می‌توانند روی رایانهٔ او باشند: نسخه‌ای که متعلق به باگی است که درستش می‌کنیم، وقتی آن باگ درست شد پاک می‌شود، و نسخه‌ای که هیچ باگی را نشان نمی‌دهد پس از 7 روز پاک می‌شود. sneadtristen6 در ایالات متحده است، و Cloudflare یک شرکت آمریکایی است، پس داده‌های شما در ایالات متحده و هر جا Cloudflare فعالیت می‌کند اداره می‌شود.

چه مدت نگهش می‌داریم
- رکوردهای RUSE Guard: سرور RUSE Guard ما هر رکورد را نگه می‌دارد تا رایانهٔ بررسی ما آن را بگیرد، و هرگز بیش از 3 روز پس از رسیدنش: بعد پاک می‌شود، گرفته شده باشد یا نه. روی رایانهٔ بررسی، رکوردهای یک مسابقه حدود 48 ساعت پس از رسیدن آخرین رکوردشان پاک می‌شوند (در پاک‌سازی بعدی‌اش، که هر وقت رکوردها را می‌گیرد اجرا می‌شود)، مگر این‌که بررسی آن مسابقه باز باشد. مسابقه‌ای که زیر بررسی است تا تصمیم گرفته شود نگه داشته می‌شود؛ اگر رد شود، بعد پاک می‌شود. اگر تقلب تأیید شود، شما 30 روز از تصمیم برای درخواست تجدیدنظر فرصت دارید: شواهد برای همان 30 روز نگه داشته می‌شوند، و اگر درخواست تجدیدنظر بدهید، تا تصمیم دربارهٔ آن. پس از آن شواهد پاک می‌شوند، و فقط تصمیم نگه داشته می‌شود، تا وقتی که به کار می‌آید. اگر درخواست تجدیدنظر پذیرفته شود، تصمیم «لغوشده» علامت می‌خورد و هرگز علیه شما به کار نمی‌رود؛ بخواهید، و آن را هم پاک می‌کنیم. یادداشت توقف یک نسخهٔ تقلب هیچ بررسی‌ای باز نمی‌کند: برای دیده شدن توسط sneadtristen6 فهرست می‌شود، و مثل هر رکورد پاک می‌شود.
- فهرست نام‌های کاربری و کلیدهای RUSE Guard رایانهٔ بررسی، با زمانی که هر یک اول دیده شد: فعلاً بدون محدودیت زمانی نگه داشته می‌شود؛ ایمیل کنید و مال شما را پاک می‌کنیم.
- رکوردهای RUSE Guard روی رایانهٔ شما: رکوردی که منتظر ارسال است تا وقتی فرستاده شود می‌ماند؛ رکوردی که سرور ما نپذیرفته 30 روز پس از کنار گذاشتنش پاک می‌شود.
- Bug Watch: بخش 7.
- ورود با Steam: بخش 8.
- تیکت‌ها، پیام‌ها و ایمیل‌ها: تا وقتی گفت‌وگو نیاز دارد. تیکت‌های GitHub می‌مانند تا شما یا ما پاکشان کنیم.
- نام‌های سپاس حامیان: در هر انتشار از آن پس. بخواهید، و نام شما را از انتشارهای آینده برمی‌داریم؛ انتشارهای منتشرشده را نمی‌توان تغییر داد.
- پشتیبان‌ها: Cloudflare تاریخچه‌ای از پایگاه‌های داده سرورهای ما را 7 روز نگه می‌دارد (در طرح رایگان ما، همان‌طور که مستندات خود Cloudflare می‌گوید)، پس آنچه پاک می‌کنیم تا 7 روز پس از پاک کردنش در آن تاریخچه می‌ماند.

حقوق شما
می‌توانید از ما یک نسخه از داده‌هایی را که دربارهٔ شما داریم بخواهید؛ تا اصلاحش کنیم؛ تا پاکش کنیم؛ تا وقتی پرسشی دربارهٔ آن حل می‌شود استفاده از آن را متوقف کنیم؛ و داده‌های Bug Watch و نام کاربری‌تان را در فایلی که بتوانید دوباره به کار ببرید. می‌توانید هر زمان با برداشتن تیک Bug Watch رضایت خود را پس بگیرید؛ این آنچه پیش‌تر فرستاده شده را لغو نمی‌کند.
چگونه: به sneadtristen6@gmail.com ایمیل بزنید، یا در Discord یک پیام خصوصی برای sneadtristen6 بفرستید. نام کاربری‌تان را بگویید، کد گزارش‌تان را اگر از Bug Watch استفاده می‌کنید یا کرده‌اید («تنظیمات» آن را فقط تا وقتی Bug Watch روشن است نشان می‌دهد)، و کد RUSE Guard‌تان را («تنظیمات» آن را نشان می‌دهد، با عنوان «کد RUSE Guard شما»)؛ برای ورود با Steam، شناسهٔ Steam‌تان را. سرورهای ما نام واقعی شما را نمی‌خواهند، پس بدون این‌ها ممکن است داده‌هایتان را پیدا نکنیم. اگر مطمئن نباشیم درخواستی مال شماست، ممکن است چیز بیشتری بخواهیم. ظرف یک ماه، رایگان، پاسخ می‌دهیم؛ اگر درخواستی پیچیده باشد، می‌توانیم تا دو ماه بیشتر وقت بگیریم و دلیلش را به شما می‌گوییم.
اگر استفاده از برنامه‌ها را متوقف کنید، می‌توانید از ما بخواهید رکوردهای RUSE Guard شما را پاک کنیم، و می‌کنیم. اگر تقلب زیر نام کاربری شما تأیید شده بود، فقط همان علامت و تصمیمی را که بر آن استوار است نگه می‌داریم: نام کاربری شما، مسابقه، حکم، تاریخ آن و کلید RUSE Guard که علامت با آن آمد. ممکن است آنچه را یک پروندهٔ تقلب هنوز زیر بررسی یا تجدیدنظر نیاز دارد هم نگه داریم.
شکایت‌ها: می‌توانید به مرجع حفاظت از داده‌ها در جایی که زندگی یا کار می‌کنید، یا جایی که فکر می‌کنید مشکل رخ داد، شکایت کنید؛ در فرانسه آن CNIL (cnil.fr) است، در بریتانیا ICO (ico.org.uk). هر کسی می‌تواند اول به خودمان شکایت کند. اگر در بریتانیا هستید، دریافت شکایتتان را ظرف 30 روز تأیید می‌کنیم.

حق اعتراض شما
می‌توانید هر زمان، به دلایلی دربارهٔ وضعیت خودتان، به استفادهٔ ما از داده‌هایتان برای RUSE Guard اعتراض کنید. برایمان ایمیل بزنید. اگر موافقت کنیم، رکوردهای RUSE Guard شما را پاک می‌کنیم، جز یک علامت تقلب و تصمیم آن (همان‌طور که در بالا آمد)، و به شما می‌گوییم RUSE Guard برای استفاده از برنامه‌های ما الزامی است: تنها راه نفرستادن رکوردهای تازه استفاده نکردن از آن‌هاست. ممکن است وقتی دلایل قانع‌کننده‌ای داریم که بر دلایل شما می‌چربد موافقت نکنیم، مثل یک پروندهٔ تقلب که هنوز زیر بررسی یا تجدیدنظر است.

بازیکنان دیگر
امروز RUSE Guard دربارهٔ بازیکنان دیگر مسابقه‌های شما چیزی نمی‌فرستد: نه نام و نه بازپخش. یک نسخهٔ تقلب یا آزمایش فقط یک کد بیلد کوتاه به بازی بازیکنان دیگر می‌گوید. اگر نسخه‌ای بعدی رکوردهای مسابقه یا بازپخش بفرستد، که می‌توانند نام‌های درون‌بازی بازیکنان دیگر را داشته باشند، این متن اول آن را می‌گوید. این اعلامیه عمومی است، پس بازیکنانی که از برنامه‌های ما استفاده نمی‌کنند هم می‌توانند آن را بخوانند. هر کسی می‌تواند بپرسد زیر نام درون‌بازی‌اش چه داریم، و حقوق بالا مال آن‌ها هم هست.

ردیابی
برنامه‌ها آنچه را در وب‌سایت‌ها یا برنامه‌های دیگر می‌کنید دنبال نمی‌کنند، و هیچ شبکهٔ تبلیغاتی یا ردیاب بیرونی دیگری ندارند. برنامه‌ها مرورگر وب نیستند، پس سیگنال «Do Not Track» مرورگر را نمی‌خوانند؛ انتخاب‌های شما تیک Bug Watch است و این‌که از ورود با Steam استفاده کنید یا نه.

امنیت
برنامه‌ها فقط از راه اتصال‌های رمزگذاری‌شده به سرورهای ما می‌رسند، و یک به‌روزرسانی را فقط اگر امضای ما را داشته باشد نصب می‌کنند (بخش 12). نشانی صفحهٔ ورود Steam را خودشان می‌سازند. سرور RUSE Guard ما فقط به Launcher خودِ یک بازیکن علامت‌خورده می‌گوید که علامت خورده است. هیچ سیستمی کاملاً امن نیست: اگر چیزی رخ دهد که داده‌های شما را در خطر بیندازد، آن را در صفحهٔ GitHub و Discord خود می‌گوییم، و به مراجع حفاظت از داده‌ها هر جا قانون بخواهد اطلاع می‌دهیم.

آنچه روی رایانهٔ شما می‌ماند
برنامه‌ها تنظیمات و فایل‌های کاریشان را در پوشه‌ای به نام RUSE Mod Platform نگه می‌دارند، درون پوشهٔ AppData\\Local کاربر Windows شما:
- نام کاربری و شناسهٔ نصب شما، کلید RUSE Guard شما، انتخاب‌هایتان، مجوز ورود Steam اگر وارد شده باشید، و کدهای بازگشایی؛
- فهرست Bug Watch از خرابی‌های شناخته‌شدهٔ بازی، تا وقتی Bug Watch روشن است؛
- شمارش‌های Bug Watch که هنوز فرستاده نشده‌اند، و گزارش‌های منتظر ارسال؛
- رکوردهای RUSE Guard منتظر ارسال، و رکوردهایی که سرور ما نپذیرفته (30 روز پس از کنار گذاشتنشان پاک می‌شوند)؛
- گزارش‌هایی از آنچه برنامه‌ها کردند (که می‌توانند نام پوشه‌ها را داشته باشند)؛
- داده‌های مرورگر خود پنجرهٔ برنامه؛
- فایل‌های دانلودشده (نصب‌کنندهٔ یک به‌روزرسانی در شروع بعدی برنامه پس از نصبش پاک می‌شود).
برای دانستن این‌که بازی هنوز از نسخهٔ مادشدهٔ شما اجرا می‌شود یا نه، برنامه‌ها همچنین نگاه می‌کنند چه برنامه‌هایی در حال اجرا هستند و از کجا (این جدا از بررسی برنامه‌های RUSE Guard در بخش 6 است)؛ این روی رایانهٔ شما می‌ماند. وقتی برنامه‌ها گزارش‌های خرابی بازی را می‌خوانند (بخش‌های 6 و 7)، آن را روی رایانهٔ شما می‌کنند و هرگز نمی‌فرستندشان؛ فقط گزارش‌گر خرابی خود بازی می‌تواند گزارشش را برای سازندهٔ بازی بفرستد (بخش 3). هیچ چیز در این پوشه به جایی فرستاده نمی‌شود، مگر همان‌طور که بخش‌های 5 تا 8 و 12 می‌گویند. وقتی دومین برنامه از آن دو را حذف نصب می‌کنید، حذف‌کنندهٔ نصب می‌پرسد این پوشه هم پاک شود یا نه؛ پاسخ از «نه» شروع می‌شود. «بله» آن را پاک می‌کند، جز هر ماد، نقشه، خروجی یا پشتیبانی که نسخه‌ای قدیمی‌تر در آن نگه داشته. تا وقتی برنامهٔ دیگر هنوز نصب است، چیزی نمی‌پرسد و چیزی پاک نمی‌کند، چون هر دو برنامه این پوشه را به کار می‌برند. در غیر این صورت، برای برداشتن آن، خودتان پاکش کنید. مادها، نقشه‌ها، خروجی‌ها و پشتیبان‌های شما در پوشهٔ RUSE 2.0 در Documents، نسخهٔ مادشدهٔ شما، و پشتیبان تمیز بازی شما هم می‌مانند تا پاکشان کنید.

12. به‌روزرسانی‌ها، و سایت‌های دیگری که برنامه‌ها به آن‌ها وصل می‌شوند
- به‌روزرسانی‌ها: پس از پذیرفتن این شرایط، هر دو برنامه در هر بار شروع از GitHub می‌پرسند نسخهٔ تازه‌ای هست یا نه؛ تا وقتی نپذیرفته‌اید، چیزی نمی‌پرسند. اگر به‌روزرسانی‌ای بیرون آمده و زبان شما انگلیسی نیست، برنامه‌ها یادداشت‌هایش را هم از GitHub می‌گیرند. به‌روزرسانی‌های اختیاری وقتی «به‌روزرسانی» را می‌زنید نصب می‌شوند. به‌روزرسانی‌ای که الزامی علامت بزنیم هنگام شروع برنامه، بدون پرسیدن، خودش دانلود و نصب می‌شود، و «بازی» و «آزمایش در بازی» صبر می‌کنند تا نصب شود. در هر دو حالت، یک به‌روزرسانی فقط اگر امضای ما را داشته باشد و دقیقاً همان فایلی باشد که امضا کرده‌ایم نصب می‌شود؛ وگرنه چیزی نصب نمی‌شود، و برنامه این را می‌گوید و شما را به Discord ما راهنمایی می‌کند. اگر دانلودش سه بار شکست بخورد، برنامه خودش از تلاش دست می‌کشد و شما را به صفحهٔ انتشارش در GitHub راهنمایی می‌کند؛ یک به‌روزرسانی الزامی هنوز «بازی» و «آزمایش در بازی» را منتظر نگه می‌دارد. کلید امضای ما هرگز آپلود نمی‌شود. در شروع بعدی پس از یک به‌روزرسانی، برنامه نصب‌کنندهٔ آن به‌روزرسانی را پاک می‌کند. اگر پیش‌تر یگان‌های دوره‌ها را دانلود کرده‌اید، Studio هنگام شروع نسخه‌های تازه‌تر را هم بررسی می‌کند و خودش دانلود می‌کند. فقط تازه‌ترین نسخهٔ هر برنامه اصلاحات می‌گیرد.
- جدا از سرورهای خودمان، برنامه‌ها به این سایت‌ها وصل می‌شوند. هر کدام نشانی IP شما و آنچه را خواسته می‌شود می‌بیند، و ممکن است زیر سیاست حریم خصوصی خودش گزارش نگه دارد:
  - GitHub (Microsoft): به‌روزرسانی‌ها و یادداشت‌هایشان؛ فهرست مادها و مادهای روی آن (اولین شروع Launcher فهرست را درست پس از صفحهٔ شرایط می‌گیرد)؛ یگان‌های دوره‌ها؛ وصله‌های بازی، در ساختی که به یکی نیاز دارد؛ و برخی فایل‌های حرکت؛
  - هر سایت دیگری که فهرست مادهای ما برای یک ماد نام ببرد: دانلود آن ماد (Launcher پیش از آن اندازه و چک‌سام هر فایل را با فهرست می‌سنجد)؛
  - Poly Haven و ambientCG: بافت‌های آنلاین رایگان Map Paint، با تصویرهای کوچکشان که از نشانی‌هایی که آن سایت‌ها می‌دهند بارگذاری می‌شوند (ambientCG کلماتی را که در جست‌وجویش می‌نویسید دریافت می‌کند)؛
  - National Map از U.S. Geological Survey: عکس‌های هوایی (محدودهٔ اطراف جایی را که انتخاب می‌کنید دریافت می‌کند)؛
  - Zenodo، و یک مجموعهٔ عمومی از فایل‌های حرکت در GitHub: حرکت‌ها در RUSE Decoy، زبانهٔ صدا و انیمیشن Studio؛
  - سرور Bug Watch ما: فهرست خرابی‌های شناخته‌شدهٔ بازی، فقط تا وقتی Bug Watch روشن است (بخش 7)؛
  - Steam: صفحهٔ ورود، و پیوندهای خود Steam که Steam را شروع می‌کنند یا فایل‌های بازی را بررسی می‌کنند؛
  - Microsoft: Edge WebView2 پنجره‌های برنامه‌ها را می‌کشد، و آنچه به Microsoft می‌فرستد را Windows و Microsoft تعیین می‌کنند، نه ما. اگر Windows گواهی امنیتی‌ای را که برنامه‌ها برای رسیدن به GitHub نیاز دارند نداشته باشد، برنامه‌ها از Windows می‌خواهند آن را بررسی کند، و Windows ممکن است آن‌وقت آن را از Microsoft یا از صادرکنندهٔ آن دانلود کند. جایی که WebView2 نیست، نصب‌کننده‌ها (یک کادر تیک‌خورده که می‌توانید تیکش را بردارید)، برنامه‌ها هنگام شروع («همین حالا نصبش کنیم؟») و «تنظیمات» («نصب WebView2») نصب‌کنندهٔ WebView2 از Microsoft را پیشنهاد می‌کنند که همراه برنامه‌ها می‌آید؛ اگر بگویید بله، WebView2 را از Microsoft دانلود و نصب می‌کند، زیر شرایط Microsoft. اگر بگویید نه، به‌جای آن از برنامه در مرورگرتان استفاده می‌کنید.
- نمای سه‌بعدی Studio با کتابخانه‌ای رسم می‌شود که داخل Studio می‌آید، پس برای آن‌ها چیزی دانلود نمی‌شود.
- دکمه‌هایی که مرورگر شما را باز می‌کنند: صفحه‌های GitHub و Discord ما، صفحهٔ خانهٔ یک ماد، دانلود WebView2 از Microsoft، blender.org، و صفحه‌های سپاس یگان‌های دوره‌ها. «گزارش مشکل»، «Add my mod» و «باز کردن درخواست در GitHub» صفحه‌ای از GitHub را باز می‌کنند که جزئیات از پیش در آن پر شده است: خطایی که برنامه نشان داد (با نام کاربر Windows شما برداشته‌شده از مسیرها)، جزئیات ماد شما، یا کد پوشهٔ شما. مرورگر شما این جزئیات را همین‌که صفحه باز می‌شود در نشانی صفحه برای GitHub می‌فرستد؛ تا خودتان نفرستید چیزی ارسال نمی‌شود، و آنچه در GitHub می‌گذارید عمومی است.
- اگر برنامه‌ها نتوانند پنجرهٔ خودشان را باز کنند (مثلاً در Linux از راه Proton)، به جایش در مرورگر وب شما باز می‌شوند، و مرورگر شما آن‌وقت خودش تصویرهای کوچک بافت‌ها را بارگذاری می‌کند.

13. Steam و حساب Steam شما
قوانین خود Steam، که با حساب Steam‌تان پذیرفته‌اید، تغییر دادن بازی‌ها، دست‌کاری در شیوهٔ اجرایشان، و تقلب در بازی چندنفره را محدود می‌کنند. Valve، نه ما، تصمیم می‌گیرد قوانینش چگونه دربارهٔ R.U.S.E. به کار رود. نمی‌دانیم Valve یک نسخهٔ مادشده، یا فایل‌های تغییریافتهٔ بازی‌اش، را نقض آن‌ها می‌شمارد یا نه، و دربارهٔ حساب Steam شما نمی‌توانیم چیزی تضمین کنیم. بازی آنلاین با نسخهٔ مادشده، به‌ویژه نسخه‌ای که با ابزار تقلب یا آزمایش ساخته شده، انتخاب شما و با مسئولیت خودتان است. R.U.S.E. ضدتقلب مؤثری ندارد، و برای همین RUSE Guard لازم است؛ خود RUSE Guard هرگز کاری با حساب Steam یا بازی نصب‌شدهٔ شما نمی‌کند.

14. بدون ضمانت، و محدودیت‌های مسئولیت ما
به زبان ساده: برنامه‌ها و خدمات آنلاین ما رایگان‌اند، و همان‌طور که هستند عرضه می‌شوند. قول نمی‌دهیم کار کنند، یا برای آنچه شما می‌خواهید کار کنند، و تا جایی که قانون محل زندگی شما اجازه می‌دهد، مسئول آنچه خراب می‌شود نیستیم.
برنامه‌ها و خدمات آنلاین ما رایگان‌اند و «همان‌طور که هستند» («AS IS») عرضه می‌شوند، بدون هیچ‌گونه ضمانتی، صریح یا ضمنی، از جمله ضمانت‌های ضمنی قابلیت تجارت و تناسب برای هدفی خاص، همان‌طور که بندهای 15 و 16 از GNU GPL نسخهٔ 3 هم می‌گویند. تا جایی که قانون محل زندگی شما اجازه می‌دهد، ما مسئول هیچ زیان یا خسارتی ناشی از استفاده از آن‌ها یا ناتوانی در استفاده از آن‌ها نیستیم، از جمله از دست رفتن داده، مشکل با بازی، یا هر کاری که Valve، Steam یا سازندهٔ بازی دربارهٔ حساب شما بکنند.
این هیچ مسئولیتی را که قانون اجازه نمی‌دهد محدود شود محدود نمی‌کند، مثل آسیب عمدی یا ناشی از سهل‌انگاری فاحش، و بر حقوق شما به عنوان مصرف‌کننده اثر نمی‌گذارد. مادهای فهرست ما را دیگران ساخته‌اند: Launcher هر دانلود را با فهرست می‌سنجد، اما قول نمی‌دهیم هیچ ماد امن باشد یا کار کند.

15. تغییرها، و پایان
وقتی این توافق، یا شیوهٔ اداره کردن داده‌های شما را به شکلی که اهمیت دارد تغییر می‌دهیم، شمارهٔ نسخه‌اش را بالا می‌بریم، و برنامه‌ها پیش از ادامه آن را دوباره نشان می‌دهند؛ ابتدای متن می‌گوید چه چیزی تغییر کرده. اگر نمی‌خواهید بپذیرید، فقط برنامه را ببندید؛ هر زمان می‌توانید آن را حذف نصب کنید. از داده‌هایی که از پیش داریم به شیوه‌ای تازه استفاده نمی‌کنیم بی‌آن‌که اول به شما بگوییم. نسخه و تاریخ اجرا شدنش در بالا هستند، و نسخه‌های قبلی در صفحهٔ GitHub ما فهرست شده‌اند.
هر زمان می‌توانید استفاده از برنامه‌ها را متوقف کنید. ما می‌توانیم هر زمان خدمات آنلاین برنامه‌ها، بررسی‌های RUSE Guard یا خود پروژه را تغییر دهیم، متوقف کنیم یا پایان دهیم؛ اگر پروژه به نگه‌دارندگان تازه برسد، اول آن را در صفحهٔ GitHub و در برنامه‌ها می‌گوییم.

16. قانون و اختلاف‌ها
برخی حقوق را هیچ توافقی نمی‌تواند بگیرد، مثل حقوق شما به عنوان مصرف‌کننده در اتحادیهٔ اروپا یا بریتانیا، یا حق شما برای مراجعه به دادگاه در محل زندگی‌تان، جایی که آن قانون اجازه می‌دهد. هیچ چیز در اینجا آن حقوق را نمی‌گیرد. اگر دادگاهی تشخیص دهد بخشی از این توافق قابل اجرا نیست، بقیه همچنان اعمال می‌شود.

17. تماس و تجدیدنظر
ایمیل: sneadtristen6@gmail.com، فقط برای درخواست‌های حریم خصوصی و شکایت صاحبان حقوق. Discord: کانال درخواست‌های ماد، یا کانال آزمایش‌ها / کار در حال انجام، برای پرسش‌ها و گزارش باگ؛ برای هر چیز شخصی، یک پیام خصوصی برای sneadtristen6 بفرستید. GitHub: Issues و Discussions پروژهٔ ما، که عمومی هستند. برای تجدیدنظر در تصمیم RUSE Guard، ظرف 30 روز از تصمیم یک پیام خصوصی در Discord برای sneadtristen6 بفرستید. می‌توانید در GitHub ما هم یک تیکت باز کنید، اما تیکت‌ها عمومی‌اند، پس لطفاً شواهد را آنجا نگذارید و نام بازیکنان دیگر را نیاورید؛ ما هم نمی‌آوریم. sneadtristen6 آن‌وقت خودش پرونده را دوباره نگاه می‌کند (او تنها کسی است که پرونده‌ها را بررسی می‌کند و دربارهٔ درخواست‌های تجدیدنظر تصمیم می‌گیرد)، و شواهدش را نگه می‌دارد تا دربارهٔ درخواست تجدیدنظر شما تصمیم بگیرد. مشکلات امنیتی: آن‌ها را خصوصی گزارش کنید، همان‌طور که سیاست امنیتی ما در GitHub می‌گوید.

متن انگلیسی ملاک است؛ زبان‌های دیگر ترجمه‌اند. اگر ترجمه‌ای دربارهٔ آنچه جمع می‌کنیم یا دربارهٔ حقوق شما اشتباه باشد، به ما بگویید. اشتباه در یک ترجمه علیه شما به کار برده نمی‌شود.

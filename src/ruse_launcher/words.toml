6. RUSE Guard: 私たちのアンチチート（必須）
目的: 私たちのアプリが作ったコピーで遊ぶ R.U.S.E. のマルチプレイ対戦と協力対戦でのチートを止めるためです。MOD はゲームの遊び方を変えられます。そのため、遊び方を変える MOD が入ったコピーには参加コードが付き、一緒に遊ぶ人と比べることができます。チートツールやテストツールを入れて作ったコピーは、対戦のすべてのプレイヤーが同じビルドかを確認し、違えばその対戦を降参します。マルチプレイ対戦と協力対戦では、RUSE Guard は、PC で動いている既知のチートツールも探します。さらに、どのコピーの監視機能も、対戦で出現命令やある陣営の資金の急な増加があると画面に表示します。
必須である理由: RUSE Guard は私たちのアプリを使うのに必須です。R.U.S.E. には有効なアンチチートがなく、だからこそ RUSE Guard が必要です。それはマルチプレイからチートを締め出すのに役立ち、公正な対戦は私たちと、あなたが出会うすべてのプレイヤーにとって大切です。私たちが根拠とするのは、データ保護法でいう「正当な利益」です。すべてのプレイヤーにとって公正な対戦であり、あなたのプライバシーがそれを上回らない限り、あなたの許可は必要ありません（第11条）。RUSE Guard が Bug Watch のようなチェック欄ではないのはそのためで、私たちが公開したとおりの Studio と Launcher には、常にこれが含まれます。それでも、いつでも異議を述べられます（第11条）。
- 働く場所: RUSE Guard は、アプリが作るすべての MOD入りコピーに入っていて、Launcher の オリジナル も、MOD なしで同様のコピーを作ります（第10条）。そのロックとプログラムの確認が働くのはマルチプレイ対戦と協力対戦だけで、対戦記録も、始まれば同じです（下記）。監視機能も MOD入りコピーすべてに入っていて、マルチプレイ、協力、そしてコンピューター相手の小競り合いを見ています。ある陣営の資金が一度に 400 以上増えたときや、ユニットが出現命令で作られたときに、あなた自身の画面に通知を出すことがあります。マルチプレイ対戦では、すべてのプレイヤーの画面に表示されることがあります。監視機能は対戦の何も変更せず、何も送りません。RUSE Guard のために何かを送るのは Launcher だけで、Studio は決して送らず、Studio の「ゲームでテスト」ではプログラムの確認も行いません。
- 一覧: RUSE Guard の既知のチートツールの一覧は、読めるプレーンなファイルとしてアプリの中に入っていて、アプリの更新でしか変わりません。そのために何かをダウンロードすることはありません。
- プログラムの確認: Launcher から起動したマルチプレイ対戦または協力対戦では、RUSE Guard が 30 秒ごとに PC で動いているプログラムの名前を見て、一覧にある名前だけを残します。そうした対戦が行われているかを知るために、Launcher はゲームの実行中、ゲーム自身のエラー出力を読みます。残すのは、対戦が行われている、または終わったと伝える RUSE Guard の短い行だけで、ほかの行は読んだ瞬間に捨て、保存も送信もしません（その出力には Steam 自身の行が含まれることがあり、その中には Steam アカウント番号が入ったものもあります）。ゲームが対戦の終了を伝えなかった場合、確認は、ゲームが最後に対戦中と伝えてから 2 分後に止まります。一覧にあるプログラムが対戦中に動いていた場合、Launcher はゲームの終了後に私たちのサーバーへ短い記録を送ります。内容は、あなたのユーザー名と RUSE Guard キー、対戦の開始と終了の時刻、マルチプレイか協力か、見つかった一覧のプログラムの名前です。これ以外は入りません。リプレイもファイルも、対戦に関するそのほかのことも含みません。一覧にあるプログラムが動いていなければ、何も送られません。
- 参加コード: 遊び方を変える MOD が入ったMOD入りコピーについて、Launcher は参加コードを表示します。これは、そのコピーのゲームバージョン、MOD とそのバージョン、そして遊び方に対する変更を表します。参加コードは一緒に遊ぶ人と比べるものです。私たちは今のところ、これを受け取りません。対戦記録（下記）には含まれます。
- チートツールやテストツールで作ったコピー: そのようなコピーは、ビルドが同じ（同じゲームバージョンで、同じ MOD が同じバージョン）のプレイヤーとだけ、マルチプレイと協力対戦で遊べます。そのような対戦が始まって約 1 秒後に、すべてのプレイヤーのゲームに、そのビルドの短いコード（ビルドコード）を伝えます。これは、ゲームのバージョン、MOD とそのバージョンを順番に、そして遊び方に対する変更から作られます。名前もアカウントも含みません。全員のビルドが同じなら、対戦は続けられるように作られています。ただし、2 人でそのような対戦を遊んだ人はまだいません。違っていれば、数秒後にその対戦を降参します。
  ランク戦ではないマルチプレイ対戦では、そのあと、その対戦の終了画面でわざとゲームを止めます。ゲームはクラッシュしてデスクトップに戻ります。その後、ゲーム自身のクラッシュレポーターがゲームの制作者にレポートを送ることがあり、そのレポートにはチート入りコピーを止めたという RUSE Guard の一行が含まれます。協力対戦とランク戦では、対戦を降参するだけです。Launcher がゲームを起動していて、ゲームが止まったときにまだ開いている場合、Launcher はあなたの PC にあるゲームのクラッシュレポートから RUSE Guard の一行だけを取り出し、チート入りコピーを止めたという短い通知を、あなたのユーザー名と RUSE Guard キーとともに、クラッシュレポートが書かれた時刻と通知を作った時刻を付けて、私たちのサーバーに送ります。その一行が示すのは、対戦の種類と、その対戦でのあなたの陣営の番号だけで、Steam ID、長い数字、パスはすべて取り除かれます。私たちのアプリがクラッシュレポートそのものを送ることは決してありません。通知は審査を開始せず、何も決定しません。sneadtristen6 が見られるように一覧に載るだけです。ゲームが止まる前に Launcher が閉じられていた場合、またはゲームが Studio または手動で起動された場合は、通知は送られません。Linux と Steam Deck で通知が送られるかどうかは、まだわかっていません。
  正直なコピーが止められることは決してありません。
- あなたの RUSE Guard キー: Launcher が PC で初めて RUSE Guard の記録を作るとき、そこでランダムなキーを作ります。このキーから作ったコード（その公開側）が各記録に付き、同じユーザー名の別の人の記録とあなたの記録を区別でき、記録が変更されていないことも確認できます。それ以外のことは何もわかりません。設定には、これから作った短いコード「あなたの RUSE Guard コード」が表示されます。プライバシーに関するご請求とともに送っていただければ、あなた自身の RUSE Guard の記録を見つけられます。そのために、これ以上のものは送られません。
- まだ有効ではないもの: 対戦記録。これには、今のゲームには書き出せない対戦の記録が必要です。始まる前に、この文書を更新し、アプリはもう一度あなたに表示します。始まると、対戦記録には次のものが入ります。あなたのユーザー名と RUSE Guard キー、あなたの陣営、あなたのコピーのコード、あなたのコピーが変更したゲームファイルの検査と、各プレイヤーのゲームが同じままであることの定期的な検査、あなたの MOD とその検査、あなたの MOD がキーに結びつけているスクリプトコマンド（押すキーそのものではありません）、開発者のテスト用コピーであれば開発者のキー、動いていた一覧のチートツールの名前、対戦の開始時刻と終了時刻、そして対戦中または直後に PC に保存された最新のリプレイとそのファイル名。リプレイには、対戦で各プレイヤーが出したすべての命令が入っていて、そのファイル名と内容には、あなたやほかのプレイヤーのゲーム内の名前が含まれることがあります。
- 決してしないこと: あなたの画面やキー入力を集めることは決してなく、ほかのプログラムが動いている間にその中を見ることも決してなく、対戦記録が運ぶリプレイを除いて、あなたのファイルを私たちに送ることも決してありません。ゲームのクラッシュレポートから読むのは、自身が止めたチート入りコピーについての自身の一行（上記）だけで、それもあなたの PC 上で行います。
- 開発者のテスト用コピー: アプリは、私たちからの特別なキーを持つ開発者のテスト用コピーを対戦に入れられるように作られています。これは、チート入りコピーのルールを回避できる唯一の方法です。ただし、今は何も動きません。アプリは今のところ、そのようなキーを確認できないからです。
- あなたに関する決定: 自動的な BAN はありません。チートに関する決定が、機械だけで行われることはありません。sneadtristen6 が証拠を見て、リプレイがあればそれも見て、決めます。Anthropic の AI アシスタントである Claude が、Anthropic 自身の規約のもとで、彼が RUSE Guard の記録を読むのを助けます。決定は彼が行います。一覧のチートツールの名前が入った記録は、彼のための審査を開き、彼が決めるまで何も決定しません。決定から 30 日以内に異議申し立てができます（第17条）。sneadtristen6 は案件を審査する唯一の人物なので、異議申し立ても彼自身が決めます。唯一の自動的なルールは、上のチート入りコピーのルールです。それはあなたが作ると選んだコピーに基づくもので、あなたの Steam アカウントやインストール済みのゲームには決して触れません。
- 今日の時点での決定の意味: チートが確認された場合、私たちはその決定を、あなたのユーザー名のもとで、フラグを付けたプレイヤーの一覧に保管し、のちの対戦を調べるときに使います。2 人のプレイヤーが同じユーザー名になることがあるため、記録に付いていた RUSE Guard キーも確認します。私たちの RUSE Guard サーバーがその一覧を保管します。一覧には、フラグを付けた各ユーザー名と、その記録が最初に付いていた RUSE Guard キーが入り、フラグが付いたことは、そのプレイヤー自身の Launcher にだけ伝えます。アプリは今のところ、フラグに基づいて何もしません。のちのバージョンが、たとえばフラグの付いたプレイヤーの MOD入りコピーを R.U.S.E. 2.0 経由のマルチプレイから締め出すなどのことをする場合は、先にこの文書でお知らせします。異議申し立てが認められた場合、その決定は覆されたものとして印が付けられ、ユーザー名は一覧から外されます。
- 記録の保管期間とあなたの権利: 第11条。

7. Bug Watch: 不具合の発見と修正にご協力ください（任意、おすすめ）
目的: Studio と Launcher をより良くし、クラッシュをより早く直すためです。誰かがクラッシュを報告するのを待つのではなく、私たちがそれと、その前に何があったかを見られます。
根拠: あなたの同意（第11条）があるときだけです。チェックを入れるまではオフです。ユーザー名を保存したり変更したりしても、オン・オフは変わりません。チェックを入れても、ゲームのクラッシュ後に Launcher があなたに伝える内容（下記）を除き、アプリのほかのことは何も変わりません。変更後にアプリがこの規約をもう一度表示するとき、Bug Watch がオンなら、そのボックスは「Bug Watch をオンのままにしますか？」と尋ね、チェックが入っています。チェックを残せばオンのままで、外せばオフになります。オフなら、Bug Watch のボックスがチェックなしでもう一度表示されます。
オンの間、Studio と Launcher は私たちのサーバーに次のものを送ります。
- 1 日 1 回、終わった日ごとの集計:
  - アプリとそのバージョン、日付、Windows 10 か 11 か、アプリの言語、ゲームのバージョン、RUSE Guard が組み込まれているか、同意したこの規約のバージョン。
  - アプリの各部分が何回使われたか、処理にどれだけかかったか、何がどこで失敗したか（私たち自身のコードの中だけ。Studio の画面のスクリプトが失敗したときは、その画面の名前とエラーの種類だけで、エラーの文面、ファイル、行は送りません）、MOD のビルドのような長い作業ごとの完了回数と失敗回数、MOD に間違いが見つかったビルドの数。
  - その日の失敗の一覧（最大 20 件）。それぞれに、コード（私たちのコードのどの場所か）、「プレイ」や「ゲームでテスト」がどこまで進んだか、MOD の組み合わせの形（私たちの一覧からの MOD がいくつか、あなた自身の MOD フォルダーと MOD ファイルがいくつか。いずれも数として）を付け、その横には、誰も特定しない数字だけを添えます。Windows のエラー番号（ディスクがいっぱい、など）、ウェブサーバーの応答（404 など）、ゲームの終了番号、回数、2 つ目のコードです。
  - 更新が何回提示され、インストールされ、失敗したか、アプリが何回クラッシュしたか、トラブルシューターのどの確認で問題が見つかったか。
  - 私たちの一覧のどの MOD をオンにしていたか、全体で何分遊んだか、それらの MOD ごとに何分遊んだか。
  - 自作の MOD がいくつあるか、そこにユニット、マップ、ミッション、スクリプトなど、どんな種類のものが入っているか（種類ごとの数だけで、名前、その内容、パス、ファイルは決して送りません）。
- アプリがクラッシュしたときにすぐ: エラーの種類と、私たちのコードのどこか。
- アプリが起動したゲームがクラッシュしたあとすぐ: どこで、どのようにクラッシュしたかの技術的な詳細:
  - ゲームのエラーコード、止まったファイルの名前（Windows、ドライバー、ゲームに読み込まれたオーバーレイなどの別のプログラムの一部のこともあります）、その中のどこでゲームが止まったか、そこに至ったゲーム内の最大 16 か所。
  - メモリーエラーの場合、ゲームが何をしようとしていたか（読み取り、書き込み、実行）と、メモリー上の場所。
  - スクリプトエラーの場合、ゲーム自身のエラーテキスト。ドライブ上のパスはファイル名だけに切り詰められ、あなたのユーザーフォルダーの名前は隠され（その中のフォルダー名は残ることがあります）、Steam アカウント番号やそのほかの長い数字は取り除かれます（ゲーム自身のスクリプト名は残ります）。ゲームが飛ばした以前のエラーの数。そしてマップ（ゲーム自身のマップなら名前、MOD のマップなら「MOD のマップ」とだけ）。
  - ゲームが作っていたユニット（アプリがゲームのクラッシュレポートから読み取れる場合）。ゲーム自身のユニットなら番号、MOD のユニットなら「MOD のユニット」とだけ。
  - どの MOD が入っていたか、自作の MOD にどんな種類のものが入っているか（種類ごとの数）、同意したこの規約のバージョン。
Bug Watch が使うのは、ゲーム自身のクラッシュレポートだけです。ほかのプログラムのレポートについては、それがゲームのものではないと判断するために、そこに載っているファイルの名前だけを読み、そこから何も送りません。
送信するたびに、あなたのユーザー名とインストールIDが付きます。インストールIDは、Bug Watch にチェックを入れるかどうかにかかわらず、最初にユーザー名を選んだときに PC 上で作られるランダムなコードです。Bug Watch がオンの間に設定に表示される報告コードは、インストールIDの最初の 8 文字です。
私たちのアプリが、あなたのファイルやゲームのクラッシュレポートのファイルそのものを送ることは決してなく、Bug Watch が Steam アカウント番号を送ることもありません。（ゲーム自身のクラッシュレポーターは、自身のレポートをゲームの制作者に送ることがあります。第3条。）ゲームのエラーテキストには、ゲームや MOD のスクリプトの名前が含まれることがあります。ユーザー名に本名を使わないでください（第9条）。
わかっているクラッシュ: Bug Watch がオンのとき、ゲームが私たちの知っている形でクラッシュすると、Launcher は、ゲームがどのユニットを作っていたかとその理由を、あなたの言語で伝えます。その説明はあなたにだけ表示され、送られることはありません。Bug Watch の報告が運ぶユニットは、上に書いたとおり（番号、または「MOD のユニット」）だけです。そのクラッシュを知るために、アプリは、ゲームの起動時に私たちの Bug Watch サーバーからそのクラッシュの一覧をダウンロードします（PC にある一覧が 1 日以内のものならダウンロードしません）。また、クラッシュしたときに使える一覧がなければ、もう一度ダウンロードします。ダウンロードするのは Bug Watch がオンの間だけで、一覧は PC に保存し、私たちの署名がある場合にだけ使い、あなたのクラッシュレポートとの照合は PC 上で行います。ダウンロードには、あなたに関する情報は何も含まれません。一覧がない場合（たとえば最初のときや、インターネットがないとき）、Launcher はゲームがクラッシュしたことは伝えますが、ユニットも理由も伝えません。Bug Watch のチェックを外すと、一覧は PC から削除されます。
Bug Watch のオン・オフにかかわらず: Launcher が起動したゲームがクラッシュすると、Launcher はゲームが止まった場所から PC 上で作った短いクラッシュコードを表示します。これはどこにも送られません。「コードをコピー」ボタンでコピーできます。助けが必要なときは、そのコードとメッセージのスクリーンショットを Discord の XUL（XUL6x3）か GitHub に送ってください。私たち自身の一覧で調べます。このコードが示すのは、ゲームが止まった場所だけです。
設定では、今日の集計が、送られるとおりそのままの言葉で表示され、送信待ちの報告の名前も見られます。送れなかった報告は、PC で最長 30 日間待ち、その後は破棄されます。アプリが起動したゲームが動いている間、Bug Watch は、次にアプリを起動したときにゲームがクラッシュしたかどうかを判断できるよう、そのゲームについての小さなメモもあなたの PC に保存します。内容は、起動した時刻と最後に動いているのを確認した時刻、その MOD（私たちの MOD は名前とバージョン、それ以外は数だけ）、コピーとゲームのインストール先（Windows のフォルダーには Windows のユーザー名が含まれることがあります）です。このメモは送信されず、30 日後に、または Bug Watch のチェックを外したときにすぐ削除されます。
誰が見るか: 私たちの開発者です。私たちの Bug Watch サーバーで、Cloudflare が私たちのために保管します。オンにしたとき、私たちのサーバーは、追跡している問題についてのメモも、非公開の GitHub リポジトリ（私たちの開発者だけが開ける GitHub 上の場所）に投稿します。メモには、ユーザー名も報告コードも入りません。私たちの開発者は、Anthropic の AI アシスタントである Claude も使って、一部の Bug Watch のクラッシュ報告を読むのを助けてもらいます。Anthropic 自身の規約のもとで行います。
保管期間: 各報告は、サーバーに届いて 7 日たった後の毎日の整理で削除されます。つまり、届いてから 7～8 日後です。私たちの開発者は、非常に深刻なクラッシュの報告に、そのクラッシュを直している間は残すよう印を付けられます。印を付けた報告は、開発者が印を外すまで、つまりそのクラッシュが直った日まで残り、その後、次の毎日の整理で消えます。その後も、ユーザー名、インストールID、報告コードを含まずに残るもの: アプリのバージョンごとの毎日の合計（たとえば「その日、バージョン 0.9.9 で MOD のビルドが 12 回失敗した」のようなもの）と、各バージョンと各種類のエラーが最初に見られた日は、期限なく残ります。そして、サーバーが見つけた問題についてのメモ（アプリのどの部分か、私たちの一覧のどの MOD か、クラッシュがどこで起きたか、何回か）は、私たちがその問題を終了してから 3 日後まで残ります。最初の 7 日間は、そのバージョンを使った人が 1 人だけだった日は、その合計はその 1 人の集計になります。それ以降は、その日の使用が 3 インストール未満だったバージョンや私たちの一覧の MOD は、「(other)」としてだけ残されます。GitHub のメモは、私たちが削除するまで残ります。Cloudflare は私たちのデータベースの履歴を 7 日間保持するため、私たちが削除したものは、さらに最大 7 日間その履歴に残ります。sneadtristen6 のコンピューター上のコピーについては、第11条「どこに保管されるか」を参照してください。
設定（またはこの規約が表示されるときの Bug Watch のボックス）で、いつでもチェックを外せます。その時点から何も数えられず、何も送られず、アプリは Bug Watch の集計と送信待ちの報告を削除します。RUSE Guard がユーザー名を使うため、ユーザー名とインストールIDは PC に残ります。チェックを外す前に作られたものは、あとでもう一度チェックを入れても送られません。チェックを外しても、私たちのサーバーには何も伝わらず、すでに届いたものは上のとおり削除されます。もっと早く削除してほしい場合は、報告コード（設定に表示されるのは Bug Watch がオンの間だけなので、チェックを外す前に控えてください）、コードがなければユーザー名を、メールでお知らせください。それをもとにあなたのインストールの報告を見つけて削除します。上の合計とメモは残ります。チェックを外しても、すでに送られたものは取り消されません。


[set_title_help]
us = "Your game shows its title as R.U.S.E. 2.0 in gold, with mods or without: on the main menu, on the loading screens and in the video as the game starts. It's made on your PC from your own game's files. Untick it to have the game's own R.U.S.E. title; Vanilla then starts through Steam. The next Play builds the copy your way."
fr = "Votre jeu affiche son titre en R.U.S.E. 2.0 doré, avec ou sans mods : au menu principal, sur les écrans de chargement et dans la vidéo au lancement du jeu. Il est fait sur votre PC à partir des fichiers de votre propre jeu. Décochez pour garder le titre R.U.S.E. d'origine du jeu ; le Jeu d'origine se lance alors par Steam. Le prochain Jouer construit la copie selon votre choix."
ger = "Dein Spiel zeigt seinen Titel als R.U.S.E. 2.0 in Gold, mit Mods oder ohne: im Hauptmenü, auf den Ladebildschirmen und im Video beim Spielstart. Er wird auf deinem PC aus den Dateien deines eigenen Spiels gemacht. Nimm das Häkchen weg, um den eigenen R.U.S.E.-Titel des Spiels zu behalten; Original startet dann über Steam. Das nächste Spielen baut die Kopie nach deiner Wahl."
ita = "Il tuo gioco mostra il titolo come R.U.S.E. 2.0 in oro, con le mod o senza: nel menu principale, nelle schermate di caricamento e nel video all'avvio del gioco. Viene creato sul tuo PC dai file del tuo gioco. Togli la spunta per avere il titolo R.U.S.E. originale del gioco; Originale allora si avvia tramite Steam. Il prossimo Gioca costruisce la copia come hai scelto."
spa = "Tu juego muestra su título como R.U.S.E. 2.0 en dorado, con mods o sin ellos: en el menú principal, en las pantallas de carga y en el vídeo al iniciar el juego. Se hace en tu PC a partir de los archivos de tu propio juego. Desmárcalo para tener el título R.U.S.E. original del juego; Original se inicia entonces a través de Steam. El próximo Jugar construye la copia a tu manera."
pol = "Twoja gra pokazuje tytuł jako złote R.U.S.E. 2.0, z modami lub bez: w menu głównym, na ekranach wczytywania i w filmie przy starcie gry. Powstaje na twoim PC z plików twojej własnej gry. Odznacz, aby mieć oryginalny tytuł R.U.S.E. gry; Oryginał uruchamia się wtedy przez Steam. Następne Graj zbuduje kopię według twojego wyboru."
ru = "Ваша игра показывает название как золотое R.U.S.E. 2.0, с модами или без: в главном меню, на экранах загрузки и в видео при запуске игры. Оно делается на вашем ПК из файлов вашей собственной игры. Снимите галочку, чтобы было родное название R.U.S.E.; тогда Оригинал запускается через Steam. Следующее Играть соберёт копию по вашему выбору."
cz = "Vaše hra ukazuje svůj název jako zlaté R.U.S.E. 2.0, s módy i bez nich: v hlavním menu, na načítacích obrazovkách a ve videu při spuštění hry. Vzniká na vašem PC ze souborů vaší vlastní hry. Zrušte zaškrtnutí, chcete-li původní název R.U.S.E.; Původní hra se pak spouští přes Steam. Další Hrát sestaví kopii podle vaší volby."
jpn = "MODの有無にかかわらず、ゲームのタイトルが金色の R.U.S.E. 2.0 になります：メインメニュー、ロード画面、ゲーム起動時の動画です。あなたの PC 上で、あなた自身のゲームのファイルから作られます。チェックを外すと、ゲーム本来の R.U.S.E. のタイトルになり、オリジナルは Steam から起動します。次の「プレイ」で、選んだとおりにコピーがビルドされます。"
sc = "无论是否使用模组，你的游戏都会把标题显示为金色的 R.U.S.E. 2.0：在主菜单、载入画面以及游戏启动时的视频中。它在你的电脑上由你自己游戏的文件制作。取消勾选即可使用游戏原本的 R.U.S.E. 标题，原版随后通过 Steam 启动。下一次“开始游戏”会按你的选择构建副本。"
fa = "بازی شما، با ماد یا بدون آن، عنوانش را به شکل R.U.S.E. 2.0 طلایی نشان می‌دهد: در منوی اصلی، در صفحه‌های بارگذاری و در ویدیوی شروع بازی. این عنوان روی رایانهٔ شما از فایل‌های بازی خودتان ساخته می‌شود. تیکش را بردارید تا عنوان R.U.S.E. خود بازی را داشته باشید؛ آن‌وقت «بازی اصلی» از راه Steam اجرا می‌شود. «بازی» بعدی نسخه را به همان شکلی که خواسته‌اید می‌سازد."


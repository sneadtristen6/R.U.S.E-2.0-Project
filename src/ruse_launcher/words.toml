ru = "Вставьте порядок загрузки, которым поделился друг, из RUSE Launcher или RUSE Mod Manager. В новый набор модов попадут моды, которые у вас есть, в том же порядке."
cz = "Vložte pořadí načítání, které s vámi sdílel přítel, z RUSE Launcher nebo RUSE Mod Manager. Nová sada módů dostane módy, které máte, ve stejném pořadí."
jpn = "友達が共有したロード順（RUSE Launcher または RUSE Mod Manager のもの）を貼り付けてください。新しいMODセットには、持っているMODが同じ順番で入ります。"
sc = "粘贴好友分享的加载顺序（来自 RUSE Launcher 或 RUSE Mod Manager）。新的模组组合会按相同顺序包含你已有的模组。"


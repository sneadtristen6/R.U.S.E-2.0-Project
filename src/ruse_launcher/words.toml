# --- item 25: a game crash tells the player the unit and why (rusemod.crashplaces, rusemod.bugwatch.crash_notice;
# app.js watchCrash). crash_why_<key> for each of crashplaces.REASONS; {why} is one of them; a reason says no more
# than its place shows (a place nothing ties to a unit: "a model", not "a unit's model") ---
[crash_unit]
us = "The game crashed while making the unit “{unit}”. {why}"
fr = "Le jeu a planté en créant l'unité « {unit} ». {why}"
ger = "Das Spiel ist beim Erstellen der Einheit „{unit}“ abgestürzt. {why}"
ita = "Il gioco è andato in crash mentre creava l'unità «{unit}». {why}"
spa = "El juego se cerró inesperadamente al crear la unidad «{unit}». {why}"
pol = "Gra uległa awarii podczas tworzenia jednostki „{unit}”. {why}"
ru = "Игра вылетела при создании юнита «{unit}». {why}"
cz = "Hra spadla při vytváření jednotky „{unit}“. {why}"
jpn = "ユニット「{unit}」を作成中にゲームがクラッシュしました。{why}"
sc = "游戏在生成单位“{unit}”时崩溃了。{why}"
fa = "بازی هنگام ساختن یگان «{unit}» از کار افتاد. {why}"

[crash_mod_unit]
us = "The game crashed while making “{unit}”, a unit a mod added. {why}"
fr = "Le jeu a planté en créant « {unit} », une unité ajoutée par un mod. {why}"
ger = "Das Spiel ist beim Erstellen von „{unit}“ abgestürzt, einer Einheit, die eine Mod hinzugefügt hat. {why}"
ita = "Il gioco è andato in crash mentre creava «{unit}», un'unità aggiunta da una mod. {why}"
spa = "El juego se cerró inesperadamente al crear «{unit}», una unidad que añadió un mod. {why}"
pol = "Gra uległa awarii podczas tworzenia „{unit}”, jednostki dodanej przez moda. {why}"
ru = "Игра вылетела при создании «{unit}», юнита, добавленного модом. {why}"
cz = "Hra spadla při vytváření „{unit}“, jednotky, kterou přidal mod. {why}"
jpn = "MOD が追加したユニット「{unit}」を作成中にゲームがクラッシュしました。{why}"
sc = "游戏在生成“{unit}”（模组添加的单位）时崩溃了。{why}"
fa = "بازی هنگام ساختن «{unit}»، یگانی که یک ماد افزوده است، از کار افتاد. {why}"

[crash_no_unit]
us = "The game crashed. {why}"
fr = "Le jeu a planté. {why}"
ger = "Das Spiel ist abgestürzt. {why}"
ita = "Il gioco è andato in crash. {why}"
spa = "El juego se cerró inesperadamente. {why}"
pol = "Gra uległa awarii. {why}"
ru = "Игра вылетела. {why}"
cz = "Hra spadla. {why}"
jpn = "ゲームがクラッシュしました。{why}"
sc = "游戏崩溃了。{why}"
fa = "بازی از کار افتاد. {why}"

[crash_why_made]
us = "The game couldn't build the unit's model: the model had no skeleton in that battle, or not the bones its parts need."
fr = "Le jeu n'a pas pu construire le modèle de l'unité : le modèle n'avait pas de squelette dans cette bataille, ou pas les os dont ses pièces ont besoin."
ger = "Das Spiel konnte das Modell der Einheit nicht aufbauen: Das Modell hatte in dieser Schlacht kein Skelett oder nicht die Knochen, die seine Teile brauchen."
ita = "Il gioco non è riuscito a costruire il modello dell'unità: in quella battaglia il modello non aveva lo scheletro, o non le ossa che servono alle sue parti."
spa = "El juego no pudo montar el modelo de la unidad: en esa batalla el modelo no tenía esqueleto, o no tenía los huesos que necesitan sus piezas."
pol = "Gra nie mogła zbudować modelu jednostki: w tej bitwie model nie miał szkieletu albo kości, których potrzebują jego części."
ru = "Игра не смогла собрать модель юнита: в этом сражении у модели не было скелета или костей, нужных её частям."
cz = "Hra nemohla sestavit model jednotky: model v této bitvě neměl kostru, nebo kosti, které potřebují jeho části."
jpn = "ゲームはユニットのモデルを組み立てられませんでした。この戦闘でモデルに骨格がなかったか、パーツに必要な骨がありませんでした。"
sc = "游戏无法组装该单位的模型：在这场战斗中，模型没有骨架，或缺少其部件所需的骨骼。"
fa = "بازی نتوانست مدل یگان را بسازد: مدل در آن نبرد اسکلت نداشت، یا استخوان‌هایی را که قطعه‌هایش لازم دارند نداشت."

[crash_why_turret]
us = "A turret looked for its part on the unit's model, and that part was never built: the model had no skeleton in that battle."
fr = "Une tourelle a cherché sa pièce sur le modèle de l'unité, et cette pièce n'avait jamais été construite : le modèle n'avait pas de squelette dans cette bataille."
ger = "Ein Turm hat am Modell der Einheit nach seinem Teil gesucht, und dieses Teil wurde nie aufgebaut: Das Modell hatte in dieser Schlacht kein Skelett."
ita = "Una torretta ha cercato la sua parte sul modello dell'unità, e quella parte non era mai stata costruita: in quella battaglia il modello non aveva lo scheletro."
spa = "Una torreta buscó su pieza en el modelo de la unidad, y esa pieza nunca se montó: en esa batalla el modelo no tenía esqueleto."
pol = "Wieża szukała swojej części na modelu jednostki, a ta część nigdy nie została zbudowana: w tej bitwie model nie miał szkieletu."
ru = "Башня искала свою часть на модели юнита, но эта часть так и не была собрана: в этом сражении у модели не было скелета."
cz = "Věž hledala svou část na modelu jednotky, ale ta část nikdy nebyla sestavena: model v této bitvě neměl kostru."
jpn = "砲塔がユニットのモデル上で自分のパーツを探しましたが、そのパーツは組み立てられていませんでした。この戦闘でモデルに骨格がありませんでした。"
sc = "炮塔在该单位的模型上寻找自己的部件，但这个部件从未组装：在这场战斗中，模型没有骨架。"
fa = "یک برجک روی مدل یگان دنبال قطعهٔ خودش گشت، اما آن قطعه هرگز ساخته نشده بود: مدل در آن نبرد اسکلت نداشت."

[crash_why_setup]
us = "A model had no skeleton when the game first set it up."
fr = "Un modèle n'avait pas de squelette quand le jeu l'a préparé pour la première fois."
ger = "Ein Modell hatte kein Skelett, als das Spiel es zum ersten Mal einrichtete."
ita = "Un modello non aveva lo scheletro quando il gioco l'ha preparato per la prima volta."
spa = "Un modelo no tenía esqueleto cuando el juego lo preparó por primera vez."
pol = "Model nie miał szkieletu, gdy gra po raz pierwszy go przygotowywała."
ru = "У модели не было скелета, когда игра впервые её подготавливала."
cz = "Model neměl kostru, když ho hra poprvé připravovala."
jpn = "ゲームが最初にモデルを準備したとき、そのモデルに骨格がありませんでした。"
sc = "游戏首次准备某个模型时，该模型没有骨架。"
fa = "وقتی بازی برای نخستین بار یک مدل را آماده کرد، آن مدل اسکلت نداشت."

[crash_why_part]
us = "A turret couldn't find its part on its unit's model: the model has no part of that name, that part was never built, or the unit had no model."
fr = "Une tourelle n'a pas trouvé sa pièce sur le modèle de son unité : le modèle n'a aucune pièce de ce nom, cette pièce n'a jamais été construite, ou l'unité n'avait pas de modèle."
ger = "Ein Turm hat sein Teil am Modell seiner Einheit nicht gefunden: Das Modell hat kein Teil dieses Namens, dieses Teil wurde nie aufgebaut, oder die Einheit hatte kein Modell."
ita = "Una torretta non ha trovato la sua parte sul modello della sua unità: il modello non ha nessuna parte con quel nome, quella parte non è mai stata costruita, oppure l'unità non aveva un modello."
spa = "Una torreta no encontró su pieza en el modelo de su unidad: el modelo no tiene ninguna pieza con ese nombre, esa pieza nunca se montó o la unidad no tenía modelo."
pol = "Wieża nie znalazła swojej części na modelu swojej jednostki: model nie ma części o tej nazwie, ta część nigdy nie została zbudowana albo jednostka nie miała modelu."
ru = "Башня не нашла свою часть на модели своего юнита: у модели нет части с таким именем, эта часть так и не была собрана, или у юнита не было модели."
cz = "Věž nenašla svou část na modelu své jednotky: model nemá žádnou část toho jména, ta část nikdy nebyla sestavena, nebo jednotka neměla model."
jpn = "砲塔が、そのユニットのモデル上で自分のパーツを見つけられませんでした。モデルにその名前のパーツがないか、そのパーツが組み立てられていないか、ユニットにモデルがありませんでした。"
sc = "炮塔在其单位的模型上找不到自己的部件：模型没有这个名字的部件、这个部件从未组装，或者该单位没有模型。"
fa = "یک برجک قطعهٔ خودش را روی مدل یگانش پیدا نکرد: مدل قطعه‌ای با آن نام ندارد، آن قطعه هرگز ساخته نشده بود، یا یگان مدلی نداشت."

[crash_why_mesh]
us = "A model had no mesh (its 3D shape) when the game measured its size."
fr = "Un modèle n'avait pas de maillage (sa forme 3D) quand le jeu a mesuré sa taille."
ger = "Ein Modell hatte kein Netz (seine 3D-Form), als das Spiel seine Größe maß."
ita = "Un modello non aveva la mesh (la sua forma 3D) quando il gioco ne ha misurato le dimensioni."
spa = "Un modelo no tenía malla (su forma 3D) cuando el juego midió su tamaño."
pol = "Model nie miał siatki (swojego kształtu 3D), gdy gra mierzyła jego rozmiar."
ru = "У модели не было сетки (её 3D-формы), когда игра измеряла её размер."
cz = "Model neměl síť (svůj 3D tvar), když hra měřila jeho velikost."
jpn = "ゲームがモデルの大きさを測ったとき、そのモデルにメッシュ（3D の形）がありませんでした。"
sc = "游戏测量某个模型的大小时，该模型没有网格（它的 3D 形状）。"
fa = "وقتی بازی اندازهٔ یک مدل را اندازه گرفت، آن مدل مش (شکل سه‌بعدی‌اش) نداشت."

[fair_offline]
us = "This copy was built with cheats or test tools ({why}). It plays multiplayer and co-op only with players whose join code is the same as yours, and gives up any other match a few seconds in. If that was a multiplayer match that isn't ranked, it then stops the game with a crash. R.U.S.E. doesn't have an effective anti-cheat, which is why RUSE Guard is needed. Playing online with it is at your own risk: Valve decides how Steam's rules apply."
fr = "Cette copie a été construite avec des triches ou des outils de test ({why}). Elle ne joue en multijoueur et en coopératif qu'avec des joueurs dont le code de partie est le même que le vôtre, et abandonne toute autre partie quelques secondes après le début. Si c'était une partie multijoueur non classée, elle arrête ensuite le jeu par un plantage. R.U.S.E. n'a pas d'anti-triche efficace, et c'est pourquoi RUSE Guard est nécessaire. Jouer en ligne avec elle se fait à vos propres risques : c'est Valve qui décide de la façon dont les règles de Steam s'appliquent."
ger = "Diese Kopie wurde mit Cheats oder Testwerkzeugen erstellt ({why}). Sie spielt Mehrspieler- und Koop-Partien nur mit Spielern, deren Beitrittscode derselbe ist wie deiner, und gibt jede andere Partie nach wenigen Sekunden auf. War das eine Mehrspielerpartie ohne Wertung, stoppt sie danach das Spiel mit einem Absturz. R.U.S.E. hat keinen wirksamen Anti-Cheat, deshalb braucht es RUSE Guard. Damit online zu spielen geschieht auf eigenes Risiko: Valve entscheidet, wie die Regeln von Steam gelten."
ita = "Questa copia è stata costruita con trucchi o strumenti di test ({why}). Gioca in multigiocatore e in cooperativa solo con giocatori il cui codice partita è uguale al tuo, e abbandona ogni altra partita dopo pochi secondi. Se era una partita multigiocatore non classificata, poi ferma il gioco con un crash. R.U.S.E. non ha un anti-cheat efficace, ed è per questo che RUSE Guard serve. Giocare online con essa è a tuo rischio: è Valve a decidere come si applicano le regole di Steam."
spa = "Esta copia se creó con trucos o herramientas de prueba ({why}). Solo juega partidas multijugador y cooperativas con jugadores cuyo código de partida sea igual al tuyo, y abandona cualquier otra partida a los pocos segundos. Si era una partida multijugador no clasificada, después detiene el juego con un cierre inesperado. R.U.S.E. no tiene un antitrampas eficaz, y por eso hace falta RUSE Guard. Jugar en línea con ella es bajo tu propio riesgo: Valve decide cómo se aplican las reglas de Steam."
pol = "Ta kopia została zbudowana z narzędziami do oszukiwania lub testowymi ({why}). Gra w meczach wieloosobowych i kooperacyjnych tylko z graczami, których kod dołączenia jest taki sam jak twój, a każdy inny mecz opuszcza po kilku sekundach. Jeśli był to mecz wieloosobowy, który nie jest rankingowy, zatrzymuje potem grę, powodując awarię. R.U.S.E. nie ma skutecznego systemu antyoszustwa, dlatego potrzebny jest RUSE Guard. Granie z nią online odbywa się na twoje własne ryzyko: Valve decyduje, jak zasady Steam się stosują."
ru = "Эта копия собрана с читами или тестовыми инструментами ({why}). Она играет сетевые и кооперативные матчи только с игроками, у которых тот же код игры, что и у вас, и покидает любой другой матч через несколько секунд. Если это был сетевой матч без рейтинга, она затем останавливает игру с вылетом. В R.U.S.E. нет эффективного античита, поэтому RUSE Guard и нужен. Играть с ней онлайн — на ваш собственный риск: как применяются правила Steam, решает Valve."
cz = "Tato kopie byla sestavena s cheaty nebo testovacími nástroji ({why}). Hraje zápasy pro více hráčů a kooperativní jen s hráči, jejichž kód hry je stejný jako váš, a každý jiný zápas po několika sekundách opustí. Pokud šlo o zápas pro více hráčů, který není hodnocený, pak hru zastaví pádem. R.U.S.E. nemá účinný anti-cheat, a proto je RUSE Guard potřeba. Hraní online s ní je na vaše vlastní riziko: Valve rozhoduje, jak se pravidla Steamu použijí."
jpn = "このコピーはチートまたはテストツールを入れて作られています（{why}）。参加コードがあなたと同じプレイヤーとだけ、マルチプレイと協力対戦で遊べ、それ以外の対戦は数秒後に降参します。それがランク戦ではないマルチプレイ対戦だった場合は、そのあとゲームをクラッシュさせて止めます。R.U.S.E. には有効なアンチチートがなく、だからこそ RUSE Guard が必要です。これでオンラインで遊ぶのは自己責任です。Steam の規則がどう適用されるかを決めるのは Valve です。"
sc = "这个副本是用作弊或测试工具({why})构建的。它只能与加入码和你相同的玩家进行多人对战和合作对战,并会在几秒后放弃其他任何对战。如果那是一场未计入排名的多人对战,它随后会让游戏崩溃而停止。R.U.S.E. 没有有效的反作弊,这就是需要 RUSE Guard 的原因。使用它进行在线游戏,风险由你自己承担:Steam 的规则如何适用由 Valve 决定。"
fa = "این نسخه با تقلب یا ابزار آزمایش ساخته شده است ({why}). فقط با بازیکنانی که کد پیوستنشان با کد شما یکی است در مسابقه‌های چندنفره و همکاری بازی می‌کند، و از هر مسابقهٔ دیگری چند ثانیه پس از شروع کنار می‌کشد. اگر آن مسابقه چندنفره و بدون رتبه بود، پس از آن بازی را با خرابی (کرش) متوقف می‌کند. R.U.S.E. ضدتقلب مؤثری ندارد، و برای همین RUSE Guard لازم است. بازی آنلاین با آن با مسئولیت خودتان است: Valve تصمیم می‌گیرد قوانین Steam چگونه اعمال شوند."


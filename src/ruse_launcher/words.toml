ita = "{app} deve prima installare un aggiornamento obbligatorio. Si installa da solo all'avvio: riavvia l'app con la connessione a Internet."
spa = "{app} tiene primero una actualización obligatoria que instalar. Se instala sola al iniciar: vuelve a abrir la aplicación con conexión a Internet."
pol = "{app} musi najpierw zainstalować wymaganą aktualizację. Instaluje się sama przy starcie: uruchom aplikację ponownie z dostępem do internetu."
ru = "{app} сначала должен установить обязательное обновление. Оно устанавливается само при запуске: запустите приложение снова с подключением к интернету."
cz = "{app} musí nejdřív nainstalovat povinnou aktualizaci. Nainstaluje se sama při spuštění: spusťte aplikaci znovu s připojením k internetu."
jpn = "{app} には先にインストールが必要な必須のアップデートがあります。起動時に自動でインストールされます。インターネットに接続した状態でもう一度起動してください。"
sc = "{app} 需要先安装一个必需的更新。它会在启动时自动安装：请在联网状态下重新启动应用。"
fa = "{app} اول باید یک به‌روزرسانی ضروری را نصب کند. این به‌روزرسانی هنگام اجرای برنامه خودش نصب می‌شود: برنامه را با اتصال به اینترنت دوباره اجرا کنید."

[share_help]
us = "Copy this and send it to a friend (Discord, a message…). They import it in RUSE Launcher (“Import a load order…”) or in RUSE Mod Manager and get the same mods in the same order. They need the mods too."
fr = "Copiez ceci et envoyez-le à un ami (Discord, un message…). Il l'importe dans RUSE Launcher (« Importer un ordre de chargement… ») ou dans RUSE Mod Manager et obtient les mêmes mods dans le même ordre. Il lui faut aussi les mods."
ger = "Kopieren Sie dies und schicken Sie es einem Freund (über Discord, per Nachricht…). Er importiert es in RUSE Launcher („Ladereihenfolge importieren…“) oder in RUSE Mod Manager und bekommt dieselben Mods in derselben Reihenfolge. Die Mods braucht er auch."
ita = "Copia questo testo e mandalo a un amico (Discord, un messaggio…). Lo importa in RUSE Launcher («Importa un ordine di caricamento…») o in RUSE Mod Manager e ottiene le stesse mod nello stesso ordine. Anche lui deve avere le mod."
spa = "Copia esto y envíaselo a un amigo (Discord, un mensaje…). Lo importa en RUSE Launcher («Importar un orden de carga…») o en RUSE Mod Manager y obtiene los mismos mods en el mismo orden. También necesita tener los mods."
pol = "Skopiuj to i wyślij znajomemu (Discord, wiadomość…). Zaimportuje to w RUSE Launcher („Importuj kolejność ładowania…”) lub w RUSE Mod Manager i dostanie te same mody w tej samej kolejności. Same mody też musi mieć."
ru = "Скопируйте это и отправьте другу (Discord, сообщение…). Он импортирует это в RUSE Launcher («Импортировать порядок загрузки…») или в RUSE Mod Manager и получит те же моды в том же порядке. Сами моды у него тоже должны быть."
cz = "Zkopírujte to a pošlete příteli (Discord, zpráva…). Ten si to naimportuje v RUSE Launcher („Importovat pořadí načítání…“) nebo v RUSE Mod Manager a dostane stejné módy ve stejném pořadí. Samotné módy ale musí mít také."
jpn = "これをコピーして友達に送ってください（Discord やメッセージなど）。友達が RUSE Launcher（「ロード順をインポート…」）か RUSE Mod Manager で読み込むと、同じMODが同じ順番で入ります。MOD自体も友達が持っている必要があります。"
sc = "复制这段内容并发送给好友（Discord、消息…）。对方在 RUSE Launcher（“导入加载顺序…”）或 RUSE Mod Manager 中导入，即可按相同顺序获得相同的模组。对方也需要拥有这些模组。"


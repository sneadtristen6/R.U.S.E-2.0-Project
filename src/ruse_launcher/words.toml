- Что он может собирать, когда игра это предоставляет: проверку файлов игры, меняющих игровой процесс, в сравнении с другими игроками; регулярные проверки того, что игра у всех остаётся одинаковой; сохранённый вами повтор; данные матча (карта, режим, игровые имена игроков, результат, время); список модов и их проверки. Сегодня игра не предоставляет записи матча, поэтому в обычном матче ничего не отправляется.
- Чего он никогда не собирает: ваши файлы, экран, нажатия клавиш и что-либо вне сетевого или кооперативного матча. Он никогда не читает память вашего компьютера. Когда игра записывает собственный отчёт о сбое, приложения читают этот отчёт на вашем ПК: RUSE Guard берёт из него только свои помеченные строки (ниже), а Bug Watch, если вы его отметили, — только сведения о сбое игры, перечисленные в разделе 6. Сам отчёт никогда не покидает ваш ПК.
- Читерская копия: модифицированная копия, собранная с читерским или тестовым инструментом, годится только для игры офлайн. Если её взять в сетевой или кооперативный матч, она через несколько секунд сдаёт матч, а затем останавливает игру на экране конца матча с выходом на рабочий стол. Собственный отправитель отчётов игры может затем отправить свой отчёт производителю игры, и в этом отчёте есть строка RUSE Guard о том, что читерская копия была остановлена. Launcher отправляет нам эту строку без Steam ID, длинных чисел и путей, под вашим именем пользователя. Честные копии никогда не останавливаются.
- Никаких автоматических банов. Если что-то выглядит неправильно, наша команда проверки (DomesticNukes и sneadtristen6) изучает доказательства и повтор, когда он есть, и принимает решение. Вы можете подать апелляцию sneadtristen6 в нашем Discord или на GitHub.
- Как долго хранятся записи: запись матча автоматически удаляется через 48 часов после того, как последняя запись этого матча поступила на наш сервер проверки. Матч с открытой проверкой хранится до решения; отклонённый затем удаляется. Если читерство подтверждено, доказательства хранятся, пока игрок может подать апелляцию; когда апелляция завершена или команда проверки их отпускает, остаётся только само решение, чтобы его можно было применять.
- Что может произойти: подтверждённое читерство может лишить вас доступа к сетевой игре через R.U.S.E. 2.0. Это никогда не затрагивает ваш аккаунт Steam и саму игру.
- Как прекратить: RUSE Guard обязателен для использования приложений; чтобы отказаться от него, перестаньте пользоваться приложениями.

6. Bug Watch: помогите нам находить и исправлять ошибки (по желанию, рекомендуется)
Зачем: чтобы Studio и Launcher лучше работали для вас и чтобы разработка шла легче. Вместо того чтобы ждать, пока кто-то сообщит о сбое, мы видим его, видим, что к нему привело, и исправляем раньше.
Если вы это отметите, Studio и Launcher считают, чем вы пользуетесь и когда что-то идёт не так, и раз в день отправляют это нашим разработчикам. Настройки показывают вам слово в слово, что будет отправлено. Простыми словами, это:
- код отчёта, созданный на вашем ПК в первый раз (чтобы ваши сбои можно было собрать вместе), и ваше имя пользователя;
- приложение и его версия, день, ваша версия Windows, ваш язык, сборка игры, включён ли RUSE Guard и какую версию этого соглашения вы приняли;
- как часто использовалась каждая часть приложения и сколько занимали операции, что пошло не так и где (только в нашем собственном коде), какие моды из нашего списка у вас были включены и сколько минут вы играли с каждым, и сколько у вас было собственных модов и какого рода вещи в них есть, например юниты, карты, миссии или скрипты (подсчитаны по видам, никогда не названы, и никогда не их слова, пути или файлы);
- при сбое приложения: вид ошибки и место в нашем коде; при сбое игры: её код сбоя, место в игре, где она остановилась, и до 16 мест в игре, которые к нему привели, место в памяти, которое она пыталась прочитать, записать или выполнить, собственный текст ошибки игры с сокращёнными путями к файлам, карта, на которой она была (карта игры — по её названию; карта, сделанная модом, — только как «карта мода», никогда не по названию), юнит, который игра создавала (юнит игры — по его номеру; юнит, добавленный модом, — только как «юнит мода»), и включённые моды. Юнит приложения отправляют, только когда могут прочитать его из отчёта игры о сбое.
Это видят только наши разработчики: оно хранится на нашем сервере и, когда он появится, в закрытом репозитории, который могут открыть только наши разработчики. Никогда не отправляются: ваше настоящее имя, ваш аккаунт Steam, ваши файлы и пути, а также названия и слова ваших собственных модов; файлы сбоев игры никогда не покидают ваш ПК. Ваши подсчёты и отчёты о сбоях удаляются через 7 дней; только очень серьёзный сбой, который мы ещё исправляем, хранится дольше, пока не будет исправлен, а после этого мы храним только итоги без имени и кода (например, «12 сборок не удались в тот день на версии 0.9.9»). Он выключен, пока вы его не отметите. Снимите отметку в любой момент в Настройках: больше ничего не считается и не отправляется, а сохранённое удаляется. Чтобы прямо сейчас удалить всё, что хранится под вашим кодом отчёта, попросите в нашем Discord или на GitHub.

7. Вход через Steam
Зачем: чтобы подтвердить, что вы владеете R.U.S.E., для сетевой игры, RUSE Guard и загрузки контента. Пока он ничему не нужен; приложения спрашивают один раз, а Настройки Launcher открывают его в любой момент.
- Вы входите на собственной странице Steam в своём браузере. Мы никогда не видим ваш пароль.
- Steam сообщает нашему серверу одно: владеет ли ваш аккаунт R.U.S.E. Если да, наш сервер выдаёт вашему ПК подписанный пропуск сроком на 30 дней.
- Что хранит наш сервер: односторонний код, составленный из вашего аккаунта Steam с нашим секретом, и когда пропуск выдан и когда истекает. Он никогда не хранит ваш Steam ID и ваш IP-адрес. Сам код входа хранится в виде хеша десять минут, а одноразовые номера входа Steam — сутки, чтобы вход нельзя было повторить.
- Что хранит ваш ПК: пропуск, в настройках приложений. Настройки могут выполнить выход, который его удаляет; чтобы удалить запись о вашем входе на сервере, попросите в нашем Discord или на GitHub.
- Если список игр вашего профиля Steam закрыт, Steam не может нам ничего сообщить; на минуту сделайте сведения об играх открытыми или попросите код разблокировки.

8. Ваше имя пользователя
Зачем: чтобы мы знали, чей это сбой или матч, и могли помочь этому человеку. Вы выбираете имя пользователя при первом запуске (к нему добавляется короткий номер, например Nick#4821), потому что RUSE Guard обязателен для всех. Оно отправляется только с тем, что относится к вам: с вашими записями матчей RUSE Guard и, если вы отметили Bug Watch, с вашими подсчётами Bug Watch. Одно имя пользователя действует в Studio и Launcher, и его можно сменить в Настройках. Чтобы удалить ваше имя пользователя и данные, попросите в нашем Discord или на GitHub.

9. Без гарантий
Приложения бесплатны и поставляются как есть, без какой-либо гарантии (GPL v3, разделы 15 и 16). Они собирают модифицированные копии игры и не трогают вашу установленную игру. Мы не отвечаем за игру, ваш аккаунт Steam и любые потери от использования приложений.

10. Изменения
Когда это соглашение меняется, приложения показывают его снова, прежде чем вы продолжите.

11. Контакты
Вопросы, сообщения об ошибках и апелляции: в нашем Discord (канал запросов модов или канал экспериментов / работы в процессе) или на GitHub. Проблемы безопасности: в частном порядке, как описано в нашей политике безопасности.


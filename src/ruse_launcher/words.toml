[clash_file]
us = "{a} and {b} both replace the same file, {file} ({kind}), with different contents. Only one of them can be in a set."
fr = "{a} et {b} remplacent tous deux le même fichier ({kind}), {file}, avec des contenus différents. Un seul d'entre eux peut être dans un ensemble."
ger = "{a} und {b} ersetzen beide dieselbe Datei ({kind}), {file}, mit unterschiedlichem Inhalt. Nur einer von ihnen kann in einem Set sein."
ita = "{a} e {b} sostituiscono entrambi lo stesso file ({kind}), {file}, con contenuti diversi. Solo uno di loro può stare in un set."
spa = "{a} y {b} reemplazan el mismo archivo ({kind}), {file}, con contenidos distintos. Solo uno de ellos puede estar en un conjunto."
pol = "{a} i {b} zastępują ten sam plik ({kind}), {file}, inną zawartością. Tylko jeden z nich może być w zestawie."
ru = "{a} и {b} заменяют один и тот же файл ({kind}), {file}, разным содержимым. В наборе может быть только один из них."
cz = "{a} a {b} nahrazují stejný soubor ({kind}), {file}, různým obsahem. V sadě může být jen jeden z nich."
jpn = "{a} と {b} は同じファイル({kind})の {file} を異なる内容で置き換えます。セットに入れられるのはどちらか一方だけです。"
sc = "{a} 和 {b} 都用不同的内容替换了同一个文件（{kind}）{file}。组合中只能保留其中一个。"

[clash_archive]
us = "{a} replaces the whole archive {file}, and {b} changes files inside it; one of the two would be lost. Only one of them can be in a set."
fr = "{a} remplace toute l'archive {file}, et {b} modifie des fichiers à l'intérieur ; l'un des deux serait perdu. Un seul d'entre eux peut être dans un ensemble."
ger = "{a} ersetzt das ganze Archiv {file}, und {b} ändert Dateien darin; eines von beiden ginge verloren. Nur einer von ihnen kann in einem Set sein."
ita = "{a} sostituisce l'intero archivio {file}, e {b} modifica file al suo interno; uno dei due andrebbe perso. Solo uno di loro può stare in un set."
spa = "{a} reemplaza el archivo comprimido {file} entero, y {b} cambia archivos dentro de él; uno de los dos se perdería. Solo uno de ellos puede estar en un conjunto."
pol = "{a} zastępuje całe archiwum {file}, a {b} zmienia pliki w jego wnętrzu; jedno z nich by przepadło. Tylko jeden z nich może być w zestawie."
ru = "{a} заменяет весь архив {file}, а {b} меняет файлы внутри него; одно из двух пропадёт. В наборе может быть только один из них."
cz = "{a} nahrazuje celý archiv {file} a {b} mění soubory uvnitř něj; jedno z toho by se ztratilo. V sadě může být jen jeden z nich."
jpn = "{a} はアーカイブ {file} 全体を置き換え、{b} はその中のファイルを変更します。どちらかが失われます。セットに入れられるのはどちらか一方だけです。"
sc = "{a} 替换了整个归档 {file}，而 {b} 修改了其中的文件；两者之一会丢失。组合中只能保留其中一个。"

[clash_create]

- 你电脑上的 RUSE Guard 记录:等待发送的一条会保留到发送为止;我们的服务器拒绝的一条在被搁置 30 天后删除。
- Bug Watch:第 7 节。
- Steam 登录:第 8 节。
- 工单、消息和邮件:只要对话需要就保留。GitHub 工单保留到你或我们删除它们。
- 支持者的署名:此后的每个发布版本中都有。提出要求,我们会把你的署名从以后的发布版本中去掉;已经发布的版本无法更改。
- 备份:Cloudflare 保留我们服务器数据库 7 天的历史(在我们的免费套餐上,正如 Cloudflare 自己的文档所说),所以我们删除的内容在我们删除之后还会在该历史中保留最多 7 天。

你的权利
你可以要求我们提供我们保存的关于你的数据的副本;更正它;删除它;在某个相关问题得到解决期间停止使用它;以及把你的 Bug Watch 数据和用户名以可重复使用的文件形式提供给你。你可以随时通过取消勾选来撤回你对 Bug Watch 的同意;这不会撤销之前已发送的内容。
方式:发邮件到 sneadtristen6@gmail.com,或在 Discord 上给 sneadtristen6 发私信。告诉我们你的用户名,如果你使用或曾使用 Bug Watch,告诉我们你的报告码(设置只在 Bug Watch 开启时显示它),以及你的 RUSE Guard 代码(设置会显示它,名为“你的 RUSE Guard 代码”);对于 Steam 登录,告诉我们你的 Steam ID。我们的服务器不询问你的真实姓名,所以没有这些,我们可能找不到你的数据。如果我们不确定某个请求是你本人提出的,我们可能会要求更多信息。我们在一个月内免费答复;如果请求很复杂,我们最多可以再用两个月,并会告诉你原因。
如果你不再使用这些应用,你可以要求我们删除你的 RUSE Guard 记录,我们会照办。如果在你的用户名下已确认作弊,我们只保留那个标记及其所依据的决定:你的用户名、对战、结论、日期,以及该标记附带的 RUSE Guard 密钥。我们也可能保留仍在审核或申诉中的作弊案件所需的内容。
投诉:你可以向你居住或工作所在地的、或你认为问题发生地的数据保护机构投诉;在法国是 CNIL(cnil.fr),在英国是 ICO(ico.org.uk)。任何人都可以先向我们投诉。如果你在英国,我们会在 30 天内确认收到你的投诉。

你的反对权
你可以随时基于与你自身情况有关的理由,反对我们为 RUSE Guard 使用你的数据。请给我们发邮件。如果我们同意,我们会删除你的 RUSE Guard 记录,作弊标记及其决定(如上)除外,并告诉你使用我们的应用必须有 RUSE Guard:不再发送新记录的唯一办法就是不使用它们。如果我们有压过你的理由的令人信服的理由,例如仍在审核或申诉中的作弊案件,我们可能不同意。

其他玩家
目前 RUSE Guard 不发送任何关于你对战中其他玩家的内容:没有姓名,也没有回放。作弊或测试副本只向其他玩家的游戏告知一个简短的构建码。如果以后的版本发送对战记录或回放,其中可能包含其他玩家的游戏内名称,本文会先说明。本声明是公开的,所以不使用我们应用的玩家也可以阅读。任何人都可以询问我们以他们的游戏内名称保存了什么,上述权利同样属于他们。

跟踪
这些应用不会跟踪你在其他网站或应用上的行为,也不含广告网络或其他外部跟踪器。这些应用不是网页浏览器,所以它们不读取浏览器的“请勿跟踪”信号;你的选择是 Bug Watch 的勾选,以及你是否使用 Steam 登录。

安全
这些应用只通过加密连接访问我们的服务器,并且只有带有我们的签名才会安装更新(第 12 节)。它们自己生成 Steam 登录页面的地址。我们的 RUSE Guard 服务器只告诉被标记玩家自己的 Launcher 它被标记了。没有任何系统是绝对安全的:如果发生了使你的数据面临风险的事情,我们会在我们的 GitHub 页面和 Discord 上说明,并在法律要求的情况下通知数据保护机构。

留在你电脑上的内容
这些应用把它们的设置和工作文件保存在名为 RUSE Mod Platform 的文件夹中,位于你的 Windows 用户的 AppData\\Local 文件夹内:

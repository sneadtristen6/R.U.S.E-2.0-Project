Když se tato smlouva změní, aplikace ji znovu zobrazí, než budete pokračovat.

11. Kontakt
Dotazy, hlášení chyb a odvolání: na našem Discordu (kanál žádostí o módy nebo kanál experimentů / rozpracované práce) nebo na GitHubu. Bezpečnostní problémy: soukromě, jak říká naše bezpečnostní politika.


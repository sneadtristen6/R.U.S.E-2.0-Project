Proč: abychom věděli, čí je pád nebo zápas, a mohli tomu člověku pomoci. Uživatelské jméno si zvolíte při prvním spuštění (přidá se k němu krátké číslo, například Nick#4821), protože RUSE Guard je povinný pro všechny. Posílá se jen s tím, co se vás týká: s vašimi záznamy zápasů RUSE Guard a, pokud jste zaškrtli Bug Watch, s vašimi počty Bug Watch. Jedno uživatelské jméno platí pro Studio i Launcher a v Nastavení ho můžete změnit. Chcete-li smazat své uživatelské jméno a data, požádejte na našem Discordu nebo GitHubu.


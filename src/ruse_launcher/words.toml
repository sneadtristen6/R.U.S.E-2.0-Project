[guide_title]
us = "Playing with mods, in three steps"
fr = "Jouer avec des mods, en trois étapes"
ger = "Mit Mods spielen, in drei Schritten"
ita = "Giocare con le mod, in tre passi"
spa = "Jugar con mods, en tres pasos"
pol = "Gra z modami w trzech krokach"
ru = "Игра с модами в три шага"
cz = "Hraní s módy ve třech krocích"
jpn = "MODで遊ぶための3ステップ"
sc = "使用模组游玩，只需三步"

[guide_add]
us = "Add mods: “Add a mod file…” on the left, or drop the file on this window. RUSE Studio mods (.rusemod), RUSE Mod Manager mods (.rmod) and .zip files all work. Or find one under “Supported mods”."
fr = "Ajoutez des mods : « Ajouter un fichier de mod… » à gauche, ou déposez le fichier dans cette fenêtre. Les mods de RUSE Studio (.rusemod), les mods de RUSE Mod Manager (.rmod) et les fichiers .zip fonctionnent tous. Ou trouvez-en un dans « Mods compatibles »."
ger = "Mods hinzufügen: „Mod-Datei hinzufügen…“ links oder die Datei in dieses Fenster ziehen. Mods aus RUSE Studio (.rusemod), Mods aus RUSE Mod Manager (.rmod) und .zip-Dateien funktionieren alle. Oder unter „Unterstützte Mods“ einen finden."
ita = "Aggiungi le mod: «Aggiungi un file di mod…» a sinistra, oppure trascina il file in questa finestra. Funzionano le mod di RUSE Studio (.rusemod), le mod di RUSE Mod Manager (.rmod) e i file .zip. Oppure trovane una in «Mod supportate»."
spa = "Añade mods: «Añadir un archivo de mod…» a la izquierda, o suelta el archivo en esta ventana. Funcionan los mods de RUSE Studio (.rusemod), los de RUSE Mod Manager (.rmod) y los archivos .zip. O encuentra uno en «Mods compatibles»."
pol = "Dodaj mody: „Dodaj plik moda…” po lewej lub upuść plik w tym oknie. Działają mody z RUSE Studio (.rusemod), mody z RUSE Mod Manager (.rmod) i pliki .zip. Możesz też znaleźć mod w sekcji „Obsługiwane mody”."
ru = "Добавьте моды: «Добавить файл мода…» слева или перетащите файл в это окно. Подходят моды RUSE Studio (.rusemod), моды RUSE Mod Manager (.rmod) и файлы .zip. Или найдите мод в разделе «Поддерживаемые моды»."
cz = "Přidejte módy: „Přidat soubor módu…“ vlevo, nebo přetáhněte soubor do tohoto okna. Fungují módy z RUSE Studio (.rusemod), módy z RUSE Mod Manager (.rmod) i soubory .zip. Nebo si nějaký najděte v sekci „Podporované módy“."
jpn = "MODを追加：左の「MODファイルを追加…」を押すか、ファイルをこのウィンドウにドロップしてください。RUSE StudioのMOD（.rusemod）、RUSE Mod ManagerのMOD（.rmod）、.zipファイルのどれでも使えます。「対応MOD」から見つけることもできます。"
sc = "添加模组：点击左侧的“添加模组文件…”，或将文件拖放到此窗口。RUSE Studio 模组（.rusemod）、RUSE Mod Manager 模组（.rmod）和 .zip 文件都可以使用。也可以在“支持的模组”中查找。"

[guide_set]
us = "Make a mod set: “New mod set…”, tick the mods and put them in order. Where two mods change the same thing, the lower one wins."
fr = "Créez un ensemble de mods : « Nouvel ensemble de mods… », cochez les mods et mettez-les dans l'ordre. Si deux mods modifient la même chose, le plus bas l'emporte."
ger = "Ein Mod-Set erstellen: „Neues Mod-Set…“, die Mods anhaken und in die richtige Reihenfolge bringen. Ändern zwei Mods dasselbe, gewinnt der untere."
ita = "Crea un set di mod: «Nuovo set di mod…», spunta le mod e mettile in ordine. Se due mod cambiano la stessa cosa, vince quella più in basso."
spa = "Crea un conjunto de mods: «Nuevo conjunto de mods…», marca los mods y ponlos en orden. Si dos mods cambian lo mismo, gana el de más abajo."
pol = "Utwórz zestaw modów: „Nowy zestaw modów…”, zaznacz mody i ustaw je w kolejności. Gdy dwa mody zmieniają to samo, wygrywa niższy."
ru = "Создайте набор модов: «Новый набор модов…», отметьте моды и расставьте их по порядку. Если два мода меняют одно и то же, побеждает нижний."
cz = "Vytvořte sadu módů: „Nová sada módů…“, zaškrtněte módy a seřaďte je. Když dva módy mění totéž, vyhrává ten níže."
jpn = "MODセットを作る：「新しいMODセット…」を押し、MODにチェックを入れて順番に並べてください。2つのMODが同じ項目を変える場合は、下のMODが優先されます。"
sc = "创建模组组合：点击“新建模组组合…”，勾选模组并排好顺序。两个模组修改同一项时，下面的优先。"

[guide_play]
us = "Pick the set and press Play. The launcher builds a separate modded copy of the game and starts it; your Steam game stays as it is."
fr = "Choisissez l'ensemble et appuyez sur Jouer. Le lanceur crée une copie distincte du jeu avec les mods et la démarre ; votre jeu Steam reste tel quel."
ger = "Das Set wählen und auf „Spielen“ klicken. Der Launcher erstellt eine separate Kopie des Spiels mit den Mods und startet sie; Ihr Steam-Spiel bleibt, wie es ist."
ita = "Scegli il set e premi Gioca. Il launcher crea una copia separata del gioco con le mod e la avvia; il tuo gioco Steam resta com'è."
spa = "Elige el conjunto y pulsa Jugar. El lanzador crea una copia aparte del juego con los mods y la inicia; tu juego de Steam se queda como está."
pol = "Wybierz zestaw i naciśnij Graj. Launcher tworzy osobną kopię gry z modami i ją uruchamia; twoja gra ze Steama pozostaje bez zmian."
ru = "Выберите набор и нажмите «Играть». Лаунчер создаёт отдельную копию игры с модами и запускает её; ваша игра в Steam остаётся как есть."
cz = "Vyberte sadu a stiskněte Hrát. Launcher vytvoří samostatnou kopii hry s módy a spustí ji; vaše hra ze Steamu zůstane beze změny."
jpn = "セットを選んで「プレイ」を押してください。ランチャーがMOD入りのゲームの別コピーを作って起動します。Steam のゲームはそのままです。"
sc = "选择组合，然后点击“开始游戏”。启动器会创建一份单独的模组版游戏副本并启动它；你的 Steam 游戏保持原样。"


ru = "Копия с модами находится не на том диске, где игра, поэтому файлы игры копируются в неё, а не используются совместно: в этот раз {gb} ГБ. Если копии с модами лежат на диске игры ({drive}), игра с модами запускается намного быстрее."
cz = "Kopie s módy je na jiném disku než hra, takže se do ní soubory hry kopírují místo sdílení: tentokrát {gb} GB. S kopiemi s módy na disku hry ({drive}) se hra s módy spouští mnohem rychleji."
jpn = "MOD入りコピーがゲームとは別のドライブにあるため、ゲームのファイルを共有できずコピーしています（今回 {gb} GB）。MOD入りコピーをゲームのドライブ（{drive}）に置くと、MOD入りのゲームがずっと速く起動します。"
sc = "模组版副本与游戏不在同一驱动器上，因此游戏文件只能复制过去，无法共享：本次复制了 {gb} GB。把模组版副本放在游戏所在的驱动器（{drive}）上，启动模组版游戏会快很多。"
fa = "نسخهٔ مادشده روی درایوی غیر از درایو بازی است، پس بسته‌های بازی در آن کپی می‌شوند، نه این‌که شریک شوند: این بار {gb} GB کپی شد. اگر نسخه‌های مادشده روی درایو بازی ({drive}) باشند، اجرای بازی با مادها خیلی سریع‌تر است."


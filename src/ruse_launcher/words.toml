[tip_badge_scripts]
us = "This mod changes the game's scripts. Scripts run inside the game and can do anything it can: Play waits until you tick that you trust its author."
fr = "Ce mod modifie les scripts du jeu. Les scripts s'exécutent dans le jeu et peuvent tout faire : Jouer attend que vous cochiez que vous faites confiance à son auteur."
ger = "Dieser Mod ändert die Skripte des Spiels. Skripte laufen im Spiel und können alles, was es kann: Spielen wartet, bis Sie bestätigen, dass Sie dem Autor vertrauen."
ita = "Questo mod cambia gli script del gioco. Gli script girano nel gioco e possono fare tutto ciò che fa: Gioca aspetta che tu indichi di fidarti dell'autore."
spa = "Este mod cambia los scripts del juego. Los scripts se ejecutan dentro del juego y pueden hacer todo lo que él hace: Jugar espera a que marques que confías en su autor."
pol = "Ten mod zmienia skrypty gry. Skrypty działają w grze i mogą wszystko, co ona: Graj czeka, aż zaznaczysz, że ufasz autorowi."
ru = "Этот мод меняет скрипты игры. Скрипты работают внутри игры и могут всё, что может она: «Играть» ждёт, пока вы отметите, что доверяете автору."
cz = "Tento mód mění skripty hry. Skripty běží uvnitř hry a mohou vše, co ona: Hrát čeká, dokud nezaškrtnete, že autorovi věříte."
jpn = "この MOD はゲームのスクリプトを変更します。スクリプトはゲーム内で動き、ゲームにできることは何でもできます。作者を信頼するとチェックするまで「プレイ」は始まりません。"
sc = "这个模组会修改游戏脚本。脚本在游戏内运行，能做游戏能做的任何事：勾选信任作者之前，“开始游戏”会等待。"
fa = "این ماد اسکریپت‌های بازی را تغییر می‌دهد. اسکریپت‌ها درون بازی اجرا می‌شوند و هر کاری که بازی می‌تواند، می‌توانند بکنند: «بازی» منتظر می‌ماند تا تیک بزنید که به سازنده‌اش اعتماد دارید."

[mod_offline]

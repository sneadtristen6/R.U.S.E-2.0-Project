Kde se to uchovává
Databáze našich serverů ukládá Cloudflare ve východní Severní Americe; síť Cloudflare je obsluhuje z datových center po celém světě. Záznamy RUSE Guard se shromažďují k posouzení na vlastním počítači sneadtristen6 ve Spojených státech. Když zkoumáme problém, mohou být kopie hlášení Bug Watch také na jeho počítači: kopie, která patří k chybě, kterou opravujeme, se smaže, jakmile je chyba opravena, a kopie, která žádnou chybu neukazuje, se smaže po 7 dnech. sneadtristen6 je ve Spojených státech a Cloudflare je americká společnost, takže vaše údaje se zpracovávají ve Spojených státech a všude, kde Cloudflare provozuje své služby.

Jak dlouho to uchováváme
- Záznamy RUSE Guard: náš server RUSE Guard uchovává každý záznam, dokud ho náš počítač k posouzení nevyzvedne, a nikdy déle než 3 dny po jeho příchodu: pak se smaže, ať už vyzvednut byl, nebo ne. Na počítači k posouzení se záznamy zápasu mažou zhruba 48 hodin poté, co dorazil poslední z nich (při jeho dalším úklidu, který běží vždy, když záznamy vyzvedává), pokud není otevřeno posouzení zápasu. Zápas v posouzení se uchovává, dokud se nerozhodne; pokud je zamítnut, pak se smaže. Pokud se podvádění potvrdí, máte 30 dnů od rozhodnutí na odvolání: důkazy se po těch 30 dnů uchovávají a pokud se odvoláte, až do rozhodnutí o vašem odvolání. Poté se důkazy smažou a uchová se jen rozhodnutí, po dobu, po kterou platí. Pokud je odvolání uznáno, rozhodnutí se označí jako zrušené a nikdy se proti vám nepoužije; požádejte nás a smažeme i je. Poznámka o zastavení podvodné kopie neotevírá žádné posouzení: je vypsána, aby ji sneadtristen6 viděl, a maže se jako každý záznam.
- Seznam uživatelských jmen a klíčů RUSE Guard na počítači k posouzení, s údajem, kdy byl každý poprvé spatřen: uchovává se zatím bez časového omezení; napište nám e-mail a smažeme váš.
- Záznamy RUSE Guard na vašem PC: ten, který čeká na odeslání, zůstává, dokud se neodešle; ten, který náš server odmítl, se smaže 30 dnů poté, co byl odložen.
- Bug Watch: oddíl 7.
- Přihlášení přes Steam: oddíl 8.
- Tickety, zprávy a e-maily: tak dlouho, jak konverzace potřebuje. Tickety na GitHubu zůstávají, dokud je vy nebo my nesmažeme.
- Jména podporovatelů pro poděkování: v každém vydání od té doby. Požádejte a vaše jméno z budoucích vydání odstraníme; už zveřejněná vydání změnit nelze.
- Zálohy: Cloudflare uchovává historii databází našich serverů 7 dnů (v našem bezplatném tarifu, jak říká vlastní dokumentace Cloudflare), takže to, co smažeme, zůstává v této historii až 7 dnů po smazání.

Vaše práva
Můžete nás požádat o kopii údajů, které o vás máme; o jejich opravu; o jejich smazání; o to, abychom je přestali používat, dokud se řeší otázka o nich; a o vaše údaje Bug Watch a uživatelské jméno v souboru, který můžete znovu použít. Svůj souhlas s Bug Watch můžete kdykoli odvolat zrušením zaškrtnutí; to nevrací zpět to, co bylo odesláno dříve.
Jak: napište e-mail na sneadtristen6@gmail.com nebo pošlete sneadtristen6 soukromou zprávu na Discordu. Uveďte své uživatelské jméno, svůj kód hlášení, pokud Bug Watch používáte nebo jste používali (Nastavení ho ukazuje, jen dokud je Bug Watch zapnutý), a svůj kód RUSE Guard (Nastavení ho ukazuje jako „Váš kód RUSE Guard“); u přihlášení přes Steam své Steam ID. Naše servery se neptají na vaše skutečné jméno, takže bez těchto údajů vaše údaje nemusíme najít. Pokud si nejsme jisti, že žádost je vaše, můžeme požádat o více. Odpovíme do jednoho měsíce, zdarma; pokud je žádost složitá, můžeme si vzít až dva další měsíce a sdělíme vám proč.
Pokud aplikace přestanete používat, můžete nás požádat o smazání svých záznamů RUSE Guard a my je smažeme. Pokud se pod vaším uživatelským jménem potvrdilo podvádění, uchováme jen toto označení a rozhodnutí, na němž stojí: vaše uživatelské jméno, zápas, verdikt, jeho datum a klíč RUSE Guard, s nímž označení přišlo. Můžeme také uchovat to, co potřebuje případ podvádění, který je ještě v posouzení nebo odvolání.
Stížnosti: můžete si stěžovat úřadu na ochranu údajů v místě, kde žijete nebo pracujete, nebo kde si myslíte, že k problému došlo; ve Francii je to CNIL (cnil.fr), ve Spojeném království ICO (ico.org.uk). Kdokoli si nejdřív může stěžovat nám. Pokud jste ve Spojeném království, potvrdíme vám přijetí stížnosti do 30 dnů.

VAŠE PRÁVO VZNÉST NÁMITKU
Můžete kdykoli vznést námitku, z důvodů týkajících se vaší vlastní situace, proti našemu používání vašich údajů pro RUSE Guard. Napište nám e-mail. Pokud souhlasíme, smažeme vaše záznamy RUSE Guard, kromě označení za podvádění a jeho rozhodnutí (jak je uvedeno výše), a sdělíme vám, že RUSE Guard je povinný pro používání našich aplikací: jediný způsob, jak neposílat žádné nové záznamy, je je nepoužívat. Nemusíme souhlasit, pokud máme závažné důvody, které vaše převáží, například případ podvádění, který je ještě v posouzení nebo odvolání.

Ostatní hráči
Dnes RUSE Guard neposílá nic o ostatních hráčích ve vašich zápasech: žádná jména a žádné záznamy přehrávání. Podvodná nebo testovací kopie sděluje hrám ostatních hráčů jen krátký kód sestavení. Pokud pozdější verze bude posílat záznamy o zápasech nebo záznamy přehrávání, které mohou obsahovat herní jména ostatních hráčů, tento text to řekne dopředu. Toto oznámení je veřejné, takže si ho mohou přečíst i hráči, kteří naše aplikace nepoužívají. Kdokoli se nás může zeptat, co o něm pod jeho herním jménem máme, a výše uvedená práva jsou i jeho.

Sledování
Aplikace nesledují, co děláte na jiných webech nebo v jiných aplikacích, a neobsahují žádné reklamní sítě ani jiné vnější sledovače. Aplikace nejsou webové prohlížeče, takže nečtou signál prohlížeče „Do Not Track“; vaše volby jsou zaškrtnutí Bug Watch a to, zda použijete přihlášení přes Steam.

Zabezpečení
Aplikace se k našim serverům připojují jen přes šifrovaná spojení a aktualizaci nainstalují, jen když nese náš podpis (oddíl 12). Adresu přihlašovací stránky Steamu si vytvářejí samy. Náš server RUSE Guard sděluje, že je označený, jen Launcheru označeného hráče. Žádný systém není dokonale bezpečný: pokud se stane něco, co ohrozí vaše údaje, řekneme to na naší stránce na GitHubu a našem Discordu a informujeme úřady na ochranu údajů tam, kde to zákon vyžaduje.

Co zůstává na vašem PC
Aplikace uchovávají svá nastavení a pracovní soubory ve složce RUSE Mod Platform, uvnitř složky AppData\\Local vašeho uživatele Windows:
- vaše uživatelské jméno a ID instalace, váš klíč RUSE Guard, vaše volby, propustka Steam, pokud jste se přihlásili, a odemykací kódy;
- seznam známých pádů hry Bug Watch, dokud je Bug Watch zapnutý;
- počty Bug Watch, které ještě nebyly odeslány, a hlášení čekající na odeslání;
- záznamy RUSE Guard čekající na odeslání a ty, které náš server odmítl (smažou se 30 dnů po odložení);
- protokoly toho, co aplikace dělaly (mohou obsahovat názvy složek);
- vlastní data prohlížeče okna aplikace;
- stažené soubory (instalátor aktualizace se smaže při dalším spuštění aplikace po instalaci).
Aby aplikace poznaly, zda hra z vaší upravené kopie ještě běží, také sledují, které programy běží a odkud (je to mimo kontrolu programů RUSE Guard v oddílu 6); to zůstává na vašem PC. Když aplikace čtou hlášení hry o pádech (oddíly 6 a 7), dělají to na vašem PC a nikdy je neposílají; jen vlastní hlásič pádů hry může poslat své hlášení tvůrci hry (oddíl 3). Nic z této složky se nikam neposílá, kromě případů, které říkají oddíly 5 až 8 a 12. Když odinstalujete druhou ze dvou aplikací, odinstalátor se zeptá, zda smazat i tuto složku; odpověď je předvolena na Ne. Ano ji smaže, kromě módů, map, exportů nebo záloh, které v ní uchovala starší verze. Dokud je druhá aplikace stále nainstalovaná, nic se neptá a nic nemaže, protože obě aplikace tuto složku používají. Jinak ji chcete-li odstranit, smažte ji sami. Vaše módy, mapy, exporty a zálohy ve složce RUSE 2.0 v Dokumentech, vaše upravená kopie a čistá záloha vaší hry také zůstávají, dokud je nesmažete.

12. Aktualizace a jiné weby, ke kterým se aplikace připojují
- Aktualizace: jakmile přijmete tyto podmínky, obě aplikace se při každém spuštění ptají GitHubu, zda existuje nová verze; dokud je nepřijmete, neptají se na nic. Pokud je aktualizace venku a váš jazyk není angličtina, aplikace stáhnou z GitHubu i její poznámky. Volitelné aktualizace se nainstalují, když stisknete Aktualizovat. Aktualizace, kterou označíme jako povinnou, se stáhne a nainstaluje sama při spuštění aplikace, bez ptaní, a Hrát a Vyzkoušet ve hře čekají, dokud není nainstalována. V obou případech se aktualizace nainstaluje, jen když nese náš podpis a je přesně tím souborem, který jsme podepsali; jinak se nenainstaluje nic a aplikace to řekne a odkáže vás na náš Discord. Pokud se její stažení třikrát nezdaří, aplikace to sama přestane zkoušet a odkáže vás na stránku vydání na GitHubu; povinná aktualizace i tak drží Hrát a Vyzkoušet ve hře v čekání. Náš podpisový klíč se nikdy nenahrává. Při dalším spuštění po aktualizaci aplikace instalátor této aktualizace smaže. Pokud jste dříve stáhli jednotky z jiných období, Studio při spuštění také kontroluje novější verze a stahuje je samo. Opravy dostává jen nejnovější verze každé aplikace.
- Kromě našich vlastních serverů se aplikace připojují k těmto webům. Každý vidí vaši IP adresu a to, o co se žádá, a může uchovávat protokoly podle vlastních zásad ochrany soukromí:
  - GitHub (Microsoft): aktualizace a jejich poznámky; seznam módů a módy na něm (první spuštění Launcheru stahuje seznam hned po obrazovce s podmínkami); jednotky z jiných období; záplaty hry, při sestavení, které ji potřebuje; a některé soubory pohybů;
  - jakýkoli jiný web, který náš seznam módů může u módu uvést: stažení tohoto módu (Launcher nejdřív porovná velikost a kontrolní součet každého souboru se seznamem);
  - Poly Haven a ambientCG: bezplatné online textury Map Paint, s jejich malými obrázky načítanými z adres, které tyto weby udávají (ambientCG dostává slova, která zadáte do jeho vyhledávání);
  - National Map Americké geologické služby (U.S. Geological Survey): letecké snímky (dostává oblast kolem místa, které vyberete);
  - Zenodo a veřejná sbírka souborů pohybů na GitHubu: pohyby v RUSE Decoy, záložce Studia pro zvuk a animace;

- Bug Watch 已知游戏崩溃的列表,在 Bug Watch 开启期间;
- Bug Watch 尚未发送的统计,以及等待发送的报告;
- 等待发送的 RUSE Guard 记录,以及我们的服务器拒绝的记录(在被搁置 30 天后删除);
- 应用所做操作的日志(其中可能包含文件夹名称);
- 应用窗口自己的浏览器数据;
- 下载的文件(更新的安装程序在更新安装后应用下一次启动时删除)。

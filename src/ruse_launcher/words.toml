[tip_title_gold]
us = "Tick it for R.U.S.E. 2.0 in gold on the menu and the loading screens of your game, with mods or without, and our intro in place of Eugen's logo video. It's off unless you tick it."
fr = "Cochez pour avoir R.U.S.E. 2.0 doré au menu et sur les écrans de chargement de votre jeu, avec ou sans mods, et notre intro à la place de la vidéo du logo d'Eugen Systems. C'est désactivé tant que vous ne cochez pas."
ger = "Setz das Häkchen für R.U.S.E. 2.0 in Gold im Menü und auf den Ladebildschirmen deines Spiels, mit Mods oder ohne, und unser Intro statt des Logo-Videos von Eugen Systems. Aus, bis du das Häkchen setzt."
ita = "Metti la spunta per R.U.S.E. 2.0 in oro nel menu e nelle schermate di caricamento del tuo gioco, con le mod o senza, e il nostro video introduttivo al posto del video del logo di Eugen Systems. È spento finché non metti la spunta."
spa = "Márcalo para tener R.U.S.E. 2.0 en dorado en el menú y en las pantallas de carga de tu juego, con mods o sin ellos, y nuestro vídeo de introducción en lugar del vídeo del logo de Eugen Systems. Está desactivado hasta que lo marques."

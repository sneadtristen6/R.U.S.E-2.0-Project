این پروژه فقط وقتی از R.U.S.E. پشتیبانی می‌کند که آن را داشته باشید. پیش از آن‌که یک بازی مادشده شروع شود، برنامه‌ها از روی فایل‌هایی که Steam به جا گذاشته بررسی می‌کنند که پوشهٔ بازی نسخه‌ای است که مال شماست: رکورد نصب Steam، فایل امضاشدهٔ خود Steam و نبودن فایل‌هایی که بازی را بدون Steam اجرا می‌کنند. برای این بررسی چیزی فرستاده نمی‌شود. اگر نسخهٔ شما تأیید نشود (نسخهٔ جعبه‌ای از پیش از آمدن R.U.S.E. به Steam، یا بررسی‌ای که اشتباه کرده)، پنجره‌ای کدی را نشان می‌دهد که از این رایانه و فایل اصلی بازی ساخته شده، و این‌که چگونه در Discord یا GitHub ما درخواست پشتیبانی باز کنید؛ آن کد فقط وقتی از رایانهٔ شما خارج می‌شود که خودتان آن را آن‌جا بچسبانید. ما کد بازگشایی‌ای می‌فرستیم که فقط روی همان رایانه کار می‌کند.


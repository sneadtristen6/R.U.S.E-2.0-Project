Vidí to jen naši vývojáři: je to uloženo na našem serveru a, jakmile vznikne, v soukromém repozitáři, který mohou otevřít jen naši vývojáři. Nikdy se neodesílá: vaše skutečné jméno, váš účet Steam, vaše soubory ani cesty, ani názvy a slova vašich vlastních módů; soubory pádů hry nikdy neopustí váš PC. Vaše počty a hlášení o pádech se smažou po 7 dnech; jen velmi vážný pád, který ještě opravujeme, se uchová déle, dokud není opraven, a poté uchováváme jen součty bez jména a kódu (třeba „12 sestavení ten den selhalo na verzi 0.9.9"). Je vypnutý, dokud ho nezaškrtnete. Kdykoli ho v Nastavení odškrtněte: nic dalšího se nepočítá ani neodesílá a to, co bylo uloženo, se smaže. Chcete-li hned smazat vše uložené pod vaším kódem hlášení, požádejte na našem Discordu nebo GitHubu.


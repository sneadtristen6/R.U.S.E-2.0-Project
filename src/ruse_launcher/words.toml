[set_copies_help]
us = "Play builds the modded copy of the game in this folder. The recommended place is RUSE-Instances on the game's drive: there the copy shares the game's files and is ready in seconds. On another drive it is a full copy of the game, slower and bigger. The game's clean backup goes beside it, in RUSE-Backup. After a change, the next Play builds in the new place; the old folder only takes up space and can be deleted by hand."
fr = "Jouer construit la copie du jeu avec les mods dans ce dossier. L'emplacement recommandé est RUSE-Instances sur le disque du jeu : la copie y partage les fichiers du jeu et est prête en quelques secondes. Sur un autre disque, c'est une copie complète du jeu, plus lente et plus grosse. La sauvegarde propre du jeu va à côté, dans RUSE-Backup. Après un changement, le prochain Jouer construit au nouvel endroit ; l'ancien dossier ne fait qu'occuper de la place et peut être supprimé à la main."
ger = "Spielen baut die Kopie des Spiels mit Mods in diesem Ordner. Der empfohlene Ort ist RUSE-Instances auf dem Laufwerk des Spiels: Dort teilt die Kopie die Dateien des Spiels und ist in Sekunden fertig. Auf einem anderen Laufwerk ist sie eine vollständige Kopie des Spiels, langsamer und größer. Die saubere Sicherung des Spiels kommt daneben, in RUSE-Backup. Nach einer Änderung baut das nächste Spielen am neuen Ort; der alte Ordner belegt nur Platz und kann von Hand gelöscht werden."
ita = "Gioca costruisce la copia del gioco con le mod in questa cartella. Il posto consigliato è RUSE-Instances sull'unità del gioco: lì la copia condivide i file del gioco ed è pronta in pochi secondi. Su un'altra unità è una copia completa del gioco, più lenta e più grande. Il backup pulito del gioco va accanto, in RUSE-Backup. Dopo un cambio, il prossimo Gioca costruisce nel nuovo posto; la vecchia cartella occupa solo spazio e si può eliminare a mano."
spa = "Jugar construye la copia del juego con mods en esta carpeta. El lugar recomendado es RUSE-Instances en la unidad del juego: allí la copia comparte los archivos del juego y está lista en segundos. En otra unidad es una copia completa del juego, más lenta y más grande. La copia de seguridad limpia del juego va al lado, en RUSE-Backup. Tras un cambio, el próximo Jugar construye en el nuevo lugar; la carpeta antigua solo ocupa espacio y puede borrarse a mano."
pol = "Graj buduje kopię gry z modami w tym folderze. Zalecane miejsce to RUSE-Instances na dysku gry: tam kopia dzieli pliki z grą i jest gotowa w kilka sekund. Na innym dysku jest pełną kopią gry, wolniejszą i większą. Czysta kopia zapasowa gry trafia obok, do RUSE-Backup. Po zmianie następne Graj buduje w nowym miejscu; stary folder tylko zajmuje miejsce i można go usunąć ręcznie."
ru = "Играть собирает копию игры с модами в этой папке. Рекомендуемое место — RUSE-Instances на диске игры: там копия делит файлы с игрой и готова за секунды. На другом диске это полная копия игры, медленнее и больше. Чистая резервная копия игры идёт рядом, в RUSE-Backup. После смены следующее Играть соберёт в новом месте; старая папка только занимает место, её можно удалить вручную."
cz = "Hrát sestaví kopii hry s módy v této složce. Doporučené místo je RUSE-Instances na disku hry: tam kopie sdílí soubory hry a je hotová za pár sekund. Na jiném disku je to úplná kopie hry, pomalejší a větší. Čistá záloha hry jde vedle, do RUSE-Backup. Po změně další Hrát sestaví na novém místě; stará složka jen zabírá místo a lze ji smazat ručně."
jpn = "「プレイ」はこのフォルダーに MOD 入りのゲームコピーをビルドします。おすすめの場所はゲームのドライブにある RUSE-Instances です。そこではコピーがゲームのファイルを共有するので、数秒で用意できます。別のドライブではゲームの完全なコピーになり、遅くて大きくなります。ゲームのクリーンなバックアップはその隣の RUSE-Backup に入ります。変更後、次の「プレイ」は新しい場所にビルドします。古いフォルダーは場所を取るだけなので、手動で削除してかまいません。"
sc = "“开始游戏”会在此文件夹中构建模组版游戏副本。推荐位置是游戏所在驱动器上的 RUSE-Instances：在那里副本与游戏共享文件，几秒钟即可就绪。放在其他驱动器上则是游戏的完整副本，更慢也更大。游戏的干净备份放在它旁边的 RUSE-Backup 中。更改后，下一次“开始游戏”会在新位置构建；旧文件夹只占空间，可以手动删除。"
fa = "«بازی» نسخهٔ مادشدهٔ بازی را در این پوشه می‌سازد. جای پیشنهادی RUSE-Instances روی درایو بازی است: آنجا نسخه فایل‌های بازی را با خود بازی شریک می‌شود و در چند ثانیه آماده است. روی درایوی دیگر، یک نسخهٔ کامل از بازی است، کندتر و بزرگ‌تر. پشتیبان تمیز بازی کنارش می‌رود، در RUSE-Backup. پس از تغییر، «بازی» بعدی در جای جدید می‌سازد؛ پوشهٔ قدیمی فقط جا می‌گیرد و می‌شود آن را دستی حذف کرد."


[agree_intro]
us = "This covers RUSE Studio, RUSE Launcher and our online services. R.U.S.E. is a game by Eugen Systems, published by Ubisoft, and you need your own copy: the apps work only with a copy of the game you own. R.U.S.E. 2.0 is a free community project, not made, approved or supported by them."
fr = "Ceci couvre RUSE Studio, RUSE Launcher et nos services en ligne. R.U.S.E. est un jeu d'Eugen Systems, édité par Ubisoft, et il vous faut votre propre exemplaire : les applications ne fonctionnent qu'avec un exemplaire du jeu que vous possédez. R.U.S.E. 2.0 est un projet communautaire gratuit, ni créé, ni approuvé, ni soutenu par eux."
ger = "Dies gilt für RUSE Studio, RUSE Launcher und unsere Online-Dienste. R.U.S.E. ist ein Spiel von Eugen Systems, veröffentlicht von Ubisoft, und du brauchst dein eigenes Exemplar: Die Apps arbeiten nur mit einer Kopie des Spiels, die dir gehört. R.U.S.E. 2.0 ist ein kostenloses Community-Projekt, von ihnen weder gemacht noch genehmigt noch unterstützt."
ita = "Questo riguarda RUSE Studio, RUSE Launcher e i nostri servizi online. R.U.S.E. è un gioco di Eugen Systems, pubblicato da Ubisoft, e ti serve la tua copia: le app funzionano solo con una copia del gioco che possiedi. R.U.S.E. 2.0 è un progetto gratuito della community, non creato, approvato o supportato da loro."
spa = "Esto cubre RUSE Studio, RUSE Launcher y nuestros servicios en línea. R.U.S.E. es un juego de Eugen Systems, publicado por Ubisoft, y necesitas tu propia copia: las aplicaciones solo funcionan con una copia del juego que posees. R.U.S.E. 2.0 es un proyecto comunitario gratuito, no creado, aprobado ni respaldado por ellos."
pol = "Dotyczy to RUSE Studio, RUSE Launchera i naszych usług online. R.U.S.E. to gra Eugen Systems wydana przez Ubisoft i potrzebujesz własnego egzemplarza: aplikacje działają tylko z kopią gry, którą posiadasz. R.U.S.E. 2.0 to darmowy projekt społeczności, niestworzony, niezatwierdzony ani niewspierany przez nich."
ru = "Это касается RUSE Studio, RUSE Launcher и наших онлайн-сервисов. R.U.S.E. — игра Eugen Systems, изданная Ubisoft, и вам нужна собственная копия: приложения работают только с копией игры, которой вы владеете. R.U.S.E. 2.0 — бесплатный проект сообщества, не созданный, не одобренный и не поддерживаемый ими."
cz = "Toto se týká RUSE Studia, RUSE Launcheru a našich online služeb. R.U.S.E. je hra od Eugen Systems vydaná Ubisoftem a potřebujete vlastní kopii: aplikace fungují jen s kopií hry, kterou vlastníte. R.U.S.E. 2.0 je bezplatný komunitní projekt, který nevytvořili, neschválili ani nepodporují."
jpn = "この契約は RUSE Studio、RUSE Launcher と私たちのオンラインサービスに適用されます。R.U.S.E. は Eugen Systems が開発し Ubisoft が販売するゲームで、あなた自身のコピーが必要です。アプリは、あなたが所有するゲームのコピーでのみ動作します。R.U.S.E. 2.0 は無料のコミュニティプロジェクトで、両社が制作・承認・支援したものではありません。"
sc = "本协议涵盖 RUSE Studio、RUSE Launcher 和我们的在线服务。R.U.S.E. 是 Eugen Systems 开发、Ubisoft 发行的游戏，你需要自己的游戏副本：这些应用只能配合你拥有的游戏副本使用。R.U.S.E. 2.0 是一个免费的社区项目，并非由他们制作、批准或支持。"
fa = "این توافق‌نامه RUSE Studio، RUSE Launcher و خدمات آنلاین ما را در بر می‌گیرد. R.U.S.E. بازی‌ای از Eugen Systems است که Ubisoft منتشر کرده و شما به نسخهٔ خودتان نیاز دارید: برنامه‌ها فقط با نسخه‌ای از بازی کار می‌کنند که مال شماست. R.U.S.E. 2.0 یک پروژهٔ رایگان اجتماع کاربران است که آن‌ها آن را نساخته‌اند، تأیید نکرده‌اند و پشتیبانی نمی‌کنند."


13. Steam i twoje konto Steam
Własne zasady Steam, które zaakceptowałeś wraz z kontem Steam, ograniczają zmienianie gier, ingerowanie w sposób ich działania i oszukiwanie w grach wieloosobowych. Valve, nie my, decyduje, jak jej zasady stosują się do R.U.S.E. Nie wiemy, czy Valve uznałoby kopię z modami lub jej zmienione pliki gry za łamiące je, i nie możemy niczego obiecać w sprawie twojego konta Steam. Granie online kopią z modami, zwłaszcza zbudowaną z narzędziem do oszukiwania lub testowym, jest twoim wyborem i odbywa się na twoje własne ryzyko. R.U.S.E. nie ma skutecznego systemu antyoszustwa, dlatego potrzebny jest RUSE Guard; sam RUSE Guard nigdy nie robi nic z twoim kontem Steam ani zainstalowaną grą.


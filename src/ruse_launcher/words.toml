[best_order_why]
us = "Where two mods change the same thing, the lower one wins. The best order puts the mods that change more first and the smaller ones after, so each keeps as much as it can."
fr = "Là où deux mods changent la même chose, celui du bas l'emporte. Le meilleur ordre met d'abord les mods qui changent le plus et les plus petits après, pour que chacun garde le plus possible."
ger = "Wo zwei Mods dasselbe ändern, gewinnt der untere. Die beste Reihenfolge setzt Mods, die mehr ändern, nach oben und kleinere darunter, damit jeder so viel wie möglich behält."
ita = "Dove due mod cambiano la stessa cosa, vince quella più in basso. L'ordine migliore mette prima le mod che cambiano di più e dopo le più piccole, così ognuna conserva il più possibile."
spa = "Donde dos mods cambian lo mismo, gana el de abajo. El mejor orden pone primero los mods que cambian más y después los más pequeños, para que cada uno conserve lo máximo posible."
pol = "Gdy dwa mody zmieniają to samo, wygrywa niższy. Najlepsza kolejność stawia najpierw mody, które zmieniają więcej, a mniejsze po nich, więc każdy zachowuje jak najwięcej."
ru = "Где два мода меняют одно и то же, побеждает нижний. Лучший порядок ставит первыми моды, которые меняют больше, а меньшие после, чтобы каждый сохранил как можно больше."
cz = "Kde dva módy mění totéž, vyhrává ten níže. Nejlepší pořadí dá napřed módy, které mění víc, a menší po nich, aby si každý ponechal co nejvíc."
jpn = "2つのMODが同じものを変更する場合、下のMODが優先されます。最適な順番では変更の多いMODを先に、小さいMODを後に置き、それぞれができるだけ多くを保てるようにします。"
sc = "当两个模组修改同一内容时，靠下的模组优先。最佳顺序会把修改多的模组放在前面、较小的放在后面，让每个模组尽量保留自己的修改。"


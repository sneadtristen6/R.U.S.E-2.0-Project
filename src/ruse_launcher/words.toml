[convert_help]
us = "Some older mods come as the game's own packs (.dat files) with the changes inside, made to be copied into the game folder. Pick the folder the mod came in: the Launcher compares each pack with your game's clean one, keeps only what the mod changes, and adds it to your library. Your game folder isn't touched. Uses LittleGroove's converter."
fr = "Certains anciens mods sont fournis sous forme d'archives du jeu (fichiers .dat) contenant leurs changements, à copier dans le dossier du jeu. Choisissez le dossier du mod : le lanceur compare chaque archive avec celle, propre, de votre jeu, ne garde que ce que le mod change et l'ajoute à votre bibliothèque. Le dossier du jeu n'est pas touché. Utilise le convertisseur de LittleGroove."
ger = "Manche älteren Mods kommen als Pakete des Spiels (.dat-Dateien) mit den Änderungen darin, gedacht zum Kopieren in den Spielordner. Wählen Sie den Ordner, in dem der Mod kam: Der Launcher vergleicht jedes Paket mit dem sauberen Ihres Spiels, behält nur, was der Mod ändert, und fügt ihn Ihrer Bibliothek hinzu. Ihr Spielordner bleibt unberührt. Nutzt den Konverter von LittleGroove."
ita = "Alcune vecchie mod arrivano come pacchetti del gioco (file .dat) con le modifiche dentro, da copiare nella cartella del gioco. Scegli la cartella della mod: il launcher confronta ogni pacchetto con quello pulito del tuo gioco, tiene solo ciò che la mod cambia e la aggiunge alla tua libreria. La cartella del gioco non viene toccata. Usa il convertitore di LittleGroove."
spa = "Algunos mods antiguos vienen como paquetes del juego (archivos .dat) con los cambios dentro, para copiarlos en la carpeta del juego. Elige la carpeta del mod: el launcher compara cada paquete con el limpio de tu juego, conserva solo lo que cambia el mod y lo añade a tu biblioteca. La carpeta del juego no se toca. Usa el conversor de LittleGroove."
pol = "Niektóre starsze mody przychodzą jako paczki gry (pliki .dat) ze zmianami w środku, do skopiowania do folderu gry. Wybierz folder moda: launcher porównuje każdą paczkę z czystą paczką twojej gry, zostawia tylko to, co mod zmienia, i dodaje go do biblioteki. Folder gry pozostaje nietknięty. Używa konwertera LittleGroove."
ru = "Некоторые старые моды поставляются как архивы самой игры (файлы .dat) с изменениями внутри — их копируют в папку игры. Выберите папку мода: лаунчер сравнит каждый архив с чистым архивом вашей игры, оставит только изменения мода и добавит его в библиотеку. Папка игры не затрагивается. Использует конвертер LittleGroove."
cz = "Některé starší mody přicházejí jako balíky hry (soubory .dat) se změnami uvnitř, určené ke zkopírování do složky hry. Vyberte složku modu: launcher porovná každý balík s čistým balíkem vaší hry, ponechá jen to, co mod mění, a přidá ho do knihovny. Složka hry zůstane nedotčená. Používá převodník od LittleGroove."
jpn = "古いMODの中には、変更入りのゲームのパック（.datファイル）として配られ、ゲームフォルダーにコピーするものがあります。MODのフォルダーを選ぶと、ランチャーが各パックをゲームのクリーンなパックと比べ、MODの変更だけを残してライブラリに追加します。ゲームフォルダーには触れません。LittleGrooveの変換ツールを使います。"
sc = "一些旧模组以游戏自身的包（.dat 文件）形式提供，内含修改，需复制到游戏文件夹。选择模组所在的文件夹：启动器会把每个包与游戏的干净包比较，只保留模组改动的内容，并把它添加到你的库。不会改动游戏文件夹。使用 LittleGroove 的转换器。"
fa = "برخی مادهای قدیمی‌تر به شکل بسته‌های خود بازی (فایل‌های .dat) می‌آیند که تغییرات درونشان است، و ساخته شده‌اند تا در پوشهٔ بازی کپی شوند. پوشه‌ای را که ماد در آن آمده انتخاب کنید: لانچر هر بسته را با بستهٔ تمیز بازی شما مقایسه می‌کند، فقط چیزی را که ماد تغییر می‌دهد نگه می‌دارد و آن را به کتابخانه‌تان اضافه می‌کند. به پوشهٔ بازی شما دست زده نمی‌شود. از مبدل LittleGroove استفاده می‌کند."


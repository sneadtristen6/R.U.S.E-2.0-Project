fa = "مجموعه را انتخاب کنید و «بازی» را بزنید. لانچر یک نسخهٔ مادشدهٔ جداگانه از بازی می‌سازد و اجرایش می‌کند؛ بازی Steam شما همان‌طور که هست می‌ماند."


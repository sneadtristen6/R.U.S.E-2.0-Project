[agree_accept_note]
us = "By choosing \"Accept and continue\", you agree to all of this, including the full terms and privacy notice. RUSE Guard comes with the apps as we publish them; Bug Watch and the R.U.S.E. 2.0 title are your choice. Nothing here limits your rights under the GNU GPL, the apps' free licence. The English text is the one that counts. If a translation is wrong about what we collect or your rights, tell us; its mistake won't be used against you."
fr = "En choisissant « Accepter et continuer », vous acceptez tout ceci, y compris les conditions complètes et la notice de confidentialité. RUSE Guard est fourni avec les applications telles que nous les publions ; Bug Watch et le titre R.U.S.E. 2.0 sont votre choix. Rien ici ne limite vos droits au titre de la GNU GPL, la licence libre des applications. Le texte anglais fait foi. Si une traduction se trompe sur ce que nous collectons ou sur vos droits, dites-le-nous ; son erreur ne sera pas utilisée contre vous."
ger = "Mit „Akzeptieren und weiter“ stimmst du all dem zu, einschließlich der vollständigen Bedingungen und der Datenschutzerklärung. RUSE Guard gehört zu den Apps, wie wir sie veröffentlichen; Bug Watch und der Titel von R.U.S.E. 2.0 sind deine Wahl. Nichts hier schränkt deine Rechte nach der GNU GPL ein, der freien Lizenz der Apps. Maßgeblich ist der englische Text. Wenn eine Übersetzung falsch sagt, was wir erfassen oder welche Rechte du hast, sag uns Bescheid; ihr Fehler wird nicht gegen dich verwendet."
ita = "Scegliendo \"Accetta e continua\", accetti tutto questo, compresi i termini completi e l'informativa sulla privacy. RUSE Guard viene con le app così come le pubblichiamo; Bug Watch e il titolo R.U.S.E. 2.0 sono una tua scelta. Niente qui limita i tuoi diritti secondo la GNU GPL, la licenza libera delle app. Fa fede il testo inglese. Se una traduzione sbaglia su ciò che raccogliamo o sui tuoi diritti, diccelo; il suo errore non sarà usato contro di te."
spa = "Al elegir «Aceptar y continuar», aceptas todo esto, incluidos los términos completos y el aviso de privacidad. RUSE Guard viene con las aplicaciones tal como las publicamos; Bug Watch y el título de R.U.S.E. 2.0 son opcionales. Nada de esto limita tus derechos bajo la GNU GPL, la licencia libre de las aplicaciones. El texto en inglés es el que cuenta. Si una traducción se equivoca sobre lo que recogemos o sobre tus derechos, avísanos; su error no se usará en tu contra."
pol = "Wybierając „Akceptuj i kontynuuj”, zgadzasz się na to wszystko, łącznie z pełnymi warunkami i informacją o prywatności. RUSE Guard jest w aplikacjach w takiej postaci, w jakiej je publikujemy; Bug Watch i tytuł R.U.S.E. 2.0 są twoim wyborem. Nic tutaj nie ogranicza twoich praw wynikających z GNU GPL, wolnej licencji aplikacji. Wiążący jest tekst angielski. Jeśli tłumaczenie błędnie opisuje, co zbieramy lub jakie masz prawa, powiedz nam; jego błąd nie zostanie użyty przeciwko tobie."
ru = "Выбирая «Принять и продолжить», вы соглашаетесь со всем этим, включая полные условия и уведомление о конфиденциальности. RUSE Guard идёт вместе с приложениями в том виде, в каком мы их публикуем; Bug Watch и название R.U.S.E. 2.0 — на ваш выбор. Ничто здесь не ограничивает ваших прав по GNU GPL, свободной лицензии приложений. Юридическую силу имеет английский текст. Если перевод неверно говорит о том, что мы собираем, или о ваших правах, сообщите нам; эта ошибка не будет использована против вас."
cz = "Volbou „Přijmout a pokračovat“ souhlasíte se vším tímto, včetně úplných podmínek a oznámení o ochraně soukromí. RUSE Guard je součástí aplikací tak, jak je zveřejňujeme; Bug Watch a název R.U.S.E. 2.0 jsou vaše volba. Nic z toho neomezuje vaše práva podle GNU GPL, volné licence aplikací. Rozhodující je anglický text. Pokud je překlad chybný v tom, co sbíráme nebo jaká máte práva, napište nám; jeho chyba se nepoužije proti vám."
jpn = "「同意して続ける」を選ぶと、利用規約とプライバシー通知の全文を含め、このすべてに同意したことになります。RUSE Guard は、私たちが公開したとおりのアプリに含まれています。Bug Watch と R.U.S.E. 2.0 のタイトルは、あなたが選べます。ここに書かれたことは、アプリの無料ライセンスである GNU GPL に基づくあなたの権利を何も制限しません。有効なのは英語の原文です。翻訳が、私たちが集める情報やあなたの権利について間違っていたら、お知らせください。翻訳の間違いが、あなたに不利に使われることはありません。"
sc = "选择“接受并继续”,即表示你同意以上全部内容,包括完整的条款与隐私声明。RUSE Guard 随我们发布的应用一起提供;Bug Watch 和 R.U.S.E. 2.0 标题由你选择。本文中的任何内容都不限制你在 GNU GPL(应用的免费许可)下的权利。以英文文本为准。如果某个译文在我们收集什么或你的权利方面有错,请告诉我们;译文的错误不会被用来对你不利。"
fa = "با انتخاب «پذیرفتن و ادامه»، با همهٔ این موارد موافقت می‌کنید، از جمله شرایط کامل و اعلامیهٔ حریم خصوصی. RUSE Guard همان‌طور که ما منتشر می‌کنیم همراه برنامه‌ها می‌آید؛ Bug Watch و عنوان R.U.S.E. 2.0 انتخاب شماست. هیچ چیز در اینجا حقوق شما را بر پایهٔ GNU GPL، مجوز رایگان برنامه‌ها، محدود نمی‌کند. متن انگلیسی ملاک است. اگر ترجمه‌ای دربارهٔ آنچه جمع می‌کنیم یا حقوق شما اشتباه باشد، به ما بگویید؛ اشتباه آن علیه شما به کار برده نمی‌شود."


fr = "La copie avec les mods est sur un autre disque que le jeu : les fichiers du jeu y sont copiés au lieu d'être partagés ({gb} Go copiés cette fois). Avec les copies avec les mods sur le disque du jeu ({drive}), le jeu avec les mods démarre bien plus vite."
ger = "Die Kopie mit Mods liegt auf einem anderen Laufwerk als das Spiel, daher werden die Spieldateien hineinkopiert statt geteilt: diesmal {gb} GB. Liegen die Kopien mit Mods auf dem Laufwerk des Spiels ({drive}), startet das Spiel mit Mods viel schneller."
ita = "La copia con le mod è su un'unità diversa da quella del gioco, quindi i file del gioco vi vengono copiati invece che condivisi: {gb} GB copiati questa volta. Con le copie con le mod sull'unità del gioco ({drive}), il gioco con le mod si avvia molto più in fretta."
spa = "La copia con mods está en una unidad distinta de la del juego, así que los archivos del juego se copian en ella en vez de compartirse: {gb} GB copiados esta vez. Con las copias con mods en la unidad del juego ({drive}), el juego con mods se inicia mucho más rápido."
pol = "Kopia z modami jest na innym dysku niż gra, więc pliki gry są do niej kopiowane, a nie współdzielone: tym razem {gb} GB. Gdy kopie z modami są na dysku gry ({drive}), gra z modami uruchamia się dużo szybciej."
ru = "Копия с модами находится не на том диске, где игра, поэтому файлы игры копируются в неё, а не используются совместно: в этот раз {gb} ГБ. Если копии с модами лежат на диске игры ({drive}), игра с модами запускается намного быстрее."
cz = "Kopie s módy je na jiném disku než hra, takže se do ní soubory hry kopírují místo sdílení: tentokrát {gb} GB. S kopiemi s módy na disku hry ({drive}) se hra s módy spouští mnohem rychleji."
jpn = "MOD入りコピーがゲームとは別のドライブにあるため、ゲームのファイルを共有できずコピーしています（今回 {gb} GB）。MOD入りコピーをゲームのドライブ（{drive}）に置くと、MOD入りのゲームがずっと速く起動します。"
sc = "模组版副本与游戏不在同一驱动器上，因此游戏文件只能复制过去，无法共享：本次复制了 {gb} GB。把模组版副本放在游戏所在的驱动器（{drive}）上，启动模组版游戏会快很多。"
fa = "نسخهٔ مادشده روی درایوی غیر از درایو بازی است، پس بسته‌های بازی در آن کپی می‌شوند، نه این‌که شریک شوند: این بار {gb} GB کپی شد. اگر نسخه‌های مادشده روی درایو بازی ({drive}) باشند، اجرای بازی با مادها خیلی سریع‌تر است."


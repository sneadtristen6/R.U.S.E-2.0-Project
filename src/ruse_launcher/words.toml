Pourquoi : pour confirmer que vous possédez R.U.S.E., pour le jeu en ligne, RUSE Guard et les téléchargements de contenu. Rien ne l'exige encore ; les applications le demandent une fois, et les Paramètres du Launcher l'ouvrent à tout moment.

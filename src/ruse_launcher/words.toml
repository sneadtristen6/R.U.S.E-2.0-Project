[bugwatch_now_off]
us = "Bug Watch is off: nothing more is counted or sent, and its counts and waiting reports on this PC are deleted. What already reached our server is deleted 7 to 8 days after it arrived, unless we marked a very severe crash's report to keep until we've fixed that crash. To have it deleted sooner, email us your username."
fr = "Bug Watch est désactivé : plus rien n'est compté ni envoyé, et ses comptages et rapports en attente sur ce PC sont supprimés. Ce qui a déjà atteint notre serveur est supprimé 7 à 8 jours après son arrivée, sauf si nous avons marqué le rapport d'un plantage très grave pour le garder jusqu'à ce que nous ayons corrigé ce plantage. Pour le faire supprimer plus tôt, envoyez-nous votre nom d'utilisateur par e-mail."
ger = "Bug Watch ist aus: Nichts wird mehr gezählt oder gesendet, und seine Zählungen und wartenden Berichte auf diesem PC werden gelöscht. Was unseren Server schon erreicht hat, wird 7 bis 8 Tage nach dem Eingang gelöscht, außer wir haben den Bericht eines sehr schweren Absturzes markiert, damit er bleibt, bis wir diesen Absturz behoben haben. Damit es früher gelöscht wird, schick uns per E-Mail deinen Benutzernamen."
ita = "Bug Watch è spento: non viene più contato né inviato nulla, e i suoi conteggi e rapporti in attesa su questo PC sono eliminati. Ciò che è già arrivato al nostro server viene eliminato 7-8 giorni dopo che è arrivato, a meno che non abbiamo segnato il rapporto di un crash molto grave per tenerlo finché non avremo corretto quel crash. Per farlo eliminare prima, inviaci per e-mail il tuo nome utente."
spa = "Bug Watch está desactivado: ya no se cuenta ni se envía nada, y sus recuentos y los informes en espera de este PC se borran. Lo que ya llegó a nuestro servidor se borra a los 7 u 8 días de llegar, salvo que marquemos el informe de un cierre muy grave para conservarlo hasta que arreglemos ese cierre. Para que se borre antes, envíanos por correo tu nombre de usuario."
pol = "Bug Watch jest wyłączony: nic więcej nie jest liczone ani wysyłane, a jego liczniki i czekające raporty na tym PC zostały usunięte. To, co już dotarło do naszego serwera, jest usuwane 7 do 8 dni po nadejściu, chyba że oznaczyliśmy raport bardzo poważnej awarii do zachowania, dopóki nie naprawimy tej awarii. Aby usunąć to wcześniej, napisz do nas e-mail ze swoją nazwą użytkownika."
ru = "Bug Watch выключен: больше ничего не считается и не отправляется, а его счётчики и ожидающие отчёты на этом ПК удалены. То, что уже дошло до нашего сервера, удаляется через 7–8 дней после поступления, если только мы не пометили отчёт об очень тяжёлом вылете, чтобы хранить его, пока мы не исправим этот вылет. Чтобы удалить это раньше, отправьте нам по e-mail ваше имя пользователя."
cz = "Bug Watch je vypnutý: nic dalšího se nepočítá ani neposílá a jeho počty a čekající hlášení na tomto PC jsou smazány. To, co už našeho serveru dosáhlo, se maže 7 až 8 dnů po příchodu, pokud hlášení o velmi závažném pádu neoznačíme k uchování, dokud ten pád neopravíme. Chcete-li, aby se to smazalo dřív, pošlete nám e-mailem své uživatelské jméno."
jpn = "Bug Watch はオフです。これ以上数えたり送ったりせず、この PC にある集計と送信待ちの報告は削除されます。すでに私たちのサーバーに届いたものは、届いてから 7～8 日後に削除されます。ただし、特に深刻なクラッシュの報告は、私たちがそのクラッシュを直すまで残すよう印を付けることがあります。もっと早く削除してほしい場合は、ユーザー名をメールでお知らせください。"
sc = "Bug Watch 已关闭:不再统计或发送任何内容,这台电脑上的统计和待发送的报告已被删除。已经到达我们服务器的内容会在它到达 7 到 8 天后删除,除非我们把某次非常严重的崩溃的报告标记为保留到我们修复那次崩溃为止。若想更快地删除,请把你的用户名发邮件给我们。"
fa = "Bug Watch خاموش است: دیگر چیزی شمرده یا فرستاده نمی‌شود، و شمارش‌ها و گزارش‌های منتظر آن روی این رایانه پاک می‌شوند. آنچه قبلاً به سرور ما رسیده 7 تا 8 روز پس از رسیدنش پاک می‌شود، مگر این‌که گزارش یک خرابی بسیار جدی را برای نگه داشتن تا وقتی آن خرابی را درست کنیم علامت زده باشیم. برای پاک شدن زودتر، نام کاربری‌تان را برایمان ایمیل کنید."

[tip_bugwatch_on]
us = "Sends crash details right away and the day's counts once a day, with your username and install ID. Off unless you tick it. Your report code shows only while it's on."
fr = "Envoie les détails des plantages tout de suite et les comptages du jour une fois par jour, avec votre nom d'utilisateur et votre identifiant d'installation. Désactivé tant que vous ne cochez pas. Votre code de rapport ne s'affiche que tant qu'il est activé."
ger = "Sendet Absturzdetails sofort und die Zählungen des Tages einmal am Tag, mit deinem Benutzernamen und deiner Installations-ID. Aus, bis du das Häkchen setzt. Dein Meldecode wird nur gezeigt, solange es an ist."
ita = "Invia subito i dettagli dei crash e i conteggi del giorno una volta al giorno, con il tuo nome utente e il tuo ID di installazione. Spento finché non lo spunti. Il tuo codice di segnalazione compare solo mentre è attivo."
spa = "Envía los detalles de un cierre inesperado al instante y los recuentos del día una vez al día, con tu nombre de usuario y tu ID de instalación. Desactivado hasta que lo marques. Tu código de informe solo se muestra mientras está activado."
pol = "Wysyła szczegóły awarii od razu, a liczniki dnia raz dziennie, z twoją nazwą użytkownika i identyfikatorem instalacji. Wyłączone, dopóki nie zaznaczysz. Twój kod zgłoszenia pokazuje się tylko wtedy, gdy jest włączony."
ru = "Сразу отправляет сведения о вылетах, а раз в день — счётчики дня, вместе с вашим именем пользователя и ID установки. Выключено, пока вы не поставите галочку. Ваш код отчёта показывается, только пока он включён."
cz = "Posílá podrobnosti o pádech hned a počty dne jednou denně, s vaším uživatelským jménem a ID instalace. Vypnuto, dokud nezaškrtnete. Váš kód hlášení se ukazuje, jen dokud je zapnutý."
jpn = "クラッシュの詳細をすぐに、その日の集計を 1 日 1 回、あなたのユーザー名とインストールIDとともに送ります。チェックを入れるまではオフです。報告コードは、オンの間だけ表示されます。"
sc = "立即发送崩溃详情,并每天一次发送当天的统计,附带你的用户名和安装 ID。在你勾选之前保持关闭。你的报告码只在它开启时显示。"
fa = "جزئیات خرابی را بی‌درنگ و شمارش‌های روز را روزی یک بار می‌فرستد، با نام کاربری و شناسهٔ نصب شما. تا تیکش را نزنید خاموش است. کد گزارش شما فقط تا وقتی روشن است نشان داده می‌شود."

[tip_bugwatch_name]
us = "The name our developers see with your RUSE Guard records and your Bug Watch reports. A # and four random numbers are added, like Nick#4821. Please don't use your real name."
fr = "Le nom que nos développeurs voient avec vos enregistrements RUSE Guard et vos rapports Bug Watch. Un # et quatre chiffres aléatoires sont ajoutés, comme Nick#4821. Merci de ne pas utiliser votre vrai nom."
ger = "Der Name, den unsere Entwickler bei deinen RUSE-Guard-Einträgen und deinen Bug-Watch-Berichten sehen. Ein # und vier zufällige Ziffern werden angehängt, etwa Nick#4821. Bitte nimm nicht deinen echten Namen."
ita = "Il nome che i nostri sviluppatori vedono con le tue registrazioni RUSE Guard e i tuoi rapporti Bug Watch. Vengono aggiunti un # e quattro numeri casuali, come Nick#4821. Non usare il tuo nome vero."
spa = "El nombre que ven nuestros desarrolladores con tus registros de RUSE Guard y tus informes de Bug Watch. Se añaden un # y cuatro números al azar, como Nick#4821. Por favor, no uses tu nombre real."
pol = "Nazwa, którą nasi programiści widzą przy twoich zapisach RUSE Guard i raportach Bug Watch. Dodawany jest # i cztery losowe cyfry, na przykład Nick#4821. Nie używaj swojego prawdziwego imienia i nazwiska."
ru = "Имя, которое наши разработчики видят рядом с вашими записями RUSE Guard и отчётами Bug Watch. К нему добавляются # и четыре случайные цифры, например Nick#4821. Пожалуйста, не используйте настоящее имя."
cz = "Jméno, které naši vývojáři vidí u vašich záznamů RUSE Guard a hlášení Bug Watch. Přidá se # a čtyři náhodná čísla, například Nick#4821. Prosíme, nepoužívejte své skutečné jméno."
jpn = "私たちの開発者があなたの RUSE Guard の記録と Bug Watch の報告とともに目にする名前です。# と 4 桁のランダムな数字が付きます（例: Nick#4821）。本名は使わないでください。"
sc = "我们的开发者会在你的 RUSE Guard 记录和 Bug Watch 报告旁看到的名字。系统会附加一个 # 和四位随机数字,例如 Nick#4821。请不要使用你的真实姓名。"
fa = "نامی که برنامه‌نویسان ما همراه رکوردهای RUSE Guard و گزارش‌های Bug Watch شما می‌بینند. یک # و چهار رقم تصادفی به آن اضافه می‌شود، مثل Nick#4821. لطفاً نام واقعی خود را به کار نبرید."

[tip_bugwatch_save]
us = "Saves this username (a new name gets new numbers). It doesn't turn Bug Watch on or off."
fr = "Enregistre ce nom d'utilisateur (un nouveau nom reçoit de nouveaux chiffres). Cela n'active ni ne désactive Bug Watch."
ger = "Speichert diesen Benutzernamen (ein neuer Name bekommt neue Ziffern). Es schaltet Bug Watch nicht an oder aus."
ita = "Salva questo nome utente (un nome nuovo riceve numeri nuovi). Non attiva né spegne Bug Watch."
spa = "Guarda este nombre de usuario (un nombre nuevo recibe números nuevos). No activa ni desactiva Bug Watch."
pol = "Zapisuje tę nazwę użytkownika (nowa nazwa dostaje nowe cyfry). Nie włącza ani nie wyłącza Bug Watch."
ru = "Сохраняет это имя пользователя (новое имя получит новые цифры). Это не включает и не выключает Bug Watch."
cz = "Uloží toto uživatelské jméno (nové jméno dostane nová čísla). Bug Watch nezapne ani nevypne."

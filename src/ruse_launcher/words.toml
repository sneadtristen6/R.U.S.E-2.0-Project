[agree_intro]
us = "These terms cover RUSE Studio, RUSE Launcher and our online services, and what they do with your data. R.U.S.E. is a game developed and published by Eugen Systems. You need your own copy. R.U.S.E. 2.0 is a free fan project run by sneadtristen6, who lives in the United States (email, for privacy requests: sneadtristen6@gmail.com). It isn't made, approved or supported by Eugen Systems. New in this version: copies the Launcher and the Studio build now show the game's own title and Eugen's logo video. The R.U.S.E. 2.0 title and intro are your choice, below."
fr = "Ces conditions couvrent RUSE Studio, RUSE Launcher et nos services en ligne, ainsi que ce qu'ils font de vos données. R.U.S.E. est un jeu développé et édité par Eugen Systems. Il vous faut votre propre exemplaire. R.U.S.E. 2.0 est un projet gratuit de fans, géré par sneadtristen6, qui vit aux États-Unis (e-mail, pour les demandes relatives à la vie privée : sneadtristen6@gmail.com). Il n'est ni créé, ni approuvé, ni soutenu par Eugen Systems. Nouveau dans cette version : les copies que le Launcher et le Studio construisent affichent désormais le titre d'origine du jeu et la vidéo du logo d'Eugen. Le titre et l'intro de R.U.S.E. 2.0 sont votre choix, ci-dessous."
ger = "Diese Bedingungen gelten für RUSE Studio, RUSE Launcher und unsere Online-Dienste und dafür, was sie mit deinen Daten tun. R.U.S.E. ist ein Spiel, das von Eugen Systems entwickelt und veröffentlicht wurde. Du brauchst dein eigenes Exemplar. R.U.S.E. 2.0 ist ein kostenloses Fan-Projekt von sneadtristen6, der in den Vereinigten Staaten lebt (E-Mail für Datenschutzanfragen: sneadtristen6@gmail.com). Es wird von Eugen Systems weder gemacht noch genehmigt noch unterstützt. Neu in dieser Version: Kopien, die der Launcher und das Studio bauen, zeigen jetzt den eigenen Titel des Spiels und das Logo-Video von Eugen. Den Titel und das Intro von R.U.S.E. 2.0 wählst du selbst, weiter unten."
ita = "Questi termini riguardano RUSE Studio, RUSE Launcher e i nostri servizi online, e ciò che fanno con i tuoi dati. R.U.S.E. è un gioco sviluppato e pubblicato da Eugen Systems. Ti serve la tua copia. R.U.S.E. 2.0 è un progetto gratuito di fan gestito da sneadtristen6, che vive negli Stati Uniti (e-mail, per le richieste sulla privacy: sneadtristen6@gmail.com). Non è creato, approvato o supportato da Eugen Systems. Novità di questa versione: le copie costruite dal Launcher e dallo Studio ora mostrano il titolo originale del gioco e il video del logo di Eugen. Il titolo e l'intro di R.U.S.E. 2.0 sono una tua scelta, più sotto."
spa = "Estos términos cubren RUSE Studio, RUSE Launcher y nuestros servicios en línea, y lo que hacen con tus datos. R.U.S.E. es un juego desarrollado y publicado por Eugen Systems. Necesitas tu propia copia. R.U.S.E. 2.0 es un proyecto de aficionados gratuito, dirigido por sneadtristen6, que vive en Estados Unidos (correo electrónico, para solicitudes de privacidad: sneadtristen6@gmail.com). No está creado, aprobado ni respaldado por Eugen Systems. Novedad de esta versión: las copias que construyen el Launcher y el Studio ahora muestran el título propio del juego y el vídeo del logo de Eugen. El título y la introducción de R.U.S.E. 2.0 son opcionales: los eliges abajo."
pol = "Te warunki dotyczą RUSE Studio, RUSE Launchera i naszych usług online oraz tego, co robią one z twoimi danymi. R.U.S.E. to gra stworzona i wydana przez Eugen Systems. Potrzebujesz własnego egzemplarza. R.U.S.E. 2.0 to darmowy projekt fanów, prowadzony przez sneadtristen6, który mieszka w Stanach Zjednoczonych (e-mail w sprawach prywatności: sneadtristen6@gmail.com). Nie jest tworzony, zatwierdzany ani wspierany przez Eugen Systems. Nowość w tej wersji: kopie budowane przez Launcher i Studio pokazują teraz oryginalny tytuł gry i film z logo Eugen Systems. Tytuł i film wprowadzający R.U.S.E. 2.0 są twoim wyborem, poniżej."
ru = "Эти условия касаются RUSE Studio, RUSE Launcher и наших онлайн-сервисов, а также того, что они делают с вашими данными. R.U.S.E. — игра, разработанная и изданная Eugen Systems. Вам нужна собственная копия. R.U.S.E. 2.0 — бесплатный проект фанатов, которым руководит sneadtristen6, живущий в Соединённых Штатах (e-mail для запросов о конфиденциальности: sneadtristen6@gmail.com). Он не создан, не одобрен и не поддерживается Eugen Systems. Новое в этой версии: копии, которые собирают Launcher и Studio, теперь показывают собственное название игры и видеозаставку с логотипом Eugen. Название и заставка R.U.S.E. 2.0 — на ваш выбор, ниже."
cz = "Tyto podmínky se týkají RUSE Studia, RUSE Launcheru a našich online služeb a toho, co dělají s vašimi údaji. R.U.S.E. je hra, kterou vyvinula a vydala společnost Eugen Systems. Potřebujete vlastní kopii. R.U.S.E. 2.0 je bezplatný fanouškovský projekt, který vede sneadtristen6, žijící ve Spojených státech (e-mail pro žádosti o ochranu soukromí: sneadtristen6@gmail.com). Nevytvořila ho, neschválila ani nepodporuje společnost Eugen Systems. Novinka v této verzi: kopie, které sestaví Launcher a Studio, nyní ukazují původní název hry a úvodní video s logem Eugen Systems. Název a intro R.U.S.E. 2.0 jsou vaše volba, níže."
jpn = "この規約は、RUSE Studio、RUSE Launcher、私たちのオンラインサービス、そしてそれらがあなたのデータをどう扱うかについて定めます。R.U.S.E. は Eugen Systems が開発し販売するゲームです。あなた自身のコピーが必要です。R.U.S.E. 2.0 は、アメリカ合衆国に住む sneadtristen6 が運営する無料のファンプロジェクトです（プライバシーに関するご請求のメールアドレス: sneadtristen6@gmail.com）。Eugen Systems が制作・承認・支援したものではありません。このバージョンでの新しい点: Launcher と Studio が作るコピーは、ゲーム本来のタイトルと Eugen Systems のロゴ動画を表示するようになりました。R.U.S.E. 2.0 のタイトルとイントロを使うかどうかは、下でお選びいただけます。"
sc = "本条款涵盖 RUSE Studio、RUSE Launcher 和我们的在线服务,以及它们如何处理你的数据。R.U.S.E. 是由 Eugen Systems 开发并发行的游戏,你需要自己的游戏副本。R.U.S.E. 2.0 是由 sneadtristen6 运营的免费同人项目,他住在美国(隐私请求邮箱:sneadtristen6@gmail.com)。它并非由 Eugen Systems 制作、批准或支持。本版新增:Launcher 和 Studio 构建的副本现在会显示游戏原本的标题和 Eugen 的标志视频。是否使用 R.U.S.E. 2.0 标题和片头,由你在下方选择。"
fa = "این شرایط RUSE Studio، RUSE Launcher و خدمات آنلاین ما را در بر می‌گیرد، و این‌که این‌ها با داده‌های شما چه می‌کنند. R.U.S.E. بازی‌ای است که Eugen Systems ساخته و منتشر کرده است. شما به نسخهٔ خودتان نیاز دارید. R.U.S.E. 2.0 یک پروژهٔ رایگان طرفداران است که sneadtristen6 اداره می‌کند و در ایالات متحده زندگی می‌کند (ایمیل، برای درخواست‌های حریم خصوصی: sneadtristen6@gmail.com). این پروژه را Eugen Systems نساخته، تأیید نکرده و پشتیبانی نمی‌کند. تازه در این نسخه: نسخه‌هایی که Launcher و Studio می‌سازند اکنون عنوان خود بازی و ویدیوی لوگوی Eugen را نشان می‌دهند. عنوان و ویدیوی آغازین R.U.S.E. 2.0 انتخاب شماست، در پایین."


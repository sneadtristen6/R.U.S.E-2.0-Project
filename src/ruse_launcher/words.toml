# --- item 25: a game crash tells the player the unit and why (rusemod.knowncrashes, rusemod.bugwatch.crash_notice;
# app.js watchCrash). crash_why_<key> for each of knowncrashes.REASONS; {why} is one of them; a reason says no more
# than its place shows (a place nothing ties to a unit: "a model", not "a unit's model"). crash_no_list: a crash of the
# game itself with no list of known crashes on the PC; crash_code: the crash code and where to send it with a
# screenshot, said alone (the owner, 2026-11-14 for players without Bug Watch; 2026-11-26 for every player: "send this
# report to me on either GitHub or Discord. I'm XUL on Discord ... Send this screenshot. And then be like, copy code.";
# rusemod.crashcode, rusemod.bugwatch.crash_code_given); crash_code_under: the same on a line under crash_unit,
# crash_mod_unit, crash_no_unit or crash_no_list, whose words already say the game crashed (the request after {code}
# word for word the same as crash_code's); the word GitHub in both is the link to the project's GitHub issues page
# (app.js crashParts); his Discord shown as XUL with his username, XUL6x3, never his Discord user ID; crash_copy and
# crash_copied: the Copy code button, and what it says a moment after it copied ---

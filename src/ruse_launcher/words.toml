- Ce qu'il ne collecte jamais : vos fichiers, votre écran, vos frappes au clavier, ni quoi que ce soit en dehors d'une partie multijoueur ou coopérative. Il ne lit jamais la mémoire de votre ordinateur. Quand le jeu écrit son propre rapport de plantage, les applications lisent ce rapport sur votre PC : RUSE Guard n'en extrait que ses propres lignes marquées (ci-dessous), et Bug Watch, si vous l'avez coché, uniquement les détails d'un plantage du jeu listés au point 6. Le rapport lui-même ne quitte jamais votre PC.
- Une copie de triche : une copie moddée construite avec un outil de triche ou de test est réservée au jeu hors ligne. Si elle est emmenée dans une partie multijoueur ou coopérative, elle se rend au bout de quelques secondes puis arrête le jeu à l'écran de fin de partie, retour au bureau. Le rapporteur de plantage du jeu lui-même peut alors envoyer son rapport à l'éditeur du jeu, et ce rapport contient la ligne de RUSE Guard disant qu'une copie de triche a été arrêtée. Le Launcher nous envoie cette ligne, débarrassée de tout identifiant Steam, long nombre ou chemin, sous votre nom d'utilisateur. Les copies honnêtes ne sont jamais arrêtées.

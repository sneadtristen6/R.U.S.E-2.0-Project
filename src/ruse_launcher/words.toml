When we change this agreement, or how we handle your data in a way that matters, we raise its version number, and the apps show it again before you go on; the start of the text says what changed. If you'd rather not accept, just close the app; you can uninstall it at any time. We won't use data we already hold in a new way without telling you first. The version and the date it took effect are at the top, and earlier versions are listed on our GitHub page.

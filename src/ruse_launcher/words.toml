fa = "تقلب یا ابزار آزمایش: {why}. نسخهٔ مادشده‌ای که آن را دارد فقط با بازیکنانی که همان مادها را دارند در نبردهای چندنفره و همکاری بازی می‌کند و از هر نبرد دیگری بیرون می‌رود."


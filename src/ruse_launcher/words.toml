Te warunki dotyczą RUSE Studio i RUSE Launchera w takiej postaci, w jakiej je publikujemy, oraz naszych usług online: listy modów, serwera RUSE Guard, serwera Bug Watch (i prywatnego repozytorium GitHub, do którego wysyła on notatki, gdy jest to włączone) oraz serwera logowania przez Steam. Ta umowa jest zawierana między tobą a sneadtristen6, który prowadzi projekt R.U.S.E. 2.0 i mieszka w Stanach Zjednoczonych. „My” i „nas” oznaczają jego i wolontariuszy, którzy mu pomagają.

2. Kim jesteśmy, a kim nie
R.U.S.E. to gra stworzona i wydana przez Eugen Systems. Potrzebujesz własnego egzemplarza. R.U.S.E. 2.0 to darmowy projekt fanów. Nie jest tworzony, zatwierdzany ani wspierany przez Eugen Systems. Nie jest nową wersją gry, a Valve go nie sponsoruje ani nie popiera. R.U.S.E. i pliki gry należą do ich właścicieli. Steam i logo Steam są znakami towarowymi Valve Corporation.

3. Twoja kopia gry i mody
- Aplikacje działają tylko z kopią R.U.S.E., którą posiadasz. Nie zawierają żadnych plików gry i nigdy ich nie wysyłają.
- Aby grać z modami, aplikacje budują na twoim PC osobną kopię gry z modami. W niektórych przypadkach dane gry mogą zostać zmienione, ale dotyczy to twojej kopii gry: tej kopii z modami. Mody zmieniają jej dane, a niektóre zmieniają jej skrypty. Nasze aplikacje dodają skrypty RUSE Guard oraz kilka własnych małych zabezpieczeń do skryptów gry w każdej kopii z modami; zabezpieczenia wkraczają tylko tam, gdzie gra inaczej zatrzymałaby się z błędem. A niektóre zestawy modów potrzebują małej łatki gry do pliku programu tej kopii, którą aplikacje pobierają z naszej strony na GitHubie.
- Aplikacje nigdy nie wkładają niczego do gry, gdy ta działa. Sprawdzają tylko, czy działa i skąd została uruchomiona, a rozwiązywanie problemów może zakończyć grę pozostawioną uruchomioną z kopii z modami, gdy naciśniesz jego naprawę.
- Gra ma własny moduł zgłaszania awarii, stworzony przez twórcę gry. Gdy gra ulegnie awarii, niezależnie od tego, czy jest to twoja zainstalowana gra, czy kopia z modami, ten moduł może wysłać własny raport o awarii twórcy gry. To należy do gry, nie do nas: nasze aplikacje nigdy nie wysyłają jego raportów i nie włączają ani nie wyłączają go.
- Nasze aplikacje nigdy nie zmieniają twojej zainstalowanej gry, chyba że poprosisz Launcher lub Studio o przywrócenie jej z czystej kopii zapasowej. Przywrócenie wkłada z powrotem własne pliki gry i odsuwa na bok pliki, które zostały dodane, oraz wersje, które zastępuje.
- Mody innych osób należą do ich twórców, na warunkach, które wybrali. Mody zmieniające skrypty gry są oznaczone, a Launcher czeka, aż zaznaczysz „Ufam autorowi tego moda” dla każdego z nich i ponownie dla każdej jego nowej wersji.

4. Twoje prawa wynikające z GPL, używane licencje i podawanie autorów
- RUSE Studio i RUSE Launcher to wolne oprogramowanie na licencji GNU General Public License, wersja 3 (GPL v3). Nic w tej umowie nie ogranicza tego, na co pozwala ci GPL: możesz uruchamiać, badać, zmieniać i udostępniać kod aplikacji na zasadach GPL, niezależnie od tego, czy zaakceptujesz tę umowę. Aplikacje w takiej postaci, w jakiej je publikujemy, proszą o jej akceptację przed użyciem; tak działają, to nie jest ograniczenie twoich praw wynikających z GPL. Ta umowa dotyczy korzystania z nich, z RUSE Guard, i z naszych usług online. Jeśli udostępniasz aplikacje lub ich zmienioną wersję, zachowaj ją na licencji GPL v3, zachowaj noty o prawach autorskich i podziękowania oraz udostępnij jej kod źródłowy. Zmieniona wersja nie jest aplikacjami w takiej postaci, w jakiej je publikujemy; ta umowa ani nasze wsparcie jej nie obejmują.
- Prace innych wewnątrz naszych aplikacji: silnik RUSE Mod Manager LittleGroove (GPL v3), prace ProLution i projekt RUSE Guard autorstwa DomesticNukes. Każdy z nich jest wymieniony na naszej stronie projektu na GitHubie.
- Biblioteki i modele 3D dołączone do aplikacji oraz zestawy ruchów, jednostki epok, tekstury i zdjęcia lotnicze, które aplikacje mogą dla ciebie pobrać, są wymienione wraz z ich twórcami i licencjami w THIRD_PARTY_NOTICES, pliku dołączonym do aplikacji; Ustawienia go pokazują, w sekcji Warunki, autorzy i licencje. Dźwięk silnika z filmu wprowadzającego też jest tam wymieniony. Jednostki epok w modzie są też wymienione w pliku z autorami tego moda. Prace na licencji CC BY (licencji Creative Commons) wolno wykorzystywać ponownie tylko z podaniem ich twórców: jeśli wykorzystasz taką pracę we własnym modzie, wymień jej twórcę w ten sam sposób i zachowaj link do jej licencji. Prace na licencji CC0 nie wymagają podania autora, ale my i tak je wymieniamy i prosimy, abyś ty też to robił.

5. Tylko posiadane kopie
Projekt wspiera R.U.S.E. tylko wtedy, gdy go posiadasz. Gdy aplikacje się uruchamiają i przed uruchomieniem gry z modami, sprawdzają folder gry pod kątem kopii zainstalowanej przez Steam: zapisu instalacji w Steam, własnego podpisanego pliku Steam i braku plików, które pozwalają uruchomić grę bez Steam. To nasze własne sprawdzenie, nie Steam ani Eugen Systems, i nie dowodzi, kto posiada grę. Na jego potrzeby nic nie jest wysyłane.
Jeśli twojej kopii nie da się potwierdzić (pudełkowa kopia sprzed czasu, gdy R.U.S.E. było na Steam, albo błędny wynik sprawdzenia), okno pokazuje kod folderu. Powstaje on na twoim PC z identyfikatora twojej instalacji Windows (lub Linux) albo, gdy go brak, z identyfikatora twojej karty sieciowej, oraz z głównego pliku gry. Jest jednokierunkowy: nie da się go z powrotem zamienić na te identyfikatory. Opuszcza twój PC tylko wtedy, gdy wkleisz go gdzieś albo naciśniesz „Otwórz zgłoszenie na GitHubie”, co otwiera w przeglądarce stronę zgłoszeń GitHuba z kodem już wstawionym w adres strony. Nic nie jest publikowane, dopóki sam tego nie opublikujesz, a zgłoszenia na GitHubie są publiczne. Zamiast tego możesz wysłać kod do sneadtristen6 w prywatnej wiadomości na Discordzie. Odsyłamy kod odblokowania, który działa tylko na tym PC i z tą wersją głównego pliku gry. Używamy twojego kodu folderu wyłącznie do odblokowania twojej kopii, bo o to prosiłeś, i nie przechowujemy żadnego zapisu kodów folderów poza twoim zgłoszeniem lub wiadomością.

6. RUSE Guard: nasz system antyoszustwa (wymagany)
Po co: aby powstrzymać oszukiwanie w meczach wieloosobowych i kooperacyjnych R.U.S.E. rozgrywanych na kopiach budowanych przez nasze aplikacje. Mody mogą zmieniać sposób gry. Dlatego każda kopia, której mody zmieniają rozgrywkę, dostaje kod dołączenia, który porównujesz z osobami, z którymi grasz. Kopia zbudowana z narzędziem do oszukiwania lub testowym sprawdza, czy każdy gracz w meczu ma tę samą kompilację, a jeśli nie, poddaje mecz. W meczach wieloosobowych i kooperacyjnych RUSE Guard szuka też znanych narzędzi do oszukiwania działających na twoim PC. A strażnik każdej kopii pokazuje na ekranie, gdy mecz widzi polecenie stworzenia jednostki (spawn) lub nagły skok pieniędzy jednej ze stron.
Dlaczego jest wymagany: RUSE Guard jest wymagany do korzystania z naszych aplikacji. R.U.S.E. nie ma skutecznego systemu antyoszustwa, dlatego potrzebny jest RUSE Guard: pomaga trzymać oszustów z dala od meczów wieloosobowych, a uczciwe mecze są ważne dla nas i dla każdego gracza, którego spotkasz. Opieramy się na tym, co prawo ochrony danych nazywa „prawnie uzasadnionym interesem”: uczciwych meczach dla każdego gracza, co nie wymaga twojej zgody, dopóki twoja prywatność nie przeważa nad nim (sekcja 11). Dlatego nie jest to pole wyboru jak Bug Watch: Studio i Launcher w takiej postaci, w jakiej je publikujemy, zawsze go zawierają. Nadal możesz w każdej chwili wnieść sprzeciw (sekcja 11).
- Gdzie działa: RUSE Guard jest w każdej kopii z modami, którą budują aplikacje, a Oryginał w Launcherze też buduje taką kopię, bez modów (sekcja 10). Jego blokada i kontrola programów działają tylko w meczach wieloosobowych i kooperacyjnych, i tak samo działałyby jego zapisy meczów, gdy zaczną działać (poniżej). Jego strażnik, też w każdej kopii z modami, obserwuje mecze wieloosobowe, kooperacyjne i potyczki z komputerem: może pokazać powiadomienie na twoim własnym ekranie, gdy pieniądze jednej strony nagle rosną o 400 lub więcej, albo gdy jednostka została stworzona poleceniem spawn. W meczu wieloosobowym może je zobaczyć ekran każdego gracza. Strażnik niczego nie zmienia w meczu i niczego nie wysyła. Dla RUSE Guard cokolwiek wysyła tylko Launcher; Studio nigdy tego nie robi, a jego Testuj w grze nie uruchamia kontroli programów.
- Lista: lista znanych narzędzi do oszukiwania RUSE Guard jest wewnątrz aplikacji, jako zwykły plik, który możesz przeczytać, i zmienia się tylko wraz z aktualizacją aplikacji. Nic nie jest dla niej pobierane.
- Kontrola programów: w meczu wieloosobowym lub kooperacyjnym uruchomionym z Launchera RUSE Guard co 30 sekund sprawdza nazwy programów działających na twoim PC i zachowuje tylko nazwy, które są na jego liście. Aby wiedzieć, kiedy taki mecz trwa, Launcher czyta komunikaty o błędach gry, gdy ta działa: zachowuje tylko krótkie linie RUSE Guard, które mówią, że mecz trwa lub się skończył, a każdą inną linię odrzuca zaraz po przeczytaniu, nigdy jej nie zachowując ani nie wysyłając (te komunikaty mogą też zawierać własne linie Steam, a jedna z nich numer twojego konta Steam). Jeśli gra nie powie, że mecz się skończył, kontrola zatrzymuje się dwie minuty po tym, jak gra ostatnio powiedziała, że mecz trwa. Jeśli podczas meczu działał program z listy, Launcher po grze wysyła naszemu serwerowi krótki zapis: twoją nazwę użytkownika i klucz RUSE Guard, kiedy mecz się zaczął i skończył, czy był wieloosobowy, czy kooperacyjny, oraz nazwy znalezionych programów z listy. Nic więcej tam nie trafia: ani powtórka, ani pliki, ani nic więcej o meczu. Jeśli nie działał żaden program z listy, nic nie jest wysyłane.
- Kod dołączenia: dla kopii z modami, których mody zmieniają sposób gry, Launcher pokazuje kod dołączenia. Oznacza on wersję gry tej kopii, jej mody z ich wersjami i to, co zmieniają w sposobie gry. Porównujesz kody dołączenia z osobami, z którymi grasz. Dziś ich nie otrzymujemy; zapis meczu (poniżej) by je zawierał.
- Kopie zbudowane z narzędziem do oszukiwania lub testowym: taka kopia gra w meczach wieloosobowych i kooperacyjnych tylko z graczami, których kompilacja jest taka sama (ta sama wersja gry i te same mody, w tych samych wersjach). Około sekundy po rozpoczęciu każdego takiego meczu przekazuje grze każdego gracza krótki kod swojej kompilacji (jej kod kompilacji), utworzony z wersji gry, modów z ich wersjami w ich kolejności i tego, co zmieniają w sposobie gry. Nie zawiera żadnej nazwy ani konta. Jeśli każdy gracz ma tę samą kompilację, mecz jest tak zbudowany, by trwał dalej; nikt nie rozegrał jeszcze takiego meczu we dwie osoby. Jeśli nie, kopia poddaje mecz po kilku sekundach.
  W meczu wieloosobowym, który nie jest rankingowy, celowo zatrzymuje potem grę na ekranie końca tego meczu: gra ulega awarii i wraca na pulpit. Własny moduł zgłaszania awarii gry może wtedy wysłać raport twórcy gry, a ten raport zawiera linię RUSE Guard mówiącą, że kopia z narzędziami do oszukiwania została zatrzymana. W meczach kooperacyjnych i rankingowych tylko poddaje mecz. Gdy Launcher uruchomił grę i jest jeszcze otwarty, kiedy gra się zatrzymuje, bierze z raportu o awarii gry na twoim PC tylko linię RUSE Guard i wysyła naszemu serwerowi krótką notatkę, że kopia z narzędziami do oszukiwania została zatrzymana, pod twoją nazwą użytkownika i kluczem RUSE Guard, z czasem zapisania raportu o awarii i czasem utworzenia notatki. Linia mówi tylko, jaki to był rodzaj meczu, i podaje numer twojej strony w nim; każdy identyfikator Steam, długa liczba czy ścieżka jest z niej usuwana. Nasze aplikacje nigdy nie wysyłają samego raportu o awarii. Notatka nie otwiera przeglądu i o niczym nie rozstrzyga; jest zapisana, aby sneadtristen6 mógł ją zobaczyć. Notatka nie jest wysyłana, jeśli Launcher zamknięto, zanim gra się zatrzymała, albo jeśli grę uruchomiono ze Studia lub ręcznie. Na Linuksie i Steam Deck nie wiadomo jeszcze, czy notatka jest wysyłana.
  Uczciwe kopie nigdy nie są zatrzymywane.
- Twój klucz RUSE Guard: gdy Launcher po raz pierwszy tworzy zapis RUSE Guard na twoim PC, tworzy tam losowy klucz. Kod utworzony z tego klucza (jego część publiczna) idzie z każdym zapisem, abyśmy mogli odróżnić twoje zapisy od zapisów kogoś z taką samą nazwą użytkownika i sprawdzić, że nie zostały zmienione. Nie mówi nic więcej o tobie. Ustawienia pokazują krótki kod z niego utworzony, „Twój kod RUSE Guard”: wyślij go z wnioskiem dotyczącym prywatności, a znajdziemy twoje własne zapisy RUSE Guard. Nic więcej nie jest dla niego wysyłane.
- Jeszcze nieaktywne: zapisy meczów. Potrzebują zapisu meczu, którego gra dziś nie potrafi stworzyć. Zanim zaczną działać, zaktualizujemy ten tekst, a aplikacje pokażą go ci ponownie. Gdy zaczną działać, zapis meczu będzie zawierał: twoją nazwę użytkownika i klucz RUSE Guard; twoją stronę; kody twojej kopii; sprawdzenia plików gry, które twoja kopia zmieniła, i regularne sprawdzenia, że gra każdego gracza pozostaje taka sama; twoje mody z ich sprawdzeniami; które polecenia skryptów twoje mody wiążą z klawiszami (nigdy co naciskasz); dla kopii testowej programisty, klucz programisty; nazwy znalezionych działających narzędzi do oszukiwania z listy; kiedy mecz się zaczął i skończył; oraz najnowszą powtórkę zapisaną na twoim PC podczas meczu lub tuż po nim, z jej nazwą pliku. Powtórka zawiera każdy rozkaz, który każdy gracz wydał w meczu, a jej nazwa pliku i zawartość mogą zawierać twoje i innych graczy nazwy w grze.
- Czego nigdy nie robi: nigdy nie zbiera twojego ekranu ani naciśnięć klawiszy, nigdy nie zagląda do wnętrza innych programów, gdy działają, i nigdy nie wysyła nam twoich plików, poza powtórką, którą niósłby zapis meczu. Z raportów o awariach gry czyta tylko własną linię o zatrzymanej przez siebie kopii z narzędziami do oszukiwania (powyżej), na twoim PC.
- Kopie testowe programistów: aplikacje są zbudowane tak, by wpuścić kopię testową programisty do meczu ze specjalnym kluczem od nas, jedyną drogą obok reguły kopii z narzędziami do oszukiwania. Żaden jeszcze nie działa: aplikacje nie potrafią dziś sprawdzić takiego klucza.
- Decyzje o tobie: żadnych automatycznych banów. Żadnej decyzji o oszukiwaniu nie podejmuje wyłącznie maszyna: sneadtristen6 patrzy na dowody i, gdy jest, na powtórkę, i decyduje. Claude firmy Anthropic, asystent SI, pomaga mu czytać zapisy RUSE Guard, na własnych warunkach Anthropic; decyzje są jego. Zapis, który wymienia narzędzie do oszukiwania z listy, otwiera dla niego przegląd, który o niczym nie rozstrzyga, dopóki on nie zdecyduje. Możesz się odwołać w ciągu 30 dni od decyzji (sekcja 17); sneadtristen6 jest jedyną osobą, która rozpatruje sprawy, więc sam też rozstrzyga odwołania. Jedyną automatyczną regułą jest powyższa reguła kopii z narzędziami do oszukiwania. Wynika ona z kopii, którą sam zdecydowałeś się zbudować, i nigdy nie dotyka twojego konta Steam ani zainstalowanej gry.
- Co oznacza decyzja dzisiaj: jeśli oszukiwanie zostanie potwierdzone, przechowujemy tę decyzję pod twoją nazwą użytkownika na naszej liście oznaczonych graczy i używamy jej, gdy patrzymy na późniejsze mecze. Ponieważ dwóch graczy może mieć tę samą nazwę użytkownika, patrzymy też na to, z jakim kluczem RUSE Guard przyszły zapisy. Nasz serwer RUSE Guard przechowuje tę listę, każdą oznaczoną nazwę użytkownika z kluczem RUSE Guard, z którym przyszły jej pierwsze zapisy, i mówi tylko Launcherowi tego gracza, że jest oznaczony. Aplikacje nie reagują jeszcze na oznaczenie. Jeśli późniejsza wersja zacznie to robić, na przykład by trzymać kopie z modami oznaczonego gracza z dala od meczów wieloosobowych przez R.U.S.E. 2.0, ten tekst powie o tym najpierw. Jeśli odwołanie zostanie uwzględnione, decyzja zostaje oznaczona jako uchylona, a nazwa użytkownika schodzi z listy.
- Jak długo zapisy są przechowywane i twoje prawa: sekcja 11.

7. Bug Watch: pomóż nam znajdować i naprawiać błędy (opcjonalnie, zalecane)
Po co: aby Studio i Launcher działały lepiej i aby szybciej naprawiać awarie: zamiast czekać, aż ktoś zgłosi awarię, widzimy ją i to, co do niej doprowadziło.
Na jakiej podstawie: tylko za twoją zgodą (sekcja 11). Jest wyłączony, dopóki go nie zaznaczysz. Zapisanie lub zmiana nazwy użytkownika nigdy go nie włącza ani nie wyłącza. Zaznaczenie go nie zmienia nic innego w aplikacjach, poza tym, co Launcher mówi ci po awarii gry (poniżej). Gdy aplikacje pokazują te warunki ponownie po zmianie: jeśli Bug Watch jest włączony, jego pole pyta „Zostawić Bug Watch włączony?”, zaznaczone; zostaw zaznaczenie, aby go zachować, albo odznacz, aby go wyłączyć. Jeśli jest wyłączony, pole Bug Watch pojawia się ponownie, niezaznaczone.
Gdy jest włączony, Studio i Launcher wysyłają naszemu serwerowi:
- raz dziennie, liczniki dla każdego zakończonego dnia:
  - aplikację i jej wersję; dzień; czy używasz Windows 10, czy 11; język aplikacji; wersję gry; czy RUSE Guard jest wbudowany; którą wersję tych warunków zaakceptowałeś;
  - jak często używano każdej części aplikacji i jak długo trwały różne rzeczy; co poszło nie tak i gdzie (tylko w naszym własnym kodzie; gdy zawiedzie skrypt ekranu Studia, nazwa ekranu i rodzaj błędu, nigdy jego treść, plik ani wiersz); dla każdego długiego zadania, jak budowanie moda, ile razy się skończyło lub nie powiodło oraz ile budowań znalazło błędy w modach;
  - lista porażek z tego dnia, najwyżej 20, każda z jej kodem (które miejsce w naszym kodzie), jak daleko dotarło Graj lub Testuj w grze, kształt zestawu modów (ile modów z naszej listy, folderów modów i plików modów własnych, jako liczby), a obok tylko liczby, które nikogo nie wskazują: numer błędu Windows (np. dysk pełny), odpowiedź serwera WWW (np. 404), numer wyjścia gry, liczba i drugi kod;
  - ile aktualizacji zaoferowano, zainstalowano lub nie powiodło się; ile razy aplikacja uległa awarii; które sprawdzenia rozwiązywania problemów znalazły problem;
  - które mody z naszej listy miałeś włączone; ile minut łącznie grałeś i ile z każdym z tych modów;
  - ile miałeś własnych modów i co zawierają, na przykład jednostki, mapy, misje lub skrypty (liczone według rodzaju, nigdy z nazwami i nigdy ich słowa, ścieżki ani pliki);
- od razu, gdy aplikacja ulegnie awarii: rodzaj błędu i miejsce w naszym kodzie;
- od razu, gdy uruchomiona przez aplikację gra uległa awarii, techniczne szczegóły tego, gdzie i jak uległa awarii:
  - kod błędu gry; nazwę pliku, w którym się zatrzymała (może to być część Windows, sterownika lub innego programu załadowanego do gry, na przykład nakładki), miejsce w nim, w którym gra się zatrzymała, i do 16 miejsc w grze, które do tego doprowadziły;
  - przy błędzie pamięci, co gra próbowała zrobić (odczytać, zapisać lub uruchomić) i miejsce w pamięci;
  - przy błędzie skryptu, własny tekst błędu gry, ze ścieżkami na dysku skróconymi do nazw plików, nazwą twojego folderu użytkownika ukrytą (nazwy folderów w nim mogą zostać) oraz numerami kont Steam i innymi długimi numerami usuniętymi (własne nazwy skryptów gry zostają); ile wcześniejszych błędów gra pominęła; oraz mapę (jedną z własnych map gry pod jej nazwą, mapę moda tylko jako „mapa moda”);
  - jednostkę, którą gra tworzyła, gdy aplikacje mogą ją odczytać z raportu o awarii gry (jedną z własnych jednostek gry według jej numeru, jednostkę moda tylko jako „jednostka moda”);
  - które mody były włączone, co zawierają twoje własne mody (liczone według rodzaju) i którą wersję tych warunków zaakceptowałeś.
Bug Watch używa tylko własnych raportów o awariach gry. Z raportu innego programu czyta tylko nazwy plików, które wymienia, aby stwierdzić, że nie jest to raport gry; nic z niego nie jest wysyłane.
Każde wysłanie niesie twoją nazwę użytkownika i identyfikator instalacji, losowy kod utworzony na twoim PC, gdy po raz pierwszy wybrałeś nazwę użytkownika, niezależnie od tego, czy zaznaczysz Bug Watch. Twój kod zgłoszenia, który Ustawienia pokazują, gdy Bug Watch jest włączony, to pierwsze 8 znaków twojego identyfikatora instalacji.
Nasze aplikacje nigdy nie wysyłają twoich plików ani samych plików raportów o awarii gry, a Bug Watch nie wysyła numeru konta Steam. (Własny moduł zgłaszania awarii gry może wysłać własny raport twórcy gry: sekcja 3.) Tekst błędu gry może zawierać nazwy z gry lub ze skryptów moda. Nie używaj swojego prawdziwego imienia i nazwiska jako nazwy użytkownika (sekcja 9).
Znane awarie: gdy Bug Watch jest włączony, jeśli gra ulegnie awarii w jeden ze znanych nam sposobów, Launcher mówi ci, którą jednostkę gra tworzyła i dlaczego, w twoim języku. To wyjaśnienie jest tylko pokazywane tobie, nigdy wysyłane; raport Bug Watch niesie jednostkę tylko tak, jak wymieniono powyżej (numer lub „jednostka moda”). Aby znać te awarie, aplikacje pobierają naszą listę z naszego serwera Bug Watch, gdy uruchamia się gra, chyba że lista na twoim PC ma mniej niż dzień, i jeszcze raz przy awarii, jeśli nie ma użytecznej listy. Pobierają ją tylko wtedy, gdy Bug Watch jest włączony, zachowują ją na twoim PC, używają jej tylko wtedy, gdy ma nasz podpis, i sprawdzają twój raport o awarii z nią na twoim PC. Pobranie nie niesie nic o tobie. Bez listy (na przykład za pierwszym razem albo bez internetu) Launcher nadal mówi ci, że gra uległa awarii, ale nie podaje jednostki ani powodu. Odznaczenie Bug Watch usuwa listę z twojego PC.
Gdy Bug Watch jest włączony lub wyłączony: jeśli gra uruchomiona przez Launcher ulegnie awarii, Launcher pokazuje ci krótki kod awarii, utworzony na twoim PC z miejsca, w którym gra się zatrzymała. Nie jest nigdzie wysyłany. Przycisk „Kopiuj kod” go kopiuje. Jeśli chcesz pomocy, wyślij kod i zrzut ekranu komunikatu użytkownikowi XUL na Discordzie (XUL6x3) lub na GitHubie, a sprawdzimy go na naszej własnej liście. Kod mówi tylko, gdzie gra się zatrzymała. Ustawienia pokazują ci dzisiejsze liczniki słowo w słowo, tak jak zostałyby wysłane, oraz nazwy czekających raportów.
Raporty, których nie da się wysłać, czekają na twoim PC do 30 dni, po czym są porzucane. Gdy działa gra uruchomiona przez aplikację, Bug Watch zapisuje też na twoim PC krótką notatkę o niej, aby przy następnym uruchomieniu aplikacja mogła rozpoznać, czy gra uległa awarii: kiedy się uruchomiła i kiedy ostatnio widziano ją działającą, jej mody (nasze po nazwie i wersji, inne tylko jako liczba) oraz gdzie zainstalowano kopię i grę (folder Windows może zawierać twoją nazwę użytkownika Windows). Nigdy nie jest wysyłana i jest usuwana po 30 dniach albo od razu, gdy odznaczysz Bug Watch.
Kto to widzi: nasi programiści. Jest przechowywane dla nas przez Cloudflare na naszym serwerze Bug Watch. Gdy jest to włączone, nasz serwer wysyła też notatki o śledzonych problemach do prywatnego repozytorium GitHub, miejsca na GitHubie, które mogą otworzyć tylko nasi programiści. Notatki nigdy nie zawierają nazwy użytkownika ani kodu zgłoszenia. Nasi programiści używają też Claude firmy Anthropic, asystenta SI, do czytania niektórych raportów o awariach Bug Watch, na własnych warunkach Anthropic.
Jak długo: każdy raport jest usuwany z naszego serwera podczas codziennego czyszczenia po tym, jak spędził tam 7 dni, czyli 7 do 8 dni po jego nadejściu. Nasi programiści mogą oznaczyć raport bardzo poważnej awarii, aby go zachować, gdy naprawiają tę awarię; oznaczony raport zostaje, dopóki nie zdejmą oznaczenia, w dniu naprawienia tej awarii, a potem znika podczas następnego codziennego czyszczenia. Co zostaje potem, bez nazwy użytkownika, identyfikatora instalacji ani kodu zgłoszenia: dzienne sumy dla każdej wersji aplikacji (jak „12 budowań modów nie powiodło się w wersji 0.9.9 tego dnia”) oraz dzień, w którym po raz pierwszy zobaczono każdą wersję i każdy rodzaj błędu, bez limitu czasu; a także notatki naszego serwera o znalezionych problemach (która część aplikacji, który mod z naszej listy, gdzie nastąpiła awaria i jak często), do 3 dni po zamknięciu przez nas tego problemu. Przez pierwsze 7 dni, w dniu, w którym wersji używała tylko jedna osoba, jej sumy to liczniki tej jednej osoby; potem wersja lub mod z naszej listy, których tego dnia używało mniej niż 3 instalacji, jest zachowywana tylko jako „(other)”. Notatki na GitHubie zostają, dopóki ich nie usuniemy. Cloudflare przechowuje historię naszych baz danych przez 7 dni, więc to, co usuniemy, zostaje w tej historii jeszcze do 7 dni. Kopie na komputerze sneadtristen6: sekcja 11, „Gdzie to jest przechowywane”.
Odznacz go w dowolnej chwili w Ustawieniach (lub w polu Bug Watch, gdy aplikacje pokazują te warunki). Od tej chwili nic nie jest liczone ani wysyłane, a aplikacje usuwają liczniki Bug Watch i raporty czekające na wysłanie. Twoja nazwa użytkownika i identyfikator instalacji zostają na twoim PC, ponieważ RUSE Guard używa twojej nazwy użytkownika. Nic, co powstało przed odznaczeniem, nie zostanie wysłane później, nawet jeśli zaznaczysz go ponownie. Odznaczenie nie informuje naszego serwera: to, co już do niego dotarło, jest usuwane jak wyżej. Aby usunąć to wcześniej, wyślij nam e-mailem swój kod zgłoszenia (Ustawienia pokazują go tylko wtedy, gdy Bug Watch jest włączony, więc zanotuj go przed odznaczeniem) albo nazwę użytkownika, jeśli nie masz kodu: znajdziemy po niej raporty twojej instalacji i je usuniemy. Sumy i notatki powyżej zostają. Odznaczenie nie cofa tego, co wysłano wcześniej.

8. Logowanie przez Steam (opcjonalnie)
Po co: aby potwierdzić, że posiadasz R.U.S.E., na potrzeby gry online, RUSE Guard i pobierania zawartości w przyszłości. Na razie nic go nie wymaga.
Na jakiej podstawie: ty o to prosisz (sekcja 11). Aplikacje mogą je zaproponować przy uruchomieniu, a Ustawienia Launchera otwierają je w każdej chwili.
- Logujesz się na własnej stronie Steam w swojej przeglądarce, pod adresem, który aplikacja tworzy sama. Nigdy nie widzimy twojego hasła.
- Steam podaje wtedy naszemu serwerowi twój identyfikator Steam. Nasz serwer pyta Steam, czy to konto posiada R.U.S.E. (działa to tylko wtedy, gdy szczegóły twoich gier w Steam są publiczne), używa odpowiedzi i nie zapisuje identyfikatora. Jeśli posiadasz grę, nasz serwer daje twojemu PC przepustkę (kod pokazujący, że sprawdzenie się powiodło), ważną 30 dni.
- Co przechowuje nasz serwer: jednokierunkowy kod utworzony z twojego identyfikatora Steam z naszym sekretem oraz kiedy twoja przepustka została wydana i kiedy wygasa, do 30 dni po wygaśnięciu przepustki. Krótkotrwały kod, którego aplikacja używa do odebrania przepustki (kod logowania), jest przechowywany tylko w zakodowanej postaci; wygasa po 10 minutach i jest usuwany, gdy aplikacja go odbierze, albo w ciągu około godziny po jego wygaśnięciu. Jednorazowe numery logowania Steam uniemożliwiają ponowne odtworzenie logowania; są przechowywane przez dzień, nawet gdy logowanie się nie powiedzie, a potem usuwane w ciągu około godziny. Nasz kod nigdy nie zapisuje twojego adresu IP.
- Gdzie: bazy danych naszych serwerów są przechowywane przez Cloudflare we wschodniej Ameryce Północnej.
- Co przechowuje twój PC: przepustkę, w ustawieniach aplikacji, dopóki się nie wylogujesz w Ustawieniach, co ją usuwa. Przepustka, która wygasła, też zostaje do tego czasu.
- Jeśli szczegóły twoich gier w Steam są prywatne, Steam nie może nam ich przekazać. Ustaw Szczegóły gry na Publiczne na minutę, a potem spróbuj ponownie.
- R.U.S.E. 2.0 nie jest powiązany z Valve ani przez nią popierany. Valve obsługuje twoje logowanie zgodnie z własną polityką prywatności.

9. Twoja nazwa użytkownika
Po co: abyśmy wiedzieli, czyj to raport o awarii lub zapis meczu, i mogli tej osobie pomóc. Każdy wybiera ją przy pierwszym uruchomieniu, ponieważ RUSE Guard jest wymagany. Dodawany jest # i cztery losowe cyfry, na przykład Nick#4821. Dwóch graczy nadal może mieć taką samą, więc kierujemy się też twoim kluczem RUSE Guard lub kodem zgłoszenia. Nie używaj swojego prawdziwego imienia i nazwiska, nazwy ze Steam ani niczego innego, co cię identyfikuje. Jest wysyłana tylko z twoimi zapisami RUSE Guard i, jeśli Bug Watch jest włączony, z twoimi raportami Bug Watch. Jedna nazwa użytkownika działa w obu aplikacjach. Możesz ją zmienić w Ustawieniach; zmiana nigdy nie włącza ani nie wyłącza Bug Watch. Wysłane już zapisy zachowują starą nazwę, dopóki nie zostaną usunięte. Aby usunąć twoją nazwę użytkownika i dane pod nią, napisz do nas e-mail.

10. Tytuł i film wprowadzający R.U.S.E. 2.0 (opcjonalnie)
Kopie budowane przez Launcher i Studio pokazują oryginalny tytuł gry i film z logo Eugen Systems. Jeśli zaznaczysz pole na pierwszym ekranie albo „Używaj złotego tytułu i filmu wprowadzającego R.U.S.E. 2.0” w sekcji Tytuł gry w Ustawieniach, te kopie pokazują R.U.S.E. 2.0 na złoto w menu głównym i na ekranach wczytywania, a nasz film wprowadzający odtwarza się zamiast filmu z logo Eugen Systems przy starcie gry. Złoty tytuł powstaje na twoim PC z plików twojej własnej gry, na obrazie sceny bitwy dołączonym do aplikacji. Film wprowadzający używa też dźwięku silnika dołączonego do aplikacji. Zmienia tylko twoją kopię z modami, nigdy twojej zainstalowanej gry, i możesz to zmienić w każdej chwili w Ustawieniach. W Launcherze Oryginał buduje osobną kopię bez modów, z RUSE Guard w środku jak każda kopia, i z tytułem, który wybrałeś.

11. Informacja o prywatności
Ta informacja jest częścią tej umowy. Ten sam tekst jest publiczny na naszej stronie GitHub, pod adresem https://github.com/sneadtristen6/R.U.S.E-2.0-Project/blob/main/PRIVACY.md, aby każdy mógł go przeczytać, także gracze, którzy nie używają naszych aplikacji. Weszła w życie 26 listopada 2026.

Kto odpowiada za twoje dane
R.U.S.E. 2.0 prowadzi jedna osoba, sneadtristen6, który mieszka w Stanach Zjednoczonych. Decyduje on, co aplikacje i nasze serwery robią z twoimi danymi, więc zgodnie z prawem ochrony danych (w UE i Wielkiej Brytanii, RODO) to on za nie odpowiada: jest „administratorem”. E-mail w sprawach prywatności: sneadtristen6@gmail.com. Możesz też skontaktować się z nim na naszym Discordzie lub GitHubie; w sprawach osobistych użyj e-maila albo prywatnej wiadomości, ponieważ zgłoszenia na GitHubie i kanały Discorda mogą być czytane przez innych. Tylko on przegląda zapisy RUSE Guard i o nich decyduje. Nie mamy przedstawiciela w UE ani Wielkiej Brytanii.

Czego używamy, dlaczego i na jakiej podstawie
- RUSE Guard (sekcja 6): aby mecze wieloosobowe i kooperacyjne były uczciwe. Podstawa: nasz prawnie uzasadniony interes, i innych graczy, w uczciwych meczach (RODO, art. 6 ust. 1 lit. f), nie twoja zgoda.
- Bug Watch (sekcja 7), tylko jeśli go zaznaczysz: aby znajdować i naprawiać awarie i błędy. Podstawa: twoja zgoda (art. 6 ust. 1 lit. a).
- Logowanie przez Steam (sekcja 8), tylko jeśli go używasz: aby potwierdzić, że posiadasz R.U.S.E. Podstawa: ty o to prosisz (art. 6 ust. 1 lit. b).
- Kody folderów i zgłoszenia odblokowania (sekcja 5): aby odblokować twoją kopię. Podstawa: ty o to prosisz (art. 6 ust. 1 lit. b).
- Twoja nazwa użytkownika (sekcja 9): aby wiedzieć, czyj to zapis lub raport. Podstawa: taka sama jak zapisu RUSE Guard lub raportu Bug Watch, z którym jest wysyłana.
- Sprawdzanie i pobieranie aktualizacji (sekcja 12): aby aplikacje działały i były bezpieczne oraz aby dać ci to, o co prosisz. Podstawa: nasz prawnie uzasadniony interes (art. 6 ust. 1 lit. f) i twoja prośba, gdy naciskasz przycisk.
- Wiadomości, zgłoszenia, e-maile i odwołania, które do nas wysyłasz: aby ci odpowiedzieć. Podstawa: nasz prawnie uzasadniony interes w odpowiadaniu ci (art. 6 ust. 1 lit. f).
- Wspierający na Patreonie: Patreon obsługuje twoją płatność zgodnie z własną polityką prywatności. Widzimy tylko to, co Patreon udostępnia twórcom zgodnie z tą polityką, i publikujemy nazwę do podziękowań tylko wtedy, gdy wyślesz ją z twoją zgodą. Podstawa: aby dać ci wybrane podziękowanie (art. 6 ust. 1 lit. b); nazwa publiczna tylko za twoją zgodą (art. 6 ust. 1 lit. a).
- Twój adres IP: widzi go każdy serwer, z którym łączy się twój PC. Kod naszych serwerów nigdy go nie zapisuje; Cloudflare, który prowadzi nasze serwery, przetwarza go, aby dostarczać i chronić każde połączenie, zgodnie z własną polityką prywatności, a jego panel pokazuje nam, ile żądań przyszło z każdego kraju i miasta. Podstawa: nasz prawnie uzasadniony interes w prowadzeniu i ochronie naszych serwerów (art. 6 ust. 1 lit. f).
Żaden przepis nie wymaga, abyś nam cokolwiek podawał. Aplikacje w takiej postaci, w jakiej je publikujemy, potrzebują nazwy użytkownika i zawierają RUSE Guard; Bug Watch i logowanie przez Steam są twoim wyborem. Żadnej decyzji o oszukiwaniu nie podejmuje wyłącznie maszyna. Jedyna automatyczna reguła, reguła kopii z narzędziami do oszukiwania w sekcji 6, działa na kopię zbudowaną z narzędziami do oszukiwania lub testowymi, nigdy na twoje konto Steam.

Kto jeszcze to otrzymuje
- Cloudflare, Inc. (USA), który prowadzi nasze trzy serwery i przechowuje dla nas ich bazy danych, zgodnie ze swoimi warunkami przetwarzania danych.
- Valve, w związku z logowaniem przez Steam i sprawdzeniem posiadania (sekcja 8).
- GitHub (Microsoft), który przechowuje nasze pliki, zgłoszenia i dyskusje oraz, gdy jest to włączone, prywatne repozytorium, do którego serwer Bug Watch wysyła swoje notatki. Otrzymuje też to, co wysyła twoja przeglądarka, gdy otwierasz stronę wypełnioną przez aplikacje (sekcja 12).
- Google, który prowadzi adres e-mail, do którego piszesz.
- Discord, który przenosi wiadomości, które tam do nas wysyłasz.
- Anthropic, którego asystent SI Claude pomaga nam czytać niektóre raporty o awariach Bug Watch i zapisy RUSE Guard, na własnych warunkach Anthropic.
- Gry innych graczy: kod kompilacji kopii z narzędziami do oszukiwania lub testowej (sekcja 6).
- Opinia publiczna: wszystko, co opublikujesz na GitHubie lub w publicznych kanałach Discorda.
- Każdy, komu prawo każe nam to przekazać.
Poza nami: gdy gra ulegnie awarii, jej własny moduł zgłaszania awarii może wysłać raport twórcy gry (sekcja 3). To należy do gry, nie do nas.
Nie sprzedajemy ani nie wynajmujemy twoich danych i nie używamy ich ani nie udostępniamy do celów reklamowych. Aplikacje nie zawierają reklam ani zewnętrznych usług analitycznych czy śledzących; Bug Watch jest nasz własny i jest twoim wyborem.

Gdzie to jest przechowywane
Bazy danych naszych serwerów są przechowywane przez Cloudflare we wschodniej Ameryce Północnej; sieć Cloudflare udostępnia je z centrów danych na całym świecie. Zapisy RUSE Guard są zbierane do przeglądu na własnym komputerze sneadtristen6 w Stanach Zjednoczonych. Gdy badamy jakiś problem, kopie raportów Bug Watch mogą być też na jego komputerze: kopia należąca do błędu, który naprawiamy, jest usuwana, gdy ten błąd zostanie naprawiony, a kopia, która nie pokazuje żadnego błędu, jest usuwana po 7 dniach. sneadtristen6 mieszka w Stanach Zjednoczonych, a Cloudflare to firma amerykańska, więc twoje dane są przetwarzane w Stanach Zjednoczonych i wszędzie tam, gdzie działa Cloudflare.

Jak długo to przechowujemy
- Zapisy RUSE Guard: nasz serwer RUSE Guard przechowuje każdy zapis, dopóki nasz komputer przeglądu go nie odbierze, i nigdy dłużej niż 3 dni po jego nadejściu: wtedy jest usuwany, odebrany lub nie. Na komputerze przeglądu zapisy meczu są usuwane około 48 godzin po nadejściu ostatniego z nich (podczas jego następnego czyszczenia, które uruchamia się, gdy odbiera zapisy), chyba że przegląd tego meczu jest otwarty. Mecz w przeglądzie jest przechowywany, dopóki nie zostanie rozstrzygnięty; jeśli zostanie oddalony, jest wtedy usuwany. Jeśli oszukiwanie zostanie potwierdzone, masz 30 dni od decyzji na odwołanie: dowody są przechowywane przez te 30 dni, a jeśli się odwołasz, do rozstrzygnięcia twojego odwołania. Potem dowody są usuwane, a przechowywana jest tylko decyzja, tak długo, jak obowiązuje. Jeśli odwołanie zostanie uwzględnione, decyzja jest oznaczana jako uchylona i nigdy nie jest używana przeciwko tobie; poproś nas, a usuniemy ją też. Notatka o zatrzymaniu kopii z narzędziami do oszukiwania nie otwiera przeglądu: jest zapisana, aby sneadtristen6 mógł ją zobaczyć, i usuwana jak każdy zapis.
- Lista nazw użytkowników i kluczy RUSE Guard na komputerze przeglądu, z datą ich pierwszego zobaczenia: przechowywana na razie bez limitu czasu; napisz do nas e-mail, a usuniemy twoje.
- Zapisy RUSE Guard na twoim PC: zapis czekający na wysłanie zostaje, dopóki nie zostanie wysłany; zapis, który nasz serwer odrzucił, jest usuwany 30 dni po odłożeniu na bok.
- Bug Watch: sekcja 7.
- Logowanie przez Steam: sekcja 8.
- Zgłoszenia, wiadomości i e-maile: tak długo, jak potrzebuje rozmowa. Zgłoszenia na GitHubie zostają, dopóki ty lub my ich nie usuniemy.
- Nazwy w podziękowaniach dla wspierających: w każdym wydaniu od tamtej pory. Poproś, a usuniemy twoją z przyszłych wydań; wydań już opublikowanych nie da się zmienić.
- Kopie zapasowe: Cloudflare przechowuje historię baz danych naszych serwerów przez 7 dni (w naszym darmowym planie, jak mówi własna dokumentacja Cloudflare), więc to, co usuniemy, zostaje w tej historii do 7 dni po usunięciu.

Twoje prawa
Możesz poprosić nas o kopię danych, które o tobie mamy; o ich poprawienie; o ich usunięcie; o wstrzymanie ich używania, dopóki wyjaśniana jest jakaś kwestia z nimi związana; oraz o twoje dane Bug Watch i nazwę użytkownika w pliku, którego możesz użyć ponownie. Możesz w każdej chwili wycofać zgodę na Bug Watch, odznaczając go; nie cofa to tego, co wysłano wcześniej.
Jak: napisz na sneadtristen6@gmail.com albo wyślij sneadtristen6 prywatną wiadomość na Discordzie. Podaj swoją nazwę użytkownika, swój kod zgłoszenia, jeśli używasz lub używałeś Bug Watch (Ustawienia pokazują go tylko wtedy, gdy Bug Watch jest włączony), i swój kod RUSE Guard (Ustawienia go pokazują, jako „Twój kod RUSE Guard”); dla logowania przez Steam swój identyfikator Steam. Nasze serwery nie pytają o twoje prawdziwe imię i nazwisko, więc bez tego możemy nie znaleźć twoich danych. Jeśli nie jesteśmy pewni, że wniosek jest twój, możemy poprosić o więcej. Odpowiadamy w ciągu miesiąca, za darmo; jeśli wniosek jest złożony, możemy potrzebować do dwóch dodatkowych miesięcy i wyjaśnimy dlaczego.
Jeśli przestaniesz używać aplikacji, możesz poprosić nas o usunięcie twoich zapisów RUSE Guard i to zrobimy. Jeśli oszukiwanie zostało potwierdzone pod twoją nazwą użytkownika, zachowujemy tylko to oznaczenie i decyzję, na której się opiera: twoją nazwę użytkownika, mecz, werdykt, jego datę i klucz RUSE Guard, z którym przyszło oznaczenie. Możemy też zachować to, czego potrzebuje sprawa oszukiwania będąca jeszcze w przeglądzie lub odwołaniu.
Skargi: możesz złożyć skargę do organu ochrony danych tam, gdzie mieszkasz lub pracujesz, albo tam, gdzie twoim zdaniem wystąpił problem; we Francji jest to CNIL (cnil.fr), w Wielkiej Brytanii ICO (ico.org.uk). Każdy może najpierw złożyć skargę do nas. Jeśli jesteś w Wielkiej Brytanii, potwierdzimy otrzymanie twojej skargi w ciągu 30 dni.

TWOJE PRAWO SPRZECIWU
Możesz w każdej chwili, z powodów związanych z twoją szczególną sytuacją, wnieść sprzeciw wobec używania przez nas twoich danych dla RUSE Guard. Napisz do nas e-mail. Jeśli się zgodzimy, usuniemy twoje zapisy RUSE Guard, poza oznaczeniem oszustwa i jego decyzją (jak wyżej), i powiemy ci, że RUSE Guard jest wymagany do korzystania z naszych aplikacji: jedynym sposobem, by nie wysyłać nowych zapisów, jest ich nieużywanie. Możemy się nie zgodzić, gdy mamy ważne, prawnie uzasadnione podstawy, które przeważają nad twoimi, na przykład sprawę oszukiwania będącą jeszcze w przeglądzie lub odwołaniu.

Inni gracze
Dziś RUSE Guard nie wysyła nic o innych graczach w twoich meczach: żadnych nazw ani powtórek. Kopia z narzędziami do oszukiwania lub testowa przekazuje grom innych graczy tylko krótki kod kompilacji. Jeśli późniejsza wersja zacznie wysyłać zapisy meczów lub powtórki, które mogą zawierać nazwy innych graczy w grze, ten tekst powie o tym najpierw. Ta informacja jest publiczna, więc mogą ją przeczytać także gracze, którzy nie używają naszych aplikacji. Każdy może nas zapytać, co przechowujemy pod jego nazwą w grze, a powyższe prawa są także jego.

Śledzenie
Aplikacje nie śledzą tego, co robisz na innych stronach ani w innych aplikacjach, i nie zawierają sieci reklamowych ani innych zewnętrznych mechanizmów śledzących. Aplikacje nie są przeglądarkami internetowymi, więc nie odczytują sygnału przeglądarki „Do Not Track”; twoje wybory to zaznaczenie Bug Watch i to, czy używasz logowania przez Steam.

Bezpieczeństwo
Aplikacje łączą się z naszymi serwerami tylko przez szyfrowane połączenia i instalują aktualizację tylko wtedy, gdy ma nasz podpis (sekcja 12). Adres strony logowania Steam tworzą same. Nasz serwer RUSE Guard mówi tylko Launcherowi oznaczonego gracza, że jest oznaczony. Żaden system nie jest doskonale bezpieczny: jeśli stanie się coś, co zagraża twoim danym, powiemy o tym na naszej stronie GitHub i na Discordzie oraz powiadomimy organy ochrony danych tam, gdzie wymaga tego prawo.

Co zostaje na twoim PC
Aplikacje przechowują swoje ustawienia i pliki robocze w folderze o nazwie RUSE Mod Platform, wewnątrz folderu AppData\\Local twojego użytkownika Windows:

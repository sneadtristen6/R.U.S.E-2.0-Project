ru = "Посмотреть сегодняшние счётчики слово в слово, как их отправил бы Bug Watch, и имена отчётов, ожидающих отправки."
cz = "Ukáže dnešní počty slovo od slova, tak jak by je Bug Watch poslal, a názvy hlášení čekajících na odeslání."
jpn = "今日の集計を、Bug Watch が送るとおりそのままの言葉で表示し、送信待ちの報告の名前も表示します。"
sc = "逐字查看今天的统计,就像 Bug Watch 将发送的那样,以及等待发送的报告的名称。"
fa = "شمارش‌های امروز را کلمه به کلمه ببینید، همان‌طور که Bug Watch می‌فرستد، و نام گزارش‌های منتظر ارسال را."


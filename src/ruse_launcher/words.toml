Możesz przestać używać aplikacji w każdej chwili. Możemy w każdej chwili zmienić, wstrzymać lub zakończyć usługi online aplikacji, kontrole RUSE Guard lub sam projekt; jeśli projekt przejdzie do nowych opiekunów, powiemy o tym najpierw na naszej stronie GitHub i w aplikacjach.


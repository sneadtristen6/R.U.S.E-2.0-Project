- Seznam: seznam známých podvodných nástrojů RUSE Guard je součástí aplikace jako prostý soubor, který si můžete přečíst, a mění se jen s aktualizací aplikace. Nic se pro něj nestahuje.
- Kontrola programů: v zápase pro více hráčů nebo kooperativním zápase spuštěném z Launcheru se RUSE Guard každých 30 sekund podívá na názvy programů běžících na vašem PC a ponechá jen názvy, které jsou na jeho seznamu. Aby Launcher věděl, kdy takový zápas probíhá, čte během běhu hry její vlastní chybový výstup: ponechá jen krátké řádky RUSE Guard, které říkají, že zápas probíhá nebo skončil, a každý jiný řádek zahodí, jakmile ho přečte, nikdy ho neuchová ani neodešle (ten výstup může obsahovat i vlastní řádky Steamu, v jednom z nich číslo vašeho účtu Steam). Pokud hra neřekne, že zápas skončil, kontrola se zastaví dvě minuty poté, co hra naposledy řekla, že zápas probíhá. Pokud během zápasu běžel program ze seznamu, Launcher po hře pošle našemu serveru krátký záznam: vaše uživatelské jméno a klíč RUSE Guard, kdy zápas začal a skončil, zda šlo o zápas pro více hráčů nebo kooperativní, a názvy nalezených programů ze seznamu. Nic jiného se nepřidává: žádný záznam zápasu, žádné soubory a nic dalšího o zápase. Pokud žádný program ze seznamu neběžel, nic se neposílá.
- Kód hry: pro upravenou kopii, jejíž módy mění, jak se hra hraje, Launcher ukáže kód hry. Představuje verzi hry této kopie, její módy s jejich verzemi a to, co mění v tom, jak se hra hraje. Kódy hry porovnáváte s lidmi, s nimiž hrajete. Dnes je nepřijímáme; záznam o zápase (níže) by je nesl.
- Kopie sestavené s podvodným nebo testovacím nástrojem: taková kopie hraje zápasy pro více hráčů a kooperativní jen s hráči, jejichž sestavení je stejné (stejná verze hry a stejné módy, ve stejných verzích). Asi vteřinu po začátku každého takového zápasu sdělí hře každého hráče krátký kód svého sestavení (kód sestavení), vytvořený z verze hry, módů s jejich verzemi v jejich pořadí a z toho, co mění v tom, jak se hra hraje. Neobsahuje žádné jméno ani účet. Pokud mají všichni hráči stejné sestavení, zápas je navržen tak, aby pokračoval; zatím takový zápas nikdo ve dvou lidech nehrál. Pokud ne, zápas po několika sekundách opustí.
  V zápase pro více hráčů, který není hodnocený, pak na obrazovce konce tohoto zápasu hru úmyslně zastaví: hra spadne zpět na plochu. Vlastní hlásič pádů hry pak může poslat své hlášení tvůrci hry a to hlášení nese řádek RUSE Guard o tom, že byla zastavena podvodná kopie. V kooperativních a hodnocených zápasech jen zápas opustí. Když hru spustil Launcher a je stále otevřený, když se hra zastaví, vezme z hlášení hry o pádu na vašem PC jen řádek RUSE Guard a pošle našemu serveru krátkou poznámku, že byla zastavena podvodná kopie, pod vaším uživatelským jménem a klíčem RUSE Guard, s časem, kdy bylo hlášení o pádu zapsáno, a časem, kdy byla poznámka vytvořena. Řádek říká jen druh zápasu a číslo vaší strany v něm; jakékoli Steam ID, dlouhé číslo nebo cesta se z něj odstraní. Naše aplikace samotné hlášení o pádu nikdy neposílají. Poznámka neotvírá žádné posouzení a nic nerozhoduje; je vypsána, aby ji sneadtristen6 viděl. Poznámka se neposílá, pokud byl Launcher zavřen dřív, než se hra zastavila, nebo pokud byla hra spuštěna ze Studia nebo ručně. Na Linuxu a Steam Decku zatím není známo, zda se poznámka posílá.
  Poctivé kopie se nikdy nezastavují.
- Váš klíč RUSE Guard: když Launcher poprvé vytvoří na vašem PC záznam RUSE Guard, vytvoří tam náhodný klíč. Kód vytvořený z tohoto klíče (jeho veřejná polovina) se přikládá ke každému záznamu, abychom mohli odlišit vaše záznamy od záznamů někoho se stejným uživatelským jménem a ověřit, že nebyly změněny. Nic jiného o vás neříká. Nastavení ukazuje krátký kód z něj vytvořený, „Váš kód RUSE Guard“: pošlete ho s žádostí o ochranu soukromí a najdeme vaše vlastní záznamy RUSE Guard. Nic dalšího se pro to neposílá.
- Zatím nefunguje: záznamy o zápasech. Potřebují záznam zápasu, který hra dnes zapsat neumí. Než začnou, tento text aktualizujeme a aplikace vám ho ukážou znovu. Až začnou, záznam o zápase ponese: vaše uživatelské jméno a klíč RUSE Guard; vaši stranu; kódy vaší kopie; kontroly souborů hry, které vaše kopie změnila, a pravidelné kontroly, že hra každého hráče zůstává stejná; vaše módy s jejich kontrolami; které příkazy skriptů vaše módy vážou na klávesy (nikdy ne to, co stisknete); u vývojářské testovací kopie klíč vývojáře; názvy případných nalezených běžících podvodných nástrojů ze seznamu; kdy zápas začal a skončil; a nejnovější záznam přehrávání uložený na vašem PC během zápasu nebo těsně po něm, s názvem jeho souboru. Záznam přehrávání obsahuje každý příkaz, který každý hráč v zápase zadal, a jeho název souboru i obsah mohou obsahovat vaše i cizí herní jména.
- Co nikdy nedělá: nikdy nesbírá vaši obrazovku ani stisky kláves, nikdy se nedívá dovnitř jiných programů, když běží, a nikdy nám neposílá vaše soubory, kromě záznamu přehrávání, který by nesl záznam o zápase. Z hlášení hry o pádech čte jen svůj vlastní řádek o podvodné kopii, kterou zastavil (výše), na vašem PC.
- Testovací kopie vývojářů: aplikace jsou navrženy tak, aby pustily testovací kopii vývojáře do zápasu se zvláštním klíčem od nás, jedinou cestou kolem pravidla o podvodných kopiích. Zatím žádná nefunguje: aplikace dnes takový klíč ověřit neumějí.
- Rozhodnutí o vás: žádné automatické zákazy. Žádné rozhodnutí o podvádění nedělá jen stroj: sneadtristen6 se podívá na důkazy a, pokud existuje, na záznam přehrávání, a rozhodne. Claude od Anthropic, AI asistent, mu pomáhá číst záznamy RUSE Guard podle vlastních podmínek Anthropic; rozhodnutí jsou jeho. Záznam, který jmenuje nástroj ze seznamu, otevře pro něj posouzení, které nic nerozhoduje, dokud nerozhodne on. Proti rozhodnutí se můžete odvolat do 30 dnů (oddíl 17); sneadtristen6 je jediný člověk, který případy posuzuje, takže o odvoláních také rozhoduje sám. Jediné automatické pravidlo je pravidlo o podvodných kopiích výše. Vyplývá z kopie, kterou jste se rozhodli sestavit, a nikdy se nedotkne vašeho účtu Steam ani vaší nainstalované hry.
- Co rozhodnutí dnes znamená: pokud se podvádění potvrdí, uchováme toto rozhodnutí pod vaším uživatelským jménem na našem seznamu označených hráčů a použijeme ho, když budeme posuzovat pozdější zápasy. Protože si dva hráči mohou dělit uživatelské jméno, díváme se také na to, s jakým klíčem RUSE Guard záznamy přišly. Náš server RUSE Guard tento seznam vede, každé označené uživatelské jméno s klíčem RUSE Guard, s nímž poprvé přišly jeho záznamy, a sdělí, že je označený, jen Launcheru toho hráče. Aplikace zatím podle označení nejednají. Pokud tak bude jednat pozdější verze, například aby upravené kopie označeného hráče nepustila do hry pro více hráčů přes R.U.S.E. 2.0, tento text to řekne dopředu. Pokud je odvolání uznáno, rozhodnutí se označí jako zrušené a uživatelské jméno ze seznamu zmizí.
- Jak dlouho se záznamy uchovávají a vaše práva: oddíl 11.

7. Bug Watch: pomozte nám najít a opravit chyby (volitelné, doporučeno)
Proč: aby Studio a Launcher fungovaly lépe a aby se pády opravovaly dřív: místo čekání, až někdo pád nahlásí, ho vidíme i to, co k němu vedlo.
Na jakém základě: jen s vaším souhlasem (oddíl 11). Je vypnutý, dokud ho nezaškrtnete. Uložení nebo změna vašeho uživatelského jména ho nikdy nezapne ani nevypne. Zaškrtnutí nemění nic jiného v aplikacích, kromě toho, co vám Launcher řekne po pádu hry (níže). Když aplikace po změně ukážou tyto podmínky znovu: pokud je Bug Watch zapnutý, jeho políčko se ptá „Nechat Bug Watch zapnutý?“, zaškrtnuté; ponechte zaškrtnutí, aby zůstal zapnutý, nebo ho zrušte a vypněte ho. Pokud je vypnutý, políčko Bug Watch se objeví znovu, nezaškrtnuté.
Dokud je zapnutý, Studio a Launcher posílají našemu serveru:
- jednou denně počty za každý den, který skončil:
  - aplikaci a její verzi; den; zda používáte Windows 10 nebo 11; jazyk aplikace; verzi hry; zda je RUSE Guard zabudován; kterou verzi těchto podmínek jste přijali;
  - jak často se používala každá část aplikace a jak dlouho věci trvaly; co se pokazilo a kde (jen v našem vlastním kódu; když selže skript obrazovky Studia, název obrazovky a druh chyby, nikdy její text, soubor ani řádek); u každé dlouhé úlohy, například sestavení módu, kolikrát skončila nebo selhala a u kolika sestavení se v módech našly chyby;
  - seznam selhání toho dne, nejvýše 20, každé s jeho kódem (které místo v našem kódu), jak daleko se dostalo Hrát nebo Vyzkoušet ve hře, tvar sady módů (kolik módů z našeho seznamu, složek módů a souborů módů vlastních, jako počty), a vedle toho jen čísla, která nikoho nejmenují: číslo chyby Windows (například plný disk), odpověď webového serveru (například 404), výstupní číslo hry, počet a druhý kód;
  - kolik aktualizací bylo nabídnuto, nainstalováno nebo selhalo; kolikrát aplikace spadla; které kontroly řešitele potíží našly problém;
  - které módy z našeho seznamu jste měli zapnuté; kolik minut jste celkem hráli a kolik s každým z těchto módů;
  - kolik vlastních módů jste měli a jaké druhy věcí obsahují, například jednotky, mapy, mise nebo skripty (počítáno podle druhu, nikdy ne jmenovitě a nikdy ne jejich slova, cesty ani soubory);
- hned, když aplikace spadne: druh chyby a místo v našem kódu;
- hned poté, co spadla hra spuštěná aplikací, technické podrobnosti o tom, kde a jak spadla:
  - chybový kód hry; název souboru, ve kterém se zastavila (může to být část Windows, ovladač nebo jiný program načtený do hry, například překryvná vrstva), místo v něm, kde se hra zastavila, a až 16 míst ve hře, která k tomu vedla;
  - u chyby paměti to, co se hra pokoušela udělat (číst, zapisovat nebo spustit) a místo v paměti;
  - u chyby skriptu vlastní text chyby hry, s cestami na disku zkrácenými na názvy souborů, názvem vaší uživatelské složky skrytým (názvy složek v ní mohou zůstat) a čísly účtů Steam a jinými dlouhými čísly odstraněnými (názvy skriptů samotné hry zůstávají); kolik dřívějších chyb hra přeskočila; a mapu (jedna z map samotné hry jejím názvem, mapa módu jen jako „mapa módu“);
  - jednotku, kterou hra vytvářela, když ji aplikace dokážou přečíst z hlášení hry o pádu (jedna z jednotek samotné hry jejím číslem, jednotka módu jen jako „jednotka módu“);
  - které módy byly zapnuté, jaké druhy věcí obsahují vaše vlastní módy (počítáno podle druhu) a kterou verzi těchto podmínek jste přijali.
Bug Watch používá jen vlastní hlášení hry o pádech. Z hlášení jiného programu čte jen názvy souborů, které vypisuje, aby poznal, že nejde o hlášení hry; nic z něj se neposílá.
Každé odeslání nese vaše uživatelské jméno a vaše ID instalace, náhodný kód vytvořený na vašem PC, když jste poprvé zvolili své uživatelské jméno, ať už Bug Watch zaškrtnete, nebo ne. Váš kód hlášení, který Nastavení ukazuje, dokud je Bug Watch zapnutý, je prvních 8 znaků vašeho ID instalace.
Naše aplikace nikdy neposílají vaše soubory ani samotné soubory hlášení hry o pádu a Bug Watch neposílá žádné číslo účtu Steam. (Vlastní hlásič pádů hry může poslat vlastní hlášení tvůrci hry: oddíl 3.) Text chyby hry může obsahovat názvy ze hry nebo ze skriptů módu. Prosíme, nepoužívejte jako uživatelské jméno své skutečné jméno (oddíl 9).
Známé pády: pokud je Bug Watch zapnutý a hra spadne jedním ze způsobů, které známe, Launcher vám ve vašem jazyce řekne, kterou jednotku hra vytvářela a proč. Toto vysvětlení se jen zobrazí vám, nikdy se neposílá; hlášení Bug Watch nese jednotku jen tak, jak je uvedeno výše (číslem nebo „jednotka módu“). Aby aplikace tyto pády znaly, stahují náš seznam z našeho serveru Bug Watch při spuštění hry, pokud seznam na vašem PC není mladší než jeden den, a ještě jednou při pádu, pokud není použitelný seznam. Stahují ho jen dokud je Bug Watch zapnutý, ukládají ho na váš PC, použijí ho, jen když nese náš podpis, a vaše hlášení o pádu s ním porovnávají na vašem PC. Stažení nenese nic o vás. Bez seznamu (například poprvé nebo bez internetu) vám Launcher stále řekne, že hra spadla, ale ne jednotku ani důvod. Zrušení zaškrtnutí Bug Watch seznam z vašeho PC smaže.
Se zapnutým i vypnutým Bug Watch: pokud hra spuštěná Launcherem spadne, Launcher vám ukáže krátký kód pádu, vytvořený na vašem PC z místa, kde se hra zastavila. Nikam se neposílá. Tlačítko „Kopírovat kód“ ho zkopíruje. Pokud chcete pomoc, pošlete kód a snímek obrazovky zprávy uživateli XUL na Discordu (XUL6x3) nebo na GitHubu a vyhledáme ho v našem vlastním seznamu. Kód říká jen to, kde se hra zastavila.
Nastavení vám ukazuje dnešní počty slovo od slova, tak jak by se poslaly, a názvy hlášení, která čekají na odeslání. Hlášení, která nelze odeslat, čekají na vašem PC až 30 dnů, pak se zahodí. Zatímco běží hra, kterou aplikace spustila, Bug Watch si o ní na vašem PC navíc vede krátkou poznámku, aby aplikace při dalším spuštění poznala, zda hra spadla: kdy se spustila a kdy byla naposledy vidět běžet, její módy (naše podle názvu a verze, ostatní jen jako počet) a kde jsou nainstalovány kopie a hra (složka Windows může obsahovat vaše uživatelské jméno ve Windows). Nikdy se neodesílá a smaže se po 30 dnech, nebo hned, když Bug Watch odškrtnete.
Kdo to vidí: naši vývojáři. Ukládá to pro nás Cloudflare na našem serveru Bug Watch. Když je to zapnuto, náš server také posílá poznámky o problémech, které sledujeme, do soukromého repozitáře na GitHubu, prostoru na GitHubu, který mohou otevřít jen naši vývojáři. Poznámky nikdy neobsahují uživatelské jméno ani kód hlášení. Naši vývojáři také používají Claude od Anthropic, AI asistenta, který pomáhá číst některá hlášení o pádech Bug Watch, podle vlastních podmínek Anthropic.
Jak dlouho: každé hlášení se z našeho serveru maže při denním úklidu poté, co tam bylo 7 dnů, tedy 7 až 8 dnů po svém příchodu. Naši vývojáři mohou hlášení o velmi závažném pádu označit, aby se uchovalo, dokud ten pád opravují; označené hlášení zůstane, dokud značku neodeberou, v den, kdy je ten pád opraven, a pak zmizí při dalším denním úklidu. Co zůstane potom, bez uživatelského jména, ID instalace či kódu hlášení: denní součty za každou verzi aplikace (například „12 sestavení módů selhalo ve verzi 0.9.9 ten den“) a den, kdy byla poprvé spatřena každá verze a každý druh chyby, bez časového omezení; a poznámky našeho serveru o problémech, které najde (která část aplikace, který mód z našeho seznamu, kde došlo k pádu a jak často), do 3 dnů poté, co ten problém uzavřeme. Prvních 7 dní, v den, kdy verzi používala jen jedna osoba, jsou její součty počty této jedné osoby; poté se verze nebo mód z našeho seznamu, které ten den použily méně než 3 instalace, uchovává jen jako „(other)“. Poznámky na GitHubu zůstanou, dokud je nesmažeme. Cloudflare uchovává historii našich databází 7 dnů, takže to, co smažeme, zůstává v této historii ještě až 7 dnů. Kopie na počítači sneadtristen6: oddíl 11, „Kde se to uchovává“.
Zaškrtnutí můžete kdykoli zrušit v Nastavení (nebo v políčku Bug Watch, když aplikace ukážou tyto podmínky). Od té chvíle se nic nepočítá ani neposílá a aplikace smažou počty Bug Watch a hlášení čekající na odeslání. Vaše uživatelské jméno a ID instalace zůstávají na vašem PC, protože RUSE Guard vaše uživatelské jméno používá. Nic, co vzniklo před zrušením zaškrtnutí, se později neodešle, ani když ho znovu zaškrtnete. Zrušení zaškrtnutí našemu serveru nic neřekne: co už k němu dorazilo, se maže, jak je uvedeno výše. Chcete-li, aby se to smazalo dřív, pošlete nám e-mailem svůj kód hlášení (Nastavení ho ukazuje, jen dokud je Bug Watch zapnutý, takže si ho poznamenejte před zrušením zaškrtnutí), nebo své uživatelské jméno, pokud kód nemáte: podle něj najdeme hlášení vaší instalace a smažeme je. Součty a poznámky výše zůstávají. Zrušení zaškrtnutí nevrací zpět to, co bylo odesláno dříve.

8. Přihlášení přes Steam (volitelné)
Proč: aby se potvrdilo, že vlastníte R.U.S.E., pro hru online, RUSE Guard a stahování obsahu později. Zatím to nic nevyžaduje.
Na jakém základě: vy o to požádáte (oddíl 11). Aplikace to mohou nabídnout při spuštění a Nastavení Launcheru to otevře kdykoli.
- Přihlásíte se na vlastní stránce Steamu ve svém prohlížeči, na adrese, kterou si aplikace vytvoří sama. Vaše heslo nikdy nevidíme.
- Steam pak sdělí našemu serveru vaše Steam ID. Náš server se Steamu zeptá, zda tento účet vlastní R.U.S.E. (funguje to, jen pokud jsou podrobnosti o vašich hrách na Steamu veřejné), použije odpověď a ID neukládá. Pokud hru vlastníte, náš server dá vašemu PC propustku (kód, který ukazuje, že kontrola proběhla úspěšně), platnou 30 dní.
- Co náš server uchovává: jednosměrný kód vytvořený z vašeho Steam ID s naším tajemstvím a kdy byla vaše propustka vydána a kdy vyprší, až do 30 dnů po vypršení vaší propustky. Krátkodobý kód, který vaše aplikace používá k vyzvednutí propustky (přihlašovací kód), se uchovává jen ve zakódované podobě; vyprší po 10 minutách a smaže se, když ho aplikace vyzvedne, nebo zhruba do hodiny po vypršení. Jednorázová přihlašovací čísla Steamu brání opakování přihlášení; uchovávají se den, i když se přihlášení nepodaří, a pak se do zhruba hodiny smažou. Náš kód nikdy neukládá vaši IP adresu.
- Kde: databáze našich serverů ukládá Cloudflare ve východní Severní Americe.
- Co uchovává váš PC: propustku, v nastavení aplikací, dokud se neodhlásíte v Nastavení, čímž se smaže. Propustka, které vypršela platnost, tam také zůstane až do té doby.
- Pokud jsou podrobnosti o vašich hrách soukromé, Steam nám to říct nemůže. Nastavte Podrobnosti o hře na Veřejné na chvíli a zkuste to znovu.
- R.U.S.E. 2.0 není spojeno s Valve ani jím podporováno. Valve vaše přihlášení zpracovává podle vlastních zásad ochrany soukromí.

9. Vaše uživatelské jméno
Proč: abychom věděli, čí je které hlášení o pádu nebo záznam o zápase, a mohli tomu člověku pomoci. Každý si ho zvolí při prvním spuštění, protože RUSE Guard je povinný. Přidá se # a čtyři náhodná čísla, například Nick#4821. Dva hráči mohou přesto skončit se stejným, proto se řídíme také vaším klíčem RUSE Guard nebo kódem hlášení. Prosíme, nepoužívejte své skutečné jméno, jméno na Steamu ani nic jiného, co vás identifikuje. Posílá se jen s vašimi záznamy RUSE Guard a, pokud je Bug Watch zapnutý, s vašimi hlášeními Bug Watch. Jedno uživatelské jméno platí pro obě aplikace. Můžete ho změnit v Nastavení; jeho změna nikdy nezapne ani nevypne Bug Watch. Už odeslané záznamy si ponechají staré jméno, dokud se nesmažou. Chcete-li, aby se vaše uživatelské jméno a údaje pod ním smazaly, napište nám e-mail.

10. Název a intro R.U.S.E. 2.0 (volitelné)
Kopie, které sestaví Launcher a Studio, ukazují původní název hry a úvodní video s logem Eugen Systems. Pokud zaškrtnete políčko na první obrazovce nebo „Používat zlatý název a intro R.U.S.E. 2.0“ v části Název hry v Nastavení, tyto kopie ukážou R.U.S.E. 2.0 zlatě v hlavním menu a na načítacích obrazovkách a naše intro se přehraje místo úvodního videa s logem Eugen Systems, když se hra spouští. Zlatý název se vytváří na vašem PC ze souborů vaší vlastní hry, přes obrázek bitevní scény, který je součástí aplikací. Intro používá také zvuk motoru, který je součástí aplikací. Mění jen vaši upravenou kopii, nikdy vaši nainstalovanou hru, a můžete to kdykoli změnit v Nastavení. V Launcheru Původní hra sestaví samostatnou kopii bez módů, s RUSE Guard uvnitř jako každá kopie a s názvem, který jste zvolili.


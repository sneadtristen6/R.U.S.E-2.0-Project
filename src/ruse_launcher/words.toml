Aby stwierdzić, czy gra nadal działa z twojej kopii z modami, aplikacje sprawdzają też, które programy działają i skąd (to osobno od kontroli programów RUSE Guard z sekcji 6); to zostaje na twoim PC. Gdy aplikacje czytają raporty o awariach gry (sekcje 6 i 7), robią to na twoim PC i nigdy ich nie wysyłają; tylko własny moduł zgłaszania awarii gry może wysłać jej raport twórcy gry (sekcja 3). Nic z tego folderu nie jest nigdzie wysyłane, poza tym, co mówią sekcje 5 do 8 i 12. Gdy odinstalowujesz drugą z dwóch aplikacji, deinstalator pyta, czy usunąć też ten folder; odpowiedź zaczyna się od Nie. Tak go usuwa, poza modami, mapami, eksportami lub kopiami zapasowymi, które starsza wersja w nim zachowała. Gdy druga aplikacja jest nadal zainstalowana, nie pyta o nic i niczego nie usuwa, ponieważ obie aplikacje używają tego folderu. W przeciwnym razie, aby go usunąć, usuń go sam. Twoje mody, mapy, eksporty i kopie zapasowe w folderze RUSE 2.0 w Dokumentach, twoja kopia z modami i czysta kopia zapasowa twojej gry też zostają, dopóki ich nie usuniesz.


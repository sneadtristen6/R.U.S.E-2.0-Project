Les applications sont gratuites et fournies telles quelles, sans aucune garantie (GPL v3, articles 15 et 16). Elles construisent des copies moddées du jeu et laissent votre jeu installé inchangé. Nous ne sommes pas responsables du jeu, de votre compte Steam, ni d'aucune perte liée à l'utilisation des applications.


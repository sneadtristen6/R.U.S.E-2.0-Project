[agree_guard]
us = "RUSE Guard keeps multiplayer and co-op matches fair when they're played with copies our apps build. Its watcher, in every modded copy, may also show a notice on your screen in a skirmish, as when a side's money jumps; it changes and sends nothing. In a multiplayer or co-op match the Launcher started, it looks at the names of the programs running on your PC against its list of known cheat tools, which comes inside the app where you can read it; if a listed one is running, the Launcher sends our server a short record of it under your username. A copy built with a cheat or test tool plays multiplayer and co-op only with players who have the same build (same game version and mods), and gives up any other match. If that was a multiplayer match that isn't ranked, it then stops the game with a crash, and the Launcher sends our server a short note under your username. RUSE Guard never collects your screen or keystrokes, and the Studio sends nothing for it. Fair matches for every player are what the law calls a legitimate interest, so RUSE Guard isn't a tick box like Bug Watch. You can still object, or ask to see or delete your data, at any time (see \"Your rights\" in the full text)."
fr = "RUSE Guard garde équitables les parties multijoueur et coopératives jouées avec des copies que nos applications construisent. Son surveillant, présent dans chaque copie moddée, peut aussi afficher un message à l'écran lors d'une escarmouche, par exemple quand l'argent d'un camp fait un bond ; il ne change rien et n'envoie rien. Dans une partie multijoueur ou coopérative lancée par le Launcher, il regarde les noms des programmes qui tournent sur votre PC et les compare à sa liste d'outils de triche connus, fournie dans l'application, où vous pouvez la lire ; si l'un d'eux tourne, le Launcher envoie à notre serveur un court enregistrement le concernant, sous votre nom d'utilisateur. Une copie construite avec un outil de triche ou de test ne joue en multijoueur et en coopératif qu'avec des joueurs qui ont la même version de build (même version du jeu et mêmes mods), et abandonne toute autre partie. Si c'était une partie multijoueur non classée, elle arrête ensuite le jeu par un plantage, et le Launcher envoie à notre serveur une courte note sous votre nom d'utilisateur. RUSE Guard ne collecte jamais votre écran ni vos frappes au clavier, et le Studio n'envoie rien pour lui. Des parties équitables pour tous les joueurs, c'est ce que la loi appelle un intérêt légitime : RUSE Guard n'est donc pas une case à cocher comme Bug Watch. Vous pouvez quand même vous y opposer, ou demander à voir ou à supprimer vos données, à tout moment (voir « Vos droits » dans le texte complet)."
ger = "RUSE Guard sorgt dafür, dass Mehrspieler- und Koop-Partien fair bleiben, wenn sie mit Kopien gespielt werden, die unsere Apps bauen. Sein Beobachter, der in jeder gemoddeten Kopie steckt, kann in einem Gefecht außerdem eine Meldung auf deinem Bildschirm zeigen, zum Beispiel wenn das Geld einer Seite plötzlich springt; er verändert und sendet nichts. In einer Mehrspieler- oder Koop-Partie, die der Launcher gestartet hat, vergleicht RUSE Guard die Namen der Programme, die auf deinem PC laufen, mit seiner Liste bekannter Cheat-Tools, die in der App mitgeliefert wird und die du dort lesen kannst; läuft ein Programm von der Liste, schickt der Launcher unserem Server unter deinem Benutzernamen einen kurzen Eintrag dazu. Eine Kopie, die mit einem Cheat- oder Testwerkzeug gebaut wurde, spielt Mehrspieler und Koop nur mit Spielern, die denselben Build haben (dieselbe Spielversion und dieselben Mods), und gibt jede andere Partie auf. War das eine Mehrspielerpartie ohne Wertung, stoppt sie danach das Spiel mit einem Absturz, und der Launcher schickt unserem Server unter deinem Benutzernamen eine kurze Notiz. RUSE Guard sammelt nie deinen Bildschirm oder deine Tastatureingaben, und das Studio sendet dafür nichts. Faire Partien für alle Spieler sind das, was das Gesetz ein berechtigtes Interesse nennt; deshalb ist RUSE Guard kein Häkchen wie Bug Watch. Du kannst trotzdem jederzeit widersprechen oder deine Daten einsehen oder löschen lassen (siehe „Deine Rechte“ im vollständigen Text)."
ita = "RUSE Guard mantiene leali le partite multigiocatore e cooperative giocate con le copie costruite dalle nostre app. Il suo sorvegliante, in ogni copia moddata, può anche mostrare un avviso sul tuo schermo in una schermaglia, per esempio quando i soldi di una fazione schizzano in alto; non cambia e non invia nulla. In una partita multigiocatore o cooperativa avviata dal Launcher, controlla i nomi dei programmi in esecuzione sul tuo PC confrontandoli con il suo elenco di strumenti di trucco noti, che si trova dentro l'app e che puoi leggere; se ne è in esecuzione uno dell'elenco, il Launcher invia al nostro server una breve registrazione, con il tuo nome utente. Una copia costruita con un trucco o uno strumento di test gioca in multigiocatore e in cooperativa solo con giocatori che hanno la stessa build (stessa versione del gioco e stesse mod) e abbandona ogni altra partita. Se era una partita multigiocatore non classificata, poi ferma il gioco con un crash, e il Launcher invia al nostro server una breve nota con il tuo nome utente. RUSE Guard non raccoglie mai il tuo schermo né i tasti che premi, e lo Studio non invia nulla per esso. Partite leali per tutti i giocatori sono ciò che la legge chiama un legittimo interesse, quindi RUSE Guard non è una casella da spuntare come Bug Watch. Puoi comunque opporti, o chiedere di vedere o cancellare i tuoi dati, in qualsiasi momento (vedi \"I tuoi diritti\" nel testo completo)."
spa = "RUSE Guard mantiene justas las partidas multijugador y cooperativas que se juegan con copias construidas por nuestras aplicaciones. Su vigilante, presente en toda copia con mods, también puede mostrar un aviso en tu pantalla en una escaramuza, por ejemplo cuando el dinero de un bando da un salto; no cambia nada ni envía nada. En una partida multijugador o cooperativa que haya iniciado el Launcher, mira los nombres de los programas que se ejecutan en tu PC y los compara con su lista de herramientas de trampas conocidas, que viene dentro de la aplicación y puedes leer; si hay alguna de la lista en ejecución, el Launcher envía a nuestro servidor un breve registro de ello con tu nombre de usuario. Una copia construida con una herramienta de trampas o de prueba solo juega partidas multijugador y cooperativas con jugadores que tengan la misma construcción (la misma versión del juego y los mismos mods), y abandona cualquier otra partida. Si era una partida multijugador no clasificada, después detiene el juego con un cierre inesperado, y el Launcher envía a nuestro servidor una breve nota con tu nombre de usuario. RUSE Guard nunca recoge tu pantalla ni tus pulsaciones de teclas, y el Studio no envía nada para él. Las partidas justas para todos los jugadores son lo que la ley llama un interés legítimo, así que RUSE Guard no es una casilla que se marca, como Bug Watch. Aun así, puedes oponerte, o pedir ver o borrar tus datos, en cualquier momento (consulta «Tus derechos» en el texto completo)."
pol = "RUSE Guard dba o uczciwość meczów wieloosobowych i kooperacyjnych rozgrywanych na kopiach budowanych przez nasze aplikacje. Jego strażnik, w każdej kopii z modami, może też pokazać na twoim ekranie powiadomienie w potyczce, na przykład gdy pieniądze jednej strony nagle skaczą; niczego nie zmienia ani nie wysyła. W meczu wieloosobowym lub kooperacyjnym uruchomionym przez Launcher porównuje nazwy programów działających na twoim PC z listą znanych narzędzi do oszukiwania, która jest wewnątrz aplikacji, gdzie możesz ją przeczytać; jeśli któreś z nich działa, Launcher wysyła naszemu serwerowi krótki zapis o tym, pod twoją nazwą użytkownika. Kopia zbudowana z narzędziem do oszukiwania lub testowym gra w meczach wieloosobowych i kooperacyjnych tylko z graczami, którzy mają tę samą kompilację (tę samą wersję gry i te same mody), a każdy inny mecz opuszcza. Jeśli był to mecz wieloosobowy, który nie jest rankingowy, zatrzymuje potem grę, powodując awarię, a Launcher wysyła naszemu serwerowi krótką notatkę pod twoją nazwą użytkownika. RUSE Guard nigdy nie zbiera twojego ekranu ani naciśnięć klawiszy, a Studio niczego dla niego nie wysyła. Uczciwe mecze dla każdego gracza to to, co prawo nazywa prawnie uzasadnionym interesem, więc RUSE Guard nie jest polem wyboru jak Bug Watch. Nadal możesz w każdej chwili wnieść sprzeciw albo poprosić o wgląd w swoje dane lub ich usunięcie (zobacz „Twoje prawa” w pełnym tekście)."
ru = "RUSE Guard следит за честностью сетевых и кооперативных матчей, которые играются в копиях, собранных нашими приложениями. Его наблюдатель, который есть в каждой копии с модами, может также показывать на экране уведомление в схватке, например когда у стороны скачком растут деньги; он ничего не меняет и ничего не отправляет. В сетевом или кооперативном матче, запущенном из Launcher, он сверяет имена запущенных на вашем ПК программ со списком известных читерских инструментов, который находится внутри приложения, где вы можете его прочитать; если какая-то из программ списка запущена, Launcher отправляет на наш сервер короткую запись об этом под вашим именем пользователя. Копия, собранная с читерским или тестовым инструментом, играет сетевые и кооперативные матчи только с игроками, у которых та же сборка (та же версия игры и те же моды), и покидает любой другой матч. Если это был сетевой матч без рейтинга, она затем останавливает игру с вылетом, а Launcher отправляет на наш сервер короткую заметку под вашим именем пользователя. RUSE Guard никогда не собирает ваш экран и нажатия клавиш, а Studio ничего для него не отправляет. Честные матчи для всех игроков — это то, что закон называет законным интересом, поэтому RUSE Guard — не галочка, как Bug Watch. Вы всё равно можете в любой момент возразить, а также попросить показать или удалить ваши данные (см. «Ваши права» в полном тексте)."
cz = "RUSE Guard zajišťuje férovost zápasů pro více hráčů a kooperativních zápasů, které se hrají s kopiemi sestavenými našimi aplikacemi. Jeho hlídač, který je v každé upravené kopii, může při šarvátce také ukázat na obrazovce upozornění, například když skokově vzroste peněžní částka některé strany; nic nemění a nic neposílá. V zápase pro více hráčů nebo kooperativním zápase, který spustil Launcher, porovnává názvy programů běžících na vašem PC se svým seznamem známých podvodných nástrojů, který je součástí aplikace, takže si ho můžete přečíst; pokud některý z nich běží, Launcher pošle našemu serveru krátký záznam o tom pod vaším uživatelským jménem. Kopie sestavená s podvodným nebo testovacím nástrojem hraje zápasy pro více hráčů a kooperativní zápasy jen s hráči, kteří mají stejné sestavení (stejnou verzi hry a stejné módy), a každý jiný zápas opustí. Pokud šlo o zápas pro více hráčů, který není hodnocený, pak hru zastaví pádem a Launcher pošle našemu serveru pod vaším uživatelským jménem krátkou poznámku. RUSE Guard nikdy nesbírá vaši obrazovku ani stisky kláves a Studio pro něj nic neposílá. Férové zápasy pro všechny hráče jsou to, co zákon nazývá oprávněný zájem, proto RUSE Guard není políčko k zaškrtnutí jako Bug Watch. Přesto můžete kdykoli vznést námitku nebo požádat o zobrazení či smazání svých údajů (viz „Vaše práva“ v plném znění)."
jpn = "RUSE Guard は、私たちのアプリが作ったコピーで遊ぶマルチプレイ対戦と協力対戦を公正に保ちます。MOD入りのコピーすべてに入っている監視機能は、スキルミッシュ（コンピューター相手の小競り合い）でも画面に通知を出すことがあります（たとえば、ある陣営の資金が急に増えたときなど）。監視機能は何も変更せず、何も送りません。Launcher が起動したマルチプレイ対戦または協力対戦では、PC で動いているプログラムの名前を、既知のチートツールの一覧と照らし合わせます。この一覧はアプリの中に入っていて、あなたが読めます。一覧にあるものが動いていた場合、Launcher はそれについての短い記録を、あなたのユーザー名を付けて私たちのサーバーに送ります。チートツールやテストツールを入れて作ったコピーは、同じビルド（同じゲームバージョンと同じ MOD）のプレイヤーとだけマルチプレイと協力対戦で遊べ、それ以外の対戦からは降参します。それがランク戦ではないマルチプレイ対戦だった場合は、そのあとゲームをクラッシュさせて止め、Launcher はあなたのユーザー名を付けた短い通知を私たちのサーバーに送ります。RUSE Guard があなたの画面やキー入力を集めることは決してなく、Studio はこれのために何も送りません。すべてのプレイヤーにとって公正な対戦は、法律でいう「正当な利益」にあたるため、RUSE Guard は Bug Watch のようなチェック欄ではありません。それでも、いつでも異議を述べたり、自分のデータの閲覧や削除を求めたりできます（全文の「あなたの権利」を参照）。"
sc = "RUSE Guard 让用我们的应用构建的副本所进行的多人对战和合作对战保持公平。它的监视器存在于每个模组版副本中,在遭遇战中也可能在你的屏幕上显示提示,例如某一方的金钱突然暴增;它不改变任何内容,也不发送任何内容。在由 Launcher 启动的多人对战或合作对战中,它会把你电脑上正在运行的程序名称与已知作弊工具列表对照,该列表随应用提供,你可以阅读;如果列表中的程序正在运行,Launcher 会以你的用户名向我们的服务器发送一条简短记录。用作弊工具或测试工具构建的副本,只能与构建版本相同(游戏版本和模组都相同)的玩家进行多人对战和合作对战,并会放弃其他任何对战。如果那是一场未计入排名的多人对战,它随后会让游戏崩溃而停止,Launcher 会以你的用户名向我们的服务器发送一条简短通知。RUSE Guard 绝不收集你的屏幕或按键,Studio 也不为此发送任何内容。让每位玩家都能进行公平的对战,是法律所说的正当利益,所以 RUSE Guard 不像 Bug Watch 那样是一个勾选框。你仍可随时反对,或要求查看或删除你的数据(见完整文本中的“你的权利”)。"
fa = "RUSE Guard مسابقه‌های چندنفره و همکاری را که با نسخه‌هایی بازی می‌شوند که برنامه‌های ما ساخته‌اند، عادلانه نگه می‌دارد. دیده‌بان آن، که در هر نسخهٔ مادشده هست، ممکن است در یک نبرد آزاد هم روی صفحهٔ شما اعلانی نشان دهد، مثلاً وقتی پول یک طرف ناگهان بالا می‌پرد؛ چیزی را تغییر نمی‌دهد و چیزی نمی‌فرستد. در مسابقهٔ چندنفره یا همکاری‌ای که Launcher شروع کرده باشد، نام برنامه‌هایی را که روی رایانهٔ شما اجرا می‌شوند با فهرست ابزارهای تقلب شناخته‌شده‌اش مقایسه می‌کند؛ این فهرست داخل خود برنامه می‌آید و می‌توانید آن را بخوانید. اگر یکی از برنامه‌های فهرست در حال اجرا باشد، Launcher یک گزارش کوتاه دربارهٔ آن را با نام کاربری شما برای سرور ما می‌فرستد. نسخه‌ای که با ابزار تقلب یا آزمایش ساخته شده باشد فقط با بازیکنانی چندنفره و همکاری بازی می‌کند که همان بیلد را دارند (همان نسخهٔ بازی و همان مادها)، و از هر مسابقهٔ دیگری کنار می‌کشد. اگر آن مسابقه چندنفره و بدون رتبه بود، پس از آن بازی را با خرابی (کرش) متوقف می‌کند و Launcher یک یادداشت کوتاه با نام کاربری شما برای سرور ما می‌فرستد. RUSE Guard هرگز صفحه یا کلیدهای فشرده‌شدهٔ شما را جمع نمی‌کند و Studio برای آن چیزی نمی‌فرستد. مسابقه‌های عادلانه برای همهٔ بازیکنان همان چیزی است که قانون «منفعت مشروع» می‌نامد، پس RUSE Guard مثل Bug Watch یک تیک نیست. باز هم می‌توانید هر زمان اعتراض کنید، یا بخواهید داده‌هایتان را ببینید یا پاک شوند (در متن کامل «حقوق شما» را ببینید)."


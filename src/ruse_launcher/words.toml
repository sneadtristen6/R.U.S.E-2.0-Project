1. Cosa copre questo testo, e con chi è l'accordo
Questi termini riguardano RUSE Studio e RUSE Launcher così come li pubblichiamo, e i nostri servizi online: l'elenco delle mod, il server RUSE Guard, il server Bug Watch (e il repository GitHub privato a cui pubblica note, quando è attivato) e il server di accesso con Steam. Questo accordo è tra te e sneadtristen6, che gestisce il progetto R.U.S.E. 2.0 e vive negli Stati Uniti. \"Noi\" e \"ci\" indicano lui e i volontari che lo aiutano.

2. Chi siamo, e chi non siamo
R.U.S.E. è un gioco sviluppato e pubblicato da Eugen Systems. Ti serve la tua copia. R.U.S.E. 2.0 è un progetto gratuito di fan. Non è creato, approvato o supportato da Eugen Systems. Non è una nuova versione del gioco, e Valve non lo sponsorizza né lo approva. R.U.S.E. e i file del gioco appartengono ai loro proprietari. Steam e il logo di Steam sono marchi di Valve Corporation.

3. La tua copia del gioco, e le mod
- Le app funzionano solo con una copia di R.U.S.E. che possiedi. Non includono alcun file del gioco e non li caricano mai.
- Per giocare con le mod, le app costruiscono sul tuo PC una copia moddata separata del gioco. In alcuni casi i dati del gioco possono essere cambiati, ma ciò avviene con la tua copia del gioco: quella copia moddata. Le mod ne cambiano i dati, e alcune ne cambiano gli script. Le nostre app aggiungono gli script di RUSE Guard, e alcune piccole protezioni proprie, agli script del gioco in ogni copia moddata; le protezioni intervengono solo dove il gioco altrimenti si fermerebbe con un errore. E alcuni insiemi di mod hanno bisogno di una piccola patch del gioco al file del programma di quella copia, che le app scaricano dalla nostra pagina GitHub.
- Le app non mettono mai nulla dentro il gioco mentre è in esecuzione. Vedono soltanto se è in esecuzione e da dove, e lo strumento di risoluzione dei problemi può chiudere un gioco rimasto in esecuzione da una copia moddata quando premi la sua correzione.
- Il gioco ha un suo reporter di crash, fatto dal creatore del gioco. Quando il gioco va in crash, sia che si tratti del tuo gioco installato o di una copia moddata, quel reporter può inviare il proprio rapporto di crash al creatore del gioco. È del gioco, non nostro: le nostre app non inviano mai i suoi rapporti, e non lo attivano né lo spengono.
- Le nostre app non cambiano mai il tuo gioco installato, a meno che tu chieda al Launcher o allo Studio di ripristinarlo dal suo backup pulito. Un ripristino rimette a posto i file del gioco, e sposta da parte i file che erano stati aggiunti e le versioni che sostituisce.
- Le mod fatte da altri appartengono ai loro autori, secondo i termini che hanno scelto. Le mod che cambiano gli script del gioco sono segnalate, e il Launcher aspetta che tu metta la spunta a \"Mi fido dell'autore di questo mod\" per ciascuna, e di nuovo per ogni sua nuova versione.

4. I tuoi diritti secondo la GPL, le licenze che usiamo, e il riconoscimento del lavoro altrui
- RUSE Studio e RUSE Launcher sono software libero sotto la GNU General Public License, versione 3 (GPL v3). Niente in questo accordo limita ciò che la GPL ti permette di fare: puoi eseguire, studiare, modificare e condividere il codice delle app secondo la GPL, che tu accetti o no questo accordo. Le app così come le pubblichiamo ti chiedono di accettarlo prima di usarle; è così che funzionano, non un limite ai tuoi diritti GPL. Questo accordo riguarda il loro uso, con RUSE Guard, e i nostri servizi online. Se condividi le app, o una versione modificata, mantienila sotto la GPL v3, conserva gli avvisi di copyright e i riconoscimenti, e offri il suo codice sorgente. Una versione modificata non è le app così come le pubblichiamo; questo accordo e il nostro supporto non la riguardano.
- Lavoro di altri dentro le nostre app: il motore RUSE Mod Manager di LittleGroove (GPL v3), il lavoro di ProLution e il progetto di RUSE Guard di DomesticNukes. Ognuno è riconosciuto sulla pagina del nostro progetto su GitHub.
- Le librerie e i modelli 3D che vengono con le app, e i set di movimenti, le unità d'epoca, le texture e le foto aeree che possono scaricare per te, sono elencati con i loro autori e le loro licenze in THIRD_PARTY_NOTICES, un file che viene con le app; le Impostazioni lo mostrano, sotto Termini, crediti e licenze. Anche il suono del motore dell'intro è elencato lì. Le unità d'epoca di una mod sono riconosciute anche nel file dei crediti della mod stessa. Le opere sotto la licenza CC BY (una licenza Creative Commons) possono essere riutilizzate solo citando i loro autori: se ne riutilizzi una nella tua mod, cita l'autore allo stesso modo e conserva il link alla sua licenza. Le opere sotto CC0 non richiedono riconoscimento, ma le citiamo comunque, e ti chiediamo di farlo anche tu.

5. Solo copie possedute
Il progetto supporta R.U.S.E. solo quando lo possiedi. Quando le app si avviano, e prima che un gioco moddato parta, controllano nella cartella del gioco che ci sia una copia installata tramite Steam: il registro dell'installazione di Steam, il file firmato di Steam stesso, e nessun file che faccia funzionare il gioco senza Steam. È un controllo nostro, non di Steam né di Eugen Systems, e non prova chi possiede il gioco. Per questo controllo non viene inviato nulla.
Se la tua copia non può essere confermata (una copia in scatola di prima che R.U.S.E. fosse su Steam, o un controllo che ha sbagliato), una finestra ti mostra un codice cartella. Viene creato sul tuo PC da un ID della tua installazione di Windows (o Linux) oppure, in mancanza, dall'ID della tua scheda di rete, e dal file principale del gioco. È a senso unico: non si può trasformare di nuovo in quegli ID. Lascia il tuo PC solo se lo incolli da qualche parte, o premi \"Apri un ticket su GitHub\", che apre nel tuo browser la pagina dei ticket di GitHub con il codice già nell'indirizzo della pagina. Non viene pubblicato nulla finché non lo pubblichi tu, e i ticket di GitHub sono pubblici. Puoi invece inviare il codice a sneadtristen6 in un messaggio privato su Discord. Ti rimandiamo un codice di sblocco che funziona solo su quel PC, con quella versione del file principale del gioco. Usiamo il tuo codice cartella solo per sbloccare la tua copia, perché lo hai chiesto, e non conserviamo alcuna traccia dei codici cartella oltre al tuo ticket o messaggio.

6. RUSE Guard: il nostro anti-cheat (obbligatorio)
Perché: per fermare i trucchi nelle partite multigiocatore e cooperative di R.U.S.E. giocate con copie costruite dalle nostre app. Le mod possono cambiare il modo in cui il gioco si gioca. Così ogni copia le cui mod cambiano il gioco riceve un codice partita che confronti con le persone con cui giochi. Una copia costruita con un trucco o uno strumento di test controlla che ogni giocatore della partita abbia la stessa build, e abbandona la partita se non è così. Nelle partite multigiocatore e cooperative, RUSE Guard cerca anche strumenti di trucco noti in esecuzione sul tuo PC. E il sorvegliante di ogni copia mostra sullo schermo quando una partita vede un ordine di generazione o un improvviso salto nei soldi di una fazione.
Perché è obbligatorio: RUSE Guard è obbligatorio per usare le nostre app. R.U.S.E. non ha un anti-cheat efficace, ed è per questo che RUSE Guard serve: aiuta a tenere i trucchi fuori dal multigiocatore, e le partite leali contano per noi e per ogni giocatore che incontri. Ci basiamo su ciò che la legge sulla protezione dei dati chiama un \"legittimo interesse\": partite leali per ogni giocatore, che non richiede il tuo permesso finché la tua privacy non prevale su di esso (sezione 11). Per questo non è una casella da spuntare come Bug Watch: lo Studio e il Launcher così come li pubblichiamo lo includono sempre. Puoi comunque opporti in qualsiasi momento (sezione 11).
- Dove agisce: RUSE Guard è in ogni copia moddata che le app costruiscono, e anche l'Originale del Launcher costruisce una copia così, senza mod (sezione 10). Il suo blocco e il suo controllo dei programmi agiscono solo nelle partite multigiocatore e cooperative, e così farebbero le sue registrazioni delle partite, una volta avviate (più sotto). Il suo sorvegliante, anch'esso in ogni copia moddata, osserva le partite multigiocatore, cooperative e le schermaglie contro il computer: può mostrare un avviso sul tuo schermo quando i soldi di una fazione salgono di 400 o più in una volta, o quando un'unità viene creata da un ordine di generazione. In una partita multigiocatore, può mostrarlo lo schermo di ogni giocatore. Il sorvegliante non cambia nulla nella partita e non invia nulla. Solo il Launcher invia qualcosa per RUSE Guard; lo Studio non lo fa mai, e il suo Prova in gioco non esegue alcun controllo dei programmi.
- L'elenco: l'elenco di RUSE Guard degli strumenti di trucco noti si trova dentro l'app, come un semplice file che puoi leggere, e cambia solo con un aggiornamento dell'app. Per esso non viene scaricato nulla.
- Il controllo dei programmi: in una partita multigiocatore o cooperativa avviata dal Launcher, RUSE Guard guarda ogni 30 secondi i nomi dei programmi in esecuzione sul tuo PC, e conserva solo i nomi che sono nel suo elenco. Per sapere quando una partita di questo tipo è in corso, il Launcher legge l'output di errore del gioco mentre il gioco è in esecuzione: conserva solo le brevi righe di RUSE Guard che dicono che una partita è in corso o è finita, e scarta ogni altra riga appena la legge, senza mai conservarla né inviarla (quell'output può contenere anche righe di Steam, una delle quali con il numero del tuo account Steam). Se il gioco non dice che una partita è finita, il controllo si ferma due minuti dopo l'ultima volta che il gioco ha detto che era in corso. Se durante una partita era in esecuzione un programma dell'elenco, dopo il gioco il Launcher invia al nostro server una breve registrazione: il tuo nome utente e la tua chiave RUSE Guard, quando la partita è iniziata e finita, se era multigiocatore o cooperativa, e i nomi dei programmi dell'elenco trovati. Non entra nient'altro: nessun replay, nessun file e nient'altro sulla partita. Se non era in esecuzione alcun programma dell'elenco, non viene inviato nulla.
- Il codice partita: per una copia moddata le cui mod cambiano il modo in cui il gioco si gioca, il Launcher mostra un codice partita. Rappresenta la versione del gioco della copia, le sue mod con le loro versioni e ciò che cambiano nel modo in cui il gioco si gioca. Confronti i codici partita con le persone con cui giochi. Oggi non li riceviamo; una registrazione della partita (più sotto) li porterebbe.
- Copie costruite con un trucco o uno strumento di test: una copia così gioca in multigiocatore e in cooperativa solo con giocatori la cui build è la stessa (la stessa versione del gioco e le stesse mod, nelle stesse versioni). Circa un secondo dopo l'inizio di ogni partita di questo tipo, comunica al gioco di ogni giocatore un breve codice della sua build (il suo codice di build), fatto dalla versione del gioco, dalle mod con le loro versioni nel loro ordine e da ciò che cambiano nel modo in cui il gioco si gioca. Non contiene alcun nome né account. Se ogni giocatore ha la stessa build, la partita è fatta per proseguire; nessuno ha ancora giocato una partita così con due persone. Se non è così, abbandona la partita dopo pochi secondi.
  In una partita multigiocatore non classificata, poi ferma apposta il gioco nella schermata di fine di quella partita: il gioco va in crash e torna al desktop. Il reporter di crash del gioco può allora inviare il proprio rapporto al creatore del gioco, e quel rapporto contiene la riga di RUSE Guard che dice che una copia con trucchi è stata fermata. Nelle partite cooperative e classificate abbandona soltanto la partita. Quando il Launcher ha avviato il gioco ed è ancora aperto quando il gioco si ferma, prende solo la riga di RUSE Guard dal rapporto di crash del gioco sul tuo PC e invia al nostro server una breve nota che una copia con trucchi è stata fermata, con il tuo nome utente e la tua chiave RUSE Guard, insieme al momento in cui il rapporto di crash è stato scritto e a quello in cui la nota è stata fatta. La riga dice solo il tipo di partita e il numero della tua fazione in essa; ogni ID Steam, numero lungo o percorso ne viene tolto. Le nostre app non inviano mai il rapporto di crash in sé. La nota non apre alcuna revisione e non decide nulla; è elencata perché sneadtristen6 la veda. Non viene inviata alcuna nota se il Launcher è stato chiuso prima che il gioco si fermasse, o se il gioco è stato avviato dallo Studio o a mano. Su Linux e Steam Deck, non si sa ancora se la nota venga inviata.
  Le copie oneste non vengono mai fermate.
- La tua chiave RUSE Guard: la prima volta che il Launcher crea una registrazione RUSE Guard sul tuo PC, vi crea una chiave casuale. Un codice fatto da questa chiave (la sua metà pubblica) accompagna ogni registrazione, così possiamo distinguere le tue registrazioni da quelle di qualcuno con lo stesso nome utente, e controllare che non siano state modificate. Non dice nient'altro su di te. Le Impostazioni mostrano un breve codice fatto da essa, \"Il tuo codice RUSE Guard\": invialo con una richiesta sulla privacy, e potremo trovare le tue registrazioni RUSE Guard. Per questo non viene inviato nient'altro.
- Non ancora attive: le registrazioni delle partite. Hanno bisogno di una registrazione della partita che il gioco oggi non può scrivere. Prima che inizino, aggiorneremo questo testo, e le app te lo mostreranno di nuovo. Quando inizieranno, una registrazione della partita porterà: il tuo nome utente e la tua chiave RUSE Guard; la tua fazione; i codici della tua copia; controlli dei file del gioco che la tua copia ha cambiato, e controlli regolari che il gioco di ogni giocatore resti lo stesso; le tue mod con i loro controlli; quali comandi di script le tue mod collegano ai tasti (mai cosa premi); per la copia di test di uno sviluppatore, la chiave dello sviluppatore; i nomi di eventuali strumenti di trucco dell'elenco trovati in esecuzione; quando la partita è iniziata e finita; e il replay più recente salvato sul tuo PC durante o subito dopo la partita, con il suo nome di file. Un replay contiene ogni ordine dato da ogni giocatore nella partita, e il suo nome di file e il suo contenuto possono includere i nomi in gioco tuoi e di altri giocatori.
- Cosa non fa mai: non raccoglie mai il tuo schermo né i tasti che premi, non guarda mai dentro altri programmi mentre sono in esecuzione, e non ci invia mai i tuoi file, a parte il replay che una registrazione della partita porterebbe. Dei rapporti di crash del gioco legge solo la propria riga su una copia con trucchi che ha fermato (sopra), sul tuo PC.
- Copie di test degli sviluppatori: le app sono fatte per far entrare in una partita la copia di test di uno sviluppatore con una chiave speciale da parte nostra, l'unico modo per aggirare la regola delle copie con trucchi. Nessuna funziona ancora: le app oggi non possono controllare una chiave del genere.
- Decisioni su di te: nessun ban automatico. Nessuna decisione sull'imbroglio è presa da una macchina da sola: sneadtristen6 guarda le prove, e il replay quando c'è, e decide. Claude di Anthropic, un assistente IA, lo aiuta a leggere le registrazioni di RUSE Guard, secondo i termini di Anthropic stessa; le decisioni sono sue. Una registrazione che nomina uno strumento di trucco dell'elenco apre una revisione per lui, che non decide nulla finché non decide lui. Puoi fare ricorso entro 30 giorni da una decisione (sezione 17); sneadtristen6 è l'unica persona che esamina i casi, quindi decide lui stesso anche sui ricorsi. L'unica regola automatica è la regola delle copie con trucchi qui sopra. Deriva dalla copia che hai scelto di costruire, e non tocca mai il tuo account Steam né il tuo gioco installato.
- Cosa significa oggi una decisione: se l'imbroglio è confermato, conserviamo quella decisione sotto il tuo nome utente nel nostro elenco di giocatori segnalati, e la usiamo quando guardiamo le partite successive. Poiché due giocatori possono avere lo stesso nome utente, guardiamo anche con quale chiave RUSE Guard sono arrivate le registrazioni. Il nostro server RUSE Guard conserva quell'elenco, ogni nome utente segnalato con la chiave RUSE Guard con cui sono arrivate per la prima volta le sue registrazioni, e dice solo al Launcher di quel giocatore che è segnalato. Le app oggi non agiscono su una segnalazione. Se una versione futura lo farà, per esempio per tenere le copie moddate di un giocatore segnalato fuori dal multigiocatore tramite R.U.S.E. 2.0, questo testo lo dirà prima. Se un ricorso viene accolto, la decisione è segnata come annullata, e il nome utente esce dall'elenco.
- Per quanto tempo le registrazioni sono conservate, e i tuoi diritti: sezione 11.

7. Bug Watch: aiutaci a trovare e correggere i bug (facoltativo, consigliato)
Perché: per far funzionare meglio lo Studio e il Launcher, e per correggere i crash prima: invece di aspettare che qualcuno segnali un crash, lo vediamo noi, e vediamo cosa lo ha preceduto.
Su quale base: solo con il tuo OK (il tuo consenso, sezione 11). Resta spento finché non lo spunti. Salvare o cambiare il tuo nome utente non lo attiva né lo spegne mai. Spuntarlo non cambia nient'altro nelle app, tranne ciò che il Launcher ti dice dopo il crash di un gioco (più sotto). Quando le app mostrano di nuovo questi termini dopo una modifica: se Bug Watch è attivo, la sua casella chiede \"Lasciare Bug Watch attivo?\", spuntata; lascia la spunta per tenerlo attivo, oppure toglila per spegnerlo. Se è spento, la casella di Bug Watch ritorna, senza spunta.
Finché è attivo, lo Studio e il Launcher inviano al nostro server:
- una volta al giorno, i conteggi di ogni giorno concluso:
  - l'app e la sua versione; il giorno; se usi Windows 10 o 11; la lingua dell'app; la versione del gioco; se RUSE Guard è integrato; quale versione di questi termini hai accettato;
  - quanto spesso è stata usata ogni parte dell'app e quanto sono durate le operazioni; cosa è andato storto e dove (solo nel nostro codice; quando lo script di una schermata dello Studio fallisce, il nome della schermata e il tipo di errore, mai il suo testo, il suo file o la sua riga); per ogni operazione lunga, come la costruzione di una mod, quante volte è finita o fallita, e in quante costruzioni sono stati trovati errori nelle mod;
  - un elenco dei fallimenti di quel giorno, al massimo 20, ciascuno con il suo codice (quale punto del nostro codice), fino a dove è arrivato un Gioca o una Prova in gioco, la forma dell'insieme di mod (quante mod del nostro elenco, cartelle di mod e file di mod tuoi, come conteggi), e accanto solo numeri che non nominano nessuno: il numero di errore di Windows (come disco pieno), la risposta del server web (come 404), il numero di uscita del gioco, un conteggio e un secondo codice;
  - quanti aggiornamenti sono stati offerti, installati o falliti; quante volte l'app è andata in crash; quali controlli della risoluzione dei problemi hanno trovato un problema;
  - quali mod del nostro elenco avevi attive; quanti minuti hai giocato in tutto, e quanti con ciascuna di quelle mod;
  - quante mod tue avevi, e che tipo di cose contengono, come unità, mappe, missioni o script (contate per tipo, mai nominate, e mai le loro parole, percorsi o file);
- subito, quando un'app va in crash: il tipo di errore e dove nel nostro codice;
- subito, dopo il crash di un gioco avviato dall'app, dettagli tecnici su dove e come è andato in crash:
  - il codice di errore del gioco; il nome del file in cui si è fermato (può essere una parte di Windows, un driver, o un altro programma caricato nel gioco, come un overlay), il punto in cui il gioco si è fermato, e fino a 16 punti del gioco che hanno portato lì;
  - per un errore di memoria, cosa il gioco stava cercando di fare (leggere, scrivere o eseguire) e il punto in memoria;
  - per un errore di script, il testo di errore del gioco, con i percorsi su un disco ridotti ai nomi dei file, il nome della tua cartella utente nascosto (i nomi delle cartelle al suo interno possono restare), e i numeri degli account Steam e altri numeri lunghi tolti (i nomi degli script del gioco restano); quanti errori precedenti il gioco aveva saltato; e la mappa (una delle mappe del gioco con il suo nome, la mappa di una mod solo come \"una mappa di una mod\");
  - l'unità che il gioco stava creando, quando le app possono leggerla dal rapporto di crash del gioco (una delle unità del gioco con il suo numero, l'unità di una mod solo come \"un'unità di una mod\");
  - quali mod erano attive, che tipo di cose contengono le tue mod (contate per tipo), e quale versione di questi termini hai accettato.
Bug Watch usa solo i rapporti di crash del gioco. Del rapporto di un altro programma, legge solo i nomi dei file che elenca, per capire che non è del gioco; non ne viene inviato nulla.
Ogni invio porta il tuo nome utente e il tuo ID di installazione, un codice casuale creato sul tuo PC quando hai scelto per la prima volta il tuo nome utente, che tu spunti Bug Watch o no. Il tuo codice di segnalazione, che le Impostazioni mostrano finché Bug Watch è attivo, sono i primi 8 caratteri del tuo ID di installazione.
Le nostre app non inviano mai i tuoi file né i file dei rapporti di crash del gioco. Bug Watch non invia alcun numero di account Steam. (Il reporter di crash del gioco può inviare il proprio rapporto al creatore del gioco: sezione 3.) Il testo di errore del gioco può contenere nomi del gioco o degli script di una mod. Per favore, non usare il tuo nome vero come nome utente (sezione 9).
Crash che conosciamo: con Bug Watch attivo, se il gioco va in crash in uno dei modi che conosciamo, il Launcher ti dice quale unità il gioco stava creando e perché, nella tua lingua. Quella spiegazione viene mostrata solo a te, mai inviata; il rapporto di Bug Watch porta l'unità solo come indicato sopra (un numero, o \"un'unità di una mod\"). Per conoscere quei crash, le app scaricano il nostro elenco dal nostro server Bug Watch quando un gioco si avvia, a meno che l'elenco sul tuo PC abbia meno di un giorno, e ancora una volta a un crash se non c'è un elenco utilizzabile. Lo scaricano solo mentre Bug Watch è attivo, lo conservano sul tuo PC, lo usano solo se porta la nostra firma, e controllano il tuo rapporto di crash rispetto a esso sul tuo PC. Il download non porta nulla su di te. Senza l'elenco (per esempio la prima volta, o senza internet), il Launcher ti dice comunque che il gioco è andato in crash, ma non l'unità né il motivo. Togliere la spunta a Bug Watch elimina l'elenco dal tuo PC.
Con Bug Watch acceso o spento: se un gioco avviato dal Launcher va in crash, il Launcher ti mostra un breve codice di crash, creato sul tuo PC da dove il gioco si è fermato. Non viene inviato da nessuna parte. Un pulsante \"Copia il codice\" lo copia. Se vuoi aiuto, invia il codice e uno screenshot del messaggio a XUL su Discord (XUL6x3) o su GitHub, e lo cerchiamo nel nostro elenco. Il codice dice solo dove il gioco si è fermato.
Le Impostazioni ti mostrano i conteggi di oggi parola per parola, come verrebbero inviati, e i nomi dei rapporti in attesa di partire. I rapporti che non possono essere inviati aspettano sul tuo PC fino a 30 giorni, poi vengono scartati. Mentre un gioco avviato dall'app è in esecuzione, Bug Watch tiene anche una piccola nota su di esso sul tuo PC, così che al prossimo avvio l'app possa capire se il gioco si è bloccato: quando è partito e quando è stato visto in esecuzione l'ultima volta, le sue mod (le nostre con nome e versione, le altre solo come numero) e dove sono installati la copia e il gioco (una cartella di Windows può contenere il tuo nome utente di Windows). Non viene mai inviata, e viene eliminata dopo 30 giorni, o subito quando togli la spunta a Bug Watch.
Chi lo vede: i nostri sviluppatori. È conservato per noi da Cloudflare sul nostro server Bug Watch. Quando è attivato, il nostro server pubblica anche note sui problemi che seguiamo in un repository GitHub privato, uno spazio su GitHub che solo i nostri sviluppatori possono aprire. Le note non contengono mai un nome utente né un codice di segnalazione. I nostri sviluppatori usano anche Claude di Anthropic, un assistente IA, per aiutare a leggere alcuni rapporti di crash di Bug Watch, secondo i termini di Anthropic stessa.
Per quanto tempo: ogni rapporto viene eliminato dal nostro server alla pulizia giornaliera dopo che è lì da 7 giorni, quindi 7-8 giorni dopo che arriva. I nostri sviluppatori possono segnare il rapporto di un crash molto grave per tenerlo mentre correggono quel crash; un rapporto segnato resta finché non tolgono il segno, il giorno in cui quel crash è corretto, e poi se ne va alla pulizia giornaliera successiva. Ciò che resta dopo, senza nome utente, ID di installazione né codice di segnalazione: i totali giornalieri per ogni versione dell'app (come \"12 costruzioni di mod fallite sulla versione 0.9.9 quel giorno\") e il giorno in cui ogni versione e ogni tipo di errore sono stati visti per la prima volta, senza limite di tempo; e le note del nostro server sui problemi che trova (quale parte di un'app, quale mod del nostro elenco, dove è avvenuto un crash e quanto spesso), fino a 3 giorni dopo che chiudiamo quel problema. Per i primi 7 giorni, in un giorno in cui una sola persona ha usato una versione, i suoi totali sono i conteggi di quella persona; dopo, una versione o una mod del nostro elenco che meno di 3 installazioni hanno usato quel giorno viene conservata solo come \"(other)\". Le note su GitHub restano finché non le eliminiamo. Cloudflare conserva uno storico dei nostri database per 7 giorni, quindi ciò che eliminiamo resta in quello storico per fino a 7 giorni in più. Copie sul computer di sneadtristen6: sezione 11, \"Dove viene conservato\".
Togli la spunta quando vuoi nelle Impostazioni (o nella casella di Bug Watch quando le app mostrano questi termini). Da quel momento non viene più contato né inviato nulla, e le app eliminano i conteggi di Bug Watch e i rapporti in attesa di partire. Il tuo nome utente e il tuo ID di installazione restano sul tuo PC, perché RUSE Guard usa il tuo nome utente. Niente di ciò che è stato creato prima che togliessi la spunta viene inviato più tardi, anche se la rimetti. Togliere la spunta non dice nulla al nostro server: ciò che vi è già arrivato viene eliminato come sopra. Per farlo eliminare prima, inviaci per e-mail il tuo codice di segnalazione (le Impostazioni lo mostrano solo mentre Bug Watch è attivo, quindi annotalo prima di togliere la spunta), o il tuo nome utente se non hai il codice: troviamo i rapporti della tua installazione con esso e li eliminiamo. I totali e le note qui sopra restano. Togliere la spunta non annulla ciò che è stato inviato prima.

8. Accesso con Steam (facoltativo)
Perché: per confermare che possiedi R.U.S.E., per il gioco online, RUSE Guard e i download di contenuti più avanti. Per ora non serve a nulla.
Su quale base: lo chiedi tu (sezione 11). Le app possono offrirlo quando si avviano, e le Impostazioni del Launcher lo aprono quando vuoi.
- Accedi sulla pagina di Steam nel tuo browser, a un indirizzo che l'app crea da sola. Non vediamo mai la tua password.
- Steam poi comunica al nostro server il tuo ID Steam. Il nostro server chiede a Steam se quell'account possiede R.U.S.E. (funziona solo se i dettagli di gioco del tuo Steam sono pubblici), usa la risposta, e non conserva l'ID. Se lo possiedi, il nostro server dà al tuo PC un pass (un codice che mostra che il controllo è riuscito), valido 30 giorni.
- Cosa conserva il nostro server: un codice a senso unico creato dal tuo ID Steam con un segreto nostro, e quando il tuo pass è stato emesso e quando scade, fino a 30 giorni dopo la scadenza del tuo pass. Il codice di breve durata che la tua app usa per ritirare il pass (il codice di accesso) è conservato solo in forma cifrata; scade dopo 10 minuti e viene eliminato quando l'app lo ritira, o entro circa un'ora dopo la scadenza. I numeri monouso di accesso di Steam impediscono che un accesso venga riprodotto; sono conservati per un giorno, anche quando un accesso fallisce, poi eliminati entro circa un'ora. Il nostro codice non conserva mai il tuo indirizzo IP.
- Dove: i database dei nostri server sono conservati da Cloudflare nel Nord America orientale.
- Cosa conserva il tuo PC: il pass, nelle impostazioni delle app, finché non esci in Impostazioni, il che lo elimina. Anche un pass scaduto resta fino ad allora.
- Se i dettagli di gioco del tuo Steam sono privati, Steam non può dircelo. Imposta Dettagli del gioco su Pubblico per un minuto, poi riprova.
- R.U.S.E. 2.0 non è affiliato a Valve né approvato da Valve. Valve tratta il tuo accesso secondo la propria informativa sulla privacy.

9. Il tuo nome utente
Perché: per sapere di chi è un rapporto di crash o una registrazione di partita, e poter aiutare quella persona. Tutti ne scelgono uno al primo avvio, perché RUSE Guard è obbligatorio. Vengono aggiunti un # e quattro numeri casuali, come Nick#4821. Due giocatori possono comunque ritrovarsi con lo stesso, quindi guardiamo anche la tua chiave RUSE Guard o il tuo codice di segnalazione. Per favore, non usare il tuo nome vero, il tuo nome Steam né nient'altro che ti identifichi. Viene inviato solo con le tue registrazioni RUSE Guard e, se Bug Watch è attivo, i tuoi rapporti Bug Watch. Un solo nome utente vale per entrambe le app. Puoi cambiarlo nelle Impostazioni; cambiarlo non attiva né spegne mai Bug Watch. Le registrazioni già inviate tengono il vecchio finché non vengono eliminate. Per far eliminare il tuo nome utente e i dati sotto di esso, inviaci un'e-mail.

10. Il titolo e l'intro di R.U.S.E. 2.0 (facoltativi)
Le copie costruite dal Launcher e dallo Studio mostrano il titolo originale del gioco e il video del logo di Eugen. Se metti la spunta alla casella della prima schermata, o a \"Usa il titolo in oro e l'intro di R.U.S.E. 2.0\" sotto Il titolo del gioco nelle Impostazioni, quelle copie mostrano R.U.S.E. 2.0 in oro nel menu principale e nelle schermate di caricamento, e la nostra intro parte al posto del video del logo di Eugen quando il gioco si avvia. Il titolo in oro viene creato sul tuo PC dai file del tuo gioco, su un'immagine di una scena di battaglia che viene con le app. L'intro usa anche un suono di motore che viene con le app. Cambia solo la tua copia moddata, mai il tuo gioco installato, e puoi cambiarlo quando vuoi nelle Impostazioni. Nel Launcher, l'Originale costruisce una copia separata senza mod, con RUSE Guard dentro come ogni copia, e con il titolo che hai scelto.

11. Informativa sulla privacy
Questa informativa fa parte di questo accordo. Lo stesso testo è pubblico sulla nostra pagina GitHub, all'indirizzo https://github.com/sneadtristen6/R.U.S.E-2.0-Project/blob/main/PRIVACY.md, così chiunque può leggerlo, compresi i giocatori che non usano le nostre app. È entrata in vigore il 26 novembre 2026.

Chi è responsabile dei tuoi dati
R.U.S.E. 2.0 è gestito da una sola persona, sneadtristen6, che vive negli Stati Uniti. È lui a decidere cosa fanno le app e i nostri server con i tuoi dati, quindi secondo la legge sulla protezione dei dati (nell'UE e nel Regno Unito, il GDPR) è lui il responsabile: il \"titolare del trattamento\". E-mail, per le richieste sulla privacy: sneadtristen6@gmail.com. Puoi anche raggiungerlo sul nostro Discord o su GitHub; per qualsiasi cosa personale, usa l'e-mail o un messaggio privato, perché i ticket di GitHub e i canali di Discord possono essere letti da altri. Solo lui esamina le registrazioni di RUSE Guard e decide su di esse. Non abbiamo un rappresentante nell'UE né nel Regno Unito.

Cosa usiamo, perché, e su quale base
- RUSE Guard (sezione 6): per mantenere leali le partite multigiocatore e cooperative. Base: il nostro legittimo interesse, e quello degli altri giocatori, a partite leali (GDPR articolo 6(1)(f)), non il tuo consenso.
- Bug Watch (sezione 7), solo se lo spunti: per trovare e correggere crash e bug. Base: il tuo consenso (articolo 6(1)(a)).
- L'accesso con Steam (sezione 8), solo se lo usi: per confermare che possiedi R.U.S.E. Base: lo hai chiesto tu (articolo 6(1)(b)).
- Codici cartella e ticket di sblocco (sezione 5): per sbloccare la tua copia. Base: lo hai chiesto tu (articolo 6(1)(b)).
- Il tuo nome utente (sezione 9): per sapere di chi è una registrazione o un rapporto. Base: la stessa della registrazione RUSE Guard o del rapporto Bug Watch con cui viene inviato.
- Controlli degli aggiornamenti e download (sezione 12): per mantenere le app funzionanti e sicure, e darti ciò che chiedi. Base: il nostro legittimo interesse (articolo 6(1)(f)), e la tua richiesta quando premi un pulsante.
- Messaggi, ticket, e-mail e ricorsi che ci invii: per risponderti. Base: il nostro legittimo interesse a risponderti (articolo 6(1)(f)).
- Sostenitori su Patreon: Patreon gestisce il tuo pagamento secondo la propria informativa sulla privacy. Vediamo solo ciò che Patreon condivide con i creatori secondo quell'informativa, e pubblichiamo un nome di riconoscimento solo se lo invii con il tuo permesso. Base: darti il ringraziamento che hai scelto (articolo 6(1)(b)); un nome pubblico solo con il tuo permesso (articolo 6(1)(a)).
- Il tuo indirizzo IP: ogni server a cui si collega il tuo PC lo vede. Il codice dei nostri server non lo conserva mai; Cloudflare, che gestisce i nostri server, lo tratta per consegnare e proteggere ogni connessione, secondo la propria informativa sulla privacy, e la sua dashboard ci mostra quante richieste sono arrivate da ogni paese e città. Base: il nostro legittimo interesse a gestire e proteggere i nostri server (articolo 6(1)(f)).
Nessuna legge ti obbliga a darci qualcosa. Le app così come le pubblichiamo richiedono un nome utente e includono RUSE Guard; Bug Watch e l'accesso con Steam sono una tua scelta. Nessuna decisione sull'imbroglio è presa da una macchina da sola. L'unica regola automatica, la regola delle copie con trucchi nella sezione 6, agisce su una copia costruita con strumenti di trucco o di test, mai sul tuo account Steam.

Chi altro lo riceve
- Cloudflare, Inc. (USA), che gestisce i nostri tre server e ne conserva i database per noi, secondo i suoi termini sul trattamento dei dati.
- Valve, per l'accesso con Steam e il controllo del possesso (sezione 8).
- GitHub (Microsoft), che conserva i nostri file, ticket e discussioni, e, quando è attivato, il repository privato a cui il server di Bug Watch pubblica le sue note. Riceve anche ciò che il tuo browser invia quando apri una pagina che le app hanno compilato (sezione 12).
- Google, che gestisce l'indirizzo e-mail a cui scrivi.
- Discord, che trasporta i messaggi che ci invii lì.
- Anthropic, il cui assistente IA Claude ci aiuta a leggere alcuni rapporti di crash di Bug Watch e registrazioni di RUSE Guard, secondo i termini di Anthropic stessa.
- I giochi degli altri giocatori: il codice di build di una copia con trucchi o di test (sezione 6).
- Il pubblico: tutto ciò che pubblichi su GitHub o nei canali pubblici di Discord.
- Chiunque la legge ci obblighi a darlo.
A parte noi: quando il gioco va in crash, il reporter di crash del gioco può inviare il proprio rapporto al creatore del gioco (sezione 3). È del gioco, non nostro.
Non vendiamo né affittiamo i tuoi dati, e non li usiamo né li condividiamo per la pubblicità. Le app non contengono pubblicità né servizi esterni di analisi o tracciamento; Bug Watch è nostro, ed è una tua scelta.

Dove viene conservato
I database dei nostri server sono conservati da Cloudflare nel Nord America orientale; la rete di Cloudflare li serve da data center in tutto il mondo. Le registrazioni di RUSE Guard vengono raccolte per la revisione sul computer di sneadtristen6 negli Stati Uniti. Quando esaminiamo un problema, copie dei rapporti di Bug Watch possono trovarsi anche sul suo computer: una copia che appartiene a un bug che stiamo correggendo viene eliminata una volta corretto quel bug, e una copia che non mostra alcun bug viene eliminata dopo 7 giorni. sneadtristen6 si trova negli Stati Uniti, e Cloudflare è un'azienda statunitense, quindi i tuoi dati sono trattati negli Stati Uniti e ovunque Cloudflare operi.

Per quanto tempo li conserviamo
- Registrazioni di RUSE Guard: il nostro server RUSE Guard conserva ogni registrazione finché il nostro computer di revisione non la ritira, e mai più di 3 giorni dopo che è arrivata: poi viene eliminata, ritirata o no. Sul computer di revisione, le registrazioni di una partita vengono eliminate circa 48 ore dopo l'arrivo dell'ultima (alla sua successiva pulizia, che si esegue ogni volta che ritira registrazioni), a meno che sia aperta una revisione della partita. Una partita in revisione è conservata finché non viene decisa; se viene archiviata, viene poi eliminata. Se l'imbroglio è confermato, hai 30 giorni dalla decisione per fare ricorso: le prove sono conservate per quei 30 giorni, e se fai ricorso, finché il tuo ricorso non è deciso. Dopo di che le prove vengono eliminate, e solo la decisione viene conservata, finché si applica. Se un ricorso viene accolto, la decisione è segnata come annullata e non viene mai usata contro di te; chiedicelo, e elimineremo anche quella. La nota di arresto di una copia con trucchi non apre alcuna revisione: è elencata perché sneadtristen6 la veda, ed eliminata come qualsiasi registrazione.
- L'elenco del computer di revisione con nomi utente e chiavi RUSE Guard, con quando ciascuno è stato visto per la prima volta: conservato per ora senza limite di tempo; inviaci un'e-mail e cancelleremo il tuo.
- Registrazioni di RUSE Guard sul tuo PC: una in attesa di essere inviata resta finché non viene inviata; una che il nostro server ha rifiutato viene eliminata 30 giorni dopo che è stata messa da parte.
- Bug Watch: sezione 7.
- L'accesso con Steam: sezione 8.
- Ticket, messaggi ed e-mail: finché serve alla conversazione. I ticket di GitHub restano finché non li elimini tu o noi.
- Nomi di riconoscimento dei sostenitori: in ogni versione da quel momento in poi. Chiedi, e toglieremo il tuo dalle versioni future; le versioni già pubblicate non possono essere cambiate.
- Backup: Cloudflare conserva uno storico dei database dei nostri server per 7 giorni (sul nostro piano gratuito, come dice la documentazione di Cloudflare stessa), quindi ciò che eliminiamo resta in quello storico per fino a 7 giorni dopo che lo eliminiamo.

I tuoi diritti
Puoi chiederci una copia dei dati che conserviamo su di te; di correggerli; di eliminarli; di smettere di usarli mentre una questione su di essi viene chiarita; e i tuoi dati Bug Watch e il tuo nome utente in un file che puoi riutilizzare. Puoi ritirare il tuo consenso a Bug Watch in qualsiasi momento togliendo la spunta; ciò non annulla quello che è stato inviato prima.
Come: scrivi a sneadtristen6@gmail.com, o invia a sneadtristen6 un messaggio privato su Discord. Indicaci il tuo nome utente, il tuo codice di segnalazione se usi o hai usato Bug Watch (le Impostazioni lo mostrano solo mentre Bug Watch è attivo) e il tuo codice RUSE Guard (le Impostazioni lo mostrano, come \"Il tuo codice RUSE Guard\"); per l'accesso con Steam, il tuo ID Steam. I nostri server non chiedono il tuo nome vero, quindi senza questi dati potremmo non trovare i tuoi. Se non siamo sicuri che una richiesta sia tua, potremmo chiedere di più. Rispondiamo entro un mese, gratis; se una richiesta è complessa, possiamo impiegare fino a due mesi in più e ti diremo perché.
Se smetti di usare le app, puoi chiederci di eliminare le tue registrazioni RUSE Guard, e lo faremo. Se l'imbroglio è stato confermato sotto il tuo nome utente, conserviamo solo quella segnalazione e la decisione su cui si basa: il tuo nome utente, la partita, il verdetto, la sua data e la chiave RUSE Guard con cui è arrivata la segnalazione. Potremmo anche conservare ciò che serve a un caso di imbroglio ancora in revisione o in ricorso.
Reclami: puoi presentare reclamo all'autorità di protezione dei dati del luogo in cui vivi o lavori, o dove ritieni sia avvenuto il problema; in Francia è la CNIL (cnil.fr), nel Regno Unito l'ICO (ico.org.uk). Chiunque può rivolgersi prima a noi. Se sei nel Regno Unito, confermeremo di aver ricevuto il tuo reclamo entro 30 giorni.

IL TUO DIRITTO DI OPPOSIZIONE
Puoi opporti in qualsiasi momento, per motivi legati alla tua situazione particolare, all'uso dei tuoi dati per RUSE Guard. Scrivici. Se siamo d'accordo, eliminiamo le tue registrazioni RUSE Guard, a parte una segnalazione di imbroglio e la sua decisione (come sopra), e ti diciamo che RUSE Guard è obbligatorio per usare le nostre app: l'unico modo per non inviare nuove registrazioni è non usarle. Potremmo non essere d'accordo quando abbiamo motivi legittimi cogenti che prevalgono sui tuoi, come un caso di imbroglio ancora in revisione o in ricorso.

Altri giocatori
Oggi RUSE Guard non invia nulla sugli altri giocatori delle tue partite: né nomi né replay. Una copia con trucchi o di test comunica ai giochi degli altri giocatori solo un breve codice di build. Se una versione futura invierà registrazioni di partite o replay, che possono contenere i nomi in gioco di altri giocatori, questo testo lo dirà prima. Questa informativa è pubblica, quindi possono leggerla anche i giocatori che non usano le nostre app. Chiunque può chiederci cosa conserviamo sotto il suo nome in gioco, e i diritti qui sopra sono anche suoi.

Tracciamento
Le app non seguono ciò che fai su altri siti web o app, e non contengono reti pubblicitarie né altri tracker esterni. Le app non sono browser web, quindi non leggono il segnale \"Do Not Track\" di un browser; le tue scelte sono la spunta di Bug Watch e se usi l'accesso con Steam.

Sicurezza
Le app raggiungono i nostri server solo tramite connessioni cifrate, e installano un aggiornamento solo se porta la nostra firma (sezione 12). Creano da sole l'indirizzo della pagina di accesso di Steam. Il nostro server RUSE Guard dice solo al Launcher di un giocatore segnalato che è segnalato. Nessun sistema è perfettamente sicuro: se succede qualcosa che mette a rischio i tuoi dati, lo diremo sulla nostra pagina GitHub e sul nostro Discord, e lo comunicheremo alle autorità di protezione dei dati dove la legge lo richiede.

Cosa resta sul tuo PC
Le app conservano le loro impostazioni e i loro file di lavoro in una cartella chiamata RUSE Mod Platform, dentro la cartella AppData\\Local del tuo utente Windows:
- il tuo nome utente e il tuo ID di installazione, la tua chiave RUSE Guard, le tue scelte, il pass di Steam se hai effettuato l'accesso, e i codici di sblocco;
- l'elenco di Bug Watch dei crash del gioco noti, finché Bug Watch è attivo;
- i conteggi di Bug Watch non ancora inviati, e i rapporti in attesa di partire;
- le registrazioni RUSE Guard in attesa di essere inviate, e quelle che il nostro server ha rifiutato (eliminate 30 giorni dopo che sono state messe da parte);
- i registri di ciò che le app hanno fatto (che possono includere nomi di cartelle);
- i dati del browser della finestra stessa dell'app;
- i file scaricati (l'installer di un aggiornamento viene eliminato al successivo avvio dell'app dopo che è stato installato).
Per sapere se il gioco è ancora in esecuzione dalla tua copia moddata, le app guardano anche quali programmi sono in esecuzione e da dove (questo è a parte il controllo dei programmi di RUSE Guard nella sezione 6); questo resta sul tuo PC. Quando le app leggono i rapporti di crash del gioco (sezioni 6 e 7), lo fanno sul tuo PC e non li inviano mai; solo il reporter di crash del gioco può inviare il proprio rapporto al creatore del gioco (sezione 3). Niente in questa cartella viene inviato da nessuna parte se non come dicono le sezioni da 5 a 8 e 12. Quando disinstalli la seconda delle due app, il programma di disinstallazione ti chiede se eliminare anche questa cartella; la risposta parte su No. Un Sì la elimina, a parte eventuali mod, mappe, esportazioni o backup che una versione precedente vi aveva conservato. Finché l'altra app è ancora installata, non chiede nulla e non elimina nulla, perché entrambe le app usano questa cartella. Altrimenti, per rimuoverla, eliminala tu. Anche le tue mod, mappe, esportazioni e backup nella cartella RUSE 2.0 in Documents, la tua copia moddata e il backup pulito del tuo gioco restano finché non li elimini.

12. Aggiornamenti, e altri siti a cui le app si collegano
- Aggiornamenti: una volta accettati questi termini, entrambe le app chiedono a GitHub a ogni avvio se c'è una nuova versione; finché non accetti, non chiedono nulla. Se un aggiornamento è disponibile e la tua lingua non è l'inglese, le app recuperano da GitHub anche le sue note. Gli aggiornamenti facoltativi si installano quando premi Aggiorna ora. Un aggiornamento che segniamo come obbligatorio si scarica e si installa da solo quando l'app si avvia, senza chiedere, e Gioca e Prova in gioco aspettano finché non è installato. In ogni caso, un aggiornamento si installa solo se porta la nostra firma ed è esattamente il file che abbiamo firmato; altrimenti non si installa nulla, e l'app lo dice e ti rimanda al nostro Discord. Se il suo download fallisce tre volte, l'app smette di provare da sola e ti rimanda alla sua pagina di versione su GitHub; un aggiornamento obbligatorio continua comunque a far aspettare Gioca e Prova in gioco. La nostra chiave di firma non viene mai caricata. Al successivo avvio dopo un aggiornamento, l'app elimina l'installer di quell'aggiornamento. Se hai scaricato in passato unità d'epoca, lo Studio controlla anche all'avvio se ci sono versioni più recenti e le scarica da solo. Solo la versione più recente di ogni app riceve correzioni.
- Oltre ai nostri server, le app si collegano a questi siti. Ognuno vede il tuo indirizzo IP e ciò che viene richiesto, e può conservare registri secondo la propria informativa sulla privacy:

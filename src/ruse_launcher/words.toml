Toto oznámení je součástí této dohody. Stejný text je veřejný na naší stránce na GitHubu na https://github.com/sneadtristen6/R.U.S.E-2.0-Project/blob/main/PRIVACY.md, takže si ho může přečíst kdokoli, i hráči, kteří naše aplikace nepoužívají. Vstoupilo v platnost 26. listopadu 2026.

Kdo je odpovědný za vaše údaje
R.U.S.E. 2.0 vede jedna osoba, sneadtristen6, který žije ve Spojených státech. Rozhoduje o tom, co aplikace a naše servery dělají s vašimi údaji, takže podle zákona na ochranu údajů (v EU a ve Spojeném království GDPR) je odpovědný on: je „správcem“. E-mail pro žádosti o ochranu soukromí: sneadtristen6@gmail.com. Můžete ho zastihnout také na našem Discordu nebo GitHubu; pro cokoli osobního použijte e-mail nebo soukromou zprávu, protože tickety na GitHubu a kanály na Discordu mohou číst jiní. Záznamy RUSE Guard posuzuje a o nich rozhoduje jen on. V EU ani ve Spojeném království nemáme zástupce.

Co používáme, proč a na jakém základě
- RUSE Guard (oddíl 6): aby zápasy pro více hráčů a kooperativní zůstaly férové. Základ: náš oprávněný zájem a oprávněný zájem ostatních hráčů na férových zápasech (čl. 6 odst. 1 písm. f) GDPR), ne váš souhlas.
- Bug Watch (oddíl 7), jen pokud ho zaškrtnete: abychom našli a opravili pády a chyby. Základ: váš souhlas (čl. 6 odst. 1 písm. a)).
- Přihlášení přes Steam (oddíl 8), jen pokud ho použijete: aby se potvrdilo, že vlastníte R.U.S.E. Základ: vy o to požádáte (čl. 6 odst. 1 písm. b)).
- Kódy složek a odemykací tickety (oddíl 5): aby se odemkla vaše kopie. Základ: vy o to požádáte (čl. 6 odst. 1 písm. b)).
- Vaše uživatelské jméno (oddíl 9): abychom věděli, čí je záznam nebo hlášení. Základ: stejný jako u záznamu RUSE Guard nebo hlášení Bug Watch, s nímž se posílá.
- Kontroly aktualizací a stahování (oddíl 12): aby aplikace fungovaly a byly bezpečné a abychom vám dali, o co požádáte. Základ: náš oprávněný zájem (čl. 6 odst. 1 písm. f)) a vaše žádost, když stisknete tlačítko.
- Zprávy, tickety, e-maily a odvolání, které nám pošlete: abychom vám odpověděli. Základ: náš oprávněný zájem na tom, abychom vám odpověděli (čl. 6 odst. 1 písm. f)).
- Podporovatelé na Patreonu: Patreon zpracovává vaši platbu podle vlastních zásad ochrany soukromí. Vidíme jen to, co Patreon podle těchto zásad sdílí s tvůrci, a veřejné jméno pro poděkování zveřejníme, jen pokud nám ho pošlete se svým svolením. Základ: abychom vám dali poděkování, které jste si zvolili (čl. 6 odst. 1 písm. b)); veřejné jméno jen s vaším svolením (čl. 6 odst. 1 písm. a)).
- Vaše IP adresa: vidí ji každý server, ke kterému se váš PC připojuje. Kód našich serverů ji nikdy neukládá; Cloudflare, který naše servery provozuje, s ní nakládá, aby každé spojení doručil a ochránil, podle vlastních zásad ochrany soukromí, a jeho přehled nám ukazuje, kolik požadavků přišlo z které země a města. Základ: náš oprávněný zájem na provozu a ochraně našich serverů (čl. 6 odst. 1 písm. f)).
Žádný zákon nevyžaduje, abyste nám cokoli poskytli. Aplikace tak, jak je zveřejňujeme, potřebují uživatelské jméno a obsahují RUSE Guard; Bug Watch a přihlášení přes Steam jsou vaše volba. Žádné rozhodnutí o podvádění nedělá jen stroj. Jediné automatické pravidlo, pravidlo o podvodných kopiích v oddílu 6, působí na kopii sestavenou s podvodnými nebo testovacími nástroji, nikdy na váš účet Steam.


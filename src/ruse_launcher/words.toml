ger = "Diese Kopie wurde mit Cheats oder Testwerkzeugen erstellt ({why}). Sie spielt Mehrspieler- und Koop-Partien nur mit Spielern, deren Code derselbe ist wie Ihrer; jede andere Partie verlässt sie nach wenigen Sekunden."
ita = "Questa copia è stata creata con trucchi o strumenti di test ({why}). Gioca in multigiocatore e in cooperativa solo con giocatori il cui codice è uguale al tuo; abbandona ogni altra partita dopo pochi secondi."
spa = "Esta copia se creó con trucos o herramientas de prueba ({why}). Solo juega partidas multijugador y cooperativas con jugadores cuyo código sea igual al tuyo; abandona cualquier otra partida a los pocos segundos."
pol = "Ta kopia została utworzona z kodami lub narzędziami testowymi ({why}). Gra w meczach wieloosobowych i kooperacyjnych tylko z graczami, których kod dołączenia jest taki sam jak twój; każdy inny mecz opuszcza po kilku sekundach."
ru = "Эта копия создана с читами или тестовыми инструментами ({why}). Она играет сетевые и кооперативные матчи только с игроками, у которых тот же код, что и у вас; любой другой матч она покидает через несколько секунд."
cz = "Tato kopie byla vytvořena s cheaty nebo testovacími nástroji ({why}). Zápasy pro více hráčů a kooperaci hraje jen s hráči, kteří mají stejný kód jako vy; každý jiný zápas po několika sekundách opustí."
jpn = "このコピーはチートまたはテスト用ツールを含めて作成されました（{why}）。マルチプレイと協力プレイは、あなたと同じコードのプレイヤーとだけ対戦できます。それ以外の対戦からは数秒で退出します。"
sc = "这个副本包含作弊或测试工具（{why}）。它只能与代码和你相同的玩家进行多人和合作对局；其他对局会在几秒后退出。"
fa = "این نسخه با تقلب یا ابزار آزمایش ساخته شده است ({why}). فقط با بازیکنانی که کد پیوستنشان با کد شما یکی است در نبردهای چندنفره و همکاری بازی می‌کند؛ از هر نبرد دیگری پس از چند ثانیه بیرون می‌رود."


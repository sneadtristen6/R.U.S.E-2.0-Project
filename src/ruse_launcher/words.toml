[browse_help]
us = "These are the mods that work with the Launcher. Tick the ones you want and press Install: each file is checked against the list before it goes into your library. Then tick them in a mod set."
fr = "Voici les mods qui fonctionnent avec le Launcher. Cochez ceux que vous voulez et appuyez sur Installer : chaque fichier est vérifié par rapport à la liste avant d'entrer dans votre bibliothèque. Cochez-les ensuite dans un ensemble de mods."
ger = "Das sind die Mods, die mit dem Launcher funktionieren. Kreuzen Sie die gewünschten an und drücken Sie Installieren: Jede Datei wird mit der Liste abgeglichen, bevor sie in Ihre Bibliothek kommt. Danach kreuzen Sie sie in einem Mod-Set an."
ita = "Queste sono le mod che funzionano con il Launcher. Spunta quelle che vuoi e premi Installa: ogni file viene confrontato con l'elenco prima di entrare nella tua libreria. Poi spuntale in un insieme di mod."
spa = "Estos son los mods que funcionan con el Launcher. Marca los que quieras y pulsa Instalar: cada archivo se comprueba con la lista antes de entrar en tu biblioteca. Después márcalos en un conjunto de mods."
pol = "To mody, które działają z Launcherem. Zaznacz te, które chcesz, i naciśnij Zainstaluj: każdy plik jest sprawdzany z listą, zanim trafi do biblioteki. Potem zaznacz je w zestawie modów."
ru = "Это моды, которые работают с Launcher. Отметьте нужные и нажмите «Установить»: каждый файл сверяется со списком, прежде чем попасть в библиотеку. Потом отметьте их в наборе модов."
cz = "Toto jsou módy, které fungují s Launcherem. Zaškrtněte ty, které chcete, a stiskněte Nainstalovat: každý soubor se před vstupem do knihovny ověří podle seznamu. Pak je zaškrtněte v sadě módů."
jpn = "Launcherで動作するMODの一覧です。欲しいものにチェックを入れて「インストール」を押してください。各ファイルはライブラリに入る前にリストと照合されます。その後、MODセットでチェックしてください。"
sc = "这些是可在 Launcher 中使用的模组。勾选你想要的，然后点击“安装”：每个文件在进入你的库之前都会与列表核对。然后在模组组合中勾选它们。"


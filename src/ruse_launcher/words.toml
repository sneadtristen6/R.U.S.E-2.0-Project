[set_title_help]
us = "Off unless you tick it: your game keeps its own R.U.S.E. title and Eugen's logo video, Vanilla too. Ticked, the main menu and the loading screens say R.U.S.E. 2.0 in gold, with mods or without, Vanilla too, and our intro video plays in place of Eugen's logo video. The gold title is made on your PC from your own game's files, over a battle-scene picture that comes with the app; the intro also uses an engine sound that comes with the app. The next Play builds the copy your way."
fr = "Désactivé tant que vous ne le cochez pas : votre jeu garde son propre titre R.U.S.E. et la vidéo du logo d'Eugen, le Jeu d'origine aussi. Coché, le menu principal et les écrans de chargement affichent R.U.S.E. 2.0 en doré, avec ou sans mods, le Jeu d'origine aussi, et notre vidéo d'intro est lue à la place de la vidéo du logo d'Eugen. Le titre doré est fabriqué sur votre PC à partir des fichiers de votre propre jeu, sur une image de scène de bataille fournie avec l'application ; l'intro utilise aussi un bruit de moteur fourni avec l'application. Le prochain Jouer construit la copie selon votre choix."
ger = "Aus, bis du das Häkchen setzt: Dein Spiel behält seinen eigenen R.U.S.E.-Titel und das Logo-Video von Eugen, auch bei Original. Mit Häkchen sagen das Hauptmenü und die Ladebildschirme R.U.S.E. 2.0 in Gold, mit Mods oder ohne, auch bei Original, und unser Intro-Video läuft anstelle des Logo-Videos von Eugen. Der goldene Titel wird auf deinem PC aus den Dateien deines eigenen Spiels gemacht, über einem Schlachtszenenbild, das mit der App kommt; das Intro benutzt außerdem einen Motorsound, der mit der App kommt. Das nächste Spielen baut die Kopie nach deiner Wahl."
ita = "Spento finché non metti la spunta: il tuo gioco tiene il suo titolo R.U.S.E. originale e il video del logo di Eugen, anche l'Originale. Con la spunta, il menu principale e le schermate di caricamento dicono R.U.S.E. 2.0 in oro, con le mod o senza, anche l'Originale, e il nostro video introduttivo parte al posto del video del logo di Eugen. Il titolo in oro viene creato sul tuo PC dai file del tuo gioco, su un'immagine di una scena di battaglia che viene con l'app; l'intro usa anche un suono di motore che viene con l'app. Il prossimo Gioca costruisce la copia come hai scelto."
spa = "Está desactivado hasta que lo marques: tu juego conserva su propio título R.U.S.E. y el vídeo del logo de Eugen, también en Original. Marcado, el menú principal y las pantallas de carga dicen R.U.S.E. 2.0 en dorado, con mods o sin ellos, también en Original, y nuestro vídeo de introducción se reproduce en lugar del vídeo del logo de Eugen. El título dorado se hace en tu PC a partir de los archivos de tu propio juego, sobre una imagen de una escena de batalla que viene con la aplicación; la introducción también usa un sonido de motor que viene con la aplicación. El próximo Jugar construye la copia a tu manera."
pol = "Wyłączone, dopóki tego nie zaznaczysz: twoja gra zachowuje swój oryginalny tytuł R.U.S.E. i film z logo Eugen Systems, Oryginał też. Po zaznaczeniu menu główne i ekrany wczytywania pokazują R.U.S.E. 2.0 na złoto, z modami lub bez, Oryginał też, a nasz film wprowadzający odtwarza się zamiast filmu z logo Eugen Systems. Złoty tytuł powstaje na twoim PC z plików twojej własnej gry, na obrazie sceny bitwy dołączonym do aplikacji; film wprowadzający używa też dźwięku silnika dołączonego do aplikacji. Następne Graj zbuduje kopię według twojego wyboru."
ru = "Выключено, пока вы не поставите галочку: ваша игра сохраняет собственное название R.U.S.E. и видеозаставку с логотипом Eugen, в том числе Оригинал. Если поставить галочку, главное меню и экраны загрузки показывают R.U.S.E. 2.0 золотом, с модами или без, в том числе Оригинал, а наша заставка играет вместо видеозаставки с логотипом Eugen. Золотое название создаётся на вашем ПК из файлов вашей собственной игры поверх картины боевой сцены, которая идёт с приложением; в заставке также используется звук двигателя, который идёт с приложением. Следующая «Играть» соберёт копию по-вашему."
cz = "Vypnuto, dokud nezaškrtnete: vaše hra si ponechá svůj původní název R.U.S.E. a úvodní video s logem Eugen Systems, i Původní hra. Po zaškrtnutí hlavní menu a načítací obrazovky ukazují R.U.S.E. 2.0 zlatě, s módy i bez nich, i Původní hra, a naše úvodní video se přehraje místo videa s logem Eugen Systems. Zlatý název se vytváří na vašem PC ze souborů vaší vlastní hry, přes obrázek bitevní scény, který je součástí aplikace; intro používá také zvuk motoru, který je součástí aplikace. Další Hrát sestaví kopii podle vaší volby."
jpn = "チェックを入れるまではオフです。オフの間、あなたのゲームは本来の R.U.S.E. タイトルと Eugen Systems のロゴ動画のままで、オリジナル も同じです。チェックを入れると、MOD の有無にかかわらず、オリジナル も含めて、メインメニューとロード画面に金色の R.U.S.E. 2.0 が表示され、Eugen Systems のロゴ動画の代わりに私たちのイントロ動画が流れます。金色のタイトルは、あなたの PC 上で、あなた自身のゲームのファイルから、アプリに付属する戦闘シーンの画像の上に作られます。イントロには、アプリに付属するエンジン音も使われます。次の「プレイ」で、選んだとおりにコピーがビルドされます。"
sc = "在你勾选之前它是关闭的:你的游戏保留它自己的 R.U.S.E. 标题和 Eugen 的标志视频,原版也一样。勾选后,无论是否使用模组,原版也一样,主菜单和载入画面都显示金色的 R.U.S.E. 2.0,并且我们的片头视频会代替 Eugen 的标志视频播放。金色标题由你的电脑根据你自己游戏的文件制作,铺在一张随应用提供的战斗场景图片之上;片头还使用了一个随应用提供的引擎声音。下一次“开始游戏”会按你的选择构建副本。"
fa = "تا تیکش را نزنید خاموش است: بازی شما عنوان R.U.S.E. خودش و ویدیوی لوگوی Eugen را نگه می‌دارد، «بازی اصلی» هم. با تیک، منوی اصلی و صفحه‌های بارگذاری R.U.S.E. 2.0 را به رنگ طلایی می‌گویند، با ماد یا بدون ماد، «بازی اصلی» هم، و ویدیوی آغازین ما به جای ویدیوی لوگوی Eugen پخش می‌شود. عنوان طلایی روی رایانهٔ شما از فایل‌های بازی خودتان ساخته می‌شود، روی یک تصویر صحنهٔ نبرد که همراه برنامه می‌آید؛ ویدیوی آغازین یک صدای موتور هم به کار می‌برد که همراه برنامه می‌آید. «بازی» بعدی نسخه را به شیوهٔ شما می‌سازد."


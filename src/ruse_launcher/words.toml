fr = "Triche ou outil de test : {why}. Une copie moddée qui l'inclut ne joue en multijoueur et en coop qu'avec des joueurs qui ont les mêmes mods, et quitte toute autre partie."
ger = "Cheat oder Testwerkzeug: {why}. Eine gemoddete Kopie damit spielt Mehrspieler- und Koop-Partien nur mit Spielern, die dieselben Mods haben, und verlässt jede andere Partie."
ita = "Trucco o strumento di test: {why}. Una copia moddata che lo include gioca in multigiocatore e in cooperativa solo con giocatori che hanno gli stessi mod, e abbandona ogni altra partita."
spa = "Truco o herramienta de prueba: {why}. Una copia con mods que lo incluya solo juega partidas multijugador y cooperativas con jugadores que tengan los mismos mods, y abandona cualquier otra partida."
pol = "Kod lub narzędzie testowe: {why}. Zmodowana kopia z nim gra w meczach wieloosobowych i kooperacyjnych tylko z graczami, którzy mają te same mody, a każdy inny mecz opuszcza."

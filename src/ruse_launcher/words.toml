[agree_full]
us = """
R.U.S.E. 2.0: user and licence agreement
Version 4, 13 November 2026

In short
- Licences and credit: the licences our apps and their models, sounds and textures use, so the people whose work we use get their credit.
- Owned copies only: a check that the game folder is a copy you own. The project supports R.U.S.E. only for people who own it.
- RUSE Guard: our anti-cheat, with its program check, to stop cheating in real multiplayer matches. Required to use the apps.
- Bug Watch: counts of what you use and what goes wrong, sent to our developers to fix crashes and bugs faster. Off unless you tick it (recommended).
- Sign in through Steam: a sign-in on Steam's own page that confirms you own R.U.S.E., for online play, RUSE Guard and content downloads. When you want it; nothing needs it yet.
- Your username: a name you pick, so we know whose crash or match it is. Everyone picks one, because RUSE Guard is required.

1. What this covers
RUSE Studio, RUSE Launcher and our online services: the mod list, the RUSE Guard server, the Bug Watch server with its private repository, and the Steam sign-in server. This agreement is between you and the R.U.S.E. 2.0 project (sneadtristen6, on GitHub and on our Discord).

2. Who we are, and who we aren't
R.U.S.E. is a game by Eugen Systems, published by Ubisoft. You need your own copy. R.U.S.E. 2.0 is a free community project. It isn't made, approved or supported by Eugen Systems or Ubisoft. The game and its files remain theirs.

3. The licences we use, and giving credit
- Our apps are free and open source under the GNU General Public License version 3 (GPL v3). You may use, study, change and share them. If you share them, or a changed version, keep it under GPL v3, keep every credit, and offer its source code.
- Work by others inside our apps: LittleGroove's RUSE Mod Manager engine (GPL v3), ProLution's work and DomesticNukes' RUSE Guard design, each credited in the apps' Credits and on the project page.
- 3D models, sounds and textures: CC BY ones must credit the maker, as our Credits page does; if you reuse one in your own mod, credit them the same way. CC0 ones need no credit, but we credit them anyway, and we'd ask you to as well.
- Libraries and data the apps come with are each listed with their licence in THIRD_PARTY_NOTICES, which comes with the apps.
- Mods made by others belong to their makers, under the terms they chose.

4. Owned copies only
The project supports R.U.S.E. only when you own it. Before a modded game starts, the apps check that the game folder is a copy you own, from the files Steam left there: Steam's record of the install, Steam's own signed file, and no files that make the game run without Steam. Nothing is sent for this check. If your copy can't be confirmed (a boxed copy from before R.U.S.E. was on Steam, or a check that got it wrong), a box shows you a code made from this PC and the game's main file, and how to open a ticket on our Discord or GitHub; the code leaves your PC only if you paste it there. We send back an unlock code, which works on that PC only.

5. RUSE Guard: our anti-cheat (required)
Why: to stop cheating in real R.U.S.E. multiplayer matches. Mods can change how the game plays, so RUSE Guard makes sure everyone in a match plays the same game, and that nobody uses our tools to cheat against other players. To use RUSE Studio and RUSE Launcher, you accept RUSE Guard.
- Where it acts: RUSE Guard is in every modded copy the apps build, and it acts only in multiplayer and co-op matches. It does nothing in single-player, skirmish against the computer, the campaign or replays, and the Studio never runs it while you make mods.
- The join code: the Launcher gives your modded game a code that stands for its game version, its mods and their versions. You and the people you play with compare codes yourselves; the code is never sent to us. A copy built without RUSE Guard has no join code, so the people you play with can't check you run the same game.
- The program check: while a multiplayer or co-op match is live, RUSE Guard checks the names of your running programs against a list of known cheat tools, and reports only a name that is on that list; it reads nothing else. This check is part of RUSE Guard: accepting RUSE Guard, which is required to use the apps, includes it.
- What it may collect, when the game provides it: a check of the game files that change how the game plays, compared with the other players; regular checks that everyone's game stays the same; a replay you saved; the match's details (map, mode, players' in-game names, result, times); the list of mods and their checks. Today the game provides no match record, so for an ordinary match nothing is sent.
- What it never collects: your files, your screen, your keystrokes, or anything outside a multiplayer or co-op match. It never reads your computer's memory. When the game writes its own crash report, the apps read that report on your PC: RUSE Guard takes out only its own marked lines (below), and Bug Watch, if you ticked it, only the game crash details listed in section 6. The report itself never leaves your PC.
- A cheat copy: a modded copy built with a cheat or a test tool is for offline play only. If it is taken into a multiplayer or co-op match, it surrenders the match a few seconds in and then stops the game at the end-of-match screen, to the desktop. The game's own crash reporter may then send its report to the game's maker, and that report carries RUSE Guard's line saying a cheat copy was stopped. The Launcher sends us that line, with any Steam ID, long number or path removed, under your username. Honest copies are never stopped.
- No automatic bans. If something looks wrong, our review team (DomesticNukes and sneadtristen6) looks at the evidence, and at the replay when there is one, and decides. You can appeal to sneadtristen6 on our Discord or on GitHub.
- How long records are kept: a match record is deleted automatically 48 hours after the last player's record of that match reached our review server. A match with an open review is kept until the review is decided; a dismissed one is then deleted. If cheating is confirmed, the evidence is kept while the player can appeal; when the appeal is done, or the review team releases it, only the decision itself is kept, so it can be enforced.
- What can happen: confirmed cheating can remove your access to multiplayer through R.U.S.E. 2.0. It never affects your Steam account or the game itself.
- To stop: RUSE Guard is required to use the apps; to withdraw from it, stop using the apps.

6. Bug Watch: help us find and fix bugs (optional, recommended)
Why: to make the Studio and the Launcher work better for you, and to make development easier. Instead of waiting for someone to report a crash, we see it, see what led to it, and fix it sooner.
If you tick this, the Studio and the Launcher count what you use and when something goes wrong, and send it to our developers once a day. Settings shows you, word for word, what would be sent. In plain words, it is:
- a report code, made on your PC the first time (so your crashes can be found together), and your username;
- the app and its version, the day, your version of Windows, your language, the game's build, whether RUSE Guard is on, and which version of this agreement you accepted;
- how often each part of the app was used and how long things took, what went wrong and where (in our own code only), which mods from our list you had on and how many minutes you played with each, and how many mods of your own you had and what kinds of things they hold, such as units, maps, missions or scripts (counted by kind, never named, and never their words, paths or files);
- when an app crashes: the kind of error and where in our code; when the game crashes: its crash code, where in the game it stopped and up to 16 places in the game that led there, the place in memory it was trying to read, write or run, the game's own error text with any file path shortened, the map it was on (one of the game's own maps by its name; a map a mod made only as \"a mod's map\", never its name), the unit the game was making (one of the game's own units by its number; a unit a mod added only as \"a mod's unit\"), and the mods that were on. The apps send the unit only when they can read it from the game's crash report.
Only our developers see it: it's kept on our server and, once it exists, in a private repository only our developers can open. Never sent: your real name, your Steam account, your files or paths, or the names and words of your own mods; the game's crash files never leave your PC. Your counts and crash reports are deleted after 7 days; only a very severe crash we're still fixing is kept longer, until it's fixed, and after that we keep only totals with no name or code in them (like "12 builds failed on version 0.9.9 that day"). It's off unless you tick it. Untick it any time in Settings: nothing more is counted or sent, and what was kept is deleted. To have everything kept under your report code deleted now, ask on our Discord or GitHub.

7. Sign in through Steam
Why: to confirm you own R.U.S.E., for online play, RUSE Guard and content downloads. Nothing needs it yet; the apps ask once, and the Launcher's Settings opens it any time.
- You sign in on Steam's own page in your browser. We never see your password.
- Steam tells our server one thing: whether your account owns R.U.S.E. If it does, our server hands your PC a signed pass, good for 30 days.
- What our server keeps: a one-way code made from your Steam account with a secret of ours, and when the pass was issued and expires. It never keeps your Steam ID or your IP address. The sign-in code itself is kept, hashed, for ten minutes, and Steam's one-time sign-in numbers for a day, so a sign-in can't be replayed.
- What your PC keeps: the pass, in the apps' settings. Settings can sign you out, which deletes it; to have the server's record of your sign-in deleted, ask on our Discord or GitHub.
- If Steam's game list is private, Steam can't tell us; set Game details to Public for a minute, or ask for an unlock code.

8. Your username
Why: so we know whose crash or match it is, and can help that person. You choose a username at the first start (it gets a short number added, like Nick#4821), because RUSE Guard is required of everyone. It's sent only with what applies to you: your RUSE Guard match records, and, if you ticked Bug Watch, your Bug Watch counts. One username works for both the Studio and the Launcher, and you can change it in Settings. To have your username and data deleted, ask on our Discord or GitHub.

9. No warranty
The apps are free and come as they are, without any warranty (GPL v3 sections 15 and 16). They build modded copies of the game and leave your own installed game unchanged. We're not responsible for the game, your Steam account, or any loss from using the apps.

10. Changes
When this agreement changes, the apps show it again before you go on.

11. Contact
Questions, bug reports and appeals: on our Discord (the mod requests channel, or the experiments / work in progress channel) or on GitHub. Security problems: privately, as our security policy says.

This English text is the one that counts; the other languages are translations.
"""
fr = """
R.U.S.E. 2.0 : accord d'utilisation et de licence
Version 4, 13 novembre 2026

En bref
- Licences et crédits : les licences qu'utilisent nos applications et leurs modèles, sons et textures, pour que les personnes dont nous utilisons le travail soient créditées.
- Exemplaires possédés uniquement : une vérification que le dossier du jeu est un exemplaire que vous possédez. Le projet ne prend en charge R.U.S.E. que pour les personnes qui le possèdent.

[agree_full]
us = """
R.U.S.E. 2.0: terms of use and privacy notice
Version 5, effective 26 November 2026

What's new in version 5
- Copies the Launcher and the Studio build now show the game's own title and Eugen's logo video. The R.U.S.E. 2.0 title and intro are your choice (section 10).
- Who makes R.U.S.E.: it's a game developed and published by Eugen Systems.
- RUSE Guard: this text now says what it really does, including its watcher in every modded copy, its list of cheat tools (now inside the app), its program check, and how copies built with cheats play (section 6). The Launcher's Vanilla now builds a copy with RUSE Guard in it (section 10).
- Bug Watch: this text now says what is sent and when (section 7). Saving your username no longer turns Bug Watch on. Unticking it now deletes its counts and waiting reports on your PC, and nothing from before is sent later. With Bug Watch on or off, the Launcher now gives you a short crash code when a game crashes, with a Copy code button, so you can send the code and a screenshot of the message to XUL on Discord (XUL6x3) or on GitHub. Bug Watch's daily send can now also list each of the day's failures by its code, with a few numbers that name no one.
- Updates: the apps now ask for updates only after you've accepted these terms, and install an update only if it carries our signature (section 12).
- A full privacy notice: who is responsible, what we use and why, who else gets it, how long we keep it, and your rights, including your right to object (section 11). You can now email us a privacy request, and Settings shows your RUSE Guard code to send with it.
- You can read these terms again any time in Settings, under Terms, credits and licences.
- New sections: your copy of the game and mods (3), the R.U.S.E. 2.0 title and intro (10), updates and other sites (12), your Steam account (13), and the law (16).

In short
- Who: R.U.S.E. 2.0 is a free fan project run by sneadtristen6, who lives in the United States. Email, for privacy requests: sneadtristen6@gmail.com.
- The game: R.U.S.E. is a game developed and published by Eugen Systems. You need your own copy. R.U.S.E. 2.0 isn't made, approved or supported by Eugen Systems.
- Your copy of the game: to play with mods, the apps build a separate modded copy of the game on your PC. In some instances, game data may be changed, but that is with your copy of the game: that modded copy. Our apps never change your installed game, unless you ask the Launcher or the Studio to restore it from its clean backup.
- Licences: the apps are free software under the GNU GPL v3, and nothing here limits your GPL rights. Section 4 says where the work of others is credited.
- Owned copies only: the apps check that your game folder holds a copy of R.U.S.E. installed through Steam. Nothing is sent for this check.
- RUSE Guard: our anti-cheat, required to use our apps, to keep matches fair. Its lock and its program check act only in multiplayer and co-op matches; its watcher, in every modded copy, can also show a notice on your screen in a skirmish against the computer. Its list of known cheat tools comes inside the app.
- Bug Watch: crash details and counts of what you use, sent to our developers with your username. Off unless you tick it.
- The R.U.S.E. 2.0 title and intro: off unless you tick it.
- Sign in through Steam: you sign in on Steam's own page, and our server asks Steam whether your account owns R.U.S.E. Optional; nothing needs it yet.
- Your username: a name you pick, so we know whose crash or match it is. Please don't use your real name.
- Updates and other sites: once you've accepted these terms, the apps ask GitHub for updates at every start; an update installs only if it carries our signature, a required one installs by itself, and some features download from other sites.
- Your Steam account: Valve decides what happens to Steam accounts, and playing a modded copy online is at your own risk.
- Your privacy: section 11 says what we collect, why, who else gets it, where it's kept, how long, and your rights. We don't sell your data or use it for ads.
- No warranty: the apps are free and come as they are.

1. What this covers, and who it's with
These terms cover RUSE Studio and RUSE Launcher as we publish them, and our online services: the mod list, the RUSE Guard server, the Bug Watch server (and the private GitHub repository it posts notes to, when that's switched on) and the Steam sign-in server. This agreement is between you and sneadtristen6, who runs the R.U.S.E. 2.0 project and lives in the United States. \"We\" and \"us\" mean him and the volunteers who help him.

2. Who we are, and who we aren't
R.U.S.E. is a game developed and published by Eugen Systems. You need your own copy. R.U.S.E. 2.0 is a free fan project. It isn't made, approved or supported by Eugen Systems. It isn't a new version of the game, and Valve doesn't sponsor or endorse it. R.U.S.E. and the game's files belong to their owners. Steam and the Steam logo are trademarks of Valve Corporation.

3. Your copy of the game, and mods
- The apps work only with a copy of R.U.S.E. you own. They don't come with any of the game's files, and they never upload them.
- To play with mods, the apps build a separate modded copy of the game on your PC. In some instances, game data may be changed, but that is with your copy of the game: that modded copy. Mods change its data, and some change its scripts. Our apps add RUSE Guard's scripts, and a few small guards of their own, to the game's scripts in every modded copy; the guards step in only where the game would otherwise stop with an error. And some mod sets need a small game patch to that copy's program file, which the apps download from our GitHub page.
- The apps never put anything into the game while it runs. They only see whether it's running and from where, and the troubleshooter can end a game left running from a modded copy when you press its fix.
- The game has its own crash reporter, made by the game's maker. When the game crashes, whether it's your installed game or a modded copy, that reporter can send its own crash report to the game's maker. It's the game's, not ours: our apps never send its reports, and don't turn it on or off.
- Our apps never change your installed game, unless you ask the Launcher or the Studio to restore it from its clean backup. A restore puts the game's own files back, and moves aside the files that were added and the versions it replaces.
- Mods made by others belong to their makers, under the terms they chose. Mods that change the game's scripts are marked, and the Launcher waits until you tick \"I trust this mod's author\" for each one, and again for each new version of it.

4. Your rights under the GPL, the licences we use, and giving credit
- RUSE Studio and RUSE Launcher are free software under the GNU General Public License, version 3 (GPL v3). Nothing in this agreement limits what the GPL lets you do: you may run, study, change and share the apps' code under the GPL whether or not you accept this agreement. The apps as we publish them ask you to accept it before you use them; that's how they work, not a limit on your GPL rights. This agreement covers using them, with RUSE Guard, and our online services. If you share the apps, or a changed version, keep it under GPL v3, keep the copyright notices and credits, and offer its source code. A changed version isn't the apps as we publish them; this agreement and our support don't cover it.
- Work by others inside our apps: LittleGroove's RUSE Mod Manager engine (GPL v3), ProLution's work, and DomesticNukes' RUSE Guard design. Each is credited on our project page on GitHub.
- The libraries and 3D models that come with the apps, and the motion sets, era units, textures and aerial photos they can download for you, are listed with their makers and licences in THIRD_PARTY_NOTICES, a file that comes with the apps; Settings shows it, under Terms, credits and licences. The intro's engine sound is listed there too. The era units in a mod are also credited in that mod's own credits file. Works under the CC BY licence (a Creative Commons licence) may be reused only with credit to their makers: if you reuse one in your own mod, credit the maker the same way and keep the link to its licence. Works under CC0 need no credit, but we credit them anyway, and we'd ask you to as well.

5. Owned copies only
The project supports R.U.S.E. only when you own it. When the apps start, and before a modded game starts, they check the game folder for a copy installed through Steam: Steam's record of the install, Steam's own signed file, and no files that make the game run without Steam. This is our own check, not Steam's or Eugen Systems', and it doesn't prove who owns the game. Nothing is sent for it.
If your copy can't be confirmed (a boxed copy from before R.U.S.E. was on Steam, or a check that got it wrong), a box shows you a folder code. It's made on your PC from an ID of your Windows (or Linux) installation, or, failing that, your network card's ID, and the game's main file. It's one-way: it can't be turned back into those IDs. It leaves your PC only if you paste it somewhere, or press \"Open a ticket on GitHub\", which opens GitHub's ticket page in your browser with the code already in the page's address. Nothing is posted until you post it, and GitHub tickets are public. You can send the code to sneadtristen6 in a private message on Discord instead. We send back an unlock code that works only on that PC, with that version of the game's main file. We use your folder code only to unlock your copy, because you asked, and we keep no record of folder codes beyond your ticket or message.

6. RUSE Guard: our anti-cheat (required)
Why: to stop cheating in R.U.S.E. multiplayer and co-op matches played with copies our apps build. Mods can change how the game plays. So each copy whose mods change play gets a join code that you compare with the people you play with. A copy built with a cheat or a test tool checks that every player in the match has the same build, and gives the match up if not. In multiplayer and co-op matches, RUSE Guard also looks for known cheat tools running on your PC. And every copy's watcher shows on screen when a match sees a spawn order or a sudden jump in a side's money.
Why it's required: RUSE Guard is required to use our apps. R.U.S.E. doesn't have an effective anti-cheat, which is why RUSE Guard is needed: it helps keep cheats out of multiplayer, and fair matches matter to us and to every player you meet. We rely on what data-protection law calls a \"legitimate interest\": fair matches for every player, which needs no permission from you as long as your privacy doesn't outweigh it (section 11). That's why it isn't a tick box like Bug Watch: the Studio and the Launcher as we publish them always include it. You can still object at any time (section 11).
- Where it acts: RUSE Guard is in every modded copy the apps build, and the Launcher's Vanilla builds such a copy too, with no mods (section 10). Its lock and its program check act only in multiplayer and co-op matches, and so would its match records, once they start (below). Its watcher, also in every modded copy, watches multiplayer, co-op and skirmish matches against the computer: it can show a notice on your own screen when a side's money jumps by 400 or more at once, or when a unit is made by a spawn order. In a multiplayer match, every player's screen can show it. The watcher changes nothing in the match and sends nothing. Only the Launcher sends anything for RUSE Guard; the Studio never does, and its Test in game runs no program check.
- The list: RUSE Guard's list of known cheat tools comes inside the app, as a plain file you can read, and changes only with an app update. Nothing is downloaded for it.
- The program check: in a multiplayer or co-op match started from the Launcher, RUSE Guard looks every 30 seconds at the names of the programs running on your PC, and keeps only names that are on its list. To know when such a match is on, the Launcher reads the game's own error output while the game runs: it keeps only RUSE Guard's short lines that say a match is on or has ended, and drops every other line as soon as it reads it, never keeping or sending it (that output can also hold Steam's own lines, one of them with your Steam account number). If the game doesn't say that a match has ended, the check stops two minutes after the game last said it was on. If a listed program was running during a match, the Launcher sends our server a short record after the game: your username and RUSE Guard key, when the match started and ended, whether it was multiplayer or co-op, and the names of the listed programs found. Nothing else goes in: no replay, no files and nothing more about the match. If no listed program was running, nothing is sent.
- The join code: for a modded copy whose mods change how the game plays, the Launcher shows a join code. It stands for the copy's game version, its mods with their versions, and what they change in how the game plays. You compare join codes with the people you play with. We don't receive them today; a match record (below) would carry them.
- Copies built with a cheat or test tool: such a copy plays multiplayer and co-op only with players whose build is the same (the same game version and the same mods, in the same versions). About a second into each such match, it tells every player's game a short code for its build (its build code), made from the game's version, the mods with their versions in their order, and what they change in how the game plays. It holds no name or account. If every player has the same build, the match is built to go on; nobody has played such a match with two people yet. If not, it gives up the match a few seconds in.
  In a multiplayer match that isn't ranked, it then stops the game on purpose at that match's end-of-match screen: the game crashes to the desktop. The game's own crash reporter can then send its report to the game's maker, and that report carries RUSE Guard's line saying a cheat copy was stopped. In co-op and ranked matches it only gives up the match. When the Launcher started the game and is still open when the game stops, it takes only RUSE Guard's line from the game's crash report on your PC and sends our server a short note that a cheat copy was stopped, under your username and RUSE Guard key, with when the crash report was written and when the note was made. The line says only the kind of match and your side's number in it; any Steam ID, long number or path is taken out. Our apps never send the crash report itself. The note opens no review and decides nothing; it's listed for sneadtristen6 to see. No note is sent if the Launcher was closed before the game stopped, or if the game was started from the Studio or by hand. On Linux and the Steam Deck, whether the note is sent isn't known yet.
  Honest copies are never stopped.
- Your RUSE Guard key: the first time the Launcher makes a RUSE Guard record on your PC, it makes a random key there. A code made from this key (its public half) goes with each record, so we can tell your records apart from those of someone with the same username, and check they weren't changed. It says nothing else about you. Settings shows a short code made from it, \"Your RUSE Guard code\": send it with a privacy request, and we can find your own RUSE Guard records. Nothing more is sent for it.
- Not active yet: match records. They need a record of the match that the game can't write today. Before they start, we'll update this text, and the apps will show it to you again. When they start, a match record will carry: your username and RUSE Guard key; your side; your copy's codes; checks of the game files your copy changed, and regular checks that each player's game stays the same; your mods with their checks; which script commands your mods tie to keys (never what you press); for a developer's test copy, the developer's key; the names of any listed cheat tools found running; when the match started and ended; and the newest replay saved on your PC during or just after the match, with its file name. A replay holds every order each player gave in the match, and its file name and contents can include your and other players' in-game names.
- What it never does: it never collects your screen or your keystrokes, never looks inside other programs while they run, and never sends us your files, apart from the replay a match record would carry. Of the game's crash reports, it reads only its own line about a cheat copy it stopped (above), on your PC.
- Developers' test copies: the apps are built to let a developer's test copy into a match with a special key from us, the one way past the cheat-copy rule. None works yet: the apps can't check such a key today.
- Decisions about you: no automatic bans. No decision about cheating is made by a machine alone: sneadtristen6 looks at the evidence, and at the replay when there is one, and decides. Anthropic's Claude, an AI assistant, helps him read RUSE Guard's records, under Anthropic's own terms; the decisions are his. A record that names a listed cheat tool opens a review for him, which decides nothing until he does. You can appeal within 30 days of a decision (section 17); sneadtristen6 is the only person who reviews cases, so he also decides appeals himself. The one automatic rule is the cheat-copy rule above. It follows from the copy you chose to build, and it never touches your Steam account or your installed game.
- What a decision means today: if cheating is confirmed, we keep that decision under your username on our list of flagged players, and use it when we look at later matches. Because two players can share a username, we also look at which RUSE Guard key the records came with. Our RUSE Guard server keeps that list, each flagged username with the RUSE Guard key its records first came with, and tells only that player's own Launcher that it's flagged. The apps don't act on a flag yet. If a later version does, for example to keep a flagged player's modded copies out of multiplayer through R.U.S.E. 2.0, this text will say so first. If an appeal is upheld, the decision is marked overturned, and the username comes off the list.
- How long records are kept, and your rights: section 11.

7. Bug Watch: help us find and fix bugs (optional, recommended)
Why: to make the Studio and the Launcher work better, and to fix crashes sooner: instead of waiting for someone to report a crash, we see it and what led to it.
On what basis: only with your OK (your consent, section 11). It's off unless you tick it. Saving or changing your username never turns it on or off. Ticking it changes nothing else in the apps, except what the Launcher tells you after a game crash (below). When the apps show these terms again after a change: if Bug Watch is on, its box asks \"Keep Bug Watch on?\", ticked; leave the tick to keep it on, or untick it to turn it off. If it's off, the Bug Watch box comes again, unticked.
While it's on, the Studio and the Launcher send our server:
- once a day, the counts for each day that has ended:
  - the app and its version; the day; whether you use Windows 10 or 11; the app's language; the game's version; whether RUSE Guard is built in; which version of these terms you accepted;
  - how often each part of the app was used and how long things took; what went wrong and where (in our own code only; when a Studio screen's own script fails, the screen's name and the kind of error, never its words, file or line); for each long task, such as a mod build, how many times it finished or failed, and how many builds found mistakes in the mods;
  - a list of that day's failures, at most 20, each with its code (which place in our code), how far a Play or a Test in game got, the shape of the mod set (how many mods from our list, mod folders and mod files of your own, as counts), and beside it only numbers that name no one: the Windows error number (such as disk full), the web server's answer (such as 404), the game's exit number, a count and a second code;
  - how many updates were offered, installed or failed; how many times the app crashed; which troubleshooter checks found a problem;
  - which mods from our list you had on; how many minutes you played in all, and how many with each of those mods;
  - how many mods of your own you had, and what kinds of things they hold, such as units, maps, missions or scripts (counted by kind, never named, and never their words, paths or files);
- right away, when an app crashes: the kind of error and where in our code;
- right away, after a game the app started has crashed, technical details of where and how it crashed:
  - the game's error code; the name of the file it stopped in (this can be part of Windows, a driver, or another program loaded into the game, such as an overlay), where in it the game stopped, and up to 16 places in the game that led there;
  - for a memory error, what the game was trying to do (read, write or run) and the place in memory;
  - for a script error, the game's own error text, with paths on a drive cut down to file names, your user folder's name hidden (the names of folders inside it can stay), and Steam account numbers and other long numbers taken out (the game's own script names stay); how many earlier errors the game had skipped; and the map (one of the game's own maps by its name, a mod's map only as \"a mod's map\");
  - the unit the game was making, when the apps can read it from the game's crash report (one of the game's own units by its number, a mod's unit only as \"a mod's unit\");
  - which mods were on, what kinds of things your own mods hold (counted by kind), and which version of these terms you accepted.
Bug Watch uses only the game's own crash reports. Of another program's report, it reads only the names of the files it lists, to tell that it isn't the game's; nothing of it is sent.
Each send carries your username and your install ID, a random code made on your PC when you first chose your username, whether or not you tick Bug Watch. Your report code, which Settings shows while Bug Watch is on, is the first 8 characters of your install ID.
Our apps never send your files or the game's crash report files themselves, and Bug Watch sends no Steam account number. (The game's own crash reporter can send its own report to the game's maker: section 3.) The game's error text can include names from the game or from a mod's scripts. Please don't use your real name as your username (section 9).
Crashes we know: with Bug Watch on, if the game crashes in one of the ways we know, the Launcher tells you which unit the game was making and why, in your language. That explanation is only shown to you, never sent; Bug Watch's report carries the unit only as listed above (a number, or \"a mod's unit\"). To know those crashes, the apps download our list of them from our Bug Watch server when a game starts, unless the list on your PC is less than a day old, and once more at a crash if there's no usable list. They download it only while Bug Watch is on, keep it on your PC, use it only if it carries our signature, and check your crash report against it on your PC. The download carries nothing about you. Without the list (for example the first time, or without the internet), the Launcher still tells you the game crashed, but not the unit or the reason. Unticking Bug Watch deletes the list from your PC.
With Bug Watch on or off: if a game the Launcher started crashes, the Launcher shows you a short crash code, made on your PC from where the game stopped. It isn't sent anywhere. A Copy code button copies it. If you want help, send the code and a screenshot of the message to XUL on Discord (XUL6x3) or on GitHub, and we look it up in our own list. The code says only where the game stopped.
Settings shows you today's counts word for word, as they would be sent, and the names of the reports waiting to go. Reports that can't be sent wait on your PC for up to 30 days, then are dropped. While a game the app started is running, Bug Watch also keeps a small note about it on your PC, so that at its next start the app can tell whether the game crashed: when it started and was last seen running, its mods (ours by name and version, others only as a count), and where the copy and the game are installed (a Windows folder can include your Windows user name). It's never sent, and it's deleted after 30 days, or at once when you untick Bug Watch.
Who sees it: our developers. It's stored for us by Cloudflare on our Bug Watch server. When it's switched on, our server also posts notes on the problems we track to a private GitHub repository, a space on GitHub that only our developers can open. The notes never hold a username or a report code. Our developers also use Anthropic's Claude, an AI assistant, to help read some Bug Watch crash reports, under Anthropic's own terms.
How long: each report is deleted from our server at the daily clean-up after it has been there 7 days, so 7 to 8 days after it arrives. Our developers can mark the report of a very severe crash to keep it while they fix that crash; a marked report stays until they take the mark off, the day that crash is fixed, and then goes at the next daily clean-up. What stays after that, with no username, install ID or report code in it: daily totals for each app version (like \"12 mod builds failed on version 0.9.9 that day\") and the day each version and each kind of error was first seen, with no time limit; and our server's notes on the problems it finds (which part of an app, which mod from our list, where a crash happened, and how often), until 3 days after we close that problem. For the first 7 days, on a day when only one person used a version, its totals are that one person's counts; after that, a version or a mod from our list that fewer than 3 installs used that day is kept only as \"(other)\". The notes on GitHub stay until we delete them. Cloudflare keeps a history of our databases for 7 days, so what we delete stays in that history for up to 7 more days. Copies on sneadtristen6's computer: section 11, \"Where it's kept\".
Untick it any time in Settings (or in the Bug Watch box when the apps show these terms). From then on nothing is counted or sent, and the apps delete Bug Watch's counts and the reports waiting to go. Your username and install ID stay on your PC, because RUSE Guard uses your username. Nothing made before you unticked it is sent later, even if you tick it again. Unticking tells our server nothing: what already reached it is deleted as above. To have it deleted sooner, email us your report code (Settings shows it only while Bug Watch is on, so note it before you untick), or your username if you don't have the code: we find your install's reports by it and delete them. The totals and notes above stay. Unticking doesn't undo what was sent before.

8. Sign in through Steam (optional)
Why: to confirm you own R.U.S.E., for online play, RUSE Guard and content downloads later. Nothing needs it yet.
On what basis: you ask for it (section 11). The apps may offer it when they start, and the Launcher's Settings opens it any time.
- You sign in on Steam's own page in your browser, at an address the app makes itself. We never see your password.
- Steam then tells our server your Steam ID. Our server asks Steam whether that account owns R.U.S.E. (this works only if your Steam game details are public), uses the answer, and doesn't store the ID. If you own it, our server gives your PC a pass (a code that shows the check passed), valid for 30 days.
- What our server keeps: a one-way code made from your Steam ID with a secret of ours, and when your pass was issued and when it runs out, until 30 days after your pass runs out. The short-lived code your app uses to collect the pass (the sign-in code) is kept only in a scrambled form; it runs out after 10 minutes and is deleted when the app collects it, or within about an hour after it runs out. Steam's one-time sign-in numbers stop a sign-in from being replayed; they're kept for a day, even when a sign-in fails, then deleted within about an hour. Our code never stores your IP address.
- Where: our servers' databases are stored by Cloudflare in eastern North America.
- What your PC keeps: the pass, in the apps' settings, until you sign out in Settings, which deletes it. A pass that has run out also stays until then.
- If your Steam game details are private, Steam can't tell us. Set Game details to Public for a minute, then try again.
- R.U.S.E. 2.0 isn't affiliated with or endorsed by Valve. Valve handles your sign-in under its own privacy policy.

9. Your username
Why: so we know whose crash report or match record it is, and can help that person. Everyone picks one at the first start, because RUSE Guard is required. A # and four random numbers are added, like Nick#4821. Two players can still end up with the same one, so we also go by your RUSE Guard key or report code. Please don't use your real name, your Steam name or anything else that identifies you. It's sent only with your RUSE Guard records and, if Bug Watch is on, your Bug Watch reports. One username works for both apps. You can change it in Settings; changing it never turns Bug Watch on or off. Records already sent keep the old one until they're deleted. To have your username and the data under it deleted, email us.

10. The R.U.S.E. 2.0 title and intro (optional)
Copies the Launcher and the Studio build show the game's own title and Eugen's logo video. If you tick the box on the first screen, or \"Use the gold R.U.S.E. 2.0 title and intro\" under The game's title in Settings, those copies show R.U.S.E. 2.0 in gold on the main menu and the loading screens, and our intro plays in place of Eugen's logo video as the game starts. The gold title is made on your PC from your own game's files, over a battle-scene picture that comes with the apps. The intro also uses an engine sound that comes with the apps. It changes your modded copy only, never your installed game, and you can change it any time in Settings. In the Launcher, Vanilla builds a separate copy with no mods, with RUSE Guard in it like every copy, and with the title you chose.

11. Privacy notice
This notice is part of this agreement. The same text is public on our GitHub page, at https://github.com/sneadtristen6/R.U.S.E-2.0-Project/blob/main/PRIVACY.md, so anyone can read it, including players who don't use our apps. It took effect on 26 November 2026.

Who is responsible for your data
R.U.S.E. 2.0 is run by one person, sneadtristen6, who lives in the United States. He decides what the apps and our servers do with your data, so under data-protection law (in the EU and the UK, the GDPR) he is the one responsible for it: the \"controller\". Email, for privacy requests: sneadtristen6@gmail.com. You can also reach him on our Discord or GitHub; for anything personal, use email or a private message, because GitHub tickets and Discord channels can be read by others. He alone reviews RUSE Guard records and decides about them. We have no representative in the EU or the UK.

What we use, why, and on what basis
- RUSE Guard (section 6): to keep multiplayer and co-op matches fair. Basis: our legitimate interest, and other players', in fair matches (GDPR Article 6(1)(f)), not your consent.
- Bug Watch (section 7), only if you tick it: to find and fix crashes and bugs. Basis: your consent (Article 6(1)(a)).
- The Steam sign-in (section 8), only if you use it: to confirm you own R.U.S.E. Basis: you asked for it (Article 6(1)(b)).
- Folder codes and unlock tickets (section 5): to unlock your copy. Basis: you asked for it (Article 6(1)(b)).
- Your username (section 9): to know whose record or report it is. Basis: the same as the RUSE Guard record or Bug Watch report it's sent with.
- Update checks and downloads (section 12): to keep the apps working and safe, and to give you what you ask for. Basis: our legitimate interest (Article 6(1)(f)), and your request when you press a button.
- Messages, tickets, emails and appeals you send us: to answer you. Basis: our legitimate interest in answering you (Article 6(1)(f)).
- Patreon supporters: Patreon handles your payment under its own privacy policy. We see only what Patreon shares with creators under that policy, and publish a credit name only if you send it with your permission. Basis: to give you the thank-you you chose (Article 6(1)(b)); a public name only with your permission (Article 6(1)(a)).
- Your IP address: every server your PC connects to sees it. Our servers' own code never stores it; Cloudflare, which runs our servers, handles it to deliver and protect each connection, under its own privacy policy, and its dashboard shows us how many requests came from each country and city. Basis: our legitimate interest in running and protecting our servers (Article 6(1)(f)).
No law requires you to give us anything. The apps as we publish them need a username and include RUSE Guard; Bug Watch and the Steam sign-in are your choice. No decision about cheating is made by a machine alone. The one automatic rule, the cheat-copy rule in section 6, acts on a copy built with cheat or test tools, never on your Steam account.

Who else receives it
- Cloudflare, Inc. (USA), which runs our three servers and stores their databases for us, under its data processing terms.
- Valve, for the Steam sign-in and the ownership check (section 8).
- GitHub (Microsoft), which keeps our files, tickets and discussions, and, when it's switched on, the private repository Bug Watch's server posts its notes to. It also receives what your browser sends when you open a page the apps filled in (section 12).
- Google, which runs the email address you write to.
- Discord, which carries the messages you send us there.
- Anthropic, whose AI assistant Claude helps us read some Bug Watch crash reports and RUSE Guard records, under Anthropic's own terms.
- Other players' games: a cheat or test copy's build code (section 6).
- The public: anything you post on GitHub or in Discord's public channels.
- Anyone the law requires us to give it to.
Apart from us: when the game crashes, the game's own crash reporter can send its report to the game's maker (section 3). That's the game's, not ours.
We don't sell or rent your data, and we don't use it or share it for advertising. The apps contain no advertising and no outside analytics or tracking services; Bug Watch is our own, and your choice.

Where it's kept
Our servers' databases are stored by Cloudflare in eastern North America; Cloudflare's network serves them from data centres around the world. RUSE Guard records are collected for review on sneadtristen6's own computer in the United States. When we look into a problem, copies of Bug Watch reports can also be on his computer: a copy that belongs to a bug we're fixing is deleted once that bug is fixed, and a copy that shows no bug is deleted after 7 days. sneadtristen6 is in the United States, and Cloudflare is a US company, so your data is handled in the United States and wherever Cloudflare runs.

How long we keep it
- RUSE Guard records: our RUSE Guard server keeps each record until our review computer collects it, and never more than 3 days after it arrived: then it's deleted, collected or not. On the review computer, a match's records are deleted about 48 hours after the last of them arrived (at its next clean-up, which runs whenever it collects records), unless a review of the match is open. A match under review is kept until it's decided; if it's dismissed, it's then deleted. If cheating is confirmed, you have 30 days from the decision to appeal: the evidence is kept for those 30 days, and if you appeal, until your appeal is decided. After that the evidence is deleted, and only the decision is kept, for as long as it applies. If an appeal is upheld, the decision is marked overturned and is never used against you; ask us, and we'll delete it too. A cheat copy's stop note opens no review: it's listed for sneadtristen6 to see, and deleted like any record.
- The review computer's list of usernames and RUSE Guard keys, with when each was first seen: kept with no time limit yet; email us and we'll delete yours.
- RUSE Guard records on your PC: one waiting to be sent stays until it's sent; one our server refused is deleted 30 days after it was set aside.
- Bug Watch: section 7.
- The Steam sign-in: section 8.
- Tickets, messages and emails: as long as the conversation needs. GitHub tickets stay until you or we delete them.
- Supporters' credit names: in each release from then on. Ask, and we take yours out of future releases; releases already published can't be changed.
- Backups: Cloudflare keeps a history of our servers' databases for 7 days (on our free plan, as Cloudflare's own documentation says), so what we delete stays in that history for up to 7 days after we delete it.

Your rights
You can ask us for a copy of the data we hold about you; to correct it; to delete it; to stop using it while a question about it is settled; and for your Bug Watch data and username in a file you can reuse. You can withdraw your Bug Watch consent at any time by unticking it; that doesn't undo what was sent before.
How: email sneadtristen6@gmail.com, or send sneadtristen6 a private message on Discord. Tell us your username, your report code if you use or used Bug Watch (Settings shows it only while Bug Watch is on), and your RUSE Guard code (Settings shows it, as \"Your RUSE Guard code\"); for the Steam sign-in, your Steam ID. Our servers don't ask for your real name, so without these we may not find your data. If we're not sure a request is yours, we may ask for more. We answer within one month, for free; if a request is complex, we can take up to two more months and will tell you why.
If you stop using the apps, you can ask us to delete your RUSE Guard records, and we will. If cheating was confirmed under your username, we keep only that flag and the decision it rests on: your username, the match, the verdict, its date and the RUSE Guard key the flag came with. We may also keep what a cheating case still under review or appeal needs.
Complaints: you can complain to the data-protection authority where you live or work, or where you think the problem happened; in France that's the CNIL (cnil.fr), in the UK the ICO (ico.org.uk). Anyone can complain to us first. If you're in the UK, we'll confirm we got your complaint within 30 days.

YOUR RIGHT TO OBJECT
You can object at any time, for reasons about your own situation, to our use of your data for RUSE Guard. Email us. If we agree, we delete your RUSE Guard records, apart from a cheating flag and its decision (as above), and we tell you that RUSE Guard is required to use our apps: the only way to send no new records is not to use them. We may not agree when we have compelling reasons that outweigh yours, such as a cheating case still under review or appeal.

Other players
Today RUSE Guard sends nothing about the other players in your matches: no names and no replays. A cheat or test copy tells the other players' games only a short build code. If a later version sends match records or replays, which can contain other players' in-game names, this text will say so first. This notice is public, so players who don't use our apps can read it too. Anyone can ask us what we hold under their in-game name, and the rights above are theirs too.

Tracking
The apps don't follow what you do on other websites or apps, and they contain no advertising networks or other outside trackers. The apps aren't web browsers, so they don't read a browser's \"Do Not Track\" signal; your choices are the Bug Watch tick and whether you use the Steam sign-in.

Security
The apps reach our servers only over encrypted connections, and install an update only if it carries our signature (section 12). They make the address of Steam's sign-in page themselves. Our RUSE Guard server tells only a flagged player's own Launcher that it's flagged. No system is perfectly secure: if something happens that puts your data at risk, we'll say so on our GitHub page and our Discord, and tell the data-protection authorities where the law requires.

What stays on your PC
The apps keep their settings and working files in a folder called RUSE Mod Platform, inside your Windows user's AppData\\Local folder:
- your username and install ID, your RUSE Guard key, your choices, the Steam pass if you signed in, and unlock codes;
- Bug Watch's list of known game crashes, while Bug Watch is on;
- Bug Watch's counts not yet sent, and the reports waiting to go;
- RUSE Guard records waiting to be sent, and ones our server refused (deleted 30 days after they were set aside);
- logs of what the apps did (which can include folder names);
- the app window's own browser data;
- downloaded files (an update's installer is deleted at the app's next start after it installed).
To tell whether the game is still running from your modded copy, the apps also look at which programs are running and from where (this is apart from RUSE Guard's program check in section 6); that stays on your PC. When the apps read the game's crash reports (sections 6 and 7), they do it on your PC and never send them; only the game's own crash reporter can send its report to the game's maker (section 3). Nothing in this folder is sent anywhere except as sections 5 to 8 and 12 say. When you uninstall the second of the two apps, the uninstaller asks whether to delete this folder too; the answer starts on No. A Yes deletes it, apart from any mods, maps, exports or backups an older version kept in it. While the other app is still installed, it asks nothing and deletes nothing, because both apps use this folder. Otherwise, to remove it, delete it yourself. Your mods, maps, exports and backups in the RUSE 2.0 folder in Documents, your modded copy, and the clean backup of your game also stay until you delete them.

12. Updates, and other sites the apps connect to
- Updates: once you've accepted these terms, both apps ask GitHub at every start whether there's a new version; until you accept, they ask nothing. If an update is out and your language isn't English, the apps also fetch its notes from GitHub. Optional updates install when you press Update. An update we mark required downloads and installs by itself when the app starts, without asking, and Play and Test in game wait until it's in. Either way, an update installs only if it carries our signature and is exactly the file we signed; otherwise nothing installs, and the app says so and points you to our Discord. If its download fails three times, the app stops trying by itself and points you to its release page on GitHub; a required update still keeps Play and Test in game waiting. Our signing key is never uploaded. At its next start after an update, the app deletes that update's installer. If you downloaded era units before, the Studio also checks for newer versions at start and downloads them by itself. Only the newest version of each app gets fixes.
- Besides our own servers, the apps connect to these sites. Each sees your IP address and what is asked for, and may keep logs under its own privacy policy:
  - GitHub (Microsoft): updates and their notes; the mod list and the mods on it (the Launcher's first start fetches the list right after the terms screen); era units; game patches, during a build that needs one; and some motion files;
  - any other site our mod list may name for a mod: that mod's download (the Launcher checks each file's size and checksum against the list first);
  - Poly Haven and ambientCG: Map Paint's free online textures, with their small pictures loaded from the addresses those sites give (ambientCG receives the words you type in its search);
  - the U.S. Geological Survey's National Map: aerial photos (it receives the area around the place you pick);
  - Zenodo, and a public collection of motion files on GitHub: motions in RUSE Decoy, the Studio's sound and animation tab;
  - our Bug Watch server: the list of known game crashes, only while Bug Watch is on (section 7);
  - Steam: the sign-in page, and Steam's own links that start Steam or check the game's files;
  - Microsoft: Edge WebView2 draws the apps' windows, and what it sends to Microsoft is set by Windows and Microsoft, not by us. If Windows is missing a security certificate the apps need to reach GitHub, the apps ask Windows to check it, and Windows may then download it from Microsoft or from whoever issued it. Where WebView2 is missing, the installers (a ticked box you can untick), the apps when they start (\"Install it now?\") and Settings (\"Install WebView2\") offer Microsoft's WebView2 installer, which comes with the apps; if you say yes, it downloads WebView2 from Microsoft and installs it, under Microsoft's terms. If you say no, you use the app in your browser instead.
- The Studio's 3D views draw with a library that comes inside the Studio, so nothing is downloaded for them.
- Buttons that open your browser: our GitHub pages and Discord, a mod's homepage, Microsoft's WebView2 download, blender.org, and the credit pages of era units. \"Report a problem\", \"Add my mod\" and \"Open a ticket on GitHub\" open a GitHub page with details already filled in: the error the app showed (with your Windows user name taken out of any paths), your mod's details, or your folder code. Your browser sends those details to GitHub in the page's address as soon as the page opens; nothing is posted until you post it, and what you post on GitHub is public.
- If the apps can't open their own window (for example on Linux through Proton), they open in your web browser instead, and your browser then loads the textures' small pictures itself.

13. Steam and your Steam account
Steam's own rules, which you accepted with your Steam account, limit changing games, tampering with how they run, and cheating in multiplayer. Valve, not us, decides how its rules apply to R.U.S.E. We don't know whether Valve would treat a modded copy, or its changed game files, as breaking them, and we can't promise anything about your Steam account. Playing online with a modded copy, above all one built with a cheat or test tool, is your choice and at your own risk. R.U.S.E. doesn't have an effective anti-cheat, which is why RUSE Guard is needed; RUSE Guard itself never does anything to your Steam account or your installed game.


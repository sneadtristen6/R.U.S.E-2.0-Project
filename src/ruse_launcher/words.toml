- Updates: Sobald du diese Bedingungen akzeptiert hast, fragen beide Apps bei jedem Start bei GitHub, ob es eine neue Version gibt; bis du akzeptierst, fragen sie nichts. Ist ein Update draußen und deine Sprache ist nicht Englisch, holen die Apps auch seine Hinweise von GitHub. Optionale Updates werden installiert, wenn du „Jetzt aktualisieren“ drückst. Ein Update, das wir als erforderlich markieren, wird beim Start der App ohne Nachfrage von selbst heruntergeladen und installiert, und „Spielen“ und „Im Spiel testen“ warten, bis es drin ist. In beiden Fällen wird ein Update nur installiert, wenn es unsere Signatur trägt und genau die Datei ist, die wir signiert haben; sonst wird nichts installiert, und die App sagt es und verweist dich auf unseren Discord. Schlägt sein Download dreimal fehl, hört die App von selbst auf, es zu versuchen, und verweist dich auf seine Release-Seite auf GitHub; ein erforderliches Update lässt „Spielen“ und „Im Spiel testen“ trotzdem warten. Unser Signaturschlüssel wird nie hochgeladen. Beim nächsten Start nach einem Update löscht die App den Installer dieses Updates. Wenn du früher Einheiten anderer Epochen heruntergeladen hast, prüft das Studio beim Start auch auf neuere Versionen und lädt sie von selbst herunter. Nur die neueste Version jeder App bekommt Fixes.

[import_help]
us = "Paste a load order a friend shared, from RUSE Launcher or RUSE Mod Manager. The new mod set gets the mods you have, in the same order."
fr = "Collez un ordre de chargement partagé par un ami, depuis RUSE Launcher ou RUSE Mod Manager. Le nouvel ensemble de mods reçoit les mods que vous avez, dans le même ordre."
ger = "Fügen Sie eine Ladereihenfolge ein, die ein Freund aus RUSE Launcher oder RUSE Mod Manager geteilt hat. Das neue Mod-Set bekommt die Mods, die Sie haben, in derselben Reihenfolge."
ita = "Incolla un ordine di caricamento condiviso da un amico, da RUSE Launcher o RUSE Mod Manager. Il nuovo set di mod riceve le mod che hai, nello stesso ordine."

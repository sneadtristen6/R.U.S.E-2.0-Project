RUSE Studio、RUSE Launcher 和我们的在线服务：Mod 列表、RUSE Guard 服务器、带有私有仓库的 Bug Watch 服务器，以及 Steam 登录服务器。本协议订立于你与 R.U.S.E. 2.0 项目之间（GitHub 和我们 Discord 上的 sneadtristen6）。

2. 我们是谁，不是谁
R.U.S.E. 是 Eugen Systems 开发、Ubisoft 发行的游戏。你需要自己的游戏副本。R.U.S.E. 2.0 是一个免费的社区项目，并非由 Eugen Systems 或 Ubisoft 制作、批准或支持。游戏及其文件仍归他们所有。

3. 我们使用的许可与署名
- 我们的应用是 GNU 通用公共许可证第 3 版（GPL v3）下的自由开源软件。你可以使用、研究、修改和分享它们。如果你分享它们或修改后的版本，请保持 GPL v3，保留每一处署名，并提供源代码。
- 我们应用中他人的作品：LittleGroove 的 RUSE Mod Manager 引擎（GPL v3）、ProLution 的作品，以及 DomesticNukes 的 RUSE Guard 设计，均在应用的致谢页和项目页面中署名。
- 3D 模型、声音和贴图：CC BY 作品必须署名作者，如同我们的致谢页所做的那样；如果你在自己的 Mod 中重用，也请同样署名。CC0 作品无需署名，但我们仍会署名，也请你这样做。
- 应用附带的库和数据，各自连同其许可列在随应用提供的 THIRD_PARTY_NOTICES 中。
- 他人制作的 Mod 归其作者所有，遵循作者选择的条款。

4. 仅限自有副本
本项目只在你拥有 R.U.S.E. 时提供支持。在 Mod 游戏启动前，应用会根据 Steam 留下的文件检查游戏文件夹是否为你拥有的副本：Steam 的安装记录、Steam 自己的签名文件，以及没有让游戏脱离 Steam 运行的文件。这项检查不会发送任何内容。如果你的副本无法确认（R.U.S.E. 上架 Steam 之前的盒装版，或检查出错），会有一个窗口显示由这台电脑和游戏主文件生成的代码，以及如何在我们的 Discord 或 GitHub 上开票；只有你把代码粘贴到那里时，它才会离开你的电脑。我们会回复一个解锁码，只在那台电脑上有效。

5. RUSE Guard：我们的反作弊（必需）
目的：阻止真实 R.U.S.E. 多人对战中的作弊。Mod 可以改变游戏的玩法，所以 RUSE Guard 确保一场对战中的每个人玩的是同一个游戏，并且没有人用我们的工具对其他玩家作弊。使用 RUSE Studio 和 RUSE Launcher 即表示你接受 RUSE Guard。
- 起作用的地方：RUSE Guard 存在于应用构建的每一个 Mod 副本中，只在多人对战和合作对战中起作用。在单人游戏、对电脑的遭遇战、战役或回放中它什么也不做，Studio 在你制作 Mod 时也绝不会运行它。
- 加入码：Launcher 会给你的 Mod 游戏一个代码，代表其游戏版本、Mod 及其版本。你和一起游玩的人自行比对代码；代码绝不会发送给我们。没有 RUSE Guard 的副本没有加入码，所以和你一起游玩的人无法确认你运行的是同一个游戏。
- 程序检查：在多人对战或合作对战进行期间，RUSE Guard 会把你正在运行的程序名称与已知作弊工具列表对照，只报告列表中的名称；不读取其他任何内容。这项检查是 RUSE Guard 的一部分：接受使用应用所必需的 RUSE Guard，即包含这项检查。
- 在游戏提供时可能收集的内容：对改变玩法的游戏文件的检查，并与其他玩家比对；定期检查每个人的游戏是否保持一致；你保存的回放；对战详情（地图、模式、玩家的游戏内名称、结果、时间）；Mod 列表及其检查。目前游戏不提供对战记录，所以普通对战不会发送任何内容。
- 绝不收集的内容：你的文件、屏幕、按键，或多人对战和合作对战之外的任何内容。它绝不会读取你的电脑内存。当游戏写入自己的崩溃报告时，应用会在你的电脑上读取该报告：RUSE Guard 只取出它自己标记的行（见下文），Bug Watch（如果你勾选了）只取出第 6 节列出的游戏崩溃信息。报告本身绝不会离开你的电脑。
- 作弊副本：用作弊工具或测试工具构建的 Mod 副本只能离线游玩。如果被带进多人对战或合作对战，它会在几秒后投降，然后在对战结束画面停止游戏并返回桌面。随后游戏自己的崩溃报告程序可能会把报告发送给游戏的开发商，报告中带有 RUSE Guard 的一行，说明一个作弊副本已被停止。Launcher 会把这一行发送给我们，去除所有 Steam ID、长数字和路径，并归在你的用户名下。诚实的副本绝不会被停止。
- 没有自动封禁。如果有什么看起来不对，我们的审核团队（DomesticNukes 和 sneadtristen6）会查看证据，有回放时也查看回放，然后作出决定。你可以在我们的 Discord 或 GitHub 上向 sneadtristen6 申诉。
- 记录保留多久：一场对战的记录会在该对战最后一位玩家的记录送达我们的审核服务器 48 小时后自动删除。有未结审核的对战会保留到审核作出决定；被驳回的随后删除。如果作弊被确认，证据会在玩家可以申诉的期间保留；申诉结束或审核团队释放后，只保留决定本身，以便执行。
- 可能的后果：确认作弊可能使你失去通过 R.U.S.E. 2.0 进行多人游戏的资格。这绝不会影响你的 Steam 账号或游戏本身。
- 如何退出：使用应用必须接受 RUSE Guard；要退出，请停止使用这些应用。

6. Bug Watch：帮助我们发现并修复错误（可选，推荐）
目的：让 Studio 和 Launcher 对你运行得更好，并让开发更轻松。我们无需等待有人报告崩溃，就能看到它、看到导致它的原因，并更早修复。
如果你勾选此项，Studio 和 Launcher 会统计你使用了什么以及何时出了问题，并每天一次发送给我们的开发者。设置中会逐字显示将要发送的内容。简单地说，它包括：
- 第一次在你电脑上生成的报告码（以便把你的崩溃归在一起），以及你的用户名；
- 应用及其版本、日期、你的 Windows 版本、语言、游戏的构建版本、RUSE Guard 是否开启，以及你接受了本协议的哪个版本；
- 应用各部分的使用频率和各项操作耗时，出了什么问题以及在哪里（仅限我们自己的代码），你开启了我们列表中的哪些 Mod 以及各玩了多少分钟，以及你有多少个自己的 Mod、它们包含哪些种类的内容，例如单位、地图、任务或脚本（只按种类计数，不记名，也绝不包括其中的文字、路径或文件）；
- 应用崩溃时：错误类型和在我们代码中的位置；游戏崩溃时：崩溃代码、游戏停止的位置和导致停止的游戏中最多 16 个位置、游戏当时试图读写或执行的内存位置、缩短了文件路径的游戏自身错误文本、当时所在的地图（游戏自带地图发送其名称；Mod 制作的地图只发送“Mod 的地图”，绝不发送其名称）、游戏当时正在创建的单位（游戏自带单位发送其编号；Mod 添加的单位只发送“Mod 的单位”），以及当时开启的 Mod。只有当应用能从游戏的崩溃报告中读出单位时，才会发送它。
只有我们的开发者能看到：它保存在我们的服务器上，以及（建好后）只有我们的开发者能打开的私有仓库中。绝不发送：你的真实姓名、Steam 账号、文件或路径，以及你自己的 Mod 的名称和其中的文字；游戏的崩溃文件绝不会离开你的电脑。你的统计和崩溃报告会在 7 天后删除；只有我们仍在修复的非常严重的崩溃会保留更久，直到修复为止，之后我们只保留不含姓名和代码的总数（例如"那天 0.9.9 版有 12 次构建失败"）。除非你勾选，否则它是关闭的。你可以随时在设置中取消勾选：之后不再统计或发送任何内容，已保存的内容会被删除。要立即删除你报告码下保存的所有内容，请在我们的 Discord 或 GitHub 上提出。

7. 通过 Steam 登录
目的：确认你拥有 R.U.S.E.，用于在线游戏、RUSE Guard 和内容下载。目前还没有任何功能需要它；应用只会询问一次，Launcher 的设置中随时可以打开。
- 你在浏览器中 Steam 自己的页面上登录。我们绝不会看到你的密码。
- Steam 只告诉我们的服务器一件事：你的账号是否拥有 R.U.S.E.。如果拥有，我们的服务器会交给你的电脑一个签名通行证，有效期 30 天。
- 我们的服务器保存的内容：由你的 Steam 账号和我们的一个密钥生成的单向代码，以及通行证的签发时间和到期时间。它绝不会保存你的 Steam ID 或 IP 地址。登录码本身以哈希形式保存十分钟，Steam 的一次性登录编号保存一天，以防登录被重放。
- 你的电脑保存的内容：通行证，存放在应用的设置中。设置中可以退出登录，退出即删除它；要删除服务器上你的登录记录，请在我们的 Discord 或 GitHub 上提出。
- 如果你 Steam 个人资料的游戏列表是私密的，Steam 就无法告诉我们；请把游戏详情设为公开一分钟，或申请解锁码。

8. 你的用户名
目的：让我们知道某次崩溃或对战属于谁，以便帮助那个人。你在第一次启动时选择用户名（会附加一个短数字，例如 Nick#4821），因为 RUSE Guard 对每个人都是必需的。它只随与你相关的内容一起发送：你的 RUSE Guard 对战记录，以及（如果你勾选了 Bug Watch）你的 Bug Watch 统计。一个用户名同时用于 Studio 和 Launcher，你可以在设置中更改。要删除你的用户名和数据，请在我们的 Discord 或 GitHub 上提出。

9. 无担保
这些应用免费，按原样提供，不附带任何担保（GPL v3 第 15 和 16 条）。它们构建游戏的 Mod 副本，不改动你已安装的游戏。对于游戏、你的 Steam 账号或因使用应用造成的任何损失，我们概不负责。

10. 变更
本协议变更时，应用会在你继续之前再次显示它。

11. 联系方式
问题、错误报告和申诉：在我们的 Discord（Mod 请求频道，或实验 / 进行中的工作频道）或 GitHub 上。安全问题：按照我们的安全政策私下联系。


[set_bugwatch_help]
us = "Recommended: it helps us fix crashes and bugs faster. If you tick it, the apps send our developers crash details right away and, once a day, counts of what you use and what goes wrong, with your username and install ID, never your files. We never ask for your real name. Reports are deleted from our server after 7 to 8 days, unless we mark a very severe crash's report to keep until we've fixed that crash. It's off unless you tick it. Untick it any time, here or in Settings."
fr = "Recommandé : il nous aide à corriger plus vite les plantages et les bugs. Si vous le cochez, les applications envoient à nos développeurs les détails des plantages tout de suite et, une fois par jour, des comptages de ce que vous utilisez et de ce qui tourne mal, avec votre nom d'utilisateur et votre identifiant d'installation, jamais vos fichiers. Nous ne demandons jamais votre vrai nom. Les rapports sont supprimés de notre serveur au bout de 7 à 8 jours, sauf si nous marquons le rapport d'un plantage très grave pour le garder jusqu'à ce que nous ayons corrigé ce plantage. C'est désactivé tant que vous ne le cochez pas. Décochez-le à tout moment, ici ou dans les Réglages."
ger = "Empfohlen: Es hilft uns, Abstürze und Fehler schneller zu beheben. Wenn du das Häkchen setzt, schicken die Apps unseren Entwicklern sofort Absturzdetails und einmal am Tag Zählungen dessen, was du benutzt und was schiefgeht, mit deinem Benutzernamen und deiner Installations-ID, nie deine Dateien. Wir fragen nie nach deinem echten Namen. Berichte werden nach 7 bis 8 Tagen von unserem Server gelöscht, außer wir markieren den Bericht eines sehr schweren Absturzes, damit er bleibt, bis wir diesen Absturz behoben haben. Es ist aus, bis du das Häkchen setzt. Nimm es jederzeit wieder weg, hier oder in den Einstellungen."
ita = "Consigliato: ci aiuta a correggere più in fretta crash e bug. Se metti la spunta, le app inviano subito ai nostri sviluppatori i dettagli dei crash e, una volta al giorno, i conteggi di ciò che usi e di ciò che va storto, con il tuo nome utente e il tuo ID di installazione, mai i tuoi file. Non chiediamo mai il tuo nome vero. I rapporti vengono eliminati dal nostro server dopo 7-8 giorni, a meno che non segniamo il rapporto di un crash molto grave per tenerlo finché non avremo corretto quel crash. Resta spento finché non lo spunti. Togli la spunta quando vuoi, qui o nelle Impostazioni."
spa = "Recomendado: nos ayuda a arreglar antes los cierres y los errores. Si lo marcas, las aplicaciones envían a nuestros desarrolladores los detalles de un cierre inesperado al instante y, una vez al día, recuentos de lo que usas y de lo que falla, con tu nombre de usuario y tu ID de instalación, nunca tus archivos. Nunca pedimos tu nombre real. Los informes se borran de nuestro servidor a los 7 u 8 días, salvo que marquemos el informe de un cierre muy grave para conservarlo hasta que arreglemos ese cierre. Está desactivado hasta que lo marques. Desmárcalo cuando quieras, aquí o en Ajustes."
pol = "Zalecane: pomaga nam szybciej naprawiać awarie i błędy. Jeśli to zaznaczysz, aplikacje od razu wysyłają naszym programistom szczegóły awarii, a raz dziennie liczniki tego, czego używasz i co idzie nie tak, z twoją nazwą użytkownika i identyfikatorem instalacji, nigdy z twoimi plikami. Nigdy nie pytamy o twoje prawdziwe imię i nazwisko. Raporty są usuwane z naszego serwera po 7 do 8 dniach, chyba że oznaczymy raport bardzo poważnej awarii do zachowania, dopóki nie naprawimy tej awarii. Jest wyłączone, dopóki tego nie zaznaczysz. Odznacz w dowolnej chwili, tutaj lub w Ustawieniach."
ru = "Рекомендуется: это помогает нам быстрее исправлять вылеты и ошибки. Если вы поставите галочку, приложения сразу отправляют нашим разработчикам сведения о вылетах, а раз в день — счётчики того, чем вы пользуетесь и что идёт не так, вместе с вашим именем пользователя и ID установки, но никогда не ваши файлы. Мы никогда не спрашиваем ваше настоящее имя. Отчёты удаляются с нашего сервера через 7–8 дней, если только мы не пометим отчёт об очень тяжёлом вылете, чтобы хранить его, пока мы не исправим этот вылет. Выключено, пока вы не поставите галочку. Снять её можно в любой момент — здесь или в Настройках."
cz = "Doporučeno: pomáhá nám rychleji opravovat pády a chyby. Pokud ho zaškrtnete, aplikace posílají našim vývojářům hned podrobnosti o pádech a jednou denně počty toho, co používáte a co se pokazí, s vaším uživatelským jménem a ID instalace, nikdy ne vaše soubory. Nikdy se neptáme na vaše skutečné jméno. Hlášení se z našeho serveru mažou po 7 až 8 dnech, pokud hlášení o velmi závažném pádu neoznačíme k uchování, dokud ten pád neopravíme. Je vypnutý, dokud ho nezaškrtnete. Zaškrtnutí můžete kdykoli zrušit, tady i v Nastavení."
jpn = "おすすめ: クラッシュや不具合をより早く直すのに役立ちます。チェックを入れると、アプリはクラッシュの詳細をすぐに、そして 1 日 1 回、使った機能や失敗したことの回数を、あなたのユーザー名とインストールIDを付けて開発者に送ります。ファイルは送りません。本名は求めません。報告は 7～8 日後に私たちのサーバーから削除されます。ただし、特に深刻なクラッシュの報告は、私たちがそのクラッシュを直すまで残すよう印を付けることがあります。チェックを入れるまではオフで、ここでも「設定」でも、いつでもチェックを外せます。"
sc = "推荐:它能帮助我们更快修复崩溃和错误。如果你勾选它,应用会立即把崩溃详情发送给我们的开发者,并且每天一次发送你使用了什么、出了什么问题的统计,附带你的用户名和安装 ID,绝不包含你的文件。我们从不询问你的真实姓名。报告会在 7 到 8 天后从我们的服务器删除,除非我们把某次非常严重的崩溃的报告标记为保留到我们修复那次崩溃为止。除非你勾选,否则它是关闭的。你可以随时在这里或在设置中取消勾选。"
fa = "توصیه‌شده: کمک می‌کند خرابی‌ها و باگ‌ها را زودتر درست کنیم. اگر تیکش را بزنید، برنامه‌ها جزئیات خرابی را بی‌درنگ و، روزی یک بار، شمارش آنچه به کار می‌برید و آنچه خراب می‌شود را برای برنامه‌نویسان ما می‌فرستند، همراه با نام کاربری و شناسهٔ نصب شما، هرگز فایل‌هایتان را. ما هرگز نام واقعی شما را نمی‌خواهیم. گزارش‌ها پس از 7 تا 8 روز از سرور ما پاک می‌شوند، مگر این‌که گزارش یک خرابی بسیار جدی را برای نگه داشتن تا وقتی آن خرابی را درست کنیم علامت بزنیم. تا تیکش را نزنید خاموش است. هر زمان تیکش را بردارید، اینجا یا در «تنظیمات»."


ger = "Verglichen mit Ihrer sauberen Sicherung des Spiels, damit schon in den Spielordner kopierte Mods nicht hineingeraten."
ita = "Confrontato con il tuo backup pulito del gioco, così le mod già copiate nella cartella del gioco non si mescolano."
spa = "Comparado con tu copia de seguridad limpia del juego, para que no se mezclen los mods ya copiados en la carpeta del juego."
pol = "Porównane z twoją czystą kopią zapasową gry, więc mody już skopiowane do folderu gry się nie wmieszają."
ru = "Сравнивается с вашей чистой резервной копией игры, поэтому моды, уже скопированные в папку игры, не примешиваются."
cz = "Porovnáno s vaší čistou zálohou hry, takže mody už zkopírované do složky hry se nepřimíchají."
jpn = "ゲームのクリーンなバックアップと比べるので、ゲームフォルダーに既にコピーされたMODが混ざりません。"
sc = "与你的游戏干净备份比较，因此已复制到游戏文件夹中的模组不会混入。"
fa = "با پشتیبان تمیز بازی شما مقایسه شد، تا مادهایی که پیش‌تر در پوشهٔ بازی کپی شده‌اند قاطی نشوند."

[convert_ref_game]
us = "Compared with your game folder, as there's no clean backup. If you ever copied mods into the game folder, make a clean backup first (Settings) after letting Steam repair the game, or their changes end up in this mod too."
fr = "Comparé avec le dossier du jeu, faute de sauvegarde propre. Si vous avez déjà copié des mods dans le dossier du jeu, faites d'abord une sauvegarde propre (Réglages) après une réparation par Steam, sinon leurs changements se retrouveront aussi dans ce mod."
ger = "Verglichen mit Ihrem Spielordner, da es keine saubere Sicherung gibt. Wenn Sie je Mods in den Spielordner kopiert haben, lassen Sie Steam das Spiel reparieren und machen Sie zuerst eine saubere Sicherung (Einstellungen), sonst landen deren Änderungen auch in diesem Mod."
ita = "Confrontato con la cartella del gioco, perché non c'è un backup pulito. Se hai mai copiato mod nella cartella del gioco, fai prima riparare il gioco da Steam e crea un backup pulito (Impostazioni), altrimenti le loro modifiche finiscono anche in questa mod."
spa = "Comparado con la carpeta del juego, porque no hay copia de seguridad limpia. Si alguna vez copiaste mods en la carpeta del juego, deja que Steam repare el juego y haz primero una copia limpia (Ajustes), o sus cambios acabarán también en este mod."
pol = "Porównane z folderem gry, bo nie ma czystej kopii zapasowej. Jeśli kiedyś kopiowałeś mody do folderu gry, najpierw pozwól Steamowi naprawić grę i zrób czystą kopię (Ustawienia), inaczej ich zmiany trafią też do tego moda."
ru = "Сравнивается с папкой игры, так как чистой резервной копии нет. Если вы когда-либо копировали моды в папку игры, сначала дайте Steam восстановить игру и сделайте чистую копию (Настройки), иначе их изменения тоже попадут в этот мод."
cz = "Porovnáno se složkou hry, protože čistá záloha chybí. Pokud jste někdy kopírovali mody do složky hry, nechte nejdřív Steam hru opravit a udělejte čistou zálohu (Nastavení), jinak se jejich změny dostanou i do tohoto modu."
jpn = "クリーンなバックアップがないため、ゲームフォルダーと比べます。以前ゲームフォルダーにMODをコピーしたことがあるなら、先にSteamでゲームを修復し、クリーンなバックアップ（設定）を作ってください。そうしないと、それらの変更もこのMODに入ります。"
sc = "由于没有干净备份，将与游戏文件夹比较。如果你曾把模组复制到游戏文件夹，请先让 Steam 修复游戏并制作干净备份（设置），否则它们的改动也会进入这个模组。"
fa = "با پوشهٔ بازی شما مقایسه شد، چون پشتیبان تمیزی نیست. اگر زمانی مادهایی را در پوشهٔ بازی کپی کرده‌اید، اول بگذارید Steam بازی را تعمیر کند و بعد یک پشتیبان تمیز بسازید («تنظیمات»)، وگرنه تغییرات آن‌ها هم وارد این ماد می‌شود."


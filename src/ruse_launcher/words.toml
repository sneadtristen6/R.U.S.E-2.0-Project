Pourquoi : pour que nous sachions de qui est tel plantage ou telle partie, et puissions aider cette personne. Vous choisissez un nom d'utilisateur au premier démarrage (un court numéro y est ajouté, comme Nick#4821), parce que RUSE Guard est obligatoire pour tous. Il n'est envoyé qu'avec ce qui vous concerne : vos enregistrements de parties RUSE Guard et, si vous avez coché Bug Watch, vos comptages Bug Watch. Un seul nom d'utilisateur sert pour le Studio et le Launcher, et vous pouvez le changer dans les Paramètres. Pour faire supprimer votre nom d'utilisateur et vos données, demandez sur notre Discord ou GitHub.


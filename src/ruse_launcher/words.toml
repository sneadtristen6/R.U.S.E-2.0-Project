- 为了使用模组游玩,应用会在你的电脑上构建一份单独的模组版游戏副本。在某些情况下,游戏数据可能会被更改,但这是针对你的游戏副本:那份模组版副本。模组会修改它的数据,有些还会修改它的脚本。我们的应用会在每个模组版副本中,把 RUSE Guard 的脚本和少量它们自己的小型防护添加到游戏脚本中;这些防护只在游戏本来会因错误而停止的地方起作用。另外,有些模组组合需要对该副本的程序文件打一个小型游戏补丁,应用会从我们的 GitHub 页面下载它。
- 应用绝不会在游戏运行时向游戏中放入任何东西。它们只查看游戏是否在运行以及从哪里运行,当你按下故障排查工具的修复时,它可以结束一个仍从模组版副本运行的游戏。
- 游戏有自己的崩溃报告程序,由游戏的制作者所做。游戏崩溃时,无论是你已安装的游戏还是模组版副本,该程序都可能把它自己的崩溃报告发送给游戏的制作者。它是游戏的,不是我们的:我们的应用绝不发送它的报告,也不开启或关闭它。
- 我们的应用绝不会改动你已安装的游戏,除非你要求 Launcher 或 Studio 从干净备份中恢复它。恢复会把游戏自己的文件放回去,并把被添加的文件和被它替换的版本移到一旁。
- 他人制作的模组归其作者所有,遵循作者选择的条款。修改游戏脚本的模组会被标出,Launcher 会等你为每一个模组勾选“我信任这个模组的作者”,并且该模组的每个新版本都要重新勾选。

4. 你在 GPL 下的权利、我们使用的许可,以及署名
- RUSE Studio 和 RUSE Launcher 是 GNU 通用公共许可证第 3 版(GPL v3)下的自由软件。本协议中的任何内容都不限制 GPL 允许你做的事:无论你是否接受本协议,你都可以在 GPL 下运行、研究、修改和分享这些应用的代码。我们发布的应用要求你在使用前接受本协议;这是它们的工作方式,不是对你 GPL 权利的限制。本协议涵盖使用它们、RUSE Guard 以及我们的在线服务。如果你分享这些应用或修改后的版本,请保持 GPL v3,保留版权声明和署名,并提供其源代码。修改后的版本不是我们发布的应用;本协议和我们的支持不涵盖它。
- 我们应用中他人的作品:LittleGroove 的 RUSE Mod Manager 引擎(GPL v3)、ProLution 的作品,以及 DomesticNukes 的 RUSE Guard 设计。每一项都在我们 GitHub 上的项目页面中署名。
- 随应用提供的库和 3D 模型,以及应用可以为你下载的动作集、时代单位、贴图和航拍照片,连同它们的作者和许可,都列在 THIRD_PARTY_NOTICES 中,这是随应用提供的一个文件;设置中的“条款、致谢和许可”会显示它。片头的引擎声音也列在那里。模组中的时代单位也会在该模组自己的致谢文件中署名。CC BY 许可(一种知识共享许可)下的作品,只有在向其作者署名的情况下才可重用:如果你在自己的模组中重用其中一件,请以同样方式署名作者,并保留指向其许可的链接。CC0 下的作品无需署名,但我们仍会署名,也请你这样做。

5. 仅限自有副本
本项目只在你拥有 R.U.S.E. 时提供支持。应用启动时,以及模组版游戏启动前,它们会检查游戏文件夹中是否是通过 Steam 安装的副本:Steam 的安装记录、Steam 自己的签名文件,以及没有让游戏脱离 Steam 运行的文件。这是我们自己的检查,不是 Steam 或 Eugen Systems 的,它也不能证明谁拥有这款游戏。这项检查不会发送任何内容。
如果你的副本无法确认(R.U.S.E. 上架 Steam 之前的盒装版,或检查出错),会有一个窗口显示一个文件夹代码。它由你的电脑根据你的 Windows(或 Linux)安装的 ID,或者在没有时根据你的网卡 ID,以及游戏的主文件生成。它是单向的:无法还原成那些 ID。只有当你把它粘贴到某处,或按下“在 GitHub 提交工单”时,它才会离开你的电脑;后者会在你的浏览器中打开 GitHub 的工单页面,代码已经包含在页面的地址中。在你自己发布之前,什么都不会被发布,而 GitHub 工单是公开的。你也可以改为在 Discord 上通过私信把代码发给 sneadtristen6。我们会回复一个解锁码,只在那台电脑上、对该版本的游戏主文件有效。我们只因你的请求,用你的文件夹代码来解锁你的副本,除你的工单或消息之外,我们不保留文件夹代码的任何记录。

6. RUSE Guard:我们的反作弊(必需)
目的:阻止用我们的应用构建的副本所进行的 R.U.S.E. 多人对战和合作对战中的作弊。模组可以改变游戏的玩法。所以每个其模组改变玩法的副本都会得到一个加入码,供你与一起游玩的人比对。用作弊工具或测试工具构建的副本会检查对战中的每位玩家是否构建版本相同,如果不同就放弃该对战。在多人对战和合作对战中,RUSE Guard 还会查找你电脑上正在运行的已知作弊工具。并且每个副本的监视器都会在屏幕上显示某场对战出现了生成命令或某一方金钱的突然暴增。
为什么它是必需的:使用我们的应用必须有 RUSE Guard。R.U.S.E. 没有有效的反作弊,这就是需要 RUSE Guard 的原因:它帮助把作弊挡在多人对战之外,而公平的对战对我们以及你遇到的每位玩家都很重要。我们依据的是数据保护法所说的“正当利益”:让每位玩家都能进行公平的对战,只要你的隐私权没有压过它,就不需要你的许可(第 11 节)。所以它不像 Bug Watch 那样是一个勾选框:我们发布的 Studio 和 Launcher 始终包含它。你仍可随时反对(第 11 节)。
- 它在哪里起作用:RUSE Guard 存在于应用构建的每个模组版副本中,Launcher 的原版也会构建这样一份没有模组的副本(第 10 节)。它的锁定和程序检查只在多人对战和合作对战中起作用,对战记录一旦开始(见下文)也将如此。它的监视器同样存在于每个模组版副本中,监视多人对战、合作对战和对电脑的遭遇战:当某一方的金钱一次增加 400 或更多,或者有单位由生成命令制造时,它可以在你自己的屏幕上显示提示。在多人对战中,每位玩家的屏幕都可能显示它。监视器不改变对战中的任何内容,也不发送任何内容。只有 Launcher 会为 RUSE Guard 发送内容;Studio 从不发送,它的“在游戏中测试”也不运行程序检查。
- 列表:RUSE Guard 的已知作弊工具列表随应用提供,是一个你可以阅读的普通文件,只会随应用更新而改变。它不会下载任何内容。
- 程序检查:在由 Launcher 启动的多人对战或合作对战中,RUSE Guard 每 30 秒查看一次你电脑上正在运行的程序的名称,只保留列表上的名称。为了知道这样的对战何时进行,Launcher 会在游戏运行时读取游戏自己的错误输出:它只保留 RUSE Guard 那些说明对战正在进行或已结束的简短行,其他每一行在读取后立即丢弃,绝不保留或发送(该输出也可能包含 Steam 自己的行,其中一行带有你的 Steam 账号数字)。如果游戏没有说明对战已结束,检查会在游戏最后一次说对战正在进行的两分钟后停止。如果对战期间有列表中的程序在运行,Launcher 会在游戏结束后向我们的服务器发送一条简短记录:你的用户名和 RUSE Guard 密钥、对战开始和结束的时间、它是多人对战还是合作对战,以及找到的列表中程序的名称。除此之外不包含任何内容:没有回放,没有文件,也没有关于对战的其他任何信息。如果没有列表中的程序在运行,就不会发送任何内容。
- 加入码:对于其模组改变游戏玩法的模组版副本,Launcher 会显示一个加入码。它代表该副本的游戏版本、它的模组及其版本,以及它们对游戏玩法的改变。你与一起游玩的人比对加入码。我们目前不会收到它们;对战记录(见下文)则会带上它们。
- 用作弊工具或测试工具构建的副本:这样的副本只能与构建版本相同(游戏版本相同,模组及其版本也相同)的玩家进行多人对战和合作对战。在每场这样的对战开始大约一秒后,它会向每位玩家的游戏告知一个代表其构建的简短代码(它的构建码),由游戏的版本、按顺序排列的模组及其版本,以及它们对游戏玩法的改变生成。它不包含任何姓名或账号。如果每位玩家的构建都相同,这场对战就会按设计继续进行;目前还没有人用两个人玩过这样的对战。如果不同,它会在几秒后放弃这场对战。
  在未计入排名的多人对战中,它随后会在那场对战的结算画面故意停止游戏:游戏崩溃并返回桌面。随后游戏自己的崩溃报告程序可以把它的报告发送给游戏的制作者,报告中带有 RUSE Guard 的一行,说明一个作弊副本已被停止。在合作对战和排名对战中,它只放弃对战。如果游戏是由 Launcher 启动的,并且游戏停止时 Launcher 仍然开着,Launcher 只会从你电脑上游戏的崩溃报告中取出 RUSE Guard 的那一行,并向我们的服务器发送一条简短通知,说明一个作弊副本已被停止,归在你的用户名和 RUSE Guard 密钥下,并附上崩溃报告写入的时间和通知生成的时间。这一行只说明对战的类型和你在其中的阵营编号;其中任何 Steam ID、长数字或路径都会被去除。我们的应用绝不发送崩溃报告本身。通知不会发起审核,也不决定任何事;它只是列出来供 sneadtristen6 查看。如果 Launcher 在游戏停止之前就被关闭了,或者游戏是从 Studio 或手动启动的,就不会发送通知。在 Linux 和 Steam Deck 上,是否发送通知目前尚不清楚。
  诚实的副本绝不会被停止。
- 你的 RUSE Guard 密钥:Launcher 第一次在你的电脑上生成 RUSE Guard 记录时,会在那里生成一个随机密钥。由这个密钥生成的代码(它的公开部分)会随每条记录一起发送,这样我们就能把你的记录与使用相同用户名的人的记录区分开,并检查它们没有被更改。它不说明关于你的任何其他信息。设置中会显示一个由它生成的简短代码,“你的 RUSE Guard 代码”:把它随隐私请求一起发送,我们就能找到你自己的 RUSE Guard 记录。为此不会发送其他任何内容。
- 尚未启用:对战记录。它们需要游戏目前还无法写出的对战记录。在它们开始之前,我们会更新本文,应用会再次向你显示。开始之后,一条对战记录将包含:你的用户名和 RUSE Guard 密钥;你的阵营;你的副本的代码;对你的副本所更改的游戏文件的检查,以及对每位玩家的游戏保持不变的定期检查;你的模组及其检查;你的模组把哪些脚本命令绑定到按键(绝不包括你按了什么);对于开发者的测试副本,开发者的密钥;发现正在运行的列表中作弊工具的名称;对战开始和结束的时间;以及在对战期间或刚结束后保存在你电脑上的最新回放及其文件名。回放包含每位玩家在对战中下达的每一条命令,它的文件名和内容可能包含你和其他玩家的游戏内名称。
- 它绝不做的事:它绝不收集你的屏幕或按键,绝不在其他程序运行时查看它们内部,也绝不向我们发送你的文件,只有对战记录会带上的回放除外。对于游戏的崩溃报告,它只在你的电脑上读取它自己关于被它停止的作弊副本的那一行(见上文)。
- 开发者的测试副本:这些应用被设计为允许开发者的测试副本凭我们给的一个特殊密钥进入对战,这是绕过作弊副本规则的唯一途径。目前还没有任何一个可用:应用目前无法检查这样的密钥。
- 关于你的决定:没有自动封禁。关于作弊的任何决定都不是仅由机器作出的:sneadtristen6 会查看证据,有回放时也查看回放,然后作出决定。Anthropic 的 AI 助手 Claude 会协助他阅读 RUSE Guard 的记录,遵循 Anthropic 自己的条款;决定由他作出。一条点名列表中作弊工具的记录会为他发起一次审核,在他作出决定之前它不决定任何事。你可以在决定作出后 30 天内申诉(第 17 节);sneadtristen6 是唯一审核案件的人,所以申诉也由他本人决定。唯一的自动规则是上文的作弊副本规则。它源于你选择构建的那份副本,并且绝不触及你的 Steam 账号或你已安装的游戏。
- 目前一项决定意味着什么:如果作弊被确认,我们会把该决定记在你的用户名下,保存在我们的被标记玩家名单中,并在查看之后的对战时使用它。由于两位玩家可能使用相同的用户名,我们还会查看记录附带的是哪个 RUSE Guard 密钥。我们的 RUSE Guard 服务器保存这份名单,每个被标记的用户名连同其记录最初附带的 RUSE Guard 密钥,并且只告诉该玩家自己的 Launcher 它被标记了。应用目前不会对标记采取行动。如果以后的版本这样做,例如通过 R.U.S.E. 2.0 把被标记玩家的模组版副本挡在多人对战之外,本文会先说明。如果申诉获得支持,该决定会被标记为已推翻,用户名会从名单中移除。
- 记录保留多久,以及你的权利:第 11 节。

7. Bug Watch:帮助我们发现并修复错误(可选,推荐)
目的:让 Studio 和 Launcher 运行得更好,并更快修复崩溃:我们不必等待有人报告崩溃,就能看到它以及导致它的原因。
依据什么:只有在你同意时(你的同意,第 11 节)。除非你勾选,否则它是关闭的。保存或更改你的用户名绝不会开启或关闭它。勾选它不会改变应用中的其他任何内容,只是会改变游戏崩溃后 Launcher 告诉你的内容(见下文)。当应用在更改后再次显示这些条款时:如果 Bug Watch 已开启,它的框会问“是否保持 Bug Watch 开启？”,并且是勾选状态;保留勾选即保持开启,取消勾选即关闭。如果它是关闭的,Bug Watch 的框会再次出现,未勾选。
开启期间,Studio 和 Launcher 会向我们的服务器发送:
- 每天一次,每个已结束的日子的统计:
  - 应用及其版本;日期;你使用的是 Windows 10 还是 11;应用的语言;游戏的版本;RUSE Guard 是否内置;你接受了这些条款的哪个版本;
  - 应用的各个部分被使用的频率以及各项操作的耗时;出了什么问题以及在哪里(仅限我们自己的代码;当 Studio 某个界面自己的脚本出错时,只有该界面的名称和错误的类型,绝不包括错误的文字、文件或行号);对于每项长任务,例如模组构建,它完成或失败了多少次,以及有多少次构建发现了模组中的错误;
  - 当天的失败列表,最多 20 条,每条带有它的代码(我们代码中的哪个位置)、“开始游戏”或“在游戏中测试”进行到了哪一步、模组组合的形态(我们列表中的模组有多少个、你自己的模组文件夹和模组文件各有多少个,均为数量),以及旁边只有不指向任何人的数字:Windows 错误号(例如磁盘已满)、网络服务器的应答(例如 404)、游戏的退出号、一个计数和第二个代码;
  - 提供了、安装了或失败了多少次更新;应用崩溃了多少次;故障排查的哪些检查发现了问题;
  - 你开启了我们列表中的哪些模组;你总共玩了多少分钟,以及使用其中每个模组各玩了多少分钟;
  - 你有多少个自己的模组,以及它们包含哪些种类的内容,例如单位、地图、任务或脚本(只按种类计数,不记名,也绝不包括其中的文字、路径或文件);
- 立即发送,当应用崩溃时:错误的类型和它在我们代码中的位置;
- 立即发送,在应用启动的游戏崩溃之后:关于它在哪里以及如何崩溃的技术细节:
  - 游戏的错误代码;它停止时所在文件的名称(这可能是 Windows 的一部分、某个驱动程序,或者加载进游戏的其他程序,例如覆盖层)、游戏在其中停止的位置,以及导致此处的游戏中最多 16 个位置;
  - 对于内存错误,游戏当时试图做什么(读、写或运行)以及内存中的位置;
  - 对于脚本错误,游戏自己的错误文本,其中驱动器上的路径缩短为文件名,你的用户文件夹的名称被隐藏(其中文件夹的名称可以保留),Steam 账号数字和其他长数字被去除(游戏自己的脚本名称保留);游戏之前跳过了多少个错误;以及地图(游戏自带的地图用其名称,模组的地图只显示为“模组的地图”);
  - 游戏当时正在制造的单位,当应用能从游戏的崩溃报告中读出它时(游戏自带的单位用其编号,模组的单位只显示为“模组的单位”);
  - 当时开启了哪些模组,你自己的模组包含哪些种类的内容(按种类计数),以及你接受了这些条款的哪个版本。
Bug Watch 只使用游戏自己的崩溃报告。对于其他程序的报告,它只读取其中列出的文件名,以判断它不是游戏的;其中的任何内容都不会被发送。
每次发送都带有你的用户名和你的安装 ID,安装 ID 是你第一次选择用户名时在你电脑上生成的随机代码,无论你是否勾选 Bug Watch。你的报告码(设置中在 Bug Watch 开启时显示)是你的安装 ID 的前 8 个字符。
我们的应用绝不发送你的文件或游戏的崩溃报告文件本身,Bug Watch 也不发送 Steam 账号数字。(游戏自己的崩溃报告程序可以把它自己的报告发送给游戏的制作者:第 3 节。)游戏的错误文本可能包含来自游戏或模组脚本的名称。请不要使用你的真实姓名作为用户名(第 9 节)。
我们已知的崩溃:开启 Bug Watch 时,如果游戏以我们已知的某种方式崩溃,Launcher 会用你的语言告诉你游戏当时正在制造哪个单位以及原因。这个说明只显示给你,绝不发送;Bug Watch 的报告只按上文所述携带该单位(一个编号,或“模组的单位”)。为了了解这些崩溃,应用会在游戏启动时从我们的 Bug Watch 服务器下载我们的崩溃列表,除非你电脑上的列表不到一天,并且在崩溃时如果没有可用的列表则再下载一次。它们只在 Bug Watch 开启时下载,把它保存在你的电脑上,只有带有我们的签名才使用它,并在你的电脑上用它核对你的崩溃报告。下载不携带任何关于你的信息。没有列表时(例如第一次,或没有网络),Launcher 仍会告诉你游戏崩溃了,但不会说明是哪个单位或什么原因。取消勾选 Bug Watch 会从你的电脑上删除该列表。
无论 Bug Watch 开启还是关闭:如果 Launcher 启动的游戏崩溃,Launcher 会向你显示一个简短的崩溃代码,由你的电脑根据游戏停止的位置生成。它不会被发送到任何地方。“复制代码”按钮可以复制它。如果你想要帮助,请把代码和消息的截图发给 Discord 上的 XUL(XUL6x3),或发到 GitHub 上,我们会在自己的列表中查找它。这个代码只说明游戏停止的位置。
设置会逐字向你显示今天的统计,就像它们将被发送的那样,以及等待发送的报告的名称。无法发送的报告会在你的电脑上最多等待 30 天,然后被丢弃。当应用启动的游戏正在运行时,Bug Watch 还会在你的电脑上为它保存一条小记录,以便应用下次启动时能判断游戏是否崩溃:它何时启动、最后一次被看到在运行是什么时候、它的模组(我们的模组记名称和版本,其他模组只记数量),以及副本和游戏安装在哪里(Windows 文件夹可能包含你的 Windows 用户名)。这条记录从不发送,30 天后删除,或在你取消勾选 Bug Watch 时立即删除。
谁能看到:我们的开发者。它由 Cloudflare 为我们存储在我们的 Bug Watch 服务器上。开启时,我们的服务器还会把关于我们跟踪的问题的笔记发布到一个私有 GitHub 仓库,即 GitHub 上只有我们的开发者能打开的空间。笔记里从不包含用户名或报告码。我们的开发者还会使用 Anthropic 的 AI 助手 Claude 来帮助阅读部分 Bug Watch 崩溃报告,遵循 Anthropic 自己的条款。
保留多久:每份报告在它到达服务器 7 天后的每日清理时从我们的服务器删除,也就是它到达后的 7 到 8 天。我们的开发者可以在修复某次崩溃期间,把某次非常严重的崩溃的报告标记为保留;被标记的报告会一直保留到他们取消标记,也就是那次崩溃被修复的当天,然后在下一次每日清理时删除。此后保留下来的内容,不含用户名、安装 ID 或报告码:每个应用版本的每日总数(例如“那天 0.9.9 版有 12 次模组构建失败”)以及每个版本和每种错误最早出现的日期,没有时间限制;以及我们的服务器关于它发现的问题的笔记(应用的哪个部分、我们列表中的哪个模组、崩溃发生在哪里,以及发生了多少次),保留到我们关闭该问题 3 天后为止。在最初 7 天里,在只有一个人使用某个版本的日子,它的总数就是那一个人的统计;此后,当天使用人数少于 3 个安装的版本或我们列表中的模组,只以“(other)”保留。GitHub 上的笔记会保留到我们删除它们为止。Cloudflare 会保留我们数据库 7 天的历史,所以我们删除的内容还会在该历史中再保留最多 7 天。sneadtristen6 电脑上的副本:第 11 节“存放在哪里”。
你可以随时在设置中(或在应用显示这些条款时的 Bug Watch 框中)取消勾选。从那时起不再统计或发送任何内容,应用会删除 Bug Watch 的统计和等待发送的报告。你的用户名和安装 ID 会保留在你的电脑上,因为 RUSE Guard 使用你的用户名。你取消勾选之前生成的任何内容以后都不会被发送,即使你再次勾选。取消勾选不会告诉我们的服务器任何事:已经到达服务器的内容按上文所述删除。若想更快地删除,请把你的报告码发邮件给我们(设置只在 Bug Watch 开启时显示它,所以请在取消勾选前记下),如果没有报告码,就发你的用户名:我们据此找到你的安装的报告并删除它们。总数和上文的笔记会保留。取消勾选不会撤销之前已发送的内容。

8. 通过 Steam 登录(可选)
目的:确认你拥有 R.U.S.E.,用于以后的在线游戏、RUSE Guard 和内容下载。目前还没有任何功能需要它。
依据什么:你提出请求(第 11 节)。应用可能在启动时提供它,Launcher 的设置随时可以打开它。
- 你在浏览器中 Steam 自己的页面上登录,地址由应用自己生成。我们绝不会看到你的密码。
- 然后 Steam 会把你的 Steam ID 告诉我们的服务器。我们的服务器向 Steam 询问该账号是否拥有 R.U.S.E.(只有你的 Steam 游戏详情是公开的才行),使用得到的答案,并且不存储该 ID。如果你拥有它,我们的服务器会交给你的电脑一个通行证(一个表明检查已通过的代码),有效期 30 天。
- 我们的服务器保存的内容:由你的 Steam ID 和我们的一个密钥生成的单向代码,以及你的通行证何时签发、何时到期,保存到你的通行证到期后 30 天。你的应用用来领取通行证的短时代码(登录码)只以打乱的形式保存;它在 10 分钟后到期,并在应用领取它时被删除,或在到期后约一小时内被删除。Steam 的一次性登录编号用来防止登录被重放;它们保存一天,即使登录失败也是如此,然后在大约一小时内删除。我们的代码绝不存储你的 IP 地址。
- 存放在哪里:我们服务器的数据库由 Cloudflare 存储在北美东部。
- 你的电脑保存的内容:通行证,存放在应用的设置中,直到你在设置中退出登录,退出会删除它。已到期的通行证也会保留到那时。
- 如果你的 Steam 游戏详情是私密的,Steam 就无法告诉我们。请把游戏详情设为公开一分钟,然后再试。
- R.U.S.E. 2.0 与 Valve 没有关联,也未得到 Valve 的认可。Valve 按照它自己的隐私政策处理你的登录。

9. 你的用户名
目的:让我们知道某份崩溃报告或对战记录属于谁,并能帮助那个人。每个人在第一次启动时选择一个,因为 RUSE Guard 是必需的。系统会附加一个 # 和四位随机数字,例如 Nick#4821。两位玩家仍可能得到相同的名字,所以我们还会参考你的 RUSE Guard 密钥或报告码。请不要使用你的真实姓名、你的 Steam 名称,或任何其他能识别你的内容。它只随你的 RUSE Guard 记录以及(如果开启了 Bug Watch)你的 Bug Watch 报告一起发送。一个用户名同时用于两个应用。你可以在设置中更改;更改它绝不会开启或关闭 Bug Watch。已经发送的记录在被删除之前会保留旧名字。要删除你的用户名和它名下的数据,请给我们发邮件。

10. R.U.S.E. 2.0 标题和片头(可选)
Launcher 和 Studio 构建的副本会显示游戏原本的标题和 Eugen 的标志视频。如果你勾选第一个界面上的框,或设置中“游戏标题”下的“使用金色 R.U.S.E. 2.0 标题和片头”,这些副本会在主菜单和载入画面显示金色的 R.U.S.E. 2.0,并且在游戏启动时用我们的片头代替 Eugen 的标志视频播放。金色标题由你的电脑根据你自己游戏的文件制作,铺在一张随应用提供的战斗场景图片之上。片头还使用了一个随应用提供的引擎声音。它只改变你的模组版副本,绝不改变你已安装的游戏,你可以随时在设置中更改。在 Launcher 中,原版会构建一份单独的无模组副本,和每个副本一样内含 RUSE Guard,并使用你选择的标题。


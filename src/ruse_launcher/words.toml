どこに保管されるか
私たちのサーバーのデータベースは、Cloudflare が北米東部で保管します。Cloudflare のネットワークは、世界中のデータセンターからそれらを提供します。RUSE Guard の記録は、審査のために、アメリカ合衆国にある sneadtristen6 自身のコンピューターに集められます。問題を調べているとき、Bug Watch の報告のコピーも彼のコンピューターにあることがあります。修正中の不具合に属するコピーは、その不具合が直ると削除され、不具合を示さないコピーは 7 日後に削除されます。sneadtristen6 はアメリカ合衆国にいて、Cloudflare はアメリカの会社なので、あなたのデータはアメリカ合衆国と、Cloudflare が運用しているところで扱われます。

どれだけ保管するか
- RUSE Guard の記録: 私たちの RUSE Guard サーバーは、各記録を審査用コンピューターが回収するまで保管し、届いてから 3 日を超えることは決してありません。その後は、回収されていてもいなくても削除されます。審査用コンピューターでは、対戦の記録は、最後の記録が届いてから約 48 時間後（次の整理のときで、これは記録を回収するたびに実行されます）に削除されます。ただし、その対戦の審査が開かれている場合を除きます。審査中の対戦は、決定が出るまで保管され、却下された場合はその後に削除されます。チートが確認された場合、決定から 30 日間は異議申し立てができ、証拠はその 30 日間保管され、異議申し立てをした場合は、それが決定されるまで保管されます。その後、証拠は削除され、決定だけが、それが有効な間は保管されます。異議申し立てが認められた場合、決定は覆されたものとして印が付けられ、あなたに不利に使われることは決してありません。お求めがあれば、それも削除します。チート入りコピーの停止通知は審査を開かず、sneadtristen6 が見られるように一覧に載るだけで、ほかの記録と同様に削除されます。
- 審査用コンピューターのユーザー名と RUSE Guard キーの一覧（それぞれが最初に見られた時刻とともに）: 今のところ期限なしで保管されます。メールでご連絡いただければ、あなたの分を削除します。
- あなたの PC にある RUSE Guard の記録: 送信待ちのものは送られるまで残り、私たちのサーバーが拒否したものは、脇に置かれてから 30 日後に削除されます。
- Bug Watch: 第7条。
- Steam サインイン: 第8条。
- チケット、メッセージ、メール: そのやり取りに必要な間。GitHub のチケットは、あなたか私たちが削除するまで残ります。
- 支援者のクレジット名: それ以降の各リリースに。お求めいただければ、今後のリリースからあなたの名前を外します。すでに公開されたリリースは変更できません。
- バックアップ: Cloudflare は、私たちのサーバーのデータベースの履歴を 7 日間保持します（Cloudflare 自身の文書にあるとおり、私たちの無料プランで）。そのため、私たちが削除したものは、削除後最大 7 日間その履歴に残ります。

あなたの権利
次のことを求められます。私たちが保有するあなたのデータの写し、その訂正、その削除、その件が解決されるまでの利用の停止、そして Bug Watch のデータとユーザー名を再利用できるファイルで受け取ること。Bug Watch への同意は、チェックを外すことでいつでも撤回できます。それ以前に送られたものは取り消されません。
方法: sneadtristen6@gmail.com にメールするか、Discord で sneadtristen6 に非公開メッセージを送ってください。ユーザー名、Bug Watch を使っている、または使っていた場合は報告コード（設定に表示されるのは Bug Watch がオンの間だけです）、そしてあなたの RUSE Guard コード（設定に「あなたの RUSE Guard コード」として表示されます）をお知らせください。Steam サインインについては、あなたの Steam ID もお知らせください。私たちのサーバーは本名を求めないため、これらがないとあなたのデータを見つけられないことがあります。請求があなたのものだと確信できない場合は、さらに情報をお尋ねすることがあります。1 か月以内に無料でお答えします。請求が複雑な場合は、さらに最大 2 か月かかることがあり、その理由もお伝えします。
アプリの使用をやめた場合、RUSE Guard の記録の削除をお求めいただければ、削除します。あなたのユーザー名でチートが確認されていた場合は、そのフラグと、それが基づく決定だけを保管します。つまり、あなたのユーザー名、対戦、判定、その日付、そしてフラグが付いたときの RUSE Guard キーです。審査中や異議申し立て中の件に、まだ必要なものも保管することがあります。
苦情: お住まいや勤務先、または問題が起きたと思われる場所のデータ保護当局に苦情を申し立てられます。フランスでは CNIL（cnil.fr）、英国では ICO（ico.org.uk）です。まず私たちに苦情を申し立てることもできます。英国にお住まいの場合は、苦情を受け取ったことを 30 日以内にお知らせします。

異議を述べる権利
あなた自身の状況に基づく理由で、RUSE Guard のための私たちのあなたのデータの利用に、いつでも異議を述べられます。メールでご連絡ください。私たちが同意した場合、チートのフラグとその決定（上記のとおり）を除き、あなたの RUSE Guard の記録を削除し、RUSE Guard は私たちのアプリを使うのに必須であること、つまり新しい記録を送らないための唯一の方法はアプリを使わないことだということをお伝えします。審査中や異議申し立て中のチートの件など、あなたの理由を上回るやむを得ない理由が私たちにある場合は、同意しないことがあります。

ほかのプレイヤー
今のところ RUSE Guard は、あなたの対戦のほかのプレイヤーについて、名前もリプレイも何も送りません。チート入りまたはテスト用コピーが、ほかのプレイヤーのゲームに伝えるのは、短いビルドコードだけです。のちのバージョンが、ほかのプレイヤーのゲーム内の名前を含むことがある対戦記録やリプレイを送る場合は、先にこの文書でお知らせします。この通知は公開されているので、私たちのアプリを使わないプレイヤーも読めます。誰でも、自分のゲーム内の名前で私たちが何を保有しているかを尋ねることができ、上の権利はその人のものでもあります。

追跡
アプリは、ほかのウェブサイトやアプリでのあなたの行動を追うことはなく、広告ネットワークやそのほかの外部の追跡サービスも含みません。アプリはウェブブラウザーではないため、ブラウザーの「Do Not Track」の信号は読みません。あなたの選択は、Bug Watch のチェックと、Steam サインインを使うかどうかです。


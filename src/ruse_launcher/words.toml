[set_backup_help]
us = "RUSE Launcher and RUSE Studio change the game's own folder only when you press Restore clean files; other mod managers and hand edits can change it too. Make a backup while the game is clean, right after Steam installs or verifies it. Check game files then shows what has changed since, and Restore clean files puts the game's files back."
fr = "RUSE Launcher et RUSE Studio ne modifient le dossier du jeu que lorsque vous appuyez sur Restaurer les fichiers propres ; d'autres gestionnaires de mods et des modifications à la main peuvent aussi le modifier. Faites une sauvegarde pendant que le jeu est propre, juste après que Steam l'a installé ou vérifié. Vérifier les fichiers du jeu montre ensuite ce qui a changé depuis, et Restaurer les fichiers propres remet les fichiers du jeu en place."
ger = "RUSE Launcher und RUSE Studio ändern den Ordner des Spiels nur, wenn du „Saubere Dateien wiederherstellen“ drückst; andere Mod-Manager und Änderungen von Hand können ihn auch ändern. Erstelle eine Sicherung, solange das Spiel sauber ist, direkt nachdem Steam es installiert oder überprüft hat. „Spieldateien prüfen“ zeigt dann, was sich seitdem geändert hat, und „Saubere Dateien wiederherstellen“ stellt die Dateien des Spiels wieder her."
ita = "RUSE Launcher e RUSE Studio cambiano la cartella del gioco solo quando premi Ripristina i file puliti; anche altri gestori di mod e le modifiche a mano possono cambiarla. Fai un backup mentre il gioco è pulito, subito dopo che Steam lo ha installato o verificato. Controlla i file del gioco mostra poi cosa è cambiato da allora, e Ripristina i file puliti rimette a posto i file del gioco."
spa = "RUSE Launcher y RUSE Studio cambian la carpeta propia del juego solo cuando pulsas Restaurar archivos limpios; otros gestores de mods y los cambios a mano también pueden cambiarla. Haz una copia de seguridad mientras el juego está limpio, justo después de que Steam lo instale o lo verifique. Comprobar archivos del juego muestra después qué ha cambiado desde entonces, y Restaurar archivos limpios devuelve los archivos del juego a su estado."
pol = "RUSE Launcher i RUSE Studio zmieniają własny folder gry tylko wtedy, gdy naciśniesz Przywróć czyste pliki; inne menedżery modów i ręczne zmiany też mogą go zmienić. Zrób kopię zapasową, gdy gra jest czysta, zaraz po tym, jak Steam ją zainstaluje lub zweryfikuje. Sprawdź pliki gry pokaże potem, co się od tego czasu zmieniło, a Przywróć czyste pliki przywróci pliki gry."
ru = "RUSE Launcher и RUSE Studio меняют папку самой игры только когда вы нажимаете «Восстановить чистые файлы»; другие менеджеры модов и ручные правки тоже могут её менять. Сделайте резервную копию, пока игра чистая, сразу после того как Steam установит или проверит её. «Проверить файлы игры» затем покажет, что изменилось с тех пор, а «Восстановить чистые файлы» вернёт файлы игры на место."
cz = "RUSE Launcher a RUSE Studio mění složku hry jen tehdy, když stisknete Obnovit čisté soubory; jiní správci módů a ruční úpravy ji změnit mohou také. Udělejte zálohu, dokud je hra čistá, hned poté, co ji Steam nainstaluje nebo ověří. „Zkontrolovat soubory hry“ pak ukáže, co se od té doby změnilo, a „Obnovit čisté soubory“ vrátí soubory hry zpět."
jpn = "RUSE Launcher と RUSE Studio がゲーム本体のフォルダーを変更するのは、「クリーンなファイルを復元」を押したときだけですが、ほかの MOD マネージャーや手作業の編集も変更することがあります。ゲームがクリーンなうちに、Steam がインストールまたは検証した直後にバックアップを作成してください。その後「ゲームファイルを確認」でそれ以降に変わったものを確認でき、「クリーンなファイルを復元」でゲームのファイルを元に戻せます。"
sc = "只有当你按下“恢复干净文件”时,RUSE Launcher 和 RUSE Studio 才会改动游戏自己的文件夹;其他模组管理器和手动修改也可能改动它。请在游戏干净时制作备份,也就是 Steam 刚安装或验证之后。之后“检查游戏文件”会显示自那以后改变了什么,“恢复干净文件”会把游戏的文件放回去。"
fa = "RUSE Launcher و RUSE Studio پوشهٔ خود بازی را فقط وقتی «بازگرداندن فایل‌های تمیز» را می‌زنید تغییر می‌دهند؛ مدیرهای ماد دیگر و ویرایش‌های دستی هم می‌توانند آن را تغییر دهند. وقتی بازی تمیز است، درست پس از این‌که Steam آن را نصب یا بررسی کرد، یک پشتیبان بسازید. سپس «بررسی فایل‌های بازی» نشان می‌دهد از آن زمان چه چیزی تغییر کرده، و «بازگرداندن فایل‌های تمیز» فایل‌های بازی را سر جایشان برمی‌گرداند."


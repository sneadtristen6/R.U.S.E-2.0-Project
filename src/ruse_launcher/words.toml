- El código de partida: para una copia con mods cuyos mods cambian cómo se juega, el Launcher muestra un código de partida. Representa la versión del juego de la copia, sus mods con sus versiones, y lo que cambian en cómo se juega. Comparas los códigos de partida con la gente con la que juegas. Hoy no los recibimos; un registro de partida (abajo) los llevaría.
- Copias construidas con una herramienta de trampas o de prueba: una copia así juega partidas multijugador y cooperativas solo con jugadores cuya construcción sea la misma (la misma versión del juego y los mismos mods, en las mismas versiones). Más o menos un segundo después de empezar cada una de esas partidas, comunica al juego de cada jugador un breve código de su construcción (su código de construcción), hecho a partir de la versión del juego, los mods con sus versiones en su orden, y lo que cambian en cómo se juega. No contiene ningún nombre ni cuenta. Si todos los jugadores tienen la misma construcción, la partida está pensada para continuar; todavía nadie ha jugado una partida así entre dos personas. Si no, abandona la partida a los pocos segundos.
  En una partida multijugador no clasificada, después detiene el juego a propósito en la pantalla de fin de esa partida: el juego se cierra inesperadamente y vuelve al escritorio. El informador de cierres inesperados del propio juego puede entonces enviar su informe al creador del juego, y ese informe lleva la línea de RUSE Guard que dice que se detuvo una copia con trampas. En las partidas cooperativas y clasificadas solo abandona la partida. Cuando el Launcher inició el juego y sigue abierto cuando el juego se detiene, toma solo la línea de RUSE Guard del informe de cierre inesperado del juego en tu PC y envía a nuestro servidor una breve nota de que se detuvo una copia con trampas, con tu nombre de usuario y tu clave de RUSE Guard, junto con cuándo se escribió ese informe y cuándo se hizo la nota. La línea solo dice el tipo de partida y el número de tu bando en ella; se le quita cualquier ID de Steam, número largo o ruta. Nuestras aplicaciones nunca envían el informe en sí. La nota no abre ninguna revisión y no decide nada; queda anotada para que la vea sneadtristen6. No se envía ninguna nota si el Launcher se cerró antes de que el juego se detuviera, o si el juego se inició desde el Studio o a mano. En Linux y en la Steam Deck, todavía no se sabe si se envía la nota.
  Las copias honestas nunca se detienen.
- Tu clave de RUSE Guard: la primera vez que el Launcher hace un registro de RUSE Guard en tu PC, genera allí una clave al azar. Un código hecho a partir de esta clave (su mitad pública) va con cada registro, para que podamos distinguir tus registros de los de otra persona con el mismo nombre de usuario, y comprobar que no se cambiaron. No dice nada más sobre ti. Ajustes muestra un código breve hecho a partir de ella, «Tu código de RUSE Guard»: envíalo con una solicitud de privacidad, y podremos encontrar tus propios registros de RUSE Guard. No se envía nada más para ello.
- Todavía no activos: los registros de partida. Necesitan un registro de la partida que el juego hoy no puede escribir. Antes de que empiecen, actualizaremos este texto, y las aplicaciones te lo mostrarán de nuevo. Cuando empiecen, un registro de partida llevará: tu nombre de usuario y tu clave de RUSE Guard; tu bando; los códigos de tu copia; comprobaciones de los archivos del juego que tu copia cambió, y comprobaciones periódicas de que el juego de cada jugador sigue igual; tus mods con sus comprobaciones; qué comandos de script atan tus mods a teclas (nunca lo que pulsas); para la copia de prueba de un desarrollador, la clave del desarrollador; los nombres de las herramientas de trampas de la lista que se encuentren en ejecución; cuándo empezó y terminó la partida; y la repetición más reciente guardada en tu PC durante la partida o justo después, con su nombre de archivo. Una repetición contiene todas las órdenes que dio cada jugador en la partida, y su nombre de archivo y su contenido pueden incluir los nombres dentro del juego de otros jugadores y el tuyo.
- Lo que nunca hace: nunca recoge tu pantalla ni tus pulsaciones de teclas, nunca mira dentro de otros programas mientras se ejecutan, y nunca nos envía tus archivos, salvo la repetición que llevaría un registro de partida. De los informes de cierre inesperado del juego, solo lee su propia línea sobre una copia con trampas que detuvo (arriba), en tu PC.
- Copias de prueba de los desarrolladores: las aplicaciones están hechas para dejar entrar en una partida la copia de prueba de un desarrollador con una clave especial nuestra, la única forma de saltarse la regla de las copias con trampas. Ninguna funciona todavía: hoy las aplicaciones no pueden comprobar una clave así.
- Decisiones sobre ti: no hay expulsiones automáticas. Ninguna decisión sobre trampas la toma una máquina por sí sola: sneadtristen6 mira las pruebas, y la repetición cuando la hay, y decide. Claude, de Anthropic, un asistente de IA, le ayuda a leer los registros de RUSE Guard, bajo los propios términos de Anthropic; las decisiones son suyas. Un registro que nombra una herramienta de trampas de la lista abre una revisión para él, que no decide nada hasta que él lo haga. Puedes apelar en los 30 días siguientes a una decisión (sección 17); sneadtristen6 es la única persona que revisa los casos, así que también decide él mismo las apelaciones. La única regla automática es la regla de las copias con trampas de arriba. Se deriva de la copia que elegiste construir, y nunca toca tu cuenta de Steam ni tu juego instalado.
- Qué significa una decisión hoy: si se confirma que hubo trampas, guardamos esa decisión bajo tu nombre de usuario en nuestra lista de jugadores señalados, y la usamos cuando miramos partidas posteriores. Como dos jugadores pueden compartir nombre de usuario, también miramos con qué clave de RUSE Guard llegaron los registros. Nuestro servidor de RUSE Guard guarda esa lista, cada nombre de usuario señalado con la clave de RUSE Guard con la que llegaron por primera vez sus registros, y solo le dice al Launcher de ese jugador que está señalado. Las aplicaciones todavía no actúan según una señalización. Si una versión posterior lo hace, por ejemplo para mantener las copias con mods de un jugador señalado fuera del multijugador a través de R.U.S.E. 2.0, este texto lo dirá antes. Si se acepta una apelación, la decisión se marca como anulada, y el nombre de usuario sale de la lista.
- Cuánto tiempo se guardan los registros, y tus derechos: sección 11.

7. Bug Watch: ayúdanos a encontrar y arreglar errores (opcional, recomendado)
Por qué: para que el Studio y el Launcher funcionen mejor, y para arreglar antes los cierres inesperados: en lugar de esperar a que alguien nos avise de uno, lo vemos a él y lo que llevó a él.
Con qué base: solo con tu conformidad (tu consentimiento, sección 11). Está desactivado hasta que lo marques. Guardar o cambiar tu nombre de usuario nunca lo activa ni lo desactiva. Marcarlo no cambia nada más en las aplicaciones, salvo lo que el Launcher te dice tras un cierre inesperado del juego (abajo). Cuando las aplicaciones vuelven a mostrar estos términos tras un cambio: si Bug Watch está activado, su casilla pregunta «¿Dejar Bug Watch activado?», marcada; deja la marca para mantenerlo activado, o desmárcala para desactivarlo. Si está desactivado, la casilla de Bug Watch vuelve a aparecer, sin marcar.
Mientras está activado, el Studio y el Launcher envían a nuestro servidor:
- una vez al día, los recuentos de cada día que ha terminado:
  - la aplicación y su versión; el día; si usas Windows 10 u 11; el idioma de la aplicación; la versión del juego; si RUSE Guard está incluido; qué versión de estos términos aceptaste;
  - cuántas veces se usó cada parte de la aplicación y cuánto tardaron las cosas; qué falló y dónde (solo en nuestro propio código; cuando falla el script de una pantalla del Studio, el nombre de la pantalla y el tipo de error, nunca su texto, su archivo ni su línea); por cada tarea larga, como la construcción de un mod, cuántas veces terminó o falló, y en cuántas construcciones se encontraron errores en los mods;
  - una lista de los fallos de ese día, 20 como máximo, cada uno con su código (qué lugar de nuestro código), hasta dónde llegó un Jugar o un Probar en el juego, la forma del conjunto de mods (cuántos mods de nuestra lista, carpetas de mods y archivos de mods tuyos, como recuentos), y junto a él solo números que no nombran a nadie: el número de error de Windows (como disco lleno), la respuesta del servidor web (como 404), el número de salida del juego, un recuento y un segundo código;
  - cuántas actualizaciones se ofrecieron, se instalaron o fallaron; cuántas veces se cerró inesperadamente la aplicación; qué comprobaciones del solucionador de problemas encontraron un problema;
  - qué mods de nuestra lista tenías activados; cuántos minutos jugaste en total, y cuántos con cada uno de esos mods;
  - cuántos mods propios tenías, y qué tipos de cosas contienen, como unidades, mapas, misiones o scripts (contados por tipo, nunca con su nombre, y nunca sus palabras, rutas ni archivos);
- al instante, cuando una aplicación se cierra inesperadamente: el tipo de error y dónde ocurrió en nuestro código;
- al instante, después de que un juego que la aplicación inició se haya cerrado inesperadamente, detalles técnicos de dónde y cómo se cerró:
  - el código de error del juego; el nombre del archivo en el que se detuvo (puede ser parte de Windows, un controlador u otro programa cargado en el juego, como una superposición), dónde se detuvo el juego en él, y hasta 16 lugares del juego que llevaron hasta allí;
  - en un error de memoria, qué intentaba hacer el juego (leer, escribir o ejecutar) y el lugar de la memoria;
  - en un error de script, el propio texto de error del juego, con las rutas de una unidad reducidas a nombres de archivo, el nombre de tu carpeta de usuario oculto (los nombres de las carpetas que hay dentro pueden quedar), y los números de cuenta de Steam y otros números largos eliminados (los nombres de script propios del juego se quedan); cuántos errores anteriores había omitido el juego; y el mapa (uno de los mapas propios del juego por su nombre, el mapa de un mod solo como «un mapa de un mod»);
  - la unidad que el juego estaba haciendo, cuando las aplicaciones pueden leerla en el informe de cierre inesperado del juego (una de las unidades propias del juego por su número, la unidad de un mod solo como «una unidad de un mod»);
  - qué mods estaban activados, qué tipos de cosas contienen tus propios mods (contados por tipo), y qué versión de estos términos aceptaste.
Bug Watch usa solo los informes de cierre inesperado del propio juego. Del informe de otro programa, lee solo los nombres de los archivos que enumera, para saber que no es del juego; nada de él se envía.
Cada envío lleva tu nombre de usuario y tu ID de instalación, un código al azar hecho en tu PC cuando elegiste tu nombre de usuario por primera vez, marques o no Bug Watch. Tu código de informe, que Ajustes muestra mientras Bug Watch está activado, son los primeros 8 caracteres de tu ID de instalación.
Nuestras aplicaciones nunca envían tus archivos ni los propios archivos de informe de cierre inesperado del juego, y Bug Watch no envía ningún número de cuenta de Steam. (El informador de cierres inesperados del propio juego puede enviar su propio informe al creador del juego: sección 3.) El texto de error del juego puede incluir nombres del juego o de los scripts de un mod. Por favor, no uses tu nombre real como nombre de usuario (sección 9).
Cierres que conocemos: con Bug Watch activado, si el juego se cierra inesperadamente de una de las maneras que conocemos, el Launcher te dice qué unidad estaba haciendo el juego y por qué, en tu idioma. Esa explicación solo se te muestra a ti, nunca se envía; el informe de Bug Watch lleva la unidad solo como se indicó arriba (un número, o «una unidad de un mod»). Para conocer esos cierres, las aplicaciones descargan nuestra lista de ellos de nuestro servidor de Bug Watch cuando se inicia un juego, salvo que la lista de tu PC tenga menos de un día, y una vez más en un cierre inesperado si no hay una lista utilizable. La descargan solo mientras Bug Watch está activado, la guardan en tu PC, la usan solo si lleva nuestra firma, y comprueban tu informe de cierre inesperado con ella en tu PC. La descarga no lleva nada sobre ti. Sin la lista (por ejemplo la primera vez, o sin internet), el Launcher sigue diciéndote que el juego se cerró inesperadamente, pero no la unidad ni el motivo. Desmarcar Bug Watch borra la lista de tu PC.
Con Bug Watch activado o desactivado: si un juego que inició el Launcher se cierra inesperadamente, el Launcher te muestra un breve código de cierre, hecho en tu PC a partir de dónde se detuvo el juego. No se envía a ninguna parte. Un botón «Copiar código» lo copia. Si quieres ayuda, envía el código y una captura de pantalla del mensaje a XUL en Discord (XUL6x3) o en GitHub, y lo buscamos en nuestra propia lista. El código solo dice dónde se detuvo el juego.
Ajustes te muestra los recuentos de hoy palabra por palabra, tal como se enviarían, y los nombres de los informes en espera de salir. Los informes que no se pueden enviar esperan en tu PC hasta 30 días, y luego se descartan. Mientras se ejecuta un juego que inició la aplicación, Bug Watch también guarda una pequeña nota sobre él en tu PC, para que en su siguiente inicio la aplicación pueda saber si el juego se cerró por un fallo: cuándo empezó y cuándo se vio en ejecución por última vez, sus mods (los nuestros por nombre y versión, los demás solo como un número) y dónde están instalados la copia y el juego (una carpeta de Windows puede incluir tu nombre de usuario de Windows). Nunca se envía, y se borra después de 30 días, o en el acto cuando desmarcas Bug Watch.
Quién lo ve: nuestros desarrolladores. Lo guarda para nosotros Cloudflare en nuestro servidor de Bug Watch. Cuando está activado, nuestro servidor también publica notas sobre los problemas que seguimos en un repositorio privado de GitHub, un espacio de GitHub que solo pueden abrir nuestros desarrolladores. Las notas nunca contienen un nombre de usuario ni un código de informe. Nuestros desarrolladores también usan Claude, de Anthropic, un asistente de IA, para ayudar a leer algunos informes de cierres inesperados de Bug Watch, bajo los propios términos de Anthropic.
Cuánto tiempo: cada informe se borra de nuestro servidor en la limpieza diaria, cuando lleva allí 7 días, es decir, a los 7 u 8 días de llegar. Nuestros desarrolladores pueden marcar el informe de un cierre inesperado muy grave para conservarlo mientras arreglan ese cierre; un informe marcado se queda hasta que quitan la marca, el día en que ese cierre se arregla, y entonces se va en la siguiente limpieza diaria. Lo que queda después, sin nombre de usuario, ID de instalación ni código de informe: totales diarios por versión de la aplicación (como «12 construcciones de mods fallaron en la versión 0.9.9 ese día») y el día en que se vio por primera vez cada versión y cada tipo de error, sin límite de tiempo; y las notas de nuestro servidor sobre los problemas que encuentra (qué parte de una aplicación, qué mod de nuestra lista, dónde ocurrió un cierre inesperado, y con qué frecuencia), hasta 3 días después de que cerremos ese problema. Durante los primeros 7 días, en un día en que solo una persona usó una versión, sus totales son los recuentos de esa persona; después, una versión o un mod de nuestra lista que menos de 3 instalaciones usaron ese día se guarda solo como «(other)». Las notas de GitHub se quedan hasta que las borremos. Cloudflare guarda un historial de nuestras bases de datos durante 7 días, así que lo que borramos se queda en ese historial hasta 7 días más. Copias en el ordenador de sneadtristen6: sección 11, «Dónde se guarda».
Desmárcalo cuando quieras en Ajustes (o en la casilla de Bug Watch cuando las aplicaciones muestren estos términos). A partir de entonces no se cuenta ni se envía nada, y las aplicaciones borran los recuentos de Bug Watch y los informes en espera de salir. Tu nombre de usuario y tu ID de instalación se quedan en tu PC, porque RUSE Guard usa tu nombre de usuario. Nada de lo hecho antes de desmarcarlo se envía después, aunque lo vuelvas a marcar. Desmarcarlo no le dice nada a nuestro servidor: lo que ya llegó a él se borra como se explicó arriba. Para que se borre antes, envíanos por correo tu código de informe (Ajustes solo lo muestra mientras Bug Watch está activado, así que anótalo antes de desmarcarlo), o tu nombre de usuario si no tienes el código: encontramos por él los informes de tu instalación y los borramos. Los totales y las notas de arriba se quedan. Desmarcarlo no deshace lo que se envió antes.

8. Iniciar sesión con Steam (opcional)
Por qué: para confirmar que posees R.U.S.E., para el juego en línea, RUSE Guard y las descargas de contenido más adelante. Por ahora nada lo necesita.
Con qué base: lo pides tú (sección 11). Las aplicaciones pueden ofrecerlo al iniciarse, y los Ajustes del Launcher lo abren cuando quieras.
- Inicias sesión en la propia página de Steam en tu navegador, en una dirección que genera la propia aplicación. Nunca vemos tu contraseña.
- Steam entonces le dice a nuestro servidor tu ID de Steam. Nuestro servidor pregunta a Steam si esa cuenta posee R.U.S.E. (esto solo funciona si los detalles de tus juegos de Steam son públicos), usa la respuesta, y no guarda el ID. Si lo posees, nuestro servidor le da a tu PC un pase (un código que muestra que la comprobación se superó), válido durante 30 días.
- Lo que guarda nuestro servidor: un código unidireccional hecho a partir de tu ID de Steam con un secreto nuestro, y cuándo se emitió tu pase y cuándo caduca, hasta 30 días después de que tu pase caduque. El código de corta duración que tu aplicación usa para recoger el pase (el código de inicio de sesión) se guarda solo de forma cifrada; caduca a los 10 minutos y se borra cuando la aplicación lo recoge, o en aproximadamente una hora después de que caduque. Los números de inicio de sesión de un solo uso de Steam evitan que un inicio de sesión se repita; se guardan un día, incluso cuando un inicio de sesión falla, y luego se borran en aproximadamente una hora. Nuestro código nunca guarda tu dirección IP.
- Dónde: las bases de datos de nuestros servidores las guarda Cloudflare en el este de Norteamérica.
- Lo que guarda tu PC: el pase, en los ajustes de las aplicaciones, hasta que cierres sesión en Ajustes, lo que lo borra. Un pase que ha caducado también se queda hasta entonces.
- Si los detalles de tus juegos de Steam son privados, Steam no puede decírnoslo. Pon los Detalles del juego en Público durante un minuto y vuelve a intentarlo.
- R.U.S.E. 2.0 no está afiliado a Valve ni avalado por ella. Valve gestiona tu inicio de sesión bajo su propia política de privacidad.

9. Tu nombre de usuario
Por qué: para saber de quién es un informe de cierre inesperado o un registro de partida, y poder ayudar a esa persona. Todos eligen uno en el primer inicio, porque RUSE Guard es obligatorio. Se añaden un # y cuatro números al azar, como Nick#4821. Aun así, dos jugadores pueden acabar con el mismo, así que también nos guiamos por tu clave de RUSE Guard o tu código de informe. Por favor, no uses tu nombre real, tu nombre de Steam ni nada más que te identifique. Se envía solo con tus registros de RUSE Guard y, si Bug Watch está activado, con tus informes de Bug Watch. Un mismo nombre de usuario sirve para las dos aplicaciones. Puedes cambiarlo en Ajustes; cambiarlo nunca activa ni desactiva Bug Watch. Los registros ya enviados conservan el nombre antiguo hasta que se borran. Para que se borren tu nombre de usuario y los datos asociados, envíanos un correo.

10. El título y la introducción de R.U.S.E. 2.0 (opcional)
Las copias que construyen el Launcher y el Studio muestran el título propio del juego y el vídeo del logo de Eugen. Si marcas la casilla de la primera pantalla, o «Usar el título dorado y la introducción de R.U.S.E. 2.0» en El título del juego, en Ajustes, esas copias muestran R.U.S.E. 2.0 en dorado en el menú principal y en las pantallas de carga, y nuestra introducción se reproduce en lugar del vídeo del logo de Eugen al iniciarse el juego. El título dorado se hace en tu PC a partir de los archivos de tu propio juego, sobre una imagen de una escena de batalla que viene con las aplicaciones. La introducción también usa un sonido de motor que viene con las aplicaciones. Cambia solo tu copia con mods, nunca tu juego instalado, y puedes cambiarlo cuando quieras en Ajustes. En el Launcher, Original construye una copia aparte sin mods, con RUSE Guard dentro como toda copia, y con el título que elegiste.

11. Aviso de privacidad
Este aviso forma parte de este acuerdo. El mismo texto es público en nuestra página de GitHub, en https://github.com/sneadtristen6/R.U.S.E-2.0-Project/blob/main/PRIVACY.md, para que cualquiera pueda leerlo, incluidos los jugadores que no usan nuestras aplicaciones. Entró en vigor el 26 de noviembre de 2026.

Quién es responsable de tus datos
R.U.S.E. 2.0 lo dirige una sola persona, sneadtristen6, que vive en Estados Unidos. Él decide qué hacen las aplicaciones y nuestros servidores con tus datos, así que, según la ley de protección de datos (en la UE y el Reino Unido, el RGPD), es el responsable de ellos: el «responsable del tratamiento». Correo electrónico, para solicitudes de privacidad: sneadtristen6@gmail.com. También puedes contactarlo en nuestro Discord o GitHub; para cualquier asunto personal, usa el correo o un mensaje privado, porque los tickets de GitHub y los canales de Discord pueden ser leídos por otros. Solo él revisa los registros de RUSE Guard y decide sobre ellos. No tenemos representante en la UE ni en el Reino Unido.

Qué usamos, por qué y con qué base
- RUSE Guard (sección 6): para mantener justas las partidas multijugador y cooperativas. Base: nuestro interés legítimo, y el de otros jugadores, en partidas justas (RGPD, artículo 6(1)(f)), no tu consentimiento.
- Bug Watch (sección 7), solo si lo marcas: para encontrar y arreglar cierres inesperados y errores. Base: tu consentimiento (artículo 6(1)(a)).
- El inicio de sesión con Steam (sección 8), solo si lo usas: para confirmar que posees R.U.S.E. Base: lo pediste tú (artículo 6(1)(b)).
- Códigos de carpeta y tickets de desbloqueo (sección 5): para desbloquear tu copia. Base: lo pediste tú (artículo 6(1)(b)).
- Tu nombre de usuario (sección 9): para saber de quién es un registro o un informe. Base: la misma que la del registro de RUSE Guard o el informe de Bug Watch con el que se envía.
- Comprobaciones y descargas de actualizaciones (sección 12): para mantener las aplicaciones funcionando y seguras, y para darte lo que pides. Base: nuestro interés legítimo (artículo 6(1)(f)), y tu petición cuando pulsas un botón.
- Mensajes, tickets, correos y apelaciones que nos envías: para responderte. Base: nuestro interés legítimo en responderte (artículo 6(1)(f)).
- Mecenas de Patreon: Patreon gestiona tu pago bajo su propia política de privacidad. Solo vemos lo que Patreon comparte con los creadores bajo esa política, y publicamos un nombre para los créditos solo si nos lo envías con tu permiso. Base: darte el agradecimiento que elegiste (artículo 6(1)(b)); un nombre público solo con tu permiso (artículo 6(1)(a)).
- Tu dirección IP: todo servidor al que se conecta tu PC la ve. El código de nuestros servidores nunca la guarda; Cloudflare, que gestiona nuestros servidores, la trata para entregar y proteger cada conexión, bajo su propia política de privacidad, y su panel nos muestra cuántas solicitudes llegaron de cada país y ciudad. Base: nuestro interés legítimo en gestionar y proteger nuestros servidores (artículo 6(1)(f)).
Ninguna ley te obliga a darnos nada. Las aplicaciones, tal como las publicamos, necesitan un nombre de usuario e incluyen RUSE Guard; Bug Watch y el inicio de sesión con Steam son opcionales. Ninguna decisión sobre trampas la toma una máquina por sí sola. La única regla automática, la regla de las copias con trampas de la sección 6, actúa sobre una copia construida con herramientas de trampas o de prueba, nunca sobre tu cuenta de Steam.

Quién más lo recibe
- Cloudflare, Inc. (EE. UU.), que gestiona nuestros tres servidores y guarda sus bases de datos para nosotros, bajo sus términos de tratamiento de datos.
- Valve, para el inicio de sesión con Steam y la comprobación de propiedad (sección 8).
- GitHub (Microsoft), que guarda nuestros archivos, tickets y debates, y, cuando está activado, el repositorio privado al que el servidor de Bug Watch publica sus notas. También recibe lo que tu navegador envía cuando abres una página que las aplicaciones rellenaron (sección 12).
- Google, que gestiona la dirección de correo a la que escribes.
- Discord, que transporta los mensajes que nos envías allí.
- Anthropic, cuyo asistente de IA Claude nos ayuda a leer algunos informes de cierres inesperados de Bug Watch y registros de RUSE Guard, bajo los propios términos de Anthropic.
- Los juegos de otros jugadores: el código de construcción de una copia con trampas o de prueba (sección 6).
- El público: todo lo que publiques en GitHub o en los canales públicos de Discord.
- Cualquiera a quien la ley nos obligue a dárselo.
Aparte de nosotros: cuando el juego se cierra inesperadamente, el informador de cierres inesperados del propio juego puede enviar su informe al creador del juego (sección 3). Eso es del juego, no nuestro.
No vendemos ni alquilamos tus datos, y no los usamos ni los compartimos para publicidad. Las aplicaciones no contienen publicidad ni servicios externos de analítica o seguimiento; Bug Watch es nuestro, y es opcional.

Dónde se guarda
Las bases de datos de nuestros servidores las guarda Cloudflare en el este de Norteamérica; la red de Cloudflare las sirve desde centros de datos de todo el mundo. Los registros de RUSE Guard se recogen para su revisión en el propio ordenador de sneadtristen6 en Estados Unidos. Cuando investigamos un problema, también puede haber copias de informes de Bug Watch en su ordenador: una copia que pertenece a un error que estamos arreglando se borra cuando ese error queda arreglado, y una copia que no muestra ningún error se borra a los 7 días. sneadtristen6 está en Estados Unidos, y Cloudflare es una empresa estadounidense, así que tus datos se tratan en Estados Unidos y dondequiera que Cloudflare opere.

Cuánto tiempo los guardamos
- Registros de RUSE Guard: nuestro servidor de RUSE Guard guarda cada registro hasta que nuestro ordenador de revisión lo recoge, y nunca más de 3 días después de que llegara: entonces se borra, se haya recogido o no. En el ordenador de revisión, los registros de una partida se borran unas 48 horas después de que llegara el último de ellos (en su siguiente limpieza, que se ejecuta cada vez que recoge registros), salvo que haya abierta una revisión de la partida. Una partida en revisión se conserva hasta que se decide; si se desestima, entonces se borra. Si se confirma que hubo trampas, tienes 30 días desde la decisión para apelar: las pruebas se conservan durante esos 30 días y, si apelas, hasta que se decida tu apelación. Después las pruebas se borran, y solo se conserva la decisión, mientras siga aplicándose. Si se acepta una apelación, la decisión se marca como anulada y nunca se usa en tu contra; pídenoslo y la borraremos también. La nota de parada de una copia con trampas no abre ninguna revisión: queda anotada para que la vea sneadtristen6, y se borra como cualquier registro.
- La lista de nombres de usuario y claves de RUSE Guard del ordenador de revisión, con cuándo se vio cada uno por primera vez: se conserva sin límite de tiempo por ahora; envíanos un correo y borraremos los tuyos.
- Registros de RUSE Guard en tu PC: uno en espera de enviarse se queda hasta que se envía; uno que nuestro servidor rechazó se borra 30 días después de apartarse.
- Bug Watch: sección 7.
- El inicio de sesión con Steam: sección 8.
- Tickets, mensajes y correos: mientras la conversación lo necesite. Los tickets de GitHub se quedan hasta que tú o nosotros los borremos.
- Nombres de mecenas en los créditos: en cada versión a partir de entonces. Pídelo y quitaremos el tuyo de las versiones futuras; las versiones ya publicadas no se pueden cambiar.
- Copias de seguridad: Cloudflare guarda un historial de las bases de datos de nuestros servidores durante 7 días (en nuestro plan gratuito, como dice la propia documentación de Cloudflare), así que lo que borramos se queda en ese historial hasta 7 días después de borrarlo.

Tus derechos
Puedes pedirnos una copia de los datos que tenemos sobre ti; que los corrijamos; que los borremos; que dejemos de usarlos mientras se aclara una duda sobre ellos; y tus datos de Bug Watch y tu nombre de usuario en un archivo que puedas reutilizar. Puedes retirar tu consentimiento para Bug Watch en cualquier momento desmarcándolo; eso no deshace lo que se envió antes.
Cómo: envía un correo a sneadtristen6@gmail.com, o un mensaje privado a sneadtristen6 en Discord. Dinos tu nombre de usuario, tu código de informe si usas o usaste Bug Watch (Ajustes solo lo muestra mientras Bug Watch está activado), y tu código de RUSE Guard (Ajustes lo muestra, como «Tu código de RUSE Guard»); para el inicio de sesión con Steam, tu ID de Steam. Nuestros servidores no piden tu nombre real, así que sin estos datos puede que no encontremos los tuyos. Si no estamos seguros de que una solicitud sea tuya, podemos pedirte más datos. Respondemos en un mes, gratis; si una solicitud es compleja, podemos tardar hasta dos meses más y te diremos por qué.
Si dejas de usar las aplicaciones, puedes pedirnos que borremos tus registros de RUSE Guard, y lo haremos. Si se confirmó que hubo trampas bajo tu nombre de usuario, conservamos solo esa señalización y la decisión en que se basa: tu nombre de usuario, la partida, el veredicto, su fecha y la clave de RUSE Guard con la que llegó la señalización. También podemos conservar lo que necesite un caso de trampas que siga en revisión o en apelación.
Reclamaciones: puedes reclamar ante la autoridad de protección de datos del lugar donde vives o trabajas, o donde creas que ocurrió el problema; en Francia es la CNIL (cnil.fr), en el Reino Unido la ICO (ico.org.uk). Cualquiera puede reclamarnos a nosotros primero. Si estás en el Reino Unido, confirmaremos que recibimos tu reclamación en 30 días.

TU DERECHO A OPONERTE
Puedes oponerte en cualquier momento, por motivos relacionados con tu situación particular, a que usemos tus datos para RUSE Guard. Envíanos un correo. Si estamos de acuerdo, borramos tus registros de RUSE Guard, salvo una señalización por trampas y su decisión (como se explicó arriba), y te decimos que RUSE Guard es obligatorio para usar nuestras aplicaciones: la única forma de no enviar registros nuevos es no usarlas. Puede que no estemos de acuerdo cuando tengamos motivos legítimos imperiosos que pesen más que los tuyos, como un caso de trampas que siga en revisión o en apelación.

Otros jugadores
Hoy RUSE Guard no envía nada sobre los demás jugadores de tus partidas: ni nombres ni repeticiones. Una copia con trampas o de prueba solo comunica a los juegos de los demás jugadores un breve código de construcción. Si una versión posterior envía registros de partida o repeticiones, que pueden contener los nombres dentro del juego de otros jugadores, este texto lo dirá antes. Este aviso es público, así que los jugadores que no usan nuestras aplicaciones también pueden leerlo. Cualquiera puede preguntarnos qué tenemos bajo su nombre dentro del juego, y los derechos de arriba también son suyos.

Seguimiento
Las aplicaciones no siguen lo que haces en otros sitios web ni en otras aplicaciones, y no contienen redes de publicidad ni otros rastreadores externos. Las aplicaciones no son navegadores web, así que no leen la señal «No rastrear» de un navegador; tus opciones son la marca de Bug Watch y si usas el inicio de sesión con Steam.

Seguridad
Las aplicaciones llegan a nuestros servidores solo mediante conexiones cifradas, e instalan una actualización solo si lleva nuestra firma (sección 12). Generan ellas mismas la dirección de la página de inicio de sesión de Steam. Nuestro servidor de RUSE Guard solo le dice al Launcher de un jugador señalado que está señalado. Ningún sistema es perfectamente seguro: si ocurre algo que ponga en riesgo tus datos, lo diremos en nuestra página de GitHub y en nuestro Discord, y avisaremos a las autoridades de protección de datos donde la ley lo exija.

Lo que se queda en tu PC
Las aplicaciones guardan sus ajustes y archivos de trabajo en una carpeta llamada RUSE Mod Platform, dentro de la carpeta AppData\\Local de tu usuario de Windows:
- tu nombre de usuario y tu ID de instalación, tu clave de RUSE Guard, tus opciones, el pase de Steam si iniciaste sesión, y los códigos de desbloqueo;
- la lista de cierres inesperados conocidos del juego de Bug Watch, mientras Bug Watch está activado;
- los recuentos de Bug Watch aún no enviados, y los informes en espera de salir;
- los registros de RUSE Guard en espera de enviarse, y los que nuestro servidor rechazó (se borran 30 días después de apartarse);
- registros de lo que hicieron las aplicaciones (que pueden incluir nombres de carpetas);
- los datos de navegador de la propia ventana de la aplicación;
- archivos descargados (el instalador de una actualización se borra en el siguiente inicio de la aplicación tras instalarse).
Para saber si el juego sigue ejecutándose desde tu copia con mods, las aplicaciones también miran qué programas se están ejecutando y desde dónde (esto es aparte de la comprobación de programas de RUSE Guard de la sección 6); eso se queda en tu PC. Cuando las aplicaciones leen los informes de cierre inesperado del juego (secciones 6 y 7), lo hacen en tu PC y nunca los envían; solo el informador de cierres inesperados del propio juego puede enviar su informe al creador del juego (sección 3). Nada de esta carpeta se envía a ninguna parte salvo como dicen las secciones 5 a 8 y 12. Cuando desinstalas la segunda de las dos aplicaciones, el desinstalador pregunta si borrar también esta carpeta; la respuesta empieza en No. Un Sí la borra, salvo los mods, mapas, exportaciones o copias de seguridad que una versión anterior guardara en ella. Mientras la otra aplicación sigue instalada, no pregunta nada y no borra nada, porque las dos aplicaciones usan esta carpeta. En otro caso, para quitarla, bórrala tú. Tus mods, mapas, exportaciones y copias de seguridad en la carpeta RUSE 2.0 de Documentos, tu copia con mods y la copia de seguridad limpia de tu juego también se quedan hasta que los borres.

12. Actualizaciones, y otros sitios a los que se conectan las aplicaciones
- Actualizaciones: una vez que hayas aceptado estos términos, las dos aplicaciones preguntan a GitHub en cada inicio si hay una versión nueva; hasta que aceptes, no preguntan nada. Si hay una actualización y tu idioma no es el inglés, las aplicaciones también obtienen sus notas de GitHub. Las actualizaciones opcionales se instalan cuando pulsas Actualizar ahora. Una actualización que marcamos como obligatoria se descarga y se instala sola cuando la aplicación se inicia, sin preguntar, y Jugar y Probar en el juego esperan hasta que esté instalada. En ambos casos, una actualización se instala solo si lleva nuestra firma y es exactamente el archivo que firmamos; si no, no se instala nada, y la aplicación lo dice y te remite a nuestro Discord. Si su descarga falla tres veces, la aplicación deja de intentarlo por sí sola y te remite a su página de versión en GitHub; una actualización obligatoria sigue haciendo que Jugar y Probar en el juego esperen. Nuestra clave de firma nunca se sube. En su siguiente inicio tras una actualización, la aplicación borra el instalador de esa actualización. Si antes descargaste unidades de otras épocas, el Studio también comprueba al iniciarse si hay versiones más nuevas y las descarga por sí solo. Solo la versión más reciente de cada aplicación recibe arreglos.
- Además de nuestros propios servidores, las aplicaciones se conectan a estos sitios. Cada uno ve tu dirección IP y lo que se pide, y puede guardar registros bajo su propia política de privacidad:
  - GitHub (Microsoft): las actualizaciones y sus notas; la lista de mods y los mods que contiene (el primer inicio del Launcher obtiene la lista justo después de la pantalla de términos); las unidades de otras épocas; los parches del juego, durante una construcción que necesite uno; y algunos archivos de movimiento;
  - cualquier otro sitio que nuestra lista de mods nombre para un mod: la descarga de ese mod (el Launcher comprueba antes el tamaño y la suma de verificación de cada archivo con la lista);
  - Poly Haven y ambientCG: las texturas gratuitas en línea de Map Paint, con sus imágenes pequeñas cargadas desde las direcciones que dan esos sitios (ambientCG recibe las palabras que escribes en su búsqueda);
  - el National Map del Servicio Geológico de EE. UU. (U.S. Geological Survey): fotos aéreas (recibe la zona alrededor del lugar que eliges);

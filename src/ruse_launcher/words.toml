[agree_guard]
us = "Why: to stop cheating in real R.U.S.E. multiplayer matches, so every match is fair. It acts only in multiplayer and co-op matches, never in single-player, skirmish against the computer, the campaign, replays, or while you make mods. As part of it, during those matches it checks your running programs against a list of known cheat tools: it reads only the programs' names, reports only a name that is on that list, and looks at nothing else. It never collects your files, your screen, your keystrokes or your computer's memory. A modded copy built with a cheat or test tool is for offline play only: taken into a multiplayer match, it surrenders and then stops the game, and the Launcher sends us the line the game's crash report carries about it; honest copies are never stopped. Using the Studio and Launcher means accepting RUSE Guard, including this check."
fr = "Pourquoi : pour empêcher la triche dans les vraies parties multijoueur de R.U.S.E., afin que chaque partie soit équitable. Il n'agit que dans les parties multijoueur et coopératives, jamais en solo, en escarmouche contre l'ordinateur, dans la campagne, les replays, ni pendant que vous créez des mods. Dans ce cadre, pendant ces parties, il compare vos programmes en cours d'exécution à une liste d'outils de triche connus : il ne lit que les noms des programmes, ne signale qu'un nom figurant sur cette liste et ne regarde rien d'autre. Il ne collecte jamais vos fichiers, votre écran, vos frappes au clavier ni la mémoire de votre ordinateur. Une copie moddée construite avec un outil de triche ou de test est réservée au jeu hors ligne : emmenée dans une partie multijoueur, elle se rend puis arrête le jeu, et le Launcher nous envoie la ligne que le rapport de plantage du jeu contient à ce sujet ; les copies honnêtes ne sont jamais arrêtées. Utiliser le Studio et le Launcher, c'est accepter RUSE Guard, cette vérification comprise."
ger = "Warum: um Betrug in echten R.U.S.E.-Mehrspielerpartien zu verhindern, damit jede Partie fair ist. Es wirkt nur in Mehrspieler- und Koop-Partien, nie im Einzelspieler, im Gefecht gegen den Computer, in der Kampagne, in Wiederholungen oder während du Mods machst. Als Teil davon vergleicht es während dieser Partien deine laufenden Programme mit einer Liste bekannter Cheat-Tools: Es liest nur die Programmnamen, meldet nur einen Namen, der auf dieser Liste steht, und sieht sich nichts anderes an. Es sammelt nie deine Dateien, deinen Bildschirm, deine Tastatureingaben oder den Speicher deines Computers. Eine gemoddete Kopie, die mit einem Cheat- oder Test-Tool gebaut wurde, ist nur fürs Offline-Spiel: In eine Mehrspielerpartie mitgenommen, gibt sie auf und beendet dann das Spiel, und der Launcher schickt uns die Zeile, die der Absturzbericht des Spiels darüber enthält; ehrliche Kopien werden nie gestoppt. Wer Studio und Launcher nutzt, akzeptiert RUSE Guard einschließlich dieser Prüfung."
ita = "Perché: per fermare i trucchi nelle vere partite multigiocatore di R.U.S.E., così che ogni partita sia leale. Agisce solo nelle partite multigiocatore e cooperative, mai in giocatore singolo, in schermaglia contro il computer, nella campagna, nei replay o mentre crei mod. Come parte di questo, durante quelle partite confronta i tuoi programmi in esecuzione con un elenco di strumenti di trucco noti: legge solo i nomi dei programmi, segnala solo un nome presente in quell'elenco e non guarda nient'altro. Non raccoglie mai i tuoi file, il tuo schermo, i tasti che premi o la memoria del tuo computer. Una copia moddata costruita con uno strumento di trucco o di prova è solo per il gioco offline: portata in una partita multigiocatore, si arrende e poi chiude il gioco, e il Launcher ci invia la riga che il rapporto di crash del gioco contiene al riguardo; le copie oneste non vengono mai fermate. Usare lo Studio e il Launcher significa accettare RUSE Guard, questo controllo compreso."
spa = "Por qué: para impedir las trampas en las partidas multijugador reales de R.U.S.E., de modo que cada partida sea justa. Solo actúa en partidas multijugador y cooperativas, nunca en un jugador, en escaramuzas contra el ordenador, en la campaña, en las repeticiones ni mientras creas mods. Como parte de ello, durante esas partidas compara tus programas en ejecución con una lista de herramientas de trampas conocidas: solo lee los nombres de los programas, solo informa de un nombre que esté en esa lista y no mira nada más. Nunca recoge tus archivos, tu pantalla, tus pulsaciones de teclas ni la memoria de tu ordenador. Una copia modificada construida con una herramienta de trampas o de prueba es solo para jugar sin conexión: llevada a una partida multijugador, se rinde y luego cierra el juego, y el Launcher nos envía la línea que el informe de fallo del juego contiene al respecto; las copias honestas nunca se detienen. Usar el Studio y el Launcher significa aceptar RUSE Guard, incluida esta comprobación."
pol = "Po co: by powstrzymać oszustwa w prawdziwych meczach wieloosobowych R.U.S.E., tak by każdy mecz był uczciwy. Działa tylko w meczach wieloosobowych i kooperacyjnych, nigdy w grze jednoosobowej, w potyczce z komputerem, w kampanii, w powtórkach ani gdy tworzysz mody. W ramach tego podczas takich meczów porównuje twoje uruchomione programy z listą znanych narzędzi do oszukiwania: czyta tylko nazwy programów, zgłasza tylko nazwę z tej listy i nie patrzy na nic więcej. Nigdy nie zbiera twoich plików, ekranu, naciśnięć klawiszy ani pamięci komputera. Zmodyfikowana kopia zbudowana z narzędziem do oszukiwania lub testowym jest tylko do gry offline: zabrana do meczu wieloosobowego poddaje się, a potem zamyka grę, a Launcher wysyła nam linię, którą raport o awarii gry zawiera na ten temat; uczciwe kopie nigdy nie są zatrzymywane. Korzystanie ze Studia i Launchera oznacza zgodę na RUSE Guard, łącznie z tą kontrolą."
ru = "Зачем: чтобы остановить читерство в настоящих сетевых матчах R.U.S.E., чтобы каждый матч был честным. Он действует только в сетевых и кооперативных матчах — никогда в одиночной игре, в схватке с компьютером, в кампании, в повторах и пока вы делаете моды. В рамках этого во время таких матчей он сверяет запущенные у вас программы со списком известных читерских инструментов: читает только имена программ, сообщает только имя из этого списка и больше ни на что не смотрит. Он никогда не собирает ваши файлы, экран, нажатия клавиш и память компьютера. Модифицированная копия, собранная с читерским или тестовым инструментом, годится только для игры офлайн: взятая в сетевой матч, она сдаётся, а затем останавливает игру, и Launcher отправляет нам строку об этом из отчёта игры о сбое; честные копии никогда не останавливаются. Используя Studio и Launcher, вы принимаете RUSE Guard вместе с этой проверкой."
cz = "Proč: aby zastavil podvádění ve skutečných zápasech R.U.S.E. pro více hráčů, aby byl každý zápas férový. Působí jen v zápasech pro více hráčů a kooperativních, nikdy ve hře jednoho hráče, v šarvátce proti počítači, v kampani, v záznamech ani když tvoříte módy. V rámci toho během těchto zápasů porovnává vaše běžící programy se seznamem známých podvodných nástrojů: čte jen názvy programů, hlásí jen název, který je na tom seznamu, a na nic jiného se nedívá. Nikdy nesbírá vaše soubory, obrazovku, stisky kláves ani paměť počítače. Modifikovaná kopie sestavená s podvodným nebo testovacím nástrojem je jen pro hru offline: vzatá do zápasu pro více hráčů se vzdá a pak hru ukončí a Launcher nám pošle řádek, který o tom obsahuje hlášení hry o pádu; poctivé kopie se nikdy nezastavují. Používání Studia a Launcheru znamená přijetí RUSE Guard včetně této kontroly."
jpn = "目的: 本物の R.U.S.E. マルチプレイヤー対戦でのチートを止め、すべての対戦を公正にするためです。働くのはマルチプレイヤー対戦と協力対戦の中だけで、シングルプレイヤー、コンピューター相手の小競り合い、キャンペーン、リプレイ、Mod 制作中には決して働きません。その一部として、こうした対戦中に実行中のプログラムを既知のチートツールの一覧と照合します。読むのはプログラム名だけで、報告するのはその一覧にある名前だけ、ほかには何も見ません。あなたのファイル、画面、キー入力、コンピューターのメモリーを集めることは決してありません。チートツールやテストツールを入れて作った Mod 入りコピーはオフライン専用です。マルチプレイヤー対戦に持ち込むと降参してからゲームを停止し、Launcher はゲームのクラッシュレポートに含まれるその一行を私たちに送ります。正直なコピーが止められることはありません。Studio と Launcher を使うことは、この確認を含めて RUSE Guard に同意することです。"
sc = "目的：阻止真实 R.U.S.E. 多人对战中的作弊，让每一场对战都公平。它只在多人对战和合作对战中起作用，绝不会在单人游戏、对电脑的遭遇战、战役、回放中起作用，也不会在你制作 Mod 时起作用。作为其中一部分，在这些对战期间，它会把你正在运行的程序与已知作弊工具列表对照：只读取程序名称，只报告列表中的名称，不查看其他任何内容。它绝不会收集你的文件、屏幕、按键或电脑内存。用作弊工具或测试工具构建的 Mod 副本只能离线游玩：带进多人对战后，它会投降然后关闭游戏，Launcher 会把游戏崩溃报告中关于此事的那一行发送给我们；诚实的副本绝不会被停止。使用 Studio 和 Launcher 即表示接受 RUSE Guard，包括这项检查。"
fa = "چرا: برای جلوگیری از تقلب در مسابقه‌های چندنفرهٔ واقعی R.U.S.E.، تا هر مسابقه عادلانه باشد. فقط در مسابقه‌های چندنفره و همکاری عمل می‌کند و هرگز در بازی تک‌نفره، نبرد با رایانه، کمپین، بازپخش‌ها یا هنگام ساختن ماد عمل نمی‌کند. به عنوان بخشی از آن، در طول این مسابقه‌ها برنامه‌های در حال اجرای شما را با فهرستی از ابزارهای تقلب شناخته‌شده مقایسه می‌کند: فقط نام برنامه‌ها را می‌خواند، فقط نامی را گزارش می‌کند که در آن فهرست باشد و به چیز دیگری نگاه نمی‌کند. هرگز فایل‌ها، صفحه، کلیدهای فشرده‌شده یا حافظهٔ رایانهٔ شما را جمع‌آوری نمی‌کند. نسخهٔ مادشده‌ای که با ابزار تقلب یا آزمایش ساخته شده فقط برای بازی آفلاین است: اگر به مسابقهٔ چندنفره برده شود، تسلیم می‌شود و سپس بازی را می‌بندد و Launcher خطی را که گزارش خرابی بازی در این باره دارد برای ما می‌فرستد؛ نسخه‌های درستکار هرگز متوقف نمی‌شوند. استفاده از Studio و Launcher یعنی پذیرش RUSE Guard، از جمله همین بررسی."


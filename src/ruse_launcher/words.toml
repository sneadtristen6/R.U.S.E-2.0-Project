sc = "保存这个用户名(新的名字会得到新的数字)。它不会开启或关闭 Bug Watch。"
fa = "این نام کاربری را ذخیره می‌کند (نام تازه شماره‌های تازه می‌گیرد). Bug Watch را روشن یا خاموش نمی‌کند."

[tip_bugwatch_show]
us = "See today's counts word for word, as Bug Watch would send them, and the names of the reports waiting to go."
fr = "Voir les comptages du jour mot pour mot, tels que Bug Watch les enverrait, et les noms des rapports en attente d'envoi."
ger = "Sieh dir die heutigen Zählungen Wort für Wort an, so wie Bug Watch sie senden würde, und die Namen der wartenden Berichte."
ita = "Vedi i conteggi di oggi parola per parola, come li invierebbe Bug Watch, e i nomi dei rapporti in attesa di partire."
spa = "Ver los recuentos de hoy palabra por palabra, tal como los enviaría Bug Watch, y los nombres de los informes en espera de salir."

sc = "{a} 和 {b} 各自添加了一个名为 {example} 的新对象；两个对象不能同名。组合中只能保留其中一个。"

[clash_value]
us = "{a} changes {n} values {b} changed too, e.g. {example}; it comes later, so it wins. Put {b} after {a} if you want {b}'s values."
fr = "{a} modifie {n} valeurs que {b} modifie aussi, par ex. {example} ; il vient après, donc il l'emporte. Placez {b} après {a} si vous voulez les valeurs de {b}."
ger = "{a} ändert {n} Werte, die auch {b} ändert, z. B. {example}; er kommt später und gewinnt daher. Setzen Sie {b} hinter {a}, wenn Sie die Werte von {b} wollen."

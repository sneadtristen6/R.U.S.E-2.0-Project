- Ваше имя пользователя: имя, которое вы выбираете, чтобы мы знали, чей это вылет или матч. Пожалуйста, не используйте настоящее имя.
- Обновления и другие сайты: после того как вы приняли эти условия, приложения при каждом запуске спрашивают у GitHub, есть ли обновления; обновление устанавливается, только если несёт нашу подпись, обязательное устанавливается само, а некоторые функции загружают данные с других сайтов.
- Ваш аккаунт Steam: что происходит с аккаунтами Steam, решает Valve, а игра онлайн в копии с модами — на ваш собственный риск.
- Ваша конфиденциальность: раздел 11 говорит, что мы собираем, зачем, кто ещё это получает, где это хранится, как долго и каковы ваши права. Мы не продаём ваши данные и не используем их для рекламы.
- Без гарантий: приложения бесплатны и предоставляются как есть.

1. Что это охватывает и с кем заключено соглашение
Эти условия охватывают RUSE Studio и RUSE Launcher в том виде, в каком мы их публикуем, и наши онлайн-сервисы: список модов, сервер RUSE Guard, сервер Bug Watch (и закрытый репозиторий GitHub, в который он отправляет заметки, когда это включено) и сервер входа через Steam. Это соглашение заключено между вами и sneadtristen6, который руководит проектом R.U.S.E. 2.0 и живёт в Соединённых Штатах. «Мы» и «нас» означают его и добровольцев, которые ему помогают.

2. Кто мы и кто нет
R.U.S.E. — игра, разработанная и изданная Eugen Systems. Вам нужна собственная копия. R.U.S.E. 2.0 — бесплатный проект фанатов. Он не создан, не одобрен и не поддерживается Eugen Systems. Это не новая версия игры, и Valve его не спонсирует и не одобряет. R.U.S.E. и файлы игры принадлежат их владельцам. Steam и логотип Steam — товарные знаки Valve Corporation.

3. Ваша копия игры и моды
- Приложения работают только с копией R.U.S.E., которой вы владеете. Они не содержат никаких файлов игры и никогда их не загружают.
- Чтобы играть с модами, приложения собирают на вашем ПК отдельную копию игры с модами. В некоторых случаях данные игры могут быть изменены, но это касается вашей копии игры: этой копии с модами. Моды меняют её данные, а некоторые — её скрипты. Наши приложения добавляют скрипты RUSE Guard и несколько небольших собственных защит к скриптам игры в каждой копии с модами; эти защиты вмешиваются только там, где игра иначе остановилась бы с ошибкой. А некоторым наборам модов нужен небольшой патч игры для программного файла этой копии, который приложения загружают с нашей страницы на GitHub.
- Приложения никогда ничего не вкладывают в игру, пока она работает. Они только смотрят, запущена ли она и откуда, а средство устранения неполадок может завершить игру, оставшуюся запущенной из копии с модами, когда вы нажмёте его кнопку исправления.
- У игры есть собственная программа отправки отчётов о сбоях, сделанная создателем игры. Когда игра вылетает, будь то установленная у вас игра или копия с модами, эта программа может отправить свой собственный отчёт о сбое создателю игры. Она принадлежит игре, а не нам: наши приложения никогда не отправляют её отчёты и не включают и не выключают её.
- Наши приложения никогда не меняют установленную у вас игру, если только вы не попросите Launcher или Studio восстановить её из чистой резервной копии. Восстановление возвращает на место собственные файлы игры и убирает в сторону добавленные файлы и версии, которые оно заменяет.
- Моды, сделанные другими, принадлежат их авторам на условиях, которые те выбрали. Моды, которые меняют скрипты игры, помечены, и Launcher ждёт, пока вы не поставите для каждого из них галочку «Я доверяю автору этого мода», и снова для каждой его новой версии.

4. Ваши права по GPL, лицензии, которые мы используем, и указание авторов
- RUSE Studio и RUSE Launcher — свободное ПО под GNU General Public License версии 3 (GPL v3). Ничто в этом соглашении не ограничивает того, что вам разрешает GPL: вы можете запускать, изучать, менять и распространять код приложений по GPL, принимаете вы это соглашение или нет. Приложения в том виде, в каком мы их публикуем, просят вас принять его перед использованием; так они устроены, и это не ограничение ваших прав по GPL. Это соглашение касается их использования вместе с RUSE Guard и наших онлайн-сервисов. Если вы распространяете приложения или изменённую версию, сохраняйте её под GPL v3, сохраняйте уведомления об авторских правах и указание авторов и предлагайте её исходный код. Изменённая версия — это не приложения в том виде, в каком мы их публикуем; это соглашение и наша поддержка на неё не распространяются.
- Работы других внутри наших приложений: движок RUSE Mod Manager от LittleGroove (GPL v3), работа ProLution и замысел RUSE Guard от DomesticNukes. Каждый из них указан на странице нашего проекта на GitHub.
- Библиотеки и 3D-модели, которые идут с приложениями, а также наборы движений, юниты других эпох, текстуры и аэрофотоснимки, которые они могут загрузить для вас, перечислены вместе с их авторами и лицензиями в THIRD_PARTY_NOTICES — файле, который идёт с приложениями; Настройки показывают его в разделе «Условия, авторы и лицензии». Звук двигателя из заставки там тоже указан. Юниты других эпох в моде также указаны в файле благодарностей самого мода. Работы под лицензией CC BY (лицензией Creative Commons) можно использовать повторно, только указав их авторов: если вы используете такую работу в своём моде, укажите автора так же и сохраните ссылку на её лицензию. Работы под CC0 не требуют указания автора, но мы всё равно их указываем и просим вас делать так же.

5. Только купленные копии
Проект поддерживает R.U.S.E. только тогда, когда игра есть у вас. При запуске приложений и перед запуском игры с модами они проверяют в папке игры наличие копии, установленной через Steam: запись Steam об установке, собственный подписанный файл Steam и отсутствие файлов, которые позволяют играть без Steam. Это наша собственная проверка, а не проверка Steam или Eugen Systems, и она не доказывает, кому принадлежит игра. Для неё ничего не отправляется.
Если вашу копию не удаётся подтвердить (коробочная копия из времён до появления R.U.S.E. в Steam или ошибка проверки), окно показывает вам код папки. Он создаётся на вашем ПК из ID вашей установки Windows (или Linux) либо, если его нет, из ID вашей сетевой карты и главного файла игры. Он односторонний: из него нельзя восстановить эти ID. Он покидает ваш ПК, только если вы вставите его куда-нибудь или нажмёте «Открыть обращение на GitHub»: это открывает в браузере страницу тикетов GitHub с кодом уже в адресе страницы. Ничего не публикуется, пока вы сами этого не сделаете, а тикеты на GitHub публичны. Вместо этого вы можете отправить код sneadtristen6 в личном сообщении в Discord. Мы присылаем в ответ код разблокировки, который работает только на этом ПК и с этой версией главного файла игры. Мы используем ваш код папки только чтобы разблокировать вашу копию, потому что вы об этом попросили, и не храним кодов папок, кроме вашего тикета или сообщения.

6. RUSE Guard: наш античит (обязателен)
Зачем: чтобы остановить читерство в сетевых и кооперативных матчах R.U.S.E., которые играются в копиях, собранных нашими приложениями. Моды могут менять ход игры. Поэтому каждая копия, моды которой меняют игру, получает код присоединения, который вы сверяете с теми, с кем играете. Копия, собранная с читом или тестовым инструментом, проверяет, что у всех игроков матча одна и та же сборка, и сдаёт матч, если это не так. В сетевых и кооперативных матчах RUSE Guard также ищет на вашем ПК запущенные известные читерские инструменты. А наблюдатель каждой копии показывает на экране, когда в матче видно приказ о создании юнита или внезапный скачок денег у стороны.
Почему он обязателен: RUSE Guard обязателен для использования наших приложений. В R.U.S.E. нет эффективного античита, поэтому RUSE Guard и нужен: он помогает не пускать читы в сетевую игру, а честные матчи важны для нас и для каждого игрока, которого вы встречаете. Мы опираемся на то, что закон о защите данных называет «законным интересом»: честные матчи для всех игроков, для чего не нужно вашего разрешения, пока ваша конфиденциальность не перевешивает его (раздел 11). Поэтому это не галочка, как Bug Watch: Studio и Launcher в том виде, в каком мы их публикуем, всегда включают его. Вы всё равно можете в любой момент возразить (раздел 11).
- Где он действует: RUSE Guard есть в каждой копии с модами, которую собирают приложения, и Оригинал в Launcher тоже собирает такую копию, без модов (раздел 10). Его замок и его проверка программ действуют только в сетевых и кооперативных матчах, и так же действовали бы его записи о матчах, когда они начнут вестись (ниже). Его наблюдатель, который тоже есть в каждой копии с модами, следит за сетевыми, кооперативными матчами и схватками с компьютером: он может показать на вашем экране уведомление, когда деньги стороны вырастают сразу на 400 или больше или когда юнит создан приказом о создании. В сетевом матче его может показать экран каждого игрока. Наблюдатель ничего не меняет в матче и ничего не отправляет. Что-либо для RUSE Guard отправляет только Launcher; Studio — никогда, и его «Проверить в игре» не запускает проверку программ.
- Список: список известных читерских инструментов RUSE Guard находится внутри приложения в виде обычного файла, который вы можете прочитать, и меняется только вместе с обновлением приложения. Для него ничего не загружается.
- Проверка программ: в сетевом или кооперативном матче, запущенном из Launcher, RUSE Guard каждые 30 секунд смотрит на имена программ, запущенных на вашем ПК, и сохраняет только имена из своего списка. Чтобы знать, когда идёт такой матч, Launcher читает собственный вывод ошибок игры, пока игра работает: он сохраняет только короткие строки RUSE Guard о том, что матч идёт или закончился, а каждую другую строку отбрасывает, как только прочитает, никогда не сохраняя и не отправляя её (этот вывод может содержать и собственные строки Steam, одна из них — с номером вашего аккаунта Steam). Если игра не сообщает, что матч закончился, проверка прекращается через две минуты после того, как игра в последний раз сообщила, что матч идёт. Если во время матча была запущена программа из списка, Launcher после игры отправляет на наш сервер короткую запись: ваше имя пользователя и ключ RUSE Guard, когда матч начался и закончился, был ли он сетевым или кооперативным и имена найденных программ из списка. Больше ничего туда не входит: ни повтора, ни файлов, ни чего-либо ещё о матче. Если ни одна программа из списка не была запущена, ничего не отправляется.
- Код присоединения: для копии с модами, моды которой меняют ход игры, Launcher показывает код присоединения. Он обозначает версию игры в копии, её моды с их версиями и то, что они меняют в ходе игры. Вы сверяете коды присоединения с теми, с кем играете. Сегодня мы их не получаем; запись о матче (ниже) несла бы их.
- Копии, собранные с читом или тестовым инструментом: такая копия играет сетевые и кооперативные матчи только с игроками, у которых та же сборка (та же версия игры и те же моды в тех же версиях). Примерно через секунду после начала каждого такого матча она сообщает игре каждого игрока короткий код своей сборки (код сборки), составленный из версии игры, модов с их версиями в их порядке и того, что они меняют в ходе игры. В нём нет ни имени, ни аккаунта. Если у всех игроков одна и та же сборка, матч должен продолжаться; такой матч с двумя людьми пока никто не играл. Если нет, она сдаёт матч через несколько секунд.
  В сетевом матче без рейтинга она затем намеренно останавливает игру на экране итогов этого матча: игра вылетает на рабочий стол. Собственная программа игры для отчётов о сбоях может затем отправить свой отчёт создателю игры, и в этом отчёте есть строка RUSE Guard о том, что копия с читами была остановлена. В кооперативных и рейтинговых матчах она только сдаёт матч. Если игру запустил Launcher и он ещё открыт, когда игра останавливается, он берёт из отчёта игры о сбое на вашем ПК только строку RUSE Guard и отправляет на наш сервер короткую заметку о том, что копия с читами была остановлена, под вашим именем пользователя и ключом RUSE Guard, с временем записи отчёта о сбое и временем создания заметки. Строка сообщает только вид матча и номер вашей стороны в нём; любые Steam ID, длинные числа и пути из неё удаляются. Наши приложения никогда не отправляют сам отчёт о сбое. Заметка не открывает проверку и ничего не решает; она попадает в список, который видит sneadtristen6. Заметка не отправляется, если Launcher был закрыт до того, как игра остановилась, или если игра была запущена из Studio или вручную. В Linux и на Steam Deck пока неизвестно, отправляется ли заметка.
  Честные копии никогда не останавливаются.
- Ваш ключ RUSE Guard: когда Launcher впервые создаёт на вашем ПК запись RUSE Guard, он создаёт там случайный ключ. Код, полученный из этого ключа (его открытая половина), идёт с каждой записью, чтобы мы могли отличить ваши записи от записей кого-то с таким же именем пользователя и проверить, что они не были изменены. Он больше ничего о вас не говорит. Настройки показывают короткий код, полученный из него, — «Ваш код RUSE Guard»: отправьте его вместе с запросом о конфиденциальности, и мы сможем найти ваши записи RUSE Guard. Больше для него ничего не отправляется.
- Пока не действует: записи о матчах. Им нужна запись матча, которую игра сегодня сделать не может. Прежде чем они начнут вестись, мы обновим этот текст, и приложения покажут его вам снова. Когда они начнут вестись, запись о матче будет содержать: ваше имя пользователя и ключ RUSE Guard; вашу сторону; коды вашей копии; проверки файлов игры, которые изменила ваша копия, и регулярные проверки того, что игра у каждого игрока остаётся прежней; ваши моды с их проверками; какие команды скриптов ваши моды привязывают к клавишам (никогда не то, что вы нажимаете); для тестовой копии разработчика — ключ разработчика; имена любых найденных запущенных читерских инструментов из списка; когда матч начался и закончился; и самый новый повтор, сохранённый на вашем ПК во время матча или сразу после него, с именем его файла. Повтор содержит каждый приказ, который каждый игрок отдал в матче, а имя его файла и содержимое могут включать внутриигровые имена ваши и других игроков.
- Чего он не делает никогда: он никогда не собирает ваш экран и нажатия клавиш, никогда не заглядывает внутрь других программ, пока они работают, и никогда не отправляет нам ваши файлы, кроме повтора, который нёс бы с собой запись о матче. Из отчётов игры о сбоях он читает только свою строку об остановленной им копии с читами (выше), на вашем ПК.
- Тестовые копии разработчиков: приложения устроены так, чтобы пускать тестовую копию разработчика в матч по особому ключу от нас — единственный способ обойти правило для копий с читами. Пока ни один не работает: сегодня приложения не могут проверить такой ключ.
- Решения о вас: никаких автоматических банов. Ни одно решение о читерстве не принимается одной лишь машиной: sneadtristen6 смотрит на доказательства, а при их наличии и на повтор, и решает. Claude от Anthropic, ИИ-помощник, помогает ему читать записи RUSE Guard на условиях самой Anthropic; решения принимает он. Запись, называющая читерский инструмент из списка, открывает для него проверку, которая ничего не решает, пока не решит он. Вы можете подать апелляцию в течение 30 дней после решения (раздел 17); sneadtristen6 — единственный человек, который рассматривает дела, поэтому апелляции он тоже решает сам. Единственное автоматическое правило — правило для копий с читами, описанное выше. Оно следует из копии, которую вы сами решили собрать, и никогда не затрагивает ваш аккаунт Steam или установленную у вас игру.
- Что решение значит сегодня: если читерство подтверждено, мы сохраняем это решение под вашим именем пользователя в нашем списке отмеченных игроков и учитываем его, когда смотрим на более поздние матчи. Поскольку у двух игроков может быть одинаковое имя пользователя, мы смотрим также, с каким ключом RUSE Guard пришли записи. Наш сервер RUSE Guard хранит этот список — каждое отмеченное имя пользователя с ключом RUSE Guard, с которым впервые пришли его записи, — и сообщает об отметке только Launcher самого этого игрока. Приложения пока не действуют по отметке. Если более поздняя версия станет это делать, например не пускать копии с модами отмеченного игрока в сетевую игру через R.U.S.E. 2.0, этот текст скажет об этом заранее. Если апелляция удовлетворена, решение помечается как отменённое, а имя пользователя убирается из списка.
- Как долго хранятся записи и ваши права: раздел 11.

7. Bug Watch: помогите нам находить и исправлять ошибки (необязательно, рекомендуется)
Зачем: чтобы Studio и Launcher работали лучше и чтобы мы быстрее исправляли вылеты: вместо того чтобы ждать, пока кто-то сообщит о вылете, мы видим его и то, что к нему привело.
На каком основании: только с вашего согласия (ваше согласие, раздел 11). Выключено, пока вы не поставите галочку. Сохранение или смена вашего имени пользователя никогда не включает и не выключает его. Галочка больше ничего не меняет в приложениях, кроме того, что Launcher говорит вам после вылета игры (ниже). Когда приложения снова показывают эти условия после изменения: если Bug Watch включён, его окошко спрашивает «Оставить Bug Watch включённым?», с поставленной галочкой; оставьте галочку, чтобы он продолжал работать, или снимите её, чтобы выключить. Если он выключен, окошко Bug Watch появляется снова, без галочки.
Пока он включён, Studio и Launcher отправляют на наш сервер:
- раз в день — счётчики за каждый закончившийся день:
  - приложение и его версия; день; пользуетесь ли вы Windows 10 или 11; язык приложения; версия игры; встроен ли RUSE Guard; какую версию этих условий вы приняли;
  - как часто использовалась каждая часть приложения и сколько времени заняли действия; что пошло не так и где (только в нашем собственном коде; когда сбоит скрипт экрана Studio, название экрана и вид ошибки, но никогда её текст, файл или строка); для каждой длительной задачи, например сборки модов, сколько раз она завершилась или не удалась и сколько сборок нашли ошибки в модах;
  - список сбоев за этот день, не более 20, каждый с его кодом (какое место в нашем коде), как далеко дошли Играть или Проверить в игре, состав набора модов (сколько модов из нашего списка, папок модов и файлов модов ваших собственных, в виде количеств), и рядом только числа, которые никого не называют: номер ошибки Windows (например, диск заполнен), ответ веб-сервера (например, 404), код выхода игры, количество и второй код;
  - сколько обновлений было предложено, установлено или не удалось; сколько раз приложение вылетало; какие проверки средства устранения неполадок нашли проблему;
  - какие моды из нашего списка у вас были включены; сколько минут вы всего играли и сколько с каждым из этих модов;
  - сколько у вас было собственных модов и что в них содержится, например юниты, карты, миссии или скрипты (считается по видам, никогда не называется и никогда не передаются их тексты, пути или файлы);
- сразу, когда приложение вылетает: вид ошибки и где в нашем коде;
- сразу, после того как вылетела игра, запущенная приложением, технические подробности того, где и как она вылетела:
  - код ошибки игры; имя файла, в котором она остановилась (это может быть часть Windows, драйвер или другая программа, загруженная в игру, например оверлей), место в нём, где игра остановилась, и до 16 мест в игре, которые к этому привели;
  - при ошибке памяти — что игра пыталась сделать (прочитать, записать или выполнить) и место в памяти;
  - при ошибке скрипта — собственный текст ошибки игры, где пути на диске сокращены до имён файлов, имя вашей пользовательской папки скрыто (имена папок внутри неё могут остаться), а номера аккаунтов Steam и другие длинные числа убраны (собственные имена скриптов игры остаются); сколько предыдущих ошибок игра пропустила; и карта (одна из карт самой игры — по названию, карта мода — только как «карта мода»);
  - юнит, который создавала игра, если приложения могут прочитать его из отчёта игры о сбое (один из юнитов самой игры — по номеру, юнит мода — только как «юнит мода»);
  - какие моды были включены, что содержат ваши собственные моды (считается по видам) и какую версию этих условий вы приняли.
Bug Watch использует только собственные отчёты игры о сбоях. Из отчёта другой программы он читает только имена файлов, которые в нём перечислены, чтобы понять, что это не отчёт игры; ничего из него не отправляется.
Каждая отправка несёт ваше имя пользователя и ваш ID установки — случайный код, созданный на вашем ПК, когда вы впервые выбрали имя пользователя, независимо от того, ставите ли вы галочку Bug Watch. Ваш код отчёта, который Настройки показывают, пока Bug Watch включён, — это первые 8 символов вашего ID установки.
Наши приложения никогда не отправляют ваши файлы или сами файлы отчётов игры о сбоях, а Bug Watch не отправляет номер аккаунта Steam. (Собственная программа игры для отчётов о сбоях может отправить свой отчёт создателю игры: раздел 3.) Текст ошибки игры может включать имена из игры или из скриптов мода. Пожалуйста, не используйте настоящее имя как имя пользователя (раздел 9).
Известные нам вылеты: если Bug Watch включён и игра вылетает одним из известных нам способов, Launcher сообщает вам на вашем языке, какой юнит создавала игра и почему. Это объяснение показывается только вам и никогда не отправляется; отчёт Bug Watch несёт юнит только так, как описано выше (номер или «юнит мода»). Чтобы знать эти вылеты, приложения загружают наш список с нашего сервера Bug Watch при запуске игры, если только список на вашем ПК не моложе одного дня, и ещё раз при вылете, если пригодного списка нет. Они загружают его только пока Bug Watch включён, хранят на вашем ПК, используют только если он несёт нашу подпись и сверяют ваш отчёт о сбое с ним на вашем ПК. Загрузка не несёт ничего о вас. Без списка (например, в первый раз или без интернета) Launcher всё равно сообщает вам, что игра вылетела, но не юнит и не причину. Снятие галочки Bug Watch удаляет список с вашего ПК.
При включённом или выключенном Bug Watch: если игра, запущенная Launcher, вылетает, Launcher показывает вам короткий код вылета, созданный на вашем ПК из места, где игра остановилась. Он никуда не отправляется. Кнопка «Копировать код» копирует его. Если вам нужна помощь, отправьте код и скриншот сообщения пользователю XUL в Discord (XUL6x3) или на GitHub, и мы найдём его в нашем собственном списке. Код говорит только о том, где игра остановилась.
Настройки показывают вам сегодняшние счётчики слово в слово — так, как они были бы отправлены, — и имена отчётов, ожидающих отправки. Отчёты, которые не удаётся отправить, ждут на вашем ПК до 30 дней, затем отбрасываются. Пока работает игра, запущенная приложением, Bug Watch также хранит на вашем ПК небольшую заметку о ней, чтобы при следующем запуске приложение могло понять, не завершилась ли игра сбоем: когда она запустилась и когда в последний раз была замечена работающей, её моды (наши — по названию и версии, остальные — только числом) и где установлены копия и игра (папка Windows может содержать ваше имя пользователя Windows). Заметка никогда не отправляется и удаляется через 30 дней или сразу, когда вы снимаете отметку с Bug Watch.
Кто это видит: наши разработчики. Это хранится для нас Cloudflare на нашем сервере Bug Watch. Когда это включено, наш сервер также отправляет заметки о отслеживаемых нами проблемах в закрытый репозиторий GitHub — пространство на GitHub, которое могут открыть только наши разработчики. Заметки никогда не содержат имени пользователя или кода отчёта. Наши разработчики также используют Claude от Anthropic, ИИ-помощника, чтобы читать некоторые отчёты Bug Watch о вылетах, на условиях самой Anthropic.
Как долго: каждый отчёт удаляется с нашего сервера при ежедневной очистке после того, как пролежал там 7 дней, то есть через 7–8 дней после поступления. Наши разработчики могут пометить отчёт об очень тяжёлом вылете, чтобы хранить его, пока они исправляют этот вылет; помеченный отчёт хранится, пока они не снимут пометку, в день исправления этого вылета, а затем удаляется при следующей ежедневной очистке. Что остаётся после этого, без имени пользователя, ID установки и кода отчёта: дневные итоги по каждой версии приложения (например, «12 сборок модов не удались на версии 0.9.9 в этот день») и день, когда впервые увидели каждую версию и каждый вид ошибки, без ограничения по времени; и заметки нашего сервера о найденных им проблемах (какая часть приложения, какой мод из нашего списка, где произошёл вылет и как часто), до 3 дней после того, как мы закроем эту проблему. Первые 7 дней, в день, когда версией пользовался только один человек, её итоги — это счётчики этого одного человека; после этого версия или мод из нашего списка, которыми в тот день пользовались менее 3 установок, хранятся только как «(other)». Заметки на GitHub остаются, пока мы их не удалим. Cloudflare хранит историю наших баз данных 7 дней, так что удалённое нами остаётся в этой истории ещё до 7 дней. Копии на компьютере sneadtristen6: раздел 11, «Где это хранится».
Снимите галочку в любой момент в Настройках (или в окошке Bug Watch, когда приложения показывают эти условия). С этого момента ничего не считается и не отправляется, а приложения удаляют счётчики Bug Watch и отчёты, ожидающие отправки. Ваше имя пользователя и ID установки остаются на вашем ПК, потому что RUSE Guard использует ваше имя пользователя. Ничего из созданного до снятия галочки не отправляется позже, даже если вы поставите её снова. Снятие галочки ничего не сообщает нашему серверу: то, что уже дошло до него, удаляется, как описано выше. Чтобы удалить это раньше, отправьте нам по e-mail ваш код отчёта (Настройки показывают его, только пока Bug Watch включён, поэтому запишите его до того, как снимете галочку) или ваше имя пользователя, если кода у вас нет: мы найдём отчёты вашей установки по нему и удалим их. Итоги и заметки, описанные выше, остаются. Снятие галочки не отменяет того, что было отправлено раньше.

8. Вход через Steam (необязательно)
Зачем: чтобы подтвердить, что у вас есть R.U.S.E., для онлайн-игры, RUSE Guard и загрузки контента в будущем. Пока он ничему не нужен.
На каком основании: вы сами об этом просите (раздел 11). Приложения могут предложить его при запуске, а Настройки Launcher открывают его в любой момент.
- Вы входите на собственной странице Steam в вашем браузере, по адресу, который приложение составляет само. Мы никогда не видим ваш пароль.
- Затем Steam сообщает нашему серверу ваш Steam ID. Наш сервер спрашивает у Steam, есть ли на этом аккаунте R.U.S.E. (это работает, только если сведения об играх в вашем Steam открыты), использует ответ и не хранит ID. Если игра у вас есть, наш сервер выдаёт вашему ПК пропуск (код, показывающий, что проверка пройдена), действительный 30 дней.
- Что хранит наш сервер: односторонний код, полученный из вашего Steam ID с нашим секретом, и когда ваш пропуск был выдан и когда истекает, — до 30 дней после того, как ваш пропуск истёк. Недолговечный код, с помощью которого ваше приложение получает пропуск (код входа), хранится только в зашифрованном виде; он истекает через 10 минут и удаляется, когда приложение его забирает, либо примерно через час после истечения. Одноразовые числа входа Steam не позволяют повторить вход; они хранятся сутки, даже если вход не удался, затем удаляются примерно в течение часа. Наш код никогда не хранит ваш IP-адрес.
- Где: базы данных наших серверов хранятся Cloudflare в восточной части Северной Америки.
- Что хранит ваш ПК: пропуск, в настройках приложений, пока вы не выйдете в Настройках, что его удаляет. Истёкший пропуск тоже остаётся до этого момента.
- Если сведения об играх в вашем Steam закрыты, Steam не может нам их сообщить. Сделайте «Сведения об играх» открытыми на минуту, затем попробуйте снова.
- R.U.S.E. 2.0 не связан с Valve и не одобрен ею. Valve обрабатывает ваш вход на условиях своей политики конфиденциальности.

9. Ваше имя пользователя
Зачем: чтобы мы знали, чей это отчёт о вылете или запись о матче, и могли помочь этому человеку. Каждый выбирает имя при первом запуске, потому что RUSE Guard обязателен. К имени добавляются # и четыре случайные цифры, например Nick#4821. У двух игроков всё же может оказаться одинаковое имя, поэтому мы ориентируемся и на ваш ключ RUSE Guard или код отчёта. Пожалуйста, не используйте настоящее имя, имя в Steam или что-либо другое, что позволяет вас узнать. Оно отправляется только с вашими записями RUSE Guard и, если Bug Watch включён, с вашими отчётами Bug Watch. Одно имя действует в обоих приложениях. Его можно сменить в Настройках; смена имени никогда не включает и не выключает Bug Watch. Уже отправленные записи сохраняют старое имя, пока не будут удалены. Чтобы удалить ваше имя пользователя и данные под ним, отправьте нам e-mail.

10. Название и заставка R.U.S.E. 2.0 (необязательно)
Копии, которые собирают Launcher и Studio, показывают собственное название игры и видеозаставку с логотипом Eugen. Если вы поставите галочку на первом экране или «Использовать золотое название и заставку R.U.S.E. 2.0» в разделе «Название игры» в Настройках, эти копии покажут R.U.S.E. 2.0 золотом в главном меню и на экранах загрузки, а наша заставка будет играть вместо видеозаставки с логотипом Eugen при запуске игры. Золотое название создаётся на вашем ПК из файлов вашей собственной игры поверх картины боевой сцены, которая идёт с приложениями. В заставке также используется звук двигателя, который идёт с приложениями. Это меняет только вашу копию с модами, никогда не установленную у вас игру, и вы можете изменить это в любой момент в Настройках. В Launcher Оригинал собирает отдельную копию без модов, с RUSE Guard внутри, как каждая копия, и с названием, которое вы выбрали.

11. Уведомление о конфиденциальности
Это уведомление — часть этого соглашения. Тот же текст публично доступен на нашей странице GitHub по адресу https://github.com/sneadtristen6/R.U.S.E-2.0-Project/blob/main/PRIVACY.md, чтобы его мог прочитать любой, в том числе игроки, которые не пользуются нашими приложениями. Оно вступило в силу 26 ноября 2026.

Кто отвечает за ваши данные
R.U.S.E. 2.0 ведёт один человек, sneadtristen6, живущий в Соединённых Штатах. Он решает, что приложения и наши серверы делают с вашими данными, поэтому по закону о защите данных (в ЕС и Великобритании — GDPR) именно он за них отвечает: он «контролёр». E-mail для запросов о конфиденциальности: sneadtristen6@gmail.com. Вы также можете связаться с ним в нашем Discord или на GitHub; для всего личного используйте e-mail или личное сообщение, потому что тикеты на GitHub и каналы Discord могут читать другие. Только он просматривает записи RUSE Guard и принимает по ним решения. У нас нет представителя в ЕС или Великобритании.

Что мы используем, зачем и на каком основании
- RUSE Guard (раздел 6): чтобы сетевые и кооперативные матчи были честными. Основание: наш законный интерес и законный интерес других игроков в честных матчах (GDPR, статья 6(1)(f)), а не ваше согласие.
- Bug Watch (раздел 7), только если вы поставили галочку: чтобы находить и исправлять вылеты и ошибки. Основание: ваше согласие (статья 6(1)(a)).
- Вход через Steam (раздел 8), только если вы им пользуетесь: чтобы подтвердить, что у вас есть R.U.S.E. Основание: вы сами об этом попросили (статья 6(1)(b)).
- Коды папок и тикеты на разблокировку (раздел 5): чтобы разблокировать вашу копию. Основание: вы сами об этом попросили (статья 6(1)(b)).
- Ваше имя пользователя (раздел 9): чтобы знать, чья это запись или отчёт. Основание: то же, что у записи RUSE Guard или отчёта Bug Watch, с которыми оно отправляется.
- Проверки и загрузки обновлений (раздел 12): чтобы приложения работали и были безопасны и чтобы давать вам то, о чём вы просите. Основание: наш законный интерес (статья 6(1)(f)) и ваша просьба, когда вы нажимаете кнопку.
- Сообщения, тикеты, письма и апелляции, которые вы нам отправляете: чтобы вам ответить. Основание: наш законный интерес в том, чтобы вам ответить (статья 6(1)(f)).
- Поддерживающие нас на Patreon: Patreon обрабатывает ваш платёж на условиях своей политики конфиденциальности. Мы видим только то, чем Patreon делится с авторами по этой политике, и публикуем имя для благодарностей, только если вы отправили его с вашего разрешения. Основание: чтобы дать вам выбранную вами благодарность (статья 6(1)(b)); публичное имя — только с вашего разрешения (статья 6(1)(a)).
- Ваш IP-адрес: его видит каждый сервер, к которому подключается ваш ПК. Код наших серверов никогда его не хранит; Cloudflare, которая обеспечивает работу наших серверов, обрабатывает его, чтобы доставлять и защищать каждое соединение, на условиях своей политики конфиденциальности, а её панель показывает нам, сколько запросов пришло из каждой страны и города. Основание: наш законный интерес в работе и защите наших серверов (статья 6(1)(f)).
Никакой закон не требует, чтобы вы нам что-либо давали. Приложениям в том виде, в каком мы их публикуем, нужно имя пользователя, и они включают RUSE Guard; Bug Watch и вход через Steam — на ваш выбор. Ни одно решение о читерстве не принимается одной лишь машиной. Единственное автоматическое правило, правило для копий с читами из раздела 6, действует на копию, собранную с читерскими или тестовыми инструментами, и никогда на ваш аккаунт Steam.

Кто ещё это получает
- Cloudflare, Inc. (США), которая обеспечивает работу трёх наших серверов и хранит для нас их базы данных на условиях своих условий обработки данных.
- Valve — для входа через Steam и проверки владения (раздел 8).
- GitHub (Microsoft), который хранит наши файлы, тикеты и обсуждения и, когда это включено, закрытый репозиторий, в который сервер Bug Watch отправляет свои заметки. Он также получает то, что ваш браузер отправляет, когда вы открываете страницу, заполненную приложениями (раздел 12).
- Google, которая обеспечивает работу адреса электронной почты, на который вы пишете.
- Discord, который передаёт сообщения, которые вы нам там отправляете.
- Anthropic, чей ИИ-помощник Claude помогает нам читать некоторые отчёты Bug Watch о вылетах и записи RUSE Guard, на условиях самой Anthropic.
- Игры других игроков: код сборки копии с читами или тестовой копии (раздел 6).
- Общественность: всё, что вы публикуете на GitHub или в публичных каналах Discord.
- Все, кому закон требует нас это передать.
Помимо нас: когда игра вылетает, собственная программа игры для отчётов о сбоях может отправить свой отчёт создателю игры (раздел 3). Это принадлежит игре, а не нам.
Мы не продаём и не сдаём в аренду ваши данные и не используем их и не передаём для рекламы. В приложениях нет рекламы и сторонних служб аналитики или отслеживания; Bug Watch — наш собственный и на ваш выбор.

Где это хранится
Базы данных наших серверов хранятся Cloudflare в восточной части Северной Америки; сеть Cloudflare обслуживает их из центров обработки данных по всему миру. Записи RUSE Guard собираются для проверки на собственном компьютере sneadtristen6 в Соединённых Штатах. Когда мы разбираем проблему, копии отчётов Bug Watch могут также находиться на его компьютере: копия, относящаяся к исправляемой нами ошибке, удаляется, как только ошибка исправлена, а копия, не показывающая ошибки, удаляется через 7 дней. sneadtristen6 находится в Соединённых Штатах, а Cloudflare — американская компания, поэтому ваши данные обрабатываются в Соединённых Штатах и везде, где работает Cloudflare.

Как долго мы это храним
- Записи RUSE Guard: наш сервер RUSE Guard хранит каждую запись, пока наш компьютер для проверки её не заберёт, и никогда дольше 3 дней после её поступления: затем она удаляется, забрана она или нет. На компьютере для проверки записи матча удаляются примерно через 48 часов после поступления последней из них (при его следующей очистке, которая выполняется всякий раз, когда он забирает записи), если только не открыта проверка этого матча. Матч, находящийся на проверке, хранится, пока по нему не принято решение; если проверка закрыта без последствий, он затем удаляется. Если читерство подтверждено, у вас есть 30 дней с момента решения на апелляцию: доказательства хранятся эти 30 дней, а если вы подаёте апелляцию — пока она не будет решена. После этого доказательства удаляются, а хранится только решение — пока оно действует. Если апелляция удовлетворена, решение помечается как отменённое и никогда не используется против вас; попросите нас, и мы удалим и его. Заметка об остановке копии с читами не открывает проверки: она попадает в список, который видит sneadtristen6, и удаляется, как любая запись.
- Список имён пользователей и ключей RUSE Guard на компьютере для проверки, с датой, когда каждый впервые был замечен: пока хранится без ограничения по времени; напишите нам по e-mail, и мы удалим вашу запись.
- Записи RUSE Guard на вашем ПК: ожидающая отправки хранится, пока не будет отправлена; отклонённая нашим сервером удаляется через 30 дней после того, как была отложена.
- Bug Watch: раздел 7.
- Вход через Steam: раздел 8.
- Тикеты, сообщения и письма: пока это нужно для переписки. Тикеты на GitHub остаются, пока вы или мы их не удалим.
- Имена в благодарностях поддержавших: в каждом выпуске с этого момента. Попросите, и мы уберём ваше имя из будущих выпусков; уже опубликованные выпуски изменить нельзя.
- Резервные копии: Cloudflare хранит историю баз данных наших серверов 7 дней (на нашем бесплатном тарифе, как говорит собственная документация Cloudflare), так что удалённое нами остаётся в этой истории до 7 дней после удаления.

Ваши права
Вы можете попросить у нас копию данных, которые мы о вас храним; исправить их; удалить их; прекратить их использование, пока решается вопрос о них; а также выдать ваши данные Bug Watch и имя пользователя в файле, который можно использовать повторно. Вы можете в любой момент отозвать своё согласие на Bug Watch, сняв галочку; это не отменяет того, что было отправлено раньше.
Как: напишите на sneadtristen6@gmail.com или отправьте sneadtristen6 личное сообщение в Discord. Назовите ваше имя пользователя, ваш код отчёта, если вы используете или использовали Bug Watch (Настройки показывают его, только пока Bug Watch включён), и ваш код RUSE Guard (Настройки показывают его как «Ваш код RUSE Guard»); для входа через Steam — ваш Steam ID. Наши серверы не спрашивают ваше настоящее имя, поэтому без этого мы можем не найти ваши данные. Если мы не уверены, что запрос ваш, мы можем попросить больше сведений. Мы отвечаем в течение одного месяца, бесплатно; если запрос сложный, мы можем взять до двух дополнительных месяцев и сообщим вам почему.
Если вы перестанете пользоваться приложениями, вы можете попросить нас удалить ваши записи RUSE Guard, и мы это сделаем. Если под вашим именем пользователя было подтверждено читерство, мы храним только эту отметку и решение, на котором она основана: ваше имя пользователя, матч, вердикт, его дату и ключ RUSE Guard, с которым пришла отметка. Мы также можем хранить то, что нужно для дела о читерстве, которое ещё на проверке или апелляции.
Жалобы: вы можете пожаловаться в орган по защите данных там, где вы живёте или работаете, либо там, где, по вашему мнению, произошла проблема; во Франции это CNIL (cnil.fr), в Великобритании — ICO (ico.org.uk). Любой может сначала пожаловаться нам. Если вы в Великобритании, мы подтвердим получение вашей жалобы в течение 30 дней.

ВАШЕ ПРАВО ВОЗРАЖАТЬ
Вы можете в любой момент возразить, по причинам, связанным с вашей собственной ситуацией, против использования нами ваших данных для RUSE Guard. Напишите нам по e-mail. Если мы согласимся, мы удалим ваши записи RUSE Guard, кроме отметки о читерстве и её решения (как сказано выше), и сообщим вам, что RUSE Guard обязателен для использования наших приложений: единственный способ не отправлять новых записей — не пользоваться ими. Мы можем не согласиться, если у нас есть веские основания, перевешивающие ваши, например дело о читерстве, которое ещё на проверке или апелляции.

Другие игроки
Сегодня RUSE Guard не отправляет ничего о других игроках в ваших матчах: ни имён, ни повторов. Копия с читами или тестовая копия сообщает играм других игроков только короткий код сборки. Если более поздняя версия станет отправлять записи о матчах или повторы, которые могут содержать внутриигровые имена других игроков, этот текст скажет об этом заранее. Это уведомление публично, поэтому его могут прочитать и игроки, не пользующиеся нашими приложениями. Любой может спросить нас, что мы храним под его внутриигровым именем, и права, описанные выше, принадлежат и ему.

Отслеживание
Приложения не следят за тем, что вы делаете на других сайтах или в других приложениях, и в них нет рекламных сетей или других сторонних трекеров. Приложения — не браузеры, поэтому они не читают сигнал браузера «Не отслеживать»; ваш выбор — это галочка Bug Watch и то, пользуетесь ли вы входом через Steam.

Безопасность
Приложения обращаются к нашим серверам только по зашифрованным соединениям и устанавливают обновление только если оно несёт нашу подпись (раздел 12). Адрес страницы входа Steam они составляют сами. Наш сервер RUSE Guard сообщает об отметке только Launcher самого отмеченного игрока. Ни одна система не защищена идеально: если случится что-то, что подвергнет ваши данные риску, мы сообщим об этом на нашей странице GitHub и в нашем Discord и уведомим органы по защите данных там, где этого требует закон.

Что остаётся на вашем ПК
Приложения хранят свои настройки и рабочие файлы в папке RUSE Mod Platform внутри папки AppData\\Local вашего пользователя Windows:
- ваше имя пользователя и ID установки, ваш ключ RUSE Guard, ваш выбор, пропуск Steam, если вы входили, и коды разблокировки;
- список известных вылетов игры от Bug Watch, пока Bug Watch включён;
- счётчики Bug Watch, ещё не отправленные, и отчёты, ожидающие отправки;
- записи RUSE Guard, ожидающие отправки, и те, которые наш сервер отклонил (удаляются через 30 дней после того, как были отложены);
- журналы того, что делали приложения (в них могут быть имена папок);
- собственные данные браузера окна приложения;
- загруженные файлы (установщик обновления удаляется при следующем запуске приложения после установки).
Чтобы определить, работает ли игра ещё из вашей копии с модами, приложения также смотрят, какие программы запущены и откуда (это отдельно от проверки программ RUSE Guard из раздела 6); это остаётся на вашем ПК. Когда приложения читают отчёты игры о сбоях (разделы 6 и 7), они делают это на вашем ПК и никогда их не отправляют; только собственная программа игры для отчётов о сбоях может отправить свой отчёт создателю игры (раздел 3). Ничто в этой папке не отправляется никуда, кроме как сказано в разделах 5–8 и 12. Когда вы удаляете второе из двух приложений, деинсталлятор спрашивает, удалять ли и эту папку; ответ по умолчанию — «Нет». «Да» удаляет её, кроме модов, карт, экспортов и резервных копий, которые в ней хранила более старая версия. Пока другое приложение ещё установлено, оно ничего не спрашивает и ничего не удаляет, потому что оба приложения используют эту папку. В остальных случаях, чтобы убрать её, удалите её сами. Ваши моды, карты, экспорты и резервные копии в папке RUSE 2.0 в «Документах», ваша копия с модами и чистая резервная копия вашей игры тоже остаются, пока вы их не удалите.

12. Обновления и другие сайты, к которым подключаются приложения
- Обновления: после того как вы приняли эти условия, оба приложения при каждом запуске спрашивают у GitHub, есть ли новая версия; пока вы не приняли их, они ничего не спрашивают. Если обновление вышло и ваш язык не английский, приложения также загружают его описание с GitHub. Необязательные обновления устанавливаются, когда вы нажимаете «Обновить». Обновление, которое мы помечаем как обязательное, загружается и устанавливается само при запуске приложения, без вопросов, а «Играть» и «Проверить в игре» ждут, пока оно не будет установлено. В любом случае обновление устанавливается, только если оно несёт нашу подпись и является именно тем файлом, который мы подписали; иначе ничего не устанавливается, и приложение говорит об этом и направляет вас в наш Discord. Если загрузка не удаётся три раза, приложение само прекращает попытки и направляет вас на страницу выпуска на GitHub; обязательное обновление при этом по-прежнему заставляет «Играть» и «Проверить в игре» ждать. Наш ключ подписи никогда не загружается. При следующем запуске после обновления приложение удаляет установщик этого обновления. Если вы раньше загружали юниты других эпох, Studio также проверяет наличие новых версий при запуске и загружает их само. Исправления получает только самая новая версия каждого приложения.
- Помимо наших собственных серверов, приложения подключаются к этим сайтам. Каждый видит ваш IP-адрес и то, что запрашивается, и может вести журналы на условиях своей политики конфиденциальности:
  - GitHub (Microsoft): обновления и их описания; список модов и моды из него (при первом запуске Launcher загружает список сразу после экрана с условиями); юниты других эпох; патчи игры, во время сборки, которой он нужен; и некоторые файлы движений;
  - любой другой сайт, который наш список модов может указать для мода: загрузка этого мода (Launcher сначала сверяет размер и контрольную сумму каждого файла со списком);
  - Poly Haven и ambientCG: бесплатные онлайн-текстуры Map Paint, с маленькими картинками, загружаемыми по адресам, которые дают эти сайты (ambientCG получает слова, которые вы вводите в его поиск);
  - National Map Геологической службы США: аэрофотоснимки (он получает область вокруг выбранного вами места);
  - Zenodo и публичная коллекция файлов движений на GitHub: движения в RUSE Decoy, вкладке Studio для звука и анимации;
  - наш сервер Bug Watch: список известных вылетов игры, только пока Bug Watch включён (раздел 7);
  - Steam: страница входа и собственные ссылки Steam, которые запускают Steam или проверяют файлы игры;
  - Microsoft: Edge WebView2 рисует окна приложений, а то, что он отправляет в Microsoft, определяют Windows и Microsoft, а не мы. Если в Windows нет сертификата безопасности, нужного приложениям для доступа к GitHub, приложения просят Windows его проверить, и Windows может затем загрузить его у Microsoft или у того, кто его выдал. Там, где WebView2 отсутствует, установщики (отмеченный флажок, который можно снять), приложения при запуске («Установить сейчас?») и Настройки («Установить WebView2») предлагают установщик WebView2 от Microsoft, который поставляется с приложениями; если вы согласитесь, он загрузит WebView2 у Microsoft и установит его на условиях Microsoft. Если вы откажетесь, вы будете пользоваться приложением в браузере.
- 3D-виды Studio рисуются библиотекой, которая идёт внутри Studio, поэтому для них ничего не загружается.
- Кнопки, открывающие ваш браузер: наши страницы GitHub и Discord, домашняя страница мода, загрузка WebView2 от Microsoft, blender.org и страницы благодарностей юнитов других эпох. «Сообщить о проблеме», «Add my mod» и «Открыть обращение на GitHub» открывают страницу GitHub с уже заполненными сведениями: ошибкой, которую показало приложение (с вырезанным из путей именем вашего пользователя Windows), сведениями о вашем моде или кодом вашей папки. Ваш браузер отправляет эти сведения GitHub в адресе страницы, как только она открывается; ничего не публикуется, пока вы сами этого не сделаете, а то, что вы публикуете на GitHub, публично.
- Если приложения не могут открыть собственное окно (например, в Linux через Proton), они открываются в вашем веб-браузере, и тогда ваш браузер сам загружает маленькие картинки текстур.

13. Steam и ваш аккаунт Steam
Собственные правила Steam, которые вы приняли вместе с аккаунтом Steam, ограничивают изменение игр, вмешательство в их работу и читерство в сетевой игре. Valve, а не мы, решает, как её правила применяются к R.U.S.E. Мы не знаем, сочтёт ли Valve копию с модами или её изменённые файлы игры нарушением этих правил, и ничего не можем обещать насчёт вашего аккаунта Steam. Онлайн-игра в копии с модами, тем более собранной с читерским или тестовым инструментом, — ваш выбор и на ваш собственный риск. В R.U.S.E. нет эффективного античита, поэтому RUSE Guard и нужен; сам RUSE Guard никогда ничего не делает с вашим аккаунтом Steam или установленной у вас игрой.


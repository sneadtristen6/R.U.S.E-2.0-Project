[tip_convert_mod]
us = "For an old mod that comes as the game's own files (.dat packs) to copy into the game folder: makes it a mod the library can play beside others."
fr = "Pour un ancien mod fourni sous forme de fichiers du jeu (archives .dat) à copier dans le dossier du jeu : en fait un mod que la bibliothèque peut jouer avec d'autres."
ger = "Für einen alten Mod, der als Dateien des Spiels kommt (.dat-Pakete), die man in den Spielordner kopiert: macht daraus einen Mod, den die Bibliothek neben anderen spielen kann."
ita = "Per una vecchia mod fornita come file del gioco (pacchetti .dat) da copiare nella cartella del gioco: la trasforma in una mod che la libreria può usare insieme ad altre."
spa = "Para un mod antiguo que viene como archivos del juego (paquetes .dat) para copiar en la carpeta del juego: lo convierte en un mod que la biblioteca puede jugar junto a otros."
pol = "Dla starego moda, który przychodzi jako pliki gry (paczki .dat) do skopiowania do folderu gry: robi z niego mod, który biblioteka może uruchomić razem z innymi."
ru = "Для старого мода в виде файлов самой игры (архивы .dat), которые копируют в папку игры: превращает его в мод, который библиотека может запускать вместе с другими."
cz = "Pro starý mod, který přichází jako soubory hry (balíky .dat) ke zkopírování do složky hry: udělá z něj mod, který knihovna může hrát spolu s jinými."

- کد پیوستن: Launcher به بازی مادشدهٔ شما کدی می‌دهد که نمایندهٔ نسخهٔ بازی، مادها و نسخه‌هایشان است. شما و کسانی که با آن‌ها بازی می‌کنید خودتان کدها را مقایسه می‌کنید؛ کد هرگز برای ما فرستاده نمی‌شود. نسخه‌ای که بدون RUSE Guard ساخته شده کد پیوستن ندارد، پس هم‌بازی‌هایتان نمی‌توانند بررسی کنند که شما همان بازی را دارید.
- بررسی برنامه‌ها: در حالی که یک مسابقهٔ چندنفره یا همکاری در جریان است، RUSE Guard نام برنامه‌های در حال اجرای شما را با فهرستی از ابزارهای تقلب شناخته‌شده مقایسه می‌کند و فقط نامی را گزارش می‌کند که در آن فهرست باشد؛ چیز دیگری نمی‌خواند. این بررسی بخشی از RUSE Guard است: پذیرش RUSE Guard، که برای استفاده از برنامه‌ها الزامی است، شامل آن می‌شود.
- چه چیزهایی ممکن است جمع‌آوری کند، وقتی بازی آن‌ها را فراهم کند: بررسی فایل‌های بازی که نحوهٔ بازی را تغییر می‌دهند، در مقایسه با بازیکنان دیگر؛ بررسی‌های منظم این‌که بازی همه یکسان می‌ماند؛ بازپخشی که ذخیره کرده‌اید؛ جزئیات مسابقه (نقشه، حالت، نام‌های درون‌بازی بازیکنان، نتیجه، زمان‌ها)؛ فهرست مادها و بررسی‌هایشان. امروز بازی هیچ رکوردی از مسابقه فراهم نمی‌کند، پس برای یک مسابقهٔ معمولی چیزی فرستاده نمی‌شود.
- چه چیزهایی را هرگز جمع‌آوری نمی‌کند: فایل‌ها، صفحه، کلیدهای فشرده‌شدهٔ شما، یا هر چیزی بیرون از مسابقهٔ چندنفره یا همکاری. هرگز حافظهٔ رایانهٔ شما را نمی‌خواند. وقتی بازی گزارش خرابی خودش را می‌نویسد، برنامه‌ها آن گزارش را روی رایانهٔ شما می‌خوانند: RUSE Guard فقط خط‌های نشانه‌گذاری‌شدهٔ خودش را بیرون می‌کشد (در ادامه)، و Bug Watch، اگر تیکش را زده باشید، فقط جزئیات خرابی بازی را که بخش ۶ برمی‌شمارد. خود گزارش هرگز از رایانهٔ شما خارج نمی‌شود.
- نسخهٔ تقلبی: نسخهٔ مادشده‌ای که با ابزار تقلب یا آزمایش ساخته شده فقط برای بازی آفلاین است. اگر به مسابقهٔ چندنفره یا همکاری برده شود، چند ثانیه بعد مسابقه را تسلیم می‌کند و سپس بازی را در صفحهٔ پایان مسابقه متوقف می‌کند و به دسکتاپ برمی‌گردد. آن‌گاه گزارشگر خرابی خود بازی ممکن است گزارشش را برای سازندهٔ بازی بفرستد و آن گزارش خط RUSE Guard را دارد که می‌گوید یک نسخهٔ تقلبی متوقف شد. Launcher آن خط را، با حذف هر شناسهٔ Steam، عدد طولانی یا مسیر، زیر نام کاربری شما برای ما می‌فرستد. نسخه‌های درستکار هرگز متوقف نمی‌شوند.
- هیچ مسدودسازی خودکاری در کار نیست. اگر چیزی اشتباه به نظر برسد، تیم بازبینی ما (DomesticNukes و sneadtristen6) شواهد و، اگر باشد، بازپخش را بررسی می‌کند و تصمیم می‌گیرد. می‌توانید در Discord یا GitHub ما به sneadtristen6 اعتراض کنید.
- رکوردها چقدر نگه داشته می‌شوند: رکورد یک مسابقه ۴۸ ساعت پس از آن‌که رکورد آخرین بازیکن آن مسابقه به سرور بازبینی ما رسید، به‌طور خودکار حذف می‌شود. مسابقه‌ای که بازبینی بازی دارد تا تصمیم‌گیری نگه داشته می‌شود؛ مسابقهٔ رد‌شده سپس حذف می‌شود. اگر تقلب تأیید شود، شواهد تا وقتی بازیکن می‌تواند اعتراض کند نگه داشته می‌شود؛ وقتی اعتراض تمام شد یا تیم بازبینی آن‌ها را آزاد کرد، فقط خود تصمیم نگه داشته می‌شود تا قابل اجرا باشد.
- چه اتفاقی ممکن است بیفتد: تقلب تأییدشده می‌تواند دسترسی شما به بازی چندنفره از طریق R.U.S.E. 2.0 را بگیرد. هرگز بر حساب Steam شما یا خود بازی اثر نمی‌گذارد.
- برای کنار گذاشتن: RUSE Guard برای استفاده از برنامه‌ها الزامی است؛ برای کنار کشیدن از آن، استفاده از برنامه‌ها را متوقف کنید.

۶. Bug Watch: به ما کمک کنید اشکال‌ها را پیدا و برطرف کنیم (اختیاری، توصیه‌شده)
چرا: تا Studio و Launcher برای شما بهتر کار کنند و توسعه آسان‌تر شود. به جای این‌که منتظر بمانیم کسی خرابی‌ای را گزارش کند، آن را می‌بینیم، می‌بینیم چه چیزی به آن انجامیده و زودتر برطرفش می‌کنیم.
اگر تیک این را بزنید، Studio و Launcher می‌شمارند از چه چیزی استفاده می‌کنید و کِی چیزی خراب می‌شود و روزی یک بار آن را برای توسعه‌دهندگان ما می‌فرستند. تنظیمات کلمه به کلمه نشانتان می‌دهد چه چیزی فرستاده خواهد شد. به زبان ساده، این‌ها هستند:
- یک کد گزارش که بار اول روی رایانهٔ شما ساخته می‌شود (تا خرابی‌های شما کنار هم پیدا شوند)، و نام کاربری شما؛
- برنامه و نسخه‌اش، روز، نسخهٔ Windows شما، زبان شما، بیلد بازی، این‌که RUSE Guard روشن است یا نه، و این‌که کدام نسخهٔ این توافق‌نامه را پذیرفته‌اید؛
- هر بخش برنامه چند بار استفاده شده و کارها چقدر طول کشیده‌اند، چه چیزی و کجا خراب شده (فقط در کد خود ما)، کدام مادهای فهرست ما را روشن داشته‌اید و با هر یک چند دقیقه بازی کرده‌اید، و چند ماد از خودتان داشته‌اید و چه نوع چیزهایی در آن‌هاست، مثل یگان‌ها، نقشه‌ها، مأموریت‌ها یا اسکریپت‌ها (به تفکیک نوع شمرده می‌شود، هرگز نامشان نمی‌آید و هرگز واژه‌ها، مسیرها یا فایل‌هایشان فرستاده نمی‌شود)؛
- وقتی برنامه‌ای از کار می‌افتد: نوع خطا و جای آن در کد ما؛ وقتی بازی از کار می‌افتد: کد خرابی‌اش، جایی از بازی که متوقف شده و تا ۱۶ جای بازی که به آن انجامیده‌اند، جایی از حافظه که می‌خواست بخواند، بنویسد یا اجرا کند، متن خطای خود بازی با مسیرهای فایل کوتاه‌شده، نقشه‌ای که در آن بود (نقشه‌های خود بازی با نامشان؛ نقشه‌ای که یک ماد ساخته فقط به صورت «نقشهٔ یک ماد»، هرگز با نامش)، یگانی که بازی در حال ساختنش بود (یگان‌های خود بازی با شماره‌شان؛ یگانی که یک ماد افزوده فقط به صورت «یگان یک ماد»)، و مادهایی که روشن بوده‌اند. برنامه‌ها یگان را فقط وقتی می‌فرستند که بتوانند آن را از گزارش خرابی بازی بخوانند.
فقط توسعه‌دهندگان ما آن را می‌بینند: روی سرور ما و، به محض ساخته شدن، در مخزن خصوصی‌ای نگه داشته می‌شود که فقط توسعه‌دهندگان ما می‌توانند بازش کنند. هرگز فرستاده نمی‌شود: نام واقعی شما، حساب Steam شما، فایل‌ها یا مسیرهای شما، یا نام‌ها و واژه‌های مادهای خودتان؛ فایل‌های خرابی بازی هرگز از رایانهٔ شما خارج نمی‌شوند. شمارش‌ها و گزارش‌های خرابی شما پس از ۷ روز حذف می‌شوند؛ فقط یک خرابی بسیار جدی که هنوز در حال برطرف کردنش هستیم بیشتر نگه داشته می‌شود، تا وقتی برطرف شود، و پس از آن فقط جمع‌هایی بدون نام و کد نگه می‌داریم (مثل «آن روز ۱۲ ساخت روی نسخهٔ 0.9.9 ناموفق بود»). تا وقتی تیکش نزنید خاموش است. هر وقت خواستید در تنظیمات تیکش را بردارید: دیگر چیزی شمرده یا فرستاده نمی‌شود و آنچه نگه داشته شده بود حذف می‌شود. برای این‌که هر چه زیر کد گزارش شما نگه داشته شده همین حالا حذف شود، در Discord یا GitHub ما درخواست کنید.

۷. ورود با Steam
چرا: برای تأیید این‌که R.U.S.E. را دارید؛ برای بازی آنلاین، RUSE Guard و دانلود محتوا. فعلاً هیچ چیزی به آن نیاز ندارد؛ برنامه‌ها یک بار می‌پرسند و تنظیمات Launcher هر وقت بخواهید آن را باز می‌کند.
- شما در صفحهٔ خود Steam در مرورگرتان وارد می‌شوید. ما هرگز رمز عبور شما را نمی‌بینیم.
- Steam فقط یک چیز به سرور ما می‌گوید: این‌که حساب شما R.U.S.E. را دارد یا نه. اگر دارد، سرور ما یک گذرنامهٔ امضاشده به رایانهٔ شما می‌دهد که ۳۰ روز اعتبار دارد.
- سرور ما چه چیزی نگه می‌دارد: یک کد یک‌طرفه که از حساب Steam شما با رازی از ما ساخته شده، و این‌که گذرنامه کِی صادر شده و کِی منقضی می‌شود. هرگز شناسهٔ Steam یا نشانی IP شما را نگه نمی‌دارد. خود کد ورود به شکل هش‌شده ده دقیقه نگه داشته می‌شود و شماره‌های یک‌بارمصرف ورود Steam یک روز، تا یک ورود دوباره قابل استفاده نباشد.
- رایانهٔ شما چه چیزی نگه می‌دارد: گذرنامه را، در تنظیمات برنامه‌ها. تنظیمات می‌تواند شما را خارج کند که گذرنامه را حذف می‌کند؛ برای حذف رکورد ورودتان روی سرور، در Discord یا GitHub ما درخواست کنید.
- اگر فهرست بازی‌های نمایهٔ Steam شما خصوصی باشد، Steam نمی‌تواند به ما بگوید؛ جزئیات بازی‌ها را یک دقیقه روی عمومی بگذارید یا کد بازگشایی بخواهید.

۸. نام کاربری شما
چرا: تا بدانیم هر خرابی یا مسابقه مال کیست و بتوانیم به آن شخص کمک کنیم. در اولین اجرا یک نام کاربری انتخاب می‌کنید (عدد کوتاهی به آن اضافه می‌شود، مثل Nick#4821)، چون RUSE Guard برای همه الزامی است. فقط همراه چیزهایی فرستاده می‌شود که به شما مربوط است: رکوردهای مسابقه‌های RUSE Guard شما و، اگر تیک Bug Watch را زده باشید، شمارش‌های Bug Watch شما. یک نام کاربری برای Studio و Launcher کار می‌کند و می‌توانید آن را در تنظیمات تغییر دهید. برای حذف نام کاربری و داده‌هایتان، در Discord یا GitHub ما درخواست کنید.

۹. بدون ضمانت
برنامه‌ها رایگان‌اند و همان‌طور که هستند، بدون هیچ ضمانتی، عرضه می‌شوند (GPL v3، بخش‌های ۱۵ و ۱۶). آن‌ها نسخه‌های مادشده‌ای از بازی می‌سازند و بازی نصب‌شدهٔ شما را دست‌نخورده می‌گذارند. ما مسئول بازی، حساب Steam شما یا هیچ زیانی ناشی از استفاده از برنامه‌ها نیستیم.

۱۰. تغییرات
وقتی این توافق‌نامه تغییر کند، برنامه‌ها پیش از ادامه دوباره آن را نشان می‌دهند.

۱۱. تماس
پرسش‌ها، گزارش اشکال‌ها و اعتراض‌ها: در Discord ما (کانال درخواست ماد، یا کانال آزمایش‌ها / کارهای در دست انجام) یا در GitHub. مشکلات امنیتی: به‌طور خصوصی، همان‌طور که سیاست امنیتی ما می‌گوید.


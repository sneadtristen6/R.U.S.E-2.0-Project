3. Les licences que nous utilisons, et les crédits
- Nos applications sont libres et open source sous la GNU General Public License version 3 (GPL v3). Vous pouvez les utiliser, les étudier, les modifier et les partager. Si vous les partagez, ou une version modifiée, gardez-les sous GPL v3, gardez chaque crédit et proposez-en le code source.
- Le travail d'autres personnes dans nos applications : le moteur RUSE Mod Manager de LittleGroove (GPL v3), le travail de ProLution et la conception de RUSE Guard par DomesticNukes, chacun crédité dans les Crédits des applications et sur la page du projet.
- Modèles 3D, sons et textures : ceux sous CC BY doivent créditer leur auteur, comme le fait notre page Crédits ; si vous en réutilisez un dans votre propre mod, créditez-le de la même façon. Ceux sous CC0 n'exigent aucun crédit, mais nous les créditons quand même, et nous vous demandons d'en faire autant.

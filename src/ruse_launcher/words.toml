- Bug Watch : des comptages de ce que vous utilisez et de ce qui tourne mal, envoyés à nos développeurs pour corriger plantages et bugs plus vite. Désactivé sauf si vous le cochez (recommandé).
- Connexion via Steam : une connexion sur la page de Steam qui confirme que vous possédez R.U.S.E., pour le jeu en ligne, RUSE Guard et les téléchargements de contenu. Quand vous le voulez ; rien ne l'exige encore.
- Votre nom d'utilisateur : un nom que vous choisissez, pour que nous sachions de qui est tel plantage ou telle partie. Tout le monde en choisit un, parce que RUSE Guard est obligatoire.

1. Ce que cela couvre
RUSE Studio, RUSE Launcher et nos services en ligne : la liste des mods, le serveur RUSE Guard, le serveur Bug Watch avec son dépôt privé, et le serveur de connexion Steam. Cet accord est conclu entre vous et le projet R.U.S.E. 2.0 (sneadtristen6, sur GitHub et sur notre Discord).

2. Qui nous sommes, et qui nous ne sommes pas

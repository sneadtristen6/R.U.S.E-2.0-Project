Niektórych praw nie może odebrać żadna umowa, na przykład twoich praw jako konsumenta w UE lub Wielkiej Brytanii ani twojego prawa do wniesienia sprawy do sądu tam, gdzie mieszkasz, jeśli to prawo na to pozwala. Nic tutaj nie odbiera tych praw. Jeśli sąd uzna, że część tej umowy nie może być egzekwowana, reszta nadal obowiązuje.


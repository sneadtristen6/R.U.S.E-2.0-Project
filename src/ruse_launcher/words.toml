[set_bugwatch_help]
us = "Recommended: it helps us fix crashes and bugs faster. When it's on, the Studio and the Launcher count what you use and when something goes wrong, including the game's crashes and which mods were on, and send it to our developers once a day with the username you choose. No real names, no Steam account, no files. It's off unless you tick it, and you can untick it any time."
fr = "Recommandé : il nous aide à corriger plus vite les plantages et les bugs. Quand il est activé, le Studio et le Launcher comptent ce que vous utilisez et quand quelque chose échoue, y compris les plantages du jeu et les mods qui étaient actifs, et l'envoient à nos développeurs une fois par jour avec le nom d'utilisateur que vous choisissez. Pas de vrai nom, pas de compte Steam, aucun fichier. Il reste désactivé tant que vous ne le cochez pas, et vous pouvez le décocher à tout moment."
ger = "Empfohlen: Es hilft uns, Abstürze und Fehler schneller zu beheben. Wenn es an ist, zählen das Studio und der Launcher, was du benutzt und wann etwas schiefgeht, auch die Abstürze des Spiels und welche Mods an waren, und schicken es einmal am Tag mit dem Benutzernamen, den du wählst, an unsere Entwickler. Keine echten Namen, kein Steam-Konto, keine Dateien. Es ist aus, bis du das Häkchen setzt, und du kannst es jederzeit wieder wegnehmen."
ita = "Consigliato: ci aiuta a correggere più in fretta crash e bug. Quando è attivo, lo Studio e il Launcher contano cosa usi e quando qualcosa va storto, compresi i crash del gioco e le mod attive, e lo inviano ai nostri sviluppatori una volta al giorno con il nome utente che scegli. Niente nomi veri, niente account Steam, nessun file. Resta spento finché non lo spunti, e puoi togliere la spunta quando vuoi."
spa = "Recomendado: nos ayuda a arreglar antes los cierres y los errores. Cuando está activado, el Studio y el Launcher cuentan lo que usas y cuándo algo falla, incluidos los cierres del juego y qué mods estaban activos, y lo envían a nuestros desarrolladores una vez al día con el nombre de usuario que elijas. Sin nombres reales, sin cuenta de Steam, sin archivos. Está desactivado hasta que lo marques, y puedes desmarcarlo cuando quieras."
pol = "Zalecane: pomaga nam szybciej naprawiać awarie i błędy. Gdy jest włączone, Studio i Launcher liczą, czego używasz i kiedy coś się nie udaje, w tym awarie gry i to, jakie mody były włączone, i raz dziennie wysyłają to naszym programistom z wybraną przez ciebie nazwą użytkownika. Bez prawdziwych nazwisk, bez konta Steam, bez plików. Jest wyłączone, dopóki tego nie zaznaczysz, i możesz to odznaczyć w każdej chwili."
ru = "Рекомендуется: это помогает нам быстрее исправлять вылеты и ошибки. Когда он включён, Studio и Launcher считают, чем вы пользуетесь и когда что-то идёт не так, включая вылеты игры и то, какие моды были включены, и раз в день отправляют это нашим разработчикам вместе с выбранным вами именем пользователя. Никаких настоящих имён, никакого аккаунта Steam, никаких файлов. Он выключен, пока вы не поставите галочку, и её можно снять в любой момент."
cz = "Doporučeno: pomáhá nám rychleji opravovat pády a chyby. Když je zapnutý, Studio a Launcher počítají, co používáte a kdy se něco pokazí, včetně pádů hry a toho, jaké módy byly zapnuté, a jednou denně to posílají našim vývojářům s uživatelským jménem, které si zvolíte. Žádná skutečná jména, žádný účet Steam, žádné soubory. Je vypnutý, dokud ho nezaškrtnete, a zaškrtnutí můžete kdykoli zrušit."
jpn = "おすすめ：クラッシュや不具合をより早く直すのに役立ちます。オンにすると、Studio と Launcher が、あなたが使った機能や失敗したときのこと（ゲームのクラッシュと、そのとき入っていた MOD を含む）を数え、あなたが選んだユーザー名とともに 1 日 1 回、開発者に送ります。本名、Steam アカウント、ファイルは送りません。チェックを入れるまではオフで、いつでもチェックを外せます。"
sc = "推荐：它能帮助我们更快修复崩溃和错误。开启后，Studio 和 Launcher 会统计你使用了什么、什么时候出了问题，包括游戏的崩溃以及当时启用了哪些模组，并每天一次连同你选择的用户名发送给我们的开发者。不含真实姓名、Steam 账号或任何文件。在你勾选之前它是关闭的，你也可以随时取消勾选。"
fa = "توصیه‌شده: کمک می‌کند خرابی‌ها و باگ‌ها را زودتر درست کنیم. وقتی روشن است، استودیو و لانچر می‌شمارند چه چیزهایی را به کار می‌برید و کی چیزی خراب می‌شود، از جمله خرابی‌های بازی و این‌که کدام مادها روشن بوده‌اند، و روزی یک بار آن را با نام کاربری‌ای که انتخاب می‌کنید برای برنامه‌نویسان ما می‌فرستند. بدون نام واقعی، بدون حساب Steam، بدون فایل. تا تیکش را نزنید خاموش است و هر وقت بخواهید می‌توانید تیکش را بردارید."


<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RUSE Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">RUSE <span>Launcher</span></div>
    <div id="status" class="status" role="status"></div>
    <button id="choose" class="small hidden" type="button"></button>
    <button id="settings-open" class="small ghost" type="button"></button>
  </header>
  <div id="update-bar" class="update-bar hidden" role="status"><span id="update-text"></span>
    <button id="update-now" class="small" type="button"></button>
    <button id="update-info" class="small ghost" type="button"></button></div>

  <main class="layout">
    <aside class="side">
      <section class="sets" aria-labelledby="sets-title">
        <h2 id="sets-title"></h2>
        <ul id="set-list" class="set-list"></ul>
        <button id="new-set" class="small" type="button"></button>
        <button id="import-set" class="small ghost" type="button"></button>
      </section>
      <section class="library" aria-labelledby="library-title">
        <h2 id="library-title"></h2>
        <ul id="mod-list" class="mod-list"></ul>
        <p id="library-empty" class="muted note hidden"></p>
        <button id="add-mod" class="small" type="button"></button>
        <p id="drop-hint" class="muted note"></p>
      </section>
    </aside>

    <section class="active" aria-live="polite">
      <div id="set-view">
        <div class="set-head">
          <h1 id="active-name"></h1>
          <div id="set-actions" class="set-actions"></div>
        </div>
        <p id="active-description" class="muted"></p>
        <div id="guide" class="guide hidden">
          <h2 id="guide-title"></h2>
          <ol><li id="guide-add"></li><li id="guide-set"></li><li id="guide-play"></li></ol>
        </div>
        <div id="share-box" class="share hidden">
          <h2 id="share-title"></h2>
          <p id="share-help" class="muted"></p>
          <textarea id="share-text" rows="8" readonly spellcheck="false"></textarea>
          <div class="actions">
            <button id="share-copy" class="small" type="button"></button>
            <button id="share-close" class="small ghost" type="button"></button>
            <span id="share-note" class="muted"></span>
          </div>
        </div>
        <ol id="active-mods" class="mods"></ol>
        <p id="active-error" class="error hidden"></p>
        <div id="active-clashes" class="clashes"></div>
        <button id="play" class="play" type="button"></button>
        <p id="play-message" class="message"></p>
        <details id="progress" class="progress hidden">
          <summary id="details"></summary>
          <pre id="log"></pre>
        </details>
      </div>
      <form id="editor" class="editor hidden"></form>
      <div id="import-view" class="editor hidden">
        <h1 id="import-title"></h1>
        <p id="import-help" class="muted"></p>
        <textarea id="import-text" rows="9" spellcheck="false"></textarea>
        <div class="actions">
          <button id="import-check" class="small" type="button"></button>
          <button id="import-cancel" class="small ghost" type="button"></button>
        </div>
        <div id="import-result"></div>
      </div>
      <!-- Settings (app.js SETTINGS: one section per setting, so a new one is one more entry) -->
      <div id="settings-view" class="browse hidden">
        <div class="set-head">
          <h1 id="settings-title"></h1>
          <div class="set-actions"><button id="settings-back" class="small ghost" type="button"></button></div>
        </div>
        <section class="setting" id="set-language">
          <h2 id="set-language-title"></h2>
          <label class="lang"><span id="lang-label" class="sr-only"></span><select id="lang"></select></label>
        </section>
        <section class="setting" id="set-game">
          <h2 id="set-game-title"></h2><p id="set-game-path" class="small"></p>
          <div class="actions"><button id="set-game-change" type="button" class="small"></button></div>
        </section>
        <section class="setting" id="set-updates">
          <h2 id="set-updates-title"></h2><p id="set-updates-text" class="small"></p>
          <div class="actions"><button id="set-updates-check" type="button" class="small"></button></div>
        </section>
      </div>
      <div id="browse-view" class="browse hidden">
        <div class="set-head">
          <h1 id="browse-title"></h1>
          <div class="set-actions">
            <input id="browse-search" type="search" autocomplete="off">
            <button id="browse-refresh" class="small ghost" type="button"></button>
            <button id="browse-back" class="small ghost" type="button"></button>
          </div>
        </div>
        <p id="browse-help" class="muted"></p>
        <p id="browse-note" class="muted note hidden"></p>
        <ul id="browse-list" class="browse-list"></ul>
        <p id="browse-message" class="message"></p>
      </div>
    </section>
  </main>

  <footer class="bottom">
    <button id="join" class="small ghost" type="button" disabled></button>
    <button id="browse" class="small ghost" type="button"></button>
    <span class="bottom-gap"></span>
    <!-- the wiki and a bug report (rusemod.community): the launcher only opens pages, it sends nothing -->
    <button id="help" class="small ghost" type="button"></button>
    <button id="report" class="small ghost" type="button"></button>
  </footer>

  <div id="drop-zone" class="drop-zone hidden"><span id="drop-text"></span></div>

  <script src="fake-api.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RUSE Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="logo.png" alt="" width="34" height="34">RUSE <span>Launcher</span>
      <small id="app-version" class="app-version"></small></div>
    <div id="status" class="status" role="status"></div>
    <button id="choose" class="small hidden" type="button"></button>
    <!-- the language, always in sight (it used to hide in Settings): opens "Choose your language" -->
    <button id="lang-open" class="small ghost lang-open" type="button"><svg viewBox="0 0 24 24" width="16" height="16"
      aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg><span id="lang-name"></span></button>
    <button id="settings-open" class="small ghost" type="button"></button>
  </header>
  <!-- "Choose your language" (rusemod.uilang): opens by itself until the player picks one, then from the button -->
  <div id="lang-pick" class="lang-pick hidden" role="dialog" aria-modal="true" aria-labelledby="lang-pick-title">
    <div class="lang-pick-box">
      <button id="lang-pick-close" class="lang-pick-close ghost small" type="button">×</button>
      <h1 id="lang-pick-title"></h1>
      <p id="lang-pick-all" class="lang-pick-all"></p>
      <div id="lang-pick-list" class="lang-pick-list"></div>
      <p id="lang-pick-help" class="muted small"></p>
    </div>
  </div>
  <div id="update-bar" class="update-bar hidden" role="status"><span id="update-text"></span>
    <button id="update-now" class="small" type="button"></button>
    <button id="update-info" class="small ghost" type="button"></button></div>
  <!-- what changes from the running version to the new one (rusemod.update.changes_since), opened from the bar -->
  <div id="update-changes" class="update-changes hidden"></div>

  <main class="layout">
    <aside id="side" class="side tabbed show-sets">
      <div class="side-tabs" role="group">
        <button id="side-sets" type="button" aria-pressed="true"></button>
        <button id="side-library" type="button" aria-pressed="false"></button>
      </div>
      <section class="sets" aria-labelledby="sets-title">
        <h2 id="sets-title"></h2>
        <ul id="set-list" class="set-list"></ul>
        <div class="set-buttons">
          <button id="new-set" class="small" type="button"></button>
          <button id="import-set" class="small ghost" type="button"></button>
        </div>
      </section>
      <section class="library" aria-labelledby="library-title">
        <div class="library-head"><h2 id="library-title"></h2><span id="library-count" class="muted"></span></div>
        <input id="library-search" class="library-search hidden" type="search" spellcheck="false">
        <ul id="mod-list" class="mod-list"></ul>
        <p id="library-empty" class="muted note hidden"></p>
        <div class="library-foot">
          <button id="add-mod" class="small" type="button"></button>
          <button id="convert-mod" class="small ghost" type="button"></button>
          <p id="drop-hint" class="muted note"></p>
        </div>
      </section>
    </aside>

    <section class="active" aria-live="polite">
      <div id="set-view">
        <div class="set-head">
          <h1 id="active-name"></h1>
          <div id="set-actions" class="set-actions"></div>
        </div>
        <p id="active-description" class="muted"></p>
        <div id="guide" class="guide hidden">
          <h2 id="guide-title"></h2>
          <ol><li id="guide-add"></li><li id="guide-set"></li><li id="guide-play"></li></ol>
        </div>
        <div id="share-box" class="share hidden">
          <h2 id="share-title"></h2>
          <p id="share-help" class="muted"></p>
          <textarea id="share-text" rows="8" readonly spellcheck="false"></textarea>
          <div class="actions">
            <button id="share-copy" class="small" type="button"></button>
            <button id="share-close" class="small ghost" type="button"></button>
            <span id="share-note" class="muted"></span>
          </div>
        </div>
        <ol id="active-mods" class="mods"></ol>
        <p id="active-error" class="error hidden"></p>
        <div id="active-clashes" class="clashes"></div>
        <button id="play" class="play" type="button"></button>
        <p id="play-message" class="message"></p>
        <details id="progress" class="progress hidden">
          <summary id="details"></summary>
          <pre id="log"></pre>
        </details>
      </div>
      <form id="editor" class="editor hidden"></form>
      <div id="import-view" class="editor hidden">
        <h1 id="import-title"></h1>
        <p id="import-help" class="muted"></p>
        <textarea id="import-text" rows="9" spellcheck="false"></textarea>
        <div class="actions">
          <button id="import-check" class="small" type="button"></button>
          <button id="import-cancel" class="small ghost" type="button"></button>
        </div>
        <div id="import-result"></div>
      </div>
      <!-- Convert an old mod (app.js renderConvert, LauncherApi.convert_*): LittleGroove's Convert tab -->
      <div id="convert-view" class="editor hidden">
        <h1 id="convert-title"></h1>
        <p id="convert-help" class="muted"></p>
        <div class="actions">
          <button id="convert-pick" class="small" type="button"></button>
          <button id="convert-cancel" class="small ghost" type="button"></button>
        </div>
        <div id="convert-result"></div>
      </div>
      <!-- Settings (app.js SETTINGS: one section per setting, so a new one is one more entry) -->
      <div id="settings-view" class="browse hidden">
        <div class="set-head">
          <h1 id="settings-title"></h1>
          <div class="set-actions"><button id="settings-back" class="small ghost" type="button"></button></div>
        </div>
        <section class="setting" id="set-game">
          <h2 id="set-game-title"></h2><p id="set-game-path" class="small"></p>
          <div class="actions"><button id="set-game-change" type="button" class="small"></button></div>
        </section>
        <!-- the clean game backup (rusemod.backup, app.js renderBackup): the only way the launcher writes into the
             game's own folder, and only when the player asks for a restore -->
        <section class="setting" id="set-backup">
          <h2 id="set-backup-title"></h2><p id="set-backup-help" class="muted"></p>
          <p id="backup-status"></p>
          <div class="actions">
            <button id="backup-make" type="button" class="small"></button>
            <button id="backup-check" type="button" class="small"></button>
            <button id="backup-restore" type="button" class="small"></button>
            <button id="backup-verify" type="button" class="small ghost"></button>
          </div>
          <label class="check-row"><input id="backup-deep" type="checkbox"> <span id="backup-deep-label"></span></label>
          <div id="backup-ask"></div>
          <p id="backup-note" class="message" role="status"></p>
          <div id="backup-files" class="backup-files"></div>
        </section>
        <section class="setting" id="set-updates">
          <h2 id="set-updates-title"></h2><p id="set-updates-text" class="small"></p>
          <div class="actions"><button id="set-updates-check" type="button" class="small"></button></div>
        </section>
      </div>
      <div id="browse-view" class="browse hidden">
        <div class="set-head">
          <h1 id="browse-title"></h1>
          <div class="set-actions">
            <input id="browse-search" type="search" autocomplete="off">
            <button id="browse-refresh" class="small ghost" type="button"></button>
            <button id="browse-back" class="small ghost" type="button"></button>
          </div>
        </div>
        <p class="muted"><span id="browse-help"></span> <button id="browse-page" class="link" type="button"></button></p>
        <p id="browse-note" class="muted note hidden"></p>
        <!-- the supported mods with tick boxes, then the cheats and test tools (tag "cheat") in their own group -->
        <div id="browse-list"></div>
        <div class="actions"><button id="browse-install" class="small" type="button" disabled></button></div>
        <p id="browse-message" class="message"></p>
      </div>
      <!-- the first run (no library yet): "Choose your mods", everything ticked but the cheats; Install or Skip -->
      <div id="welcome-view" class="browse hidden">
        <h1 id="welcome-title"></h1>
        <p class="muted"><span id="welcome-help"></span> <button id="welcome-page" class="link" type="button"></button></p>
        <p id="welcome-note" class="muted note hidden"></p>
        <div id="welcome-list"></div>
        <div class="actions">
          <button id="welcome-install" class="small" type="button" disabled></button>
          <button id="welcome-skip" class="small ghost" type="button"></button>
        </div>
        <p id="welcome-message" class="message"></p>
      </div>
    </section>
  </main>

  <footer class="bottom">
    <button id="join" class="small ghost" type="button" disabled></button>
    <button id="browse" class="small ghost" type="button"></button>
    <span class="bottom-gap"></span>
    <!-- the troubleshooter (rusemod.doctor), the wiki and a bug report (rusemod.community): the launcher only opens
         pages, it sends nothing -->
    <button id="doc-open" class="small ghost" type="button"></button>
    <button id="help" class="small ghost" type="button"></button>
    <button id="report" class="small ghost" type="button"></button>
  </footer>

  <div id="drop-zone" class="drop-zone hidden"><span id="drop-text"></span></div>

  <!-- the troubleshooter: what can stop Play, checked in one go (app.js openDoctor, api.troubleshoot) -->
  <dialog id="doc" class="doc" aria-labelledby="doc-title">
    <h2 id="doc-title"></h2>
    <p id="doc-intro" class="muted"></p>
    <ul id="doc-list" class="doc-list"></ul>
    <p id="doc-note" class="message" role="status"></p>
    <textarea id="doc-report" class="hidden" rows="7" readonly spellcheck="false"></textarea>
    <div class="actions">
      <button id="doc-again" class="small" type="button"></button>
      <button id="doc-copy" class="small ghost" type="button"></button>
      <button id="doc-close" class="small ghost" type="button"></button>
    </div>
  </dialog>

  <script src="fake-api.js"></script>
  <script src="app.js"></script>
</body>
</html>

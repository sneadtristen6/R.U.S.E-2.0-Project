# The Launcher's refusals in the apps' eleven languages (ruse_launcher/errortext.py): its own (LauncherError) and those
# it passes on as they came (the library's, a mod file's, the mod list's, a join code's). Each entry is one refusal as
# the code says it, in English (us), its values as numbered blanks {0}, {1}...; the other languages keep every blank.
# The entry's name comes from its English words (wordedtext.key_of). An entry with "within" says the blank of those
# frames only (why a download failed, inside the mod list's refusals). tests/test_launcher_errortext.py checks that
# every such refusal in the code has an entry here with all eleven languages and the same blanks.
# Starter translations: corrections welcome.

